<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经济学原理·宏观经济学分册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>

const DATA = {"manifest": {"slug": "macroeconomics", "title": "经济学原理·宏观经济学分册", "subtitle": "长期看生产能力，短期看需求管理", "book": {"title": "经济学原理（第 7 版）宏观经济学分册", "author": "N. 格里高利·曼昆（梁小民、梁砾 译）", "source": ["经济学原理 宏观经济学分册 (第7版).pdf（396 页扫描版）"]}, "audience": "理工科本科（已掌握微积分与基本概率）", "goal": "系统掌握宏观经济学：能测量与解释增长、通胀、失业，并在长期与短期两套框架下判断政策", "learningPath": [{"step": "01", "title": "测量：GDP 与物价", "chapterIds": ["ch23", "ch24"], "checkpoint": "能算平减指数、CPI、实际利率"}, {"step": "02", "title": "长期增长与生产率", "chapterIds": ["ch25"], "checkpoint": "能用 70 法则与四项因素解释增长差异"}, {"step": "03", "title": "储蓄、投资与金融", "chapterIds": ["ch26", "ch27"], "checkpoint": "能画可贷资金市场并算现值"}, {"step": "04", "title": "失业的结构", "chapterIds": ["ch28"], "checkpoint": "能区分三类失业并给出对策"}, {"step": "05", "title": "货币、银行与通胀", "chapterIds": ["ch29", "ch30"], "checkpoint": "能算货币乘数并用 MV = PY 解释通胀"}, {"step": "06", "title": "开放经济", "chapterIds": ["ch31", "ch32"], "checkpoint": "能用 NX = S − I 与两市场模型推演政策"}, {"step": "07", "title": "AD-AS 与政策工具", "chapterIds": ["ch33", "ch34"], "checkpoint": "能画需求冲击的短长期结果、算乘数"}, {"step": "08", "title": "权衡与争论", "chapterIds": ["ch35", "ch36"], "checkpoint": "能解释长期曲线垂直、说出六场争论的正反方"}], "chapters": [{"id": "ch23", "title": "第 23 章：一国收入的衡量", "file": "chapters/ch23-一国收入的衡量.md", "difficulty": 2}, {"id": "ch24", "title": "第 24 章：生活费用的衡量", "file": "chapters/ch24-生活费用的衡量.md", "difficulty": 2}, {"id": "ch25", "title": "第 25 章：生产与增长", "file": "chapters/ch25-生产与增长.md", "difficulty": 2}, {"id": "ch26", "title": "第 26 章：储蓄、投资和金融体系", "file": "chapters/ch26-储蓄投资和金融体系.md", "difficulty": 3}, {"id": "ch27", "title": "第 27 章：金融学的基本工具", "file": "chapters/ch27-金融学的基本工具.md", "difficulty": 3}, {"id": "ch28", "title": "第 28 章：失业", "file": "chapters/ch28-失业.md", "difficulty": 2}, {"id": "ch29", "title": "第 29 章：货币制度", "file": "chapters/ch29-货币制度.md", "difficulty": 3}, {"id": "ch30", "title": "第 30 章：货币增长与通货膨胀", "file": "chapters/ch30-货币增长与通货膨胀.md", "difficulty": 3}, {"id": "ch31", "title": "第 31 章：开放经济的基本概念", "file": "chapters/ch31-开放经济的基本概念.md", "difficulty": 2}, {"id": "ch32", "title": "第 32 章：开放经济的宏观经济理论", "file": "chapters/ch32-开放经济的宏观经济理论.md", "difficulty": 3}, {"id": "ch33", "title": "第 33 章：总需求与总供给", "file": "chapters/ch33-总需求与总供给.md", "difficulty": 3}, {"id": "ch34", "title": "第 34 章：货币政策和财政政策对总需求的影响", "file": "chapters/ch34-货币政策和财政政策对总需求的影响.md", "difficulty": 3}, {"id": "ch35", "title": "第 35 章：通货膨胀与失业之间的短期权衡取舍", "file": "chapters/ch35-通货膨胀与失业之间的短期权衡取舍.md", "difficulty": 3}, {"id": "ch36", "title": "第 36 章：宏观经济政策的六个争论问题", "file": "chapters/ch36-宏观经济政策的六个争论问题.md", "difficulty": 3}], "concepts": [{"id": "m01", "title": "GDP 与长期增长", "file": "concepts/gdp-growth.md", "chapterIds": ["ch23", "ch25"]}, {"id": "m02", "title": "通货膨胀", "file": "concepts/inflation.md", "chapterIds": ["ch24", "ch29", "ch30", "ch35"]}, {"id": "m03", "title": "货币与银行体系", "file": "concepts/money-banking.md", "chapterIds": ["ch29", "ch30", "ch34"]}, {"id": "m04", "title": "利率与可贷资金", "file": "concepts/loanable-funds.md", "chapterIds": ["ch26", "ch27", "ch32"]}, {"id": "m05", "title": "总需求与总供给", "file": "concepts/ad-as.md", "chapterIds": ["ch33", "ch34", "ch35"]}, {"id": "m06", "title": "菲利普斯曲线", "file": "concepts/phillips-curve.md", "chapterIds": ["ch35", "ch36"]}, {"id": "m07", "title": "开放经济", "file": "concepts/open-economy.md", "chapterIds": ["ch31", "ch32"]}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "companion": "macroeconomics学习伴侣.html", "quizzes": [{"type": "single", "question": "下列哪一项计入当年的 GDP？", "options": ["二手车的转手价格", "政府发放的失业救济金", "新建住宅的建造价值", "购买某公司股票"], "answer": 2, "explain": "新建住宅属于投资（I），计入 GDP。二手车只计中介佣金，救济金是转移支付，买股票是资产换手，都不计入。", "id": "q01", "chapterId": "ch23"}, {"type": "single", "question": "某国名义 GDP 为 550 亿元，按基年价格计算的实际 GDP 为 385 亿元。GDP 平减指数约为？", "options": ["100", "130", "142.9", "165"], "answer": 2, "explain": "平减指数 = 名义 ÷ 实际 × 100 = 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高约 43%。", "id": "q02", "chapterId": "ch23"}, {"type": "single", "question": "支出法下，进口消费品为什么要从总支出中减去？", "options": ["因为进口品价格更高", "因为它已被计入消费但并非本国生产", "因为进口要交关税", "因为进口品不计入统计口径"], "answer": 1, "explain": "消费者买进口货时这笔钱算在 C 里，但它不是本国生产的，所以通过 NX = 出口 − 进口 把它扣除。", "id": "q03", "chapterId": "ch23"}, {"type": "multi", "question": "GDP 无法反映下列哪些内容？", "options": ["家务劳动的价值", "收入分配状况", "环境破坏的成本", "产品的质量改进"], "answer": [0, 1, 2, 3], "explain": "GDP 只统计有市场价格的最终产品，不反映分配、环境、家务与质量变化，因此不能等同于福利。", "id": "q04", "chapterId": "ch23"}, {"type": "single", "question": "篮子为 4 个苹果与 2 条面包。基年成本 14 元，当期成本 20 元。CPI 约为？", "options": ["120", "135", "142.9", "150"], "answer": 2, "explain": "CPI = 20 ÷ 14 × 100 ≈ 142.9，表示价格水平比基年高约 42.9%。", "id": "q01", "chapterId": "ch24"}, {"type": "single", "question": "CPI 与 GDP 平减指数最重要的差别是？", "options": ["CPI 只统计消费品，平减指数覆盖全部国内生产", "CPI 每月公布，平减指数每年公布", "CPI 不含服务，平减指数含服务", "两者完全相同"], "answer": 0, "explain": "CPI 只用消费者篮子（含进口消费品），平减指数覆盖国内生产的全部产品（含投资品与出口），两者数值与用途都不同。", "id": "q02", "chapterId": "ch24"}, {"type": "single", "question": "名义利率 6%，通胀率 4%，实际利率约为？", "options": ["10%", "2%", "1.5%", "−2%"], "answer": 1, "explain": "实际利率 ≈ 名义利率 − 通胀率 = 2%。影响储蓄与借贷决策的是实际利率，而不是挂牌的名义利率。", "id": "q03", "chapterId": "ch24"}, {"type": "blank", "question": "按物价指数自动调整工资或养老金的做法叫什么？（两个字）", "options": [], "answer": "指数化", "explain": "指数化能避免通胀侵蚀实际收入，但可能形成工资与物价互相推动的螺旋。", "id": "q04", "chapterId": "ch24"}, {"type": "single", "question": "70 法则下，年增长 7% 的经济翻倍约需多少年？", "options": ["7 年", "10 年", "20 年", "35 年"], "answer": 1, "explain": "70 ÷ 7 = 10 年。增长 2% 则需 35 年，复利效应下差距悬殊。", "id": "q01", "chapterId": "ch25"}, {"type": "single", "question": "「追赶效应」存在的原因是？", "options": ["穷国人口多", "穷国资本少，每增加一单位资本的增产效果更明显", "穷国技术更好", "发达国家不愿意增长"], "answer": 1, "explain": "资本边际收益递减意味着一单位资本在资本存量低的穷国产生更大的产出增量，因此穷国有更快的增长潜力。", "id": "q02", "chapterId": "ch25"}, {"type": "single", "question": "下列哪项不是决定生产率的核心因素？", "options": ["物质资本", "人力资本", "货币发行量", "技术知识"], "answer": 2, "explain": "生产率由物质资本、人力资本、自然资源与技术决定。货币量影响价格水平，不影响生产率。", "id": "q03", "chapterId": "ch25"}, {"type": "multi", "question": "有利于长期增长的政策包括？", "options": ["保护产权与政治稳定", "提高储蓄率并投资于资本", "普及教育与改善健康", "闭关限制进口"], "answer": [0, 1, 2], "explain": "前三项分别对应制度、资本、人力资本。闭关限制进口通常不利于技术引进与专业化分工。", "id": "q04", "chapterId": "ch25"}, {"type": "single", "question": "在可贷资金市场模型中，资金的供给来自？", "options": ["投资", "储蓄", "政府支出", "进口"], "answer": 1, "explain": "储蓄提供可贷资金，投资形成需求；两者相交决定利率。", "id": "q01", "chapterId": "ch26"}, {"type": "single", "question": "政府预算赤字扩大，在其他条件不变时通常导致？", "options": ["利率下降、投资增加", "利率上升、私人投资减少", "利率不变", "储蓄减少、投资增加"], "answer": 1, "explain": "赤字增加资金需求，需求曲线右移，利率上升，部分私人投资被挤出。", "id": "q02", "chapterId": "ch26"}, {"type": "single", "question": "宏观意义上的「投资」指？", "options": ["购买股票", "购买债券", "购买新机器与厂房", "把钱存入银行"], "answer": 2, "explain": "宏观投资指形成新资本（设备、厂房、住宅、库存）；买卖股票债券只是资产转手。", "id": "q03", "chapterId": "ch26"}, {"type": "multi", "question": "金融中介包括？", "options": ["商业银行", "共同基金", "债券发行企业", "中央银行"], "answer": [0, 1, 3], "explain": "银行、共同基金、央行都属于中介类机构；债券发行企业是资金需求方，通过金融市场直接融资。", "id": "q04", "chapterId": "ch26"}, {"type": "single", "question": "三年后获得 100 万元，贴现率 5%，现值约为？", "options": ["85 万", "86.4 万", "95 万", "115 万"], "answer": 1, "explain": "PV = 100 ÷ 1.05³ ≈ 86.4 万元；今天的 86.4 万按 5% 复利三年正好变成 100 万。", "id": "q01", "chapterId": "ch27"}, {"type": "single", "question": "分散化投资能消除哪类风险？", "options": ["市场风险", "个别企业或行业的风险", "通货膨胀风险", "利率风险"], "answer": 1, "explain": "企业特有风险可通过持有不相关资产抵消；市场风险影响全部资产，分散无法消除。", "id": "q02", "chapterId": "ch27"}, {"type": "single", "question": "保险的期望赔付通常低于保费，为什么人们还买？", "options": ["因为保险公司会返还", "因为保险买的是对灾难的确定性，大额损失无法承受", "因为保费可以抵税", "因为保单可以转卖"], "answer": 1, "explain": "保险把不确定的大额损失换成确定的小额支出，对无法承受灾难的人是理性选择，尽管期望值为负。", "id": "q03", "chapterId": "ch27"}, {"type": "single", "question": "有效市场假说若成立，下列哪项推论最直接？", "options": ["主动选股难以稳定跑赢指数", "股票价格永远不波动", "公司分红必然增加", "利率会下降"], "answer": 0, "explain": "价格已反映公开信息，短期变动不可预测，因此被动指数投资在多数人身上优于主动选股。", "id": "q04", "chapterId": "ch27"}, {"type": "single", "question": "劳动力 1000 万，失业 60 万，失业率是？", "options": ["6%", "6.4%", "5.6%", "无法计算"], "answer": 0, "explain": "失业率 = 60 ÷ 1000 = 6%。注意分母是劳动力，不包含不找工作的人。", "id": "q01", "chapterId": "ch28"}, {"type": "single", "question": "矿工因煤矿关闭而失去工作，又不会其他技能，这属于？", "options": ["摩擦性失业", "结构性失业", "周期性失业", "季节性失业"], "answer": 1, "explain": "技能与岗位需求不匹配属于结构性失业，需要培训或迁移来解决，耗时最长。", "id": "q02", "chapterId": "ch28"}, {"type": "single", "question": "大量失业者放弃求职退出劳动力，会造成？", "options": ["失业率上升", "失业率下降但劳动参与率也下降", "失业率不变", "自然失业率上升"], "answer": 1, "explain": "退出劳动力后不再计入失业人数，失业率下降，但劳动参与率同步下降，真实就业状况被掩盖。", "id": "q03", "chapterId": "ch28"}, {"type": "multi", "question": "把工资抬到均衡之上、造成结构性失业的因素包括？", "options": ["最低工资法", "工会集体谈判", "效率工资", "职业介绍所"], "answer": [0, 1, 2], "explain": "前三种都直接抬高工资；职业介绍所降低搜寻摩擦，属于缓解摩擦性失业的措施。", "id": "q04", "chapterId": "ch28"}, {"type": "single", "question": "货币三项职能中最关键的是？", "options": ["交换媒介", "计价单位", "价值储藏", "保值增值"], "answer": 0, "explain": "被广泛接受作为交换媒介是货币的本质特征；计价单位与价值储藏是派生的功能。", "id": "q01", "chapterId": "ch29"}, {"type": "single", "question": "准备金率为 10%，最初存入 1000 元，理论上银行体系最终可形成的存款总额约为？", "options": ["1000 元", "10000 元", "1900 元", "1100 元"], "answer": 1, "explain": "货币乘数 = 1 ÷ 0.1 = 10，1000 × 10 = 10000 元。现实中因现金漏出与超额准备金，实际数值更小。", "id": "q02", "chapterId": "ch29"}, {"type": "single", "question": "央行在公开市场买进政府债券的直接效果是？", "options": ["减少银行体系准备金", "增加银行体系准备金，货币供给增加", "提高准备金率", "减少货币供给"], "answer": 1, "explain": "央行买入债券付出资金，银行体系准备金增加，通过乘数放大为更多存款，货币供给上升。", "id": "q03", "chapterId": "ch29"}, {"type": "blank", "question": "资产转换成交换媒介的容易程度叫什么？（三个字）", "options": [], "answer": "流动性", "explain": "现金流动性最高，活期存款次之，房产最低。M1、M2 的划分就是按流动性排序。", "id": "q04", "chapterId": "ch29"}, {"type": "single", "question": "货币量增长 20%，实际产出增长 3%，流通速度不变，物价大致上涨？", "options": ["3%", "17%", "20%", "23%"], "answer": 1, "explain": "P = MV/Y，变化率约 1.20 ÷ 1.03 − 1 ≈ 16.5%，四舍五入约 17%。", "id": "q01", "chapterId": "ch30"}, {"type": "single", "question": "费雪效应的内容是？", "options": ["通胀上升时名义利率随之上升", "通胀上升时名义利率下降", "实际利率永远不变", "货币量与物价无关"], "answer": 0, "explain": "贷款人要求名义利率覆盖预期通胀，因此名义利率 = 实际利率 + 通胀率，二者同向变动。", "id": "q02", "chapterId": "ch30"}, {"type": "single", "question": "下列哪一项不是通胀的成本？", "options": ["皮鞋成本", "菜单成本", "税制扭曲", "产出必然下降"], "answer": 3, "explain": "通胀的成本主要是皮鞋成本、菜单成本、税制扭曲、相对价格混乱与财富再分配；通胀本身不必然导致产出下降。", "id": "q03", "chapterId": "ch30"}, {"type": "multi", "question": "关于通胀税，正确的说法是？", "options": ["靠印钞为支出融资，等于向持币者征税", "无需立法即可征收，因此隐蔽", "对持有现金比例高的低收入者更不利", "它只影响富人"], "answer": [0, 1, 2], "explain": "通胀税隐蔽且累退，低收入者财富中现金占比更高，承担的比例更大。", "id": "q04", "chapterId": "ch30"}, {"type": "single", "question": "一国净出口为正（贸易顺差），意味着？", "options": ["该国的储蓄超过投资，资金净流出", "该国的投资超过储蓄，资金净流入", "该国一定有资本外逃", "该国货币一定升值"], "answer": 0, "explain": "由 NX = S − I，顺差意味储蓄大于投资，多出的资金借给外国，形成资本净流出。顺差与资本净流出是同一件事的两面。", "id": "q01", "chapterId": "ch31"}, {"type": "single", "question": "名义汇率 7 元/美元，中国物价指数 110，美国 100。实际汇率是？", "options": ["7.0", "7.7", "6.4", "0.7"], "answer": 1, "explain": "实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价 = 7 × 110 ÷ 100 = 7.7，表示中国商品相对变贵。", "id": "q02", "chapterId": "ch31"}, {"type": "single", "question": "购买力平价理论在现实中不完全成立，主要原因是？", "options": ["各国货币不同", "许多商品与服务无法跨国搬运，且存在壁垒", "汇率由政府规定", "各国人口不同"], "answer": 1, "explain": "理发、房租、医疗等服务不可贸易，加上关税与运输成本，套利无法把价格拉平，因此 PPP 只在长期、可贸易品上部分成立。", "id": "q03", "chapterId": "ch31"}, {"type": "blank", "question": "衡量两国商品相对价格、等于名义汇率乘两国物价之比的汇率叫什么？（四个字）", "options": [], "answer": "实际汇率", "explain": "实际汇率衡量本国商品的相对价格，决定出口竞争力。", "id": "q04", "chapterId": "ch31"}, {"type": "single", "question": "政府预算赤字扩大，在开放经济中通常导致？", "options": ["利率上升、本币升值、净出口减少", "利率下降、本币贬值、净出口增加", "利率不变、净出口不变", "利率上升、本币贬值"], "answer": 0, "explain": "赤字抬高利率，资本净流出减少，本币升值，出口变贵、进口变便宜，净出口减少，贸易逆差扩大。", "id": "q01", "chapterId": "ch32"}, {"type": "single", "question": "限制进口的贸易政策对贸易余额的长期影响是？", "options": ["显著改善贸易余额", "基本不改变贸易余额，只改变贸易构成与数量", "必然扩大逆差", "使本币贬值"], "answer": 1, "explain": "进口减少使本币升值、出口同步减少，NX = S − I 未变，因此总量不变，只改变贸易结构与规模。", "id": "q02", "chapterId": "ch32"}, {"type": "single", "question": "资本外逃会带来？", "options": ["本币升值、利率下降", "本币贬值、利率上升", "本币升值、利率上升", "本币贬值、利率下降"], "answer": 1, "explain": "资金流出使外汇市场本币供给增加、本币贬值；同时国内可贷资金减少，利率上升。", "id": "q03", "chapterId": "ch32"}, {"type": "multi", "question": "在开放经济两市场模型中，连接可贷资金市场与外汇市场的是？", "options": ["资本净流出", "国内利率", "汇率", "政府税收"], "answer": [0, 1], "explain": "利率决定资本净流出，资本净流出又进入外汇市场决定汇率，这条链连接两个市场。", "id": "q04", "chapterId": "ch32"}, {"type": "single", "question": "总需求曲线向下倾斜的原因不包括？", "options": ["财富效应", "利率效应", "汇率效应", "商品价格越低越多人买"], "answer": 3, "explain": "单个商品降价带来的替代效应是微观机制；AD 向下源于物价水平通过财富、利率、汇率影响总支出。", "id": "q01", "chapterId": "ch33"}, {"type": "single", "question": "长期总供给曲线是垂直线，原因是？", "options": ["价格水平不影响长期产量，产量由资本、劳动与技术决定", "企业长期不调整价格", "政府管制价格", "货币量固定"], "answer": 0, "explain": "长期所有价格与工资都能调整，产量回到自然产出率，由要素与技术决定，与物价水平无关。", "id": "q02", "chapterId": "ch33"}, {"type": "single", "question": "石油价格暴涨导致？", "options": ["SRAS 左移，产量下降、物价上升", "AD 右移，产量与物价上升", "LRAS 右移", "失业下降"], "answer": 0, "explain": "投入品涨价抬高生产成本，短期总供给左移，出现产量下降与物价上升并存的滞胀。", "id": "q03", "chapterId": "ch33"}, {"type": "multi", "question": "下列哪些因素会使总需求曲线整体右移？", "options": ["政府购买增加", "企业投资信心上升", "物价水平下降", "外国对本国产品需求增加"], "answer": [0, 1, 3], "explain": "物价下降是沿曲线移动；C、I、G、NX 的外生变化才使整条曲线移动。", "id": "q04", "chapterId": "ch33"}, {"type": "single", "question": "流动性偏好理论中，货币供给曲线画成垂直线是因为？", "options": ["货币供给由央行决定，与利率无关", "人们不持有货币", "利率固定", "货币需求不变"], "answer": 0, "explain": "货币供给由央行政策决定，不随利率变化；需求随利率上升而下降，两者交点决定利率。", "id": "q01", "chapterId": "ch34"}, {"type": "single", "question": "MPC 为 0.8，政府购买增加 100 亿元，总需求约增加？", "options": ["100 亿", "180 亿", "400 亿", "500 亿"], "answer": 3, "explain": "支出乘数 = 1 ÷ (1−0.8) = 5，100 × 5 = 500 亿元。", "id": "q02", "chapterId": "ch34"}, {"type": "single", "question": "等额减税与政府购买相比，对总需求的刺激通常？", "options": ["更大", "相同", "更小，因为部分减税被储蓄", "无法比较"], "answer": 2, "explain": "税收乘数 = −MPC/(1−MPC)，MPC=0.8 时为 −4，减税 100 亿只增加 400 亿总需求，小于政府购买的 500 亿。", "id": "q03", "chapterId": "ch34"}, {"type": "multi", "question": "属于自动稳定器的有？", "options": ["累进所得税", "失业保险", "一次性基建投资", "转移支付"], "answer": [0, 1, 3], "explain": "自动稳定器不需要决策即随经济状况自动变化；一次性基建投资需要立法批准，属于相机抉择。", "id": "q04", "chapterId": "ch34"}, {"type": "single", "question": "长期菲利普斯曲线为什么是垂直的？", "options": ["失业率与通胀率无关，失业回到自然率", "通胀永远为零", "政府控制工资", "企业不提价"], "answer": 0, "explain": "长期预期完全调整，实际通胀等于预期通胀，产量与失业回到自然水平，通胀高低不再影响失业。", "id": "q01", "chapterId": "ch35"}, {"type": "single", "question": "菲利普斯曲线与 AD-AS 模型的关系是？", "options": ["两个独立理论", "同一模型的两种坐标表达", "菲利普斯曲线更早出现因此更准确", "完全矛盾"], "answer": 1, "explain": "AD 扩张使产量上升、物价上升，对应失业下降、通胀上升，正是短期菲利普斯曲线的向下倾斜。", "id": "q02", "chapterId": "ch35"}, {"type": "single", "question": "牺牲率为 3，通胀从 6% 降到 2%，累计产出损失约为？", "options": ["4%", "6%", "12%", "18%"], "answer": 2, "explain": "降 4 个百分点 × 牺牲率 3 = 12% 的年度产出损失。", "id": "q03", "chapterId": "ch35"}, {"type": "multi", "question": "使短期菲利普斯曲线上移（同样失业率对应更高通胀）的因素有？", "options": ["预期通胀上升", "供给冲击", "自然失业率下降", "工资合同指数化"], "answer": [0, 1, 3], "explain": "预期上升、供给冲击、工资指数化都会抬高短期曲线；自然失业率下降是长期曲线的左移。", "id": "q04", "chapterId": "ch35"}, {"type": "single", "question": "反对「决策者应积极稳定经济」的核心理由是？", "options": ["衰退有益", "政策存在时滞且预测不准", "政府没有工具", "市场会自动恢复"], "answer": 1, "explain": "识别、立法、执行、见效各环节都有时滞，加上预测误差，政策可能在错误的时点发力。", "id": "q01", "chapterId": "ch36"}, {"type": "single", "question": "主张央行设定 2% 而非 0% 通胀目标的理由不包括？", "options": ["避免滑入通缩", "给名义工资调整留缓冲", "消除全部通胀成本", "保留降息空间"], "answer": 2, "explain": "正通胀仍带来皮鞋成本、菜单成本等，只是量级较小；设 2% 是为了避免通缩与工资调整困难，不是消除成本。", "id": "q02", "chapterId": "ch36"}, {"type": "single", "question": "衰退期强行平衡预算的主要问题是？", "options": ["会推高通胀", "等于紧缩，加深衰退", "会降低利率", "会减少失业"], "answer": 1, "explain": "衰退时税收自动下降、支出自动上升，强行平衡意味着增税减支，抵消自动稳定器，加深衰退。", "id": "q03", "chapterId": "ch36"}, {"type": "multi", "question": "支持「为鼓励储蓄修改税法」的论据包括？", "options": ["储蓄是资本来源、能提高生产率", "现行税制对利息与资本利得征税等于惩罚储蓄", "减税主要惠及富人所以更公平", "储蓄增加能降低对外资依赖"], "answer": [0, 1, 3], "explain": "公平性恰恰是反对意见：减税受益者多为富人，因此第三项不成立。", "id": "q04", "chapterId": "ch36"}], "flashcards": [{"id": "f-ch23-01", "chapterId": "ch23", "front": "GDP 定义的四个限定", "back": "一国境内、一定时期、最终产品与服务、市场价值。", "tags": ["GDP"]}, {"id": "f-ch23-02", "chapterId": "ch23", "front": "支出法的四项", "back": "C 消费 + I 投资 + G 政府购买 + NX 净出口；进口通过 NX 扣除。", "tags": ["GDP", "计算"]}, {"id": "f-ch23-03", "chapterId": "ch23", "front": "名义 GDP 与实际 GDP 的差别", "back": "名义用当期价格，实际用基年价格；实际剔除了价格变动，反映真实产量。", "tags": ["GDP"]}, {"id": "f-ch23-04", "chapterId": "ch23", "front": "GDP 平减指数的算法", "back": "名义 GDP ÷ 实际 GDP × 100；其百分比变化即通胀率的近似。", "tags": ["GDP", "通胀"]}, {"id": "f-ch23-05", "chapterId": "ch23", "front": "GDP 的四类盲区", "back": "家务与自给劳动、地下经济、分配与环境、闲暇与质量改进。", "tags": ["GDP", "局限"]}, {"id": "f-ch24-01", "chapterId": "ch24", "front": "CPI 的三步算法", "back": "定篮子、查当期价格、算「当期成本 ÷ 基期成本 × 100」。", "tags": ["CPI", "计算"]}, {"id": "f-ch24-02", "chapterId": "ch24", "front": "CPI 高估通胀的三个原因", "back": "替代偏差、新产品出现、质量改进未被计入。", "tags": ["CPI", "易错"]}, {"id": "f-ch24-03", "chapterId": "ch24", "front": "CPI 与平减指数的三点差别", "back": "覆盖范围（消费 vs 全部生产）、是否含进口、篮子固定还是随产量变化。", "tags": ["CPI"]}, {"id": "f-ch24-04", "chapterId": "ch24", "front": "实际利率的算法与作用", "back": "实际利率 ≈ 名义利率 − 通胀率；影响储蓄、借贷与投资决策。", "tags": ["利率"]}, {"id": "f-ch24-05", "chapterId": "ch24", "front": "指数化的利弊", "back": "利：保住实际收入；弊：可能形成工资与物价螺旋。", "tags": ["通胀"]}, {"id": "f-ch25-01", "chapterId": "ch25", "front": "生产率与生活水平的关系", "back": "人均生活水平由生产率（每劳动小时的产出）决定，而不是工作时长或资源禀赋。", "tags": ["增长"]}, {"id": "f-ch25-02", "chapterId": "ch25", "front": "决定生产率的四项因素", "back": "物质资本、人力资本、自然资源、技术知识。", "tags": ["增长"]}, {"id": "f-ch25-03", "chapterId": "ch25", "front": "技术知识与人力资本的区别", "back": "技术知识是「知识存在」；人力资本是「人掌握了知识」。技术可引进，人力资本必须自己培养。", "tags": ["增长", "易错"]}, {"id": "f-ch25-04", "chapterId": "ch25", "front": "70 法则", "back": "翻倍年数约等于 70 ÷ 年增长率（%）。", "tags": ["增长", "计算"]}, {"id": "f-ch25-05", "chapterId": "ch25", "front": "追赶效应的条件", "back": "穷国资本少、边际收益高，增长潜力大；但需要产权、开放、教育等制度条件配合。", "tags": ["增长"]}, {"id": "f-ch26-01", "chapterId": "ch26", "front": "宏观投资与金融投资的区别", "back": "宏观投资是购买新资本（设备、厂房、住宅）；买股票债券只是资产换手，不计入投资。", "tags": ["金融体系", "易错"]}, {"id": "f-ch26-02", "chapterId": "ch26", "front": "债券利率由什么决定", "back": "期限、信用风险、税收待遇：期限越长、风险越高，利率越高。", "tags": ["债券"]}, {"id": "f-ch26-03", "chapterId": "ch26", "front": "可贷资金市场的供给与需求", "back": "储蓄是供给（利率升则增），投资是需求（利率升则减），交点定均衡利率。", "tags": ["可贷资金"]}, {"id": "f-ch26-04", "chapterId": "ch26", "front": "挤出效应", "back": "政府借款增加资金需求、抬高利率，从而减少私人投资。", "tags": ["财政政策", "政策"]}, {"id": "f-ch26-05", "chapterId": "ch26", "front": "金融中介的两类", "back": "银行（吸存放贷）与共同基金（汇集资金专业投资）。", "tags": ["金融体系"]}, {"id": "f-ch27-01", "chapterId": "ch27", "front": "现值公式", "back": "PV = FV ÷ (1+r)^n；利率越高、期限越长，折得越少。", "tags": ["现值", "计算"]}, {"id": "f-ch27-02", "chapterId": "ch27", "front": "净现值为什么是投资判据", "back": "NPV = 现值 − 初始投入；正的才值得做，不同时间的现金流必须先折算。", "tags": ["现值"]}, {"id": "f-ch27-03", "chapterId": "ch27", "front": "风险厌恶的含义", "back": "偏好确定的收益而非期望相同但波动大的收益；损失痛感大于同等收益的快乐。", "tags": ["风险"]}, {"id": "f-ch27-04", "chapterId": "ch27", "front": "保险为什么值得买", "back": "把不确定的大损失换成确定的小支出；保费高于期望赔付是保险公司的成本与利润。", "tags": ["保险"]}, {"id": "f-ch27-05", "chapterId": "ch27", "front": "企业特有风险与市场风险", "back": "前者可由多元化消除，后者影响全部资产、无法分散。", "tags": ["风险"]}, {"id": "f-ch27-06", "chapterId": "ch27", "front": "基本面分析与有效市场假说", "back": "前者估未来现金流现值，后者认为价格已反映公开信息；泡沫是后者的反例。", "tags": ["资产评估"]}, {"id": "f-ch28-01", "chapterId": "ch28", "front": "失业率与劳动参与率", "back": "失业率 = 失业 ÷ 劳动力；参与率 = 劳动力 ÷ 成年人口。放弃求职者退出劳动力会压低失业率。", "tags": ["失业", "计算"]}, {"id": "f-ch28-02", "chapterId": "ch28", "front": "三类失业及对策", "back": "摩擦性（信息与匹配，靠招聘服务）、结构性（技能错配，靠培训迁移）、周期性（需求不足，靠宏观政策）。", "tags": ["失业"]}, {"id": "f-ch28-03", "chapterId": "ch28", "front": "自然失业率", "back": "摩擦性与结构性失业对应的失业水平，是经济正常运转时的失业率。", "tags": ["失业"]}, {"id": "f-ch28-04", "chapterId": "ch28", "front": "效率工资的四个理由", "back": "改善体力、降低流动率、吸引更优秀员工、减少偷懒。", "tags": ["工资"]}, {"id": "f-ch28-05", "chapterId": "ch28", "front": "失业保险的两面", "back": "保障失业者生活，但降低求职紧迫性、延长失业持续时间。", "tags": ["政策"]}, {"id": "f-ch29-01", "chapterId": "ch29", "front": "货币的三项职能", "back": "交换媒介、计价单位、价值储藏。", "tags": ["货币"]}, {"id": "f-ch29-02", "chapterId": "ch29", "front": "M1 与 M2 的差别", "back": "M1 为现金加活期存款（流动性最高），M2 再加入定期存款与货币市场基金。", "tags": ["货币"]}, {"id": "f-ch29-03", "chapterId": "ch29", "front": "部分准备金制度与货币乘数", "back": "银行只留一部分存款作准备金，货币乘数 = 1 ÷ 准备金率；贷款创造存款。", "tags": ["银行", "计算"]}, {"id": "f-ch29-04", "chapterId": "ch29", "front": "央行三大工具", "back": "公开市场操作（最常用）、调整准备金率（作用猛烈）、调整利率。", "tags": ["央行", "政策"]}, {"id": "f-ch29-05", "chapterId": "ch29", "front": "现实货币乘数为何小于 1/R", "back": "现金漏出、银行自愿持有超额准备金、部分存款不进入可贷体系。", "tags": ["银行", "易错"]}, {"id": "f-ch30-01", "chapterId": "ch30", "front": "货币数量方程", "back": "M × V = P × Y；V 与 Y 相对稳定时，物价由货币量决定。", "tags": ["通胀", "货币"]}, {"id": "f-ch30-02", "chapterId": "ch30", "front": "为什么说通胀是货币现象", "back": "持续、普遍的物价上涨需要货币扩张支撑；单品涨价只是相对价格变化。", "tags": ["通胀", "易错"]}, {"id": "f-ch30-03", "chapterId": "ch30", "front": "通胀税为什么隐蔽且累退", "back": "不需立法即可征收，持有现金多的人（多为低收入者）损失比例更大。", "tags": ["通胀税"]}, {"id": "f-ch30-04", "chapterId": "ch30", "front": "费雪效应", "back": "名义利率随预期通胀同步上升，实际利率基本不变；只有意外通胀才重新分配财富。", "tags": ["利率", "通胀"]}, {"id": "f-ch30-05", "chapterId": "ch30", "front": "通胀的五项成本", "back": "皮鞋成本、菜单成本、税制扭曲、相对价格混乱、财富再分配。", "tags": ["通胀"]}, {"id": "f-ch31-01", "chapterId": "ch31", "front": "NX 与 NCF 的关系", "back": "NX = NCF；由 S = I + NX 得 NX = S − I。", "tags": ["开放经济", "恒等式"]}, {"id": "f-ch31-02", "chapterId": "ch31", "front": "贸易顺差的经济含义", "back": "储蓄大于投资，多余资金借给外国，形成资本净流出。", "tags": ["开放经济", "易错"]}, {"id": "f-ch31-03", "chapterId": "ch31", "front": "实际汇率公式", "back": "实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价，衡量本国商品相对价格。", "tags": ["汇率", "计算"]}, {"id": "f-ch31-04", "chapterId": "ch31", "front": "购买力平价的逻辑与局限", "back": "靠套利拉平价格，但服务不可贸易、存在壁垒，因此长期部分成立、短期基本无效。", "tags": ["汇率"]}, {"id": "f-ch32-01", "chapterId": "ch32", "front": "开放经济两个市场", "back": "可贷资金市场定利率，外汇市场定汇率，中间由资本净流出连接。", "tags": ["开放经济"]}, {"id": "f-ch32-02", "chapterId": "ch32", "front": "赤字传导链", "back": "赤字 → 利率升 → 资本净流出减少 → 本币升值 → 净出口减少。", "tags": ["开放经济", "政策"]}, {"id": "f-ch32-03", "chapterId": "ch32", "front": "贸易政策为什么不改变贸易余额", "back": "进口减少使本币升值、出口同减；NX = S − I 未变，总量不变。", "tags": ["贸易政策", "易错"]}, {"id": "f-ch32-04", "chapterId": "ch32", "front": "资本外逃的两个后果", "back": "本币贬值（外汇市场本币供给增加）与利率上升（国内资金减少）。", "tags": ["金融危机"]}, {"id": "f-ch32-05", "chapterId": "ch32", "front": "判断政策对 NX 影响的快捷键", "back": "看它是否改变 S 或 I；不改变则 NX 不变，只改变汇率与构成。", "tags": ["开放经济"]}, {"id": "f-ch33-01", "chapterId": "ch33", "front": "经济波动的三个事实", "back": "无规律不可预测、多数宏观变量同向波动、产量下降时失业上升。", "tags": ["波动"]}, {"id": "f-ch33-02", "chapterId": "ch33", "front": "AD 向下的三个渠道", "back": "财富效应、利率效应、汇率效应。", "tags": ["总需求"]}, {"id": "f-ch33-03", "chapterId": "ch33", "front": "LRAS 为什么垂直", "back": "长期产量由资本、劳动、技术决定，价格水平只影响名义值。", "tags": ["总供给"]}, {"id": "f-ch33-04", "chapterId": "ch33", "front": "SRAS 向上倾斜的三个解释", "back": "粘性工资、粘性价格、对企业自身价格的错觉。", "tags": ["总供给"]}, {"id": "f-ch33-05", "chapterId": "ch33", "front": "需求冲击的短期与长期结果", "back": "短期产量与物价同升，长期产量回到自然率、只有物价上升。", "tags": ["AD-AS", "易错"]}, {"id": "f-ch33-06", "chapterId": "ch33", "front": "滞胀", "back": "供给冲击使 SRAS 左移，产量下降与物价上升同时发生，政策两难。", "tags": ["滞胀"]}, {"id": "f-ch34-01", "chapterId": "ch34", "front": "流动性偏好理论", "back": "货币需求随利率上升而减少，货币供给由央行决定，交点定利率。", "tags": ["货币政策"]}, {"id": "f-ch34-02", "chapterId": "ch34", "front": "货币政策传导链", "back": "货币供给增加 → 利率下降 → 投资增加 → 总需求右移。", "tags": ["货币政策"]}, {"id": "f-ch34-03", "chapterId": "ch34", "front": "支出乘数与税收乘数", "back": "支出乘数 1/(1−MPC)；税收乘数 −MPC/(1−MPC)，绝对值更小。", "tags": ["财政政策", "计算"]}, {"id": "f-ch34-04", "chapterId": "ch34", "front": "挤出效应", "back": "政府借款抬高利率、减少私人投资，削弱财政政策效果；衰退期较弱。", "tags": ["财政政策"]}, {"id": "f-ch34-05", "chapterId": "ch34", "front": "自动稳定器", "back": "累进所得税与转移支付随经济自动调节，无时滞、不受政治干扰，但只能缓冲。", "tags": ["稳定政策"]}, {"id": "f-ch35-01", "chapterId": "ch35", "front": "菲利普斯曲线的本质", "back": "AD-AS 模型的另一种画法：总需求扩张对应通胀升、失业降。", "tags": ["菲利普斯曲线"]}, {"id": "f-ch35-02", "chapterId": "ch35", "front": "短期与长期菲利普斯曲线", "back": "短期向下倾斜（意料之外的通胀能降失业），长期垂直（在自然失业率处）。", "tags": ["菲利普斯曲线", "易错"]}, {"id": "f-ch35-03", "chapterId": "ch35", "front": "自然率假说", "back": "无论通胀多高，失业最终回到自然率；1970 年代滞胀是其证据。", "tags": ["菲利普斯曲线"]}, {"id": "f-ch35-04", "chapterId": "ch35", "front": "牺牲率", "back": "降低 1 个百分点通胀所损失的年度产出百分比，经验值约 2–5。", "tags": ["反通胀"]}, {"id": "f-ch35-05", "chapterId": "ch35", "front": "理性预期为什么能降低反通胀代价", "back": "若央行可信地宣布并被执行，预期立即下调，工资价格同步调整，产量损失小。", "tags": ["反通胀"]}, {"id": "f-ch35-06", "chapterId": "ch35", "front": "滞胀在曲线上的表现", "back": "供给冲击使短期曲线右移，通胀与失业同时上升。", "tags": ["滞胀"]}, {"id": "f-ch36-01", "chapterId": "ch36", "front": "六个争论的清单", "back": "稳定经济？增支还是减税？规则还是相机抉择？零通胀目标？平衡预算？为储蓄改税？", "tags": ["政策争论"]}, {"id": "f-ch36-02", "chapterId": "ch36", "front": "时滞为什么是反方核心论据", "back": "识别、立法、执行、见效都要时间，等政策落地时经济状况可能已反转。", "tags": ["稳定政策"]}, {"id": "f-ch36-03", "chapterId": "ch36", "front": "规则 vs 相机抉择的折中", "back": "多数央行采用受约束的相机抉择：明确通胀目标，工具与节奏保留弹性。", "tags": ["货币政策"]}, {"id": "f-ch36-04", "chapterId": "ch36", "front": "零通胀目标的三重风险", "back": "滑入通缩、反通胀代价高、名义工资难以下调。", "tags": ["通胀目标"]}, {"id": "f-ch36-05", "chapterId": "ch36", "front": "周期性赤字与结构性赤字", "back": "前者由衰退造成应容忍，后者是长期入不敷出应削减。", "tags": ["财政"]}, {"id": "f-ch36-06", "chapterId": "ch36", "front": "储蓄激励的公平争议", "back": "减税主要惠及本已高储蓄的富人，且短期压低消费需求。", "tags": ["税收"]}], "glossary": [{"term": "国内生产总值", "def": "一国境内一定时期内生产的所有最终物品与服务的市场价值。", "chapterId": "ch23"}, {"term": "最终产品", "def": "直接供最终使用、不再作为其他产品投入的产品。", "chapterId": "ch23"}, {"term": "名义 GDP", "def": "按当期价格计算的 GDP。", "chapterId": "ch23"}, {"term": "实际 GDP", "def": "按基年价格计算的 GDP，剔除价格变动影响。", "chapterId": "ch23"}, {"term": "GDP 平减指数", "def": "名义 GDP 与实际 GDP 之比乘以 100，衡量整体价格水平。", "chapterId": "ch23"}, {"term": "消费物价指数", "def": "用固定一篮子消费品价格计算的物价指数，衡量生活费用变化。", "chapterId": "ch24"}, {"term": "通货膨胀率", "def": "物价指数在两个时期之间的百分比变化。", "chapterId": "ch24"}, {"term": "指数化", "def": "按物价指数自动调整金额，以维持实际购买力。", "chapterId": "ch24"}, {"term": "名义利率", "def": "未扣除通胀的挂牌利率。", "chapterId": "ch24"}, {"term": "实际利率", "def": "名义利率扣除通胀后的购买力增长，近似等于名义利率减通胀率。", "chapterId": "ch24"}, {"term": "生产率", "def": "每单位劳动投入所生产的产出量。", "chapterId": "ch25"}, {"term": "物质资本", "def": "用于生产的设备、厂房与基础设施。", "chapterId": "ch25"}, {"term": "人力资本", "def": "劳动者通过教育、培训与经验积累的知识与技能。", "chapterId": "ch25"}, {"term": "技术知识", "def": "关于如何生产的知识本身，存在于专利、文献与工艺中。", "chapterId": "ch25"}, {"term": "追赶效应", "def": "资本存量低的穷国增长更快，因为资本边际收益更高。", "chapterId": "ch25"}, {"term": "债券", "def": "借款人承诺按期付息还本的债务凭证。", "chapterId": "ch26"}, {"term": "股票", "def": "对企业所有权的份额，持有人分享剩余收益。", "chapterId": "ch26"}, {"term": "金融中介", "def": "连接储蓄者与借款人的机构，如银行、共同基金。", "chapterId": "ch26"}, {"term": "可贷资金市场", "def": "储蓄供给与投资需求相互作用决定利率的市场模型。", "chapterId": "ch26"}, {"term": "挤出效应", "def": "政府借款抬高利率、减少私人投资的现象。", "chapterId": "ch26"}, {"term": "共同基金", "def": "汇集众多投资者资金、由专业经理投资于组合的机构。", "chapterId": "ch26"}, {"term": "现值", "def": "未来一笔金额按某一利率折算成的今天价值。", "chapterId": "ch27"}, {"term": "净现值", "def": "未来现金流的现值减去初始投入。", "chapterId": "ch27"}, {"term": "风险厌恶", "def": "偏好确定收益、回避波动的倾向。", "chapterId": "ch27"}, {"term": "多元化", "def": "把资金投入不相关资产以降低企业特有风险。", "chapterId": "ch27"}, {"term": "基本面分析", "def": "通过估算资产未来现金流的现值来判断其价值。", "chapterId": "ch27"}, {"term": "有效市场假说", "def": "资产价格已充分反映所有公开信息的理论。", "chapterId": "ch27"}, {"term": "泡沫", "def": "资产价格远超其基本面价值的现象。", "chapterId": "ch27"}, {"term": "劳动力", "def": "就业者与失业者的总和。", "chapterId": "ch28"}, {"term": "失业率", "def": "失业人数占劳动力的比例。", "chapterId": "ch28"}, {"term": "劳动参与率", "def": "劳动力占成年人口的比例。", "chapterId": "ch28"}, {"term": "摩擦性失业", "def": "换工作或初入职场期间寻找匹配岗位造成的失业。", "chapterId": "ch28"}, {"term": "结构性失业", "def": "技能或地区与岗位需求不匹配造成的失业。", "chapterId": "ch28"}, {"term": "周期性失业", "def": "经济衰退中总需求不足造成的失业。", "chapterId": "ch28"}, {"term": "自然失业率", "def": "摩擦性与结构性失业对应的正常失业水平。", "chapterId": "ch28"}, {"term": "失业保险", "def": "向失业者提供部分收入补偿的制度。", "chapterId": "ch28"}, {"term": "货币", "def": "被广泛接受用作交换媒介、计价单位与价值储藏的东西。", "chapterId": "ch29"}, {"term": "流动性", "def": "资产转换为交换媒介的容易程度。", "chapterId": "ch29"}, {"term": "商品货币", "def": "自身具有内在价值的货币，如金银。", "chapterId": "ch29"}, {"term": "法定货币", "def": "没有内在价值、依靠政府法令与信任流通的货币。", "chapterId": "ch29"}, {"term": "准备金", "def": "银行保留的不贷出的存款部分。", "chapterId": "ch29"}, {"term": "准备金率", "def": "准备金占存款的比例。", "chapterId": "ch29"}, {"term": "货币乘数", "def": "准备金率倒数，表示单位准备金能支撑的存款总额。", "chapterId": "ch29"}, {"term": "公开市场操作", "def": "央行买卖政府债券以调节银行体系准备金与货币供给。", "chapterId": "ch29"}, {"term": "货币数量论", "def": "用 MV = PY 说明物价水平由货币量决定的理论。", "chapterId": "ch30"}, {"term": "流通速度", "def": "单位货币在一年内参与交易的次数。", "chapterId": "ch30"}, {"term": "通胀税", "def": "政府通过印钞融资，使持币者购买力下降所形成的隐性税负。", "chapterId": "ch30"}, {"term": "费雪效应", "def": "名义利率随预期通胀同向调整的现象。", "chapterId": "ch30"}, {"term": "皮鞋成本", "def": "为减少持有现金的损失而频繁取现所耗费的时间与资源。", "chapterId": "ch30"}, {"term": "菜单成本", "def": "因改价而发生的重印、更新与沟通成本。", "chapterId": "ch30"}, {"term": "恶性通胀", "def": "物价极高速上涨、货币失去基本职能的极端通胀。", "chapterId": "ch30"}, {"term": "净出口", "def": "出口减进口，也称贸易余额。", "chapterId": "ch31"}, {"term": "资本净流出", "def": "本国居民购买外国资产减去外国人购买本国资产。", "chapterId": "ch31"}, {"term": "名义汇率", "def": "两种货币之间的兑换比率。", "chapterId": "ch31"}, {"term": "实际汇率", "def": "两国商品的相对价格，等于名义汇率乘以两国物价之比。", "chapterId": "ch31"}, {"term": "购买力平价", "def": "同样商品在各国换算后应价格相同的理论。", "chapterId": "ch31"}, {"term": "升值", "def": "本币能兑换更多外币。", "chapterId": "ch31"}, {"term": "外汇市场", "def": "本币与外币相互兑换的市场，供求决定汇率。", "chapterId": "ch32"}, {"term": "资本外逃", "def": "投资者因对一国失去信心而大规模转移资金。", "chapterId": "ch32"}, {"term": "贸易政策", "def": "关税、配额、补贴等限制或鼓励进出口的政策。", "chapterId": "ch32"}, {"term": "总需求", "def": "物价水平与总产出需求量之间的关系。", "chapterId": "ch33"}, {"term": "总供给", "def": "物价水平与总产出供给量之间的关系。", "chapterId": "ch33"}, {"term": "自然产出率", "def": "经济在正常运转时能生产的产出水平，由要素与技术决定。", "chapterId": "ch33"}, {"term": "滞胀", "def": "产量下降与物价上涨同时出现的状态。", "chapterId": "ch33"}, {"term": "粘性工资", "def": "名义工资因合同或习惯不能随物价立即调整。", "chapterId": "ch33"}, {"term": "流动性偏好", "def": "人们偏好持有流动性高的资产，该理论用货币供求解释利率。", "chapterId": "ch34"}, {"term": "支出乘数", "def": "政府购买增加引起的总需求变化倍数，等于 1/(1−MPC)。", "chapterId": "ch34"}, {"term": "税收乘数", "def": "减税引起的总需求变化倍数，等于 −MPC/(1−MPC)。", "chapterId": "ch34"}, {"term": "挤出效应", "def": "政府借款抬高利率从而减少私人投资的现象。", "chapterId": "ch34"}, {"term": "自动稳定器", "def": "不需政策决策即随经济状况自动调节税收与支出的机制。", "chapterId": "ch34"}, {"term": "边际消费倾向", "def": "收入每增加一单位用于消费的比例。", "chapterId": "ch34"}, {"term": "菲利普斯曲线", "def": "通货膨胀率与失业率之间关系的曲线。", "chapterId": "ch35"}, {"term": "自然率假说", "def": "失业最终回到自然失业率、不受通胀水平影响的观点。", "chapterId": "ch35"}, {"term": "牺牲率", "def": "降低一个百分点通胀所损失的年度产出百分比。", "chapterId": "ch35"}, {"term": "反通货膨胀", "def": "刻意降低通货膨胀率的政策过程。", "chapterId": "ch35"}, {"term": "滞胀", "def": "通胀上升与失业上升并存的状态。", "chapterId": "ch35"}, {"term": "相机抉择", "def": "根据当时形势灵活决定政策，而非按固定规则行事。", "chapterId": "ch36"}, {"term": "自动稳定器", "def": "无需决策即随经济周期自动调节收支的机制。", "chapterId": "ch36"}, {"term": "周期性赤字", "def": "经济衰退导致税收减少、支出增加所形成的赤字。", "chapterId": "ch36"}, {"term": "结构性赤字", "def": "剔除周期因素后仍存在的长期收支缺口。", "chapterId": "ch36"}]}, "pages": {"ch23": {"html": "<h1>第 23 章：一国收入的衡量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无（宏观第一站）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 GDP 的定义要素，并判断哪些交易计入、哪些不计入。\n<\/li><li>\n用支出法把 GDP 拆成 C + I + G + NX 四部分。\n<\/li><li>\n区分名义 GDP 与实际 GDP，算出 GDP 平减指数与通货膨胀率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>GDP 是&quot;一国境内一年里新生产出来的最终产品与服务的市场价值&quot;；它衡量的是<strong>流量<\/strong>（这一年生产了多少），不是存量（有多少财富），也不算没经过市场的东西。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>定义的四个关键词<\/h3>\n<p><strong>国内生产总值<\/strong>（GDP）的定义里藏了四个限定，每个都排除掉一类东西：<\/p>\n<ol><li>\n<strong>一国境内<\/strong>：外国公司在中国的工厂算中国的 GDP（地理原则），不算外国的 GNP。中国公司在越南的工厂反过来。\n<\/li><li>\n<strong>一定时期内<\/strong>：通常一年或一季度。存量（房子、存款）不算，只有这一年的<strong>新增生产<\/strong>算。\n<\/li><li>\n<strong>最终<\/strong>物品与服务：中间品不计入，否则重复计算。面粉做成面包，只算面包的价格。\n<\/li><li>\n<strong>市场价值<\/strong>：用市场价格加总。没有市场价格的（家务劳动、自给自足的粮食）无法计入。\n<\/ol>\n<p>因此下面这些都不算 GDP：<\/p>\n<ul><li>\n二手交易（旧车转手，只算中介佣金）\n<\/li><li>\n转移支付（退休金、救济金，没有对应生产）\n<\/li><li>\n自家做的饭、自己修的水管（没有市场交易）\n<\/li><li>\n地下经济与黑市\n<\/li><li>\n股票买卖（只是资产换手，佣金除外）\n<\/ul>\n<h3>支出法：GDP 的四个买家<\/h3>\n<p><strong>GDP = C + I + G + NX<\/strong><\/p>\n<table><thead><tr><th>符号<\/th><th>名称<\/th><th>包含什么<\/th><th>注意<\/th><\/tr><\/thead><tbody><tr><td>C<\/td><td>消费<\/td><td>家庭购买的耐用品、非耐用品、服务<\/td><td>买新房不算 C，算 I<\/td><\/tr><tr><td>I<\/td><td>投资<\/td><td>企业设备、厂房、住宅建造、库存变化<\/td><td>买股票债券不算 I，那是金融交易<\/td><\/tr><tr><td>G<\/td><td>政府购买<\/td><td>政府支付的工资、买的物资<\/td><td>转移支付不算 G<\/td><\/tr><tr><td>NX<\/td><td>净出口<\/td><td>出口 − 进口<\/td><td>进口要从总支出里扣掉，因为它不是本国生产<\/td><\/tr><\/tbody><\/table>\n<p>一个容易错的点：<strong>进口的消费品已经在 C 里了，但不是本国生产<\/strong>，所以要减去。这就是 NX 的作用。<\/p>\n<h3>名义与实际<\/h3>\n<p><strong>名义 GDP<\/strong> 用当期价格算。<strong>实际 GDP<\/strong> 用基年价格算，剔除了价格变化。<\/p>\n<p>一个只有两种产品的例子（基年 2015）：<\/p>\n<table><thead><tr><th>年份<\/th><th>苹果（元/个，个）<\/th><th>面包（元/条，条）<\/th><th>名义 GDP<\/th><th>实际 GDP（2015 价）<\/th><\/tr><\/thead><tbody><tr><td>2015<\/td><td>2 × 100<\/td><td>3 × 50<\/td><td>350<\/td><td>350<\/td><\/tr><tr><td>2016<\/td><td>3 × 110<\/td><td>4 × 55<\/td><td>550<\/td><td>385<\/td><\/tr><\/tbody><\/table>\n<p>2016 年名义 GDP 涨了 57%，但实际只涨了 10%——剩下的 47% 是涨价。<\/p>\n<p><strong>GDP 平减指数<\/strong> = 名义 GDP ÷ 实际 GDP × 100。2016 年为 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高了约 43%。<\/p>\n<p><strong>通货膨胀率<\/strong> = 平减指数的百分比变化。若上一年平减指数是 130，则当年通胀率 ≈ (142.9 − 130) ÷ 130 ≈ 10%。<\/p>\n<h3>人均 GDP 与生活水平<\/h3>\n<p>GDP 总量大不代表人人富裕。比较国家生活水平要用<strong>人均 GDP<\/strong> = GDP ÷ 人口。<\/p>\n<p>但人均 GDP 也不能完全代表生活水平：它不反映分配、环境、闲暇、健康、教育。一个 GDP 高但污染严重、工作时间极长的国家，生活质量未必最好。<\/p>\n<h3>GDP 的局限<\/h3>\n<ul><li>\n不含家务与自给劳动（这部分在穷国占比更大，使国际比较失真）\n<\/li><li>\n不含地下经济\n<\/li><li>\n不反映分配\n<\/li><li>\n不反映环境成本与资源耗竭\n<\/li><li>\n不反映闲暇与健康\n<\/li><li>\n不反映产品质量改进（新版手机比旧版好，但若价格不变统计不出来）\n<\/ul>\n<p>这些局限不否定 GDP 的用处。它是目前最可靠、最及时的总体经济活动指标，局限在于不能当成&quot;福利&quot;的同义词。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;GDP 涨了就是大家变富了&quot;——实际上要扣掉人口增长与价格因素，看人均实际 GDP。\n<\/li><li>\n别以为&quot;二手房交易推高 GDP&quot;——实际上只计中介服务费，房屋本身的转手不计入。\n<\/li><li>\n别以为&quot;政府花的钱都算 GDP&quot;——实际上只有政府购买算，转移支付不算。\n<\/li><li>\n别以为&quot;GDP 包括外国企业在本国的产值不算&quot;——实际上按地理原则，算在本国 GDP 里。\n<\/ul>\n<ol><li>\n（单选）下列哪一项计入当年的 GDP？\n<p>A. 二手车的转手价格  B. 政府发放的失业救济金  C. 新建住宅的建造价值  D. 购买某公司股票 <strong>答案<\/strong>：C；<strong>解析<\/strong>：新建住宅属于投资（I），计入 GDP。二手车只计中介佣金，救济金是转移支付，买股票是资产换手，都不计入。<\/p>\n<\/ol>\n<ol><li>\n（单选）某国名义 GDP 为 550 亿元，按基年价格计算的实际 GDP 为 385 亿元。GDP 平减指数约为？\n<p>A. 100  B. 130  C. 142.9  D. 165 <strong>答案<\/strong>：C；<strong>解析<\/strong>：平减指数 = 名义 ÷ 实际 × 100 = 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高约 43%。<\/p>\n<\/ol>\n<ol><li>\n（单选）支出法下，进口消费品为什么要从总支出中减去？\n<p>A. 因为进口品价格更高  B. 因为它已被计入消费但并非本国生产  C. 因为进口要交关税  D. 因为进口品不计入统计口径 <strong>答案<\/strong>：B；<strong>解析<\/strong>：消费者买进口货时这笔钱算在 C 里，但它不是本国生产的，所以通过 NX = 出口 − 进口 把它扣除。<\/p>\n<\/ol>\n<ol><li>\n（多选）GDP 无法反映下列哪些内容？\n<p>A. 家务劳动的价值  B. 收入分配状况  C. 环境破坏的成本  D. 产品的质量改进 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：GDP 只统计有市场价格的最终产品，不反映分配、环境、家务与质量变化，因此不能等同于福利。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGDP = 境内、一定时期、最终产品、市场价值；中间品、二手交易、转移支付、家务都不计入。\n<\/li><li>\n支出法：GDP = C + I + G + NX，进口要从支出中减去。\n<\/li><li>\n实际 GDP 用基年价格；平减指数 = 名义 ÷ 实际 × 100；通胀率是平减指数的变化率。\n<\/ul>", "kind": "chapter", "title": "第 23 章：一国收入的衡量"}, "ch24": {"html": "<h1>第 24 章：生活费用的衡量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一篮子商品的价格算出 CPI，并说明它和 GDP 平减指数的三点差别。\n<\/li><li>\n说出 CPI 高估通胀的三个原因。\n<\/li><li>\n由名义利率与通胀率算出实际利率，并解释为什么它才影响借款与储蓄的决定。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>CPI 用&quot;固定一篮子商品&quot;跟踪价格变化，回答的是&quot;同样的日子今天贵了多少&quot;；它系统性偏高一点，但仍是调整工资、养老金和利率的基准。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三步算出 CPI<\/h3>\n<ol><li>\n<strong>定篮子<\/strong>：确定一个普通家庭一年买哪些东西、各买多少。这一步由统计部门通过家庭支出调查完成。\n<\/li><li>\n<strong>查价格<\/strong>：每年查这些商品的价格。\n<\/li><li>\n<strong>算指数<\/strong>：CPI = 当期篮子成本 ÷ 基期篮子成本 × 100。\n<\/ol>\n<p>例：篮子是 4 个苹果 + 2 条面包。基年苹果 2 元、面包 3 元，篮子成本 4×2 + 2×3 = 14 元。当期苹果 3 元、面包 4 元，成本 4×3 + 2×4 = 20 元。<\/p>\n<p>CPI = 20 ÷ 14 × 100 ≈ 142.9。比基年高 42.9%。<\/p>\n<p><strong>通胀率<\/strong> = (本期 CPI − 上期 CPI) ÷ 上期 CPI × 100%。若上一期 CPI 为 135，则本期通胀率 ≈ (142.9 − 135) ÷ 135 ≈ 5.9%。<\/p>\n<h3>CPI 与 GDP 平减指数的三点差别<\/h3>\n<table><thead><tr><th><\/th><th>CPI<\/th><th>GDP 平减指数<\/th><\/tr><\/thead><tbody><tr><td>覆盖范围<\/td><td>只含消费者购买的<\/td><td>含全部国内生产的（投资、政府采购、出口）<\/td><\/tr><tr><td>进口品<\/td><td>计入（消费者买进口货）<\/td><td>不计入<\/td><\/tr><tr><td>篮子<\/td><td>固定（基年数量）<\/td><td>随当期产量变化<\/td><\/tr><\/tbody><\/table>\n<p>所以两者数字不一样，用途也不同：CPI 用来调整居民收入，平减指数用来衡量整体价格水平。<\/p>\n<h3>CPI 为什么偏高<\/h3>\n<ol><li>\n<strong>替代偏差<\/strong>：苹果涨价，消费者改买梨。CPI 仍按&quot;4 个苹果&quot;算，高估了生活成本上升。\n<\/li><li>\n<strong>新产品<\/strong>：新商品（手机、网约车）出现后，消费者的选择变多，同样的钱买到更多效用，CPI 篮子没有及时纳入。\n<\/li><li>\n<strong>质量变化<\/strong>：同样价格的东西变好了（手机性能提升），实际是降价，但 CPI 未必调整。\n<\/ol>\n<p>这三点使 CPI 每年高估约 1 个百分点（具体幅度各国不同）。后果是：按 CPI 调整的养老金与工资会略微&quot;超额补偿&quot;。<\/p>\n<h3>指数化<\/h3>\n<p><strong>指数化<\/strong>（indexation）指自动按物价指数调整金额。社保养老金、部分劳动合同、通胀挂钩债券都这么做。<\/p>\n<p>好处：避免通胀侵蚀实际收入。坏处：可能形成&quot;工资—物价螺旋&quot;——物价涨，工资自动涨，成本上升，物价再涨。<\/p>\n<h3>名义利率与实际利率<\/h3>\n<ul><li>\n<strong>名义利率<\/strong>：银行挂牌的利率，比如 5%。\n<\/li><li>\n<strong>实际利率<\/strong>：扣除通胀后的购买力增长，<strong>实际利率 ≈ 名义利率 − 通胀率<\/strong>。\n<\/ul>\n<p>例：名义利率 5%，通胀率 3%，实际利率约 2%。你把 100 元存一年得到 105 元，但这 105 元只能买到相当于去年 102 元的东西。<\/p>\n<p>关键结论：<strong>影响借贷与储蓄决策的是实际利率<\/strong>。若名义利率 8%、通胀 10%，实际利率是 −2%，存钱是亏的。<\/p>\n<h3>名义与实际的换算<\/h3>\n<p>&quot;把过去的钱换算成今天的钱&quot;：今天的金额 = 过去金额 × (今天的价格指数 ÷ 过去的价格指数)。<\/p>\n<p>例：1990 年月薪 200 元，当年 CPI 为 50；今天 CPI 为 250。相当于今天的 200 × 250 ÷ 50 = 1000 元。这样比较才公平。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;CPI 涨了就是我买东西都贵了这么多&quot;——实际上你的消费结构与篮子不同，感受会差很多。\n<\/li><li>\n别以为&quot;CPI 与 GDP 平减指数可以互换&quot;——实际上覆盖范围与篮子都不同，数值不同、用途不同。\n<\/li><li>\n别以为&quot;通胀时只要名义工资涨了就没事&quot;——实际上要看涨幅是否超过物价，实际工资才决定购买力。\n<\/li><li>\n别以为&quot;实际利率 = 名义利率 − 通胀率&quot;永远精确——实际上这是近似公式，精确式为 (1+名义)/(1+通胀) − 1，高通胀时差别明显。\n<\/ul>\n<ol><li>\n（单选）篮子为 4 个苹果与 2 条面包。基年成本 14 元，当期成本 20 元。CPI 约为？\n<p>A. 120  B. 135  C. 142.9  D. 150 <strong>答案<\/strong>：C；<strong>解析<\/strong>：CPI = 20 ÷ 14 × 100 ≈ 142.9，表示价格水平比基年高约 42.9%。<\/p>\n<\/ol>\n<ol><li>\n（单选）CPI 与 GDP 平减指数最重要的差别是？\n<p>A. CPI 只统计消费品，平减指数覆盖全部国内生产  B. CPI 每月公布，平减指数每年公布  C. CPI 不含服务，平减指数含服务  D. 两者完全相同 <strong>答案<\/strong>：A；<strong>解析<\/strong>：CPI 只用消费者篮子（含进口消费品），平减指数覆盖国内生产的全部产品（含投资品与出口），两者数值与用途都不同。<\/p>\n<\/ol>\n<ol><li>\n（单选）名义利率 6%，通胀率 4%，实际利率约为？\n<p>A. 10%  B. 2%  C. 1.5%  D. −2% <strong>答案<\/strong>：B；<strong>解析<\/strong>：实际利率 ≈ 名义利率 − 通胀率 = 2%。影响储蓄与借贷决策的是实际利率，而不是挂牌的名义利率。<\/p>\n<\/ol>\n<ol><li>\n（填空）按物价指数自动调整工资或养老金的做法叫什么？（两个字）\n<p><strong>答案<\/strong>：指数化；<strong>解析<\/strong>：指数化能避免通胀侵蚀实际收入，但可能形成工资与物价互相推动的螺旋。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nCPI = 当期篮子成本 ÷ 基期篮子成本 × 100；三步是定篮子、查价格、算指数。\n<\/li><li>\nCPI 偏高源于替代偏差、新产品、质量变化。\n<\/li><li>\n实际利率 ≈ 名义利率 − 通胀率，影响储蓄与借贷决策的是实际利率。\n<\/ul>", "kind": "chapter", "title": "第 24 章：生活费用的衡量"}, "ch25": {"html": "<h1>第 25 章：生产与增长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「生产率 = 人均产出」解释国家间生活水平差距的来源。\n<\/li><li>\n说出决定生产率的四项因素，并各举一例说明政策如何影响它。\n<\/li><li>\n用 70 法则估算经济翻倍所需年数，并说明追赶效应为什么存在。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个国家的生活水平取决于它的劳动生产率；生产率由物质资本、人力资本、自然资源和技术决定，其中制度与政策能改变的是储蓄、教育、产权与开放。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么有的国家富、有的国家穷<\/h3>\n<p>比较生活水平看<strong>人均实际 GDP<\/strong>。差距可以达到几十倍：美国人均 GDP 是某些非洲国家的 20 倍以上。<\/p>\n<p>解释只有一个核心变量：<strong>生产率<\/strong>（productivity），即每单位劳动投入生产的产出量，写成 Y/L（L 为劳动小时数）。<\/p>\n<p>注意区分：生产率高不等于&quot;工作辛苦&quot;。一个用挖掘机的工人一小时挖的土，比一百个用铁锹的人还多——靠的是工具，不是汗水。<\/p>\n<h3>决定生产率的四项因素<\/h3>\n<p><strong>一、物质资本<\/strong>（physical capital）：工具、机器、厂房、基础设施。人均资本越多，人均产出越高。但资本有<strong>边际收益递减<\/strong>：同样的机器，第 10 台带来的增产小于第 1 台。<\/p>\n<p><strong>二、人力资本<\/strong>（human capital）：劳动者通过教育、培训、经验获得的知识与技能。它与物质资本相似，也是投资出来的，也有边际递减。<\/p>\n<p><strong>三、自然资源<\/strong>：土地、矿产、石油。有资源的国家起点高，但不是决定性的——日本、新加坡资源匮乏却富裕，靠的是前两项与技术。<\/p>\n<p><strong>四、技术知识<\/strong>：<strong>技术知识<\/strong>（technological knowledge）是&quot;怎么生产&quot;的知识，与人力资本不同——人力资本是&quot;人掌握了知识&quot;，技术知识是&quot;知识本身存在&quot;（可能在书里、在专利里）。<\/p>\n<p>区别很关键：一个国家可以引进技术（专利、设备），但人力资本必须自己培养。<\/p>\n<h3>增长政策<\/h3>\n<p><strong>一、储蓄与投资。<\/strong> 资本来自投资，投资来自储蓄。储蓄率高，资本积累快，增长快。代价是当期消费减少。<\/p>\n<p><strong>二、吸引外资。<\/strong> 外国直接投资带来资本与技术；购买本国债券提供资金但不带来技术。两者都能加速资本积累。<\/p>\n<p><strong>三、教育与健康。<\/strong> 教育提升人力资本。健康同样重要——疾病会摧毁人力资本，疟疾、寄生虫病高发地区生产率显著偏低。<\/p>\n<p><strong>四、产权与政治稳定。<\/strong> 没有可靠的产权保护，没人愿意投资。这是制度层面的根本条件，比任何单项政策都重要。<\/p>\n<p><strong>五、自由贸易。<\/strong> 开放让一国专注自己有优势的产业，同时引进技术与设备。 inward-looking（ inward 型）的进口替代政策往往效果不佳。<\/p>\n<p><strong>六、研发。<\/strong> 基础研究的社会回报远高于私人回报，因此需要政府资助（专利制度是一种折中：给暂时垄断换取公开技术）。<\/p>\n<h3>70 法则与追赶效应<\/h3>\n<p><strong>70 法则<\/strong>：若年增长率为 g%，经济翻倍所需年数约为 70 ÷ g。<\/p>\n<ul><li>\n增长 2%：约 35 年翻倍。\n<\/li><li>\n增长 7%：约 10 年翻倍。\n<\/li><li>\n增长 10%：约 7 年翻倍。\n<\/ul>\n<p>这个差距是复利效应，几十年就拉开巨大距离。中国 1978 年后年均近 10% 的增长，四十年就是几十倍的差距。<\/p>\n<p><strong>追赶效应<\/strong>（catch-up effect）：穷国的增长潜力更大，因为资本边际收益递减——穷国资本少，每增加一单位资本的增产效果更明显。这解释了中国、韩国、东南亚在起步阶段的快速增长，也解释了为什么发达国家的增速普遍较低。<\/p>\n<p>但追赶效应不是自动发生的，需要产权、开放、教育这些条件配合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;自然资源丰富就一定富裕&quot;——实际上资源诅咒存在，制度与人力资本更关键。\n<\/li><li>\n别以为&quot;高储蓄率永远好&quot;——实际上储蓄挤占当期消费，过度储蓄会导致产能过剩与消费不足。\n<\/li><li>\n别以为&quot;技术可以随便引进&quot;——实际上技术引进需要本地人力资本吸收，识字率与工程能力是前提。\n<\/li><li>\n别以为&quot;增长率差一点没关系&quot;——实际上复利效应下，2% 与 7% 几十年后是数量级的差距。\n<\/ul>\n<ol><li>\n（单选）70 法则下，年增长 7% 的经济翻倍约需多少年？\n<p>A. 7 年  B. 10 年  C. 20 年  D. 35 年 <strong>答案<\/strong>：B；<strong>解析<\/strong>：70 ÷ 7 = 10 年。增长 2% 则需 35 年，复利效应下差距悬殊。<\/p>\n<\/ol>\n<ol><li>\n（单选）「追赶效应」存在的原因是？\n<p>A. 穷国人口多  B. 穷国资本少，每增加一单位资本的增产效果更明显  C. 穷国技术更好  D. 发达国家不愿意增长 <strong>答案<\/strong>：B；<strong>解析<\/strong>：资本边际收益递减意味着一单位资本在资本存量低的穷国产生更大的产出增量，因此穷国有更快的增长潜力。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪项不是决定生产率的核心因素？\n<p>A. 物质资本  B. 人力资本  C. 货币发行量  D. 技术知识 <strong>答案<\/strong>：C；<strong>解析<\/strong>：生产率由物质资本、人力资本、自然资源与技术决定。货币量影响价格水平，不影响生产率。<\/p>\n<\/ol>\n<ol><li>\n（多选）有利于长期增长的政策包括？\n<p>A. 保护产权与政治稳定  B. 提高储蓄率并投资于资本  C. 普及教育与改善健康  D. 闭关限制进口 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项分别对应制度、资本、人力资本。闭关限制进口通常不利于技术引进与专业化分工。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生活水平由生产率决定：Y/L，靠资本、人力资本、资源、技术。\n<\/li><li>\n政策杠杆：储蓄投资、外资、教育健康、产权稳定、自由贸易、研发。\n<\/li><li>\n70 法则：翻倍年数 ≈ 70 ÷ 增长率；穷国有追赶效应但需制度配合。\n<\/ul>", "kind": "chapter", "title": "第 25 章：生产与增长"}, "ch26": {"html": "<h1>第 26 章：储蓄、投资和金融体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23、25 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分金融市场（债券、股票）与金融中介（银行、共同基金）的功能。\n<\/li><li>\n用可贷资金市场模型说明利率如何由储蓄与投资决定。\n<\/li><li>\n解释政府预算赤字为什么抬高利率、减少投资（挤出效应）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个封闭经济里，储蓄是资金的供给、投资是资金的需求，两者相等处决定利率；政府借得多了，就从私人投资那里挤走资金，利率上升、投资减少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先分清几个词<\/h3>\n<ul><li>\n<strong>储蓄<\/strong>（saving）：收入减去消费，S = Y − C − G。\n<\/li><li>\n<strong>投资<\/strong>（investment）：购买新资本，机器、厂房、住宅。\n<\/li><li>\n日常说的&quot;投资股票&quot;在宏观里不是投资，那是<strong>资产交换<\/strong>，只改变所有权，不创造新资本。\n<\/ul>\n<p>这两者的关系是本章的主线：<strong>储蓄提供资金，投资使用资金<\/strong>。<\/p>\n<h3>金融体系的两种通道<\/h3>\n<p><strong>一、金融市场<\/strong>（financial markets）：直接融资。<\/p>\n<ul><li>\n<strong>债券市场<\/strong>：企业或政府发行债券借钱，承诺按期付息还本。债券的三个特征——期限、信用风险、税收待遇——决定利率高低。期限越长、风险越高，利率越高。\n<\/li><li>\n<strong>股票市场<\/strong>：企业发行股票筹集资金，股东获得剩余收益（分红与涨价）。股票收益高于债券，但风险也高。\n<\/ul>\n<p><strong>二、金融中介<\/strong>（financial intermediaries）：间接融资。<\/p>\n<ul><li>\n<strong>银行<\/strong>：吸收存款、发放贷款。它同时是储户与借款人的中间人。银行的另一功能是创造货币（第 29 章详述）。\n<\/li><li>\n<strong>共同基金<\/strong>（mutual fund）：汇集众人资金，由专业经理投资于股票债券组合。它让小额投资者也能分散风险。\n<\/ul>\n<h3>可贷资金市场<\/h3>\n<p>把全国的储蓄与投资放在一个市场上：<\/p>\n<ul><li>\n<strong>供给<\/strong>：来自储蓄。利率越高，人们越愿意储蓄，供给向右上倾斜。\n<\/li><li>\n<strong>需求<\/strong>：来自投资。利率越高，借款成本越高，投资项目越少，需求向右下倾斜。\n<\/li><li>\n<strong>均衡利率<\/strong>：供给与需求相交处。\n<\/ul>\n<p>这个模型的关键假设是<strong>利率是唯一调节变量<\/strong>，且资金可以自由流动（封闭经济）。<\/p>\n<h3>政策对市场的影响<\/h3>\n<p><strong>一、政府预算赤字。<\/strong> 政府支出大于税收时要借款，这增加了资金需求，需求曲线右移，利率上升，私人投资减少。这就是<strong>挤出效应<\/strong>（crowding out）。<\/p>\n<p>数字例子：原均衡利率 5%、投资 1000 亿。政府赤字 200 亿，需求右移，利率升到 6%，投资降到 900 亿。政府多用 200 亿，私人投资少用 100 亿。<\/p>\n<p><strong>二、税收激励储蓄。<\/strong> 给储蓄利息免税，供给右移，利率下降、投资增加。但实证效果有限——富人本来储蓄就多，减税主要让他们更富，且替代效应与收入效应可能抵消。<\/p>\n<p><strong>三、政府预算盈余。<\/strong> 相反方向：供给增加（政府把钱借出去），利率下降，投资增加。<\/p>\n<h3>一个容易混的点<\/h3>\n<p>&quot;储蓄等于投资&quot;是<strong>会计恒等式<\/strong>（封闭经济 S = I），不是&quot;储蓄者与投资者是同一批人&quot;。储蓄者和投资者通过金融体系连接，利率是价格信号。<\/p>\n<p>在开放经济里这个等式变成 S = I + NX（或 S − I = NCF），第 31 章会展开。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;买股票是投资&quot;——实际上宏观意义上的投资是购买新资本，买股票只是资产转手。\n<\/li><li>\n别以为&quot;储蓄增加一定好&quot;——实际上短期内储蓄增加会减少消费需求，可能造成衰退（节俭悖论）。\n<\/li><li>\n别以为&quot;政府赤字一定挤出投资&quot;——实际上要看经济是否处于充分就业；衰退时闲置资金多，挤出效应弱。\n<\/li><li>\n别以为&quot;利率由央行直接规定&quot;——实际上央行影响短期利率，长期利率由可贷资金市场决定。\n<\/ul>\n<ol><li>\n（单选）在可贷资金市场模型中，资金的供给来自？\n<p>A. 投资  B. 储蓄  C. 政府支出  D. 进口 <strong>答案<\/strong>：B；<strong>解析<\/strong>：储蓄提供可贷资金，投资形成需求；两者相交决定利率。<\/p>\n<\/ol>\n<ol><li>\n（单选）政府预算赤字扩大，在其他条件不变时通常导致？\n<p>A. 利率下降、投资增加  B. 利率上升、私人投资减少  C. 利率不变  D. 储蓄减少、投资增加 <strong>答案<\/strong>：B；<strong>解析<\/strong>：赤字增加资金需求，需求曲线右移，利率上升，部分私人投资被挤出。<\/p>\n<\/ol>\n<ol><li>\n（单选）宏观意义上的「投资」指？\n<p>A. 购买股票  B. 购买债券  C. 购买新机器与厂房  D. 把钱存入银行 <strong>答案<\/strong>：C；<strong>解析<\/strong>：宏观投资指形成新资本（设备、厂房、住宅、库存）；买卖股票债券只是资产转手。<\/p>\n<\/ol>\n<ol><li>\n（多选）金融中介包括？\n<p>A. 商业银行  B. 共同基金  C. 债券发行企业  D. 中央银行 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：银行、共同基金、央行都属于中介类机构；债券发行企业是资金需求方，通过金融市场直接融资。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n金融体系两条通道：金融市场（债券、股票）与金融中介（银行、共同基金）。\n<\/li><li>\n可贷资金市场：储蓄为供给、投资为需求，交点定利率。\n<\/li><li>\n政府赤字抬高利率、减少私人投资，即挤出效应。\n<\/ul>", "kind": "chapter", "title": "第 26 章：储蓄、投资和金融体系"}, "ch27": {"html": "<h1>第 27 章：金融学的基本工具<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 26 章（需基本概率常识）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用现值公式比较不同时间的现金流，并算出一个项目的净现值。\n<\/li><li>\n解释风险厌恶者为什么愿意买期望值为负的保险，以及多元化能消除哪类风险。\n<\/li><li>\n说出基本面分析与有效市场假说的分歧，并说明&quot;市场非理性&quot;的证据来自哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>金融决策只有三个问题：这笔未来的钱今天值多少（现值）、这个风险值不值得承担（风险与收益）、这个资产的价格是否已经反映了所有信息（有效市场）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>现值：钱有时间价值<\/h3>\n<p><strong>现值<\/strong>（present value）是把未来的一笔钱折算成今天的等价金额：<\/p>\n<p><strong>PV = FV ÷ (1 + r)^n<\/strong><\/p>\n<p>FV 是未来金额，r 是利率（贴现率），n 是年数。<\/p>\n<p>例：三年后能拿到 100 万，利率 5%，PV = 100 ÷ 1.05³ ≈ 86.4 万。今天存 86.4 万，三年后正好 100 万。<\/p>\n<p>比较两个项目必须折成现值。A：现在投 100 万，三年后回收 130 万；B：现在投 100 万，五年后回收 150 万。利率 5%。<\/p>\n<ul><li>\nA 的现值 = 130 ÷ 1.05³ ≈ 112.3 万，净现值 12.3 万。\n<\/li><li>\nB 的现值 = 150 ÷ 1.05⁵ ≈ 117.5 万，净现值 17.5 万。\n<\/ul>\n<p>B 更好。看总额会选错，看现值才对。<strong>净现值<\/strong>（NPV）= 现值 − 初始投入，是投资决策的标准判据。<\/p>\n<p>复利的力量：年利率 7%，10 年翻一倍（70 法则）；30 年是 7.6 倍。这也是为什么&quot;早存钱&quot;比&quot;多存钱&quot;更重要。<\/p>\n<h3>风险管理<\/h3>\n<p><strong>风险厌恶<\/strong>（risk aversion）：大多数人偏好确定的中等收益，而不是期望值相同但波动很大的收益。经济学用<strong>效用函数<\/strong>的凹性描述这一点：财富增加带来的效用增量递减，所以损失 1 万元的痛苦大于赚 1 万元的快乐。<\/p>\n<p>由此产生三个工具：<\/p>\n<p><strong>一、保险<\/strong>（insurance）。保险公司把大量独立风险汇集起来，用保费赔付少数不幸者。<\/p>\n<ul><li>\n保费高于期望赔付（要覆盖成本与利润），所以买保险的期望值为负。\n<\/li><li>\n但保险买的是<strong>确定性<\/strong>：把可能摧毁你的大额损失（大病、火灾）换成可承受的小额支出。\n<\/li><li>\n保险市场受<strong>逆向选择<\/strong>（身体差的人更愿投保）与<strong>道德风险<\/strong>（投保后不注意）困扰，所以保险公司用体检、免赔额、共保比例来设计合约。\n<\/ul>\n<p><strong>二、多元化<\/strong>（diversification）。把资金投到不相关的资产上，个别资产的坏结果被其他资产的好结果抵消。<\/p>\n<ul><li>\n能消除<strong>企业特有风险<\/strong>（某公司出问题、某行业衰退）。\n<\/li><li>\n不能消除<strong>市场风险<\/strong>（整体经济下行、利率普涨），因为所有资产同时受冲击。\n<\/ul>\n<p><strong>三、风险与收益的权衡<\/strong>。高预期收益必然伴随高风险。这不是保证——它只是说平均而言，承担更大波动的人获得更高回报。<\/p>\n<h3>资产评估<\/h3>\n<p>一个资产（股票、债券、房产）值多少钱？<\/p>\n<p><strong>基本面分析<\/strong>（fundamental analysis）：估算资产未来能产生的全部现金流，折成现值。股票的价值等于未来分红的现值加上最终售价的现值。这要求预测公司未来的盈利，而预测很难。<\/p>\n<p><strong>有效市场假说<\/strong>（efficient markets hypothesis）：市场价格已经反映了所有公开信息。若成立，则：<\/p>\n<ul><li>\n股价的短期变动不可预测（&quot;随机游走&quot;）。\n<\/li><li>\n主动选股无法稳定跑赢指数，因为价格已包含信息。\n<\/li><li>\n推论：指数基金是多数人的最优选择。\n<\/ul>\n<p><strong>市场非理性<\/strong>：有效市场假说并非无懈可击。<strong>泡沫<\/strong>（bubble）就是价格远超基本面的例子——17 世纪荷兰郁金香、2000 年互联网泡沫、2008 年之前的美国房价。行为经济学（第 22 章）提供了过度自信、锚定、从众等解释。<\/p>\n<p>现实中两种观点各占一半：多数时候价格接近有效，但极端时期会出现系统性偏离。<\/p>\n<h3>一个例子串起来<\/h3>\n<p>某公司股票现价 50 元，你预测明年分红 2 元、届时股价 55 元，贴现率 8%。<\/p>\n<ul><li>\n明年总回报的现值 = (2 + 55) ÷ 1.08 ≈ 52.8 元。\n<\/li><li>\n现价 50 元 &lt; 52.8 元，按基本面分析值得买。\n<\/ul>\n<p>但有效市场假说会提醒你：你的预测若基于公开信息，价格早已包含它。你赚到的，只可能来自&quot;别人没看到的信息&quot;或&quot;你判断得更准&quot;——两者都不容易。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;回收总额越大越划算&quot;——实际上要折成现值，时间越长折损越多。\n<\/li><li>\n别以为&quot;分散投资能消除所有风险&quot;——实际上市场风险无法分散。\n<\/li><li>\n别以为&quot;买保险是亏的&quot;——实际上它买的是对灾难的确定性，对无法承受的损失是理性的。\n<\/li><li>\n别以为&quot;有效市场假说证明了价格永远正确&quot;——实际上它说的是&quot;价格已反映公开信息&quot;，泡沫说明它可以失灵。\n<\/ul>\n<ol><li>\n（单选）三年后获得 100 万元，贴现率 5%，现值约为？\n<p>A. 85 万  B. 86.4 万  C. 95 万  D. 115 万 <strong>答案<\/strong>：B；<strong>解析<\/strong>：PV = 100 ÷ 1.05³ ≈ 86.4 万元；今天的 86.4 万按 5% 复利三年正好变成 100 万。<\/p>\n<\/ol>\n<ol><li>\n（单选）分散化投资能消除哪类风险？\n<p>A. 市场风险  B. 个别企业或行业的风险  C. 通货膨胀风险  D. 利率风险 <strong>答案<\/strong>：B；<strong>解析<\/strong>：企业特有风险可通过持有不相关资产抵消；市场风险影响全部资产，分散无法消除。<\/p>\n<\/ol>\n<ol><li>\n（单选）保险的期望赔付通常低于保费，为什么人们还买？\n<p>A. 因为保险公司会返还  B. 因为保险买的是对灾难的确定性，大额损失无法承受  C. 因为保费可以抵税  D. 因为保单可以转卖 <strong>答案<\/strong>：B；<strong>解析<\/strong>：保险把不确定的大额损失换成确定的小额支出，对无法承受灾难的人是理性选择，尽管期望值为负。<\/p>\n<\/ol>\n<ol><li>\n（单选）有效市场假说若成立，下列哪项推论最直接？\n<p>A. 主动选股难以稳定跑赢指数  B. 股票价格永远不波动  C. 公司分红必然增加  D. 利率会下降 <strong>答案<\/strong>：A；<strong>解析<\/strong>：价格已反映公开信息，短期变动不可预测，因此被动指数投资在多数人身上优于主动选股。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nPV = FV ÷ (1+r)^n；比较项目用净现值，不比总额。\n<\/li><li>\n保险买确定性（期望值为负），多元化消除企业特有风险、不消除市场风险。\n<\/li><li>\n基本面分析算现值，有效市场假说认为价格已反映信息，泡沫是反例。\n<\/ul>", "kind": "chapter", "title": "第 27 章：金融学的基本工具"}, "ch28": {"html": "<h1>第 28 章：失业<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 18、23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用失业率与劳动参与率的定义算出一个经济体的失业状况，并指出这两个指标的局限。\n<\/li><li>\n区分摩擦性、结构性与周期性失业，说明各自的对策。\n<\/li><li>\n解释最低工资、工会、效率工资如何把工资抬到均衡之上并增加失业。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>失业不是一个数字，而是几种性质完全不同的问题叠在一起：找工作的过渡期（摩擦）、技能与岗位不匹配（结构）、经济衰退（周期），再加上把工资抬高的制度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>怎么算<\/h3>\n<ul><li>\n<strong>劳动力<\/strong> = 就业人数 + 失业人数。\n<\/li><li>\n<strong>失业率<\/strong> = 失业人数 ÷ 劳动力 × 100%。\n<\/li><li>\n<strong>劳动参与率<\/strong> = 劳动力 ÷ 成年人口 × 100%。\n<\/ul>\n<p>关键点：<strong>不找工作的人不算失业<\/strong>。长期找不到工作而放弃求职的人（<strong>沮丧工人<\/strong>）退出劳动力，失业率反而下降。这是指标最大的漏洞。<\/p>\n<p>另一个漏洞是<strong>隐性就业不足<\/strong>：打零工、兼职但想找全职的人，被算作就业。<\/p>\n<h3>失业的三种类型<\/h3>\n<p><strong>一、摩擦性失业<\/strong>（frictional unemployment）：在换工作、刚毕业找工作期间的过渡性失业。它是劳动市场正常运转的副产品——信息不完美、匹配需要时间。任何经济都有，且无法消除，只能缩短（更好的招聘平台、职业介绍）。<\/p>\n<p><strong>二、结构性失业<\/strong>（structural unemployment）：岗位需要的技能与求职者拥有的技能不匹配，或岗位在地区上错配。比如煤矿关闭后矿工不会写代码。它与总需求无关，靠培训、迁移、产业政策解决，耗时最长。<\/p>\n<p><strong>三、周期性失业<\/strong>（cyclical unemployment）：经济衰退导致总需求不足而出现的失业。它是宏观政策（货币与财政）的目标，第 33–34 章会讲。<\/p>\n<p><strong>自然失业率<\/strong> = 摩擦性 + 结构性失业对应的失业率，是经济在正常运转时的失业水平（各国通常估计在 4%–6%）。<\/p>\n<h3>工资为什么会被抬到均衡之上<\/h3>\n<p>如果工资完全由供需决定，失业就只是过渡性的。但现实中工资常高于均衡，造成持续的<strong>结构性失业<\/strong>：<\/p>\n<p><strong>一、最低工资法。<\/strong> 对低技能劳动者，最低工资高于市场均衡，企业雇的人少于均衡量，多出来的人找不到工作。影响集中在青少年与低教育水平人群。<\/p>\n<p><strong>二、工会。<\/strong> 集体谈判把工资抬到均衡之上。结果是工会成员保住高工资，非成员就业机会被挤压，形成&quot;局内人—局外人&quot;分割。<\/p>\n<p><strong>三、效率工资。<\/strong> 企业主动给高于市场的工资，理由是：员工吃得好体力更足、流动率低、能招到能力更强的人、偷懒的代价变大。好处归企业，代价是有一部分人愿意在这个工资下工作却找不到岗位。<\/p>\n<h3>失业保险<\/h3>\n<p><strong>失业保险<\/strong>（unemployment insurance）给失业者一部分收入补偿。它保护了失业者的生活，但也降低了找工作的紧迫感，延长了失业持续时间。<\/p>\n<p>这不是说保险不好，而是设计要在&quot;保障&quot;与&quot;激励&quot;之间取舍：给付期限越长、替代率越高，搜寻时间越长。<\/p>\n<h3>失业的持续时间<\/h3>\n<p>平均失业持续时间越长，问题越严重。数据上通常呈现&quot;少数人长期失业、多数人短期失业&quot;的分布：大部分人几周内找到工作，一小部分人失业超过半年，这部分人占了总失业人天的大多数。<\/p>\n<p>长期失业者更难再就业：技能退化、雇主对空档期的疑虑、失去社会联系。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;失业率下降就是好消息&quot;——实际上可能是沮丧工人退出劳动力，劳动参与率同时下降。\n<\/li><li>\n别以为&quot;失业都是因为懒&quot;——实际上大部分是匹配摩擦与结构调整，找工作时间长短取决于信息与技能匹配。\n<\/li><li>\n别以为&quot;提高最低工资只是让穷人受益&quot;——实际上它可能减少低技能岗位，代价由找不到工作的人承担。\n<\/li><li>\n别以为&quot;自然失业率是零&quot;——实际上总有摩擦性失业，零失业既不现实也不必要。\n<\/ul>\n<ol><li>\n（单选）劳动力 1000 万，失业 60 万，失业率是？\n<p>A. 6%  B. 6.4%  C. 5.6%  D. 无法计算 <strong>答案<\/strong>：A；<strong>解析<\/strong>：失业率 = 60 ÷ 1000 = 6%。注意分母是劳动力，不包含不找工作的人。<\/p>\n<\/ol>\n<ol><li>\n（单选）矿工因煤矿关闭而失去工作，又不会其他技能，这属于？\n<p>A. 摩擦性失业  B. 结构性失业  C. 周期性失业  D. 季节性失业 <strong>答案<\/strong>：B；<strong>解析<\/strong>：技能与岗位需求不匹配属于结构性失业，需要培训或迁移来解决，耗时最长。<\/p>\n<\/ol>\n<ol><li>\n（单选）大量失业者放弃求职退出劳动力，会造成？\n<p>A. 失业率上升  B. 失业率下降但劳动参与率也下降  C. 失业率不变  D. 自然失业率上升 <strong>答案<\/strong>：B；<strong>解析<\/strong>：退出劳动力后不再计入失业人数，失业率下降，但劳动参与率同步下降，真实就业状况被掩盖。<\/p>\n<\/ol>\n<ol><li>\n（多选）把工资抬到均衡之上、造成结构性失业的因素包括？\n<p>A. 最低工资法  B. 工会集体谈判  C. 效率工资  D. 职业介绍所 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三种都直接抬高工资；职业介绍所降低搜寻摩擦，属于缓解摩擦性失业的措施。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n失业率 = 失业 ÷ 劳动力；放弃求职者退出劳动力，会低估真实失业。\n<\/li><li>\n三类失业：摩擦（过渡）、结构（技能错配）、周期（需求不足）；自然失业率 = 前两者。\n<\/li><li>\n最低工资、工会、效率工资把工资抬到均衡之上，制造结构性失业。\n<\/ul>", "kind": "chapter", "title": "第 28 章：失业"}, "ch29": {"html": "<h1>第 29 章：货币制度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 26 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出货币的三项职能，并用「流动性」解释为什么现金比存款更&quot;像货币&quot;。\n<\/li><li>\n用部分准备金制度与准备金率算出货币乘数，解释一笔存款如何变成多笔货币。\n<\/li><li>\n说明央行调节货币供给的三种工具，以及各自的局限。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>现代货币不是金银，而是&quot;央行发的现金 + 银行体系里的存款&quot;；银行每放一笔贷款就创造出新的存款，所以货币供给由准备金率与央行的操作共同决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>货币是什么<\/h3>\n<p><strong>货币<\/strong>（money）是社会中被广泛接受用作交易媒介的东西。三项职能：<\/p>\n<ol><li>\n<strong>交换媒介<\/strong>：买东西时别人愿意收。这一条最关键。\n<\/li><li>\n<strong>计价单位<\/strong>：标价用同一把尺子，避免&quot;一只鸡换几斤米&quot;的换算麻烦。\n<\/li><li>\n<strong>价值储藏<\/strong>：把购买力留到以后用。通胀会削弱这项职能。\n<\/ol>\n<p><strong>流动性<\/strong>（liquidity）指一项资产转换为交换媒介的容易程度。现金流动性最高，活期存款次之，房产最低。货币供给通常按流动性分层：<\/p>\n<ul><li>\n<strong>M1<\/strong>：现金 + 活期存款（最狭义的货币）\n<\/li><li>\n<strong>M2<\/strong>：M1 + 定期存款、货币市场基金等\n<\/ul>\n<h3>从商品货币到法定货币<\/h3>\n<p><strong>商品货币<\/strong>（commodity money）本身有内在价值，如金币、银币、香烟（战俘营里当过货币）。 <strong>法定货币<\/strong>（fiat money）没有内在价值，靠政府法令与公众信任流通。人民币、美元都是法定货币。<\/p>\n<p>法定货币的风险在于：一旦信任崩塌（恶性通胀），它就迅速失去货币职能。<\/p>\n<h3>央行与银行体系<\/h3>\n<p>中央银行（中国人民银行、美联储）负责发行货币、管理银行体系、调控货币供给。<\/p>\n<p>关键概念：<\/p>\n<ul><li>\n<strong>准备金<\/strong>（reserves）：银行吸收的存款中不贷出、留在手里的部分（库存现金 + 在央行的存款）。\n<\/li><li>\n<strong>准备金率<\/strong>（reserve ratio）：准备金占存款的比例，用 R 表示。\n<\/li><li>\n<strong>部分准备金银行制度<\/strong>（fractional-reserve banking）：银行只留一部分存款作准备金，其余贷出。\n<\/ul>\n<h3>货币是怎么被&quot;创造&quot;出来的<\/h3>\n<p>例：准备金率 10%。<\/p>\n<ol><li>\n甲把 1000 元现金存入 A 银行。A 留 100 元准备金，贷出 900 元给乙。\n<\/li><li>\n乙把 900 元存入 B 银行。B 留 90 元，贷出 810 元。\n<\/li><li>\n这样循环下去。\n<\/ol>\n<p>最初只有 1000 元现金，最终存款总额为： 1000 + 900 + 810 + 729 + … = 1000 ÷ 0.1 = 10000 元。<\/p>\n<p><strong>货币乘数<\/strong> = 1 ÷ 准备金率 = 10。准备金率 10%，每 1 元准备金支撑 10 元存款。<\/p>\n<p>注意：货币供给 = 现金 + 存款，所以增加的这部分主要是存款。贷款并没有&quot;凭空印钱&quot;，它创造的是<strong>存款<\/strong>，同时创造了对等的负债。<\/p>\n<p>现实中的乘数比 1/R 小，因为：有人把贷款取成现金不再存回、银行自愿多留准备金、有些存款不进入可贷体系。<\/p>\n<h3>央行的三种工具<\/h3>\n<p><strong>一、公开市场操作<\/strong>（open-market operations）：央行在市场上买进或卖出政府债券。买进 → 向银行体系注入准备金 → 货币供给增加；卖出相反。这是最常用、最灵活的工具。<\/p>\n<p><strong>二、调整准备金率<\/strong>：降低准备金率 → 乘数变大 → 货币供给增加。缺点是作用猛烈、频繁调整会扰乱银行经营，因此很少动用。<\/p>\n<p><strong>三、调整利率<\/strong>（贴现率、再贷款利率）：影响银行借入准备金的成本。现代央行更多通过利率走廊与政策利率引导，而非直接规定。<\/p>\n<h3>央行独立性问题<\/h3>\n<p>央行如果受政治控制，政府可能要求它印钱填补赤字，导致通胀。因此多数国家让央行相对独立，只对物价稳定负责。<\/p>\n<p>代价是：央行不受选举约束，其决策的民主问责较弱。这是&quot;独立&quot;与&quot;问责&quot;之间的取舍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;只有央行能创造货币&quot;——实际上商业银行通过放贷创造存款，也在创造货币。\n<\/li><li>\n别以为&quot;准备金率 10% 就意味着货币供给只能是准备金的 10 倍&quot;——实际上这是理论上限，现实中乘数更小。\n<\/li><li>\n别以为&quot;存款是银行保管的钱&quot;——实际上它是对银行的债权，银行把它贷出去生息。\n<\/li><li>\n别以为&quot;央行印钱就能让所有人变富&quot;——实际上它只改变价格水平与分配，不创造真实产出（第 30 章）。\n<\/ul>\n<ol><li>\n（单选）货币三项职能中最关键的是？\n<p>A. 交换媒介  B. 计价单位  C. 价值储藏  D. 保值增值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：被广泛接受作为交换媒介是货币的本质特征；计价单位与价值储藏是派生的功能。<\/p>\n<\/ol>\n<ol><li>\n（单选）准备金率为 10%，最初存入 1000 元，理论上银行体系最终可形成的存款总额约为？\n<p>A. 1000 元  B. 10000 元  C. 1900 元  D. 1100 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：货币乘数 = 1 ÷ 0.1 = 10，1000 × 10 = 10000 元。现实中因现金漏出与超额准备金，实际数值更小。<\/p>\n<\/ol>\n<ol><li>\n（单选）央行在公开市场买进政府债券的直接效果是？\n<p>A. 减少银行体系准备金  B. 增加银行体系准备金，货币供给增加  C. 提高准备金率  D. 减少货币供给 <strong>答案<\/strong>：B；<strong>解析<\/strong>：央行买入债券付出资金，银行体系准备金增加，通过乘数放大为更多存款，货币供给上升。<\/p>\n<\/ol>\n<ol><li>\n（填空）资产转换成交换媒介的容易程度叫什么？（三个字）\n<p><strong>答案<\/strong>：流动性；<strong>解析<\/strong>：现金流动性最高，活期存款次之，房产最低。M1、M2 的划分就是按流动性排序。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n货币三职能：交换媒介、计价单位、价值储藏；流动性决定什么算 M1、M2。\n<\/li><li>\n部分准备金制度下货币乘数 = 1 ÷ 准备金率，银行放贷创造存款。\n<\/li><li>\n央行三大工具：公开市场操作、准备金率、利率；公开市场操作最常用。\n<\/ul>", "kind": "chapter", "title": "第 29 章：货币制度"}, "ch30": {"html": "<h1>第 30 章：货币增长与通货膨胀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 24、29 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用货币数量方程解释长期通胀为什么源于货币增长。\n<\/li><li>\n说清「通货膨胀使所有人变穷」为什么是谬误，并列出通胀的五项真实成本。\n<\/li><li>\n解释古典二分法、货币中性，以及费雪效应。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>长期看物价水平由货币量决定：货币发得比产出增长快，多出来的钱只推高价格、不提高真实产出；通胀不是让所有人变穷，而是让钱变得不好用，并在债权人与债务人之间重新分配。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>物价水平与货币价值<\/h3>\n<p>先说一个反直觉的等价：<strong>物价水平上升 = 货币价值下降<\/strong>。同样 100 元，物价翻倍后只能买到原来一半的东西。所以&quot;治理通胀&quot;和&quot;维护货币购买力&quot;是同一件事。<\/p>\n<p>货币的供给由央行与银行体系决定（第 29 章）；货币的需求来自人们想持有多少现金与存款用于日常交易。两者相等时，货币市场均衡，决定物价水平。<\/p>\n<h3>货币注入的影响<\/h3>\n<p>假设央行印钱发给每个人。短期内每个人手里的钱变多了，但商店里的商品没变多。钱多了，竞争同样的商品，价格被抬上去。<\/p>\n<p>推到均衡：货币量翻倍，物价水平也大致翻倍，每单位货币的购买力减半。真实产出、就业、实际工资都不变。<\/p>\n<p>这个结论叫<strong>货币中性<\/strong>（monetary neutrality）：货币量的变化只影响名义变量（物价、名义工资、名义 GDP），不影响真实变量（实际产出、实际工资、就业）。<\/p>\n<p><strong>古典二分法<\/strong>（classical dichotomy）是把经济变量分成两类来分析的做法：<\/p>\n<ul><li>\n<strong>名义变量<\/strong>：用货币计量的量，物价、名义工资、名义利率。\n<\/li><li>\n<strong>真实变量<\/strong>：用实物计量的量，产量、实际工资、实际利率、就业。\n<\/ul>\n<p>古典经济学认为这两组变量互不影响。这在一百多年前是主流，在大萧条后被短期分析推翻，但在<strong>长期<\/strong>仍然成立：第 33 章会讲，短期货币量能影响产量，长期不能。<\/p>\n<h3>货币数量论<\/h3>\n<p><strong>货币数量方程<\/strong>：<strong>M × V = P × Y<\/strong><\/p>\n<ul><li>\nM：货币量\n<\/li><li>\nV：货币流通速度（同一笔钱一年被用于交易的次数）\n<\/li><li>\nP：物价水平\n<\/li><li>\nY：实际产出\n<\/ul>\n<p>改写为 P = (M × V) ÷ Y。若 V 稳定、Y 由生产率与技术决定（长期增长有限），则 <strong>P 的变化主要由 M 决定<\/strong>。<\/p>\n<p>数字例子：M 增长 20%，Y 增长 3%，V 不变，则 P 上涨约 16.5%（1.20 ÷ 1.03 − 1 ≈ 0.165）。<\/p>\n<p>这就是&quot;通胀是货币现象&quot;的准确含义：不是说每次涨价都怪央行，而是说<strong>持续、普遍的物价上涨<\/strong>必须有货币扩张支撑。单种商品涨价是相对价格变化，不是通胀。<\/p>\n<h3>通胀税<\/h3>\n<p>政府印钱花，等于向所有持有货币的人征税：你手里的钱没变，但能买到的东西少了。这笔&quot;税&quot;不需立法、不需申报，所以叫<strong>通胀税<\/strong>（inflation tax），是&quot;最隐蔽的税&quot;。<\/p>\n<p>谁承担得多？持有现金多、收入固定的人。所以通胀税是<strong>累退的<\/strong>——穷人财富中现金占比高。<\/p>\n<h3>通胀的成本<\/h3>\n<p><strong>先排除一个谬误<\/strong>：通胀并不让所有人变穷。物价涨了，工资、租金、利润通常也在涨。真实购买力取决于<strong>收入涨幅与物价涨幅的比较<\/strong>。说&quot;通胀使人人变穷&quot;，混淆了名义与实际。<\/p>\n<p>真实成本有五项：<\/p>\n<ol><li>\n<strong>皮鞋成本<\/strong>（shoe-leather cost）：为减少现金贬值损失，人们更频繁跑银行取钱。这是时间与便利的消耗。\n<\/li><li>\n<strong>菜单成本<\/strong>（menu cost）：改价签、重印菜单、更新系统。通胀越高，改价越频繁。\n<\/li><li>\n<strong>相对价格的混乱与资源配置不当<\/strong>：所有价格都在动，企业难以判断&quot;是我产品变贵了还是整体物价涨了&quot;，价格信号被噪声淹没，投资与生产决策失准。\n<\/li><li>\n<strong>税收扭曲<\/strong>：税制按名义金额征收。通胀让名义资本利得变大，即使实际没有增值也要缴税；利息所得同样被虚增。\n<\/li><li>\n<strong>未预期通胀造成的任意财富再分配<\/strong>：债权人受损、债务人受益；储蓄者受损、借款买房者受益。这种再分配没有道理，破坏信任与合约基础。\n<\/ol>\n<h3>费雪效应<\/h3>\n<p><strong>名义利率 ≈ 实际利率 + 通胀率<\/strong>。通胀上升时，贷款人要求更高的名义利率以保住实际回报，于是名义利率随通胀同步上升——这叫<strong>费雪效应<\/strong>（Fisher effect）。<\/p>\n<p>重要含义：<strong>通胀不会让债务人凭空受益<\/strong>。若合同已按预期通胀调整，这个好处被利率抵消。只有<strong>意料之外<\/strong>的通胀才会重新分配财富。<\/p>\n<h3>通缩可能更坏<\/h3>\n<p>物价持续下跌听起来是好事，但有两个麻烦：<\/p>\n<ul><li>\n<strong>债务负担加重<\/strong>：名义债务不变，物价下跌使实际债务变重，借款人被迫削减支出，形成恶性循环（债务-通缩螺旋）。\n<\/li><li>\n<strong>推迟消费<\/strong>：预期明天更便宜，今天就不买，需求进一步萎缩。\n<\/ul>\n<p>所以央行的目标通常是<strong>温和的正通胀<\/strong>（如 2%），而不是零或负。<\/p>\n<p><strong>恶性通胀<\/strong>（hyperinflation）是极端情形：物价每月翻倍，货币失去交换媒介职能，人们回到以物易物。德国 1923 年、津巴布韦 2008 年的共同原因都是政府靠印钞填补巨额财政赤字。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;通胀让所有人都变穷&quot;——实际上收入通常同步上涨，真实损失来自相对价格混乱与财富再分配。\n<\/li><li>\n别以为&quot;通胀让债务人受益&quot;——实际上只有未预期部分如此，已预期部分被名义利率抵消。\n<\/li><li>\n别以为&quot;某样东西涨价就是通胀&quot;——实际上通胀是普遍物价水平上升。\n<\/li><li>\n别以为&quot;印钱能提高真实产出&quot;——实际上长期只推高价格（货币中性），短期才有刺激效果。\n<\/ul>\n<ol><li>\n（单选）货币量增长 20%，实际产出增长 3%，流通速度不变，物价大致上涨？\n<p>A. 3%  B. 17%  C. 20%  D. 23% <strong>答案<\/strong>：B；<strong>解析<\/strong>：P = MV/Y，变化率约 1.20 ÷ 1.03 − 1 ≈ 16.5%，四舍五入约 17%。<\/p>\n<\/ol>\n<ol><li>\n（单选）费雪效应的内容是？\n<p>A. 通胀上升时名义利率随之上升  B. 通胀上升时名义利率下降  C. 实际利率永远不变  D. 货币量与物价无关 <strong>答案<\/strong>：A；<strong>解析<\/strong>：贷款人要求名义利率覆盖预期通胀，因此名义利率 = 实际利率 + 通胀率，二者同向变动。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪一项不是通胀的成本？\n<p>A. 皮鞋成本  B. 菜单成本  C. 税制扭曲  D. 产出必然下降 <strong>答案<\/strong>：D；<strong>解析<\/strong>：通胀的成本主要是皮鞋成本、菜单成本、税制扭曲、相对价格混乱与财富再分配；通胀本身不必然导致产出下降。<\/p>\n<\/ol>\n<ol><li>\n（多选）关于通胀税，正确的说法是？\n<p>A. 靠印钞为支出融资，等于向持币者征税  B. 无需立法即可征收，因此隐蔽  C. 对持有现金比例高的低收入者更不利  D. 它只影响富人 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：通胀税隐蔽且累退，低收入者财富中现金占比更高，承担的比例更大。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMV = PY；长期通胀由货币增长超过产出增长造成；货币中性只对长期成立。\n<\/li><li>\n通胀五项成本：皮鞋、菜单、相对价格混乱、税制扭曲、财富再分配。\n<\/li><li>\n费雪效应：名义利率随预期通胀上升；只有意外通胀才重新分配财富。\n<\/ul>", "kind": "chapter", "title": "第 30 章：货币增长与通货膨胀"}, "ch31": {"html": "<h1>第 31 章：开放经济的基本概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23、26 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清净出口、资本净流出、储蓄与投资之间的恒等关系。\n<\/li><li>\n区分名义汇率与实际汇率，并用两国物价算出实际汇率。\n<\/li><li>\n用购买力平价解释长期汇率的走向，并指出它的失效条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个国家和一个人一样：花得比挣得多就要借（贸易逆差对应资本净流入），挣得比花得多就借给别人（贸易顺差对应资本净流出）；汇率就是两种货币的兑换比例，长期由物价水平支撑。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个概念与一个恒等式<\/h3>\n<ul><li>\n<strong>净出口<\/strong>（NX）= 出口 − 进口。也叫<strong>贸易余额<\/strong>。为正叫贸易顺差，为负叫贸易逆差。\n<\/li><li>\n<strong>资本净流出<\/strong>（NCF）= 本国居民购买外国资产的支出 − 外国人购买本国资产的支出。钱流出本国去买外国资产，就是资本净流出。\n<\/li><li>\n<strong>恒等关系<\/strong>：<strong>NX = NCF<\/strong>。\n<\/ul>\n<p>为什么？用会计恒等式推：一国生产的总产出 Y 有三种用途——消费 C、投资 I、净出口 NX，即 Y = C + I + G + NX。而储蓄 S = Y − C − G。代入得 S = I + NX，即 <strong>NX = S − I<\/strong>。<\/p>\n<p>含义：一个国家的贸易顺差，等于它储蓄超过投资的部分——多出来的钱借给了外国（资本净流出）。贸易逆差则相反：投资超过储蓄，差额靠外国资金补上（资本净流入）。<\/p>\n<p>日本、德国长期贸易顺差，同时是资本净流出国（买美国国债）；美国长期贸易逆差，同时是资本净流入国。这不是巧合，是同一件事的两面。<\/p>\n<h3>汇率<\/h3>\n<p><strong>名义汇率<\/strong>（nominal exchange rate）：两种货币的兑换比率。写&quot;7 元人民币兑 1 美元&quot;，或用 e 表示&quot;1 美元能换多少人民币&quot;。<\/p>\n<p><strong>升值<\/strong>（appreciation）：本币能换更多外币。<strong>贬值<\/strong>（depreciation）：本币能换更少外币。<\/p>\n<p><strong>实际汇率<\/strong>（real exchange rate）：两国商品的相对价格。公式：<\/p>\n<p><strong>实际汇率 = 名义汇率 × 国内物价水平 ÷ 国外物价水平<\/strong><\/p>\n<p>例：名义汇率 7（元/美元），中国物价指数 110，美国物价指数 100，则实际汇率 = 7 × 110 ÷ 100 = 7.7。这表示&quot;用美国商品衡量的中国商品价格&quot;上升了 10%——中国商品变贵了。<\/p>\n<p>实际汇率上升 → 本国商品相对变贵 → 出口竞争力下降 → 净出口减少。这是理解贸易余额变化的关键链条。<\/p>\n<h3>购买力平价<\/h3>\n<p><strong>购买力平价<\/strong>（purchasing power parity, PPP）：同样的商品在各国应该卖同样的价格（换算后）。若 1 美元在美国买 1 个汉堡，在中国买同款汉堡要 7 元，那么汇率应该是 7 元/美元。<\/p>\n<p>理论依据是<strong>套利<\/strong>：如果价格差太多，人们会跨国搬运商品，把价格拉平。<\/p>\n<p><strong>为什么现实中不完全成立<\/strong>：<\/p>\n<ul><li>\n很多商品与服务无法搬运（理发、房租、医疗）。\n<\/li><li>\n关税、运输成本、贸易壁垒。\n<\/li><li>\n不同国家的消费篮子不同（巴拉萨—萨缪尔森效应：富裕国家服务价格更高）。\n<\/ul>\n<p>所以 PPP 在长期、可贸易商品上有一定解释力，短期几乎无效。经济学人杂志的&quot;巨无霸指数&quot;就是 PPP 的通俗版本。<\/p>\n<h3>贸易政策<\/h3>\n<p>关税、进口配额、出口补贴都会改变贸易量，但<strong>不改变总体的储蓄—投资差额<\/strong>，因此不改变 NX（第 32 章会展开）。它们改变的是贸易的构成：从哪进口、出口什么。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;贸易逆差说明国家被占便宜&quot;——实际上逆差对应资本净流入，外国资金在为本国投资提供融资。\n<\/li><li>\n别以为&quot;出口越多越好&quot;——实际上出口是产出的一部分被外国消费，进口才是本国居民实际享受的商品。\n<\/li><li>\n别以为&quot;汇率升值一定是好事&quot;——实际上本币升值使出口变贵、进口变便宜，打击出口部门、有利消费者。\n<\/li><li>\n别以为&quot;购买力平价随时成立&quot;——实际上它在短期几乎无效，长期也只对可贸易商品成立。\n<\/ul>\n<ol><li>\n（单选）一国净出口为正（贸易顺差），意味着？\n<p>A. 该国的储蓄超过投资，资金净流出  B. 该国的投资超过储蓄，资金净流入  C. 该国一定有资本外逃  D. 该国货币一定升值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：由 NX = S − I，顺差意味储蓄大于投资，多出的资金借给外国，形成资本净流出。顺差与资本净流出是同一件事的两面。<\/p>\n<\/ol>\n<ol><li>\n（单选）名义汇率 7 元/美元，中国物价指数 110，美国 100。实际汇率是？\n<p>A. 7.0  B. 7.7  C. 6.4  D. 0.7 <strong>答案<\/strong>：B；<strong>解析<\/strong>：实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价 = 7 × 110 ÷ 100 = 7.7，表示中国商品相对变贵。<\/p>\n<\/ol>\n<ol><li>\n（单选）购买力平价理论在现实中不完全成立，主要原因是？\n<p>A. 各国货币不同  B. 许多商品与服务无法跨国搬运，且存在壁垒  C. 汇率由政府规定  D. 各国人口不同 <strong>答案<\/strong>：B；<strong>解析<\/strong>：理发、房租、医疗等服务不可贸易，加上关税与运输成本，套利无法把价格拉平，因此 PPP 只在长期、可贸易品上部分成立。<\/p>\n<\/ol>\n<ol><li>\n（填空）衡量两国商品相对价格、等于名义汇率乘两国物价之比的汇率叫什么？（四个字）\n<p><strong>答案<\/strong>：实际汇率；<strong>解析<\/strong>：实际汇率衡量本国商品的相对价格，决定出口竞争力。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nNX = NCF；由 S = I + NX 得 NX = S − I，贸易顺差等于储蓄超过投资的部分。\n<\/li><li>\n实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价，衡量本国商品的相对价格。\n<\/li><li>\nPPP 长期对可贸易品有解释力，短期无效；贸易政策改变构成而非总量。\n<\/ul>", "kind": "chapter", "title": "第 31 章：开放经济的基本概念"}, "ch32": {"html": "<h1>第 32 章：开放经济的宏观经济理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 26、31 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「可贷资金市场 + 外汇市场」两个市场解释汇率与资本流动如何同时均衡。\n<\/li><li>\n推演预算赤字、贸易政策、资本外逃三类冲击的连锁反应。\n<\/li><li>\n说明为什么贸易政策减少进口却不会改善贸易余额。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>开放经济有两个联动的市场：国内利率由可贷资金市场决定，汇率由外汇市场决定，而连接两者的是资本净流出——利率一变，资本流动就变，汇率跟着变，净出口再被推着变。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个市场，一条链<\/h3>\n<p><strong>第一个市场：可贷资金市场。<\/strong> 供给是国民储蓄，需求是投资加资本净流出（国内资金的两条去处：买本国设备，或买外国资产）。<\/p>\n<ul><li>\n利率是价格。利率越高，投资越少，资本净流出也越少（外国资产回报显得不划算）。\n<\/ul>\n<p><strong>第二个市场：外汇市场。<\/strong> 供给是资本净流出（本国人要买外国资产，需要外币，于是抛本币），需求是外国人对本国商品与资产的需求（他们要买本国货，需要本币）。<\/p>\n<ul><li>\n汇率是价格。本币越贵，出口越贵、进口越便宜，净出口越少。\n<\/ul>\n<p><strong>连接链条<\/strong>： 利率 → 资本净流出 → 外汇市场供求 → 汇率 → 净出口<\/p>\n<p>这条链是本章所有推演的基础。记住方向：利率上升 → 资本净流出减少 → 本币需求减少（或供给增加）→ 本币贬值 → 出口变便宜 → 净出口增加。<\/p>\n<p>等等，这里容易绕错，用一个标准推演验证：政府赤字。<\/p>\n<ol><li>\n政府借得多了 → 可贷资金需求右移 → 利率上升。\n<\/li><li>\n利率上升 → 资本净流出减少（本国资金更愿意留在国内）。\n<\/li><li>\n资本净流出减少 → 外汇市场上本币供给减少 → 本币升值。\n<\/li><li>\n本币升值 → 出口变贵、进口变便宜 → 净出口减少（贸易赤字扩大）。\n<\/ol>\n<p>这条链的结果是：赤字 → 利率升 → 本币升 → 贸易逆差扩大。美国 1980 年代的&quot;双赤字&quot;就是这一模式的经验版本。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[政府预算赤字增加] --&gt; B[可贷资金需求右移]\n    B --&gt; C[国内利率上升]\n    C --&gt; D[资本净流出减少]\n    D --&gt; E[外汇市场本币供给减少]\n    E --&gt; F[本币升值]\n    F --&gt; G[出口变贵 进口变便宜]\n    G --&gt; H[净出口减少 贸易逆差扩大]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链有五个环节，任一环节断开，结论就不成立。比如经济处于深度衰退、利率已经接近零，赤字不会推高利率，链条第一步就断了，后面的升值与逆差也不会发生。<\/p>\n<h3>三类冲击<\/h3>\n<p><strong>一、贸易政策（关税、配额）。<\/strong> 减少进口 → 外汇市场上对外币的需求减少 → 本币升值 → 出口减少。结果是：进口降了，出口也降了，<strong>净出口总量基本不变<\/strong>，贸易余额不改善，但贸易量萎缩、效率下降。<\/p>\n<p>这个结论反直觉但对理解政策很有用：贸易政策改变的是&quot;买谁的、卖什么&quot;，而不是&quot;总共买卖多少&quot;。总量由储蓄与投资决定。<\/p>\n<p><strong>二、资本外逃。<\/strong> 投资者对本国失去信心，把资金转走。<\/p>\n<ol><li>\n资本净流出增加 → 外汇市场本币供给增加 → 本币贬值。\n<\/li><li>\n同时国内可贷资金供给减少 → 利率上升。\n<\/li><li>\n贬值有利出口，净出口增加；利率上升抑制投资。\n<\/ol>\n<p>这是 1997 年亚洲金融危机、2018 年阿根廷比索危机的机制。<\/p>\n<p><strong>三、储蓄率上升。<\/strong> 供给右移 → 利率下降 → 资本净流出增加 → 本币贬值 → 净出口增加。贸易顺差扩大、国内投资可能增加。这是中国、德国长期顺差的解释之一。<\/p>\n<h3>一个必须记住的恒等式视角<\/h3>\n<p>NX = S − I。任何政策只要不改变 S 或 I，就无法改变 NX。<\/p>\n<ul><li>\n赤字：政府借走了 S，S 相对 I 减少 → NX 减少（逆差）。\n<\/li><li>\n贸易政策：不改变 S 与 I → NX 不变。\n<\/li><li>\n资本外逃：不改变 S 与 I（只改变资金去向）→ NX 不变，但汇率与利率变了。\n<\/ul>\n<p>这个视角比逐条推演链条更快，而且不容易绕错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;限制进口能减少贸易逆差&quot;——实际上只会让本币升值、出口同步下降，总量不变。\n<\/li><li>\n别以为&quot;资本流入总是好事&quot;——实际上它推高本币、打击出口，且随时可能逆转成资本外逃。\n<\/li><li>\n别以为&quot;贸易逆差是失败&quot;——实际上它意味着外国资金在为本国投资融资，问题在于这些资金是否用于有效投资。\n<\/li><li>\n别以为&quot;汇率由央行决定&quot;——实际上央行只能干预短期，长期由资本流动与物价决定。\n<\/ul>\n<ol><li>\n（单选）政府预算赤字扩大，在开放经济中通常导致？\n<p>A. 利率上升、本币升值、净出口减少  B. 利率下降、本币贬值、净出口增加  C. 利率不变、净出口不变  D. 利率上升、本币贬值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：赤字抬高利率，资本净流出减少，本币升值，出口变贵、进口变便宜，净出口减少，贸易逆差扩大。<\/p>\n<\/ol>\n<ol><li>\n（单选）限制进口的贸易政策对贸易余额的长期影响是？\n<p>A. 显著改善贸易余额  B. 基本不改变贸易余额，只改变贸易构成与数量  C. 必然扩大逆差  D. 使本币贬值 <strong>答案<\/strong>：B；<strong>解析<\/strong>：进口减少使本币升值、出口同步减少，NX = S − I 未变，因此总量不变，只改变贸易结构与规模。<\/p>\n<\/ol>\n<ol><li>\n（单选）资本外逃会带来？\n<p>A. 本币升值、利率下降  B. 本币贬值、利率上升  C. 本币升值、利率上升  D. 本币贬值、利率下降 <strong>答案<\/strong>：B；<strong>解析<\/strong>：资金流出使外汇市场本币供给增加、本币贬值；同时国内可贷资金减少，利率上升。<\/p>\n<\/ol>\n<ol><li>\n（多选）在开放经济两市场模型中，连接可贷资金市场与外汇市场的是？\n<p>A. 资本净流出  B. 国内利率  C. 汇率  D. 政府税收 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：利率决定资本净流出，资本净流出又进入外汇市场决定汇率，这条链连接两个市场。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两个市场联动：可贷资金定利率，外汇市场定汇率，中间连着资本净流出。\n<\/li><li>\n赤字链条：赤字 → 利率升 → 本币升 → 逆差扩大。\n<\/li><li>\nNX = S − I 是判断任何政策效果的快捷键；贸易政策不改变总量。\n<\/ul>", "kind": "chapter", "title": "第 32 章：开放经济的宏观经济理论"}, "ch33": {"html": "<h1>第 33 章：总需求与总供给<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 23、24、29 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出总需求曲线向下倾斜的三个原因，以及使它移动的四类因素。\n<\/li><li>\n解释长期总供给为什么是垂直线、短期为什么向上倾斜。\n<\/li><li>\n用 AD-AS 图分析需求冲击与供给冲击，区分短期结果与长期结果。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>短期里产量由需求决定、价格由供求关系决定；长期里产量由资本、劳动与技术决定，需求只会推动价格——这是宏观分析里最基本的一对时间尺度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>经济波动的三个事实<\/h3>\n<p><strong>衰退<\/strong>（recession）是产出下降、失业上升的时期；严重的叫<strong>萧条<\/strong>（depression）。观察到的规律有三条：<\/p>\n<ol><li>\n波动不规则，没有固定周期，无法预测下一次何时来。\n<\/li><li>\n大多数宏观变量同向变动：产出、投资、利润、就业一起降，失业率一起升。\n<\/li><li>\n失业率上升是衰退最直接的痛苦指标，且它在复苏初期仍然很高（企业先恢复生产再招人）。\n<\/ol>\n<h3>总需求曲线为什么向下<\/h3>\n<p><strong>总需求<\/strong>（AD）是价格水平与总产出需求量的关系。它向下倾斜，原因与微观需求不同——不是因为&quot;便宜就多买&quot;，而是价格水平影响三个渠道：<\/p>\n<ol><li>\n<strong>财富效应<\/strong>：物价下降，你手里的现金与存款能买更多东西，感觉变富，消费增加。\n<\/li><li>\n<strong>利率效应<\/strong>：物价下降，购买同样东西需要的货币减少，货币需求下降，利率下降，投资增加。\n<\/li><li>\n<strong>汇率效应<\/strong>：物价下降，本国商品变便宜，出口增加、进口减少，净出口增加。\n<\/ol>\n<p>三条合起来，价格越低，总需求越大。<\/p>\n<p><strong>AD 移动的原因<\/strong>（价格以外的因素）：<\/p>\n<ul><li>\n消费 C 变化（股市财富、预期收入、税收）\n<\/li><li>\n投资 I 变化（利率、企业信心、产能利用率）\n<\/li><li>\n政府购买 G 变化\n<\/li><li>\n净出口 NX 变化（外国经济、汇率、贸易政策）\n<\/ul>\n<p>注意：价格变化是&quot;沿着曲线移动&quot;，其他因素变化才是&quot;整条曲线移动&quot;。这个区别在考试和实际分析中都会反复用到。<\/p>\n<h3>总供给：长期与短期<\/h3>\n<p><strong>长期总供给<\/strong>（LRAS）是一条垂直线，位置在<strong>自然产出率<\/strong>（也称潜在产出）。长期产量由资本存量、劳动人口、技术、制度决定，与价格水平无关——价格涨一倍，长期产量不会变一倍。<\/p>\n<p><strong>短期总供给<\/strong>（SRAS）向上倾斜。三个解释（教材给了三条，都可接受）：<\/p>\n<ol><li>\n<strong>粘性工资<\/strong>：工资合同预先签好，物价涨了工资没涨，企业实际成本下降，愿意多生产。\n<\/li><li>\n<strong>粘性价格<\/strong>：部分企业来不及调价，自己的价格相对便宜，销量增加，于是增产。\n<\/li><li>\n<strong>错觉<\/strong>：企业把整体物价上涨误当成自己产品涨价，于是增产。\n<\/ol>\n<p>三条解释的共同点：价格上升在短期内被&quot;误读&quot;或&quot;未被完全调整&quot;，于是产量增加。长期这些调整完成，SRAS 上移，回到 LRAS。<\/p>\n<p><strong>SRAS 移动的原因<\/strong>：投入品价格（工资、原材料、油价）、生产率、预期物价、政策（最低工资、税收）。<\/p>\n<h3>用模型分析冲击<\/h3>\n<p><strong>需求冲击<\/strong>：AD 右移。<\/p>\n<ul><li>\n短期：AD₂ 与 SRAS₁ 相交，产量上升、物价上升。\n<\/li><li>\n长期：工资与价格预期调整，SRAS 上移，回到 LRAS 上，产量回到自然率，物价更高。\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Y<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">物价水平 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 33 章示例：总需求增加，短期产量上升，长期只涨价<\/text><polyline points=\"70.0,123.0 392.0,231.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"368.4\" y=\"249.2\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">AD1<\/text><polyline points=\"70.0,92.0 438.0,216.0\" fill=\"none\" stroke=\"#1d4ed8\" stroke-width=\"2.2\"/><text x=\"455.8\" y=\"233.7\" font-size=\"12\" fill=\"#1d4ed8\" font-weight=\"600\">AD2<\/text><polyline points=\"70.0,262.5 472.5,154.0\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"409.8\" y=\"190.3\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">SRAS1<\/text><polyline points=\"70.0,231.5 472.5,123.0\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.2\"/><text x=\"465.0\" y=\"97.3\" font-size=
