ue='0'> 价格水平不影响长期产量，产量由资本、劳动与技术决定<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 企业长期不调整价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 政府管制价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 货币量固定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 石油价格暴涨导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> SRAS 左移，产量下降、物价上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> AD 右移，产量与物价上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> LRAS 右移<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 失业下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列哪些因素会使总需求曲线整体右移？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 政府购买增加<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 企业投资信心上升<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 物价水平下降<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 外国对本国产品需求增加<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch34__": "<h1>测验：第 34 章：货币政策和财政政策对总需求的影响<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 流动性偏好理论中，货币供给曲线画成垂直线是因为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 货币供给由央行决定，与利率无关<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 人们不持有货币<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 利率固定<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 货币需求不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> MPC 为 0.8，政府购买增加 100 亿元，总需求约增加？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 100 亿<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 180 亿<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 400 亿<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 500 亿<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 等额减税与政府购买相比，对总需求的刺激通常？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 更大<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相同<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 更小，因为部分减税被储蓄<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 无法比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 属于自动稳定器的有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 累进所得税<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 失业保险<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 一次性基建投资<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 转移支付<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch35__": "<h1>测验：第 35 章：通货膨胀与失业之间的短期权衡取舍<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 长期菲利普斯曲线为什么是垂直的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 失业率与通胀率无关，失业回到自然率<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 通胀永远为零<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 政府控制工资<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 企业不提价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 菲利普斯曲线与 AD-AS 模型的关系是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 两个独立理论<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 同一模型的两种坐标表达<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 菲利普斯曲线更早出现因此更准确<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 完全矛盾<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 牺牲率为 3，通胀从 6% 降到 2%，累计产出损失约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 4%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 6%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 12%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 18%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 使短期菲利普斯曲线上移（同样失业率对应更高通胀）的因素有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 预期通胀上升<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 供给冲击<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 自然失业率下降<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 工资合同指数化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch36__": "<h1>测验：第 36 章：宏观经济政策的六个争论问题<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 反对「决策者应积极稳定经济」的核心理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 衰退有益<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 政策存在时滞且预测不准<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 政府没有工具<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 市场会自动恢复<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 主张央行设定 2% 而非 0% 通胀目标的理由不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 避免滑入通缩<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 给名义工资调整留缓冲<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 消除全部通胀成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 保留降息空间<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 衰退期强行平衡预算的主要问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 会推高通胀<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 等于紧缩，加深衰退<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 会降低利率<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 会减少失业<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 支持「为鼓励储蓄修改税法」的论据包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 储蓄是资本来源、能提高生产率<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 现行税制对利息与资本利得征税等于惩罚储蓄<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 减税主要惠及富人所以更公平<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 储蓄增加能降低对外资依赖<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='国内生产总值'>国内生产总值 — 一国境内一定时期内生产的所有最终物品与服务的市场价值。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='最终产品'>最终产品 — 直接供最终使用、不再作为其他产品投入的产品。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='名义 gdp'>名义 GDP — 按当期价格计算的 GDP。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='实际 gdp'>实际 GDP — 按基年价格计算的 GDP，剔除价格变动影响。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='gdp 平减指数'>GDP 平减指数 — 名义 GDP 与实际 GDP 之比乘以 100，衡量整体价格水平。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='消费物价指数'>消费物价指数 — 用固定一篮子消费品价格计算的物价指数，衡量生活费用变化。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='通货膨胀率'>通货膨胀率 — 物价指数在两个时期之间的百分比变化。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='指数化'>指数化 — 按物价指数自动调整金额，以维持实际购买力。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='名义利率'>名义利率 — 未扣除通胀的挂牌利率。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='实际利率'>实际利率 — 名义利率扣除通胀后的购买力增长，近似等于名义利率减通胀率。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='生产率'>生产率 — 每单位劳动投入所生产的产出量。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='物质资本'>物质资本 — 用于生产的设备、厂房与基础设施。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='人力资本'>人力资本 — 劳动者通过教育、培训与经验积累的知识与技能。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='技术知识'>技术知识 — 关于如何生产的知识本身，存在于专利、文献与工艺中。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='追赶效应'>追赶效应 — 资本存量低的穷国增长更快，因为资本边际收益更高。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='债券'>债券 — 借款人承诺按期付息还本的债务凭证。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='股票'>股票 — 对企业所有权的份额，持有人分享剩余收益。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='金融中介'>金融中介 — 连接储蓄者与借款人的机构，如银行、共同基金。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='可贷资金市场'>可贷资金市场 — 储蓄供给与投资需求相互作用决定利率的市场模型。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='挤出效应'>挤出效应 — 政府借款抬高利率、减少私人投资的现象。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='共同基金'>共同基金 — 汇集众多投资者资金、由专业经理投资于组合的机构。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='现值'>现值 — 未来一笔金额按某一利率折算成的今天价值。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='净现值'>净现值 — 未来现金流的现值减去初始投入。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='风险厌恶'>风险厌恶 — 偏好确定收益、回避波动的倾向。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='多元化'>多元化 — 把资金投入不相关资产以降低企业特有风险。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='基本面分析'>基本面分析 — 通过估算资产未来现金流的现值来判断其价值。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='有效市场假说'>有效市场假说 — 资产价格已充分反映所有公开信息的理论。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='泡沫'>泡沫 — 资产价格远超其基本面价值的现象。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='劳动力'>劳动力 — 就业者与失业者的总和。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='失业率'>失业率 — 失业人数占劳动力的比例。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='劳动参与率'>劳动参与率 — 劳动力占成年人口的比例。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='摩擦性失业'>摩擦性失业 — 换工作或初入职场期间寻找匹配岗位造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='结构性失业'>结构性失业 — 技能或地区与岗位需求不匹配造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='周期性失业'>周期性失业 — 经济衰退中总需求不足造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='自然失业率'>自然失业率 — 摩擦性与结构性失业对应的正常失业水平。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='失业保险'>失业保险 — 向失业者提供部分收入补偿的制度。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='货币'>货币 — 被广泛接受用作交换媒介、计价单位与价值储藏的东西。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='流动性'>流动性 — 资产转换为交换媒介的容易程度。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='商品货币'>商品货币 — 自身具有内在价值的货币，如金银。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='法定货币'>法定货币 — 没有内在价值、依靠政府法令与信任流通的货币。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='准备金'>准备金 — 银行保留的不贷出的存款部分。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='准备金率'>准备金率 — 准备金占存款的比例。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='货币乘数'>货币乘数 — 准备金率倒数，表示单位准备金能支撑的存款总额。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='公开市场操作'>公开市场操作 — 央行买卖政府债券以调节银行体系准备金与货币供给。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='货币数量论'>货币数量论 — 用 MV = PY 说明物价水平由货币量决定的理论。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='流通速度'>流通速度 — 单位货币在一年内参与交易的次数。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='通胀税'>通胀税 — 政府通过印钞融资，使持币者购买力下降所形成的隐性税负。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='费雪效应'>费雪效应 — 名义利率随预期通胀同向调整的现象。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='皮鞋成本'>皮鞋成本 — 为减少持有现金的损失而频繁取现所耗费的时间与资源。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='菜单成本'>菜单成本 — 因改价而发生的重印、更新与沟通成本。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='恶性通胀'>恶性通胀 — 物价极高速上涨、货币失去基本职能的极端通胀。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='净出口'>净出口 — 出口减进口，也称贸易余额。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='资本净流出'>资本净流出 — 本国居民购买外国资产减去外国人购买本国资产。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='名义汇率'>名义汇率 — 两种货币之间的兑换比率。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='实际汇率'>实际汇率 — 两国商品的相对价格，等于名义汇率乘以两国物价之比。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='购买力平价'>购买力平价 — 同样商品在各国换算后应价格相同的理论。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='升值'>升值 — 本币能兑换更多外币。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='外汇市场'>外汇市场 — 本币与外币相互兑换的市场，供求决定汇率。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='资本外逃'>资本外逃 — 投资者因对一国失去信心而大规模转移资金。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='贸易政策'>贸易政策 — 关税、配额、补贴等限制或鼓励进出口的政策。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='总需求'>总需求 — 物价水平与总产出需求量之间的关系。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='总供给'>总供给 — 物价水平与总产出供给量之间的关系。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='自然产出率'>自然产出率 — 经济在正常运转时能生产的产出水平，由要素与技术决定。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='滞胀'>滞胀 — 产量下降与物价上涨同时出现的状态。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='粘性工资'>粘性工资 — 名义工资因合同或习惯不能随物价立即调整。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='流动性偏好'>流动性偏好 — 人们偏好持有流动性高的资产，该理论用货币供求解释利率。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='支出乘数'>支出乘数 — 政府购买增加引起的总需求变化倍数，等于 1/(1−MPC)。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='税收乘数'>税收乘数 — 减税引起的总需求变化倍数，等于 −MPC/(1−MPC)。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='挤出效应'>挤出效应 — 政府借款抬高利率从而减少私人投资的现象。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='自动稳定器'>自动稳定器 — 不需政策决策即随经济状况自动调节税收与支出的机制。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='边际消费倾向'>边际消费倾向 — 收入每增加一单位用于消费的比例。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='菲利普斯曲线'>菲利普斯曲线 — 通货膨胀率与失业率之间关系的曲线。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='自然率假说'>自然率假说 — 失业最终回到自然失业率、不受通胀水平影响的观点。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='牺牲率'>牺牲率 — 降低一个百分点通胀所损失的年度产出百分比。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='反通货膨胀'>反通货膨胀 — 刻意降低通货膨胀率的政策过程。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='滞胀'>滞胀 — 通胀上升与失业上升并存的状态。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='相机抉择'>相机抉择 — 根据当时形势灵活决定政策，而非按固定规则行事。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='自动稳定器'>自动稳定器 — 无需决策即随经济周期自动调节收支的机制。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='周期性赤字'>周期性赤字 — 经济衰退导致税收减少、支出增加所形成的赤字。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='结构性赤字'>结构性赤字 — 剔除周期因素后仍存在的长期收支缺口。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库（宏观）<\/h1>\n<h2>框架一：长期与短期分开看<\/h2>\n<p><strong>何时用<\/strong>：任何&quot;某政策有没有用&quot;的问题，第一句先问：看多长？ <strong>怎么用<\/strong>：长期用生产能力（资本、劳动、技术）判断，短期用总需求判断。货币中性只在长期成立，乘数效应只在短期有效。<\/p>\n<h2>框架二：政策推演四步<\/h2>\n<ol><li>\n政策改变了什么（货币量、政府支出、税率、资本流动）？\n<\/li><li>\n它先影响哪个市场（可贷资金、外汇、货币市场）？\n<\/li><li>\n价格变量怎么变（利率、汇率）？\n<\/li><li>\n通过价格变量影响哪个实体变量（投资、净出口、产量）？\n<\/ol>\n<p>四步走完，链条不会漏环节。第 32、34 章的所有推演都是这个套路。<\/p>\n<h2>框架三：恒等式先算总量<\/h2>\n<p>遇到&quot;这个政策会不会改变贸易余额/储蓄/投资&quot;，先用恒等式：<\/p>\n<ul><li>\n封闭经济：S = I\n<\/li><li>\n开放经济：NX = S − I\n<\/li><li>\n货币：MV = PY\n<\/ul>\n<p>恒等式不告诉你方向，但立刻告诉你&quot;什么东西不可能变&quot;。贸易政策不可能改变 NX 总量，就是恒等式的直接结论。<\/p>\n<h2>框架四：预期是分水岭<\/h2>\n<p>同样的政策，预期到与没预期到，效果完全不同。<\/p>\n<ul><li>\n反通胀：预期跟上则代价小，跟不上则代价大（牺牲率）。\n<\/li><li>\n财政刺激：家庭若预期未来增税，会多储蓄，乘数变小（李嘉图等价的经验版本）。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n若通胀高且失业低 → 需求过热，紧缩总需求。\n<\/li><li>\n若通胀高且失业高 → 滞胀，供给冲击，没有单一解药。\n<\/li><li>\n若通胀低且失业高 → 需求不足，扩张总需求（注意时滞）。\n<\/li><li>\n若长期增长停滞 → 看生产率四项，而不是短期刺激。\n<\/ul>\n<h2>反模式（作者明确提示的误判）<\/h2>\n<ul><li>\n<strong>把名义当实际<\/strong>：名义工资涨 5%、物价涨 6%，实际是降薪。\n<\/li><li>\n<strong>把单品涨价当通胀<\/strong>：通胀是普遍价格水平上升。\n<\/li><li>\n<strong>把长期问题用短期工具解决<\/strong>：刺激不能提高潜在增长率。\n<\/li><li>\n<strong>忽视时滞做积极调控<\/strong>：等政策见效时，周期可能已经转向。\n<\/li><li>\n<strong>用总量掩盖分配<\/strong>：GDP 与通胀率都不回答&quot;谁受损&quot;。\n<\/li><li>\n<strong>把相关当因果<\/strong>：货币增长与通胀同向，但个例不等于机制。\n<\/ul>", "__cheatsheet__": "<h1>速查表（宏观）<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>支出法<\/td><td>GDP = C + I + G + NX<\/td><\/tr><tr><td>平减指数<\/td><td>名义 GDP ÷ 实际 GDP × 100<\/td><\/tr><tr><td>CPI<\/td><td>当期篮子成本 ÷ 基期篮子成本 × 100<\/td><\/tr><tr><td>实际利率<\/td><td>≈ 名义利率 − 通胀率<\/td><\/tr><tr><td>70 法则<\/td><td>翻倍年数 ≈ 70 ÷ 增长率（%）<\/td><\/tr><tr><td>储蓄<\/td><td>S = Y − C − G；封闭经济 S = I<\/td><\/tr><tr><td>开放经济<\/td><td>NX = S − I = NCF<\/td><\/tr><tr><td>实际汇率<\/td><td>名义汇率 × 国内物价 ÷ 国外物价<\/td><\/tr><tr><td>货币乘数<\/td><td>1 ÷ 准备金率<\/td><\/tr><tr><td>货币数量方程<\/td><td>M × V = P × Y<\/td><\/tr><tr><td>费雪效应<\/td><td>名义利率 ≈ 实际利率 + 通胀率<\/td><\/tr><tr><td>现值<\/td><td>PV = FV ÷ (1+r)^n<\/td><\/tr><tr><td>支出乘数<\/td><td>1 ÷ (1 − MPC)<\/td><\/tr><tr><td>税收乘数<\/td><td>−MPC ÷ (1 − MPC)<\/td><\/tr><tr><td>牺牲率<\/td><td>降 1 个百分点通胀对应的年度产出损失百分比<\/td><\/tr><\/tbody><\/table>\n<h2>定量示例（全书统一）<\/h2>\n<ul><li>\n名义 GDP 550、实际 385 → 平减指数 142.9，价格比基年高约 43%。\n<\/li><li>\n篮子基年 14 元、当期 20 元 → CPI ≈ 142.9。\n<\/li><li>\nM 增 20%、Y 增 3% → 物价涨约 16.5%。\n<\/li><li>\n准备金率 10% → 乘数 10，1000 元存款支撑 10000 元。\n<\/li><li>\nMPC = 0.8 → 支出乘数 5、税收乘数 −4；政府购买 100 亿 → +500 亿。\n<\/li><li>\n实际汇率：7 × 110 ÷ 100 = 7.7。\n<\/ul>\n<h2>传导链速查<\/h2>\n<ul><li>\n<strong>货币扩张<\/strong>：货币供给↑ → 利率↓ → 投资↑ → AD 右移 → 产量与物价↑（短期）。\n<\/li><li>\n<strong>财政赤字<\/strong>：借款↑ → 利率↑ → 投资↓（挤出）；开放经济中再加：资本净流出↓ → 本币↑ → NX↓。\n<\/li><li>\n<strong>贸易政策<\/strong>：进口↓ → 本币↑ → 出口↓ → NX 不变。\n<\/li><li>\n<strong>资本外逃<\/strong>：本币↓ + 利率↑。\n<\/li><li>\n<strong>供给冲击<\/strong>：SRAS 左移 → 滞胀 → 政策两难。\n<\/ul>\n<h2>判断流程<\/h2>\n<ol><li>\n先定位时间尺度：长期还是短期？\n<\/li><li>\n再看是需求侧还是供给侧冲击？\n<\/li><li>\n需要恒等式帮忙判断&quot;总量能不能变&quot;。\n<\/li><li>\n最后考虑预期与时滞，决定政策力度。\n<\/ol>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
