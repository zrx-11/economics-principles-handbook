lue='3'> 矫正税只对消费者征收<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 科斯定理成立需要哪些条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='0'> 产权界定清楚<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='1'> 交易成本足够低<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='2'> 当事人数量很少且能谈判<\/label><label class='quiz-opt'><input type='checkbox' name='ch10-q04' value='3'> 政府先征收矫正税<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：公共物品和公共资源<\/h1><div class='quiz-item' data-qid='ch11-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 「拥堵的城市道路」属于哪一类物品？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q01' value='0'> 私人物品<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='1'> 俱乐部物品<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='2'> 公共资源<\/label><label class='quiz-opt'><input type='radio' name='ch11-q01' value='3'> 公共物品<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 公共物品市场供给不足的根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q02' value='0'> 生产成本太高<\/label><label class='quiz-opt'><input type='radio' name='ch11-q02' value='1'> 无排他性导致搭便车，没人愿意付费<\/label><label class='quiz-opt'><input type='radio' name='ch11-q02' value='2'> 政府不允许私人提供<\/label><label class='quiz-opt'><input type='radio' name='ch11-q02' value='3'> 消费者需求量太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 「每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担」导致草场被吃光，这种现象叫什么悲剧？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 解决公地悲剧的可行办法包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='0'> 把资源产权私有化<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='1'> 规定使用上限并管制<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='2'> 发放可交易的配额<\/label><label class='quiz-opt'><input type='checkbox' name='ch11-q04' value='3'> 完全免费开放并依靠使用者自觉<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：税制的设计<\/h1><div class='quiz-item' data-qid='ch12-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某人年收入 10 万元，缴税 2 万元；再多挣 1 元要缴 0.4 元税。他的平均税率与边际税率分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q01' value='0'> 20% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='ch12-q01' value='1'> 20% 与 40%<\/label><label class='quiz-opt'><input type='radio' name='ch12-q01' value='2'> 40% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='ch12-q01' value='3'> 40% 与 40%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 关于销售税的累进或累退性质，下列说法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q02' value='0'> 销售税是比例税，因为税率统一<\/label><label class='quiz-opt'><input type='radio' name='ch12-q02' value='1'> 销售税通常是累退的，因为低收入者消费占收入比重更高<\/label><label class='quiz-opt'><input type='radio' name='ch12-q02' value='2'> 销售税通常是累进的<\/label><label class='quiz-opt'><input type='radio' name='ch12-q02' value='3'> 无法判断，取决于商品种类<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 「谁从公共服务中受益更多，谁就该多缴税」属于哪种原则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch12-q03' value='0'> 支付能力原则<\/label><label class='quiz-opt'><input type='radio' name='ch12-q03' value='1'> 受益原则<\/label><label class='quiz-opt'><input type='radio' name='ch12-q03' value='2'> 纵向公平原则<\/label><label class='quiz-opt'><input type='radio' name='ch12-q03' value='3'> 比例税原则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch12-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 税收造成的效率损失来自哪些方面？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch12-q04' value='0'> 改变相对价格导致交易减少的无谓损失<\/label><label class='quiz-opt'><input type='checkbox' name='ch12-q04' value='1'> 报税与合规的管理负担<\/label><label class='quiz-opt'><input type='checkbox' name='ch12-q04' value='2'> 高边际税率对工作与投资激励的抑制<\/label><label class='quiz-opt'><input type='checkbox' name='ch12-q04' value='3'> 政府把税收用于转移支付<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：生产成本<\/h1><div class='quiz-item' data-qid='ch13-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某店主年收入 60 万元，显性成本 45 万元，他投入的 20 万元资金本可获 5% 收益，自己本可年薪 10 万元。他的经济利润是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q01' value='0'> 15 万元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q01' value='1'> 4 万元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q01' value='2'> 5 万元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q01' value='3'> 0 万元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 固定成本 30 元，产量为 5 时总成本 75 元。平均总成本是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q02' value='0'> 6 元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q02' value='1'> 15 元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q02' value='2'> 9 元<\/label><label class='quiz-opt'><input type='radio' name='ch13-q02' value='3'> 45 元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么边际成本曲线一定穿过平均总成本曲线的最低点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch13-q03' value='0'> 因为两者都由固定成本决定<\/label><label class='quiz-opt'><input type='radio' name='ch13-q03' value='1'> 因为新增一单位的成本低于平均会拉低平均，高于平均会拉高平均<\/label><label class='quiz-opt'><input type='radio' name='ch13-q03' value='2'> 因为边际成本总是递减的<\/label><label class='quiz-opt'><input type='radio' name='ch13-q03' value='3'> 因为平均成本总是等于边际成本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch13-q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 产量增加时每多雇一名工人带来的产出增量越来越少，这个规律叫什么？（八个字以内）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：竞争市场上的企业<\/h1><div class='quiz-item' data-qid='ch14-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 完全竞争企业的利润最大化条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q01' value='0'> P = ATC<\/label><label class='quiz-opt'><input type='radio' name='ch14-q01' value='1'> P = MC<\/label><label class='quiz-opt'><input type='radio' name='ch14-q01' value='2'> P = AVC<\/label><label class='quiz-opt'><input type='radio' name='ch14-q01' value='3'> MR = ATC<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某企业价格 13 元，产量 5 件，总成本 75 元，平均可变成本 9 元，固定成本 30 元。它应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q02' value='0'> 立即停业，因为亏损<\/label><label class='quiz-opt'><input type='radio' name='ch14-q02' value='1'> 继续生产，因为停业会亏得更多<\/label><label class='quiz-opt'><input type='radio' name='ch14-q02' value='2'> 提高价格<\/label><label class='quiz-opt'><input type='radio' name='ch14-q02' value='3'> 扩大产量到 ATC 最低点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 长期中竞争行业的均衡状态是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch14-q03' value='0'> 价格高于最低 ATC，企业获得超额利润<\/label><label class='quiz-opt'><input type='radio' name='ch14-q03' value='1'> 价格等于最低 ATC，经济利润为零<\/label><label class='quiz-opt'><input type='radio' name='ch14-q03' value='2'> 价格等于 AVC 最低点<\/label><label class='quiz-opt'><input type='radio' name='ch14-q03' value='3'> 企业数量固定不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch14-q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 已经花掉、无法收回的成本叫什么成本？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：垄断<\/h1><div class='quiz-item' data-qid='ch15-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自然垄断形成的根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q01' value='0'> 政府发放了独家牌照<\/label><label class='quiz-opt'><input type='radio' name='ch15-q01' value='1'> 规模经济一直持续到覆盖整个市场，一家供货成本最低<\/label><label class='quiz-opt'><input type='radio' name='ch15-q01' value='2'> 企业掌握了全部原材料<\/label><label class='quiz-opt'><input type='radio' name='ch15-q01' value='3'> 产品拥有专利<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch15-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 需求为 P = 30 − 0.5Q，则边际收益 MR 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q02' value='0'> 30 − Q<\/label><label class='quiz-opt'><input type='radio' name='ch15-q02' value='1'> 30 − 0.5Q<\/label><label class='quiz-opt'><input type='radio' name='ch15-q02' value='2'> 15 − Q<\/label><label class='quiz-opt'><input type='radio' name='ch15-q02' value='3'> 30 − 2Q<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch15-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 需求 P = 30 − 0.5Q，MC = 10 + Q。垄断者的产量与价格分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch15-q03' value='0'> Q=10，P=25<\/label><label class='quiz-opt'><input type='radio' name='ch15-q03' value='1'> Q=13.3，P=16.7<\/label><label class='quiz-opt'><input type='radio' name='ch15-q03' value='2'> Q=10，P=20<\/label><label class='quiz-opt'><input type='radio' name='ch15-q03' value='3'> Q=6.7，P=26.7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch15-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 价格歧视可行的条件包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch15-q04' value='0'> 能按支付意愿或人群特征区分买者<\/label><label class='quiz-opt'><input type='checkbox' name='ch15-q04' value='1'> 商品或服务无法转售套利<\/label><label class='quiz-opt'><input type='checkbox' name='ch15-q04' value='2'> 企业拥有市场势力<\/label><label class='quiz-opt'><input type='checkbox' name='ch15-q04' value='3'> 政府强制统一定价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：垄断竞争<\/h1><div class='quiz-item' data-qid='ch16-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 垄断竞争企业长期均衡的核心特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q01' value='0'> 需求曲线与 ATC 曲线在最低点相切<\/label><label class='quiz-opt'><input type='radio' name='ch16-q01' value='1'> 需求曲线与 ATC 曲线相切，且切点在最低点左侧<\/label><label class='quiz-opt'><input type='radio' name='ch16-q01' value='2'> 价格等于边际成本<\/label><label class='quiz-opt'><input type='radio' name='ch16-q01' value='3'> 企业长期获得正的经济利润<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch16-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 垄断竞争与完全竞争最重要的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch16-q02' value='0'> 企业数量更多<\/label><label class='quiz-opt'><input type='radio' name='ch16-q02' value='1'> 产品存在差别，企业因此有少量定价权<\/label><label class='quiz-opt'><input type='radio' name='ch16-q02' value='2'> 没有进入壁垒<\/label><label class='quiz-opt'><input type='radio' name='ch16-q02' value='3'> 长期利润更高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch16-q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 支持广告的论点包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch16-q03' value='0'> 降低消费者的搜寻成本<\/label><label class='quiz-opt'><input type='checkbox' name='ch16-q03' value='1'> 传递产品质量信号<\/label><label class='quiz-opt'><input type='checkbox' name='ch16-q03' value='2'> 一定降低产品价格<\/label><label class='quiz-opt'><input type='checkbox' name='ch16-q03' value='3'> 可能抬高进入壁垒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch17__": "<h1>测验：第 17 章：寡头<\/h1><div class='quiz-item' data-qid='ch17-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在囚徒困境式的寡头博弈中，双方都维持高价的合作结果为什么难以实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch17-q01' value='0'> 因为合作违法<\/label><label class='quiz-opt'><input type='radio' name='ch17-q01' value='1'> 因为任何一方单方面降价都能立即获益，背叛动机始终存在<\/label><label class='quiz-opt'><input type='radio' name='ch17-q01' value='2'> 因为消费者会抵制高价<\/label><label class='quiz-opt'><input type='radio' name='ch17-q01' value='3'> 因为政府强制低价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch17-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 纳什均衡的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch17-q02' value='0'> 所有人的总收益最大<\/label><label class='quiz-opt'><input type='radio' name='ch17-q02' value='1'> 没有任何一方能在对手不变时单方面改变策略而获益<\/label><label class='quiz-opt'><input type='radio' name='ch17-q02' value='2'> 价格等于成本<\/label><label class='quiz-opt'><input type='radio' name='ch17-q02' value='3'> 企业数量最多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch17-q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 卡特尔难以长期维持的原因包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch17-q03' value='0'> 成员有偷偷超产的动机<\/label><label class='quiz-opt'><input type='checkbox' name='ch17-q03' value='1'> 成员多则监督成本高<\/label><label class='quiz-opt'><input type='checkbox' name='ch17-q03' value='2'> 非成员的外部竞争<\/label><label class='quiz-opt'><input type='checkbox' name='ch17-q03' value='3'> 市场需求上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch18__": "<h1>测验：第 18 章：生产要素市场<\/h1><div class='quiz-item' data-qid='ch18-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某企业最后雇的一名工人每小时多产出 30 件产品，产品单价 5 元。在完全竞争劳动市场上，这名工人的工资上限约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch18-q01' value='0'> 30 元<\/label><label class='quiz-opt'><input type='radio' name='ch18-q01' value='1'> 150 元<\/label><label class='quiz-opt'><input type='radio' name='ch18-q01' value='2'> 5 元<\/label><label class='quiz-opt'><input type='radio' name='ch18-q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch18-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 劳动需求被称为「派生需求」，原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch18-q02' value='0'> 它来自对最终产品的需求<\/label><label class='quiz-opt'><input type='radio' name='ch18-q02' value='1'> 它由法律规定的工资标准派生<\/label><label class='quiz-opt'><input type='radio' name='ch18-q02' value='2'> 它由工会与雇主谈判派生<\/label><label class='quiz-opt'><input type='radio' name='ch18-q02' value='3'> 它随人口自然增长派生<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch18-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 产品价格上升，同时其他条件不变，劳动市场会发生什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch18-q03' value='0'> 劳动需求曲线左移，工资下降<\/label><label class='quiz-opt'><input type='radio' name='ch18-q03' value='1'> 劳动需求曲线右移，工资上升<\/label><label class='quiz-opt'><input type='radio' name='ch18-q03' value='2'> 劳动供给曲线左移，工资上升<\/label><label class='quiz-opt'><input type='radio' name='ch18-q03' value='3'> 劳动供给曲线右移，工资下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch19__": "<h1>测验：第 19 章：收入与歧视<\/h1><div class='quiz-item' data-qid='ch19-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 高空作业的工资高于办公室文员，最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch19-q01' value='0'> 高空作业者能力更强<\/label><label class='quiz-opt'><input type='radio' name='ch19-q01' value='1'> 补偿性工资差别，工作条件更危险<\/label><label class='quiz-opt'><input type='radio' name='ch19-q01' value='2'> 工会力量更强<\/label><label class='quiz-opt'><input type='radio' name='ch19-q01' value='3'> 政府规定的工资更高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch19-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 「超级明星现象」出现的前提是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch19-q02' value='0'> 产品可以低成本复制，且消费者在意质量差异<\/label><label class='quiz-opt'><input type='radio' name='ch19-q02' value='1'> 从业者数量极少<\/label><label class='quiz-opt'><input type='radio' name='ch19-q02' value='2'> 政府限制进入<\/label><label class='quiz-opt'><input type='radio' name='ch19-q02' value='3'> 企业规模很大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch19-q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 哪些因素会造成同等工作之间的工资差距？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch19-q03' value='0'> 工作危险程度不同<\/label><label class='quiz-opt'><input type='checkbox' name='ch19-q03' value='1'> 工作地点生活成本不同<\/label><label class='quiz-opt'><input type='checkbox' name='ch19-q03' value='2'> 工作时间的灵活性不同<\/label><label class='quiz-opt'><input type='checkbox' name='ch19-q03' value='3'> 货币单位不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch20__": "<h1>测验：第 20 章：收入不平等与贫困<\/h1><div class='quiz-item' data-qid='ch20-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 基尼系数为 0 表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch20-q01' value='0'> 一人占有全部收入<\/label><label class='quiz-opt'><input type='radio' name='ch20-q01' value='1'> 收入完全平均<\/label><label class='quiz-opt'><input type='radio' name='ch20-q01' value='2'> 一半人贫困<\/label><label class='quiz-opt'><input type='radio' name='ch20-q01' value='3'> 无法计算<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch20-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 功利主义支持再分配的核心理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch20-q02' value='0'> 富人赚钱不道德<\/label><label class='quiz-opt'><input type='radio' name='ch20-q02' value='1'> 收入的边际效用递减，转移给穷人能提高总效用<\/label><label class='quiz-opt'><input type='radio' name='ch20-q02' value='2'> 每个人都应获得相同收入<\/label><label class='quiz-opt'><input type='radio' name='ch20-q02' value='3'> 政府需要更多税收<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch20-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 负所得税相比传统福利的最大优点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch20-q03' value='0'> 财政成本为零<\/label><label class='quiz-opt'><input type='radio' name='ch20-q03' value='1'> 把补贴与工作收入平滑衔接，减少「工作就失去补助」的断崖<\/label><label class='quiz-opt'><input type='radio' name='ch20-q03' value='2'> 不需要任何行政成本<\/label><label class='quiz-opt'><input type='radio' name='ch20-q03' value='3'> 可以完全消除贫困<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch20-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 用年度收入衡量贫困可能失真，原因包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch20-q04' value='0'> 忽略实物转移<\/label><label class='quiz-opt'><input type='checkbox' name='ch20-q04' value='1'> 忽略生命周期差异<\/label><label class='quiz-opt'><input type='checkbox' name='ch20-q04' value='2'> 暂时性失业被当成长期贫困<\/label><label class='quiz-opt'><input type='checkbox' name='ch20-q04' value='3'> 没有考虑税率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch21__": "<h1>测验：第 21 章：消费者选择理论<\/h1><div class='quiz-item' data-qid='ch21-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 奶茶 2 元一杯、电影 4 元一张、预算 40 元。预算线的斜率绝对值为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch21-q01' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch21-q01' value='1'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='ch21-q01' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch21-q01' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch21-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 消费者最优选择的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch21-q02' value='0'> 边际替代率等于价格比<\/label><label class='quiz-opt'><input type='radio' name='ch21-q02' value='1'> 两种商品消费量相等<\/label><label class='quiz-opt'><input type='radio' name='ch21-q02' value='2'> 预算线中点的组合<\/label><label class='quiz-opt'><input type='radio' name='ch21-q02' value='3'> 无差异曲线与纵轴相交<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch21-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 吉芬物品的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch21-q03' value='0'> 价格上升时需求量也上升<\/label><label class='quiz-opt'><input type='radio' name='ch21-q03' value='1'> 价格上升时需求量急剧下降<\/label><label class='quiz-opt'><input type='radio' name='ch21-q03' value='2'> 与替代品完全无关<\/label><label class='quiz-opt'><input type='radio' name='ch21-q03' value='3'> 只存在于完全竞争市场<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch21-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 无差异曲线的性质包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch21-q04' value='0'> 向右下方倾斜<\/label><label class='quiz-opt'><input type='checkbox' name='ch21-q04' value='1'> 离原点越远满足度越高<\/label><label class='quiz-opt'><input type='checkbox' name='ch21-q04' value='2'> 两条曲线不相交<\/label><label class='quiz-opt'><input type='checkbox' name='ch21-q04' value='3'> 凸向原点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch22__": "<h1>测验：第 22 章：微观经济学前沿<\/h1><div class='quiz-item' data-qid='ch22-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 买全额医疗保险的人更不注意保养身体，这属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch22-q01' value='0'> 逆向选择<\/label><label class='quiz-opt'><input type='radio' name='ch22-q01' value='1'> 道德风险<\/label><label class='quiz-opt'><input type='radio' name='ch22-q01' value='2'> 信号失灵<\/label><label class='quiz-opt'><input type='radio' name='ch22-q01' value='3'> 锚定效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch22-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二手车市场上好车卖家退出，主要原因是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch22-q02' value='0'> 买家只肯按平均质量出价，好车卖不到应有价格<\/label><label class='quiz-opt'><input type='radio' name='ch22-q02' value='1'> 二手车需求下降<\/label><label class='quiz-opt'><input type='radio' name='ch22-q02' value='2'> 政府限制交易<\/label><label class='quiz-opt'><input type='radio' name='ch22-q02' value='3'> 维修成本上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch22-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 阿罗不可能定理说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch22-q03' value='0'> 民主制度注定失败<\/label><label class='quiz-opt'><input type='radio' name='ch22-q03' value='1'> 不存在同时满足所有合理公理的投票加总规则<\/label><label class='quiz-opt'><input type='radio' name='ch22-q03' value='2'> 多数投票总是最优<\/label><label class='quiz-opt'><input type='radio' name='ch22-q03' value='3'> 只要选民理性就能得到完美结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch22-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列属于行为经济学发现的现象是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch22-q04' value='0'> 损失厌恶<\/label><label class='quiz-opt'><input type='checkbox' name='ch22-q04' value='1'> 锚定效应<\/label><label class='quiz-opt'><input type='checkbox' name='ch22-q04' value='2'> 框架效应<\/label><label class='quiz-opt'><input type='checkbox' name='ch22-q04' value='3'> 边际效用递减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='权衡取舍'>权衡取舍 — 多要一样东西就必须少要另一样，两个都想要的目标之间的此消彼长。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='机会成本'>机会成本 — 为了得到某样东西而放弃的东西的价值，包括账面支出和放弃的收益。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='理性人'>理性人 — 在可选范围内系统比较成本与收益、追求净收益最大的人；书里是分析起点，不是对真实人的道德评价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='边际变动'>边际变动 — 在现有基础上再多一单位或少一单位所带来的变化。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='激励'>激励 — 能改变人行为的东西，如价格、奖励、惩罚、规则。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='市场'>市场 — 买卖双方自发交换的场所与规则，靠价格传递稀缺信息。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='产权'>产权 — 对某项资源归谁所有、如何使用、收益归谁的界定。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为给旁观者带来成本或好处，而价格没有把这笔账算进去。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产率'>生产率 — 平均每个工人每小时生产的物品与服务量。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='通货膨胀'>通货膨胀 — 经济中物价总水平的普遍上涨，不是某几样商品涨价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产可能性边界'>生产可能性边界 — 在既定资源与技术下，经济能生产的两种产品的最大组合所连成的曲线。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='循环流量图'>循环流量图 — 把家庭与企业、物品市场与要素市场连成循环，用来展示收入与支出如何流动的模型。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='微观经济学'>微观经济学 — 研究单个决策者（家庭、企业）与单个市场如何配置资源。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='宏观经济学'>宏观经济学 — 研究整体经济现象，如通胀、失业、经济增长。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='实证分析'>实证分析 — 描述世界是什么样、某政策会导致什么结果，可用事实检验对错。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='规范分析'>规范分析 — 判断世界应该是什么样，包含价值判断，不能仅靠事实裁决。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下把总收益做到最大、或把浪费降到最小的状态。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='增长'>增长 — 生产能力本身扩大，表现为生产可能性边界向外移动。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='绝对优势'>绝对优势 — 用相同的资源投入，能生产出更多某种产品的能力。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='比较优势'>比较优势 — 生产某种产品的机会成本低于他人的能力；决定分工的依据。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='机会成本'>机会成本 — 为生产一单位某产品而放弃的另一产品的数量。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上一种产品的通行价格，是国内是否出口或进口的判断基准。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='专业化'>专业化 — 把资源集中用于自己机会成本最低的产品生产。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='市场'>市场 — 买者与卖者交换某种物品或服务的场所与规则。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='竞争市场'>竞争市场 — 买卖者众多、产品基本相同、进出自由，任何单个参与者都无法影响价格的市场。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求量'>需求量 — 在某一具体价格下，买者愿意并且能够购买的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求法则'>需求法则 — 其他条件不变时，价格上升则需求量下降。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给量'>供给量 — 在某一具体价格下，卖者愿意并且能够出售的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给法则'>供给法则 — 其他条件不变时，价格上升则供给量增加。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='均衡'>均衡 — 供给量等于需求量、市场没有过剩也没有短缺的状态。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='过剩'>过剩 — 供给量大于需求量的状态，价格有下降压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='短缺'>短缺 — 需求量大于供给量的状态，价格有上升压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='替代品'>替代品 — 一种商品价格上升会使另一种商品需求增加的商品对，如咖啡与奶茶。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='互补品'>互补品 — 一种商品价格上升会使另一种商品需求减少的商品对，如奶茶与珍珠。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='弹性'>弹性 — 一个变量对另一个变量变化的敏感程度，用百分比之比衡量。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='需求价格弹性'>需求价格弹性 — 需求量变动百分比与价格变动百分比之比。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='中点法'>中点法 — 用区间两端平均值作分母计算百分比变动，避免起点不同导致结果不同。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='富有弹性'>富有弹性 — 弹性绝对值大于 1，需求量对价格反应强烈。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='缺乏弹性'>缺乏弹性 — 弹性绝对值小于 1，需求量对价格反应微弱。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='总收益'>总收益 — 价格乘以销售数量，等于买者的总支出。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='收入弹性'>收入弹性 — 需求量变动百分比与收入变动百分比之比，用于判断正常品与劣等品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='交叉价格弹性'>交叉价格弹性 — 一种商品需求量变动百分比与另一种商品价格变动百分比之比，正值多为替代品，负值多为互补品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='供给价格弹性'>供给价格弹性 — 供给量变动百分比与价格变动百分比之比，主要受时间长短影响。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='价格上限'>价格上限 — 法律规定的最高售价，只有低于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='价格下限'>价格下限 — 法律规定的最低售价，只有高于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='配给机制'>配给机制 — 价格不能出清时用于分配稀缺商品的办法，如排队、抽签、凭票、凭关系。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收归宿'>税收归宿 — 税收负担最终由谁承担，由供需弹性决定，与法律规定的纳税人无关。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收楔子'>税收楔子 — 买者支付的价格与卖者得到的价格之间的差额。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='支付意愿'>支付意愿 — 买者为一件物品最多愿意支付的金额。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='消费者剩余'>消费者剩余 — 支付意愿减去实际支付，衡量买者从交易中获得的好处。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='成本'>成本 — 卖者为生产一单位产品愿意接受的最低价格，等于其机会成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='生产者剩余'>生产者剩余 — 卖者实际得到的价格减去其成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='总剩余'>总剩余 — 消费者剩余与生产者剩余之和，衡量市场创造的总价值。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下使总剩余最大，不浪费任何一方有得有失的交易机会。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='市场失灵'>市场失灵 — 市场自身无法实现总剩余最大，常见于市场势力与外部性。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='无谓损失'>无谓损失 — 税收使交易量减少而凭空消失的那部分总剩余，买卖双方与政府都没得到。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='拉弗曲线'>拉弗曲线 — 税额与税收收入之间的关系曲线，呈倒 U 形。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='税基'>税基 — 被征税的对象范围，如某类商品的全部销售额。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上该商品的通行价格，决定一国出口还是进口。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='关税'>关税 — 对进口商品征收的税，使国内价格高于世界价格。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='进口配额'>进口配额 — 对进口数量的直接限制，效果与关税类似但政府得不到关税收入。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='幼稚产业论'>幼稚产业论 — 主张对新兴产业发展初期给予保护，成熟后再参与国际竞争。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='调整援助'>调整援助 — 对因贸易受损的工人和企业提供的救济、培训与搬迁支持。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为对旁观者福利造成的影响，且未通过市场价格反映。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='负外部性'>负外部性 — 行为给旁观者带来成本，社会成本高于私人成本，市场会过量生产。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='正外部性'>正外部性 — 行为给旁观者带来收益，社会价值高于私人价值，市场会生产不足。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='矫正税'>矫正税 — 按每单位外部成本征收的税，使私人成本等于社会成本，也称庇古税。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='可交易许可证'>可交易许可证 — 政府设定排放总量并发放可买卖的许可，由市场决定谁减排。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='科斯定理'>科斯定理 — 产权清楚且交易成本足够低时，当事人谈判可达到有效率结果，与产权初始归属无关。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='排他性'>排他性 — 能否阻止不付费的人使用某物品。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='竞争性'>竞争性 — 一个人使用某物品是否会减少他人可用的数量。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共物品'>公共物品 — 既无排他性也无竞争性的物品，如国防、路灯。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共资源'>公共资源 — 无排他性但有竞争性的物品，如公海鱼群、拥堵道路。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='俱乐部物品'>俱乐部物品 — 有排他性但无竞争性的物品，如收费公路、有线电视。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='搭便车'>搭便车 — 不承担成本却享用公共物品收益的行为。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公地悲剧'>公地悲剧 — 公共资源因无排他性被过度使用而枯竭的现象。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='平均税率'>平均税率 — 总税额除以总收入，衡量整体负担。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='边际税率'>边际税率 — 新增一单位收入所适用的税率，决定额外工作的激励。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='受益原则'>受益原则 — 按从公共支出中受益的多少来分摊税负。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='支付能力原则'>支付能力原则 — 按纳税能力分摊税负，能力强者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='纵向公平'>纵向公平 — 收入不同的人缴税不同，高收入者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='横向公平'>横向公平 — 处境相同的人应缴相同的税。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累进税'>累进税 — 税额占收入比重随收入上升而上升的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累退税'>累退税 — 税额占收入比重随收入上升而下降的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='总成本'>总成本 — 生产一定数量产品所投入的全部资源的成本，包括显性与隐性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='显性成本'>显性成本 — 实际付出现金的成本，如原料、工资、租金。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='隐性成本'>隐性成本 — 未付出现金但确实放弃的收益，如自有资金的机会成本、业主的时间。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='经济利润'>经济利润 — 总收益减去全部成本（显性加隐性）。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='会计利润'>会计利润 — 总收益减去显性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际产量'>边际产量 — 多投入一单位可变要素所增加的产出。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际成本'>边际成本 — 多生产一单位产品所增加的总成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='平均总成本'>平均总成本 — 总成本除以产量。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='规模经济'>规模经济 — 产量扩大使长期平均总成本下降的现象。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='价格接受者'>价格接受者 — 无法影响市场价格、只能按市场价出售的企业。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='边际收益'>边际收益 — 多售出一单位产品所增加的总收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='利润最大化条件'>利润最大化条件 — 边际收益等于边际成本；竞争企业即价格等于边际成本。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='停业点'>停业点 — 价格低于平均可变成本最低点时，企业暂时停止生产。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='沉没成本'>沉没成本 — 已经发生且无法收回的成本，不影响当前决策。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='正常利润'>正常利润 — 经济利润为零时的回报水平，等于资源在其他用途上能获得的收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='垄断'>垄断 — 一家企业独占市场，且存在其他企业难以进入的壁垒。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='自然垄断'>自然垄断 — 因规模经济使一家企业供货成本最低而形成的垄断，如电网、自来水。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='价格歧视'>价格歧视 — 对成本相同的商品向不同买者收取不同价格。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='寻租'>寻租 — 企业花费资源游说、诉讼以维持垄断地位，这部分支出不创造产出。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='反托拉斯法'>反托拉斯法 — 旨在限制垄断行为、维护竞争的法规。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='垄断竞争'>垄断竞争 — 许多企业销售有差别的产品、可自由进出的市场结构。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='超额能力'>超额能力 — 垄断竞争企业长期产量低于平均总成本最低点对应的规模。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='品牌'>品牌 — 通过名称与形象传递质量与身份的标识，可降低消费者的信息成本。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='寡头'>寡头 — 少数几家企业主导、彼此高度依赖的市场结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='卡特尔'>卡特尔 — 企业之间就产量与价格达成的同盟，如 OPEC。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='囚徒困境'>囚徒困境 — 每个参与者单方面背叛都更有利、结果集体受损的博弈结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='纳什均衡'>纳什均衡 — 在给定他人策略下，没有任何一方能通过单独改变策略获益的状态。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='掠夺性定价'>掠夺性定价 — 以低于成本的价格挤走对手，再提价获取垄断利润的行为。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='派生需求'>派生需求 — 对生产要素的需求由对最终产品的需求派生而来。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='边际产量值'>边际产量值 — 增加一单位要素投入所带来的产出增量乘以产品价格。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='人力资本'>人力资本 — 劳动者通过教育、培训、经验积累形成的生产能力。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='补偿性工资差别'>补偿性工资差别 — 因工作条件差异而对劳动者给予的工资补偿。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='超级明星现象'>超级明星现象 — 少数顶尖从业者占据大部分市场收入，因为其产出可低成本复制。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='效率工资'>效率工资 — 高于市场均衡水平的工资，用于提高积极性、降低流失、吸引更优秀的员工。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='歧视'>歧视 — 对具有相同生产能力的人因身份特征给予不同待遇。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='人力资本'>人力资本 — 教育、培训与经验形成的生产能力，是工资差距的重要解释变量。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='洛伦兹曲线'>洛伦兹曲线 — 按收入从低到高排列家庭后绘制的累计收入占比曲线。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='基尼系数'>基尼系数 — 衡量收入不平等程度的指标，0 为完全平均，1 为完全不均。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='贫困率'>贫困率 — 收入低于贫困线的家庭占总家庭的比例。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='功利主义'>功利主义 — 以最大多数人的最大幸福为目标的分配哲学。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由主义'>自由主义 — 罗尔斯式立场，主张制度应最大化最不利者的福利。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由至上主义'>自由至上主义 — 主张只要获取过程正当，结果不平等无需政府纠正。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='负所得税'>负所得税 — 收入低于一定水平时由政府补贴、随收入上升逐步退出的制度。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='预算约束'>预算约束 — 消费者支出不超过收入的限制，写成 Px·x + Py·y = 收入。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='无差异曲线'>无差异曲线 — 给消费者带来同等满足程度的所有商品组合连成的线。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='边际替代率'>边际替代率 — 为多得到一单位横轴商品而愿意放弃的纵轴商品数量，等于无差异曲线斜率的绝对值。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='吉芬物品'>吉芬物品 — 价格上升时需求反而增加的极端劣等品。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='替代效应'>替代效应 — 价格变化使消费者转向相对便宜的商品所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='收入效应'>收入效应 — 价格变化改变实际购买力所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='不对称信息'>不对称信息 — 交易一方掌握的信息多于另一方。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='逆向选择'>逆向选择 — 签约前因无法分辨质量导致优质方退出、市场平均质量下降。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='道德风险'>道德风险 — 签约后因风险转移而放松注意或改变行为。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='信号'>信号 — 信息优势方主动提供的可验证证据，造假成本高因而可信。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='筛选'>筛选 — 信息劣势方设计机制使对方暴露真实信息。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='中位投票人定理'>中位投票人定理 — 一维议题下多数投票结果趋向中位选民的偏好。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='阿罗不可能定理'>阿罗不可能定理 — 不存在同时满足所有合理公理的投票加总规则。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='损失厌恶'>损失厌恶 — 同等金额的损失带来的负效用大于收益带来的正效用。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库（微观）<\/h1>\n<h2>框架一：边际比较<\/h2>\n<p><strong>何时用<\/strong>：任何&quot;要不要再多做一点&quot;的问题——多生产一杯、多雇一个人、多收一元税。 <strong>怎么用<\/strong>：算下一单位的收益与成本，比较；相等处停。 <strong>例子<\/strong>：企业按 MR = MC 定产量；政府按边际税率判断对劳动的抑制。<\/p>\n<h2>框架二：供需 + 楔子<\/h2>\n<p><strong>何时用<\/strong>：分析任何价格干预、税收、补贴、关税。 <strong>怎么用<\/strong>：先画原始均衡，再在买卖价格之间插入一个楔子（税、补贴、管制价），看成交量如何变化，剩余如何转移。 <strong>记法<\/strong>：楔子越大，成交量越小；损失的那块三角形就是代价。<\/p>\n<h2>框架三：三步判断市场结构<\/h2>\n<ol><li>\n卖者数量多不多？\n<\/li><li>\n产品有没有差别？\n<\/li><li>\n进入有没有壁垒？\n<\/ol>\n<p>答案组合直接对应四种结构，不用背定义。<\/p>\n<h2>框架四：外部性内部化<\/h2>\n<p><strong>何时用<\/strong>：出现第三方成本或收益时。 <strong>怎么做<\/strong>：把外部成本加到私人成本上（社会成本曲线），或把外部收益加到私人收益上；再选工具（税、补贴、许可证、产权）。<\/p>\n<h2>框架五：弹性定胜负<\/h2>\n<p>任何&quot;谁承担、谁受损&quot;的问题，先问两边的弹性。<\/p>\n<ul><li>\n税负：弹性小的一方多承担。\n<\/li><li>\n政策伤害：弹性小的一方受冲击小。\n<\/li><li>\n收益：弹性小于 1 时涨价增收。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n若 P &gt; ATC → 有钱赚，考虑进入或扩产。\n<\/li><li>\n若 AVC &lt; P &lt; ATC → 亏但继续生产，亏损小于停业。\n<\/li><li>\n若 P &lt; AVC → 停业。\n<\/li><li>\n若 P &gt; AVC 且长期 P &lt; ATC → 退出该行业。\n<\/li><li>\n若某事的边际收益 &gt; 边际成本 → 做；反之不做。\n<\/ul>\n<h2>反模式（作者明确反对的做法）<\/h2>\n<ul><li>\n<strong>把沉没成本算进决策<\/strong>：已经花掉的钱不影响&quot;下一步&quot;，因而不该左右判断。\n<\/li><li>\n<strong>用平均代替边际<\/strong>：平均成本低不代表多生产一单位就赚。\n<\/li><li>\n<strong>把价格管制当万能药<\/strong>：上限造成短缺，下限造成过剩，善意不等于有效。\n<\/li><li>\n<strong>把&quot;保护就业&quot;等同于&quot;禁止进口&quot;<\/strong>：贸易政策不改变总就业，只改变结构。\n<\/li><li>\n<strong>用总量掩盖分配<\/strong>：GDP 与总剩余都不回答&quot;谁得了好处&quot;。\n<\/ul>", "__cheatsheet__": "<h1>速查表（微观）<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>均衡<\/td><td>Qd = Qs，解得 P<em> 与 Q<\/em><\/td><\/tr><tr><td>需求价格弹性<\/td><td>E = (ΔQ/Q) ÷ (ΔP/P)；&gt;1 富有弹性<\/td><\/tr><tr><td>收益<\/td><td>TR = P × Q；弹性 &lt;1 时涨价增收<\/td><\/tr><tr><td>消费者剩余<\/td><td>支付意愿 − 实际支付（需求线以上、价格线以下面积）<\/td><\/tr><tr><td>生产者剩余<\/td><td>实际收入 − 成本（价格线以下、供给线以上面积）<\/td><\/tr><tr><td>税收收入<\/td><td>税额 × 税后成交量<\/td><\/tr><tr><td>无谓损失<\/td><td>楔子造成的三角形面积，随弹性增大而增大<\/td><\/tr><tr><td>经济利润<\/td><td>总收益 − 显性成本 − 隐性成本<\/td><\/tr><tr><td>利润最大化<\/td><td>MR = MC；竞争企业 P = MC<\/td><\/tr><tr><td>平均成本<\/td><td>ATC = TC/Q；MC 穿过 ATC 最低点<\/td><\/tr><tr><td>垄断 MR<\/td><td>线性需求 P = a − bQ 时 MR = a − 2bQ<\/td><\/tr><tr><td>边际产量值<\/td><td>VMPL = MPL × P；雇到 VMPL = 工资<\/td><\/tr><tr><td>消费者最优<\/td><td>MRS = Px/Py<\/td><\/tr><\/tbody><\/table>\n<h2>常约定量示例（全书统一）<\/h2>\n<ul><li>\n需求 Qd = 60 − 2P，供给 Qs = 2P − 20 → 均衡 20 元、20 杯。\n<\/li><li>\n6 元税 → 买者付 23、卖者得 17、成交量 14、税收 84、无谓损失 18。\n<\/li><li>\n3 元关税（世界价 15 提到 18）→ 进口从 16 降到 8、关税收入 24、无谓损失 18。\n<\/li><li>\n4 元负外部性 → 社会最优 Q = 16、P = 22、无谓损失 8。\n<\/li><li>\n垄断 D: P = 30 − 0.5Q、MC: P = 10 + Q → Q = 10、P = 25；竞争 Q ≈ 13.3、P ≈ 16.7。\n<\/ul>\n<h2>判断流程<\/h2>\n<ol><li>\n这是哪种市场结构？（数量、差别、壁垒）\n<\/li><li>\n有没有外部性、公共物品、信息不对称？（市场失灵检查）\n<\/li><li>\n决策者面对的是边际问题还是总量问题？\n<\/li><li>\n谁弹性小，谁就多承担成本。\n<\/ol>\n<h2>常见数值记忆<\/h2>\n<ul><li>\n弹性 = 1 时总收入最大。\n<\/li><li>\n税收收入先增后减（拉弗曲线形状），峰值在中等税率。\n<\/li><li>\n垄断价格高于竞争、产量低于竞争，差额造成无谓损失。\n<\/li><li>\n垄断竞争长期：P = ATC &gt; MC，产量低于效率规模。\n<\/ul>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：经济学十大原理", "href": "#/chapter/ch01"}, {"label": "第 2 章：像经济学家一样思考", "href": "#/chapter/ch02"}, {"label": "第 3 章：相互依存性与贸易的好处", "href": "#/chapter/ch03"}, {"label": "第 4 章：供给与需求的市场力量", "href": "#/chapter/ch04"}, {"label": "第 5 章：弹性及其应用", "href": "#/chapter/ch05"}, {"label": "第 6 章：供给、需求与政府政策", "href": "#/chapter/ch06"}, {"label": "第 7 章：消费者、生产者与市场效率", "href": "#/chapter/ch07"}, {"label": "第 8 章：应用：赋税的代价", "href": "#/chap  "ch23", "title": "第 23 章：一国收入的衡量", "file": "chapters/ch23-一国收入的衡量.md", "difficulty": 2}, {"id": "ch24", "title": "第 24 章：生活费用的衡量", "file": "chapters/ch24-生活费用的衡量.md", "difficulty": 2}, {"id": "ch25", "title": "第 25 章：生产与增长", "file": "chapters/ch25-生产与增长.md", "difficulty": 2}, {"id": "ch26", "title": "第 26 章：储蓄、投资和金融体系", "file": "chapters/ch26-储蓄投资和金融体系.md", "difficulty": 3}, {"id": "ch27", "title": "第 27 章：金融学的基本工具", "file": "chapters/ch27-金融学的基本工具.md", "difficulty": 3}, {"id": "ch28", "title": "第 28 章：失业", "file": "chapters/ch28-失业.md", "difficulty": 2}, {"id": "ch29", "title": "第 29 章：货币制度", "file": "chapters/ch29-货币制度.md", "difficulty": 3}, {"id": "ch30", "title": "第 30 章：货币增长与通货膨胀", "file": "chapters/ch30-货币增长与通货膨胀.md", "difficulty": 3}, {"id": "ch31", "title": "第 31 章：开放经济的基本概念", "file": "chapters/ch31-开放经济的基本概念.md", "difficulty": 2}, {"id": "ch32", "title": "第 32 章：开放经济的宏观经济理论", "file": "chapters/ch32-开放经济的宏观经济理论.md", "difficulty": 3}, {"id": "ch33", "title": "第 33 章：总需求与总供给", "file": "chapters/ch33-总需求与总供给.md", "difficulty": 3}, {"id": "ch34", "title": "第 34 章：货币政策和财政政策对总需求的影响", "file": "chapters/ch34-货币政策和财政政策对总需求的影响.md", "difficulty": 3}, {"id": "ch35", "title": "第 35 章：通货膨胀与失业之间的短期权衡取舍", "file": "chapters/ch35-通货膨胀与失业之间的短期权衡取舍.md", "difficulty": 3}, {"id": "ch36", "title": "第 36 章：宏观经济政策的六个争论问题", "file": "chapters/ch36-宏观经济政策的六个争论问题.md", "difficulty": 3}], "concepts": [{"id": "m01", "title": "GDP 与长期增长", "file": "concepts/gdp-growth.md", "chapterIds": ["ch23", "ch25"]}, {"id": "m02", "title": "通货膨胀", "file": "concepts/inflation.md", "chapterIds": ["ch24", "ch29", "ch30", "ch35"]}, {"id": "m03", "title": "货币与银行体系", "file": "concepts/money-banking.md", "chapterIds": ["ch29", "ch30", "ch34"]}, {"id": "m04", "title": "利率与可贷资金", "file": "concepts/loanable-funds.md", "chapterIds": ["ch26", "ch27", "ch32"]}, {"id": "m05", "title": "总需求与总供给", "file": "concepts/ad-as.md", "chapterIds": ["ch33", "ch34", "ch35"]}, {"id": "m06", "title": "菲利普斯曲线", "file": "concepts/phillips-curve.md", "chapterIds": ["ch35", "ch36"]}, {"id": "m07", "title": "开放经济", "file": "concepts/open-economy.md", "chapterIds": ["ch31", "ch32"]}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "companion": "macroeconomics学习伴侣.html", "quizzes": [{"type": "single", "question": "下列哪一项计入当年的 GDP？", "options": ["二手车的转手价格", "政府发放的失业救济金", "新建住宅的建造价值", "购买某公司股票"], "answer": 2, "explain": "新建住宅属于投资（I），计入 GDP。二手车只计中介佣金，救济金是转移支付，买股票是资产换手，都不计入。", "id": "ch23-q01", "chapterId": "ch23"}, {"type": "single", "question": "某国名义 GDP 为 550 亿元，按基年价格计算的实际 GDP 为 385 亿元。GDP 平减指数约为？", "options": ["100", "130", "142.9", "165"], "answer": 2, "explain": "平减指数 = 名义 ÷ 实际 × 100 = 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高约 43%。", "id": "ch23-q02", "chapterId": "ch23"}, {"type": "single", "question": "支出法下，进口消费品为什么要从总支出中减去？", "options": ["因为进口品价格更高", "因为它已被计入消费但并非本国生产", "因为进口要交关税", "因为进口品不计入统计口径"], "answer": 1, "explain": "消费者买进口货时这笔钱算在 C 里，但它不是本国生产的，所以通过 NX = 出口 − 进口 把它扣除。", "id": "ch23-q03", "chapterId": "ch23"}, {"type": "multi", "question": "GDP 无法反映下列哪些内容？", "options": ["家务劳动的价值", "收入分配状况", "环境破坏的成本", "产品的质量改进"], "answer": [0, 1, 2, 3], "explain": "GDP 只统计有市场价格的最终产品，不反映分配、环境、家务与质量变化，因此不能等同于福利。", "id": "ch23-q04", "chapterId": "ch23"}, {"type": "single", "question": "篮子为 4 个苹果与 2 条面包。基年成本 14 元，当期成本 20 元。CPI 约为？", "options": ["120", "135", "142.9", "150"], "answer": 2, "explain": "CPI = 20 ÷ 14 × 100 ≈ 142.9，表示价格水平比基年高约 42.9%。", "id": "ch24-q01", "chapterId": "ch24"}, {"type": "single", "question": "CPI 与 GDP 平减指数最重要的差别是？", "options": ["CPI 只统计消费品，平减指数覆盖全部国内生产", "CPI 每月公布，平减指数每年公布", "CPI 不含服务，平减指数含服务", "两者完全相同"], "answer": 0, "explain": "CPI 只用消费者篮子（含进口消费品），平减指数覆盖国内生产的全部产品（含投资品与出口），两者数值与用途都不同。", "id": "ch24-q02", "chapterId": "ch24"}, {"type": "single", "question": "名义利率 6%，通胀率 4%，实际利率约为？", "options": ["10%", "2%", "1.5%", "−2%"], "answer": 1, "explain": "实际利率 ≈ 名义利率 − 通胀率 = 2%。影响储蓄与借贷决策的是实际利率，而不是挂牌的名义利率。", "id": "ch24-q03", "chapterId": "ch24"}, {"type": "blank", "question": "按物价指数自动调整工资或养老金的做法叫什么？（两个字）", "options": [], "answer": "指数化", "explain": "指数化能避免通胀侵蚀实际收入，但可能形成工资与物价互相推动的螺旋。", "id": "ch24-q04", "chapterId": "ch24"}, {"type": "single", "question": "70 法则下，年增长 7% 的经济翻倍约需多少年？", "options": ["7 年", "10 年", "20 年", "35 年"], "answer": 1, "explain": "70 ÷ 7 = 10 年。增长 2% 则需 35 年，复利效应下差距悬殊。", "id": "ch25-q01", "chapterId": "ch25"}, {"type": "single", "question": "「追赶效应」存在的原因是？", "options": ["穷国人口多", "穷国资本少，每增加一单位资本的增产效果更明显", "穷国技术更好", "发达国家不愿意增长"], "answer": 1, "explain": "资本边际收益递减意味着一单位资本在资本存量低的穷国产生更大的产出增量，因此穷国有更快的增长潜力。", "id": "ch25-q02", "chapterId": "ch25"}, {"type": "single", "question": "下列哪项不是决定生产率的核心因素？", "options": ["物质资本", "人力资本", "货币发行量", "技术知识"], "answer": 2, "explain": "生产率由物质资本、人力资本、自然资源与技术决定。货币量影响价格水平，不影响生产率。", "id": "ch25-q03", "chapterId": "ch25"}, {"type": "multi", "question": "有利于长期增长的政策包括？", "options": ["保护产权与政治稳定", "提高储蓄率并投资于资本", "普及教育与改善健康", "闭关限制进口"], "answer": [0, 1, 2], "explain": "前三项分别对应制度、资本、人力资本。闭关限制进口通常不利于技术引进与专业化分工。", "id": "ch25-q04", "chapterId": "ch25"}, {"type": "single", "question": "在可贷资金市场模型中，资金的供给来自？", "options": ["投资", "储蓄", "政府支出", "进口"], "answer": 1, "explain": "储蓄提供可贷资金，投资形成需求；两者相交决定利率。", "id": "ch26-q01", "chapterId": "ch26"}, {"type": "single", "question": "政府预算赤字扩大，在其他条件不变时通常导致？", "options": ["利率下降、投资增加", "利率上升、私人投资减少", "利率不变", "储蓄减少、投资增加"], "answer": 1, "explain": "赤字增加资金需求，需求曲线右移，利率上升，部分私人投资被挤出。", "id": "ch26-q02", "chapterId": "ch26"}, {"type": "single", "question": "宏观意义上的「投资」指？", "options": ["购买股票", "购买债券", "购买新机器与厂房", "把钱存入银行"], "answer": 2, "explain": "宏观投资指形成新资本（设备、厂房、住宅、库存）；买卖股票债券只是资产转手。", "id": "ch26-q03", "chapterId": "ch26"}, {"type": "multi", "question": "金融中介包括？", "options": ["商业银行", "共同基金", "债券发行企业", "中央银行"], "answer": [0, 1, 3], "explain": "银行、共同基金、央行都属于中介类机构；债券发行企业是资金需求方，通过金融市场直接融资。", "id": "ch26-q04", "chapterId": "ch26"}, {"type": "single", "question": "三年后获得 100 万元，贴现率 5%，现值约为？", "options": ["85 万", "86.4 万", "95 万", "115 万"], "answer": 1, "explain": "PV = 100 ÷ 1.05³ ≈ 86.4 万元；今天的 86.4 万按 5% 复利三年正好变成 100 万。", "id": "ch27-q01", "chapterId": "ch27"}, {"type": "single", "question": "分散化投资能消除哪类风险？", "options": ["市场风险", "个别企业或行业的风险", "通货膨胀风险", "利率风险"], "answer": 1, "explain": "企业特有风险可通过持有不相关资产抵消；市场风险影响全部资产，分散无法消除。", "id": "ch27-q02", "chapterId": "ch27"}, {"type": "single", "question": "保险的期望赔付通常低于保费，为什么人们还买？", "options": ["因为保险公司会返还", "因为保险买的是对灾难的确定性，大额损失无法承受", "因为保费可以抵税", "因为保单可以转卖"], "answer": 1, "explain": "保险把不确定的大额损失换成确定的小额支出，对无法承受灾难的人是理性选择，尽管期望值为负。", "id": "ch27-q03", "chapterId": "ch27"}, {"type": "single", "question": "有效市场假说若成立，下列哪项推论最直接？", "options": ["主动选股难以稳定跑赢指数", "股票价格永远不波动", "公司分红必然增加", "利率会下降"], "answer": 0, "explain": "价格已反映公开信息，短期变动不可预测，因此被动指数投资在多数人身上优于主动选股。", "id": "ch27-q04", "chapterId": "ch27"}, {"type": "single", "question": "劳动力 1000 万，失业 60 万，失业率是？", "options": ["6%", "6.4%", "5.6%", "无法计算"], "answer": 0, "explain": "失业率 = 60 ÷ 1000 = 6%。注意分母是劳动力，不包含不找工作的人。", "id": "ch28-q01", "chapterId": "ch28"}, {"type": "single", "question": "矿工因煤矿关闭而失去工作，又不会其他技能，这属于？", "options": ["摩擦性失业", "结构性失业", "周期性失业", "季节性失业"], "answer": 1, "explain": "技能与岗位需求不匹配属于结构性失业，需要培训或迁移来解决，耗时最长。", "id": "ch28-q02", "chapterId": "ch28"}, {"type": "single", "question": "大量失业者放弃求职退出劳动力，会造成？", "options": ["失业率上升", "失业率下降但劳动参与率也下降", "失业率不变", "自然失业率上升"], "answer": 1, "explain": "退出劳动力后不再计入失业人数，失业率下降，但劳动参与率同步下降，真实就业状况被掩盖。", "id": "ch28-q03", "chapterId": "ch28"}, {"type": "multi", "question": "把工资抬到均衡之上、造成结构性失业的因素包括？", "options": ["最低工资法", "工会集体谈判", "效率工资", "职业介绍所"], "answer": [0, 1, 2], "explain": "前三种都直接抬高工资；职业介绍所降低搜寻摩擦，属于缓解摩擦性失业的措施。", "id": "ch28-q04", "chapterId": "ch28"}, {"type": "single", "question": "货币三项职能中最关键的是？", "options": ["交换媒介", "计价单位", "价值储藏", "保值增值"], "answer": 0, "explain": "被广泛接受作为交换媒介是货币的本质特征；计价单位与价值储藏是派生的功能。", "id": "ch29-q01", "chapterId": "ch29"}, {"type": "single", "question": "准备金率为 10%，最初存入 1000 元，理论上银行体系最终可形成的存款总额约为？", "options": ["1000 元", "10000 元", "1900 元", "1100 元"], "answer": 1, "explain": "货币乘数 = 1 ÷ 0.1 = 10，1000 × 10 = 10000 元。现实中因现金漏出与超额准备金，实际数值更小。", "id": "ch29-q02", "chapterId": "ch29"}, {"type": "single", "question": "央行在公开市场买进政府债券的直接效果是？", "options": ["减少银行体系准备金", "增加银行体系准备金，货币供给增加", "提高准备金率", "减少货币供给"], "answer": 1, "explain": "央行买入债券付出资金，银行体系准备金增加，通过乘数放大为更多存款，货币供给上升。", "id": "ch29-q03", "chapterId": "ch29"}, {"type": "blank", "question": "资产转换成交换媒介的容易程度叫什么？（三个字）", "options": [], "answer": "流动性", "explain": "现金流动性最高，活期存款次之，房产最低。M1、M2 的划分就是按流动性排序。", "id": "ch29-q04", "chapterId": "ch29"}, {"type": "single", "question": "货币量增长 20%，实际产出增长 3%，流通速度不变，物价大致上涨？", "options": ["3%", "17%", "20%", "23%"], "answer": 1, "explain": "P = MV/Y，变化率约 1.20 ÷ 1.03 − 1 ≈ 16.5%，四舍五入约 17%。", "id": "ch30-q01", "chapterId": "ch30"}, {"type": "single", "question": "费雪效应的内容是？", "options": ["通胀上升时名义利率随之上升", "通胀上升时名义利率下降", "实际利率永远不变", "货币量与物价无关"], "answer": 0, "explain": "贷款人要求名义利率覆盖预期通胀，因此名义利率 = 实际利率 + 通胀率，二者同向变动。", "id": "ch30-q02", "chapterId": "ch30"}, {"type": "single", "question": "下列哪一项不是通胀的成本？", "options": ["皮鞋成本", "菜单成本", "税制扭曲", "产出必然下降"], "answer": 3, "explain": "通胀的成本主要是皮鞋成本、菜单成本、税制扭曲、相对价格混乱与财富再分配；通胀本身不必然导致产出下降。", "id": "ch30-q03", "chapterId": "ch30"}, {"type": "multi", "question": "关于通胀税，正确的说法是？", "options": ["靠印钞为支出融资，等于向持币者征税", "无需立法即可征收，因此隐蔽", "对持有现金比例高的低收入者更不利", "它只影响富人"], "answer": [0, 1, 2], "explain": "通胀税隐蔽且累退，低收入者财富中现金占比更高，承担的比例更大。", "id": "ch30-q04", "chapterId": "ch30"}, {"type": "single", "question": "一国净出口为正（贸易顺差），意味着？", "options": ["该国的储蓄超过投资，资金净流出", "该国的投资超过储蓄，资金净流入", "该国一定有资本外逃", "该国货币一定升值"], "answer": 0, "explain": "由 NX = S − I，顺差意味储蓄大于投资，多出的资金借给外国，形成资本净流出。顺差与资本净流出是同一件事的两面。", "id": "ch31-q01", "chapterId": "ch31"}, {"type": "single", "question": "名义汇率 7 元/美元，中国物价指数 110，美国 100。实际汇率是？", "options": ["7.0", "7.7", "6.4", "0.7"], "answer": 1, "explain": "实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价 = 7 × 110 ÷ 100 = 7.7，表示中国商品相对变贵。", "id": "ch31-q02", "chapterId": "ch31"}, {"type": "single", "question": "购买力平价理论在现实中不完全成立，主要原因是？", "options": ["各国货币不同", "许多商品与服务无法跨国搬运，且存在壁垒", "汇率由政府规定", "各国人口不同"], "answer": 1, "explain": "理发、房租、医疗等服务不可贸易，加上关税与运输成本，套利无法把价格拉平，因此 PPP 只在长期、可贸易品上部分成立。", "id": "ch31-q03", "chapterId": "ch31"}, {"type": "blank", "question": "衡量两国商品相对价格、等于名义汇率乘两国物价之比的汇率叫什么？（四个字）", "options": [], "answer": "实际汇率", "explain": "实际汇率衡量本国商品的相对价格，决定出口竞争力。", "id": "ch31-q04", "chapterId": "ch31"}, {"type": "single", "question": "政府预算赤字扩大，在开放经济中通常导致？", "options": ["利率上升、本币升值、净出口减少", "利率下降、本币贬值、净出口增加", "利率不变、净出口不变", "利率上升、本币贬值"], "answer": 0, "explain": "赤字抬高利率，资本净流出减少，本币升值，出口变贵、进口变便宜，净出口减少，贸易逆差扩大。", "id": "ch32-q01", "chapterId": "ch32"}, {"type": "single", "question": "限制进口的贸易政策对贸易余额的长期影响是？", "options": ["显著改善贸易余额", "基本不改变贸易余额，只改变贸易构成与数量", "必然扩大逆差", "使本币贬值"], "answer": 1, "explain": "进口减少使本币升值、出口同步减少，NX = S − I 未变，因此总量不变，只改变贸易结构与规模。", "id": "ch32-q02", "chapterId": "ch32"}, {"type": "single", "question": "资本外逃会带来？", "options": ["本币升值、利率下降", "本币贬值、利率上升", "本币升值、利率上升", "本币贬值、利率下降"], "answer": 1, "explain": "资金流出使外汇市场本币供给增加、本币贬值；同时国内可贷资金减少，利率上升。", "id": "ch32-q03", "chapterId": "ch32"}, {"type": "multi", "question": "在开放经济两市场模型中，连接可贷资金市场与外汇市场的是？", "options": ["资本净流出", "国内利率", "汇率", "政府税收"], "answer": [0, 1], "explain": "利率决定资本净流出，资本净流出又进入外汇市场决定汇率，这条链连接两个市场。", "id": "ch32-q04", "chapterId": "ch32"}, {"type": "single", "question": "总需求曲线向下倾斜的原因不包括？", "options": ["财富效应", "利率效应", "汇率效应", "商品价格越低越多人买"], "answer": 3, "explain": "单个商品降价带来的替代效应是微观机制；AD 向下源于物价水平通过财富、利率、汇率影响总支出。", "id": "ch33-q01", "chapterId": "ch33"}, {"type": "single", "question": "长期总供给曲线是垂直线，原因是？", "options": ["价格水平不影响长期产量，产量由资本、劳动与技术决定", "企业长期不调整价格", "政府管制价格", "货币量固定"], "answer": 0, "explain": "长期所有价格与工资都能调整，产量回到自然产出率，由要素与技术决定，与物价水平无关。", "id": "ch33-q02", "chapterId": "ch33"}, {"type": "single", "question": "石油价格暴涨导致？", "options": ["SRAS 左移，产量下降、物价上升", "AD 右移，产量与物价上升", "LRAS 右移", "失业下降"], "answer": 0, "explain": "投入品涨价抬高生产成本，短期总供给左移，出现产量下降与物价上升并存的滞胀。", "id": "ch33-q03", "chapterId": "ch33"}, {"type": "multi", "question": "下列哪些因素会使总需求曲线整体右移？", "options": ["政府购买增加", "企业投资信心上升", "物价水平下降", "外国对本国产品需求增加"], "answer": [0, 1, 3], "explain": "物价下降是沿曲线移动；C、I、G、NX 的外生变化才使整条曲线移动。", "id": "ch33-q04", "chapterId": "ch33"}, {"type": "single", "question": "流动性偏好理论中，货币供给曲线画成垂直线是因为？", "options": ["货币供给由央行决定，与利率无关", "人们不持有货币", "利率固定", "货币需求不变"], "answer": 0, "explain": "货币供给由央行政策决定，不随利率变化；需求随利率上升而下降，两者交点决定利率。", "id": "ch34-q01", "chapterId": "ch34"}, {"type": "single", "question": "MPC 为 0.8，政府购买增加 100 亿元，总需求约增加？", "options": ["100 亿", "180 亿", "400 亿", "500 亿"], "answer": 3, "explain": "支出乘数 = 1 ÷ (1−0.8) = 5，100 × 5 = 500 亿元。", "id": "ch34-q02", "chapterId": "ch34"}, {"type": "single", "question": "等额减税与政府购买相比，对总需求的刺激通常？", "options": ["更大", "相同", "更小，因为部分减税被储蓄", "无法比较"], "answer": 2, "explain": "税收乘数 = −MPC/(1−MPC)，MPC=0.8 时为 −4，减税 100 亿只增加 400 亿总需求，小于政府购买的 500 亿。", "id": "ch34-q03", "chapterId": "ch34"}, {"type": "multi", "question": "属于自动稳定器的有？", "options": ["累进所得税", "失业保险", "一次性基建投资", "转移支付"], "answer": [0, 1, 3], "explain": "自动稳定器不需要决策即随经济状况自动变化；一次性基建投资需要立法批准，属于相机抉择。", "id": "ch34-q04", "chapterId": "ch34"}, {"type": "single", "question": "长期菲利普斯曲线为什么是垂直的？", "options": ["失业率与通胀率无关，失业回到自然率", "通胀永远为零", "政府控制工资", "企业不提价"], "answer": 0, "explain": "长期预期完全调整，实际通胀等于预期通胀，产量与失业回到自然水平，通胀高低不再影响失业。", "id": "ch35-q01", "chapterId": "ch35"}, {"type": "single", "question": "菲利普斯曲线与 AD-AS 模型的关系是？", "options": ["两个独立理论", "同一模型的两种坐标表达", "菲利普斯曲线更早出现因此更准确", "完全矛盾"], "answer": 1, "explain": "AD 扩张使产量上升、物价上升，对应失业下降、通胀上升，正是短期菲利普斯曲线的向下倾斜。", "id": "ch35-q02", "chapterId": "ch35"}, {"type": "single", "question": "牺牲率为 3，通胀从 6% 降到 2%，累计产出损失约为？", "options": ["4%", "6%", "12%", "18%"], "answer": 2, "explain": "降 4 个百分点 × 牺牲率 3 = 12% 的年度产出损失。", "id": "ch35-q03", "chapterId": "ch35"}, {"type": "multi", "question": "使短期菲利普斯曲线上移（同样失业率对应更高通胀）的因素有？", "options": ["预期通胀上升", "供给冲击", "自然失业率下降", "工资合同指数化"], "answer": [0, 1, 3], "explain": "预期上升、供给冲击、工资指数化都会抬高短期曲线；自然失业率下降是长期曲线的左移。", "id": "ch35-q04", "chapterId": "ch35"}, {"type": "single", "question": "反对「决策者应积极稳定经济」的核心理由是？", "options": ["衰退有益", "政策存在时滞且预测不准", "政府没有工具", "市场会自动恢复"], "answer": 1, "explain": "识别、立法、执行、见效各环节都有时滞，加上预测误差，政策可能在错误的时点发力。", "id": "ch36-q01", "chapterId": "ch36"}, {"type": "single", "question": "主张央行设定 2% 而非 0% 通胀目标的理由不包括？", "options": ["避免滑入通缩", "给名义工资调整留缓冲", "消除全部通胀成本", "保留降息空间"], "answer": 2, "explain": "正通胀仍带来皮鞋成本、菜单成本等，只是量级较小；设 2% 是为了避免通缩与工资调整困难，不是消除成本。", "id": "ch36-q02", "chapterId": "ch36"}, {"type": "single", "question": "衰退期强行平衡预算的主要问题是？", "options": ["会推高通胀", "等于紧缩，加深衰退", "会降低利率", "会减少失业"], "answer": 1, "explain": "衰退时税收自动下降、支出自动上升，强行平衡意味着增税减支，抵消自动稳定器，加深衰退。", "id": "ch36-q03", "chapterId": "ch36"}, {"type": "multi", "question": "支持「为鼓励储蓄修改税法」的论据包括？", "options": ["储蓄是资本来源、能提高生产率", "现行税制对利息与资本利得征税等于惩罚储蓄", "减税主要惠及富人所以更公平", "储蓄增加能降低对外资依赖"], "answer": [0, 1, 3], "explain": "公平性恰恰是反对意见：减税受益者多为富人，因此第三项不成立。", "id": "ch36-q04", "chapterId": "ch36"}], "flashcards": [{"id": "f-ch23-01", "chapterId": "ch23", "front": "GDP 定义的四个限定", "back": "一国境内、一定时期、最终产品与服务、市场价值。", "tags": ["GDP"]}, {"id": "f-ch23-02", "chapterId": "ch23", "front": "支出法的四项", "back": "C 消费 + I 投资 + G 政府购买 + NX 净出口；进口通过 NX 扣除。", "tags": ["GDP", "计算"]}, {"id": "f-ch23-03", "chapterId": "ch23", "front": "名义 GDP 与实际 GDP 的差别", "back": "名义用当期价格，实际用基年价格；实际剔除了价格变动，反映真实产量。", "tags": ["GDP"]}, {"id": "f-ch23-04", "chapterId": "ch23", "front": "GDP 平减指数的算法", "back": "名义 GDP ÷ 实际 GDP × 100；其百分比变化即通胀率的近似。", "tags": ["GDP", "通胀"]}, {"id": "f-ch23-05", "chapterId": "ch23", "front": "GDP 的四类盲区", "back": "家务与自给劳动、地下经济、分配与环境、闲暇与质量改进。", "tags": ["GDP", "局限"]}, {"id": "f-ch24-01", "chapterId": "ch24", "front": "CPI 的三步算法", "back": "定篮子、查当期价格、算「当期成本 ÷ 基期成本 × 100」。", "tags": ["CPI", "计算"]}, {"id": "f-ch24-02", "chapterId": "ch24", "front": "CPI 高估通胀的三个原因", "back": "替代偏差、新产品出现、质量改进未被计入。", "tags": ["CPI", "易错"]}, {"id": "f-ch24-03", "chapterId": "ch24", "front": "CPI 与平减指数的三点差别", "back": "覆盖范围（消费 vs 全部生产）、是否含进口、篮子固定还是随产量变化。", "tags": ["CPI"]}, {"id": "f-ch24-04", "chapterId": "ch24", "front": "实际利率的算法与作用", "back": "实际利率 ≈ 名义利率 − 通胀率；影响储蓄、借贷与投资决策。", "tags": ["利率"]}, {"id": "f-ch24-05", "chapterId": "ch24", "front": "指数化的利弊", "back": "利：保住实际收入；弊：可能形成工资与物价螺旋。", "tags": ["通胀"]}, {"id": "f-ch25-01", "chapterId": "ch25", "front": "生产率与生活水平的关系", "back": "人均生活水平由生产率（每劳动小时的产出）决定，而不是工作时长或资源禀赋。", "tags": ["增长"]}, {"id": "f-ch25-02", "chapterId": "ch25", "front": "决定生产率的四项因素", "back": "物质资本、人力资本、自然资源、技术知识。", "tags": ["增长"]}, {"id": "f-ch25-03", "chapterId": "ch25", "front": "技术知识与人力资本的区别", "back": "技术知识是「知识存在」；人力资本是「人掌握了知识」。技术可引进，人力资本必须自己培养。", "tags": ["增长", "易错"]}, {"id": "f-ch25-04", "chapterId": "ch25", "front": "70 法则", "back": "翻倍年数约等于 70 ÷ 年增长率（%）。", "tags": ["增长", "计算"]}, {"id": "f-ch25-05", "chapterId": "ch25", "front": "追赶效应的条件", "back": "穷国资本少、边际收益高，增长潜力大；但需要产权、开放、教育等制度条件配合。", "tags": ["增长"]}, {"id": "f-ch26-01", "chapterId": "ch26", "front": "宏观投资与金融投资的区别", "back": "宏观投资是购买新资本（设备、厂房、住宅）；买股票债券只是资产换手，不计入投资。", "tags": ["金融体系", "易错"]}, {"id": "f-ch26-02", "chapterId": "ch26", "front": "债券利率由什么决定", "back": "期限、信用风险、税收待遇：期限越长、风险越高，利率越高。", "tags": ["债券"]}, {"id": "f-ch26-03", "chapterId": "ch26", "front": "可贷资金市场的供给与需求", "back": "储蓄是供给（利率升则增），投资是需求（利率升则减），交点定均衡利率。", "tags": ["可贷资金"]}, {"id": "f-ch26-04", "chapterId": "ch26", "front": "挤出效应", "back": "政府借款增加资金需求、抬高利率，从而减少私人投资。", "tags": ["财政政策", "政策"]}, {"id": "f-ch26-05", "chapterId": "ch26", "front": "金融中介的两类", "back": "银行（吸存放贷）与共同基金（汇集资金专业投资）。", "tags": ["金融体系"]}, {"id": "f-ch27-01", "chapterId": "ch27", "front": "现值公式", "back": "PV = FV ÷ (1+r)^n；利率越高、期限越长，折得越少。", "tags": ["现值", "计算"]}, {"id": "f-ch27-02", "chapterId": "ch27", "front": "净现值为什么是投资判据", "back": "NPV = 现值 − 初始投入；正的才值得做，不同时间的现金流必须先折算。", "tags": ["现值"]}, {"id": "f-ch27-03", "chapterId": "ch27", "front": "风险厌恶的含义", "back": "偏好确定的收益而非期望相同但波动大的收益；损失痛感大于同等收益的快乐。", "tags": ["风险"]}, {"id": "f-ch27-04", "chapterId": "ch27", "front": "保险为什么值得买", "back": "把不确定的大损失换成确定的小支出；保费高于期望赔付是保险公司的成本与利润。", "tags": ["保险"]}, {"id": "f-ch27-05", "chapterId": "ch27", "front": "企业特有风险与市场风险", "back": "前者可由多元化消除，后者影响全部资产、无法分散。", "tags": ["风险"]}, {"id": "f-ch27-06", "chapterId": "ch27", "front": "基本面分析与有效市场假说", "back": "前者估未来现金流现值，后者认为价格已反映公开信息；泡沫是后者的反例。", "tags": ["资产评估"]}, {"id": "f-ch28-01", "chapterId": "ch28", "front": "失业率与劳动参与率", "back": "失业率 = 失业 ÷ 劳动力；参与率 = 劳动力 ÷ 成年人口。放弃求职者退出劳动力会压低失业率。", "tags": ["失业", "计算"]}, {"id": "f-ch28-02", "chapterId": "ch28", "front": "三类失业及对策", "back": "摩擦性（信息与匹配，靠招聘服务）、结构性（技能错配，靠培训迁移）、周期性（需求不足，靠宏观政策）。", "tags": ["失业"]}, {"id": "f-ch28-03", "chapterId": "ch28", "front": "自然失业率", "back": "摩擦性与结构性失业对应的失业水平，是经济正常运转时的失业率。", "tags": ["失业"]}, {"id": "f-ch28-04", "chapterId": "ch28", "front": "效率工资的四个理由", "back": "改善体力、降低流动率、吸引更优秀员工、减少偷懒。", "tags": ["工资"]}, {"id": "f-ch28-05", "chapterId": "ch28", "front": "失业保险的两面", "back": "保障失业者生活，但降低求职紧迫性、延长失业持续时间。", "tags": ["政策"]}, {"id": "f-ch29-01", "chapterId": "ch29", "front": "货币的三项职能", "back": "交换媒介、计价单位、价值储藏。", "tags": ["货币"]}, {"id": "f-ch29-02", "chapterId": "ch29", "front": "M1 与 M2 的差别", "back": "M1 为现金加活期存款（流动性最高），M2 再加入定期存款与货币市场基金。", "tags": ["货币"]}, {"id": "f-ch29-03", "chapterId": "ch29", "front": "部分准备金制度与货币乘数", "back": "银行只留一部分存款作准备金，货币乘数 = 1 ÷ 准备金率；贷款创造存款。", "tags": ["银行", "计算"]}, {"id": "f-ch29-04", "chapterId": "ch29", "front": "央行三大工具", "back": "公开市场操作（最常用）、调整准备金率（作用猛烈）、调整利率。", "tags": ["央行", "政策"]}, {"id": "f-ch29-05", "chapterId": "ch29", "front": "现实货币乘数为何小于 1/R", "back": "现金漏出、银行自愿持有超额准备金、部分存款不进入可贷体系。", "tags": ["银行", "易错"]}, {"id": "f-ch30-01", "chapterId": "ch30", "front": "货币数量方程", "back": "M × V = P × Y；V 与 Y 相对稳定时，物价由货币量决定。", "tags": ["通胀", "货币"]}, {"id": "f-ch30-02", "chapterId": "ch30", "front": "为什么说通胀是货币现象", "back": "持续、普遍的物价上涨需要货币扩张支撑；单品涨价只是相对价格变化。", "tags": ["通胀", "易错"]}, {"id": "f-ch30-03", "chapterId": "ch30", "front": "通胀税为什么隐蔽且累退", "back": "不需立法即可征收，持有现金多的人（多为低收入者）损失比例更大。", "tags": ["通胀税"]}, {"id": "f-ch30-04", "chapterId": "ch30", "front": "费雪效应", "back": "名义利率随预期通胀同步上升，实际利率基本不变；只有意外通胀才重新分配财富。", "tags": ["利率", "通胀"]}, {"id": "f-ch30-05", "chapterId": "ch30", "front": "通胀的五项成本", "back": "皮鞋成本、菜单成本、税制扭曲、相对价格混乱、财富再分配。", "tags": ["通胀"]}, {"id": "f-ch31-01", "chapterId": "ch31", "front": "NX 与 NCF 的关系", "back": "NX = NCF；由 S = I + NX 得 NX = S − I。", "tags": ["开放经济", "恒等式"]}, {"id": "f-ch31-02", "chapterId": "ch31", "front": "贸易顺差的经济含义", "back": "储蓄大于投资，多余资金借给外国，形成资本净流出。", "tags": ["开放经济", "易错"]}, {"id": "f-ch31-03", "chapterId": "ch31", "front": "实际汇率公式", "back": "实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价，衡量本国商品相对价格。", "tags": ["汇率", "计算"]}, {"id": "f-ch31-04", "chapterId": "ch31", "front": "购买力平价的逻辑与局限", "back": "靠套利拉平价格，但服务不可贸易、存在壁垒，因此长期部分成立、短期基本无效。", "tags": ["汇率"]}, {"id": "f-ch32-01", "chapterId": "ch32", "front": "开放经济两个市场", "back": "可贷资金市场定利率，外汇市场定汇率，中间由资本净流出连接。", "tags": ["开放经济"]}, {"id": "f-ch32-02", "chapterId": "ch32", "front": "赤字传导链", "back": "赤字 → 利率升 → 资本净流出减少 → 本币升值 → 净出口减少。", "tags": ["开放经济", "政策"]}, {"id": "f-ch32-03", "chapterId": "ch32", "front": "贸易政策为什么不改变贸易余额", "back": "进口减少使本币升值、出口同减；NX = S − I 未变，总量不变。", "tags": ["贸易政策", "易错"]}, {"id": "f-ch32-04", "chapterId": "ch32", "front": "资本外逃的两个后果", "back": "本币贬值（外汇市场本币供给增加）与利率上升（国内资金减少）。", "tags": ["金融危机"]}, {"id": "f-ch32-05", "chapterId": "ch32", "front": "判断政策对 NX 影响的快捷键", "back": "看它是否改变 S 或 I；不改变则 NX 不变，只改变汇率与构成。", "tags": ["开放经济"]}, {"id": "f-ch33-01", "chapterId": "ch33", "front": "经济波动的三个事实", "back": "无规律不可预测、多数宏观变量同向波动、产量下降时失业上升。", "tags": ["波动"]}, {"id": "f-ch33-02", "chapterId": "ch33", "front": "AD 向下的三个渠道", "back": "财富效应、利率效应、汇率效应。", "tags": ["总需求"]}, {"id": "f-ch33-03", "chapterId": "ch33", "front": "LRAS 为什么垂直", "back": "长期产量由资本、劳动、技术决定，价格水平只影响名义值。", "tags": ["总供给"]}, {"id": "f-ch33-04", "chapterId": "ch33", "front": "SRAS 向上倾斜的三个解释", "back": "粘性工资、粘性价格、对企业自身价格的错觉。", "tags": ["总供给"]}, {"id": "f-ch33-05", "chapterId": "ch33", "front": "需求冲击的短期与长期结果", "back": "短期产量与物价同升，长期产量回到自然率、只有物价上升。", "tags": ["AD-AS", "易错"]}, {"id": "f-ch33-06", "chapterId": "ch33", "front": "滞胀", "back": "供给冲击使 SRAS 左移，产量下降与物价上升同时发生，政策两难。", "tags": ["滞胀"]}, {"id": "f-ch34-01", "chapterId": "ch34", "front": "流动性偏好理论", "back": "货币需求随利率上升而减少，货币供给由央行决定，交点定利率。", "tags": ["货币政策"]}, {"id": "f-ch34-02", "chapterId": "ch34", "front": "货币政策传导链", "back": "货币供给增加 → 利率下降 → 投资增加 → 总需求右移。", "tags": ["货币政策"]}, {"id": "f-ch34-03", "chapterId": "ch34", "front": "支出乘数与税收乘数", "back": "支出乘数 1/(1−MPC)；税收乘数 −MPC/(1−MPC)，绝对值更小。", "tags": ["财政政策", "计算"]}, {"id": "f-ch34-04", "chapterId": "ch34", "front": "挤出效应", "back": "政府借款抬高利率、减少私人投资，削弱财政政策效果；衰退期较弱。", "tags": ["财政政策"]}, {"id": "f-ch34-05", "chapterId": "ch34", "front": "自动稳定器", "back": "累进所得税与转移支付随经济自动调节，无时滞、不受政治干扰，但只能缓冲。", "tags": ["稳定政策"]}, {"id": "f-ch35-01", "chapterId": "ch35", "front": "菲利普斯曲线的本质", "back": "AD-AS 模型的另一种画法：总需求扩张对应通胀升、失业降。", "tags": ["菲利普斯曲线"]}, {"id": "f-ch35-02", "chapterId": "ch35", "front": "短期与长期菲利普斯曲线", "back": "短期向下倾斜（意料之外的通胀能降失业），长期垂直（在自然失业率处）。", "tags": ["菲利普斯曲线", "易错"]}, {"id": "f-ch35-03", "chapterId": "ch35", "front": "自然率假说", "back": "无论通胀多高，失业最终回到自然率；1970 年代滞胀是其证据。", "tags": ["菲利普斯曲线"]}, {"id": "f-ch35-04", "chapterId": "ch35", "front": "牺牲率", "back": "降低 1 个百分点通胀所损失的年度产出百分比，经验值约 2–5。", "tags": ["反通胀"]}, {"id": "f-ch35-05", "chapterId": "ch35", "front": "理性预期为什么能降低反通胀代价", "back": "若央行可信地宣布并被执行，预期立即下调，工资价格同步调整，产量损失小。", "tags": ["反通胀"]}, {"id": "f-ch35-06", "chapterId": "ch35", "front": "滞胀在曲线上的表现", "back": "供给冲击使短期曲线右移，通胀与失业同时上升。", "tags": ["滞胀"]}, {"id": "f-ch36-01", "chapterId": "ch36", "front": "六个争论的清单", "back": "稳定经济？增支还是减税？规则还是相机抉择？零通胀目标？平衡预算？为储蓄改税？", "tags": ["政策争论"]}, {"id": "f-ch36-02", "chapterId": "ch36", "front": "时滞为什么是反方核心论据", "back": "识别、立法、执行、见效都要时间，等政策落地时经济状况可能已反转。", "tags": ["稳定政策"]}, {"id": "f-ch36-03", "chapterId": "ch36", "front": "规则 vs 相机抉择的折中", "back": "多数央行采用受约束的相机抉择：明确通胀目标，工具与节奏保留弹性。", "tags": ["货币政策"]}, {"id": "f-ch36-04", "chapterId": "ch36", "front": "零通胀目标的三重风险", "back": "滑入通缩、反通胀代价高、名义工资难以下调。", "tags": ["通胀目标"]}, {"id": "f-ch36-05", "chapterId": "ch36", "front": "周期性赤字与结构性赤字", "back": "前者由衰退造成应容忍，后者是长期入不敷出应削减。", "tags": ["财政"]}, {"id": "f-ch36-06", "chapterId": "ch36", "front": "储蓄激励的公平争议", "back": "减税主要惠及本已高储蓄的富人，且短期压低消费需求。", "tags": ["税收"]}], "glossary": [{"term": "国内生产总值", "def": "一国境内一定时期内生产的所有最终物品与服务的市场价值。", "chapterId": "ch23"}, {"term": "最终产品", "def": "直接供最终使用、不再作为其他产品投入的产品。", "chapterId": "ch23"}, {"term": "名义 GDP", "def": "按当期价格计算的 GDP。", "chapterId": "ch23"}, {"term": "实际 GDP", "def": "按基年价格计算的 GDP，剔除价格变动影响。", "chapterId": "ch23"}, {"term": "GDP 平减指数", "def": "名义 GDP 与实际 GDP 之比乘以 100，衡量整体价格水平。", "chapterId": "ch23"}, {"term": "消费物价指数", "def": "用固定一篮子消费品价格计算的物价指数，衡量生活费用变化。", "chapterId": "ch24"}, {"term": "通货膨胀率", "def": "物价指数在两个时期之间的百分比变化。", "chapterId": "ch24"}, {"term": "指数化", "def": "按物价指数自动调整金额，以维持实际购买力。", "chapterId": "ch24"}, {"term": "名义利率", "def": "未扣除通胀的挂牌利率。", "chapterId": "ch24"}, {"term": "实际利率", "def": "名义利率扣除通胀后的购买力增长，近似等于名义利率减通胀率。", "chapterId": "ch24"}, {"term": "生产率", "def": "每单位劳动投入所生产的产出量。", "chapterId": "ch25"}, {"term": "物质资本", "def": "用于生产的设备、厂房与基础设施。", "chapterId": "ch25"}, {"term": "人力资本", "def": "劳动者通过教育、培训与经验积累的知识与技能。", "chapterId": "ch25"}, {"term": "技术知识", "def": "关于如何生产的知识本身，存在于专利、文献与工艺中。", "chapterId": "ch25"}, {"term": "追赶效应", "def": "资本存量低的穷国增长更快，因为资本边际收益更高。", "chapterId": "ch25"}, {"term": "债券", "def": "借款人承诺按期付息还本的债务凭证。", "chapterId": "ch26"}, {"term": "股票", "def": "对企业所有权的份额，持有人分享剩余收益。", "chapterId": "ch26"}, {"term": "金融中介", "def": "连接储蓄者与借款人的机构，如银行、共同基金。", "chapterId": "ch26"}, {"term": "可贷资金市场", "def": "储蓄供给与投资需求相互作用决定利率的市场模型。", "chapterId": "ch26"}, {"term": "挤出效应", "def": "政府借款抬高利率、减少私人投资的现象。", "chapterId": "ch26"}, {"term": "共同基金", "def": "汇集众多投资者资金、由专业经理投资于组合的机构。", "chapterId": "ch26"}, {"term": "现值", "def": "未来一笔金额按某一利率折算成的今天价值。", "chapterId": "ch27"}, {"term": "净现值", "def": "未来现金流的现值减去初始投入。", "chapterId": "ch27"}, {"term": "风险厌恶", "def": "偏好确定收益、回避波动的倾向。", "chapterId": "ch27"}, {"term": "多元化", "def": "把资金投入不相关资产以降低企业特有风险。", "chapterId": "ch27"}, {"term": "基本面分析", "def": "通过估算资产未来现金流的现值来判断其价值。", "chapterId": "ch27"}, {"term": "有效市场假说", "def": "资产价格已充分反映所有公开信息的理论。", "chapterId": "ch27"}, {"term": "泡沫", "def": "资产价格远超其基本面价值的现象。", "chapterId": "ch27"}, {"term": "劳动力", "def": "就业者与失业者的总和。", "chapterId": "ch28"}, {"term": "失业率", "def": "失业人数占劳动力的比例。", "chapterId": "ch28"}, {"term": "劳动参与率", "def": "劳动力占成年人口的比例。", "chapterId": "ch28"}, {"term": "摩擦性失业", "def": "换工作或初入职场期间寻找匹配岗位造成的失业。", "chapterId": "ch28"}, {"term": "结构性失业", "def": "技能或地区与岗位需求不匹配造成的失业。", "chapterId": "ch28"}, {"term": "周期性失业", "def": "经济衰退中总需求不足造成的失业。", "chapterId": "ch28"}, {"term": "自然失业率", "def": "摩擦性与结构性失业对应的正常失业水平。", "chapterId": "ch28"}, {"term": "失业保险", "def": "向失业者提供部分收入补偿的制度。", "chapterId": "ch28"}, {"term": "货币", "def": "被广泛接受用作交换媒介、计价单位与价值储藏的东西。", "chapterId": "ch29"}, {"term": "流动性", "def": "资产转换为交换媒介的容易程度。", "chapterId": "ch29"}, {"term": "商品货币", "def": "自身具有内在价值的货币，如金银。", "chapterId": "ch29"}, {"term": "法定货币", "def": "没有内在价值、依靠政府法令与信任流通的货币。", "chapterId": "ch29"}, {"term": "准备金", "def": "银行保留的不贷出的存款部分。", "chapterId": "ch29"}, {"term": "准备金率", "def": "准备金占存款的比例。", "chapterId": "ch29"}, {"term": "货币乘数", "def": "准备金率倒数，表示单位准备金能支撑的存款总额。", "chapterId": "ch29"}, {"term": "公开市场操作", "def": "央行买卖政府债券以调节银行体系准备金与货币供给。", "chapterId": "ch29"}, {"term": "货币数量论", "def": "用 MV = PY 说明物价水平由货币量决定的理论。", "chapterId": "ch30"}, {"term": "流通速度", "def": "单位货币在一年内参与交易的次数。", "chapterId": "ch30"}, {"term": "通胀税", "def": "政府通过印钞融资，使持币者购买力下降所形成的隐性税负。", "chapterId": "ch30"}, {"term": "费雪效应", "def": "名义利率随预期通胀同向调整的现象。", "chapterId": "ch30"}, {"term": "皮鞋成本", "def": "为减少持有现金的损失而频繁取现所耗费的时间与资源。", "chapterId": "ch30"}, {"term": "菜单成本", "def": "因改价而发生的重印、更新与沟通成本。", "chapterId": "ch30"}, {"term": "恶性通胀", "def": "物价极高速上涨、货币失去基本职能的极端通胀。", "chapterId": "ch30"}, {"term": "净出口", "def": "出口减进口，也称贸易余额。", "chapterId": "ch31"}, {"term": "资本净流出", "def": "本国居民购买外国资产减去外国人购买本国资产。", "chapterId": "ch31"}, {"term": "名义汇率", "def": "两种货币之间的兑换比率。", "chapterId": "ch31"}, {"term": "实际汇率", "def": "两国商品的相对价格，等于名义汇率乘以两国物价之比。", "chapterId": "ch31"}, {"term": "购买力平价", "def": "同样商品在各国换算后应价格相同的理论。", "chapterId": "ch31"}, {"term": "升值", "def": "本币能兑换更多外币。", "chapterId": "ch31"}, {"term": "外汇市场", "def": "本币与外币相互兑换的市场，供求决定汇率。", "chapterId": "ch32"}, {"term": "资本外逃", "def": "投资者因对一国失去信心而大规模转移资金。", "chapterId": "ch32"}, {"term": "贸易政策", "def": "关税、配额、补贴等限制或鼓励进出口的政策。", "chapterId": "ch32"}, {"term": "总需求", "def": "物价水平与总产出需求量之间的关系。", "chapterId": "ch33"}, {"term": "总供给", "def": "物价水平与总产出供给量之间的关系。", "chapterId": "ch33"}, {"term": "自然产出率", "def": "经济在正常运转时能生产的产出水平，由要素与技术决定。", "chapterId": "ch33"}, {"term": "滞胀", "def": "产量下降与物价上涨同时出现的状态。", "chapterId": "ch33"}, {"term": "粘性工资", "def": "名义工资因合同或习惯不能随物价立即调整。", "chapterId": "ch33"}, {"term": "流动性偏好", "def": "人们偏好持有流动性高的资产，该理论用货币供求解释利率。", "chapterId": "ch34"}, {"term": "支出乘数", "def": "政府购买增加引起的总需求变化倍数，等于 1/(1−MPC)。", "chapterId": "ch34"}, {"term": "税收乘数", "def": "减税引起的总需求变化倍数，等于 −MPC/(1−MPC)。", "chapterId": "ch34"}, {"term": "挤出效应", "def": "政府借款抬高利率从而减少私人投资的现象。", "chapterId": "ch34"}, {"term": "自动稳定器", "def": "不需政策决策即随经济状况自动调节税收与支出的机制。", "chapterId": "ch34"}, {"term": "边际消费倾向", "def": "收入每增加一单位用于消费的比例。", "chapterId": "ch34"}, {"term": "菲利普斯曲线", "def": "通货膨胀率与失业率之间关系的曲线。", "chapterId": "ch35"}, {"term": "自然率假说", "def": "失业最终回到自然失业率、不受通胀水平影响的观点。", "chapterId": "ch35"}, {"term": "牺牲率", "def": "降低一个百分点通胀所损失的年度产出百分比。", "chapterId": "ch35"}, {"term": "反通货膨胀", "def": "刻意降低通货膨胀率的政策过程。", "chapterId": "ch35"}, {"term": "滞胀", "def": "通胀上升与失业上升并存的状态。", "chapterId": "ch35"}, {"term": "相机抉择", "def": "根据当时形势灵活决定政策，而非按固定规则行事。", "chapterId": "ch36"}, {"term": "自动稳定器", "def": "无需决策即随经济周期自动调节收支的机制。", "chapterId": "ch36"}, {"term": "周期性赤字", "def": "经济衰退导致税收减少、支出增加所形成的赤字。", "chapterId": "ch36"}, {"term": "结构性赤字", "def": "剔除周期因素后仍存在的长期收支缺口。", "chapterId": "ch36"}]}, "rendered": {"ch23": "<h1>第 23 章：一国收入的衡量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无（宏观第一站）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 GDP 的定义要素，并判断哪些交易计入、哪些不计入。\n<\/li><li>\n用支出法把 GDP 拆成 C + I + G + NX 四部分。\n<\/li><li>\n区分名义 GDP 与实际 GDP，算出 GDP 平减指数与通货膨胀率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>GDP 是&quot;一国境内一年里新生产出来的最终产品与服务的市场价值&quot;；它衡量的是<strong>流量<\/strong>（这一年生产了多少），不是存量（有多少财富），也不算没经过市场的东西。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>定义的四个关键词<\/h3>\n<p><strong>国内生产总值<\/strong>（GDP）的定义里藏了四个限定，每个都排除掉一类东西：<\/p>\n<ol><li>\n<strong>一国境内<\/strong>：外国公司在中国的工厂算中国的 GDP（地理原则），不算外国的 GNP。中国公司在越南的工厂反过来。\n<\/li><li>\n<strong>一定时期内<\/strong>：通常一年或一季度。存量（房子、存款）不算，只有这一年的<strong>新增生产<\/strong>算。\n<\/li><li>\n<strong>最终<\/strong>物品与服务：中间品不计入，否则重复计算。面粉做成面包，只算面包的价格。\n<\/li><li>\n<strong>市场价值<\/strong>：用市场价格加总。没有市场价格的（家务劳动、自给自足的粮食）无法计入。\n<\/ol>\n<p>因此下面这些都不算 GDP：<\/p>\n<ul><li>\n二手交易（旧车转手，只算中介佣金）\n<\/li><li>\n转移支付（退休金、救济金，没有对应生产）\n<\/li><li>\n自家做的饭、自己修的水管（没有市场交易）\n<\/li><li>\n地下经济与黑市\n<\/li><li>\n股票买卖（只是资产换手，佣金除外）\n<\/ul>\n<h3>支出法：GDP 的四个买家<\/h3>\n<p><strong>GDP = C + I + G + NX<\/strong><\/p>\n<table><thead><tr><th>符号<\/th><th>名称<\/th><th>包含什么<\/th><th>注意<\/th><\/tr><\/thead><tbody><tr><td>C<\/td><td>消费<\/td><td>家庭购买的耐用品、非耐用品、服务<\/td><td>买新房不算 C，算 I<\/td><\/tr><tr><td>I<\/td><td>投资<\/td><td>企业设备、厂房、住宅建造、库存变化<\/td><td>买股票债券不算 I，那是金融交易<\/td><\/tr><tr><td>G<\/td><td>政府购买<\/td><td>政府支付的工资、买的物资<\/td><td>转移支付不算 G<\/td><\/tr><tr><td>NX<\/td><td>净出口<\/td><td>出口 − 进口<\/td><td>进口要从总支出里扣掉，因为它不是本国生产<\/td><\/tr><\/tbody><\/table>\n<p>一个容易错的点：<strong>进口的消费品已经在 C 里了，但不是本国生产<\/strong>，所以要减去。这就是 NX 的作用。<\/p>\n<h3>名义与实际<\/h3>\n<p><strong>名义 GDP<\/strong> 用当期价格算。<strong>实际 GDP<\/strong> 用基年价格算，剔除了价格变化。<\/p>\n<p>一个只有两种产品的例子（基年 2015）：<\/p>\n<table><thead><tr><th>年份<\/th><th>苹果（元/个，个）<\/th><th>面包（元/条，条）<\/th><th>名义 GDP<\/th><th>实际 GDP（2015 价）<\/th><\/tr><\/thead><tbody><tr><td>2015<\/td><td>2 × 100<\/td><td>3 × 50<\/td><td>350<\/td><td>350<\/td><\/tr><tr><td>2016<\/td><td>3 × 110<\/td><td>4 × 55<\/td><td>550<\/td><td>385<\/td><\/tr><\/tbody><\/table>\n<p>2016 年名义 GDP 涨了 57%，但实际只涨了 10%——剩下的 47% 是涨价。<\/p>\n<p><strong>GDP 平减指数<\/strong> = 名义 GDP ÷ 实际 GDP × 100。2016 年为 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高了约 43%。<\/p>\n<p><strong>通货膨胀率<\/strong> = 平减指数的百分比变化。若上一年平减指数是 130，则当年通胀率 ≈ (
