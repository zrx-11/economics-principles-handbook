142.9 − 130) ÷ 130 ≈ 10%。<\/p>\n<h3>人均 GDP 与生活水平<\/h3>\n<p>GDP 总量大不代表人人富裕。比较国家生活水平要用<strong>人均 GDP<\/strong> = GDP ÷ 人口。<\/p>\n<p>但人均 GDP 也不能完全代表生活水平：它不反映分配、环境、闲暇、健康、教育。一个 GDP 高但污染严重、工作时间极长的国家，生活质量未必最好。<\/p>\n<h3>GDP 的局限<\/h3>\n<ul><li>\n不含家务与自给劳动（这部分在穷国占比更大，使国际比较失真）\n<\/li><li>\n不含地下经济\n<\/li><li>\n不反映分配\n<\/li><li>\n不反映环境成本与资源耗竭\n<\/li><li>\n不反映闲暇与健康\n<\/li><li>\n不反映产品质量改进（新版手机比旧版好，但若价格不变统计不出来）\n<\/ul>\n<p>这些局限不否定 GDP 的用处。它是目前最可靠、最及时的总体经济活动指标，局限在于不能当成&quot;福利&quot;的同义词。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;GDP 涨了就是大家变富了&quot;——实际上要扣掉人口增长与价格因素，看人均实际 GDP。\n<\/li><li>\n别以为&quot;二手房交易推高 GDP&quot;——实际上只计中介服务费，房屋本身的转手不计入。\n<\/li><li>\n别以为&quot;政府花的钱都算 GDP&quot;——实际上只有政府购买算，转移支付不算。\n<\/li><li>\n别以为&quot;GDP 包括外国企业在本国的产值不算&quot;——实际上按地理原则，算在本国 GDP 里。\n<\/ul>\n<ol><li>\n（单选）下列哪一项计入当年的 GDP？\n<p>A. 二手车的转手价格  B. 政府发放的失业救济金  C. 新建住宅的建造价值  D. 购买某公司股票 <strong>答案<\/strong>：C；<strong>解析<\/strong>：新建住宅属于投资（I），计入 GDP。二手车只计中介佣金，救济金是转移支付，买股票是资产换手，都不计入。<\/p>\n<\/ol>\n<ol><li>\n（单选）某国名义 GDP 为 550 亿元，按基年价格计算的实际 GDP 为 385 亿元。GDP 平减指数约为？\n<p>A. 100  B. 130  C. 142.9  D. 165 <strong>答案<\/strong>：C；<strong>解析<\/strong>：平减指数 = 名义 ÷ 实际 × 100 = 550 ÷ 385 × 100 ≈ 142.9，说明价格水平比基年高约 43%。<\/p>\n<\/ol>\n<ol><li>\n（单选）支出法下，进口消费品为什么要从总支出中减去？\n<p>A. 因为进口品价格更高  B. 因为它已被计入消费但并非本国生产  C. 因为进口要交关税  D. 因为进口品不计入统计口径 <strong>答案<\/strong>：B；<strong>解析<\/strong>：消费者买进口货时这笔钱算在 C 里，但它不是本国生产的，所以通过 NX = 出口 − 进口 把它扣除。<\/p>\n<\/ol>\n<ol><li>\n（多选）GDP 无法反映下列哪些内容？\n<p>A. 家务劳动的价值  B. 收入分配状况  C. 环境破坏的成本  D. 产品的质量改进 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：GDP 只统计有市场价格的最终产品，不反映分配、环境、家务与质量变化，因此不能等同于福利。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nGDP = 境内、一定时期、最终产品、市场价值；中间品、二手交易、转移支付、家务都不计入。\n<\/li><li>\n支出法：GDP = C + I + G + NX，进口要从支出中减去。\n<\/li><li>\n实际 GDP 用基年价格；平减指数 = 名义 ÷ 实际 × 100；通胀率是平减指数的变化率。\n<\/ul>", "ch24": "<h1>第 24 章：生活费用的衡量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用一篮子商品的价格算出 CPI，并说明它和 GDP 平减指数的三点差别。\n<\/li><li>\n说出 CPI 高估通胀的三个原因。\n<\/li><li>\n由名义利率与通胀率算出实际利率，并解释为什么它才影响借款与储蓄的决定。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>CPI 用&quot;固定一篮子商品&quot;跟踪价格变化，回答的是&quot;同样的日子今天贵了多少&quot;；它系统性偏高一点，但仍是调整工资、养老金和利率的基准。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三步算出 CPI<\/h3>\n<ol><li>\n<strong>定篮子<\/strong>：确定一个普通家庭一年买哪些东西、各买多少。这一步由统计部门通过家庭支出调查完成。\n<\/li><li>\n<strong>查价格<\/strong>：每年查这些商品的价格。\n<\/li><li>\n<strong>算指数<\/strong>：CPI = 当期篮子成本 ÷ 基期篮子成本 × 100。\n<\/ol>\n<p>例：篮子是 4 个苹果 + 2 条面包。基年苹果 2 元、面包 3 元，篮子成本 4×2 + 2×3 = 14 元。当期苹果 3 元、面包 4 元，成本 4×3 + 2×4 = 20 元。<\/p>\n<p>CPI = 20 ÷ 14 × 100 ≈ 142.9。比基年高 42.9%。<\/p>\n<p><strong>通胀率<\/strong> = (本期 CPI − 上期 CPI) ÷ 上期 CPI × 100%。若上一期 CPI 为 135，则本期通胀率 ≈ (142.9 − 135) ÷ 135 ≈ 5.9%。<\/p>\n<h3>CPI 与 GDP 平减指数的三点差别<\/h3>\n<table><thead><tr><th><\/th><th>CPI<\/th><th>GDP 平减指数<\/th><\/tr><\/thead><tbody><tr><td>覆盖范围<\/td><td>只含消费者购买的<\/td><td>含全部国内生产的（投资、政府采购、出口）<\/td><\/tr><tr><td>进口品<\/td><td>计入（消费者买进口货）<\/td><td>不计入<\/td><\/tr><tr><td>篮子<\/td><td>固定（基年数量）<\/td><td>随当期产量变化<\/td><\/tr><\/tbody><\/table>\n<p>所以两者数字不一样，用途也不同：CPI 用来调整居民收入，平减指数用来衡量整体价格水平。<\/p>\n<h3>CPI 为什么偏高<\/h3>\n<ol><li>\n<strong>替代偏差<\/strong>：苹果涨价，消费者改买梨。CPI 仍按&quot;4 个苹果&quot;算，高估了生活成本上升。\n<\/li><li>\n<strong>新产品<\/strong>：新商品（手机、网约车）出现后，消费者的选择变多，同样的钱买到更多效用，CPI 篮子没有及时纳入。\n<\/li><li>\n<strong>质量变化<\/strong>：同样价格的东西变好了（手机性能提升），实际是降价，但 CPI 未必调整。\n<\/ol>\n<p>这三点使 CPI 每年高估约 1 个百分点（具体幅度各国不同）。后果是：按 CPI 调整的养老金与工资会略微&quot;超额补偿&quot;。<\/p>\n<h3>指数化<\/h3>\n<p><strong>指数化<\/strong>（indexation）指自动按物价指数调整金额。社保养老金、部分劳动合同、通胀挂钩债券都这么做。<\/p>\n<p>好处：避免通胀侵蚀实际收入。坏处：可能形成&quot;工资—物价螺旋&quot;——物价涨，工资自动涨，成本上升，物价再涨。<\/p>\n<h3>名义利率与实际利率<\/h3>\n<ul><li>\n<strong>名义利率<\/strong>：银行挂牌的利率，比如 5%。\n<\/li><li>\n<strong>实际利率<\/strong>：扣除通胀后的购买力增长，<strong>实际利率 ≈ 名义利率 − 通胀率<\/strong>。\n<\/ul>\n<p>例：名义利率 5%，通胀率 3%，实际利率约 2%。你把 100 元存一年得到 105 元，但这 105 元只能买到相当于去年 102 元的东西。<\/p>\n<p>关键结论：<strong>影响借贷与储蓄决策的是实际利率<\/strong>。若名义利率 8%、通胀 10%，实际利率是 −2%，存钱是亏的。<\/p>\n<h3>名义与实际的换算<\/h3>\n<p>&quot;把过去的钱换算成今天的钱&quot;：今天的金额 = 过去金额 × (今天的价格指数 ÷ 过去的价格指数)。<\/p>\n<p>例：1990 年月薪 200 元，当年 CPI 为 50；今天 CPI 为 250。相当于今天的 200 × 250 ÷ 50 = 1000 元。这样比较才公平。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;CPI 涨了就是我买东西都贵了这么多&quot;——实际上你的消费结构与篮子不同，感受会差很多。\n<\/li><li>\n别以为&quot;CPI 与 GDP 平减指数可以互换&quot;——实际上覆盖范围与篮子都不同，数值不同、用途不同。\n<\/li><li>\n别以为&quot;通胀时只要名义工资涨了就没事&quot;——实际上要看涨幅是否超过物价，实际工资才决定购买力。\n<\/li><li>\n别以为&quot;实际利率 = 名义利率 − 通胀率&quot;永远精确——实际上这是近似公式，精确式为 (1+名义)/(1+通胀) − 1，高通胀时差别明显。\n<\/ul>\n<ol><li>\n（单选）篮子为 4 个苹果与 2 条面包。基年成本 14 元，当期成本 20 元。CPI 约为？\n<p>A. 120  B. 135  C. 142.9  D. 150 <strong>答案<\/strong>：C；<strong>解析<\/strong>：CPI = 20 ÷ 14 × 100 ≈ 142.9，表示价格水平比基年高约 42.9%。<\/p>\n<\/ol>\n<ol><li>\n（单选）CPI 与 GDP 平减指数最重要的差别是？\n<p>A. CPI 只统计消费品，平减指数覆盖全部国内生产  B. CPI 每月公布，平减指数每年公布  C. CPI 不含服务，平减指数含服务  D. 两者完全相同 <strong>答案<\/strong>：A；<strong>解析<\/strong>：CPI 只用消费者篮子（含进口消费品），平减指数覆盖国内生产的全部产品（含投资品与出口），两者数值与用途都不同。<\/p>\n<\/ol>\n<ol><li>\n（单选）名义利率 6%，通胀率 4%，实际利率约为？\n<p>A. 10%  B. 2%  C. 1.5%  D. −2% <strong>答案<\/strong>：B；<strong>解析<\/strong>：实际利率 ≈ 名义利率 − 通胀率 = 2%。影响储蓄与借贷决策的是实际利率，而不是挂牌的名义利率。<\/p>\n<\/ol>\n<ol><li>\n（填空）按物价指数自动调整工资或养老金的做法叫什么？（两个字）\n<p><strong>答案<\/strong>：指数化；<strong>解析<\/strong>：指数化能避免通胀侵蚀实际收入，但可能形成工资与物价互相推动的螺旋。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nCPI = 当期篮子成本 ÷ 基期篮子成本 × 100；三步是定篮子、查价格、算指数。\n<\/li><li>\nCPI 偏高源于替代偏差、新产品、质量变化。\n<\/li><li>\n实际利率 ≈ 名义利率 − 通胀率，影响储蓄与借贷决策的是实际利率。\n<\/ul>", "ch25": "<h1>第 25 章：生产与增长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「生产率 = 人均产出」解释国家间生活水平差距的来源。\n<\/li><li>\n说出决定生产率的四项因素，并各举一例说明政策如何影响它。\n<\/li><li>\n用 70 法则估算经济翻倍所需年数，并说明追赶效应为什么存在。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个国家的生活水平取决于它的劳动生产率；生产率由物质资本、人力资本、自然资源和技术决定，其中制度与政策能改变的是储蓄、教育、产权与开放。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么有的国家富、有的国家穷<\/h3>\n<p>比较生活水平看<strong>人均实际 GDP<\/strong>。差距可以达到几十倍：美国人均 GDP 是某些非洲国家的 20 倍以上。<\/p>\n<p>解释只有一个核心变量：<strong>生产率<\/strong>（productivity），即每单位劳动投入生产的产出量，写成 Y/L（L 为劳动小时数）。<\/p>\n<p>注意区分：生产率高不等于&quot;工作辛苦&quot;。一个用挖掘机的工人一小时挖的土，比一百个用铁锹的人还多——靠的是工具，不是汗水。<\/p>\n<h3>决定生产率的四项因素<\/h3>\n<p><strong>一、物质资本<\/strong>（physical capital）：工具、机器、厂房、基础设施。人均资本越多，人均产出越高。但资本有<strong>边际收益递减<\/strong>：同样的机器，第 10 台带来的增产小于第 1 台。<\/p>\n<p><strong>二、人力资本<\/strong>（human capital）：劳动者通过教育、培训、经验获得的知识与技能。它与物质资本相似，也是投资出来的，也有边际递减。<\/p>\n<p><strong>三、自然资源<\/strong>：土地、矿产、石油。有资源的国家起点高，但不是决定性的——日本、新加坡资源匮乏却富裕，靠的是前两项与技术。<\/p>\n<p><strong>四、技术知识<\/strong>：<strong>技术知识<\/strong>（technological knowledge）是&quot;怎么生产&quot;的知识，与人力资本不同——人力资本是&quot;人掌握了知识&quot;，技术知识是&quot;知识本身存在&quot;（可能在书里、在专利里）。<\/p>\n<p>区别很关键：一个国家可以引进技术（专利、设备），但人力资本必须自己培养。<\/p>\n<h3>增长政策<\/h3>\n<p><strong>一、储蓄与投资。<\/strong> 资本来自投资，投资来自储蓄。储蓄率高，资本积累快，增长快。代价是当期消费减少。<\/p>\n<p><strong>二、吸引外资。<\/strong> 外国直接投资带来资本与技术；购买本国债券提供资金但不带来技术。两者都能加速资本积累。<\/p>\n<p><strong>三、教育与健康。<\/strong> 教育提升人力资本。健康同样重要——疾病会摧毁人力资本，疟疾、寄生虫病高发地区生产率显著偏低。<\/p>\n<p><strong>四、产权与政治稳定。<\/strong> 没有可靠的产权保护，没人愿意投资。这是制度层面的根本条件，比任何单项政策都重要。<\/p>\n<p><strong>五、自由贸易。<\/strong> 开放让一国专注自己有优势的产业，同时引进技术与设备。 inward-looking（ inward 型）的进口替代政策往往效果不佳。<\/p>\n<p><strong>六、研发。<\/strong> 基础研究的社会回报远高于私人回报，因此需要政府资助（专利制度是一种折中：给暂时垄断换取公开技术）。<\/p>\n<h3>70 法则与追赶效应<\/h3>\n<p><strong>70 法则<\/strong>：若年增长率为 g%，经济翻倍所需年数约为 70 ÷ g。<\/p>\n<ul><li>\n增长 2%：约 35 年翻倍。\n<\/li><li>\n增长 7%：约 10 年翻倍。\n<\/li><li>\n增长 10%：约 7 年翻倍。\n<\/ul>\n<p>这个差距是复利效应，几十年就拉开巨大距离。中国 1978 年后年均近 10% 的增长，四十年就是几十倍的差距。<\/p>\n<p><strong>追赶效应<\/strong>（catch-up effect）：穷国的增长潜力更大，因为资本边际收益递减——穷国资本少，每增加一单位资本的增产效果更明显。这解释了中国、韩国、东南亚在起步阶段的快速增长，也解释了为什么发达国家的增速普遍较低。<\/p>\n<p>但追赶效应不是自动发生的，需要产权、开放、教育这些条件配合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;自然资源丰富就一定富裕&quot;——实际上资源诅咒存在，制度与人力资本更关键。\n<\/li><li>\n别以为&quot;高储蓄率永远好&quot;——实际上储蓄挤占当期消费，过度储蓄会导致产能过剩与消费不足。\n<\/li><li>\n别以为&quot;技术可以随便引进&quot;——实际上技术引进需要本地人力资本吸收，识字率与工程能力是前提。\n<\/li><li>\n别以为&quot;增长率差一点没关系&quot;——实际上复利效应下，2% 与 7% 几十年后是数量级的差距。\n<\/ul>\n<ol><li>\n（单选）70 法则下，年增长 7% 的经济翻倍约需多少年？\n<p>A. 7 年  B. 10 年  C. 20 年  D. 35 年 <strong>答案<\/strong>：B；<strong>解析<\/strong>：70 ÷ 7 = 10 年。增长 2% 则需 35 年，复利效应下差距悬殊。<\/p>\n<\/ol>\n<ol><li>\n（单选）「追赶效应」存在的原因是？\n<p>A. 穷国人口多  B. 穷国资本少，每增加一单位资本的增产效果更明显  C. 穷国技术更好  D. 发达国家不愿意增长 <strong>答案<\/strong>：B；<strong>解析<\/strong>：资本边际收益递减意味着一单位资本在资本存量低的穷国产生更大的产出增量，因此穷国有更快的增长潜力。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪项不是决定生产率的核心因素？\n<p>A. 物质资本  B. 人力资本  C. 货币发行量  D. 技术知识 <strong>答案<\/strong>：C；<strong>解析<\/strong>：生产率由物质资本、人力资本、自然资源与技术决定。货币量影响价格水平，不影响生产率。<\/p>\n<\/ol>\n<ol><li>\n（多选）有利于长期增长的政策包括？\n<p>A. 保护产权与政治稳定  B. 提高储蓄率并投资于资本  C. 普及教育与改善健康  D. 闭关限制进口 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项分别对应制度、资本、人力资本。闭关限制进口通常不利于技术引进与专业化分工。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n生活水平由生产率决定：Y/L，靠资本、人力资本、资源、技术。\n<\/li><li>\n政策杠杆：储蓄投资、外资、教育健康、产权稳定、自由贸易、研发。\n<\/li><li>\n70 法则：翻倍年数 ≈ 70 ÷ 增长率；穷国有追赶效应但需制度配合。\n<\/ul>", "ch26": "<h1>第 26 章：储蓄、投资和金融体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23、25 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分金融市场（债券、股票）与金融中介（银行、共同基金）的功能。\n<\/li><li>\n用可贷资金市场模型说明利率如何由储蓄与投资决定。\n<\/li><li>\n解释政府预算赤字为什么抬高利率、减少投资（挤出效应）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个封闭经济里，储蓄是资金的供给、投资是资金的需求，两者相等处决定利率；政府借得多了，就从私人投资那里挤走资金，利率上升、投资减少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先分清几个词<\/h3>\n<ul><li>\n<strong>储蓄<\/strong>（saving）：收入减去消费，S = Y − C − G。\n<\/li><li>\n<strong>投资<\/strong>（investment）：购买新资本，机器、厂房、住宅。\n<\/li><li>\n日常说的&quot;投资股票&quot;在宏观里不是投资，那是<strong>资产交换<\/strong>，只改变所有权，不创造新资本。\n<\/ul>\n<p>这两者的关系是本章的主线：<strong>储蓄提供资金，投资使用资金<\/strong>。<\/p>\n<h3>金融体系的两种通道<\/h3>\n<p><strong>一、金融市场<\/strong>（financial markets）：直接融资。<\/p>\n<ul><li>\n<strong>债券市场<\/strong>：企业或政府发行债券借钱，承诺按期付息还本。债券的三个特征——期限、信用风险、税收待遇——决定利率高低。期限越长、风险越高，利率越高。\n<\/li><li>\n<strong>股票市场<\/strong>：企业发行股票筹集资金，股东获得剩余收益（分红与涨价）。股票收益高于债券，但风险也高。\n<\/ul>\n<p><strong>二、金融中介<\/strong>（financial intermediaries）：间接融资。<\/p>\n<ul><li>\n<strong>银行<\/strong>：吸收存款、发放贷款。它同时是储户与借款人的中间人。银行的另一功能是创造货币（第 29 章详述）。\n<\/li><li>\n<strong>共同基金<\/strong>（mutual fund）：汇集众人资金，由专业经理投资于股票债券组合。它让小额投资者也能分散风险。\n<\/ul>\n<h3>可贷资金市场<\/h3>\n<p>把全国的储蓄与投资放在一个市场上：<\/p>\n<ul><li>\n<strong>供给<\/strong>：来自储蓄。利率越高，人们越愿意储蓄，供给向右上倾斜。\n<\/li><li>\n<strong>需求<\/strong>：来自投资。利率越高，借款成本越高，投资项目越少，需求向右下倾斜。\n<\/li><li>\n<strong>均衡利率<\/strong>：供给与需求相交处。\n<\/ul>\n<p>这个模型的关键假设是<strong>利率是唯一调节变量<\/strong>，且资金可以自由流动（封闭经济）。<\/p>\n<h3>政策对市场的影响<\/h3>\n<p><strong>一、政府预算赤字。<\/strong> 政府支出大于税收时要借款，这增加了资金需求，需求曲线右移，利率上升，私人投资减少。这就是<strong>挤出效应<\/strong>（crowding out）。<\/p>\n<p>数字例子：原均衡利率 5%、投资 1000 亿。政府赤字 200 亿，需求右移，利率升到 6%，投资降到 900 亿。政府多用 200 亿，私人投资少用 100 亿。<\/p>\n<p><strong>二、税收激励储蓄。<\/strong> 给储蓄利息免税，供给右移，利率下降、投资增加。但实证效果有限——富人本来储蓄就多，减税主要让他们更富，且替代效应与收入效应可能抵消。<\/p>\n<p><strong>三、政府预算盈余。<\/strong> 相反方向：供给增加（政府把钱借出去），利率下降，投资增加。<\/p>\n<h3>一个容易混的点<\/h3>\n<p>&quot;储蓄等于投资&quot;是<strong>会计恒等式<\/strong>（封闭经济 S = I），不是&quot;储蓄者与投资者是同一批人&quot;。储蓄者和投资者通过金融体系连接，利率是价格信号。<\/p>\n<p>在开放经济里这个等式变成 S = I + NX（或 S − I = NCF），第 31 章会展开。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;买股票是投资&quot;——实际上宏观意义上的投资是购买新资本，买股票只是资产转手。\n<\/li><li>\n别以为&quot;储蓄增加一定好&quot;——实际上短期内储蓄增加会减少消费需求，可能造成衰退（节俭悖论）。\n<\/li><li>\n别以为&quot;政府赤字一定挤出投资&quot;——实际上要看经济是否处于充分就业；衰退时闲置资金多，挤出效应弱。\n<\/li><li>\n别以为&quot;利率由央行直接规定&quot;——实际上央行影响短期利率，长期利率由可贷资金市场决定。\n<\/ul>\n<ol><li>\n（单选）在可贷资金市场模型中，资金的供给来自？\n<p>A. 投资  B. 储蓄  C. 政府支出  D. 进口 <strong>答案<\/strong>：B；<strong>解析<\/strong>：储蓄提供可贷资金，投资形成需求；两者相交决定利率。<\/p>\n<\/ol>\n<ol><li>\n（单选）政府预算赤字扩大，在其他条件不变时通常导致？\n<p>A. 利率下降、投资增加  B. 利率上升、私人投资减少  C. 利率不变  D. 储蓄减少、投资增加 <strong>答案<\/strong>：B；<strong>解析<\/strong>：赤字增加资金需求，需求曲线右移，利率上升，部分私人投资被挤出。<\/p>\n<\/ol>\n<ol><li>\n（单选）宏观意义上的「投资」指？\n<p>A. 购买股票  B. 购买债券  C. 购买新机器与厂房  D. 把钱存入银行 <strong>答案<\/strong>：C；<strong>解析<\/strong>：宏观投资指形成新资本（设备、厂房、住宅、库存）；买卖股票债券只是资产转手。<\/p>\n<\/ol>\n<ol><li>\n（多选）金融中介包括？\n<p>A. 商业银行  B. 共同基金  C. 债券发行企业  D. 中央银行 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：银行、共同基金、央行都属于中介类机构；债券发行企业是资金需求方，通过金融市场直接融资。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n金融体系两条通道：金融市场（债券、股票）与金融中介（银行、共同基金）。\n<\/li><li>\n可贷资金市场：储蓄为供给、投资为需求，交点定利率。\n<\/li><li>\n政府赤字抬高利率、减少私人投资，即挤出效应。\n<\/ul>", "ch27": "<h1>第 27 章：金融学的基本工具<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 26 章（需基本概率常识）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用现值公式比较不同时间的现金流，并算出一个项目的净现值。\n<\/li><li>\n解释风险厌恶者为什么愿意买期望值为负的保险，以及多元化能消除哪类风险。\n<\/li><li>\n说出基本面分析与有效市场假说的分歧，并说明&quot;市场非理性&quot;的证据来自哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>金融决策只有三个问题：这笔未来的钱今天值多少（现值）、这个风险值不值得承担（风险与收益）、这个资产的价格是否已经反映了所有信息（有效市场）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>现值：钱有时间价值<\/h3>\n<p><strong>现值<\/strong>（present value）是把未来的一笔钱折算成今天的等价金额：<\/p>\n<p><strong>PV = FV ÷ (1 + r)^n<\/strong><\/p>\n<p>FV 是未来金额，r 是利率（贴现率），n 是年数。<\/p>\n<p>例：三年后能拿到 100 万，利率 5%，PV = 100 ÷ 1.05³ ≈ 86.4 万。今天存 86.4 万，三年后正好 100 万。<\/p>\n<p>比较两个项目必须折成现值。A：现在投 100 万，三年后回收 130 万；B：现在投 100 万，五年后回收 150 万。利率 5%。<\/p>\n<ul><li>\nA 的现值 = 130 ÷ 1.05³ ≈ 112.3 万，净现值 12.3 万。\n<\/li><li>\nB 的现值 = 150 ÷ 1.05⁵ ≈ 117.5 万，净现值 17.5 万。\n<\/ul>\n<p>B 更好。看总额会选错，看现值才对。<strong>净现值<\/strong>（NPV）= 现值 − 初始投入，是投资决策的标准判据。<\/p>\n<p>复利的力量：年利率 7%，10 年翻一倍（70 法则）；30 年是 7.6 倍。这也是为什么&quot;早存钱&quot;比&quot;多存钱&quot;更重要。<\/p>\n<h3>风险管理<\/h3>\n<p><strong>风险厌恶<\/strong>（risk aversion）：大多数人偏好确定的中等收益，而不是期望值相同但波动很大的收益。经济学用<strong>效用函数<\/strong>的凹性描述这一点：财富增加带来的效用增量递减，所以损失 1 万元的痛苦大于赚 1 万元的快乐。<\/p>\n<p>由此产生三个工具：<\/p>\n<p><strong>一、保险<\/strong>（insurance）。保险公司把大量独立风险汇集起来，用保费赔付少数不幸者。<\/p>\n<ul><li>\n保费高于期望赔付（要覆盖成本与利润），所以买保险的期望值为负。\n<\/li><li>\n但保险买的是<strong>确定性<\/strong>：把可能摧毁你的大额损失（大病、火灾）换成可承受的小额支出。\n<\/li><li>\n保险市场受<strong>逆向选择<\/strong>（身体差的人更愿投保）与<strong>道德风险<\/strong>（投保后不注意）困扰，所以保险公司用体检、免赔额、共保比例来设计合约。\n<\/ul>\n<p><strong>二、多元化<\/strong>（diversification）。把资金投到不相关的资产上，个别资产的坏结果被其他资产的好结果抵消。<\/p>\n<ul><li>\n能消除<strong>企业特有风险<\/strong>（某公司出问题、某行业衰退）。\n<\/li><li>\n不能消除<strong>市场风险<\/strong>（整体经济下行、利率普涨），因为所有资产同时受冲击。\n<\/ul>\n<p><strong>三、风险与收益的权衡<\/strong>。高预期收益必然伴随高风险。这不是保证——它只是说平均而言，承担更大波动的人获得更高回报。<\/p>\n<h3>资产评估<\/h3>\n<p>一个资产（股票、债券、房产）值多少钱？<\/p>\n<p><strong>基本面分析<\/strong>（fundamental analysis）：估算资产未来能产生的全部现金流，折成现值。股票的价值等于未来分红的现值加上最终售价的现值。这要求预测公司未来的盈利，而预测很难。<\/p>\n<p><strong>有效市场假说<\/strong>（efficient markets hypothesis）：市场价格已经反映了所有公开信息。若成立，则：<\/p>\n<ul><li>\n股价的短期变动不可预测（&quot;随机游走&quot;）。\n<\/li><li>\n主动选股无法稳定跑赢指数，因为价格已包含信息。\n<\/li><li>\n推论：指数基金是多数人的最优选择。\n<\/ul>\n<p><strong>市场非理性<\/strong>：有效市场假说并非无懈可击。<strong>泡沫<\/strong>（bubble）就是价格远超基本面的例子——17 世纪荷兰郁金香、2000 年互联网泡沫、2008 年之前的美国房价。行为经济学（第 22 章）提供了过度自信、锚定、从众等解释。<\/p>\n<p>现实中两种观点各占一半：多数时候价格接近有效，但极端时期会出现系统性偏离。<\/p>\n<h3>一个例子串起来<\/h3>\n<p>某公司股票现价 50 元，你预测明年分红 2 元、届时股价 55 元，贴现率 8%。<\/p>\n<ul><li>\n明年总回报的现值 = (2 + 55) ÷ 1.08 ≈ 52.8 元。\n<\/li><li>\n现价 50 元 &lt; 52.8 元，按基本面分析值得买。\n<\/ul>\n<p>但有效市场假说会提醒你：你的预测若基于公开信息，价格早已包含它。你赚到的，只可能来自&quot;别人没看到的信息&quot;或&quot;你判断得更准&quot;——两者都不容易。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;回收总额越大越划算&quot;——实际上要折成现值，时间越长折损越多。\n<\/li><li>\n别以为&quot;分散投资能消除所有风险&quot;——实际上市场风险无法分散。\n<\/li><li>\n别以为&quot;买保险是亏的&quot;——实际上它买的是对灾难的确定性，对无法承受的损失是理性的。\n<\/li><li>\n别以为&quot;有效市场假说证明了价格永远正确&quot;——实际上它说的是&quot;价格已反映公开信息&quot;，泡沫说明它可以失灵。\n<\/ul>\n<ol><li>\n（单选）三年后获得 100 万元，贴现率 5%，现值约为？\n<p>A. 85 万  B. 86.4 万  C. 95 万  D. 115 万 <strong>答案<\/strong>：B；<strong>解析<\/strong>：PV = 100 ÷ 1.05³ ≈ 86.4 万元；今天的 86.4 万按 5% 复利三年正好变成 100 万。<\/p>\n<\/ol>\n<ol><li>\n（单选）分散化投资能消除哪类风险？\n<p>A. 市场风险  B. 个别企业或行业的风险  C. 通货膨胀风险  D. 利率风险 <strong>答案<\/strong>：B；<strong>解析<\/strong>：企业特有风险可通过持有不相关资产抵消；市场风险影响全部资产，分散无法消除。<\/p>\n<\/ol>\n<ol><li>\n（单选）保险的期望赔付通常低于保费，为什么人们还买？\n<p>A. 因为保险公司会返还  B. 因为保险买的是对灾难的确定性，大额损失无法承受  C. 因为保费可以抵税  D. 因为保单可以转卖 <strong>答案<\/strong>：B；<strong>解析<\/strong>：保险把不确定的大额损失换成确定的小额支出，对无法承受灾难的人是理性选择，尽管期望值为负。<\/p>\n<\/ol>\n<ol><li>\n（单选）有效市场假说若成立，下列哪项推论最直接？\n<p>A. 主动选股难以稳定跑赢指数  B. 股票价格永远不波动  C. 公司分红必然增加  D. 利率会下降 <strong>答案<\/strong>：A；<strong>解析<\/strong>：价格已反映公开信息，短期变动不可预测，因此被动指数投资在多数人身上优于主动选股。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nPV = FV ÷ (1+r)^n；比较项目用净现值，不比总额。\n<\/li><li>\n保险买确定性（期望值为负），多元化消除企业特有风险、不消除市场风险。\n<\/li><li>\n基本面分析算现值，有效市场假说认为价格已反映信息，泡沫是反例。\n<\/ul>", "ch28": "<h1>第 28 章：失业<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 18、23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用失业率与劳动参与率的定义算出一个经济体的失业状况，并指出这两个指标的局限。\n<\/li><li>\n区分摩擦性、结构性与周期性失业，说明各自的对策。\n<\/li><li>\n解释最低工资、工会、效率工资如何把工资抬到均衡之上并增加失业。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>失业不是一个数字，而是几种性质完全不同的问题叠在一起：找工作的过渡期（摩擦）、技能与岗位不匹配（结构）、经济衰退（周期），再加上把工资抬高的制度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>怎么算<\/h3>\n<ul><li>\n<strong>劳动力<\/strong> = 就业人数 + 失业人数。\n<\/li><li>\n<strong>失业率<\/strong> = 失业人数 ÷ 劳动力 × 100%。\n<\/li><li>\n<strong>劳动参与率<\/strong> = 劳动力 ÷ 成年人口 × 100%。\n<\/ul>\n<p>关键点：<strong>不找工作的人不算失业<\/strong>。长期找不到工作而放弃求职的人（<strong>沮丧工人<\/strong>）退出劳动力，失业率反而下降。这是指标最大的漏洞。<\/p>\n<p>另一个漏洞是<strong>隐性就业不足<\/strong>：打零工、兼职但想找全职的人，被算作就业。<\/p>\n<h3>失业的三种类型<\/h3>\n<p><strong>一、摩擦性失业<\/strong>（frictional unemployment）：在换工作、刚毕业找工作期间的过渡性失业。它是劳动市场正常运转的副产品——信息不完美、匹配需要时间。任何经济都有，且无法消除，只能缩短（更好的招聘平台、职业介绍）。<\/p>\n<p><strong>二、结构性失业<\/strong>（structural unemployment）：岗位需要的技能与求职者拥有的技能不匹配，或岗位在地区上错配。比如煤矿关闭后矿工不会写代码。它与总需求无关，靠培训、迁移、产业政策解决，耗时最长。<\/p>\n<p><strong>三、周期性失业<\/strong>（cyclical unemployment）：经济衰退导致总需求不足而出现的失业。它是宏观政策（货币与财政）的目标，第 33–34 章会讲。<\/p>\n<p><strong>自然失业率<\/strong> = 摩擦性 + 结构性失业对应的失业率，是经济在正常运转时的失业水平（各国通常估计在 4%–6%）。<\/p>\n<h3>工资为什么会被抬到均衡之上<\/h3>\n<p>如果工资完全由供需决定，失业就只是过渡性的。但现实中工资常高于均衡，造成持续的<strong>结构性失业<\/strong>：<\/p>\n<p><strong>一、最低工资法。<\/strong> 对低技能劳动者，最低工资高于市场均衡，企业雇的人少于均衡量，多出来的人找不到工作。影响集中在青少年与低教育水平人群。<\/p>\n<p><strong>二、工会。<\/strong> 集体谈判把工资抬到均衡之上。结果是工会成员保住高工资，非成员就业机会被挤压，形成&quot;局内人—局外人&quot;分割。<\/p>\n<p><strong>三、效率工资。<\/strong> 企业主动给高于市场的工资，理由是：员工吃得好体力更足、流动率低、能招到能力更强的人、偷懒的代价变大。好处归企业，代价是有一部分人愿意在这个工资下工作却找不到岗位。<\/p>\n<h3>失业保险<\/h3>\n<p><strong>失业保险<\/strong>（unemployment insurance）给失业者一部分收入补偿。它保护了失业者的生活，但也降低了找工作的紧迫感，延长了失业持续时间。<\/p>\n<p>这不是说保险不好，而是设计要在&quot;保障&quot;与&quot;激励&quot;之间取舍：给付期限越长、替代率越高，搜寻时间越长。<\/p>\n<h3>失业的持续时间<\/h3>\n<p>平均失业持续时间越长，问题越严重。数据上通常呈现&quot;少数人长期失业、多数人短期失业&quot;的分布：大部分人几周内找到工作，一小部分人失业超过半年，这部分人占了总失业人天的大多数。<\/p>\n<p>长期失业者更难再就业：技能退化、雇主对空档期的疑虑、失去社会联系。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;失业率下降就是好消息&quot;——实际上可能是沮丧工人退出劳动力，劳动参与率同时下降。\n<\/li><li>\n别以为&quot;失业都是因为懒&quot;——实际上大部分是匹配摩擦与结构调整，找工作时间长短取决于信息与技能匹配。\n<\/li><li>\n别以为&quot;提高最低工资只是让穷人受益&quot;——实际上它可能减少低技能岗位，代价由找不到工作的人承担。\n<\/li><li>\n别以为&quot;自然失业率是零&quot;——实际上总有摩擦性失业，零失业既不现实也不必要。\n<\/ul>\n<ol><li>\n（单选）劳动力 1000 万，失业 60 万，失业率是？\n<p>A. 6%  B. 6.4%  C. 5.6%  D. 无法计算 <strong>答案<\/strong>：A；<strong>解析<\/strong>：失业率 = 60 ÷ 1000 = 6%。注意分母是劳动力，不包含不找工作的人。<\/p>\n<\/ol>\n<ol><li>\n（单选）矿工因煤矿关闭而失去工作，又不会其他技能，这属于？\n<p>A. 摩擦性失业  B. 结构性失业  C. 周期性失业  D. 季节性失业 <strong>答案<\/strong>：B；<strong>解析<\/strong>：技能与岗位需求不匹配属于结构性失业，需要培训或迁移来解决，耗时最长。<\/p>\n<\/ol>\n<ol><li>\n（单选）大量失业者放弃求职退出劳动力，会造成？\n<p>A. 失业率上升  B. 失业率下降但劳动参与率也下降  C. 失业率不变  D. 自然失业率上升 <strong>答案<\/strong>：B；<strong>解析<\/strong>：退出劳动力后不再计入失业人数，失业率下降，但劳动参与率同步下降，真实就业状况被掩盖。<\/p>\n<\/ol>\n<ol><li>\n（多选）把工资抬到均衡之上、造成结构性失业的因素包括？\n<p>A. 最低工资法  B. 工会集体谈判  C. 效率工资  D. 职业介绍所 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三种都直接抬高工资；职业介绍所降低搜寻摩擦，属于缓解摩擦性失业的措施。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n失业率 = 失业 ÷ 劳动力；放弃求职者退出劳动力，会低估真实失业。\n<\/li><li>\n三类失业：摩擦（过渡）、结构（技能错配）、周期（需求不足）；自然失业率 = 前两者。\n<\/li><li>\n最低工资、工会、效率工资把工资抬到均衡之上，制造结构性失业。\n<\/ul>", "ch29": "<h1>第 29 章：货币制度<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 26 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出货币的三项职能，并用「流动性」解释为什么现金比存款更&quot;像货币&quot;。\n<\/li><li>\n用部分准备金制度与准备金率算出货币乘数，解释一笔存款如何变成多笔货币。\n<\/li><li>\n说明央行调节货币供给的三种工具，以及各自的局限。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>现代货币不是金银，而是&quot;央行发的现金 + 银行体系里的存款&quot;；银行每放一笔贷款就创造出新的存款，所以货币供给由准备金率与央行的操作共同决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>货币是什么<\/h3>\n<p><strong>货币<\/strong>（money）是社会中被广泛接受用作交易媒介的东西。三项职能：<\/p>\n<ol><li>\n<strong>交换媒介<\/strong>：买东西时别人愿意收。这一条最关键。\n<\/li><li>\n<strong>计价单位<\/strong>：标价用同一把尺子，避免&quot;一只鸡换几斤米&quot;的换算麻烦。\n<\/li><li>\n<strong>价值储藏<\/strong>：把购买力留到以后用。通胀会削弱这项职能。\n<\/ol>\n<p><strong>流动性<\/strong>（liquidity）指一项资产转换为交换媒介的容易程度。现金流动性最高，活期存款次之，房产最低。货币供给通常按流动性分层：<\/p>\n<ul><li>\n<strong>M1<\/strong>：现金 + 活期存款（最狭义的货币）\n<\/li><li>\n<strong>M2<\/strong>：M1 + 定期存款、货币市场基金等\n<\/ul>\n<h3>从商品货币到法定货币<\/h3>\n<p><strong>商品货币<\/strong>（commodity money）本身有内在价值，如金币、银币、香烟（战俘营里当过货币）。 <strong>法定货币<\/strong>（fiat money）没有内在价值，靠政府法令与公众信任流通。人民币、美元都是法定货币。<\/p>\n<p>法定货币的风险在于：一旦信任崩塌（恶性通胀），它就迅速失去货币职能。<\/p>\n<h3>央行与银行体系<\/h3>\n<p>中央银行（中国人民银行、美联储）负责发行货币、管理银行体系、调控货币供给。<\/p>\n<p>关键概念：<\/p>\n<ul><li>\n<strong>准备金<\/strong>（reserves）：银行吸收的存款中不贷出、留在手里的部分（库存现金 + 在央行的存款）。\n<\/li><li>\n<strong>准备金率<\/strong>（reserve ratio）：准备金占存款的比例，用 R 表示。\n<\/li><li>\n<strong>部分准备金银行制度<\/strong>（fractional-reserve banking）：银行只留一部分存款作准备金，其余贷出。\n<\/ul>\n<h3>货币是怎么被&quot;创造&quot;出来的<\/h3>\n<p>例：准备金率 10%。<\/p>\n<ol><li>\n甲把 1000 元现金存入 A 银行。A 留 100 元准备金，贷出 900 元给乙。\n<\/li><li>\n乙把 900 元存入 B 银行。B 留 90 元，贷出 810 元。\n<\/li><li>\n这样循环下去。\n<\/ol>\n<p>最初只有 1000 元现金，最终存款总额为： 1000 + 900 + 810 + 729 + … = 1000 ÷ 0.1 = 10000 元。<\/p>\n<p><strong>货币乘数<\/strong> = 1 ÷ 准备金率 = 10。准备金率 10%，每 1 元准备金支撑 10 元存款。<\/p>\n<p>注意：货币供给 = 现金 + 存款，所以增加的这部分主要是存款。贷款并没有&quot;凭空印钱&quot;，它创造的是<strong>存款<\/strong>，同时创造了对等的负债。<\/p>\n<p>现实中的乘数比 1/R 小，因为：有人把贷款取成现金不再存回、银行自愿多留准备金、有些存款不进入可贷体系。<\/p>\n<h3>央行的三种工具<\/h3>\n<p><strong>一、公开市场操作<\/strong>（open-market operations）：央行在市场上买进或卖出政府债券。买进 → 向银行体系注入准备金 → 货币供给增加；卖出相反。这是最常用、最灵活的工具。<\/p>\n<p><strong>二、调整准备金率<\/strong>：降低准备金率 → 乘数变大 → 货币供给增加。缺点是作用猛烈、频繁调整会扰乱银行经营，因此很少动用。<\/p>\n<p><strong>三、调整利率<\/strong>（贴现率、再贷款利率）：影响银行借入准备金的成本。现代央行更多通过利率走廊与政策利率引导，而非直接规定。<\/p>\n<h3>央行独立性问题<\/h3>\n<p>央行如果受政治控制，政府可能要求它印钱填补赤字，导致通胀。因此多数国家让央行相对独立，只对物价稳定负责。<\/p>\n<p>代价是：央行不受选举约束，其决策的民主问责较弱。这是&quot;独立&quot;与&quot;问责&quot;之间的取舍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;只有央行能创造货币&quot;——实际上商业银行通过放贷创造存款，也在创造货币。\n<\/li><li>\n别以为&quot;准备金率 10% 就意味着货币供给只能是准备金的 10 倍&quot;——实际上这是理论上限，现实中乘数更小。\n<\/li><li>\n别以为&quot;存款是银行保管的钱&quot;——实际上它是对银行的债权，银行把它贷出去生息。\n<\/li><li>\n别以为&quot;央行印钱就能让所有人变富&quot;——实际上它只改变价格水平与分配，不创造真实产出（第 30 章）。\n<\/ul>\n<ol><li>\n（单选）货币三项职能中最关键的是？\n<p>A. 交换媒介  B. 计价单位  C. 价值储藏  D. 保值增值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：被广泛接受作为交换媒介是货币的本质特征；计价单位与价值储藏是派生的功能。<\/p>\n<\/ol>\n<ol><li>\n（单选）准备金率为 10%，最初存入 1000 元，理论上银行体系最终可形成的存款总额约为？\n<p>A. 1000 元  B. 10000 元  C. 1900 元  D. 1100 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：货币乘数 = 1 ÷ 0.1 = 10，1000 × 10 = 10000 元。现实中因现金漏出与超额准备金，实际数值更小。<\/p>\n<\/ol>\n<ol><li>\n（单选）央行在公开市场买进政府债券的直接效果是？\n<p>A. 减少银行体系准备金  B. 增加银行体系准备金，货币供给增加  C. 提高准备金率  D. 减少货币供给 <strong>答案<\/strong>：B；<strong>解析<\/strong>：央行买入债券付出资金，银行体系准备金增加，通过乘数放大为更多存款，货币供给上升。<\/p>\n<\/ol>\n<ol><li>\n（填空）资产转换成交换媒介的容易程度叫什么？（三个字）\n<p><strong>答案<\/strong>：流动性；<strong>解析<\/strong>：现金流动性最高，活期存款次之，房产最低。M1、M2 的划分就是按流动性排序。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n货币三职能：交换媒介、计价单位、价值储藏；流动性决定什么算 M1、M2。\n<\/li><li>\n部分准备金制度下货币乘数 = 1 ÷ 准备金率，银行放贷创造存款。\n<\/li><li>\n央行三大工具：公开市场操作、准备金率、利率；公开市场操作最常用。\n<\/ul>", "ch30": "<h1>第 30 章：货币增长与通货膨胀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 24、29 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用货币数量方程解释长期通胀为什么源于货币增长。\n<\/li><li>\n说清「通货膨胀使所有人变穷」为什么是谬误，并列出通胀的五项真实成本。\n<\/li><li>\n解释古典二分法、货币中性，以及费雪效应。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>长期看物价水平由货币量决定：货币发得比产出增长快，多出来的钱只推高价格、不提高真实产出；通胀不是让所有人变穷，而是让钱变得不好用，并在债权人与债务人之间重新分配。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>物价水平与货币价值<\/h3>\n<p>先说一个反直觉的等价：<strong>物价水平上升 = 货币价值下降<\/strong>。同样 100 元，物价翻倍后只能买到原来一半的东西。所以&quot;治理通胀&quot;和&quot;维护货币购买力&quot;是同一件事。<\/p>\n<p>货币的供给由央行与银行体系决定（第 29 章）；货币的需求来自人们想持有多少现金与存款用于日常交易。两者相等时，货币市场均衡，决定物价水平。<\/p>\n<h3>货币注入的影响<\/h3>\n<p>假设央行印钱发给每个人。短期内每个人手里的钱变多了，但商店里的商品没变多。钱多了，竞争同样的商品，价格被抬上去。<\/p>\n<p>推到均衡：货币量翻倍，物价水平也大致翻倍，每单位货币的购买力减半。真实产出、就业、实际工资都不变。<\/p>\n<p>这个结论叫<strong>货币中性<\/strong>（monetary neutrality）：货币量的变化只影响名义变量（物价、名义工资、名义 GDP），不影响真实变量（实际产出、实际工资、就业）。<\/p>\n<p><strong>古典二分法<\/strong>（classical dichotomy）是把经济变量分成两类来分析的做法：<\/p>\n<ul><li>\n<strong>名义变量<\/strong>：用货币计量的量，物价、名义工资、名义利率。\n<\/li><li>\n<strong>真实变量<\/strong>：用实物计量的量，产量、实际工资、实际利率、就业。\n<\/ul>\n<p>古典经济学认为这两组变量互不影响。这在一百多年前是主流，在大萧条后被短期分析推翻，但在<strong>长期<\/strong>仍然成立：第 33 章会讲，短期货币量能影响产量，长期不能。<\/p>\n<h3>货币数量论<\/h3>\n<p><strong>货币数量方程<\/strong>：<strong>M × V = P × Y<\/strong><\/p>\n<ul><li>\nM：货币量\n<\/li><li>\nV：货币流通速度（同一笔钱一年被用于交易的次数）\n<\/li><li>\nP：物价水平\n<\/li><li>\nY：实际产出\n<\/ul>\n<p>改写为 P = (M × V) ÷ Y。若 V 稳定、Y 由生产率与技术决定（长期增长有限），则 <strong>P 的变化主要由 M 决定<\/strong>。<\/p>\n<p>数字例子：M 增长 20%，Y 增长 3%，V 不变，则 P 上涨约 16.5%（1.20 ÷ 1.03 − 1 ≈ 0.165）。<\/p>\n<p>这就是&quot;通胀是货币现象&quot;的准确含义：不是说每次涨价都怪央行，而是说<strong>持续、普遍的物价上涨<\/strong>必须有货币扩张支撑。单种商品涨价是相对价格变化，不是通胀。<\/p>\n<h3>通胀税<\/h3>\n<p>政府印钱花，等于向所有持有货币的人征税：你手里的钱没变，但能买到的东西少了。这笔&quot;税&quot;不需立法、不需申报，所以叫<strong>通胀税<\/strong>（inflation tax），是&quot;最隐蔽的税&quot;。<\/p>\n<p>谁承担得多？持有现金多、收入固定的人。所以通胀税是<strong>累退的<\/strong>——穷人财富中现金占比高。<\/p>\n<h3>通胀的成本<\/h3>\n<p><strong>先排除一个谬误<\/strong>：通胀并不让所有人变穷。物价涨了，工资、租金、利润通常也在涨。真实购买力取决于<strong>收入涨幅与物价涨幅的比较<\/strong>。说&quot;通胀使人人变穷&quot;，混淆了名义与实际。<\/p>\n<p>真实成本有五项：<\/p>\n<ol><li>\n<strong>皮鞋成本<\/strong>（shoe-leather cost）：为减少现金贬值损失，人们更频繁跑银行取钱。这是时间与便利的消耗。\n<\/li><li>\n<strong>菜单成本<\/strong>（menu cost）：改价签、重印菜单、更新系统。通胀越高，改价越频繁。\n<\/li><li>\n<strong>相对价格的混乱与资源配置不当<\/strong>：所有价格都在动，企业难以判断&quot;是我产品变贵了还是整体物价涨了&quot;，价格信号被噪声淹没，投资与生产决策失准。\n<\/li><li>\n<strong>税收扭曲<\/strong>：税制按名义金额征收。通胀让名义资本利得变大，即使实际没有增值也要缴税；利息所得同样被虚增。\n<\/li><li>\n<strong>未预期通胀造成的任意财富再分配<\/strong>：债权人受损、债务人受益；储蓄者受损、借款买房者受益。这种再分配没有道理，破坏信任与合约基础。\n<\/ol>\n<h3>费雪效应<\/h3>\n<p><strong>名义利率 ≈ 实际利率 + 通胀率<\/strong>。通胀上升时，贷款人要求更高的名义利率以保住实际回报，于是名义利率随通胀同步上升——这叫<strong>费雪效应<\/strong>（Fisher effect）。<\/p>\n<p>重要含义：<strong>通胀不会让债务人凭空受益<\/strong>。若合同已按预期通胀调整，这个好处被利率抵消。只有<strong>意料之外<\/strong>的通胀才会重新分配财富。<\/p>\n<h3>通缩可能更坏<\/h3>\n<p>物价持续下跌听起来是好事，但有两个麻烦：<\/p>\n<ul><li>\n<strong>债务负担加重<\/strong>：名义债务不变，物价下跌使实际债务变重，借款人被迫削减支出，形成恶性循环（债务-通缩螺旋）。\n<\/li><li>\n<strong>推迟消费<\/strong>：预期明天更便宜，今天就不买，需求进一步萎缩。\n<\/ul>\n<p>所以央行的目标通常是<strong>温和的正通胀<\/strong>（如 2%），而不是零或负。<\/p>\n<p><strong>恶性通胀<\/strong>（hyperinflation）是极端情形：物价每月翻倍，货币失去交换媒介职能，人们回到以物易物。德国 1923 年、津巴布韦 2008 年的共同原因都是政府靠印钞填补巨额财政赤字。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;通胀让所有人都变穷&quot;——实际上收入通常同步上涨，真实损失来自相对价格混乱与财富再分配。\n<\/li><li>\n别以为&quot;通胀让债务人受益&quot;——实际上只有未预期部分如此，已预期部分被名义利率抵消。\n<\/li><li>\n别以为&quot;某样东西涨价就是通胀&quot;——实际上通胀是普遍物价水平上升。\n<\/li><li>\n别以为&quot;印钱能提高真实产出&quot;——实际上长期只推高价格（货币中性），短期才有刺激效果。\n<\/ul>\n<ol><li>\n（单选）货币量增长 20%，实际产出增长 3%，流通速度不变，物价大致上涨？\n<p>A. 3%  B. 17%  C. 20%  D. 23% <strong>答案<\/strong>：B；<strong>解析<\/strong>：P = MV/Y，变化率约 1.20 ÷ 1.03 − 1 ≈ 16.5%，四舍五入约 17%。<\/p>\n<\/ol>\n<ol><li>\n（单选）费雪效应的内容是？\n<p>A. 通胀上升时名义利率随之上升  B. 通胀上升时名义利率下降  C. 实际利率永远不变  D. 货币量与物价无关 <strong>答案<\/strong>：A；<strong>解析<\/strong>：贷款人要求名义利率覆盖预期通胀，因此名义利率 = 实际利率 + 通胀率，二者同向变动。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪一项不是通胀的成本？\n<p>A. 皮鞋成本  B. 菜单成本  C. 税制扭曲  D. 产出必然下降 <strong>答案<\/strong>：D；<strong>解析<\/strong>：通胀的成本主要是皮鞋成本、菜单成本、税制扭曲、相对价格混乱与财富再分配；通胀本身不必然导致产出下降。<\/p>\n<\/ol>\n<ol><li>\n（多选）关于通胀税，正确的说法是？\n<p>A. 靠印钞为支出融资，等于向持币者征税  B. 无需立法即可征收，因此隐蔽  C. 对持有现金比例高的低收入者更不利  D. 它只影响富人 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：通胀税隐蔽且累退，低收入者财富中现金占比更高，承担的比例更大。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMV = PY；长期通胀由货币增长超过产出增长造成；货币中性只对长期成立。\n<\/li><li>\n通胀五项成本：皮鞋、菜单、相对价格混乱、税制扭曲、财富再分配。\n<\/li><li>\n费雪效应：名义利率随预期通胀上升；只有意外通胀才重新分配财富。\n<\/ul>", "ch31": "<h1>第 31 章：开放经济的基本概念<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 23、26 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清净出口、资本净流出、储蓄与投资之间的恒等关系。\n<\/li><li>\n区分名义汇率与实际汇率，并用两国物价算出实际汇率。\n<\/li><li>\n用购买力平价解释长期汇率的走向，并指出它的失效条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个国家和一个人一样：花得比挣得多就要借（贸易逆差对应资本净流入），挣得比花得多就借给别人（贸易顺差对应资本净流出）；汇率就是两种货币的兑换比例，长期由物价水平支撑。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个概念与一个恒等式<\/h3>\n<ul><li>\n<strong>净出口<\/strong>（NX）= 出口 − 进口。也叫<strong>贸易余额<\/strong>。为正叫贸易顺差，为负叫贸易逆差。\n<\/li><li>\n<strong>资本净流出<\/strong>（NCF）= 本国居民购买外国资产的支出 − 外国人购买本国资产的支出。钱流出本国去买外国资产，就是资本净流出。\n<\/li><li>\n<strong>恒等关系<\/strong>：<strong>NX = NCF<\/strong>。\n<\/ul>\n<p>为什么？用会计恒等式推：一国生产的总产出 Y 有三种用途——消费 C、投资 I、净出口 NX，即 Y = C + I + G + NX。而储蓄 S = Y − C − G。代入得 S = I + NX，即 <strong>NX = S − I<\/strong>。<\/p>\n<p>含义：一个国家的贸易顺差，等于它储蓄超过投资的部分——多出来的钱借给了外国（资本净流出）。贸易逆差则相反：投资超过储蓄，差额靠外国资金补上（资本净流入）。<\/p>\n<p>日本、德国长期贸易顺差，同时是资本净流出国（买美国国债）；美国长期贸易逆差，同时是资本净流入国。这不是巧合，是同一件事的两面。<\/p>\n<h3>汇率<\/h3>\n<p><strong>名义汇率<\/strong>（nominal exchange rate）：两种货币的兑换比率。写&quot;7 元人民币兑 1 美元&quot;，或用 e 表示&quot;1 美元能换多少人民币&quot;。<\/p>\n<p><strong>升值<\/strong>（appreciation）：本币能换更多外币。<strong>贬值<\/strong>（depreciation）：本币能换更少外币。<\/p>\n<p><strong>实际汇率<\/strong>（real exchange rate）：两国商品的相对价格。公式：<\/p>\n<p><strong>实际汇率 = 名义汇率 × 国内物价水平 ÷ 国外物价水平<\/strong><\/p>\n<p>例：名义汇率 7（元/美元），中国物价指数 110，美国物价指数 100，则实际汇率 = 7 × 110 ÷ 100 = 7.7。这表示&quot;用美国商品衡量的中国商品价格&quot;上升了 10%——中国商品变贵了。<\/p>\n<p>实际汇率上升 → 本国商品相对变贵 → 出口竞争力下降 → 净出口减少。这是理解贸易余额变化的关键链条。<\/p>\n<h3>购买力平价<\/h3>\n<p><strong>购买力平价<\/strong>（purchasing power parity, PPP）：同样的商品在各国应该卖同样的价格（换算后）。若 1 美元在美国买 1 个汉堡，在中国买同款汉堡要 7 元，那么汇率应该是 7 元/美元。<\/p>\n<p>理论依据是<strong>套利<\/strong>：如果价格差太多，人们会跨国搬运商品，把价格拉平。<\/p>\n<p><strong>为什么现实中不完全成立<\/strong>：<\/p>\n<ul><li>\n很多商品与服务无法搬运（理发、房租、医疗）。\n<\/li><li>\n关税、运输成本、贸易壁垒。\n<\/li><li>\n不同国家的消费篮子不同（巴拉萨—萨缪尔森效应：富裕国家服务价格更高）。\n<\/ul>\n<p>所以 PPP 在长期、可贸易商品上有一定解释力，短期几乎无效。经济学人杂志的&quot;巨无霸指数&quot;就是 PPP 的通俗版本。<\/p>\n<h3>贸易政策<\/h3>\n<p>关税、进口配额、出口补贴都会改变贸易量，但<strong>不改变总体的储蓄—投资差额<\/strong>，因此不改变 NX（第 32 章会展开）。它们改变的是贸易的构成：从哪进口、出口什么。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;贸易逆差说明国家被占便宜&quot;——实际上逆差对应资本净流入，外国资金在为本国投资提供融资。\n<\/li><li>\n别以为&quot;出口越多越好&quot;——实际上出口是产出的一部分被外国消费，进口才是本国居民实际享受的商品。\n<\/li><li>\n别以为&quot;汇率升值一定是好事&quot;——实际上本币升值使出口变贵、进口变便宜，打击出口部门、有利消费者。\n<\/li><li>\n别以为&quot;购买力平价随时成立&quot;——实际上它在短期几乎无效，长期也只对可贸易商品成立。\n<\/ul>\n<ol><li>\n（单选）一国净出口为正（贸易顺差），意味着？\n<p>A. 该国的储蓄超过投资，资金净流出  B. 该国的投资超过储蓄，资金净流入  C. 该国一定有资本外逃  D. 该国货币一定升值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：由 NX = S − I，顺差意味储蓄大于投资，多出的资金借给外国，形成资本净流出。顺差与资本净流出是同一件事的两面。<\/p>\n<\/ol>\n<ol><li>\n（单选）名义汇率 7 元/美元，中国物价指数 110，美国 100。实际汇率是？\n<p>A. 7.0  B. 7.7  C. 6.4  D. 0.7 <strong>答案<\/strong>：B；<strong>解析<\/strong>：实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价 = 7 × 110 ÷ 100 = 7.7，表示中国商品相对变贵。<\/p>\n<\/ol>\n<ol><li>\n（单选）购买力平价理论在现实中不完全成立，主要原因是？\n<p>A. 各国货币不同  B. 许多商品与服务无法跨国搬运，且存在壁垒  C. 汇率由政府规定  D. 各国人口不同 <strong>答案<\/strong>：B；<strong>解析<\/strong>：理发、房租、医疗等服务不可贸易，加上关税与运输成本，套利无法把价格拉平，因此 PPP 只在长期、可贸易品上部分成立。<\/p>\n<\/ol>\n<ol><li>\n（填空）衡量两国商品相对价格、等于名义汇率乘两国物价之比的汇率叫什么？（四个字）\n<p><strong>答案<\/strong>：实际汇率；<strong>解析<\/strong>：实际汇率衡量本国商品的相对价格，决定出口竞争力。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nNX = NCF；由 S = I + NX 得 NX = S − I，贸易顺差等于储蓄超过投资的部分。\n<\/li><li>\n实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价，衡量本国商品的相对价格。\n<\/li><li>\nPPP 长期对可贸易品有解释力，短期无效；贸易政策改变构成而非总量。\n<\/ul>", "ch32": "<h1>第 32 章：开放经济的宏观经济理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 26、31 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「可贷资金市场 + 外汇市场」两个市场解释汇率与资本流动如何同时均衡。\n<\/li><li>\n推演预算赤字、贸易政策、资本外逃三类冲击的连锁反应。\n<\/li><li>\n说明为什么贸易政策减少进口却不会改善贸易余额。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>开放经济有两个联动的市场：国内利率由可贷资金市场决定，汇率由外汇市场决定，而连接两者的是资本净流出——利率一变，资本流动就变，汇率跟着变，净出口再被推着变。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个市场，一条链<\/h3>\n<p><strong>第一个市场：可贷资金市场。<\/strong> 供给是国民储蓄，需求是投资加资本净流出（国内资金的两条去处：买本国设备，或买外国资产）。<\/p>\n<ul><li>\n利率是价格。利率越高，投资越少，资本净流出也越少（外国资产回报显得不划算）。\n<\/ul>\n<p><strong>第二个市场：外汇市场。<\/strong> 供给是资本净流出（本国人要买外国资产，需要外币，于是抛本币），需求是外国人对本国商品与资产的需求（他们要买本国货，需要本币）。<\/p>\n<ul><li>\n汇率是价格。本币越贵，出口越贵、进口越便宜，净出口越少。\n<\/ul>\n<p><strong>连接链条<\/strong>： 利率 → 资本净流出 → 外汇市场供求 → 汇率 → 净出口<\/p>\n<p>这条链是本章所有推演的基础。记住方向：利率上升 → 资本净流出减少 → 本币需求减少（或供给增加）→ 本币贬值 → 出口变便宜 → 净出口增加。<\/p>\n<p>等等，这里容易绕错，用一个标准推演验证：政府赤字。<\/p>\n<ol><li>\n政府借得多了 → 可贷资金需求右移 → 利率上升。\n<\/li><li>\n利率上升 → 资本净流出减少（本国资金更愿意留在国内）。\n<\/li><li>\n资本净流出减少 → 外汇市场上本币供给减少 → 本币升值。\n<\/li><li>\n本币升值 → 出口变贵、进口变便宜 → 净出口减少（贸易赤字扩大）。\n<\/ol>\n<p>这条链的结果是：赤字 → 利率升 → 本币升 → 贸易逆差扩大。美国 1980 年代的&quot;双赤字&quot;就是这一模式的经验版本。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[政府预算赤字增加] --&gt; B[可贷资金需求右移]\n    B --&gt; C[国内利率上升]\n    C --&gt; D[资本净流出减少]\n    D --&gt; E[外汇市场本币供给减少]\n    E --&gt; F[本币升值]\n    F --&gt; G[出口变贵 进口变便宜]\n    G --&gt; H[净出口减少 贸易逆差扩大]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这条链有五个环节，任一环节断开，结论就不成立。比如经济处于深度衰退、利率已经接近零，赤字不会推高利率，链条第一步就断了，后面的升值与逆差也不会发生。<\/p>\n<h3>三类冲击<\/h3>\n<p><strong>一、贸易政策（关税、配额）。<\/strong> 减少进口 → 外汇市场上对外币的需求减少 → 本币升值 → 出口减少。结果是：进口降了，出口也降了，<strong>净出口总量基本不变<\/strong>，贸易余额不改善，但贸易量萎缩、效率下降。<\/p>\n<p>这个结论反直觉但对理解政策很有用：贸易政策改变的是&quot;买谁的、卖什么&quot;，而不是&quot;总共买卖多少&quot;。总量由储蓄与投资决定。<\/p>\n<p><strong>二、资本外逃。<\/strong> 投资者对本国失去信心，把资金转走。<\/p>\n<ol><li>\n资本净流出增加 → 外汇市场本币供给增加 → 本币贬值。\n<\/li><li>\n同时国内可贷资金供给减少 → 利率上升。\n<\/li><li>\n贬值有利出口，净出口增加；利率上升抑制投资。\n<\/ol>\n<p>这是 1997 年亚洲金融危机、2018 年阿根廷比索危机的机制。<\/p>\n<p><strong>三、储蓄率上升。<\/strong> 供给右移 → 利率下降 → 资本净流出增加 → 本币贬值 → 净出口增加。贸易顺差扩大、国内投资可能增加。这是中国、德国长期顺差的解释之一。<\/p>\n<h3>一个必须记住的恒等式视角<\/h3>\n<p>NX = S − I。任何政策只要不改变 S 或 I，就无法改变 NX。<\/p>\n<ul><li>\n赤字：政府借走了 S，S 相对 I 减少 → NX 减少（逆差）。\n<\/li><li>\n贸易政策：不改变 S 与 I → NX 不变。\n<\/li><li>\n资本外逃：不改变 S 与 I（只改变资金去向）→ NX 不变，但汇率与利率变了。\n<\/ul>\n<p>这个视角比逐条推演链条更快，而且不容易绕错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;限制进口能减少贸易逆差&quot;——实际上只会让本币升值、出口同步下降，总量不变。\n<\/li><li>\n别以为&quot;资本流入总是好事&quot;——实际上它推高本币、打击出口，且随时可能逆转成资本外逃。\n<\/li><li>\n别以为&quot;贸易逆差是失败&quot;——实际上它意味着外国资金在为本国投资融资，问题在于这些资金是否用于有效投资。\n<\/li><li>\n别以为&quot;汇率由央行决定&quot;——实际上央行只能干预短期，长期由资本流动与物价决定。\n<\/ul>\n<ol><li>\n（单选）政府预算赤字扩大，在开放经济中通常导致？\n<p>A. 利率上升、本币升值、净出口减少  B. 利率下降、本币贬值、净出口增加  C. 利率不变、净出口不变  D. 利率上升、本币贬值 <strong>答案<\/strong>：A；<strong>解析<\/strong>：赤字抬高利率，资本净流出减少，本币升值，出口变贵、进口变便宜，净出口减少，贸易逆差扩大。<\/p>\n<\/ol>\n<ol><li>\n（单选）限制进口的贸易政策对贸易余额的长期影响是？\n<p>A. 显著改善贸易余额  B. 基本不改变贸易余额，只改变贸易构成与数量  C. 必然扩大逆差  D. 使本币贬值 <strong>答案<\/strong>：B；<strong>解析<\/strong>：进口减少使本币升值、出口同步减少，NX = S − I 未变，因此总量不变，只改变贸易结构与规模。<\/p>\n<\/ol>\n<ol><li>\n（单选）资本外逃会带来？\n<p>A. 本币升值、利率下降  B. 本币贬值、利率上升  C. 本币升值、利率上升  D. 本币贬值、利率下降 <strong>答案<\/strong>：B；<strong>解析<\/strong>：资金流出使外汇市场本币供给增加、本币贬值；同时国内可贷资金减少，利率上升。<\/p>\n<\/ol>\n<ol><li>\n（多选）在开放经济两市场模型中，连接可贷资金市场与外汇市场的是？\n<p>A. 资本净流出  B. 国内利率  C. 汇率  D. 政府税收 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：利率决定资本净流出，资本净流出又进入外汇市场决定汇率，这条链连接两个市场。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两个市场联动：可贷资金定利率，外汇市场定汇率，中间连着资本净流出。\n<\/li><li>\n赤字链条：赤字 → 利率升 → 本币升 → 逆差扩大。\n<\/li><li>\nNX = S − I 是判断任何政策效果的快捷键；贸易政策不改变总量。\n<\/ul>", "ch33": "<h1>第 33 章：总需求与总供给<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 23、24、29 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出总需求曲线向下倾斜的三个原因，以及使它移动的四类因素。\n<\/li><li>\n解释长期总供给为什么是垂直线、短期为什么向上倾斜。\n<\/li><li>\n用 AD-AS 图分析需求冲击与供给冲击，区分短期结果与长期结果。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>短期里产量由需求决定、价格由供求关系决定；长期里产量由资本、劳动与技术决定，需求只会推动价格——这是宏观分析里最基本的一对时间尺度。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>经济波动的三个事实<\/h3>\n<p><strong>衰退<\/strong>（recession）是产出下降、失业上升的时期；严重的叫<strong>萧条<\/strong>（depression）。观察到的规律有三条：<\/p>\n<ol><li>\n波动不规则，没有固定周期，无法预测下一次何时来。\n<\/li><li>\n大多数宏观变量同向变动：产出、投资、利润、就业一起降，失业率一起升。\n<\/li><li>\n失业率上升是衰退最直接的痛苦指标，且它在复苏初期仍然很高（企业先恢复生产再招人）。\n<\/ol>\n<h3>总需求曲线为什么向下<\/h3>\n<p><strong>总需求<\/strong>（AD）是价格水平与总产出需求量的关系。它向下倾斜，原因与微观需求不同——不是因为&quot;便宜就多买&quot;，而是价格水平影响三个渠道：<\/p>\n<ol><li>\n<strong>财富效应<\/strong>：物价下降，你手里的现金与存款能买更多东西，感觉变富，消费增加。\n<\/li><li>\n<strong>利率效应<\/strong>：物价下降，购买同样东西需要的货币减少，货币需求下降，利率下降，投资增加。\n<\/li><li>\n<strong>汇率效应<\/strong>：物价下降，本国商品变便宜，出口增加、进口减少，净出口增加。\n<\/ol>\n<p>三条合起来，价格越低，总需求越大。<\/p>\n<p><strong>AD 移动的原因<\/strong>（价格以外的因素）：<\/p>\n<ul><li>\n消费 C 变化（股市财富、预期收入、税收）\n<\/li><li>\n投资 I 变化（利率、企业信心、产能利用率）\n<\/li><li>\n政府购买 G 变化\n<\/li><li>\n净出口 NX 变化（外国经济、汇率、贸易政策）\n<\/ul>\n<p>注意：价格变化是&quot;沿着曲线移动&quot;，其他因素变化才是&quot;整条曲线移动&quot;。这个区别在考试和实际分析中都会反复用到。<\/p>\n<h3>总供给：长期与短期<\/h3>\n<p><strong>长期总供给<\/strong>（LRAS）是一条垂直线，位置在<strong>自然产出率<\/strong>（也称潜在产出）。长期产量由资本存量、劳动人口、技术、制度决定，与价格水平无关——价格涨一倍，长期产量不会变一倍。<\/p>\n<p><strong>短期总供给<\/strong>（SRAS）向上倾斜。三个解释（教材给了三条，都可接受）：<\/p>\n<ol><li>\n<strong>粘性工资<\/strong>：工资合同预先签好，物价涨了工资没涨，企业实际成本下降，愿意多生产。\n<\/li><li>\n<strong>粘性价格<\/strong>：部分企业来不及调价，自己的价格相对便宜，销量增加，于是增产。\n<\/li><li>\n<strong>错觉<\/strong>：企业把整体物价上涨误当成自己产品涨价，于是增产。\n<\/ol>\n<p>三条解释的共同点：价格上升在短期内被&quot;误读&quot;或&quot;未被完全调整&quot;，于是产量增加。长期这些调整完成，SRAS 上移，回到 LRAS。<\/p>\n<p><strong>SRAS 移动的原因<\/strong>：投入品价格（工资、原材料、油价）、生产率、预期物价、政策（最低工资、税收）。<\/p>\n<h3>用模型分析冲击<\/h3>\n<p><strong>需求冲击<\/strong>：AD 右移。<\/p>\n<ul><li>\n短期：AD₂ 与 SRAS₁ 相交，产量上升、物价上升。\n<\/li><li>\n长期：工资与价格预期调整，SRAS 上移，回到 LRAS 上，产量回到自然率，物价更高。\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Y<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">物价水平 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 33 章示例：总需求增加，短期产量上升，长期只涨价<\/text><polyline points=\"70.0,123.0 392.0,231.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"368.4\" y=\"249.2\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">AD1<\/text><polyline points=\"70.0,92.0 438.0,216.0\" fill=\"none\" stroke=\"#1d4ed8\" stroke-width=\"2.2\"/><text x=\"455.8\" y=\"233.7\" font-size=\"12\" fill=\"#1d4ed8\" font-weight=\"600\">AD2<\/text><polyline points=\"70.0,262.5 472.5,154.0\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"409.8\" y=\"190.3\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">SRAS1<\/text><polyline points=\"70.0,231.5 472.5,123.0\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.2\"/><text x=\"465.0\" y=\"97.3\" font-size=\"12\" fill=\"#15803d\" font-weight=\"600\">SRAS2<\/text><polyline points=\"300.0,293.5 300.0,45.5\" fill=\"none\" stroke=\"#111827\" stroke-width=\"2.2\"/><text x=\"306.3\" y=\"50.8\" font-size=\"12\" fill=\"#111827\" font-weight=\"600\">长期供给 LRAS<\/text><circle cx=\"300.0\" cy=\"200.5\" r=\"4\" fill=\"#111827\"/><circle cx=\"350.6\" cy=\"186.9\" r=\"4\" fill=\"#111827\"/><text x=\"111.4\" y=\"268.7\" font-size=\"11.5\" fill=\"#111827\">初始均衡：产量 100、物价 9<\/text><text x=\"346.0\" y=\"147.8\" font-size=\"11.5\" fill=\"#111827\">短期：产量 122、物价 9.9<\/text><text x=\"111.4\" y=\"302.8\" font-size=\"11.5\" fill=\"#111827\">长期回到 100，物价升到 11<\/text><\/svg>\n<p>看图说明：AD 从 AD1 移到 AD2，短期内交点从（100，9）移到（122，9.9），产量与物价同时上升。随后 SRAS 上移，长期交点回到产量 100、物价 11。<strong>产量只在短期增加，长期只剩价格上涨<\/strong>。<\/p>\n<p><strong>供给冲击<\/strong>：SRAS 左移（比如油价暴涨）。<\/p>\n<ul><li>\n短期：产量下降、物价上升——这组同时出现的坏结果叫<strong>滞胀<\/strong>（stagflation）。\n<\/li><li>\n长期：若冲击是暂时的，SRAS 回位；若生产能力被永久破坏，LRAS 也左移，生活水平永久下降。\n<\/ul>\n<p>滞胀是最难处理的局面：扩张性政策能提产量，但会让物价更涨；紧缩政策能压物价，但会让衰退更深。1970 年代的石油危机就是典型。<\/p>\n<h3>政策含义<\/h3>\n<ul><li>\n需求不足造成的衰退：扩张性货币或财政政策可以把 AD 推回去，恢复产量。\n<\/li><li>\n供给冲击造成的滞胀：没有两全的政策，只能在通胀与失业之间分配痛苦。\n<\/li><li>\n判断当前是哪种冲击，是制定政策的第一步。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;AD 向下倾斜是因为东西便宜大家多买&quot;——实际上单个商品便宜是替代效应，AD 向下是因为财富、利率、汇率三个宏观渠道。\n<\/li><li>\n别以为&quot;长期供给也可以向上倾斜&quot;——实际上长期产量由要素与技术决定，价格水平不影响。\n<\/li><li>\n别以为&quot;需求增加长期也能提高产量&quot;——实际上长期只推高价格，产量回到自然率。\n<\/li><li>\n别以为&quot;滞胀可以用扩张政策解决&quot;——实际上扩张会加剧通胀，滞胀没有单一解药。\n<\/ul>\n<ol><li>\n（单选）总需求曲线向下倾斜的原因不包括？\n<p>A. 财富效应  B. 利率效应  C. 汇率效应  D. 商品价格越低越多人买 <strong>答案<\/strong>：D；<strong>解析<\/strong>：单个商品降价带来的替代效应是微观机制；AD 向下源于物价水平通过财富、利率、汇率影响总支出。<\/p>\n<\/ol>\n<ol><li>\n（单选）长期总供给曲线是垂直线，原因是？\n<p>A. 价格水平不影响长期产量，产量由资本、劳动与技术决定  B. 企业长期不调整价格  C. 政府管制价格  D. 货币量固定 <strong>答案<\/strong>：A；<strong>解析<\/strong>：长期所有价格与工资都能调整，产量回到自然产出率，由要素与技术决定，与物价水平无关。<\/p>\n<\/ol>\n<ol><li>\n（单选）石油价格暴涨导致？\n<p>A. SRAS 左移，产量下降、物价上升  B. AD 右移，产量与物价上升  C. LRAS 右移  D. 失业下降 <strong>答案<\/strong>：A；<strong>解析<\/strong>：投入品涨价抬高生产成本，短期总供给左移，出现产量下降与物价上升并存的滞胀。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列哪些因素会使总需求曲线整体右移？\n<p>A. 政府购买增加  B. 企业投资信心上升  C. 物价水平下降  D. 外国对本国产品需求增加 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：物价下降是沿曲线移动；C、I、G、NX 的外生变化才使整条曲线移动。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nAD 向下的三渠道：财富、利率、汇率；移动看 C、I、G、NX。\n<\/li><li>\nLRAS 垂直（自然产出率），SRAS 向上（粘性工资/价格或错觉）。\n<\/li><li>\n需求冲击短期提产量、长期只提价；供给冲击造成滞胀，政策两难。\n<\/ul>", "ch34": "<h1>第 34 章：货币政策和财政政策对总需求的影响<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 29、33 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用流动性偏好理论解释央行增加货币供给如何降低利率、进而提高总需求。\n<\/li><li>\n用支出乘数与税收乘数算出政府购买或减税对总需求的放大效果。\n<\/li><li>\n说明挤出效应为什么削弱财政政策的效果，以及自动稳定器为什么不需要决策。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>货币政策通过利率影响投资，财政政策通过支出直接影响需求，两者都会被乘数放大、被挤出效应削弱；前者靠央行判断，后者有一部分会自动发生。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>流动性偏好理论<\/h3>\n<p><strong>流动性偏好<\/strong>（liquidity preference）指人们偏好持有流动性高的资产（现金、活期存款）。这个理论解释利率如何形成：<\/p>\n<p><strong>货币需求<\/strong>：人们要持有货币做交易。利率越高，持有现金的机会成本越大（本可以拿去赚利息），于是愿意持有的货币越少。所以货币需求曲线向右下倾斜。<\/p>\n<p><strong>货币供给<\/strong>：由央行决定，与利率无关，画成一条垂直线。<\/p>\n<p><strong>均衡<\/strong>：两条线相交，交点就是均衡利率。<\/p>\n<h3>货币政策怎么传导<\/h3>\n<p>央行增加货币供给（比如在公开市场买入债券）：<\/p>\n<ol><li>\n货币供给曲线右移 → 利率下降。\n<\/li><li>\n利率下降 → 企业借款成本降低 → 投资增加。\n<\/li><li>\n投资是总需求的组成部分 → AD 右移。\n<\/li><li>\n产量与物价在短期上升（第 33 章的机制）。\n<\/ol>\n<p>这条链的每一环都可能断：<\/p>\n<ul><li>\n若企业信心极差，利率再低也不投资（&quot;推绳子&quot;困境）。\n<\/li><li>\n若利率已接近零，降无可降（流动性陷阱）。\n<\/ul>\n<p><strong>这也是 AD 曲线向右下倾斜的另一个解释<\/strong>：物价下降 → 需要的货币减少 → 利率下降 → 投资增加 → 总需求增加（就是第 33 章的利率效应）。<\/p>\n<h3>央行的利率目标<\/h3>\n<p>现实中，央行不是直接宣布&quot;货币供给增加多少&quot;，而是设定一个<strong>目标利率<\/strong>（如联邦基金利率），再通过公开市场操作让市场利率贴近目标。<\/p>\n<p>原因：货币供给量难以精确控制（乘数会变），而利率可以每天观察、随时调整。这也意味着&quot;货币政策&quot;实际操作是&quot;利率政策&quot;。<\/p>\n<h3>财政政策与乘数<\/h3>\n<p><strong>政府购买增加<\/strong>直接进入总需求。但它会引发连锁反应：<\/p>\n<p>政府花 100 亿修路 → 建筑工人收入增加 → 他们消费其中一部分（比例等于 MPC）→ 商家收入增加 → 再消费一部分……<\/p>\n<p><strong>支出乘数<\/strong> = 1 ÷ (1 − MPC)<\/p>\n<p>MPC = 0.8 时，乘数 = 1 ÷ 0.2 = 5。政府购买 100 亿，总需求增加 500 亿。<\/p>\n<p>推导：100 + 100×0.8 + 100×0.8² + … = 100 ÷ (1 − 0.8) = 500。<\/p>\n<p><strong>税收乘数<\/strong> = −MPC ÷ (1 − MPC)<\/p>\n<p>减税 100 亿，家庭多出 100 亿可支配收入，但只消费其中 80 亿，其余储蓄。所以总需求增加 80 ÷ 0.2 = 400 亿。<\/p>\n<p>结论：<strong>等额的政府购买比减税对总需求的刺激更大<\/strong>，因为减税有一部分被储蓄漏掉。<\/p>\n<p><strong>乘数效应的其他应用<\/strong>：政府购买下降的收缩效应同样被放大；税收增加同理。乘数是一把双刃剑。<\/p>\n<h3>挤出效应<\/h3>\n<p>政府增加购买需要借钱（发行国债），这抬高了利率，减少了私人投资。私人投资的减少部分抵消了政府支出的增加。<\/p>\n<p>例：政府购买增加 100 亿，乘数效应本应带来 +500 亿；但借款使利率上升，私人投资减少 100 亿，实际净增加 400 亿。<\/p>\n<p>挤出效应的强弱取决于经济状态：<\/p>\n<ul><li>\n繁荣期、资金紧张 → 挤出强。\n<\/li><li>\n衰退期、资金闲置 → 挤出弱，甚至为零。\n<\/ul>\n<p>所以&quot;财政刺激在衰退时更有效&quot;不是口号，而是有模型依据的。<\/p>\n<h3>财政政策对总供给的影响<\/h3>\n<p>财政政策不只影响需求。减税可能激励工作与投资，增加长期供给；政府投资基础设施、教育、研发也影响生产率。但这些效果慢、不确定，短期分析通常忽略。<\/p>\n<h3>稳定经济：支持与反对<\/h3>\n<p><strong>支持积极稳定政策<\/strong>的理由：<\/p>\n<ul><li>\n衰退带来真实的痛苦：失业、企业倒闭、技能退化。\n<\/li><li>\n政策工具确实能影响总需求（上面已推演）。\n<\/li><li>\n不作为的代价可能远大于政策失误的代价。\n<\/ul>\n<p><strong>反对的理由<\/strong>：<\/p>\n<ul><li>\n<strong>时滞<\/strong>：识别问题、立法、执行、见效，每一环都要时间。等你确认是衰退，可能已经复苏了。\n<\/li><li>\n<strong>预测困难<\/strong>：经济学家对下一年增长的预测误差很大。\n<\/li><li>\n<strong>政治动机<\/strong>：选举前减税、增支，选举后紧缩，政策被政治周期绑架。\n<\/ul>\n<p><strong>自动稳定器<\/strong>（automatic stabilizers）：不需要决策就自动起作用的机制。<\/p>\n<ul><li>\n累进所得税：衰退时收入下降，税收自动减少，家庭可支配收入降得少。\n<\/li><li>\n失业保险与转移支付：衰退时自动增加支出，支撑消费。\n<\/ul>\n<p>优点：没有时滞，不受政治干扰。缺点：只能缓冲，不能主动刺激。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;印钱直接增加总需求&quot;——实际上要通过利率与投资的传导，中间环节可能断。\n<\/li><li>\n别以为&quot;减税 100 亿等于支出 100 亿的效果&quot;——实际上减税有一部分被储蓄，效果小于等额支出。\n<\/li><li>\n别以为&quot;乘数越大越好&quot;——实际上乘数在收缩时同样放大伤害，且现实中乘数远小于理论值（因为进口漏出、税收漏出）。\n<\/li><li>\n别以为&quot;自动稳定器能替代主动政策&quot;——实际上它只能缓冲波动，无法扭转深度衰退。\n<\/ul>\n<ol><li>\n（单选）流动性偏好理论中，货币供给曲线画成垂直线是因为？\n<p>A. 货币供给由央行决定，与利率无关  B. 人们不持有货币  C. 利率固定  D. 货币需求不变 <strong>答案<\/strong>：A；<strong>解析<\/strong>：货币供给由央行政策决定，不随利率变化；需求随利率上升而下降，两者交点决定利率。<\/p>\n<\/ol>\n<ol><li>\n（单选）MPC 为 0.8，政府购买增加 100 亿元，总需求约增加？\n<p>A. 100 亿  B. 180 亿  C. 400 亿  D. 500 亿 <strong>答案<\/strong>：D；<strong>解析<\/strong>：支出乘数 = 1 ÷ (1−0.8) = 5，100 × 5 = 500 亿元。<\/p>\n<\/ol>\n<ol><li>\n（单选）等额减税与政府购买相比，对总需求的刺激通常？\n<p>A. 更大  B. 相同  C. 更小，因为部分减税被储蓄  D. 无法比较 <strong>答案<\/strong>：C；<strong>解析<\/strong>：税收乘数 = −MPC/(1−MPC)，MPC=0.8 时为 −4，减税 100 亿只增加 400 亿总需求，小于政府购买的 500 亿。<\/p>\n<\/ol>\n<ol><li>\n（多选）属于自动稳定器的有？\n<p>A. 累进所得税  B. 失业保险  C. 一次性基建投资  D. 转移支付 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：自动稳定器不需要决策即随经济状况自动变化；一次性基建投资需要立法批准，属于相机抉择。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n流动性偏好：货币需求随利率下降而增加，货币供给垂直，交点定利率。\n<\/li><li>\n货币政策链条：货币供给↑ → 利率↓ → 投资↑ → AD 右移。\n<\/li><li>\n支出乘数 1/(1−MPC)，税收乘数 −MPC/(1−MPC)；挤出效应削弱财政政策；自动稳定器无时滞。\n<\/ul>", "ch35": "<h1>第 35 章：通货膨胀与失业之间的短期权衡取舍<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 28、33 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明菲利普斯曲线与 AD-AS 模型是同一件事的两种画法。\n<\/li><li>\n解释为什么短期菲利普斯曲线向下倾斜、长期却是垂直的。\n<\/li><li>\n用牺牲率估算降低通胀的产出代价，并说明理性预期为什么可能让代价变小。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>通胀与失业在短期可以互换——多一点通胀换少一点失业；但这个交换只在&quot;意料之外&quot;时有效，一旦预期跟上，曲线就上移，长期只剩自然失业率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>菲利普斯曲线的来历<\/h3>\n<p><strong>菲利普斯曲线<\/strong>（Phillips curve）画的是通货膨胀率与失业率的关系。1958 年菲利普斯发现英国近百年数据里，通胀高时失业低，二者反向。<\/p>\n<p>把它和 AD-AS 连起来就明白了：<\/p>\n<ul><li>\n总需求扩张 → 沿着 SRAS 上移 → 产量增加、物价上升。\n<\/li><li>\n产量增加意味着雇佣增加 → 失业下降。\n<\/li><li>\n于是&quot;物价上升&quot;与&quot;失业下降&quot;同时出现，在通胀—失业坐标里就是一条向右下倾斜的曲线。\n<\/ul>\n<p>所以<strong>菲利普斯曲线不是新理论，而是 AD-AS 模型换个坐标画<\/strong>。这一点想通，后面所有内容都顺。<\/p>\n<h3>预期的作用<\/h3>\n<p>关键区分：<strong>预期到的通胀<\/strong>与<strong>未预期到的通胀<\/strong>。<\/p>\n<ul><li>\n如果企业预期物价涨 5%，它会提前把工资与售价都提高 5%。实际产量没变，失业没变，只是所有名义数字都涨了 5%。这就是<strong>长期菲利普斯曲线<\/strong>：一条在自然失业率处的垂直线。\n<\/li><li>\n如果通胀是意外发生的（比如央行突然扩张），企业来不及调整，订单增加，于是增产、增雇，失业下降。这才是短期曲线的依据。\n<\/ul>\n<p><strong>自然失业率<\/strong>在这里的含义与第 28 章一致：摩擦性加结构性失业，与通胀率无关。<\/p>\n<p><strong>自然率假说<\/strong>（natural rate hypothesis）：无论通胀多高，失业最终会回到自然率。证据是 1970 年代：通胀与失业同时高（滞胀），彻底打破了&quot;二者可以长期互换&quot;的旧观念。<\/p>\n<h3>曲线为什么会移动<\/h3>\n<ol><li>\n<strong>预期变化<\/strong>：预期通胀上升，短期曲线整体上移。工人要求更高工资，企业成本上升，同样的失业率对应更高的通胀。\n<\/li><li>\n<strong>供给冲击<\/strong>：油价暴涨使 SRAS 左移，产量降、物价升——失业上升与通胀上升同时出现，短期曲线右移（更糟的位置）。\n<\/li><li>\n<strong>自然失业率变化<\/strong>：人口结构、最低工资、工会力量、失业保险 generosity 改变，整条长期曲线左右移动。\n<\/ol>\n<h3>降低通胀的代价<\/h3>\n<p>反通胀（disinflation）意味着压低总需求，产量下降、失业上升。代价用<strong>牺牲率<\/strong>（sacrifice ratio）衡量：<\/p>\n<p><strong>牺牲率 = 降低 1 个百分点通胀所损失的年度产出百分比<\/strong><\/p>\n<p>经验值大约在 2–5 之间（各国、各时期不同）。若通胀要从 6% 降到 2%，牺牲率取 3，则累计损失约 12% 的年度产出。<\/p>\n<p><strong>理性预期<\/strong>的观点（卢卡斯等）：如果央行可信地宣布要降通胀，且公众相信，预期会立即下调，工资与价格同步调整，产量损失可以很小甚至接近于零。<\/p>\n<p><strong>凯恩斯传统的观点<\/strong>：预期调整慢，合同锁定了工资，所以代价是真实的、可观的。<\/p>\n<p>历史检验：<\/p>\n<ul><li>\n沃尔克（1979–1982）用极高利率把美国通胀从约 10% 压到 4%，失业率升到 10% 以上——代价巨大，验证了传统观点。\n<\/li><li>\n格林斯潘时期（1987–2006）通胀较低且稳定，多次小幅调整，代价较小，部分支持了&quot;可信度降低代价&quot;的说法。\n<\/ul>\n<p>两种观点都有道理：可信度确实重要，但预期调整从不是瞬间完成的。<\/p>\n<h3>一个实用结论<\/h3>\n<ul><li>\n短期：扩张能降失业但抬高通胀，紧缩相反。政策是在曲线上选一个点。\n<\/li><li>\n长期：失业回到自然率，政策只能决定通胀水平。\n<\/li><li>\n想永久降低失业，只能改自然失业率：培训、减少最低工资扭曲、改善匹配效率。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;通胀与失业可以长期互换&quot;——实际上长期曲线垂直，只能决定通胀，不能决定失业。\n<\/li><li>\n别以为&quot;降低通胀没有代价&quot;——实际上除非预期瞬间调整，否则要经历产量与就业的损失。\n<\/li><li>\n别以为&quot;菲利普斯曲线是独立于 AD-AS 的另一个理论&quot;——实际上它是同一模型的不同坐标表达。\n<\/li><li>\n别以为&quot;供给冲击只会推高通胀、不影响失业&quot;——实际上它让两者同时恶化（滞胀）。\n<\/ul>\n<ol><li>\n（单选）长期菲利普斯曲线为什么是垂直的？\n<p>A. 失业率与通胀率无关，失业回到自然率  B. 通胀永远为零  C. 政府控制工资  D. 企业不提价 <strong>答案<\/strong>：A；<strong>解析<\/strong>：长期预期完全调整，实际通胀等于预期通胀，产量与失业回到自然水平，通胀高低不再影响失业。<\/p>\n<\/ol>\n<ol><li>\n（单选）菲利普斯曲线与 AD-AS 模型的关系是？\n<p>A. 两个独立理论  B. 同一模型的两种坐标表达  C. 菲利普斯曲线更早出现因此更准确  D. 完全矛盾 <strong>答案<\/strong>：B；<strong>解析<\/strong>：AD 扩张使产量上升、物价上升，对应失业下降、通胀上升，正是短期菲利普斯曲线的向下倾斜。<\/p>\n<\/ol>\n<ol><li>\n（单选）牺牲率为 3，通胀从 6% 降到 2%，累计产出损失约为？\n<p>A. 4%  B. 6%  C. 12%  D. 18% <strong>答案<\/strong>：C；<strong>解析<\/strong>：降 4 个百分点 × 牺牲率 3 = 12% 的年度产出损失。<\/p>\n<\/ol>\n<ol><li>\n（多选）使短期菲利普斯曲线上移（同样失业率对应更高通胀）的因素有？\n<p>A. 预期通胀上升  B. 供给冲击  C. 自然失业率下降  D. 工资合同指数化 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：预期上升、供给冲击、工资指数化都会抬高短期曲线；自然失业率下降是长期曲线的左移。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n菲利普斯曲线 = AD-AS 的另一种画法：AD 扩张 → 产量升、物价升 → 失业降。\n<\/li><li>\n短期向下倾斜，长期垂直（在自然失业率处）；预期上升会抬高短期曲线。\n<\/li><li>\n牺牲率衡量反通胀代价；可信的预期管理能降低成本，但不能降到零。\n<\/li><li>\n滞胀是供给冲击的结果：通胀与失业同时上升，短期曲线右移。\n<\/ul>", "ch36": "<h1>第 36 章：宏观经济政策的六个争论问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 33、34、35 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n对六个政策争论，分别说出正反双方最强的论据，而不是只记结论。\n<\/li><li>\n判断某个具体主张属于哪一场争论，以及它依赖哪些前提。\n<\/li><li>\n说明为什么这些争论很难有定论——它们涉及不确定性与价值取舍。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>宏观政策的六大争论，本质上都在问同一个问题：在信息不完全、时滞存在、政治动机干扰的条件下，政府的手应该伸多长。<\/p>\n<h2>零基础讲解<\/h2>\n<p>前面的章节讲的是&quot;机制&quot;，本章讲的是&quot;该不该用、怎么用&quot;。每一场争论都有正反两方，双方往往都对了一半——分歧在于权重。<\/p>\n<h3>争论一：决策者应该试图稳定经济吗<\/h3>\n<p><strong>正方<\/strong>：衰退带来真实的痛苦——失业、企业倒闭、技能退化、家庭破裂。政策工具确实能影响总需求（第 34 章），不用是浪费。1930 年代大萧条的经验表明，不作为的代价极高。<\/p>\n<p><strong>反方<\/strong>：政策有时滞。识别问题、立法、执行、见效，加起来可能一两年，等你出手，衰退已过去，刺激反而制造过热与通胀。预测能力也有限，经济学家对下一年的预测误差常有 1 个百分点以上。<\/p>\n<p><strong>关键变量<\/strong>：时滞长度与预测准确度。时滞越短、预测越准，正方越占理。<\/p>\n<h3>争论二：政府反衰退应该增加支出还是减税<\/h3>\n<p><strong>正方（增加支出）<\/strong>：政府购买直接进入总需求，乘数大（1/(1−MPC)）；而且政府可以直接决定修多少路、建多少学校，见效快、可控。<\/p>\n<p><strong>反方（减税）<\/strong>：支出项目从立项到开工要几年，钱花得慢；减税让家庭自己决定怎么花，效率更高。而且减税若能设计成鼓励投资（如加速折旧），还能提升长期供给。<\/p>\n<p><strong>纠正一个常见错误<\/strong>：等额减税对总需求的刺激<strong>小于<\/strong>等额政府购买，因为家庭会把一部分减税储蓄起来（第 34 章的税收乘数）。说&quot;减税效果一定更大&quot;是不成立的；争论点在于速度与长期效果，不在于乘数大小。<\/p>\n<h3>争论三：货币政策应该按规则制定还是相机抉择<\/h3>\n<p><strong>正方（按规则）<\/strong>：相机抉择有三个毛病——时滞、缺乏问责（出事找不到谁负责）、政治压力（选举前放水）。规则（如&quot;通胀目标 2%&quot;&quot;货币量年增 5%&quot;）透明、可预期，能锚定预期、降低不确定性。<\/p>\n<p><strong>反方（相机抉择）<\/strong>：规则无法应对突发冲击（金融危机、疫情、战争）。危机时需要果断、灵活、超常规的操作（2008 年与 2020 年都是如此）。规则还会被&quot;创造性解释&quot;，形式上有规则、实质上仍是相机抉择。<\/p>\n<p><strong>折中实践<\/strong>：多数央行采用&quot;受约束的相机抉择&quot;——有明确目标（通胀 2%），但工具与节奏保留灵活性。<\/p>\n<h3>争论四：央行应该把零通胀作为目标吗<\/h3>\n<p><strong>正方<\/strong>：通胀有真实成本（第 30 章五项）。零通胀能彻底消除这些成本，也让预期稳定在零，减少不确定性。而且&quot;温和通胀无害&quot;的说法容易被滥用成&quot;多印点没关系&quot;。<\/p>\n<p><strong>反方<\/strong>：零通胀有三重风险。<\/p>\n<ol><li>\n<strong>通缩风险<\/strong>：目标定在零，经济稍弱就滑入通缩，而通缩会加重债务负担（第 30 章）。\n<\/li><li>\n<strong>牺牲率代价<\/strong>：压到零需要紧缩，产出与就业损失可观。\n<\/li><li>\n<strong>名义工资刚性<\/strong>：工资名义上很难下调，正通胀让实际工资可以&quot;相对下降&quot;而不必降名义工资。零通胀下，调整只能靠裁员。\n<\/ol>\n<p>因此多数央行选择 2% 左右的正目标，作为&quot;缓冲垫&quot;。<\/p>\n<h3>争论五：政府应该平衡预算吗<\/h3>\n<p><strong>正方<\/strong>：赤字意味着把债务留给下一代；政府借款抬高利率、挤出私人投资（第 32 章）；赤字还容易被政治利用——减税受欢迎、削减支出不受欢迎，于是赤字长期化。<\/p>\n<p><strong>反方<\/strong>：平衡预算的要求在衰退期是灾难——衰退时税收自动下降、支出自动上升，此时强行平衡等于紧缩，加深衰退（自动稳定器的作用被抵消）。此外，为应对战争、危机、重大基建而举债是合理的，关键看借来的钱是否用于有回报的投资。<\/p>\n<p><strong>关键区分<\/strong>：<strong>周期性赤字<\/strong>（衰退造成的，应允许）与<strong>结构性赤字<\/strong>（长期入不敷出，应削减）。<\/p>\n<h3>争论六：应该为了鼓励储蓄而修改税法吗<\/h3>\n<p><strong>正方<\/strong>：储蓄是资本的来源，资本提高生产率与生活水平（第 25 章）。现行税制对利息与资本利得征税，等于惩罚储蓄、奖励消费。改为消费税或储蓄免税账户，能提高储蓄率。<\/p>\n<p><strong>反方<\/strong>：<\/p>\n<ol><li>\n<strong>效果有限<\/strong>：减税的主要受益者是富人（他们本来储蓄就多），替代效应可能被收入效应抵消。\n<\/li><li>\n<strong>公平问题<\/strong>：储蓄免税会让靠资本收入生活的人税负更轻，而靠劳动收入的人相对更重。\n<\/li><li>\n<strong>短期风险<\/strong>：储蓄率上升意味着消费下降，短期可能加剧需求不足（节俭悖论）。\n<\/ol>\n<p><strong>折中<\/strong>：定向激励（养老金账户、教育储蓄）比全面减税更可行。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;这些争论有标准答案&quot;——实际上它们依赖对时滞、预期、政治过程的不同判断，属于不确定条件下的取舍。\n<\/li><li>\n别以为&quot;平衡预算总是好的&quot;——实际上衰退期强行平衡会加深衰退。\n<\/li><li>\n别以为&quot;零通胀是最优目标&quot;——实际上正通胀提供了工资调整的缓冲，也避免通缩风险。\n<\/li><li>\n别以为&quot;减税刺激一定强于增支&quot;——实际上等额减税有一半被储蓄漏掉，乘数更小。\n<\/ul>\n<ol><li>\n（单选）反对「决策者应积极稳定经济」的核心理由是？\n<p>A. 衰退有益  B. 政策存在时滞且预测不准  C. 政府没有工具  D. 市场会自动恢复 <strong>答案<\/strong>：B；<strong>解析<\/strong>：识别、立法、执行、见效各环节都有时滞，加上预测误差，政策可能在错误的时点发力。<\/p>\n<\/ol>\n<ol><li>\n（单选）主张央行设定 2% 而非 0% 通胀目标的理由不包括？\n<p>A. 避免滑入通缩  B. 给名义工资调整留缓冲  C. 消除全部通胀成本  D. 保留降息空间 <strong>答案<\/strong>：C；<strong>解析<\/strong>：正通胀仍带来皮鞋成本、菜单成本等，只是量级较小；设 2% 是为了避免通缩与工资调整困难，不是消除成本。<\/p>\n<\/ol>\n<ol><li>\n（单选）衰退期强行平衡预算的主要问题是？\n<p>A. 会推高通胀  B. 等于紧缩，加深衰退  C. 会降低利率  D. 会减少失业 <strong>答案<\/strong>：B；<strong>解析<\/strong>：衰退时税收自动下降、支出自动上升，强行平衡意味着增税减支，抵消自动稳定器，加深衰退。<\/p>\n<\/ol>\n<ol><li>\n（多选）支持「为鼓励储蓄修改税法」的论据包括？\n<p>A. 储蓄是资本来源、能提高生产率  B. 现行税制对利息与资本利得征税等于惩罚储蓄  C. 减税主要惠及富人所以更公平  D. 储蓄增加能降低对外资依赖 <strong>答案<\/strong>：A、B、D；<strong>解析<\/strong>：公平性恰恰是反对意见：减税受益者多为富人，因此第三项不成立。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n六个争论的核心矛盾：时滞与不确定性（1、2、3）、通缩风险与通胀成本（4）、代际负担与周期稳定（5）、储蓄激励与公平（6）。\n<\/li><li>\n等额政府购买的乘数大于等额减税，因为减税部分被储蓄。\n<\/li><li>\n周期性赤字应容忍，结构性赤字应收紧；2% 正通胀是常见折中。\n<\/ul>", "m01": "<h1>GDP 与长期增长<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 23、25 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>GDP 是一国境内一年里新生产的所有最终产品与服务的市场价值；它的长期增长只取决于一件事——<strong>生产率<\/strong>，即每个劳动小时能产出多少东西。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是宏观所有讨论的起点：增长、通胀、失业、政策，都要先有&quot;产出&quot;这个被测量的对象。理解 GDP 的定义边界，才知道它能回答什么、不能回答什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[GDP] --&gt; B[支出法 C加I加G加NX]\n    A --&gt; C[名义与实际]\n    C --&gt; C1[平减指数]\n    B --&gt; D[长期增长]\n    D --&gt; E[生产率 Y除以L]\n    E --&gt; F[物质资本]\n    E --&gt; G[人力资本]\n    E --&gt; H[自然资源]\n    E --&gt; I[技术知识]\n    F --&gt; J[制度: 产权 开放 教育 研发]\n    G --&gt; J<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半部分是&quot;怎么算 GDP&quot;，下半部分是&quot;为什么会长&quot;。两条线在&quot;实际 GDP 增长&quot;处汇合——这也是第 25 章的全部内容。<\/p>\n<h2>详解<\/h2>\n<h3>GDP 的边界<\/h3>\n<p>四个限定：境内、一定时期、最终产品、市场价值。因此不计入：二手交易（除佣金）、转移支付、家务与自给劳动、地下经济。<\/p>\n<p>支出法：<strong>GDP = C + I + G + NX<\/strong>。进口已经算在 C 里但不是本国生产，所以要用 NX 减去。<\/p>\n<h3>名义与实际<\/h3>\n<p>名义 GDP 用当期价格，实际 GDP 用基年价格。平减指数 = 名义 ÷ 实际 × 100，它的变化率就是通胀率的近似。<\/p>\n<h3>长期增长<\/h3>\n<p>人均 GDP 的差距来自生产率。生产率由四项决定：物质资本、人力资本、自然资源、技术知识。<\/p>\n<p>政策杠杆：储蓄与投资、吸引外资、教育健康、产权与政治稳定、自由贸易、研发。<\/p>\n<p><strong>70 法则<\/strong>：翻倍年数 ≈ 70 ÷ 增长率。2% 要 35 年，7% 只要 10 年——复利下差距惊人。<\/p>\n<p><strong>追赶效应<\/strong>：资本边际收益递减使穷国增长潜力更大，但需要制度条件配合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;GDP 增长等于生活变好&quot;——实际上要看人均实际 GDP，还要看分配与环境。\n<\/li><li>\n别以为&quot;资源丰富必然富裕&quot;——实际上制度与人力资本更关键。\n<\/li><li>\n别以为&quot;增长率差几个点无所谓&quot;——实际上几十年后是数量级的差距。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 23 章<\/td><td>一国收入的衡量<\/td><td>GDP 定义、支出法、平减指数<\/td><\/tr><tr><td>第 24 章<\/td><td>生活费用<\/td><td>实际与名义的区分延伸到价格与利率<\/td><\/tr><tr><td>第 25 章<\/td><td>生产与增长<\/td><td>生产率的四项决定因素与增长政策<\/td><\/tr><tr><td>第 33 章<\/td><td>AD-AS<\/td><td>长期产量由自然产出率决定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>通货膨胀<\/strong>（平减指数把名义与实际分开）\n<\/li><li>\n<strong>失业<\/strong>（增长与就业的关系）\n<\/li><li>\n<strong>AD-AS<\/strong>（长期增长的图形表达）\n<\/ul>", "m02": "<h1>通货膨胀<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 24、29、30、35 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>通货膨胀是物价水平的普遍、持续上涨，等价于货币购买力的下降；长期由货币增长决定，短期由总需求与供给的失衡推动。<\/p>\n<h2>为什么重要<\/h2>\n<p>它同时是&quot;指标&quot;&quot;成本&quot;和&quot;政策目标&quot;：衡量要用 CPI，理解成因要用货币数量论，应对要用菲利普斯曲线，定目标要用第 36 章的争论。四个章节围绕一个词展开。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[通胀] --&gt; B[长期 货币现象]\n    A --&gt; C[短期 需求与供给冲击]\n    B --&gt; D[MV等于PY 货币增长]\n    C --&gt; E[需求扩张 产出与物价同升]\n    C --&gt; F[供给冲击 滞胀]\n    D --&gt; G[成本: 皮鞋 菜单 税制 分配]\n    E --&gt; H[菲利普斯曲线 短期权衡]\n    F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个现象有两套解释框架，长期用货币数量论，短期用 AD-AS 与菲利普斯曲线。两套框架不矛盾，只是时间尺度不同。<\/p>\n<h2>详解<\/h2>\n<h3>衡量<\/h3>\n<p>CPI 用固定篮子算，偏高（替代偏差、新产品、质量变化）。GDP 平减指数覆盖全部国内生产。通胀率 = 指数变化率。<\/p>\n<h3>长期：货币数量论<\/h3>\n<p>MV = PY。V 稳定、Y 由技术决定，所以 P 随 M 走。&quot;通胀在任何地方都是货币现象&quot;指的是这个。<\/p>\n<p><strong>货币中性<\/strong>：长期货币量只影响名义变量，不影响真实产出。<strong>古典二分法<\/strong>把名义变量与真实变量分开分析。<\/p>\n<h3>短期：需求与供给<\/h3>\n<p>需求扩张 → 沿 SRAS 上升 → 产量与物价同升。供给冲击 → SRAS 左移 → 滞胀。<\/p>\n<h3>成本<\/h3>\n<p>皮鞋成本、菜单成本、相对价格混乱、税制扭曲、财富再分配。注意&quot;通胀让所有人变穷&quot;是谬误——收入通常同步上涨。<\/p>\n<h3>与失业的短期权衡<\/h3>\n<p>第 35 章的菲利普斯曲线：短期通胀与失业可以互换，长期曲线垂直在自然失业率处。反通胀的代价用牺牲率衡量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;通胀是坏事，所以零通胀最好&quot;——实际上适度正通胀能避免通缩与工资调整困难。\n<\/li><li>\n别以为&quot;债务人总是通胀的赢家&quot;——实际上只有未预期部分才重新分配财富。\n<\/li><li>\n别以为&quot;CPI 涨多少我的成本就涨多少&quot;——实际上每个人的消费篮子不同。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 24 章<\/td><td>生活费用<\/td><td>CPI、平减指数、实际利率<\/td><\/tr><tr><td>第 29 章<\/td><td>货币制度<\/td><td>货币供给的创造机制<\/td><\/tr><tr><td>第 30 章<\/td><td>货币增长与通胀<\/td><td>数量论、货币中性、五项成本、费雪效应<\/td><\/tr><tr><td>第 35 章<\/td><td>通胀与失业<\/td><td>短期权衡、长期垂直、牺牲率<\/td><\/tr><tr><td>第 36 章<\/td><td>政策争论<\/td><td>零通胀目标的正反双方<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>GDP 与长期增长<\/strong>（实际与名义的区分）\n<\/li><li>\n<strong>货币与银行<\/strong>（通胀的源头）\n<\/li><li>\n<strong>菲利普斯曲线<\/strong>（与失业的权衡）\n<\/ul>", "m03": "<h1>货币与银行体系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 29、30、34 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>货币是被广泛接受的交换媒介；现代货币由央行发行的现金与商业银行创造的存款共同构成，银行每放一笔贷款就多创造一笔存款。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是货币政策的物理基础。不懂&quot;存款是银行创造的&quot;，就看不懂&quot;央行买入债券为什么能增加货币供给&quot;，也看不懂第 34 章的传导链。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[央行] --&gt; B[发行现金]\n    A --&gt; C[管理准备金]\n    C --&gt; D[商业银行]\n    D --&gt; E[放贷创造存款]\n    E --&gt; F[货币供给 M1 M2]\n    B --&gt; F\n    A --&gt; G[公开市场操作]\n    G --&gt; C\n    F --&gt; H[利率]\n    H --&gt; I[投资与总需求]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面是货币的&quot;生产流程&quot;——央行管基础，银行靠放贷放大；下面是货币进入实体经济的通道，通过利率影响投资。<\/p>\n<h2>详解<\/h2>\n<h3>货币的三项职能<\/h3>\n<p>交换媒介、计价单位、价值储藏。<strong>流动性<\/strong>决定什么算 M1（现金加活期）与 M2（再加入定期与货基）。<\/p>\n<h3>银行如何创造货币<\/h3>\n<p>准备金率 10%，存入 1000 元 → 留 100 元、贷 900 元 → 900 元再存再贷……存款总额收敛到 1000 ÷ 0.1 = 10000 元。<\/p>\n<p><strong>货币乘数 = 1 ÷ 准备金率<\/strong>。现实中更小，因为现金漏出、银行持超额准备金。<\/p>\n<h3>央行的三种工具<\/h3>\n<ol><li>\n<strong>公开市场操作<\/strong>：买卖政府债券，最常用、最灵活。\n<\/li><li>\n<strong>准备金率<\/strong>：作用猛烈，很少动用。\n<\/li><li>\n<strong>利率<\/strong>：通过政策利率与利率走廊引导市场利率。\n<\/ol>\n<p>现实中央行设定<strong>目标利率<\/strong>而非目标货币量，因为货币量难以精确控制。<\/p>\n<h3>与通胀、总需求的连接<\/h3>\n<p>货币增长超过产出增长 → 通胀（第 30 章）。货币供给增加 → 利率下降 → 投资增加 → 总需求右移（第 34 章）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;只有央行能创造货币&quot;——实际上商业银行通过放贷创造存款。\n<\/li><li>\n别以为&quot;存款是银行替你保管的钱&quot;——实际上它是对银行的债权，银行把它贷出去生息。\n<\/li><li>\n别以为&quot;央行能精确控制货币量&quot;——实际上乘数会变，央行更多通过利率间接调控。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 29 章<\/td><td>货币制度<\/td><td>职能、类型、乘数、三大工具<\/td><\/tr><tr><td>第 30 章<\/td><td>货币增长与通胀<\/td><td>货币量与物价的长期关系<\/td><\/tr><tr><td>第 34 章<\/td><td>货币政策与总需求<\/td><td>流动性偏好与传导链<\/td><\/tr><tr><td>第 36 章<\/td><td>政策争论<\/td><td>规则还是相机抉择<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>通货膨胀<\/strong>（货币增长的后果）\n<\/li><li>\n<strong>利率与可贷资金<\/strong>（货币市场与资金市场的关系）\n<\/li><li>\n<strong>AD-AS<\/strong>（货币政策的最终作用点）\n<\/ul>", "m04": "<h1>利率与可贷资金市场<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 26、27、32 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>利率是&quot;今天用钱的价格&quot;：储蓄者出让资金要利息，投资者借入资金付利息，两者在可贷资金市场上相遇，共同决定利率。<\/p>\n<h2>为什么重要<\/h2>\n<p>利率是把&quot;现在的消费&quot;与&quot;未来的投资&quot;连接起来的价格。它在国内决定投资规模（第 26 章）、在国际上决定资本流动方向（第 32 章）、在金融资产上决定债券与股票的估值（第 27 章）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[国民储蓄] --&gt; B[可贷资金供给]\n    C[投资需求] --&gt; D[可贷资金需求]\n    B --&gt; E[均衡利率]\n    D --&gt; E\n    E --&gt; F[投资规模]\n    E --&gt; G[资本净流出]\n    G --&gt; H[汇率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两组力量决定利率；利率出去分两条路，一条管国内投资，一条管国际资本流动。这就是第 32 章两个市场的连接点。<\/p>\n<h2>详解<\/h2>\n<h3>供给与需求<\/h3>\n<p>供给来自储蓄：S = Y − C − G。利率越高，储蓄意愿越强。 需求来自投资：机器、厂房、住宅。利率越高，项目越少。<\/p>\n<p>均衡利率处，储蓄恰好等于投资（封闭经济）。<\/p>\n<h3>政策影响<\/h3>\n<ul><li>\n<strong>储蓄激励<\/strong>（免税账户）：供给右移，利率降、投资增。\n<\/li><li>\n<strong>投资激励<\/strong>（税收抵免）：需求右移，利率升、投资增。\n<\/li><li>\n<strong>政府赤字<\/strong>：需求右移，利率升，私人投资被<strong>挤出<\/strong>。\n<\/ul>\n<p>挤出效应的强弱取决于经济状态：衰退期资金闲置，挤出弱；繁荣期资金紧张，挤出强。<\/p>\n<h3>与货币政策的区别<\/h3>\n<p>可贷资金市场解释的是<strong>长期实际利率<\/strong>；央行的流动性偏好理论解释的是<strong>短期名义利率<\/strong>。两者不冲突：央行短期调利率，长期利率由储蓄与投资决定。<\/p>\n<h3>名义与实际<\/h3>\n<p>实际利率 ≈ 名义利率 − 通胀率。影响投资决策的是实际利率，因为企业算的是真实的回报。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;利率由央行单方面决定&quot;——实际上央行只影响短期，长期由资金供求决定。\n<\/li><li>\n别以为&quot;储蓄越多利率越低越好&quot;——实际上低利率可能反映投资需求不足。\n<\/li><li>\n别以为&quot;赤字必然抬高利率&quot;——实际上衰退期挤出效应可能接近零。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 24 章<\/td><td>生活费用<\/td><td>名义与实际利率的换算<\/td><\/tr><tr><td>第 26 章<\/td><td>储蓄投资与金融体系<\/td><td>可贷资金市场与挤出效应<\/td><\/tr><tr><td>第 27 章<\/td><td>金融工具<\/td><td>利率作为贴现率决定现值<\/td><\/tr><tr><td>第 32 章<\/td><td>开放经济<\/td><td>利率影响资本净流出与汇率<\/td><\/tr><tr><td>第 34 章<\/td><td>货币政策<\/td><td>流动性偏好解释短期利率<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>货币与银行<\/strong>（短期利率的来源）\n<\/li><li>\n<strong>开放经济<\/strong>（利率与汇率的联动）\n<\/li><li>\n<strong>GDP 与长期增长<\/strong>（投资是增长的来源）\n<\/ul>", "m05": "<h1>总需求与总供给<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 33、34、35 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>短期产量由需求决定、物价由供需交点决定；长期产量由资本、劳动、技术决定，需求只推高价格。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是宏观分析的主模型：衰退、通胀、政策效果、菲利普斯曲线，全都从这张图推出来。把这张图吃透，第 34、35 章只是加了两组工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[总需求 AD] --&gt; B[财富效应]\n    A --&gt; C[利率效应]\n    A --&gt; D[汇率效应]\n    E[短期总供给 SRAS] --&gt; F[粘性工资]\n    E --&gt; G[粘性价格]\n    E --&gt; H[价格错觉]\n    I[长期总供给 LRAS] --&gt; J[由资本 劳动 技术决定]\n    B --&gt; K[均衡]\n    C --&gt; K\n    D --&gt; K\n    F --&gt; K<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是三条曲线的成因，右边汇到一个均衡点。注意 LRAS 与 AD、SRAS 的性质完全不同——它画的是生产能力，不是价格反应。<\/p>\n<h2>详解<\/h2>\n<h3>AD 向下的三个渠道<\/h3>\n<ol><li>\n<strong>财富效应<\/strong>：物价降 → 现金购买力升 → 消费增。\n<\/li><li>\n<strong>利率效应<\/strong>：物价降 → 货币需求降 → 利率降 → 投资增。\n<\/li><li>\n<strong>汇率效应<\/strong>：物价降 → 出口竞争力升 → 净出口增。\n<\/ol>\n<p>移动因素：C、I、G、NX 的外生变化。<\/p>\n<h3>SRAS 向上的三个解释<\/h3>\n<p>粘性工资、粘性价格、价格错觉。共同点是&quot;价格信号在短期内被误读或未调整&quot;。<\/p>\n<h3>LRAS 垂直<\/h3>\n<p>产量由要素与技术决定（自然产出率），与物价无关。移动因素：劳动人口、资本存量、技术进步、制度。<\/p>\n<h3>两类冲击<\/h3>\n<p><strong>需求冲击<\/strong>：短期产量与物价同升，长期只涨价。 <strong>供给冲击<\/strong>：SRAS 左移，产量降、物价升——滞胀，政策两难。<\/p>\n<h3>政策连接<\/h3>\n<p>第 34 章讲怎么移动 AD（货币与财政），第 35 章讲移动之后的通胀—失业后果。三章是一个整体。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;AD 向下是因为东西便宜大家多买&quot;——实际上是三个宏观渠道，与单品替代效应不同。\n<\/li><li>\n别以为&quot;长期供给也能向上倾斜&quot;——实际上价格不影响长期产量。\n<\/li><li>\n别以为&quot;需求扩张能永久提高产量&quot;——实际上长期回到自然率，只留下更高的价格。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 33 章<\/td><td>AD-AS 模型<\/td><td>三事实、曲线成因、两类冲击<\/td><\/tr><tr><td>第 34 章<\/td><td>政策对 AD 的影响<\/td><td>流动性偏好、乘数、挤出效应<\/td><\/tr><tr><td>第 35 章<\/td><td>通胀与失业<\/td><td>菲利普斯曲线是同一模型的另一坐标<\/td><\/tr><tr><td>第 36 章<\/td><td>政策争论<\/td><td>稳定经济的时滞与不确定性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>通货膨胀<\/strong>（需求与供给冲击的结果）\n<\/li><li>\n<strong>失业<\/strong>（产量下降的直接后果）\n<\/li><li>\n<strong>菲利普斯曲线<\/strong>（AD-AS 的另一种画法）\n<\/ul>", "m06": "<h1>菲利普斯曲线<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 35、36 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>菲利普斯曲线画的是通胀率与失业率的关系：短期二者此消彼长，长期是一条垂直线——失业回到自然率，通胀高低由政策决定。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;政策能做什么、不能做什么&quot;的分界线。短期可以交换，长期不能；预期到的通胀无效，意外的通胀才有用。这一条支撑了第 36 章关于央行独立性与规则的全部争论。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[总需求扩张] --&gt; B[沿 SRAS 上升]\n    B --&gt; C[产量增加 物价上升]\n    C --&gt; D[失业下降 通胀上升]\n    D --&gt; E[短期菲利普斯曲线]\n    E --&gt; F[预期上调]\n    F --&gt; G[工资与价格同步上调]\n    G --&gt; H[失业回到自然率]\n    H --&gt; I[长期曲线垂直]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从需求扩张出发，绕一圈回到&quot;失业没变、只剩更高通胀&quot;。这条路径就是 1970 年代滞胀打破旧观念的过程。<\/p>\n<h2>详解<\/h2>\n<h3>短期<\/h3>\n<p>通胀与失业反向。机制：扩张需求 → 增产增雇 → 失业降、物价升。这是意料之外的通胀，企业来不及调整价格与工资。<\/p>\n<h3>长期<\/h3>\n<p>预期完全调整后，实际通胀等于预期通胀，产量回到自然率，失业不变。长期曲线垂直。<\/p>\n<p><strong>自然率假说<\/strong>：无论通胀多高，失业最终回到自然率。1970 年代通胀与失业同时上升，是这个假说的经验证据。<\/p>\n<h3>移动<\/h3>\n<ul><li>\n预期上升 → 短期曲线整体上移。\n<\/li><li>\n供给冲击 → 曲线右移（更糟位置，滞胀）。\n<\/li><li>\n自然失业率变化（人口、最低工资、工会、失业保险）→ 长期曲线左右移动。\n<\/ul>\n<h3>反通胀代价<\/h3>\n<p><strong>牺牲率<\/strong>：降 1 个百分点通胀所损失的年度产出百分比，经验值约 2–5。<\/p>\n<p>理性预期观点认为：央行若可信地宣布并能做到，预期立即下调，代价很小。沃尔克的实践（1979–1982）表明代价真实存在，格林斯潘时期的小幅调整表明可信度能降低成本。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;通胀与失业可以长期互换&quot;——实际上长期只能决定通胀，不能决定失业。\n<\/li><li>\n别以为&quot;降低通胀没有代价&quot;——实际上除非预期瞬间调整，否则要经历产量损失。\n<\/li><li>\n别以为&quot;菲利普斯曲线是新理论&quot;——实际上它就是 AD-AS 换个坐标。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 33 章<\/td><td>AD-AS<\/td><td>需求扩张的短期与长期结果<\/td><\/tr><tr><td>第 35 章<\/td><td>短期权衡<\/td><td>曲线由来、预期作用、供给冲击、牺牲率<\/td><\/tr><tr><td>第 36 章<\/td><td>政策争论<\/td><td>零通胀目标、规则与相机抉择<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>AD-AS<\/strong>（同一模型的另一种表达）\n<\/li><li>\n<strong>通货膨胀<\/strong>（曲线的纵轴）\n<\/li><li>\n<strong>失业<\/strong>（曲线的横轴，长期锚定在自然率）\n<\/ul>", "m07": "<h1>开放经济<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 31、32 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个开放经济里，贸易余额与资本流动是同一枚硬币的两面（NX = NCF），汇率则是把这两个市场连起来的转换器。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把前面所有工具放到国际场景：储蓄与投资决定贸易余额，利率决定资本流向，汇率再决定出口竞争力。理解这套联动，才能判断&quot;关税能不能减少逆差&quot;&quot;资本外逃会发生什么&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[储蓄 S 与投资 I] --&gt; B[NX 等于 S 减 I]\n    B --&gt; C[贸易余额]\n    D[可贷资金市场] --&gt; E[利率]\n    E --&gt; F[资本净流出 NCF]\n    F --&gt; G[外汇市场]\n    G --&gt; H[汇率]\n    H --&gt; I[出口竞争力]\n    I --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图是循环的——贸易余额由储蓄投资决定，资本流动由利率决定，汇率又把资本流动与出口连回去。四个环节缺一不可。<\/p>\n<h2>详解<\/h2>\n<h3>恒等式<\/h3>\n<p>NX = NCF；由 S = I + NX 得 <strong>NX = S − I<\/strong>。<\/p>\n<p>顺差 = 储蓄超过投资 = 资金借给外国（资本净流出）。 逆差 = 投资超过储蓄 = 靠外国资金补足（资本净流入）。<\/p>\n<h3>汇率<\/h3>\n<p>名义汇率：两种货币的兑换比率。 实际汇率 = 名义汇率 × 国内物价 ÷ 国外物价，衡量本国商品的相对价格。<\/p>\n<h3>购买力平价<\/h3>\n<p>同种商品在各国换算后应同价，靠套利实现。局限：服务不可贸易、存在壁垒、消费篮子不同。长期部分成立，短期基本无效。<\/p>\n<h3>政策推演<\/h3>\n<ul><li>\n<strong>赤字<\/strong>：利率升 → 资本净流出减少 → 本币升值 → 逆差扩大。\n<\/li><li>\n<strong>贸易政策<\/strong>：进口减少 → 本币升值 → 出口减少 → NX 不变，只改变构成。\n<\/li><li>\n<strong>资本外逃<\/strong>：本币贬值 + 利率上升。\n<\/ul>\n<p>判断任何政策对 NX 的影响，最快的办法是看它是否改变 S 或 I。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;限制进口能减少逆差&quot;——实际上只会让本币升值、出口同减。\n<\/li><li>\n别以为&quot;顺差是胜利&quot;——实际上它意味着国内消费与投资相对不足。\n<\/li><li>\n别以为&quot;汇率越低越有利&quot;——实际上它有利出口、不利进口与消费者。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 31 章<\/td><td>基本概念<\/td><td>NX = NCF、储蓄投资关系、实际汇率、PPP<\/td><\/tr><tr><td>第 32 章<\/td><td>开放经济理论<\/td><td>两个市场联动、三类冲击的推演<\/td><\/tr><tr><td>第 26 章<\/td><td>可贷资金市场<\/td><td>利率的国内来源<\/td><\/tr><tr><td>第 9 章（微观）<\/td><td>国际贸易<\/td><td>进出口对国内剩余的影响<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>利率与可贷资金<\/strong>（资本流动的驱动）\n<\/li><li>\n<strong>GDP 与长期增长<\/strong>（储蓄率与投资）\n<\/li><li>\n<strong>通货膨胀<\/strong>（影响实际汇率与竞争力）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：测量：GDP 与物价<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch23\">第 23 章：一国收入的衡量<\/a>、<a href=\"#/book/macroeconomics/chapter/ch24\">第 24 章：生活费用的衡量<\/a><br>检查点：能算平减指数、CPI、实际利率<\/li><li class='path-step' id='path-02'><strong>步骤 02：长期增长与生产率<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch25\">第 25 章：生产与增长<\/a><br>检查点：能用 70 法则与四项因素解释增长差异<\/li><li class='path-step' id='path-03'><strong>步骤 03：储蓄、投资与金融<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch26\">第 26 章：储蓄、投资和金融体系<\/a>、<a href=\"#/book/macroeconomics/chapter/ch27\">第 27 章：金融学的基本工具<\/a><br>检查点：能画可贷资金市场并算现值<\/li><li class='path-step' id='path-04'><strong>步骤 04：失业的结构<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch28\">第 28 章：失业<\/a><br>检查点：能区分三类失业并给出对策<\/li><li class='path-step' id='path-05'><strong>步骤 05：货币、银行与通胀<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch29\">第 29 章：货币制度<\/a>、<a href=\"#/book/macroeconomics/chapter/ch30\">第 30 章：货币增长与通货膨胀<\/a><br>检查点：能算货币乘数并用 MV = PY 解释通胀<\/li><li class='path-step' id='path-06'><strong>步骤 06：开放经济<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch31\">第 31 章：开放经济的基本概念<\/a>、<a href=\"#/book/macroeconomics/chapter/ch32\">第 32 章：开放经济的宏观经济理论<\/a><br>检查点：能用 NX = S − I 与两市场模型推演政策<\/li><li class='path-step' id='path-07'><strong>步骤 07：AD-AS 与政策工具<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch33\">第 33 章：总需求与总供给<\/a>、<a href=\"#/book/macroeconomics/chapter/ch34\">第 34 章：货币政策和财政政策对总需求的影响<\/a><br>检查点：能画需求冲击的短长期结果、算乘数<\/li><li class='path-step' id='path-08'><strong>步骤 08：权衡与争论<\/strong><br>阅读：<a href=\"#/book/macroeconomics/chapter/ch35\">第 35 章：通货膨胀与失业之间的短期权衡取舍<\/a>、<a href=\"#/book/macroeconomics/chapter/ch36\">第 36 章：宏观经济政策的六个争论问题<\/a><br>检查点：能解释长期曲线垂直、说出六场争论的正反方<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 23 章：一国收入的衡量<\/h2><div class='quiz-item' data-qid='ch23-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一项计入当年的 GDP？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q01' value='0'> 二手车的转手价格<\/label><label class='quiz-opt'><input type='radio' name='ch23-q01' value='1'> 政府发放的失业救济金<\/label><label class='quiz-opt'><input type='radio' name='ch23-q01' value='2'> 新建住宅的建造价值<\/label><label class='quiz-opt'><input type='radio' name='ch23-q01' value='3'> 购买某公司股票<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch23-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某国名义 GDP 为 550 亿元，按基年价格计算的实际 GDP 为 385 亿元。GDP 平减指数约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q02' value='0'> 100<\/label><label class='quiz-opt'><input type='radio' name='ch23-q02' value='1'> 130<\/label><label class='quiz-opt'><input type='radio' name='ch23-q02' value='2'> 142.9<\/label><label class='quiz-opt'><input type='radio' name='ch23-q02' value='3'> 165<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch23-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 支出法下，进口消费品为什么要从总支出中减去？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q03' value='0'> 因为进口品价格更高<\/label><label class='quiz-opt'><input type='radio' name='ch23-q03' value='1'> 因为它已被计入消费但并非本国生产<\/label><label class='quiz-opt'><input type='radio' name='ch23-q03' value='2'> 因为进口要交关税<\/label><label class='quiz-opt'><input type='radio' name='ch23-q03' value='3'> 因为进口品不计入统计口径<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch23-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> GDP 无法反映下列哪些内容？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch23-q04' value='0'> 家务劳动的价值<\/label><label class='quiz-opt'><input type='checkbox' name='ch23-q04' value='1'> 收入分配状况<\/label><label class='quiz-opt'><input type='checkbox' name='ch23-q04' value='2'> 环境破坏的成本<\/label><label class='quiz-opt'><input type='checkbox' name='ch23-q04' value='3'> 产品的质量改进<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 24 章：生活费用的衡量<\/h2><div class='quiz-ite
