\/b> 费雪效应的内容是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch30-q02' value='0'> 通胀上升时名义利率随之上升<\/label><label class='quiz-opt'><input type='radio' name='ch30-q02' value='1'> 通胀上升时名义利率下降<\/label><label class='quiz-opt'><input type='radio' name='ch30-q02' value='2'> 实际利率永远不变<\/label><label class='quiz-opt'><input type='radio' name='ch30-q02' value='3'> 货币量与物价无关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch30-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 下列哪一项不是通胀的成本？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch30-q03' value='0'> 皮鞋成本<\/label><label class='quiz-opt'><input type='radio' name='ch30-q03' value='1'> 菜单成本<\/label><label class='quiz-opt'><input type='radio' name='ch30-q03' value='2'> 税制扭曲<\/label><label class='quiz-opt'><input type='radio' name='ch30-q03' value='3'> 产出必然下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch30-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 关于通胀税，正确的说法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch30-q04' value='0'> 靠印钞为支出融资，等于向持币者征税<\/label><label class='quiz-opt'><input type='checkbox' name='ch30-q04' value='1'> 无需立法即可征收，因此隐蔽<\/label><label class='quiz-opt'><input type='checkbox' name='ch30-q04' value='2'> 对持有现金比例高的低收入者更不利<\/label><label class='quiz-opt'><input type='checkbox' name='ch30-q04' value='3'> 它只影响富人<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch31__": "<h1>测验：第 31 章：开放经济的基本概念<\/h1><div class='quiz-item' data-qid='ch31-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一国净出口为正（贸易顺差），意味着？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch31-q01' value='0'> 该国的储蓄超过投资，资金净流出<\/label><label class='quiz-opt'><input type='radio' name='ch31-q01' value='1'> 该国的投资超过储蓄，资金净流入<\/label><label class='quiz-opt'><input type='radio' name='ch31-q01' value='2'> 该国一定有资本外逃<\/label><label class='quiz-opt'><input type='radio' name='ch31-q01' value='3'> 该国货币一定升值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch31-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 名义汇率 7 元/美元，中国物价指数 110，美国 100。实际汇率是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch31-q02' value='0'> 7.0<\/label><label class='quiz-opt'><input type='radio' name='ch31-q02' value='1'> 7.7<\/label><label class='quiz-opt'><input type='radio' name='ch31-q02' value='2'> 6.4<\/label><label class='quiz-opt'><input type='radio' name='ch31-q02' value='3'> 0.7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch31-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 购买力平价理论在现实中不完全成立，主要原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch31-q03' value='0'> 各国货币不同<\/label><label class='quiz-opt'><input type='radio' name='ch31-q03' value='1'> 许多商品与服务无法跨国搬运，且存在壁垒<\/label><label class='quiz-opt'><input type='radio' name='ch31-q03' value='2'> 汇率由政府规定<\/label><label class='quiz-opt'><input type='radio' name='ch31-q03' value='3'> 各国人口不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch31-q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 衡量两国商品相对价格、等于名义汇率乘两国物价之比的汇率叫什么？（四个字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch32__": "<h1>测验：第 32 章：开放经济的宏观经济理论<\/h1><div class='quiz-item' data-qid='ch32-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 政府预算赤字扩大，在开放经济中通常导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch32-q01' value='0'> 利率上升、本币升值、净出口减少<\/label><label class='quiz-opt'><input type='radio' name='ch32-q01' value='1'> 利率下降、本币贬值、净出口增加<\/label><label class='quiz-opt'><input type='radio' name='ch32-q01' value='2'> 利率不变、净出口不变<\/label><label class='quiz-opt'><input type='radio' name='ch32-q01' value='3'> 利率上升、本币贬值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch32-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 限制进口的贸易政策对贸易余额的长期影响是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch32-q02' value='0'> 显著改善贸易余额<\/label><label class='quiz-opt'><input type='radio' name='ch32-q02' value='1'> 基本不改变贸易余额，只改变贸易构成与数量<\/label><label class='quiz-opt'><input type='radio' name='ch32-q02' value='2'> 必然扩大逆差<\/label><label class='quiz-opt'><input type='radio' name='ch32-q02' value='3'> 使本币贬值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch32-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 资本外逃会带来？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch32-q03' value='0'> 本币升值、利率下降<\/label><label class='quiz-opt'><input type='radio' name='ch32-q03' value='1'> 本币贬值、利率上升<\/label><label class='quiz-opt'><input type='radio' name='ch32-q03' value='2'> 本币升值、利率上升<\/label><label class='quiz-opt'><input type='radio' name='ch32-q03' value='3'> 本币贬值、利率下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch32-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 在开放经济两市场模型中，连接可贷资金市场与外汇市场的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch32-q04' value='0'> 资本净流出<\/label><label class='quiz-opt'><input type='checkbox' name='ch32-q04' value='1'> 国内利率<\/label><label class='quiz-opt'><input type='checkbox' name='ch32-q04' value='2'> 汇率<\/label><label class='quiz-opt'><input type='checkbox' name='ch32-q04' value='3'> 政府税收<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch33__": "<h1>测验：第 33 章：总需求与总供给<\/h1><div class='quiz-item' data-qid='ch33-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 总需求曲线向下倾斜的原因不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch33-q01' value='0'> 财富效应<\/label><label class='quiz-opt'><input type='radio' name='ch33-q01' value='1'> 利率效应<\/label><label class='quiz-opt'><input type='radio' name='ch33-q01' value='2'> 汇率效应<\/label><label class='quiz-opt'><input type='radio' name='ch33-q01' value='3'> 商品价格越低越多人买<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch33-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 长期总供给曲线是垂直线，原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch33-q02' value='0'> 价格水平不影响长期产量，产量由资本、劳动与技术决定<\/label><label class='quiz-opt'><input type='radio' name='ch33-q02' value='1'> 企业长期不调整价格<\/label><label class='quiz-opt'><input type='radio' name='ch33-q02' value='2'> 政府管制价格<\/label><label class='quiz-opt'><input type='radio' name='ch33-q02' value='3'> 货币量固定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch33-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 石油价格暴涨导致？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch33-q03' value='0'> SRAS 左移，产量下降、物价上升<\/label><label class='quiz-opt'><input type='radio' name='ch33-q03' value='1'> AD 右移，产量与物价上升<\/label><label class='quiz-opt'><input type='radio' name='ch33-q03' value='2'> LRAS 右移<\/label><label class='quiz-opt'><input type='radio' name='ch33-q03' value='3'> 失业下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch33-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列哪些因素会使总需求曲线整体右移？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch33-q04' value='0'> 政府购买增加<\/label><label class='quiz-opt'><input type='checkbox' name='ch33-q04' value='1'> 企业投资信心上升<\/label><label class='quiz-opt'><input type='checkbox' name='ch33-q04' value='2'> 物价水平下降<\/label><label class='quiz-opt'><input type='checkbox' name='ch33-q04' value='3'> 外国对本国产品需求增加<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch34__": "<h1>测验：第 34 章：货币政策和财政政策对总需求的影响<\/h1><div class='quiz-item' data-qid='ch34-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 流动性偏好理论中，货币供给曲线画成垂直线是因为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch34-q01' value='0'> 货币供给由央行决定，与利率无关<\/label><label class='quiz-opt'><input type='radio' name='ch34-q01' value='1'> 人们不持有货币<\/label><label class='quiz-opt'><input type='radio' name='ch34-q01' value='2'> 利率固定<\/label><label class='quiz-opt'><input type='radio' name='ch34-q01' value='3'> 货币需求不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch34-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> MPC 为 0.8，政府购买增加 100 亿元，总需求约增加？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch34-q02' value='0'> 100 亿<\/label><label class='quiz-opt'><input type='radio' name='ch34-q02' value='1'> 180 亿<\/label><label class='quiz-opt'><input type='radio' name='ch34-q02' value='2'> 400 亿<\/label><label class='quiz-opt'><input type='radio' name='ch34-q02' value='3'> 500 亿<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch34-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 等额减税与政府购买相比，对总需求的刺激通常？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch34-q03' value='0'> 更大<\/label><label class='quiz-opt'><input type='radio' name='ch34-q03' value='1'> 相同<\/label><label class='quiz-opt'><input type='radio' name='ch34-q03' value='2'> 更小，因为部分减税被储蓄<\/label><label class='quiz-opt'><input type='radio' name='ch34-q03' value='3'> 无法比较<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch34-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 属于自动稳定器的有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch34-q04' value='0'> 累进所得税<\/label><label class='quiz-opt'><input type='checkbox' name='ch34-q04' value='1'> 失业保险<\/label><label class='quiz-opt'><input type='checkbox' name='ch34-q04' value='2'> 一次性基建投资<\/label><label class='quiz-opt'><input type='checkbox' name='ch34-q04' value='3'> 转移支付<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch35__": "<h1>测验：第 35 章：通货膨胀与失业之间的短期权衡取舍<\/h1><div class='quiz-item' data-qid='ch35-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 长期菲利普斯曲线为什么是垂直的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch35-q01' value='0'> 失业率与通胀率无关，失业回到自然率<\/label><label class='quiz-opt'><input type='radio' name='ch35-q01' value='1'> 通胀永远为零<\/label><label class='quiz-opt'><input type='radio' name='ch35-q01' value='2'> 政府控制工资<\/label><label class='quiz-opt'><input type='radio' name='ch35-q01' value='3'> 企业不提价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch35-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 菲利普斯曲线与 AD-AS 模型的关系是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch35-q02' value='0'> 两个独立理论<\/label><label class='quiz-opt'><input type='radio' name='ch35-q02' value='1'> 同一模型的两种坐标表达<\/label><label class='quiz-opt'><input type='radio' name='ch35-q02' value='2'> 菲利普斯曲线更早出现因此更准确<\/label><label class='quiz-opt'><input type='radio' name='ch35-q02' value='3'> 完全矛盾<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch35-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 牺牲率为 3，通胀从 6% 降到 2%，累计产出损失约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch35-q03' value='0'> 4%<\/label><label class='quiz-opt'><input type='radio' name='ch35-q03' value='1'> 6%<\/label><label class='quiz-opt'><input type='radio' name='ch35-q03' value='2'> 12%<\/label><label class='quiz-opt'><input type='radio' name='ch35-q03' value='3'> 18%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch35-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 使短期菲利普斯曲线上移（同样失业率对应更高通胀）的因素有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch35-q04' value='0'> 预期通胀上升<\/label><label class='quiz-opt'><input type='checkbox' name='ch35-q04' value='1'> 供给冲击<\/label><label class='quiz-opt'><input type='checkbox' name='ch35-q04' value='2'> 自然失业率下降<\/label><label class='quiz-opt'><input type='checkbox' name='ch35-q04' value='3'> 工资合同指数化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch36__": "<h1>测验：第 36 章：宏观经济政策的六个争论问题<\/h1><div class='quiz-item' data-qid='ch36-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 反对「决策者应积极稳定经济」的核心理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch36-q01' value='0'> 衰退有益<\/label><label class='quiz-opt'><input type='radio' name='ch36-q01' value='1'> 政策存在时滞且预测不准<\/label><label class='quiz-opt'><input type='radio' name='ch36-q01' value='2'> 政府没有工具<\/label><label class='quiz-opt'><input type='radio' name='ch36-q01' value='3'> 市场会自动恢复<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch36-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 主张央行设定 2% 而非 0% 通胀目标的理由不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch36-q02' value='0'> 避免滑入通缩<\/label><label class='quiz-opt'><input type='radio' name='ch36-q02' value='1'> 给名义工资调整留缓冲<\/label><label class='quiz-opt'><input type='radio' name='ch36-q02' value='2'> 消除全部通胀成本<\/label><label class='quiz-opt'><input type='radio' name='ch36-q02' value='3'> 保留降息空间<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch36-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 衰退期强行平衡预算的主要问题是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch36-q03' value='0'> 会推高通胀<\/label><label class='quiz-opt'><input type='radio' name='ch36-q03' value='1'> 等于紧缩，加深衰退<\/label><label class='quiz-opt'><input type='radio' name='ch36-q03' value='2'> 会降低利率<\/label><label class='quiz-opt'><input type='radio' name='ch36-q03' value='3'> 会减少失业<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch36-q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 支持「为鼓励储蓄修改税法」的论据包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='ch36-q04' value='0'> 储蓄是资本来源、能提高生产率<\/label><label class='quiz-opt'><input type='checkbox' name='ch36-q04' value='1'> 现行税制对利息与资本利得征税等于惩罚储蓄<\/label><label class='quiz-opt'><input type='checkbox' name='ch36-q04' value='2'> 减税主要惠及富人所以更公平<\/label><label class='quiz-opt'><input type='checkbox' name='ch36-q04' value='3'> 储蓄增加能降低对外资依赖<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='国内生产总值'>国内生产总值 — 一国境内一定时期内生产的所有最终物品与服务的市场价值。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='最终产品'>最终产品 — 直接供最终使用、不再作为其他产品投入的产品。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='名义 gdp'>名义 GDP — 按当期价格计算的 GDP。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='实际 gdp'>实际 GDP — 按基年价格计算的 GDP，剔除价格变动影响。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='gdp 平减指数'>GDP 平减指数 — 名义 GDP 与实际 GDP 之比乘以 100，衡量整体价格水平。 <span class=glossary-ref>（第 23 章：一国收入的衡量）<\/span><\/li><li data-term='消费物价指数'>消费物价指数 — 用固定一篮子消费品价格计算的物价指数，衡量生活费用变化。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='通货膨胀率'>通货膨胀率 — 物价指数在两个时期之间的百分比变化。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='指数化'>指数化 — 按物价指数自动调整金额，以维持实际购买力。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='名义利率'>名义利率 — 未扣除通胀的挂牌利率。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='实际利率'>实际利率 — 名义利率扣除通胀后的购买力增长，近似等于名义利率减通胀率。 <span class=glossary-ref>（第 24 章：生活费用的衡量）<\/span><\/li><li data-term='生产率'>生产率 — 每单位劳动投入所生产的产出量。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='物质资本'>物质资本 — 用于生产的设备、厂房与基础设施。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='人力资本'>人力资本 — 劳动者通过教育、培训与经验积累的知识与技能。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='技术知识'>技术知识 — 关于如何生产的知识本身，存在于专利、文献与工艺中。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='追赶效应'>追赶效应 — 资本存量低的穷国增长更快，因为资本边际收益更高。 <span class=glossary-ref>（第 25 章：生产与增长）<\/span><\/li><li data-term='债券'>债券 — 借款人承诺按期付息还本的债务凭证。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='股票'>股票 — 对企业所有权的份额，持有人分享剩余收益。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='金融中介'>金融中介 — 连接储蓄者与借款人的机构，如银行、共同基金。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='可贷资金市场'>可贷资金市场 — 储蓄供给与投资需求相互作用决定利率的市场模型。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='挤出效应'>挤出效应 — 政府借款抬高利率、减少私人投资的现象。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='共同基金'>共同基金 — 汇集众多投资者资金、由专业经理投资于组合的机构。 <span class=glossary-ref>（第 26 章：储蓄、投资和金融体系）<\/span><\/li><li data-term='现值'>现值 — 未来一笔金额按某一利率折算成的今天价值。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='净现值'>净现值 — 未来现金流的现值减去初始投入。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='风险厌恶'>风险厌恶 — 偏好确定收益、回避波动的倾向。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='多元化'>多元化 — 把资金投入不相关资产以降低企业特有风险。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='基本面分析'>基本面分析 — 通过估算资产未来现金流的现值来判断其价值。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='有效市场假说'>有效市场假说 — 资产价格已充分反映所有公开信息的理论。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='泡沫'>泡沫 — 资产价格远超其基本面价值的现象。 <span class=glossary-ref>（第 27 章：金融学的基本工具）<\/span><\/li><li data-term='劳动力'>劳动力 — 就业者与失业者的总和。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='失业率'>失业率 — 失业人数占劳动力的比例。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='劳动参与率'>劳动参与率 — 劳动力占成年人口的比例。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='摩擦性失业'>摩擦性失业 — 换工作或初入职场期间寻找匹配岗位造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='结构性失业'>结构性失业 — 技能或地区与岗位需求不匹配造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='周期性失业'>周期性失业 — 经济衰退中总需求不足造成的失业。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='自然失业率'>自然失业率 — 摩擦性与结构性失业对应的正常失业水平。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='失业保险'>失业保险 — 向失业者提供部分收入补偿的制度。 <span class=glossary-ref>（第 28 章：失业）<\/span><\/li><li data-term='货币'>货币 — 被广泛接受用作交换媒介、计价单位与价值储藏的东西。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='流动性'>流动性 — 资产转换为交换媒介的容易程度。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='商品货币'>商品货币 — 自身具有内在价值的货币，如金银。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='法定货币'>法定货币 — 没有内在价值、依靠政府法令与信任流通的货币。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='准备金'>准备金 — 银行保留的不贷出的存款部分。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='准备金率'>准备金率 — 准备金占存款的比例。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='货币乘数'>货币乘数 — 准备金率倒数，表示单位准备金能支撑的存款总额。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='公开市场操作'>公开市场操作 — 央行买卖政府债券以调节银行体系准备金与货币供给。 <span class=glossary-ref>（第 29 章：货币制度）<\/span><\/li><li data-term='货币数量论'>货币数量论 — 用 MV = PY 说明物价水平由货币量决定的理论。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='流通速度'>流通速度 — 单位货币在一年内参与交易的次数。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='通胀税'>通胀税 — 政府通过印钞融资，使持币者购买力下降所形成的隐性税负。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='费雪效应'>费雪效应 — 名义利率随预期通胀同向调整的现象。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='皮鞋成本'>皮鞋成本 — 为减少持有现金的损失而频繁取现所耗费的时间与资源。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='菜单成本'>菜单成本 — 因改价而发生的重印、更新与沟通成本。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='恶性通胀'>恶性通胀 — 物价极高速上涨、货币失去基本职能的极端通胀。 <span class=glossary-ref>（第 30 章：货币增长与通货膨胀）<\/span><\/li><li data-term='净出口'>净出口 — 出口减进口，也称贸易余额。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='资本净流出'>资本净流出 — 本国居民购买外国资产减去外国人购买本国资产。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='名义汇率'>名义汇率 — 两种货币之间的兑换比率。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='实际汇率'>实际汇率 — 两国商品的相对价格，等于名义汇率乘以两国物价之比。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='购买力平价'>购买力平价 — 同样商品在各国换算后应价格相同的理论。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='升值'>升值 — 本币能兑换更多外币。 <span class=glossary-ref>（第 31 章：开放经济的基本概念）<\/span><\/li><li data-term='外汇市场'>外汇市场 — 本币与外币相互兑换的市场，供求决定汇率。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='资本外逃'>资本外逃 — 投资者因对一国失去信心而大规模转移资金。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='贸易政策'>贸易政策 — 关税、配额、补贴等限制或鼓励进出口的政策。 <span class=glossary-ref>（第 32 章：开放经济的宏观经济理论）<\/span><\/li><li data-term='总需求'>总需求 — 物价水平与总产出需求量之间的关系。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='总供给'>总供给 — 物价水平与总产出供给量之间的关系。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='自然产出率'>自然产出率 — 经济在正常运转时能生产的产出水平，由要素与技术决定。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='滞胀'>滞胀 — 产量下降与物价上涨同时出现的状态。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='粘性工资'>粘性工资 — 名义工资因合同或习惯不能随物价立即调整。 <span class=glossary-ref>（第 33 章：总需求与总供给）<\/span><\/li><li data-term='流动性偏好'>流动性偏好 — 人们偏好持有流动性高的资产，该理论用货币供求解释利率。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='支出乘数'>支出乘数 — 政府购买增加引起的总需求变化倍数，等于 1/(1−MPC)。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='税收乘数'>税收乘数 — 减税引起的总需求变化倍数，等于 −MPC/(1−MPC)。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='挤出效应'>挤出效应 — 政府借款抬高利率从而减少私人投资的现象。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='自动稳定器'>自动稳定器 — 不需政策决策即随经济状况自动调节税收与支出的机制。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='边际消费倾向'>边际消费倾向 — 收入每增加一单位用于消费的比例。 <span class=glossary-ref>（第 34 章：货币政策和财政政策对总需求的影响）<\/span><\/li><li data-term='菲利普斯曲线'>菲利普斯曲线 — 通货膨胀率与失业率之间关系的曲线。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='自然率假说'>自然率假说 — 失业最终回到自然失业率、不受通胀水平影响的观点。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='牺牲率'>牺牲率 — 降低一个百分点通胀所损失的年度产出百分比。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='反通货膨胀'>反通货膨胀 — 刻意降低通货膨胀率的政策过程。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='滞胀'>滞胀 — 通胀上升与失业上升并存的状态。 <span class=glossary-ref>（第 35 章：通货膨胀与失业之间的短期权衡取舍）<\/span><\/li><li data-term='相机抉择'>相机抉择 — 根据当时形势灵活决定政策，而非按固定规则行事。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='自动稳定器'>自动稳定器 — 无需决策即随经济周期自动调节收支的机制。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='周期性赤字'>周期性赤字 — 经济衰退导致税收减少、支出增加所形成的赤字。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><li data-term='结构性赤字'>结构性赤字 — 剔除周期因素后仍存在的长期收支缺口。 <span class=glossary-ref>（第 36 章：宏观经济政策的六个争论问题）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库（宏观）<\/h1>\n<h2>框架一：长期与短期分开看<\/h2>\n<p><strong>何时用<\/strong>：任何&quot;某政策有没有用&quot;的问题，第一句先问：看多长？ <strong>怎么用<\/strong>：长期用生产能力（资本、劳动、技术）判断，短期用总需求判断。货币中性只在长期成立，乘数效应只在短期有效。<\/p>\n<h2>框架二：政策推演四步<\/h2>\n<ol><li>\n政策改变了什么（货币量、政府支出、税率、资本流动）？\n<\/li><li>\n它先影响哪个市场（可贷资金、外汇、货币市场）？\n<\/li><li>\n价格变量怎么变（利率、汇率）？\n<\/li><li>\n通过价格变量影响哪个实体变量（投资、净出口、产量）？\n<\/ol>\n<p>四步走完，链条不会漏环节。第 32、34 章的所有推演都是这个套路。<\/p>\n<h2>框架三：恒等式先算总量<\/h2>\n<p>遇到&quot;这个政策会不会改变贸易余额/储蓄/投资&quot;，先用恒等式：<\/p>\n<ul><li>\n封闭经济：S = I\n<\/li><li>\n开放经济：NX = S − I\n<\/li><li>\n货币：MV = PY\n<\/ul>\n<p>恒等式不告诉你方向，但立刻告诉你&quot;什么东西不可能变&quot;。贸易政策不可能改变 NX 总量，就是恒等式的直接结论。<\/p>\n<h2>框架四：预期是分水岭<\/h2>\n<p>同样的政策，预期到与没预期到，效果完全不同。<\/p>\n<ul><li>\n反通胀：预期跟上则代价小，跟不上则代价大（牺牲率）。\n<\/li><li>\n财政刺激：家庭若预期未来增税，会多储蓄，乘数变小（李嘉图等价的经验版本）。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n若通胀高且失业低 → 需求过热，紧缩总需求。\n<\/li><li>\n若通胀高且失业高 → 滞胀，供给冲击，没有单一解药。\n<\/li><li>\n若通胀低且失业高 → 需求不足，扩张总需求（注意时滞）。\n<\/li><li>\n若长期增长停滞 → 看生产率四项，而不是短期刺激。\n<\/ul>\n<h2>反模式（作者明确提示的误判）<\/h2>\n<ul><li>\n<strong>把名义当实际<\/strong>：名义工资涨 5%、物价涨 6%，实际是降薪。\n<\/li><li>\n<strong>把单品涨价当通胀<\/strong>：通胀是普遍价格水平上升。\n<\/li><li>\n<strong>把长期问题用短期工具解决<\/strong>：刺激不能提高潜在增长率。\n<\/li><li>\n<strong>忽视时滞做积极调控<\/strong>：等政策见效时，周期可能已经转向。\n<\/li><li>\n<strong>用总量掩盖分配<\/strong>：GDP 与通胀率都不回答&quot;谁受损&quot;。\n<\/li><li>\n<strong>把相关当因果<\/strong>：货币增长与通胀同向，但个例不等于机制。\n<\/ul>", "__cheatsheet__": "<h1>速查表（宏观）<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>支出法<\/td><td>GDP = C + I + G + NX<\/td><\/tr><tr><td>平减指数<\/td><td>名义 GDP ÷ 实际 GDP × 100<\/td><\/tr><tr><td>CPI<\/td><td>当期篮子成本 ÷ 基期篮子成本 × 100<\/td><\/tr><tr><td>实际利率<\/td><td>≈ 名义利率 − 通胀率<\/td><\/tr><tr><td>70 法则<\/td><td>翻倍年数 ≈ 70 ÷ 增长率（%）<\/td><\/tr><tr><td>储蓄<\/td><td>S = Y − C − G；封闭经济 S = I<\/td><\/tr><tr><td>开放经济<\/td><td>NX = S − I = NCF<\/td><\/tr><tr><td>实际汇率<\/td><td>名义汇率 × 国内物价 ÷ 国外物价<\/td><\/tr><tr><td>货币乘数<\/td><td>1 ÷ 准备金率<\/td><\/tr><tr><td>货币数量方程<\/td><td>M × V = P × Y<\/td><\/tr><tr><td>费雪效应<\/td><td>名义利率 ≈ 实际利率 + 通胀率<\/td><\/tr><tr><td>现值<\/td><td>PV = FV ÷ (1+r)^n<\/td><\/tr><tr><td>支出乘数<\/td><td>1 ÷ (1 − MPC)<\/td><\/tr><tr><td>税收乘数<\/td><td>−MPC ÷ (1 − MPC)<\/td><\/tr><tr><td>牺牲率<\/td><td>降 1 个百分点通胀对应的年度产出损失百分比<\/td><\/tr><\/tbody><\/table>\n<h2>定量示例（全书统一）<\/h2>\n<ul><li>\n名义 GDP 550、实际 385 → 平减指数 142.9，价格比基年高约 43%。\n<\/li><li>\n篮子基年 14 元、当期 20 元 → CPI ≈ 142.9。\n<\/li><li>\nM 增 20%、Y 增 3% → 物价涨约 16.5%。\n<\/li><li>\n准备金率 10% → 乘数 10，1000 元存款支撑 10000 元。\n<\/li><li>\nMPC = 0.8 → 支出乘数 5、税收乘数 −4；政府购买 100 亿 → +500 亿。\n<\/li><li>\n实际汇率：7 × 110 ÷ 100 = 7.7。\n<\/ul>\n<h2>传导链速查<\/h2>\n<ul><li>\n<strong>货币扩张<\/strong>：货币供给↑ → 利率↓ → 投资↑ → AD 右移 → 产量与物价↑（短期）。\n<\/li><li>\n<strong>财政赤字<\/strong>：借款↑ → 利率↑ → 投资↓（挤出）；开放经济中再加：资本净流出↓ → 本币↑ → NX↓。\n<\/li><li>\n<strong>贸易政策<\/strong>：进口↓ → 本币↑ → 出口↓ → NX 不变。\n<\/li><li>\n<strong>资本外逃<\/strong>：本币↓ + 利率↑。\n<\/li><li>\n<strong>供给冲击<\/strong>：SRAS 左移 → 滞胀 → 政策两难。\n<\/ul>\n<h2>判断流程<\/h2>\n<ol><li>\n先定位时间尺度：长期还是短期？\n<\/li><li>\n再看是需求侧还是供给侧冲击？\n<\/li><li>\n需要恒等式帮忙判断&quot;总量能不能变&quot;。\n<\/li><li>\n最后考虑预期与时滞，决定政策力度。\n<\/ol>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 23 章：一国收入的衡量", "href": "#/chapter/ch23"}, {"label": "第 24 章：生活费用的衡量", "href": "#/chapter/ch24"}, {"label": "第 25 章：生产与增长", "href": "#/chapter/ch25"}, {"label": "第 26 章：储蓄、投资和金融体系", "href": "#/chapter/ch26"}, {"label": "第 27 章：金融学的基本工具", "href": "#/chapter/ch27"}, {"label": "第 28 章：失业", "href": "#/chapter/ch28"}, {"label": "第 29 章：货币制度", "href": "#/chapter/ch29"}, {"label": "第 30 章：货币增长与通货膨胀", "href": "#/chapter/ch30"}, {"label": "第 31 章：开放经济的基本概念", "href": "#/chapter/ch31"}, {"label": "第 32 章：开放经济的宏观经济理论", "href": "#/chapter/ch32"}, {"label": "第 33 章：总需求与总供给", "href": "#/chapter/ch33"}, {"label": "第 34 章：货币政策和财政政策对总需求的影响", "href": "#/chapter/ch34"}, {"label": "第 35 章：通货膨胀与失业之间的短期权衡取舍", "href": "#/chapter/ch35"}, {"label": "第 36 章：宏观经济政策的六个争论问题", "href": "#/chapter/ch36"}]}, {"label": "概念", "children": [{"label": "GDP 与长期增长", "href": "#/concept/m01"}, {"label": "通货膨胀", "href": "#/concept/m02"}, {"label": "货币与银行体系", "href": "#/concept/m03"}, {"label": "利率与可贷资金", "href": "#/concept/m04"}, {"label": "总需求与总供给", "href": "#/concept/m05"}, {"label": "菲利普斯曲线", "href": "#/concept/m06"}, {"label": "开放经济", "href": "#/concept/m07"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 23 章：一国收入的衡量", "href": "#/quiz/ch23"}, {"label": "测验：第 24 章：生活费用的衡量", "href": "#/quiz/ch24"}, {"label": "测验：第 25 章：生产与增长", "href": "#/quiz/ch25"}, {"label": "测验：第 26 章：储蓄、投资和金融体系", "href": "#/quiz/ch26"}, {"label": "测验：第 27 章：金融学的基本工具", "href": "#/quiz/ch27"}, {"label": "测验：第 28 章：失业", "href": "#/quiz/ch28"}, {"label": "测验：第 29 章：货币制度", "href": "#/quiz/ch29"}, {"label": "测验：第 30 章：货币增长与通货膨胀", "href": "#/quiz/ch30"}, {"label": "测验：第 31 章：开放经济的基本概念", "href": "#/quiz/ch31"}, {"label": "测验：第 32 章：开放经济的宏观经济理论", "href": "#/quiz/ch32"}, {"label": "测验：第 33 章：总需求与总供给", "href": "#/quiz/ch33"}, {"label": "测验：第 34 章：货币政策和财政政策对总需求的影响", "href": "#/quiz/ch34"}, {"label": "测验：第 35 章：通货膨胀与失业之间的短期权衡取舍", "href": "#/quiz/ch35"}, {"label": "测验：第 36 章：宏观经济政策的六个争论问题", "href": "#/quiz/ch36"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch23": true, "ch24": true, "ch25": true, "ch26": true, "ch27": true, "ch28": true, "ch29": true, "ch30": true, "ch31": true, "ch32": true, "ch33": true, "ch34": true, "ch35": true, "ch36": true}}};

const CROSS = {"doc1": "<h1>跨书总览：曼昆《经济学原理（第 7 版）》两册学习路线<\/h1>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>微观经济学分册（第 1–22 章）<\/td><td>先建立&quot;价格如何协调资源&quot;的基本模型：供需、弹性、剩余、成本、市场结构。这些是宏观里&quot;总需求为什么向下&quot;&quot;乘数为什么收敛&quot;的前置<\/td><td>能独立分析一个价格干预或税收政策的收益与代价<\/td><\/tr><tr><td>2<\/td><td>宏观经济学分册（第 23–36 章）<\/td><td>在微观的个体决策之上加总：先学测量（GDP、CPI），再分长期（生产率、货币）与短期（AD-AS、政策）两条线<\/td><td>能判断一项货币或财政政策在短期与长期各有什么后果<\/td><\/tr><\/tbody><\/table>\n<p><strong>为什么不是反过来<\/strong>：宏观的总需求曲线、乘数、可贷资金市场，全都建立在&quot;个体按边际决策&quot;&quot;价格传递信号&quot;这些微观结论上。先宏观后微观会出现大量&quot;结论记住了但推不出来&quot;的情况。<\/p>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n<strong>微观<\/strong>：讲单个市场、单个企业、单个消费者的决策与效率；覆盖外部性、垄断、信息不对称等市场失灵，不适合用来理解总量波动。\n<\/li><li>\n<strong>宏观<\/strong>：讲加总之后的产出、物价、就业与国际收支；长于解释趋势与周期，不适合用来分析具体行业的价格与竞争。\n<\/ul>\n<h2>两册的衔接点<\/h2>\n<table><thead><tr><th>微观概念<\/th><th>宏观里长什么样<\/th><th>衔接章节<\/th><\/tr><\/thead><tbody><tr><td>供需均衡<\/td><td>外汇市场、可贷资金市场的均衡<\/td><td>微观 ch04 → 宏观 ch32<\/td><\/tr><tr><td>弹性<\/td><td>税负分摊、政策效果强弱<\/td><td>微观 ch05、ch08 → 宏观 ch34<\/td><\/tr><tr><td>剩余与无谓损失<\/td><td>税收楔子的效率代价、垄断损失<\/td><td>微观 ch07、ch08 → 宏观 ch30（通胀成本）<\/td><\/tr><tr><td>边际成本与边际收益<\/td><td>投资决策（利率与预期回报比较）<\/td><td>微观 ch13、ch14 → 宏观 ch26、ch27<\/td><\/tr><tr><td>机会成本<\/td><td>储蓄与消费的取舍、现值贴现<\/td><td>微观 ch01 → 宏观 ch27<\/td><\/tr><tr><td>要素市场与工资<\/td><td>失业的结构性来源、效率工资<\/td><td>微观 ch18、ch19 → 宏观 ch28<\/td><\/tr><tr><td>信息不对称<\/td><td>保险市场的逆向选择与道德风险<\/td><td>微观 ch22 → 宏观 ch27<\/td><\/tr><\/tbody><\/table>\n<h2>学习节奏建议<\/h2>\n<ul><li>\n每周 4–6 小时：微观每章约 1.5–2.5 小时，宏观每章 1.5–3 小时。\n<\/li><li>\n先按各书学习路径走完，再回看&quot;跨书概念映射表&quot;做交叉复习——同一个概念在两本书里的用法不同，交叉看最能发现理解漏洞。\n<\/li><li>\n每学完一篇（微观 7 篇、宏观 6 篇），做一次该篇的自测汇总；学完整册做&quot;综合检验建议&quot;里的整合题。\n<\/li><li>\n复习节奏：学完当天过一遍抽认卡，第 2 天、第 7 天各再一遍，只过标记&quot;不熟&quot;的。\n<\/ul>\n<h2>总入口<\/h2>\n<p>打开根目录的 <code>index.html<\/code>，顶部切换两本书与跨书总览；每本书的进度独立保存。也可以单独把某一册的 <code>*学习伴侣.html<\/code> 发给别人，它自带全部章节、测验、卡片与术语。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照两册真实 <code>manifest.json<\/code> 生成，章节号与各书章节索引一致。<\/p>\n<table><thead><tr><th>概念<\/th><th>微观分册<\/th><th>宏观分册<\/th><th>口径差异<\/th><\/tr><\/thead><tbody><tr><td>供给与需求<\/td><td>第 4 章（产品市场）、第 5 章（弹性）、第 6 章（价格管制）<\/td><td>第 32 章（外汇市场）、第 26 章（可贷资金）、第 33 章（总需求与总供给）<\/td><td>微观画的是单一商品；宏观画的是&quot;所有商品&quot;的加总，纵轴是物价水平而非某商品价格<\/td><\/tr><tr><td>均衡<\/td><td>第 4 章：Qd = Qs 定价格与数量<\/td><td>第 32、33 章：两个市场同时均衡<\/td><td>微观均衡是局部最优；宏观要考虑利率、汇率的联立<\/td><\/tr><tr><td>弹性<\/td><td>第 5 章：需求/供给价格弹性、收入弹性、交叉弹性<\/td><td>未单列，但第 34 章乘数大小本质上取决于消费对收入的弹性<\/td><td>宏观不单独讲弹性，却处处用到&quot;边际消费倾向&quot;这个类似量<\/td><\/tr><tr><td>剩余与效率<\/td><td>第 7、8、9、10、15 章：消费者剩余、生产者剩余、无谓损失<\/td><td>第 30 章：通胀的成本（用另一套语言讲效率损失）<\/td><td>微观用三角形精确度量；宏观用&quot;皮鞋成本&quot;&quot;菜单成本&quot;定性描述<\/td><\/tr><tr><td>机会成本<\/td><td>第 1、2、13 章：经济利润与会计利润<\/td><td>第 27 章：现值与贴现；第 26 章：储蓄与消费的取舍<\/td><td>微观比较&quot;做这件事 vs 做那件事&quot;；宏观比较&quot;现在消费 vs 未来消费&quot;<\/td><\/tr><tr><td>边际分析<\/td><td>第 13、14 章：MR = MC<\/td><td>第 34 章：支出乘数（每一轮新增支出递减）<\/td><td>微观停在&quot;边际相等&quot;；宏观把每一次边际支出串成无穷级数<\/td><\/tr><tr><td>市场失灵<\/td><td>第 10、11、22 章：外部性、公共物品、信息不对称<\/td><td>第 33 章：需求不足与供给冲击；第 35 章：政策两难<\/td><td>微观的失灵靠制度修补（税、许可证、产权）；宏观的失灵靠总需求管理<\/td><\/tr><tr><td>劳动与工资<\/td><td>第 18、19 章：边际产量值决定工资；补偿性差别<\/td><td>第 28 章：失业的三类来源；最低工资、工会、效率工资<\/td><td>微观讲&quot;工资由什么决定&quot;；宏观讲&quot;为什么有人找不到工作&quot;<\/td><\/tr><tr><td>货币<\/td><td>第 15 章：货币作为计价单位（顺带提及）<\/td><td>第 29、30 章：货币职能、乘数、货币数量论<\/td><td>两册几乎不重叠：微观不管货币总量，宏观不管单个市场价格<\/td><\/tr><tr><td>利率<\/td><td>第 21 章：利率影响储蓄决策（消费者选择的应用）<\/td><td>第 24、26、34 章：名义与实际利率、可贷资金、流动性偏好<\/td><td>微观把利率当成一种价格；宏观把利率当成政策变量与传导枢纽<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<ul><li>\n先在某本书学到该概念，再到这张表看另一本书怎么讲同一件事（交叉复习）。\n<\/li><li>\n若两本书口径不同（如&quot;均衡&quot;），先记住各自的适用范围，不要强行合并成一个定义。\n<\/li><li>\n表中标&quot;未单列&quot;的概念，说明它在另一本书里以别的名字出现，别以为没讲到。\n<\/ul>", "doc3": "<h1>综合检验建议<\/h1>\n<h2>跨书整合题<\/h2>\n<h3>题 1：一杯奶茶的宏观传导<\/h3>\n<ul><li>\n涉及：微观第 4、5、13 章；宏观第 24、30、33 章\n<\/li><li>\n要求：假设奶茶原料价格上涨 20%，请完成三段分析：①用微观供需与成本曲线说明单店的价格与产量会怎么变；②说明这个变化在 CPI 里如何体现（奶茶在篮子里占多大权重会影响什么）；③若全行业同时涨价，用 AD-AS 判断这属于需求冲击还是供给冲击，短期与长期的产出、物价各如何。\n<\/li><li>\n评分要点：能区分&quot;沿曲线移动&quot;与&quot;曲线移动&quot;；能说出 CPI 是固定篮子、只反映消费端；能识别这是 SRAS 左移并推出滞胀。\n<\/ul>\n<h3>题 2：一项税收的三层后果<\/h3>\n<ul><li>\n涉及：微观第 6、8、12 章；宏观第 34、36 章\n<\/li><li>\n要求：政府对含糖饮料征每瓶 3 元的税。①用微观的税收楔子算出买者付价、卖者得价、成交量、税收收入与无谓损失（自设供需函数并保持自洽）；②说明税负在厂商与消费者之间如何分摊，取决于什么；③若这笔税收用于给低收入家庭补贴，讨论宏观上的总需求效应与微观上的分配效应，并指出哪一方可能受损。\n<\/li><li>\n评分要点：数字自洽、能画楔子、能说清弹性决定分摊、能区分效率与分配。\n<\/ul>\n<h3>题 3：赤字、利率与汇率的一条链<\/h3>\n<ul><li>\n涉及：宏观第 26、32、34 章；微观第 21 章（储蓄决策）\n<\/li><li>\n要求：政府赤字扩大。①画可贷资金市场说明利率变化；②画外汇市场说明汇率变化；③说明出口企业、进口消费者、借房贷的家庭各自受到什么影响；④讨论&quot;衰退期赤字是否也会同样推高利率&quot;，并给出判断依据。\n<\/li><li>\n评分要点：链条完整（利率→资本净流出→汇率→净出口）；能指出衰退期挤出效应弱；能区分赢家与输家。\n<\/ul>\n<h3>题 4：失业率下降是真的好转吗<\/h3>\n<ul><li>\n涉及：宏观第 28、33、35 章；微观第 18、19 章\n<\/li><li>\n要求：某国失业率从 8% 降到 6%，同时劳动参与率从 62% 降到 59%。①判断这可能是哪种失业在减少、哪种在增加；②用菲利普斯曲线说明如果这是需求扩张带来的，通胀会怎样；③从微观角度说明哪些结构性因素会让失业率长期居高（最低工资、技能错配、效率工资）。\n<\/li><li>\n评分要点：能识破&quot;参与率下降&quot;的假象；能区分周期性与结构性；能给出针对性政策。\n<\/ul>\n<h3>题 5：一项关税的完整账<\/h3>\n<ul><li>\n涉及：微观第 9 章；宏观第 31、32 章\n<\/li><li>\n要求：对进口商品征 20% 关税。①微观：算消费者剩余、生产者剩余、关税收入与无谓损失的变化；②宏观：说明贸易余额是否改善，并解释汇率在其中起的作用；③综合：谁受益、谁受损，为什么&quot;保护了就业&quot;的说法在总量上不成立。\n<\/li><li>\n评分要点：能算两块损失（生产扭曲与消费扭曲）；能用 NX = S − I 说明余额不变；能指出受益者是国内生产者与政府、受损者是消费者与出口部门。\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：读曼昆之后接中级教材（Varian《微观经济学》/ Mankiw 的 intermediate macro 或 Blanchard），重点补一般均衡、IS-LM 与模型推导。\n<\/li><li>\n<strong>偏实证<\/strong>：学计量与因果推断（Angrist &amp; Pischke），把这两册的命题变成可检验的假设：最低工资对就业的影响、货币增长与通胀的关系。\n<\/li><li>\n<strong>偏政策<\/strong>：读各国央行年报与财政白皮书，用本书的框架逐条对照，训练&quot;识别时间尺度—判断冲击类型—评估政策代价&quot;的三步分析。\n<\/li><li>\n<strong>偏数据<\/strong>：用国家统计局与世界银行数据复现人均 GDP、基尼系数、CPI 的计算，把公式落到真实口径上，理解统计误差从哪里来。\n<\/ol>"};

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||FIRST_DOC;
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId===FIRST_DOC){
    pre = '<h1>学习总手册</h1>'
      + '<p>本学习系统把书点化为一套可跟着走的学习内容。顶部切换书籍，或用下方卡片进入；'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
route();
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
