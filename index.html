strong>市场价格<\/strong>。<\/p>\n<p>严格意义上的&quot;完全竞争&quot;是理想型，现实里还有三种偏离：一家独大（垄断，第 15 章）、少数几家（寡头，第 17 章）、很多家但产品各有差别（垄断竞争，第 16 章）。这一章先把最基础的完全竞争讲清楚，后面三种都是拿它当参照系。<\/p>\n<h3>需求<\/h3>\n<p><strong>需求量<\/strong>（quantity demanded）是在某个具体价格下，买者愿意并且能够买到的数量。注意&quot;愿意并且能够&quot;：只有愿望没有支付能力不算需求。<\/p>\n<p><strong>需求法则<\/strong>：其他条件不变时，价格上升，需求量下降。原因很直接——价格贵了，一部分人改用替代品（奶茶贵了喝咖啡），一部分人干脆少买。<\/p>\n<p>把不同价格与对应需求量列成表是<strong>需求表<\/strong>，画成图是<strong>需求曲线<\/strong>。需求曲线通常向右下方倾斜。市场价格是所有买者需求量的水平加总：价格 20 元时甲买 8 杯、乙买 12 杯，市场就是 20 杯。<\/p>\n<p>用一个具体方程演算。设某奶茶市场：<\/p>\n<ul><li>\n需求：Qd = 60 − 2P\n<\/li><li>\n供给：Qs = 2P − 20\n<\/ul>\n<p>先列表感受一下：P = 10 时 Qd = 40，P = 20 时 Qd = 20，P = 30 时 Qd = 0。<\/p>\n<h3>需求曲线的移动（最容易错的地方）<\/h3>\n<p>价格变化让点<strong>沿着<\/strong>曲线滑动，叫<strong>需求量变化<\/strong>。除此之外的因素变化会让整条曲线<strong>平移<\/strong>，叫<strong>需求变化<\/strong>。五个常见因素：<\/p>\n<ol><li>\n<strong>收入<\/strong>。收入增加，正常商品（大多数商品）需求增加、曲线右移；廉价替代品（比如方便面）可能反向，这类叫劣等品。\n<\/li><li>\n<strong>偏好<\/strong>。流行趋势、健康观念变化。\n<\/li><li>\n<strong>替代品与互补品的价格<\/strong>。替代品（奶茶与咖啡）价格上升，本商品需求增加、右移；互补品（奶茶与珍珠）价格上升，本商品需求减少、左移。\n<\/li><li>\n<strong>预期<\/strong>。预期明天涨价，今天多买，右移。\n<\/li><li>\n<strong>买者数量<\/strong>。人口流入，右移。\n<\/ol>\n<h3>供给<\/h3>\n<p><strong>供给量<\/strong>（quantity supplied）是在某个价格下，卖者愿意并且能够卖出的数量。<strong>供给法则<\/strong>：其他条件不变时，价格上升，供给量增加——高价能覆盖更高的成本，也能让边际生产者进场。<\/p>\n<p>让供给曲线整条移动的因素有四个：<strong>投入品价格<\/strong>（牛奶、房租涨，左移）、<strong>技术<\/strong>（新设备提高效率，右移）、<strong>预期<\/strong>（预期涨价先囤货，短期左移）、<strong>卖者数量<\/strong>（新店开张，右移）。<\/p>\n<h3>均衡<\/h3>\n<p><strong>均衡<\/strong>（equilibrium）是供给量恰好等于需求量的状态，对应的价格叫<strong>均衡价格<\/strong>，数量叫<strong>均衡数量<\/strong>。<\/p>\n<p>用上面的方程解：60 − 2P = 2P − 20，得 4P = 80，P<em> = 20，代回 Q<\/em> = 20。<\/p>\n<p>如果市场价高于 20，比如 25：Qd = 10，Qs = 30，多出 20 杯卖不掉，这是<strong>过剩<\/strong>。卖不掉的库存迫使卖者降价，价格回落。如果市场价低于 20，比如 15：Qd = 30，Qs = 10，缺 20 杯，这是<strong>短缺<\/strong>。排队的人愿意加价，价格回升。这两种力量把价格推回均衡。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 4 章示例：奶茶市场<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><line x1=\"223.3\" y1=\"157.6\" x2=\"223.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"223.3\" y1=\"157.6\" x2=\"70.0\" y2=\"157.6\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"235.6\" y=\"146.7\" font-size=\"11.5\" fill=\"#111827\">均衡 E 20 元 20 杯<\/text><text x=\"453.3\" y=\"148.5\" font-size=\"11.5\" fill=\"#111827\">P*=20 元<\/text><text x=\"453.3\" y=\"203.2\" font-size=\"11.5\" fill=\"#111827\">Q*=20 杯<\/text><text x=\"93.0\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">交点即均衡：20 元、20 杯<\/text><\/svg>\n<p>看图说明：两条直线的交点就是均衡。横虚线读到 20 元，竖虚线读到 20 杯。注意蓝线斜率 −1/2（价格每降 1 元，需求量增加 2 杯），红线斜率 +1/2——斜率的大小由方程系数决定，不是随手画的。<\/p>\n<h3>三步分析法<\/h3>\n<p>书上给了一套固定动作，遇到任何冲击都照做：<\/p>\n<ol><li>\n判断这件事影响需求、影响供给，还是两者都影响。\n<\/li><li>\n判断曲线是左移还是右移。\n<\/li><li>\n画出移动前后的两条线，读出均衡价格与数量的变化方向。\n<\/ol>\n<p>例：夏季高温。影响需求（偏好），需求右移。结果：均衡价格上升，均衡数量上升。 例：牛奶涨价。影响供给（投入品价格），供给左移。结果：价格上升，数量下降。 例：同时发生。需求右移 + 供给左移：价格一定上升，数量方向说不准，取决于两者幅度。这一点必须记住——<strong>两条曲线同向变动时，有一个变量是无法确定的<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;需求增加&quot;和&quot;需求量增加&quot;是一回事——实际上前者是整条曲线右移（由价格以外的因素引起），后者是沿曲线滑动（由价格本身引起）。这两个词混用，后面讲弹性、讲税收归宿会全线出错。\n<\/li><li>\n别以为高价一定意味着需求强——实际上价格上升本身会压低需求量。看到&quot;涨价还卖得好&quot;，要找的是曲线右移的原因（收入、偏好、替代品涨价），而不是把价格上涨当成需求增加。\n<\/li><li>\n别以为均衡是&quot;大家都满意的价格&quot;——实际上均衡只保证想买的量等于想卖的量，不保证买者觉得便宜或卖者觉得赚。均衡是机制的结果，不是道德评价。\n<\/li><li>\n别以为供给曲线永远向右上——实际上它反映的是边际成本随产量上升；如果技术进步让成本随规模下降（比如软件），供给曲线可以向下，第 15 章的自然垄断就是这种情况。\n<\/ul>\n<ol><li>\n（单选）奶茶市场的需求为 Qd = 60 − 2P，供给为 Qs = 2P − 20。均衡价格与均衡数量是？\n<p>A. P=15，Q=30  B. P=20，Q=20  C. P=25，Q=10  D. P=10，Q=40 <strong>答案<\/strong>：B；<strong>解析<\/strong>：令 60 − 2P = 2P − 20，得 4P = 80，P = 20；代回任一式得 Q = 20。P=25 时 Qd=10、Qs=30 是过剩，P=15 时是短缺。<\/p>\n<\/ol>\n<ol><li>\n（单选）咖啡豆价格上涨，在其他条件不变的情况下，奶茶市场会出现什么变化？\n<p>A. 奶茶需求曲线右移，价格与数量都上升  B. 奶茶供给曲线左移，价格上升、数量下降  C. 奶茶需求曲线左移，价格与数量都下降  D. 奶茶供给曲线右移，价格下降、数量上升 <strong>答案<\/strong>：A；<strong>解析<\/strong>：咖啡是奶茶的替代品。替代品价格上升，消费者转向奶茶，奶茶需求曲线右移，均衡价格与数量同时上升。注意这不是奶茶成本变化，所以供给不动。<\/p>\n<\/ol>\n<ol><li>\n（单选）某年夏天既流行喝奶茶（需求右移），同时牛奶大幅涨价（供给左移）。可以确定的是？\n<p>A. 价格上涨，数量方向不确定  B. 价格与数量都上涨  C. 价格方向不确定，数量上涨  D. 价格与数量都下降 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求右移推高价格与数量，供给左移推高价格、压低数量。价格方向一致所以确定上涨；数量一增一减，最终取决于两个冲击的幅度，无法确定。<\/p>\n<\/ol>\n<ol><li>\n（填空）「某商品价格从 20 元降到 15 元，其需求量从 20 杯增到 30 杯」，这属于需求量变化还是需求变化？\n<p><strong>答案<\/strong>：需求量变化；<strong>解析<\/strong>：由价格本身引起的变动是沿曲线滑动，叫需求量变化。若收入、偏好、替代品价格等变化，才是整条曲线平移的需求变化。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n需求法则：价格升，需求量降；供给法则：价格升，供给量增。\n<\/li><li>\n沿曲线滑动 = 价格引起；曲线平移 = 收入、偏好、替代品、预期、人数、成本、技术引起。\n<\/li><li>\n解均衡就是令 Qd = Qs；过剩压价、短缺抬价，两个方向都自动回归。\n<\/ul>", "ch05": "<h1>第 5 章：弹性及其应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用中点法算出需求价格弹性，并判断它是富有弹性还是缺乏弹性。\n<\/li><li>\n说明为什么「富有弹性的商品降价能增加总收益」，而「缺乏弹性的商品涨价能增加总收益」。\n<\/li><li>\n用弹性解释三件事：农业技术进步为什么让农民收入下降、OPEC 减产为什么短期有效长期失效、禁毒为什么可能推高相关犯罪。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>弹性衡量「价格动一点，数量动多少」。它决定了冲击的代价落在谁身上：数量反应大，价格就不敢乱动；数量反应小，价格就被推得很远。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么需要弹性<\/h3>\n<p>第 4 章说&quot;价格上升，需求量下降&quot;，但没说降多少。这个&quot;多少&quot;就是<strong>弹性<\/strong>（elasticity）。它是两个百分比之比，不是两个绝对量之比——这一点必须在一开始就固定住，否则后面所有结论都会错位。<\/p>\n<p><strong>需求价格弹性<\/strong> = 需求量变动的百分比 ÷ 价格变动的百分比。<\/p>\n<p>为什么用百分比：这样不同商品、不同单位之间可以比较。苹果涨 1 元和大米涨 1 元，含义完全不同；苹果涨 10% 和大米涨 10%，才可比。<\/p>\n<h3>中点法<\/h3>\n<p>直接算百分比会遇到一个尴尬：从 20 元降到 15 元，按起点算是降 25%；从 15 元涨回 20 元，按起点算是涨 33%。同一个区间，两个方向算出两个弹性。<\/p>\n<p><strong>中点法<\/strong>（midpoint method）用两端平均值作分母，把方向差异消掉：<\/p>\n<ul><li>\n数量变动率 = (Q₂ − Q₁) ÷ [(Q₁ + Q₂)/2]\n<\/li><li>\n价格变动率 = (P₂ − P₁) ÷ [(P₁ + P₂)/2]\n<\/li><li>\n弹性 = 前者 ÷ 后者的绝对值\n<\/ul>\n<p>算一个具体例子。奶茶从 25 元降到 20 元，需求量从 10 杯增到 20 杯：<\/p>\n<ul><li>\n数量变动率 = (20 − 10) ÷ 15 = 10/15 = 66.7%\n<\/li><li>\n价格变动率 = (20 − 25) ÷ 22.5 = −5/22.5 = −22.2%\n<\/li><li>\n弹性 = 66.7 ÷ 22.2 ≈ 3.0\n<\/ul>\n<p>3.0 大于 1，说明在这个区间需求<strong>富有弹性<\/strong>（elastic）：价格降 1%，需求量涨约 3%。<\/p>\n<h3>弹性的五种档位<\/h3>\n<ul><li>\n弹性 &gt; 1：富有弹性，需求曲线比较平。\n<\/li><li>\n弹性 &lt; 1：缺乏弹性，曲线比较陡。\n<\/li><li>\n弹性 = 1：单位弹性，需求量与价格同比例反向变动。\n<\/li><li>\n弹性 = 0：完全无弹性，需求曲线是垂直线，价格怎么变数量都不变（比如救命的胰岛素）。\n<\/li><li>\n弹性 → ∞：完全弹性，需求曲线是水平线，价格高于某一水平就一个也卖不出去。\n<\/ul>\n<h3>什么决定弹性大小<\/h3>\n<p>四个因素，按重要性排：<\/p>\n<ol><li>\n<strong>替代品的可得性<\/strong>。替代品多，涨价就跑，弹性大；替代品少，只能忍，弹性小。这是最主要的决定因素。\n<\/li><li>\n<strong>必需品还是奢侈品<\/strong>。必需品弹性小，奢侈品弹性大。\n<\/li><li>\n<strong>市场定义的宽窄<\/strong>。&quot;水果&quot;的市场定义宽，替代品少，弹性小；&quot;苹果&quot;定义窄，可以换成梨、橙，弹性大。\n<\/li><li>\n<strong>时间长短<\/strong>。时间越长，越能调整习惯、找到替代方案，弹性越大。这一条在第 5 章末尾的 OPEC 案例里是主角。\n<\/ol>\n<h3>弹性与总收益<\/h3>\n<p><strong>总收益<\/strong> TR = P × Q。价格变动时，P 和 Q 朝相反方向走，结果取决于谁变得更多：<\/p>\n<ul><li>\n富有弹性（E &gt; 1）：降价时，Q 增加的比例大于 P 下降的比例，TR 上升。涨价则 TR 下降。\n<\/li><li>\n缺乏弹性（E &lt; 1）：涨价时，Q 减少的比例小于 P 上升的比例，TR 上升。降价则 TR 下降。\n<\/li><li>\n单位弹性：价格变动不改变 TR。\n<\/ul>\n<p>用上面的数字验证：P = 25、Q = 10 时 TR = 250；P = 20、Q = 20 时 TR = 400。降价 5 元，收益多 150 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 5 章示例：总收益 = P × Q<\/text><polygon points=\"70.0,340.0 223.3,340.0 223.3,157.6 70.0,157.6\" fill=\"#ea580c\" fill-opacity=\"0.25\" stroke=\"none\"/><text x=\"146.7\" y=\"248.8\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">TR=400 元<\/text><polygon points=\"70.0,157.6 146.7,157.6 146.7,112.1 70.0,112.1\" fill=\"#16a34a\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"108.3\" y=\"134.9\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">TR=250 元<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"230.3\" y=\"150.6\" font-size=\"11.5\" fill=\"#111827\">P=20, Q=20<\/text><circle cx=\"146.7\" cy=\"112.1\" r=\"4\" fill=\"#111827\"/><text x=\"153.7\" y=\"105.1\" font-size=\"11.5\" fill=\"#111827\">P=25, Q=10<\/text><\/svg>\n<p>看图说明：橙色矩形是降价后 20×20 = 400 元，绿色小矩形是原来的 25×10 = 250 元。降价带来的是&quot;宽度大幅增加、高度小幅减少&quot;，面积净增。这也解释了为什么线性需求曲线的上半段（价格高、弹性大）降价能增收，下半段（弹性小）降价反而减收。<\/p>\n<h3>线性需求曲线上的弹性不是常数<\/h3>\n<p>直线斜率固定，但弹性不是。原因是百分比的分母在变：价格高时基数大，同样的价格变动对应的百分比小，而数量基数小、变动百分比大，所以上半段弹性大；越往下走，弹性越小。<strong>中点处弹性等于 1<\/strong>。这条结论在图形题里经常被考。<\/p>\n<h3>供给弹性<\/h3>\n<p><strong>供给价格弹性<\/strong> = 供给量变动百分比 ÷ 价格变动百分比。它也分富有、缺乏、单位弹性。决定因素主要是<strong>时间<\/strong>：短期内工厂产能固定，供给弹性小；长期可以新建厂房，弹性大。此外还有闲置产能多不多、库存好不好存。<\/p>\n<h3>三个应用<\/h3>\n<p><strong>应用一：农业技术进步。<\/strong> 粮食需求缺乏弹性（人吃饱了就那么多），技术进步让供给右移，价格大幅下跌、数量只小幅增加。结果：消费者受益，农民总收入反而下降。这就是&quot;农业技术进步让农民变穷&quot;的机制——不是产量少了，是价格跌得比数量增得多。它也解释了农业补贴与价格支持政策的由来。<\/p>\n<p><strong>应用二：OPEC 减产。<\/strong> 石油短期需求弹性小（开车、取暖没法立刻改），减产 10% 能让价格涨很多，收入上升。但时间一长，人们换小车、改乘公交、开发替代能源，需求弹性变大，减产的效果被抵消，价格回落。<strong>短期有效、长期失效<\/strong>，这是弹性随时间变大的直接后果。<\/p>\n<p><strong>应用三：禁毒。<\/strong> 加强执法让毒品供给左移，价格上升。由于成瘾者对毒品需求极度缺乏弹性，数量只小幅下降，总支出反而增加（价格涨得多、量降得少）。结果是吸毒者为筹钱可能更多犯罪。结论不是&quot;别禁毒&quot;，而是提醒：只看供给端的政策，在需求缺乏弹性时会产生反效果，所以书里同时讨论教育、治疗等需求端措施。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;弹性大就是曲线陡&quot;——实际上弹性大对应曲线平。斜率和弹性是两回事：斜率是 Δy/Δx，弹性是百分比之比；直线上斜率不变，弹性却在变。\n<\/li><li>\n别以为&quot;涨价一定增加收入&quot;——实际上只在缺乏弹性时成立。对富有弹性的商品，涨价会把顾客赶走，收入下降。\n<\/li><li>\n别以为&quot;农业技术进步对农民是好事&quot;——实际上对全社会是好事（粮食便宜），对农民个体可能意味着收入下降，因为需求缺乏弹性。政策要解决的是分配，不是技术。\n<\/li><li>\n别以为弹性是固定属性——实际上同一商品在不同价格区间、不同时间跨度下弹性不同。\n<\/ul>\n<ol><li>\n（单选）价格从 10 元升到 12 元，需求量从 100 件降到 80 件。用中点法计算的需求价格弹性约为？\n<p>A. 0.55  B. 1.00  C. 1.22  D. 1.80 <strong>答案<\/strong>：C；<strong>解析<\/strong>：数量变动率 = −20 ÷ 90 = −22.2%；价格变动率 = 2 ÷ 11 = 18.2%；弹性 = 22.2 ÷ 18.2 ≈ 1.22，属富有弹性。<\/p>\n<\/ol>\n<ol><li>\n（单选）某商品需求缺乏弹性。若卖者提高价格，总收益会？\n<p>A. 增加  B. 减少  C. 不变  D. 先增后减 <strong>答案<\/strong>：A；<strong>解析<\/strong>：缺乏弹性意味着数量下降的百分比小于价格上升的百分比，P×Q 上升。典型例子是食盐、燃油这类必需品。<\/p>\n<\/ol>\n<ol><li>\n（单选）农业技术进步使粮食供给大幅增加，但农民总收入下降。最直接的原因是？\n<p>A. 粮食需求缺乏弹性，价格下跌幅度大于数量增加幅度  B. 农民没有能力采用新技术  C. 粮食需求富有弹性，价格下跌带来数量大增  D. 政府对粮食征收了更高的税 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求缺乏弹性时，供给右移导致价格大跌而数量只小幅上升，P×Q 下降。消费者得到便宜粮食，农民收入受损，这是分配问题。<\/p>\n<\/ol>\n<ol><li>\n（填空）线性需求曲线上的弹性在中点处等于多少？\n<p><strong>答案<\/strong>：1；<strong>解析<\/strong>：中点处需求量为最大量的一半、价格为最高价的一半，数量与价格的百分比变动幅度相同，弹性为 1。上半段大于 1，下半段小于 1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n弹性 = 数量变动百分比 ÷ 价格变动百分比，用中点法消除方向差异。\n<\/li><li>\nE &gt; 1 降价增收，E &lt; 1 涨价增收；线性需求曲线上半段弹性大、中点 E = 1。\n<\/li><li>\n时间越长弹性越大，这是 OPEC 短期有效、长期失效的根本原因。\n<\/ul>", "ch06": "<h1>第 6 章：供给、需求与政府政策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一项价格管制有没有约束力，并算出它造成的短缺或过剩数量。\n<\/li><li>\n说明向卖者征税和向买者征税为什么结果完全相同。\n<\/li><li>\n用弹性判断税收负担最终落在买者还是卖者身上，并算出各自承担多少。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>价格管制改变的是价格的数值，改变不了供给与需求本身；税收插进来的是买者付的价和卖者得的价之间的一道楔子，楔子怎么分摊由弹性决定，不由法律条文决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>价格上限<\/h3>\n<p><strong>价格上限<\/strong>（price ceiling）是法律规定的最高价格。关键判据只有一条：<strong>只有低于均衡价格的上限才有约束力<\/strong>。高于均衡的上限等于没规定，市场自己会走到更低的均衡价。<\/p>\n<p>用第 4 章的奶茶市场：Qd = 60 − 2P，Qs = 2P − 20，均衡 20 元、20 杯。政府规定最高 15 元：<\/p>\n<ul><li>\nQd = 60 − 30 = 30 杯\n<\/li><li>\nQs = 30 − 20 = 10 杯\n<\/li><li>\n短缺 20 杯\n<\/ul>\n<p>短缺意味着必须用价格以外的办法分配。排队、抽签、凭关系、按身份证限量——这些叫<strong>配给机制<\/strong>。它们不是免费的：排队浪费时间，凭关系滋生寻租。书里用租金控制作为长期案例：短期房源固定，短缺有限；长期房东不维护、不再新建，房源减少，短缺扩大，房屋质量下降。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 6 章示例：奶茶价格上限 15 元<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><polyline points=\"70.0,203.2 530.0,203.2\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"472.7\" y=\"199.2\" font-size=\"12\" fill=\"#6b7280\" font-weight=\"600\">价格上限<\/text><line x1=\"300.0\" y1=\"203.2\" x2=\"300.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"307.0\" y=\"196.2\" font-size=\"11.5\" fill=\"#111827\">Qd=30<\/text><line x1=\"146.7\" y1=\"203.2\" x2=\"146.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"153.7\" y=\"196.2\" font-size=\"11.5\" fill=\"#111827\">Qs=10<\/text><text x=\"192.7\" y=\"226.9\" font-size=\"11.5\" fill=\"#dc2626\">短缺 20 杯<\/text><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#dc2626\"/><\/marker><\/defs><line x1=\"154.3\" y1=\"218.7\" x2=\"292.3\" y2=\"218.7\" stroke=\"#dc2626\" stroke-width=\"1.8\" marker-end=\"url(#ar)\"/><\/svg>\n<p>看图说明：上限画在 15 元，与两条曲线各交于一点，两点之间的水平距离就是短缺。注意这条线只要往下移，短缺就变长——上限越低，缺得越多。<\/p>\n<h3>价格下限<\/h3>\n<p><strong>价格下限<\/strong>（price floor）是法律规定的最低价格。判据对称：<strong>只有高于均衡的下限才有约束力<\/strong>。<\/p>\n<p>把下限设在 25 元：Qd = 10，Qs = 30，过剩 20 杯。卖不掉的部分怎么办？现实中常见的是政府收购（农产品价格支持）或者限制产量（配额）。最低工资是劳动市场的价格下限，第 28 章会专门讨论它为什么会增加失业，以及为什么影响集中在青年和低技能群体。<\/p>\n<h3>税收：向谁收都一样<\/h3>\n<p>这是本章最反直觉的结论，必须自己算一遍才信。<\/p>\n<p><strong>向卖者征税<\/strong>：每卖一杯交 6 元。卖者实际拿到的是&quot;买者付的价格减 6 元&quot;，所以他要的价格必须更高才愿意卖同样的量。供给曲线向上平移 6 元：新的供给 Qs′ = 2(P − 6) − 20 = 2P − 32。 均衡：60 − 2P = 2P − 32 → 4P = 92 → P = 23 元，Q = 14 杯。<\/p>\n<p>买者付 23 元（比原来多 3 元），卖者拿到 23 − 6 = 17 元（比原来少 3 元）。政府收 6×14 = 84 元。<\/p>\n<p><strong>向买者征税<\/strong>：每买一杯交 6 元。买者实际付出的总代价是&quot;标价 + 6 元&quot;，所以需求曲线向下平移 6 元：Qd′ = 60 − 2(P + 6) = 48 − 2P。 均衡：48 − 2P = 2P − 20 → 4P = 68 → P = 17 元，Q = 14 杯。<\/p>\n<p>标价变成 17 元，买者实际付 17 + 6 = 23 元，卖者拿到 17 元。数量也是 14 杯。<\/p>\n<p>两组数字完全一样：买者付 23、卖者得 17、数量 14、税收 84。<strong>法律上规定谁交税，只影响钱经过谁的手，不影响谁真正承担。<\/strong>真正承担的部分叫<strong>税收归宿<\/strong>（tax incidence）。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">向卖者征 6 元税：价格楔子<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">原供给 S<\/text><polyline points=\"70.0,194.1 177.3,130.3 223.3,102.9\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"235.0\" y=\"93.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">税后供给 S′<\/text><line x1=\"177.3\" y1=\"130.3\" x2=\"70.0\" y2=\"130.3\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"130.3\" x2=\"177.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"188.1\" y=\"115.7\" font-size=\"11.5\" fill=\"#111827\">买者付 23 元<\/text><text x=\"188.1\" y=\"201.4\" font-size=\"11.5\" fill=\"#111827\">卖者得 17 元<\/text><text x=\"188.1\" y=\"217.8\" font-size=\"11.5\" fill=\"#6b7280\">数量 14<\/text><text x=\"77.7\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">楔子 6 元：买者多付、卖者少得<\/text><\/svg>\n<p>看图说明：绿线是税后的供给曲线，它与需求曲线的交点对应买者价格 23 元；同一交易量在原来红线上对应的价格是卖者到手的 17 元。两条线之间的垂直距离就是税额。<\/p>\n<h3>归宿由弹性决定<\/h3>\n<p>规律：<strong>税收落在弹性小的一方身上<\/strong>。谁更难逃，谁承担更多。<\/p>\n<p>理由很直白。买者弹性大（随时可以不买），卖者一涨价他就跑，卖者只能自己吞下大部分税；卖者弹性大（随时可以转产），买者一压价他就不供货，买者只能自己承担。<\/p>\n<p>一个极端例子：需求完全无弹性（垂直线，比如胰岛素）。税全部由买者承担，价格涨满 6 元，数量一点不减。另一个极端：供给完全无弹性（垂直线，比如土地）。税全部由卖者承担，价格不变。<\/p>\n<p>算一个分摊比例的例子。设需求 Qd = 60 − 2P（斜率绝对值 2），供给 Qs = 2P − 20（斜率 2），两者弹性相等，税 6 元各承担 3 元——上面的数字正是这种对称情形。<\/p>\n<h3>两个真实案例<\/h3>\n<p><strong>工薪税。<\/strong> 美国法律规定社会保障税由雇主和雇员各付一半。但经济学家的测算显示，雇员的实际工资会因雇主那部分而下降，所以<strong>雇员最终承担的部分超过法律写的那一半<\/strong>。法律条文改不了归宿。<\/p>\n<p><strong>奢侈品税。<\/strong> 1990 年美国对游艇、私人飞机等征收 10% 的奢侈品税，目标是&quot;让富人出钱&quot;。结果富人可以不买新游艇（弹性大），而造船工人没法转行（劳动供给弹性小）。税收收入远低于预期，政府次年就取消了这项税，失业的造船工人成了实际承担者。这个案例的教训是：<strong>瞄准&quot;富人&quot;的税，最终可能落在为富人服务的人身上<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;规定价格就能改变市场结果&quot;——实际上管住价格只会制造短缺或过剩，交易量由较短的曲线决定，不由政府决定。\n<\/li><li>\n别以为&quot;向企业征税就是企业出钱&quot;——实际上企业会把税转嫁给买者或工人，转嫁多少看各方弹性。\n<\/li><li>\n别以为价格管制&quot;保护穷人&quot;就一定是好政策——实际上租金控制长期会减少房源、降低质量，受损最重的常常是原本要保护的人。政策要区分短期效果和长期效果。\n<\/li><li>\n别以为税收只造成&quot;钱从一方转到另一方&quot;——实际上它还会减少交易量，消失的那部分交易价值谁也不到，第 8 章会把它命名为无谓损失。\n<\/ul>\n<ol><li>\n（单选）奶茶市场 Qd = 60 − 2P，Qs = 2P − 20。政府规定最高价 15 元，会出现什么？\n<p>A. 过剩 20 杯  B. 短缺 20 杯  C. 短缺 30 杯  D. 没有影响，市场仍均衡 <strong>答案<\/strong>：B；<strong>解析<\/strong>：P=15 时 Qd=30、Qs=10，短缺 20 杯。因为 15 元低于均衡价 20 元，上限有约束力。<\/p>\n<\/ol>\n<ol><li>\n（单选）对每杯奶茶向卖者征 6 元税，均衡数量从 20 杯降到 14 杯。政府税收收入是多少？\n<p>A. 120 元  B. 84 元  C. 18 元  D. 6 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：税收收入 = 税额 × 税后交易量 = 6 × 14 = 84 元。注意不是用税前数量算的，交易量已经下降。<\/p>\n<\/ol>\n<ol><li>\n（单选）某商品需求完全无弹性、供给弹性正常。对它征税，税负主要由谁承担？\n<p>A. 买者全部承担  B. 卖者全部承担  C. 双方各半  D. 由政府承担 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求完全无弹性意味着买者不论价格多高都买同样的量，卖者可以把税全部转嫁给买者，价格涨满税额而数量不变。<\/p>\n<\/ol>\n<ol><li>\n（填空）法律上规定由雇主缴纳的工薪税，最终由谁承担，取决于什么？（一个词）\n<p><strong>答案<\/strong>：弹性；<strong>解析<\/strong>：税收归宿由供需双方的相对弹性决定，法律只决定钱走谁的账。劳动供给弹性小、需求弹性相对大时，雇员的实际工资会下降，等于雇员承担了大部分。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n价格上限只有低于均衡才有约束力（造成短缺）；价格下限只有高于均衡才有约束力（造成过剩）。\n<\/li><li>\n向卖者征税与向买者征税结果相同：买者价格上升、卖者价格下降、交易量减少。\n<\/li><li>\n税收归宿看弹性：弹性小的一方承担更多；弹性相等则各承担一半。\n<\/ul>", "ch07": "<h1>第 7 章：消费者、生产者与市场效率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、5、6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用支付意愿和需求曲线算出消费者剩余，用成本和供给曲线算出生产者剩余。\n<\/li><li>\n解释为什么均衡数量使总剩余最大，并能指出「多生产一单位」和「少生产一单位」各自损失多少。\n<\/li><li>\n说出市场效率结论成立的两个前提，以及它们被破坏时会发生什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>市场均衡之所以被称为&quot;有效率&quot;，是因为它正好停在&quot;最后一单位对买者的价值 = 对卖者的成本&quot;这一点上；越过这一点，不管多还是少，总剩余都会减少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>消费者剩余<\/h3>\n<p><strong>支付意愿<\/strong>（willingness to pay）是一个买者为某物最多愿意付的钱。它因人而异：同样一杯奶茶，甲愿意出 30 元，乙只愿意出 15 元。<\/p>\n<p><strong>消费者剩余<\/strong>（consumer surplus）= 支付意愿 − 实际支付。甲若花 20 元买到，剩余 10 元；乙若花 20 元就不买（因为他的支付意愿只有 15）。<\/p>\n<p>把所有人的支付意愿按从高到低排起来，就得到需求曲线。所以<strong>消费者剩余在图上就是需求曲线以下、价格线以上的那块面积<\/strong>。<\/p>\n<p>算一下第 4 章的奶茶市场：Qd = 60 − 2P，均衡价 20 元、数量 20 杯。需求曲线在 Q = 0 时对应价格 30 元（这是最高支付意愿）。消费者剩余是一个三角形：<\/p>\n<ul><li>\n底 = 20 杯\n<\/li><li>\n高 = 30 − 20 = 10 元\n<\/li><li>\n面积 = ½ × 20 × 10 = 100 元\n<\/ul>\n<p>这 100 元不是&quot;消费者赚了 100 元现金&quot;，而是&quot;他们本来愿意多付 100 元，实际没付&quot;。它是福利，不是货币。<\/p>\n<p>价格下降会增加消费者剩余，来源有两块：一是原来那些买者少付了钱；二是原本嫌贵不买的人现在进场了，他们也获得了剩余。<\/p>\n<h3>生产者剩余<\/h3>\n<p><strong>成本<\/strong>是卖者生产一单位的最低可接受价格。<strong>生产者剩余<\/strong>（producer surplus）= 实际得到 − 成本。<strong>在图上就是价格线以下、供给曲线以上的面积<\/strong>。<\/p>\n<p>同一市场：供给曲线在 Q = 0 时对应 10 元（最低成本）。生产者剩余：<\/p>\n<ul><li>\n底 20 杯，高 20 − 10 = 10 元\n<\/li><li>\n面积 = ½ × 20 × 10 = 100 元\n<\/ul>\n<p>价格上升会增加生产者剩余，也是两块：原有卖者多收钱，成本较高的新卖者进场也赚到。<\/p>\n<h3>总剩余与市场效率<\/h3>\n<p><strong>总剩余 = 消费者剩余 + 生产者剩余<\/strong>。这个市场是 100 + 100 = 200 元。<\/p>\n<p><strong>效率<\/strong>的含义：在给定资源下把总剩余做到最大。判断一个数量是否有有效率，只要看一件事——<strong>这一单位对买者的价值是否高于对卖者的成本<\/strong>。<\/p>\n<ul><li>\n若数量少于 20 杯：想买的人里有人的支付意愿高于成本，却没买到，这部分价值白白丢掉。少一单位就少一份剩余。\n<\/li><li>\n若数量多于 20 杯：多出来的那些杯，成本高于买者的支付意愿，生产它们等于把资源变成更不值钱的东西。多一单位就亏一份。\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 7 章示例：总剩余最大<\/text><polygon points=\"70.0,157.6 223.3,157.6 70.0,66.5\" fill=\"#2563eb\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"121.1\" y=\"127.3\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">消费者剩余<\/text><polygon points=\"70.0,248.8 223.3,157.6 70.0,157.6\" fill=\"#dc2626\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"121.1\" y=\"188.0\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">生产者剩余<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"230.3\" y=\"150.6\" font-size=\"11.5\" fill=\"#111827\">均衡<\/text><line x1=\"223.3\" y1=\"157.6\" x2=\"70.0\" y2=\"157.6\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><\/svg>\n<p>看图说明：两个三角形拼成一个&quot;福利三角&quot;。均衡点正好是两块的公共顶点，任何向左右偏移都会让总剩余缩小。这就是&quot;均衡最大化总剩余&quot;的图形含义。<\/p>\n<h3>一个反直觉的推论<\/h3>\n<p>均衡最大化的是<strong>总剩余<\/strong>，不是&quot;每个人都满意&quot;。均衡价格可能让某些买者觉得贵、某些卖者觉得亏，但只要交易是自愿的，双方各自都认为划算。分配问题和效率问题是两件事，第 12、20 章处理分配。<\/p>\n<h3>市场失灵<\/h3>\n<p>效率结论有两个隐含前提：市场是完全竞争的，且交易不影响第三方。破坏它们就出现<strong>市场失灵<\/strong>（market failure）：<\/p>\n<ol><li>\n<strong>市场势力<\/strong>：一家企业能操纵价格，它会少卖、抬价，交易量低于 20 杯，总剩余减少（第 15 章）。\n<\/li><li>\n<strong>外部性<\/strong>：交易给旁观者带来成本或好处，价格没算这笔账，交易量偏离最优（第 10 章）。\n<\/ol>\n<p>这两个词是后面十几章的总线索。看到&quot;为什么市场结果不好&quot;，先问：是势力问题，还是外部性问题。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：拍卖。<\/strong> 十个人竞拍同一件东西，出价从高到低排成一条线。成交价定在第十个人的出价时，前九个都&quot;赚了&quot;——他们本愿意多付。这九个的&quot;赚&quot;加起来就是消费者剩余。类比的失效边界：拍卖里出价是显示出来的，真实市场里支付意愿藏在心里，经济学家只能靠需求曲线推断，所以算出来的剩余是估计值。<\/p>\n<p><strong>实例：涨价与剩余的再分配。<\/strong> 同一个奶茶市场，价格从 20 元涨到 25 元：<\/p>\n<ul><li>\n数量降到 10 杯，消费者剩余 = ½ × 10 × (30 − 25) = 25 元，比原来的 100 元少了 75 元。\n<\/li><li>\n生产者剩余 = ½ × 10 × (25 − 10) = 75 元，比原来的 100 元少了 25 元。\n<\/ul>\n<p>两边都少了：总剩余从 200 元降到 100 元，蒸发掉的 100 元正是&quot;交易量从 20 杯缩到 10 杯&quot;那十杯本来能创造的价值。这也说明涨价不必然让卖者更赚——买者跑掉足够多时，卖者的剩余一样缩水。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为消费者剩余是&quot;消费者实际省下的钱&quot;——实际上它是心理上的福利度量，包含&quot;本来愿意多付的部分&quot;，不能当现金花。\n<\/li><li>\n别以为均衡一定公平——实际上均衡只保证效率，不保证分配合理。政府干预常是为了分配，代价可能是效率。\n<\/li><li>\n别以为&quot;多生产总是好事&quot;——实际上超过均衡数量后，每多生产一单位都在毁灭价值，因为成本高于买者的支付意愿。\n<\/li><li>\n别以为效率等于&quot;总钱数最多&quot;——实际上总剩余衡量的是价值，不是货币收入；它把买卖双方的福利加在一起，不区分谁拿得多。\n<\/ul>\n<ol><li>\n（单选）奶茶市场均衡价 20 元、数量 20 杯，最高支付意愿为 30 元。消费者剩余是多少？\n<p>A. 200 元  B. 100 元  C. 50 元  D. 20 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：消费者剩余是需求曲线以下、价格线以上的三角形面积：底 20 杯、高 30−20=10 元，½×20×10=100 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）为什么均衡数量使总剩余最大？\n<p>A. 因为均衡时买卖双方人数相等  B. 因为均衡时最后一单位对买者的价值恰好等于对卖者的成本  C. 因为均衡价格最低  D. 因为均衡时所有人都满意 <strong>答案<\/strong>：B；<strong>解析<\/strong>：数量小于均衡时，有支付意愿高于成本的交易没发生；数量大于均衡时，成本高于支付意愿的交易发生了。只有均衡点上，每一笔成交都创造价值、且没有遗漏，总剩余最大。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列哪些属于市场失灵，会使均衡偏离总剩余最大？\n<p>A. 某行业由一家企业垄断并压低产量抬高价格  B. 工厂排污让下游居民承担成本  C. 消费者偏好发生变化导致需求曲线平移  D. 政府对某商品征收消费税 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：市场势力与外部性是本章定义的两类市场失灵。偏好变化只是需求移动，市场仍会走到新的均衡并最大化剩余；征税会减少剩余，但那属于政策干预的结果，不是市场自身的失灵。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n消费者剩余 = 需求曲线以下、价格线以上的面积；生产者剩余 = 价格线以下、供给曲线以上的面积。\n<\/li><li>\n均衡最大化总剩余，理由是最后一单位的价值等于成本。\n<\/li><li>\n市场失灵的两个来源：市场势力与外部性。\n<\/ul>", "ch08": "<h1>第 8 章：应用：赋税的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「两个三角形」的几何方法算出无谓损失，并说明它为什么不是任何人的收入。\n<\/li><li>\n判断两种税哪一种无谓损失更大，依据是弹性大小与税额大小。\n<\/li><li>\n解释拉弗曲线的形状，以及为什么&quot;降低税率可能增加税收&quot;只在特定区间成立。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>税收拿走了两笔东西：一笔是钱，从买者和卖者转到政府手里；另一笔是交易，被税楔子挤掉的那些交易本来能创造的价值，直接消失，谁也拿不到——这就是无谓损失。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从上一章的图接着算<\/h3>\n<p>第 6 章的奶茶市场：Qd = 60 − 2P，Qs = 2P − 20，均衡 20 元、20 杯。征 6 元税后，数量降到 14 杯。<\/p>\n<p>税后福利怎么变：<\/p>\n<ul><li>\n消费者剩余：从 100 元降到（½ × 14 × (30 − 23)）= 49 元\n<\/li><li>\n生产者剩余：从 100 元降到（½ × 14 × (17 − 10)）= 49 元\n<\/li><li>\n政府税收收入：6 × 14 = 84 元\n<\/ul>\n<p>三块加起来：49 + 49 + 84 = 182 元。<\/p>\n<p>税前总剩余是 200 元。少了 18 元。<\/p>\n<p>这 18 元去了哪？没有去哪。它对应的是第 15 到第 20 杯之间的交易——这些交易对买者的价值高于对卖者的成本，本来应该发生，被税挡住了。买者少得了价值、卖者少赚了钱、政府也没收到这部分税。这种&quot;因为交易没发生而凭空消失的价值&quot;，就是<strong>无谓损失<\/strong>（deadweight loss）。<\/p>\n<p>几何上，它就是供给曲线、需求曲线和两条虚线围成的三角形：<\/p>\n<ul><li>\n底（垂直方向）= 税额 6 元\n<\/li><li>\n高（水平方向）= 减少的数量 6 杯\n<\/li><li>\n面积 = ½ × 6 × 6 = 18 元\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 8 章示例：6 元税的无谓损失<\/text><polygon points=\"177.3,130.3 177.3,185.0 223.3,157.6\" fill=\"#ea580c\" fill-opacity=\"0.50\" stroke=\"none\"/><polygon points=\"70.0,185.0 177.3,185.0 177.3,130.3 70.0,130.3\" fill=\"#6b7280\" fill-opacity=\"0.22\" stroke=\"none\"/><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><polyline points=\"70.0,194.1 177.3,130.3 223.3,102.9\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"235.0\" y=\"93.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">税后供给 S′<\/text><line x1=\"177.3\" y1=\"130.3\" x2=\"70.0\" y2=\"130.3\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"218.3\" y1=\"152.6\" x2=\"228.3\" y2=\"162.6\" stroke=\"#111827\" stroke-width=\"2\"/><line x1=\"218.3\" y1=\"162.6\" x2=\"228.3\" y2=\"152.6\" stroke=\"#111827\" stroke-width=\"2\"/><text x=\"77.7\" y=\"115.7\" font-size=\"11.5\" fill=\"#111827\">税收收入 84<\/text><text x=\"234.1\" y=\"135.8\" font-size=\"11.5\" fill=\"#111827\">无谓损失 18<\/text><text x=\"151.3\" y=\"119.4\" font-size=\"11.5\" fill=\"#111827\">买者付 23<\/text><text x=\"151.3\" y=\"181.4\" font-size=\"11.5\" fill=\"#111827\">卖者得 17<\/text><text x=\"77.7\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">交易量 20 → 14 杯<\/text><\/svg>\n<p>看图说明：灰色矩形是税收收入（84 元），橙色三角形是无谓损失（18 元）。矩形是从私人部门转移到政府，三角形是净损失。判断一项税收政策好坏，要同时看这两个形状的相对大小。<\/p>\n<h3>为什么无谓损失不是&quot;损失给政府&quot;<\/h3>\n<p>常见误解是&quot;税都被政府拿走了，所以只是转移&quot;。不对。政府拿走的是矩形那部分，确实是转移。三角形那部分是<strong>交易根本没发生<\/strong>，谁也没得到。它的本质是资源没被使用，而不是财富被没收。<\/p>\n<h3>决定无谓损失大小的两个因素<\/h3>\n<ol><li>\n<strong>弹性<\/strong>。弹性越大，同样的税会挤出越多的交易，三角形越大。极端情形：需求或供给完全无弹性（垂直线），数量不变，无谓损失为零——但此时税负全部由弹性小的一方承担。\n<\/li><li>\n<strong>税额<\/strong>。税额越大，三角形的底和高同时变大，所以无谓损失按税额的<strong>平方<\/strong>增长。税翻倍，无谓损失约变成四倍。\n<\/ol>\n<p>第 2 条是政策设计里最有用的结论：<strong>小额税几乎不伤效率，大额税会急剧伤害效率<\/strong>。所以同样是收 100 亿元税，宽税基、低税率的组合比窄税基、高税率的组合效率损失小得多。<\/p>\n<h3>税收收入与拉弗曲线<\/h3>\n<p>政府税收 = 税额 × 税后交易量。税额上升时，前一个因子增大、后一个因子减小，两者方向相反。<\/p>\n<ul><li>\n税额从零开始增加：数量减少得还不多，收入上升。\n<\/li><li>\n税额继续增加：数量掉得越来越快，收入增长放缓。\n<\/li><li>\n税额高到一定程度：税率再提，数量暴跌，收入反而下降。\n<\/li><li>\n税额等于或超过买者的最高支付意愿：没人买，收入为零。\n<\/ul>\n<p>把&quot;税额&quot;和&quot;税收收入&quot;画成一条曲线，就是一个倒 U 形，叫<strong>拉弗曲线<\/strong>（Laffer curve）。它说明存在一个使收入最大的税率点。<\/p>\n<p>第 8 章只建立这个几何关系，不主张&quot;减税一定增收&quot;。要判断当前税率在峰的左边还是右边，需要知道具体的弹性数值，而这在现实中很难测准。第 12 章讨论税制设计时会再谈这个问题的政策含义。<\/p>\n<h3>一个必须区分的对比<\/h3>\n<table><thead><tr><th>项目<\/th><th>随税额增加如何变化<\/th><\/tr><\/thead><tbody><tr><td>税收收入<\/td><td>先增后减，倒 U 形<\/td><\/tr><tr><td>无谓损失<\/td><td>持续增，按平方增长<\/td><\/tr><tr><td>交易量<\/td><td>持续减<\/td><\/tr><tr><td>买者价格<\/td><td>持续升<\/td><\/tr><tr><td>卖者价格<\/td><td>持续降<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的骨架。考试里问&quot;税额翻倍，收入和无谓损失各变成多少&quot;，答案通常不是&quot;都翻倍&quot;——收入可能只增加一点甚至下降，无谓损失约翻四倍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：门票涨价。<\/strong> 景区门票从 50 元涨到 100 元，收入未必增加。涨价带来的每位游客多付 50 元，可能被&quot;少来了一半游客&quot;抵消。涨到极高时，景区空无一人，收入归零。这条曲线和拉弗曲线同构。类比的失效边界：景区可以限制人数从而维持高价，税收没有这种配额手段；而且游客可以选择别的景区（替代品），税收的替代品是&quot;不交易&quot;，两者弹性机制不完全一样。<\/p>\n<p><strong>实例：两种税的比较。<\/strong> A 商品需求弹性 0.2（如食盐），B 商品需求弹性 2.0（如进口香水）。两者都征 10% 的税，税基相同。A 的交易量几乎不变，无谓损失小；B 的交易量大幅下降，无谓损失大。所以从效率角度，宽税基、低税率的消费税优于对少数高弹性商品征重税。第 12 章讲&quot;税制设计&quot;时会把这个结论展开。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;税只是把钱从私人手里转到政府手里&quot;——实际上被挤掉的交易价值是净损失，谁也没拿到。\n<\/li><li>\n别以为&quot;无谓损失与税额成正比&quot;——实际上它大致与税额的平方成正比。\n<\/li><li>\n别以为&quot;提高税率一定能增加税收&quot;——实际上超过某个点后收入会下降，具体在哪一点取决于弹性。\n<\/li><li>\n别以为&quot;无谓损失为零就是好税&quot;——实际上零无谓损失意味着数量完全不变，此时税负全压在弹性小的一方身上，公平问题可能更严重。\n<\/ul>\n<ol><li>\n（单选）某市场均衡数量 20 件，征 6 元税后数量降到 14 件。无谓损失约为？\n<p>A. 84 元  B. 36 元  C. 18 元  D. 6 元 <strong>答案<\/strong>：C；<strong>解析<\/strong>：无谓损失三角形面积 = ½ × 税额 6 × 减少数量 6 = 18 元。84 元是税收收入，别把两者混淆。<\/p>\n<\/ol>\n<ol><li>\n（单选）若税额从 6 元提高到 12 元（弹性保持不变），无谓损失大致会变成原来的？\n<p>A. 1 倍，即不变  B. 2 倍  C. 4 倍  D. 8 倍 <strong>答案<\/strong>：C；<strong>解析<\/strong>：无谓损失与税额的平方成正比。税额翻倍，三角形底与高同时约翻倍，面积约变四倍。<\/p>\n<\/ol>\n<ol><li>\n（单选）某种商品的供给完全无弹性。对它征税的无谓损失是？\n<p>A. 最大  B. 为零，因为交易量不变  C. 等于税收收入  D. 无法判断 <strong>答案<\/strong>：B；<strong>解析<\/strong>：供给曲线垂直时，征税不会减少交易量，三角形底或高为零，无谓损失为零；但税负全部由卖者承担。<\/p>\n<\/ol>\n<ol><li>\n（填空）描述「税额上升时税收收入先增后减」的那条倒 U 形曲线叫什么？\n<p><strong>答案<\/strong>：拉弗曲线；<strong>解析<\/strong>：拉弗曲线刻画税额与税收收入的关系。税额过高时交易量暴跌，收入反而下降，因此存在使收入最大的税率点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n无谓损失 = ½ × 税额 × 减少的交易量，对应&quot;没发生的那批交易&quot;的价值。\n<\/li><li>\n弹性越大、税额越大，无谓损失越大；税额翻倍约等于无谓损失翻四倍。\n<\/li><li>\n税收收入呈倒 U 形的拉弗曲线；无谓损失则单调上升。\n<\/ul>", "ch09": "<h1>第 9 章：应用：国际贸易<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 3、6、7、8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用世界价格与国内均衡价格的比较，判断一国该出口还是进口某种商品。\n<\/li><li>\n分别算出出口国与进口国的赢家、输家和净福利变化。\n<\/li><li>\n算出关税造成的无谓损失，并评价「国家安全」「幼稚产业」等贸易保护论据。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>贸易把国内价格拉到世界价格：出口让国内价格上升、进口让国内价格下降。两种情况都让总福利增加，但都有一方受损——所以贸易政策真正的难点是分配，不是效率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>谁出口，谁进口<\/h3>\n<p>判断标准只有一条比较：<strong>世界价格 vs 国内均衡价格<\/strong>。<\/p>\n<ul><li>\n世界价格高于国内价格：本国生产便宜，卖到国外更赚，于是出口。\n<\/li><li>\n世界价格低于国内价格：国外生产便宜，买进来更省，于是进口。\n<\/ul>\n<p>背后的道理还是比较优势（第 3 章）：一国在自己机会成本低的产品上出口，在机会成本高的产品上进口。<\/p>\n<h3>出口国的赢家与输家<\/h3>\n<p>设奶茶的国内均衡是 20 元、20 杯。世界价格 25 元（高于国内价），于是开始出口。国内价格被拉到 25 元（否则没人愿意在国内卖），国内产量增加到 30 杯，出口 10 杯。<\/p>\n<ul><li>\n<strong>生产者受益<\/strong>：价格从 20 涨到 25，产量也增加，生产者剩余从 100 元升到 ½×30×(25−10) = 225 元。\n<\/li><li>\n<strong>消费者受损<\/strong>：国内买者要付 25 元，消费者剩余从 100 元降到 ½×10×(30−25) = 25 元。\n<\/li><li>\n<strong>净福利<\/strong>：225 + 25 = 250 元，比封闭时的 200 元多 50 元。\n<\/ul>\n<p>那 50 元是贸易创造的价值，来自&quot;本国把资源用在更擅长的产品上&quot;。<\/p>\n<h3>进口国的赢家与输家<\/h3>\n<p>设世界价格 15 元（低于国内 20 元），开始进口。国内价格降到 15 元，国内产量降到 10 杯，进口 20 杯。<\/p>\n<ul><li>\n<strong>消费者受益<\/strong>：消费者剩余从 100 元升到 ½×30×(30−15) = 225 元。\n<\/li><li>\n<strong>生产者受损<\/strong>：生产者剩余从 100 元降到 ½×10×(15−10) = 25 元。\n<\/li><li>\n<strong>净福利<\/strong>：225 + 25 = 250 元，同样多 50 元。\n<\/ul>\n<p>注意两个方向的结构完全对称：受益方都是&quot;价格变动方向上占优的一方&quot;，受损方都是&quot;被价格变动挤压的一方&quot;。<strong>出口国的消费者受损，进口国的生产者受损<\/strong>。<\/p>\n<h3>关税的账<\/h3>\n<p>对进口商品征 3 元关税，国内价格从 15 元升到 18 元。用同一组方程（Qd = 60 − 2P，Qs = 2P − 20）：<\/p>\n<ul><li>\n国内需求：Qd = 60 − 36 = 24 杯\n<\/li><li>\n国内供给：Qs = 36 − 20 = 16 杯\n<\/li><li>\n进口：8 杯（原来 20 杯）\n<\/ul>\n<p>福利变化：<\/p>\n<ul><li>\n消费者剩余：½ × 24 × (30 − 18) = 144 元（原来 225 元），损失 81 元\n<\/li><li>\n生产者剩余：½ × 16 × (18 − 10) = 64 元（原来 25 元），增加 39 元\n<\/li><li>\n政府关税收入：3 × 8 = 24 元\n<\/ul>\n<p>总福利：144 + 64 + 24 = 232 元，比自由贸易的 250 元少 18 元。<\/p>\n<p>这 18 元分两块，都是无谓损失：<\/p>\n<ol><li>\n<strong>生产效率损失<\/strong>：国内高成本的生产者多生产了 6 杯（从 10 到 16），这 6 杯的成本高于世界价格，资源被用在了效率更低的地方。\n<\/li><li>\n<strong>消费效率损失<\/strong>：消费者少买了 6 杯（从 30 到 24），这些杯对他们的价值高于世界价格，却没买到。\n<\/ol>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 9 章示例：进口国加征 3 元关税<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"81.7\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">国内需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">国内供给 S<\/text><polyline points=\"70.0,203.2 530.0,203.2\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"411.3\" y=\"206.5\" font-size=\"12\" fill=\"#6b7280\" font-weight=\"600\">世界价格 15<\/text><polyline points=\"70.0,175.9 530.0,175.9\" fill=\"none\" stroke=\"#ea580c\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"411.3\" y=\"166.4\" font-size=\"12\" fill=\"#ea580c\" font-weight=\"600\">关税后 18<\/text><line x1=\"146.7\" y1=\"203.2\" x2=\"146.7\" y2=\"340.0\" stroke=\"#6b7280\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"300.0\" y1=\"203.2\" x2=\"300.0\" y2=\"340.0\" stroke=\"#6b7280\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"175.9\" x2=\"192.7\" y2=\"340.0\" stroke=\"#ea580c\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"254.0\" y1=\"175.9\" x2=\"254.0\" y2=\"340.0\" stroke=\"#ea580c\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"154.3\" y=\"216.0\" font-size=\"11.5\" fill=\"#111827\">进口 20 杯<\/text><text x=\"200.3\" y=\"163.1\" font-size=\"11.5\" fill=\"#111827\">进口 8 杯<\/text><text x=\"189.6\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">自由贸易时消费者多买 20 杯，关税后只剩 8 杯<\/text><\/svg>\n<p>看图说明：灰线与橙线之间是关税楔子。两条竖虚线分别标出&quot;国内生产量&quot;和&quot;国内需求量&quot;，两者的水平距离就是进口量。关税越高，两条线越近，进口越少，两块三角形越大。<\/p>\n<h3>四个常见的保护论据<\/h3>\n<ol><li>\n<strong>就业论<\/strong>。进口会冲击进口竞争行业，工人失业。反驳：关税保住了这些岗位，但消费者多付的钱会减少其他行业的就业，净就业未必增加；而且被保护的岗位往往工资更低、效率更差。\n<\/li><li>\n<strong>国家安全论<\/strong>。关键物资（粮食、芯片、能源）不能依赖外国。这一条在特定行业确实成立，问题是它的适用范围容易被无限扩大，任何行业都能说自己是&quot;战略行业&quot;。\n<\/li><li>\n<strong>幼稚产业论<\/strong>。新产业起步阶段需要保护，等成熟后再放开。反驳：保护一旦建立就很难撤销，被保护的企业缺乏改进动力；而且很难判断哪个产业&quot;值得&quot;保护。\n<\/li><li>\n<strong>不公平竞争论<\/strong>。对方有补贴、有倾销，所以要加关税。反驳：对方补贴等于送你便宜货，加关税是让自己买贵；真正该做的是用反补贴、反倾销的规则程序，而不是普遍加税。\n<\/ol>\n<h3>为什么贸易政策常走向保护<\/h3>\n<p>因为<strong>输家集中、赢家分散<\/strong>。进口竞争行业的工人和企业在同一个地区、同一个工会，组织起来游说成本低；受益的消费者有上亿人，每人多得几十元，没人愿意为此上街。政治机制对集中利益的反应远强于对分散利益的反应——这是第 36 章讲政策争论时会再遇到的同一个机制。<\/p>\n<p>经济学界的主流看法是：自由贸易提高总福利，但必须配套<strong>调整援助<\/strong>（失业救济、再培训、搬迁补贴），否则受损者承担了全部成本，政治上就不可持续。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;进口会减少本国就业总量&quot;——实际上进口减少的是某些行业的岗位，同时增加出口行业和其他行业的岗位，总量取决于宏观环境。\n<\/li><li>\n别以为&quot;贸易顺差就是好事&quot;——实际上顺差意味着一国在向外输出资本，长期看是储蓄大于投资的结果，第 31 章会仔细讲。\n<\/li><li>\n别以为&quot;关税由外国出口商支付&quot;——实际上关税由进口国的消费者和国内生产者分担，出口商只在下游价格被压时承担一部分。\n<\/li><li>\n别以为&quot;贸易让所有人受益&quot;——实际上总量增加不等于每个人都增加，受损者需要单独补偿。\n<\/ul>\n<ol><li>\n（单选）某商品国内均衡价 20 元，世界价格 15 元。该国最可能？\n<p>A. 出口该商品，国内价格升到 20 元以上  B. 进口该商品，国内价格降到 15 元  C. 既不进口也不出口  D. 出口该商品，但国内价格不变 <strong>答案<\/strong>：B；<strong>解析<\/strong>：世界价格低于国内均衡价，进口更便宜，国内价格被压到世界价格 15 元，国内产量下降、消费量上升。<\/p>\n<\/ol>\n<ol><li>\n（多选）一国从封闭转向进口自由贸易，下列哪些判断正确？\n<p>A. 消费者剩余增加  B. 国内生产者剩余减少  C. 总福利增加  D. 国内产量增加 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：进口使国内价格下降：消费者受益、生产者受损、总福利增加。国内产量因价格下降而减少，不是增加。<\/p>\n<\/ol>\n<ol><li>\n（单选）进口国对每件商品征 3 元关税，进口量从 20 件降到 8 件。关税造成的无谓损失约为？\n<p>A. 24 元  B. 18 元  C. 12 元  D. 3 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：两块三角形的总面积 = ½ × 3 × 6 + ½ × 3 × 6 = 18 元，对应国内多生产 6 件与消费少买 6 件的效率损失。24 元是关税收入。<\/p>\n<\/ol>\n<ol><li>\n（填空）「新产业需要保护，成熟后再放开」这一贸易保护论据通常被称作什么论？（四字）\n<p><strong>答案<\/strong>：幼稚产业论；<strong>解析<\/strong>：幼稚产业论主张新兴产业在起步阶段需要保护。反驳点是保护难以撤销、企业缺乏改进动力，且难以判断哪些产业值得保护。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n世界价格高于国内价则出口，低于则进口。\n<\/li><li>\n出口国：生产者受益、消费者受损；进口国：消费者受益、生产者受损；两者净福利都增加。\n<\/li><li>\n关税造成两类无谓损失：生产效率损失与消费效率损失。\n<\/ul>", "ch10": "<h1>第 10 章：外部性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个案例是正外部性还是负外部性，并说出社会成本（或社会价值）与私人成本（或私人价值）的差额。\n<\/li><li>\n用图形算出负外部性下市场产量与社会最优产量的差、以及无谓损失。\n<\/li><li>\n比较矫正税与可交易许可证在控制污染上的差别。\n<\/li><li>\n说出科斯定理成立的条件，并解释为什么现实中它常常失效。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部性是价格漏算的一笔账：当事人做决定时没把对别人的影响算进去，于是市场产量偏离了社会最优——负外部性时生产太多，正外部性时生产太少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>外部性是什么<\/h3>\n<p><strong>外部性<\/strong>（externality）是一个人的行为对旁观者福利的影响，而这种影响没有通过价格反映出来。工厂排污，下游居民受损，但水的价格里没有这笔成本；有人打了疫苗，周围人也更安全，但接种者没得到这份好处的报酬。<\/p>\n<p>判断方法很简单：问&quot;这件事的成本或收益，有没有落在做决定的人身上&quot;。没落在，就是外部性。<\/p>\n<h3>负外部性：市场生产太多<\/h3>\n<p>以奶茶店为例。每卖一杯，店里承担原料、人工、房租；但深夜的噪音让楼上住户睡不着，这笔成本由住户承担。假设每杯带来 4 元的噪音成本。<\/p>\n<ul><li>\n<strong>私人成本<\/strong>：店里付的成本，对应原来的供给曲线 S。\n<\/li><li>\n<strong>社会成本<\/strong>：私人成本 + 4 元外部成本，对应 S′，整体向上平移 4 元。\n<\/ul>\n<p>原均衡 20 元、20 杯。社会的角度看，第 20 杯的真实成本是 20 + 4 = 24 元，而买者只愿意付 20 元——这一杯社会是亏的。社会最优在 S′ 与需求的交点：60 − 2P = 2P − 28，得 P = 22、Q = 16。<\/p>\n<p>结论：市场产量 20 杯，社会最优 16 杯，<strong>过量生产 4 杯<\/strong>。这 4 杯的无谓损失 = ½ × 4 × 4 = 8 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 10 章示例：4 元外部成本下的社会最优<\/text><polygon points=\"192.7,169.5 192.7,200.5 223.3,185.0\" fill=\"#ea580c\" fill-opacity=\"0.40\" stroke=\"none\"/><polyline points=\"376.7,262.5 300.0,223.8 223.3,185.0 146.7,146.2 70.0,107.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"81.7\" y=\"119.0\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,262.5 146.7,223.8 223.3,185.0 300.0,146.2\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"258.0\" y=\"131.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">私人成本 S<\/text><polyline points=\"70.0,231.5 131.3,200.5 192.7,169.5 254.0,138.5 300.0,115.2\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"265.7\" y=\"95.8\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">社会成本 S′<\/text><line x1=\"223.3\" y1=\"185.0\" x2=\"223.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"169.5\" x2=\"192.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"223.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"169.5\" x2=\"70.0\" y2=\"169.5\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"231.0\" y=\"175.7\" font-size=\"11.5\" fill=\"#111827\">市场均衡 20 杯<\/text><text x=\"135.9\" y=\"158.7\" font-size=\"11.5\" fill=\"#111827\">社会最优 16 杯<\/text><text x=\"188.1\" y=\"43.9\" font-size=\"11.5\" fill=\"#6b7280\">过量生产 4 杯；每杯 4 元外部成本，无谓损失 8 元<\/text><\/svg>\n<p>看图说明：绿线（社会成本）在红线（私人成本）上方，距离等于外部成本。市场均衡落在蓝线与红线的交点，社会最优落在蓝线与绿线的交点——市场总是偏向&quot;多生产&quot;那一侧。这是负外部性的通用图形。<\/p>\n<h3>正外部性：市场生产太少<\/h3>\n<p>反过来，如果一件事带给旁观者好处而当事人没得到报酬，市场就会做得不够。典型例子：教育（受教育者更有生产能力，社会也减少犯罪、提高公共决策质量）、疫苗、基础研究、修缮历史建筑。<\/p>\n<p>图形上，社会价值曲线在私人需求曲线上方，两条线的交点差出一个&quot;产量缺口&quot;。解决方向是补贴，让私人收益接近社会收益。<\/p>\n<h3>政策工具一：管制<\/h3>\n<p><strong>命令与控制<\/strong>（command-and-control）：直接规定排放上限、要求安装某类设备、禁止某种工艺。优点是效果确定，缺点是不问成本——不管减排一吨要花 100 元还是 10000 元，都按同一标准执行，总成本会很高。<\/p>\n<h3>政策工具二：矫正税<\/h3>\n<p><strong>矫正税<\/strong>（corrective tax，书中译作「排污税」，也称庇古税）：按每单位外部成本征税，把外部成本&quot;内化&quot;进价格。每杯 4 元噪音税，供给曲线正好上移到社会成本线，市场自动走到 16 杯。<\/p>\n<p>它的两个好处：<\/p>\n<ol><li>\n达到最优产量，且是<strong>最低成本<\/strong>的方式——愿意花小钱减排的人先减，减排成本高的人交税。\n<\/li><li>\n政府得到收入，可以用来补偿受损者或降低其他税。\n<\/ol>\n<h3>政策工具三：可交易许可证<\/h3>\n<p>政府先定总量（比如全城每月只允许 100 吨排放），再把许可证发给企业，允许企业之间买卖。<\/p>\n<ul><li>\n想多排的企业买许可证，减排便宜的企业卖许可证——<strong>总量控制 + 市场配置<\/strong>。\n<\/li><li>\n与矫正税的关键差别：<strong>税定价格、量不定；许可证定量、价不定<\/strong>。如果环境临界点很硬（比如总量必须低于某个值），许可证更合适；如果更在意企业成本可预期，税更合适。\n<\/ul>\n<h3>私人解决方法与科斯定理<\/h3>\n<p><strong>科斯定理<\/strong>（Coase theorem）：如果产权界定清楚、交易成本足够低，那么不管产权最初给谁，当事人之间的谈判都能达到有效率的结果。<\/p>\n<p>一个经典例子：牧场主的牛踩坏了农夫的庄稼。如果牧场主有权让牛自由吃草，农夫可以付钱请他减少牛的数量；如果农夫有权要求庄稼不受损，牧场主可以付钱购买&quot;损害权&quot;。两种产权安排下，最终牛的数量都停在同一个有效率水平——产权只决定谁付钱给谁。<\/p>\n<p><strong>为什么现实中常常失效<\/strong>：<\/p>\n<ol><li>\n<strong>交易成本高<\/strong>。涉及成千上万人时，谈判、组织、监督的成本超过收益。\n<\/li><li>\n<strong>产权难以界定<\/strong>。空气、海洋、气候的产权归谁？没法谈。\n<\/li><li>\n<strong>信息不对称与策略行为<\/strong>。各方为了压低价格会隐藏真实成本，谈判可能破裂。\n<\/li><li>\n<strong>搭便车<\/strong>。受益者众多时，没人愿意出头付费。\n<\/ol>\n<p>所以科斯定理的价值不在于&quot;政府不用管&quot;，而在于<strong>指出政府该管什么<\/strong>：产权界定、降低交易成本、以及在交易成本过高时直接介入。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;外部性只指污染&quot;——实际上正外部性同样普遍，教育、疫苗、研发都是。\n<\/li><li>\n别以为&quot;矫正税就是为了收钱&quot;——实际上它的目的是让价格反映真实成本，税收收入只是副产品。\n<\/li><li>\n别以为&quot;科斯定理说市场能自己解决一切&quot;——实际上它有三个严格前提，缺一个就得靠政府或其他制度安排。\n<\/li><li>\n别以为&quot;管制比税更严格所以更好&quot;——实际上管制不问成本，可能用极高的代价换来很小的减排，总福利反而下降。\n<\/ul>\n<ol><li>\n（单选）某工厂每生产一件产品产生 4 元污染成本由居民承担。市场均衡产量 20 件，社会最优 16 件。无谓损失约为？\n<p>A. 16 元  B. 8 元  C. 4 元  D. 0 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：过量生产的 4 件，每件平均的外部成本约 4 元的一部分，三角形面积 = ½×4×4 = 8 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪一项是正外部性的典型例子？\n<p>A. 工厂排放污水  B. 深夜装修扰民  C. 接种疫苗降低周围人感染风险  D. 高峰期地铁拥挤 <strong>答案<\/strong>：C；<strong>解析<\/strong>：接种者承担成本，周围人得到好处且未付费，属于正外部性。其余三项都是负外部性或拥挤成本。<\/p>\n<\/ol>\n<ol><li>\n（单选）矫正税与可交易许可证最核心的差别是？\n<p>A. 矫正税能减少污染，许可证不能  B. 矫正税定价格但总量不定，许可证定总量但价格不定  C. 许可证只适用于国有企业  D. 矫正税只对消费者征收 <strong>答案<\/strong>：B；<strong>解析<\/strong>：税按每单位征，企业自主决定减排多少，总量不确定；许可证先定总量，价格由市场竞价形成。两者都能以最低成本实现减排。<\/p>\n<\/ol>\n<ol><li>\n（多选）科斯定理成立需要哪些条件？\n<p>A. 产权界定清楚  B. 交易成本足够低  C. 当事人数量很少且能谈判  D. 政府先征收矫正税 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：产权清楚、交易成本低、当事人能有效谈判是三个前提。政府征税是科斯定理失效时的替代手段，不是它的前提。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负外部性：社会成本高于私人成本，市场过量生产；正外部性：社会价值高于私人价值，市场生产不足。\n<\/li><li>\n矫正税把外部成本内化；许可证定量不定价，税定价不定量。\n<\/li><li>\n科斯定理的前提：产权清楚、交易成本低、当事人能谈成。\n<\/ul>\n<h2>概念扩展<\/h2>\n<p>这一章的&quot;外部性&quot;是全书出现频率最高的概念之一。第 11 章的公共物品与公共资源、第 12 章的税制、第 33 章之后的环境政策讨论，都在它的延长线上。下一章换个角度：有些物品因为&quot;无法排他&quot;，根本无法靠市场收费。<\/p>", "ch11": "<h1>第 11 章：公共物品和公共资源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 7、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「排他性」和「竞争性」两个维度，把物品分成四类，并各举一例。\n<\/li><li>\n解释公共物品为什么会导致搭便车、市场供给不足。\n<\/li><li>\n说明公地悲剧的机制，以及产权、管制、配额三种解法各自的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有些东西没法收费（无排他性），有些东西一人用就少一份（有竞争性）。这两条属性的组合，决定了市场能不能供给、以及会不会被用光。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个维度，四类物品<\/h3>\n<p><strong>排他性<\/strong>（excludability）：能不能阻止别人使用。能，比如一杯奶茶，不付钱就不给。 <strong>竞争性<\/strong>（rivalry）：一个人用了，是否减少别人可用的量。是，一杯奶茶被喝掉，别人就喝不到。<\/p>\n<p>两个维度交叉出四类：<\/p>\n<table><thead><tr><th><\/th><th>有竞争性<\/th><th>无竞争性<\/th><\/tr><\/thead><tbody><tr><td><strong>有排他性<\/strong><\/td><td>私人物品（奶茶、衣服、汽车）<\/td><td>俱乐部物品（收费站公路、有线电视、会员制球场）<\/td><\/tr><tr><td><strong>无排他性<\/strong><\/td><td>公共资源（公海鱼群、拥堵道路、公共牧场）<\/td><td>公共物品（国防、路灯、基础研究、天气预报）<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的骨架。判断一个东西属于哪类，就问两个问题：能不能拦住不付钱的人？多用一份会不会让别人少一份？<\/p>\n<h3>公共物品：搭便车<\/h3>\n<p><strong>公共物品<\/strong>（public good）既无排他性也无竞争性。国防是典型：不管你有没有交税，都受保护；一个人享受到的保护不会减少别人的保护。<\/p>\n<p>这类物品市场供不好，原因是<strong>搭便车<\/strong>（free rider）：既然不付钱也能用，每个人都会等别人付。结果是谁都不付，总量供给不足甚至为零。<\/p>\n<p>这不是道德问题，是激励结构问题。同一个人，买奶茶会付钱（不付喝不到），修路灯就不愿意付（不付也能照亮）。换成谁都会这么选。<\/p>\n<p><strong>成本—收益分析<\/strong>是政府决定要不要提供公共物品的方法：估算总收益是否大于总成本。难点在于<strong>收益难以量化<\/strong>——一条生命值多少钱、一片风景值多少钱，没有市场价格可参照。书里提到，这类估算常常偏低，因为人们不习惯给非交易的东西定价。<\/p>\n<h3>公共资源：公地悲剧<\/h3>\n<p><strong>公共资源<\/strong>（common resource）无排他性但有竞争性。谁都能用，但用多了就没了。<\/p>\n<p><strong>公地悲剧<\/strong>（tragedy of the commons）的机制：牧场是公共的，每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担。对每个个体来说，多养总是划算的——于是所有人一起把草场吃光。个体理性导致集体灾难。<\/p>\n<p>三个解法：<\/p>\n<ol><li>\n<strong>产权私有化<\/strong>。把草场分给个人，退化成本落到自己头上，行为立刻改变。这是科斯思路的延伸。\n<\/li><li>\n<strong>管制<\/strong>。规定放牧数量上限、禁渔期、捕捞配额。\n<\/li><li>\n<strong>配额可交易<\/strong>。给每人一个配额，允许买卖，让配额流向效率最高的使用者。\n<\/ol>\n<p>现实案例：公海渔业（多个国家的渔船抢捕，鱼类资源崩溃）、城市道路（谁都免费上路，结果堵死，拥堵收费是解法）、国家公园（免费或低价，游客过多导致环境退化）。<\/p>\n<h3>为什么这几个概念值得反复用<\/h3>\n<p>第 10 章讲外部性，说&quot;价格漏算了一笔账&quot;；这一章说&quot;有些东西根本收不了费&quot;。两者合起来，就是市场失灵的完整图景：<\/p>\n<ul><li>\n能收费但有外部性 → 矫正税、许可证。\n<\/li><li>\n收不了费 → 政府供给、产权界定、配额管理。\n<\/ul>\n<p>看到任何一个&quot;市场没解决好的问题&quot;，先判断它属于哪一格，再判断该用哪种工具。这是本书教的思维习惯。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;公共物品等于政府提供的物品&quot;——实际上判断标准是属性，不是提供者。政府也可以提供私人物品（比如公立医院的服务），私人也可以提供公共物品（比如开源软件）。\n<\/li><li>\n别以为&quot;搭便车的人道德差&quot;——实际上这是激励结构决定的，同一个人在不同物品上表现完全不同。要改行为，得改结构。\n<\/li><li>\n别以为&quot;公共资源免费所以是福利&quot;——实际上免费导致过度使用，最终所有人都受损。免费往往是最贵的。\n<\/li><li>\n别以为&quot;公地悲剧只能靠政府&quot;——实际上产权私有化和社区自治（如渔业社区的自我配额）都有效，关键是让成本落到使用者头上。\n<\/ul>\n<ol><li>\n（单选）「拥堵的城市道路」属于哪一类物品？\n<p>A. 私人物品  B. 俱乐部物品  C. 公共资源  D. 公共物品 <strong>答案<\/strong>：C；<strong>解析<\/strong>：任何人都能上路（无排他性），但一个人上路会挤占他人的道路空间（有竞争性），符合公共资源。<\/p>\n<\/ol>\n<ol><li>\n（单选）公共物品市场供给不足的根本原因是？\n<p>A. 生产成本太高  B. 无排他性导致搭便车，没人愿意付费  C. 政府不允许私人提供  D. 消费者需求量太小 <strong>答案<\/strong>：B；<strong>解析<\/strong>：公共物品不付钱也能用，每个人都指望别人付费，于是自愿支付不足，市场供给低于社会需要的水平。<\/p>\n<\/ol>\n<ol><li>\n（填空）「每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担」导致草场被吃光，这种现象叫什么悲剧？\n<p><strong>答案<\/strong>：公地悲剧；<strong>解析<\/strong>：公地悲剧指公共资源因无排他性而被过度使用：个体理性地多取用，集体承担退化成本，最终资源枯竭。<\/p>\n<\/ol>\n<ol><li>\n（多选）解决公地悲剧的可行办法包括？\n<p>A. 把资源产权私有化  B. 规定使用上限并管制  C. 发放可交易的配额  D. 完全免费开放并依靠使用者自觉 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：产权私有化让成本内化，管制限制总量，可交易配额让配额流向效率最高者。完全免费开放正是悲剧的成因。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类物品由排他性与竞争性交叉决定：私人物品、俱乐部物品、公共资源、公共物品。\n<\/li><li>\n公共物品的问题是无排他性导致搭便车、供给不足。\n<\/li><li>\n公共资源的问题是有竞争性导致过度使用、公地悲剧；解法是产权、管制、可交易配额。\n<\/ul>", "ch12": "<h1>第 12 章：税制的设计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 6、8、9、11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出政府主要税种及其税基，并区分比例税、累进税、累退税。\n<\/li><li>\n用边际税率与平均税率的差别，解释「为什么高边际税率会抑制工作」。\n<\/li><li>\n用受益原则与支付能力原则评价一项税改，并指出两种原则在具体问题上会给出相反结论。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>税制设计在效率与平等之间做取舍：效率要求税不扭曲行为、管理成本低，平等要求按能力负担；两个目标都要，就必然在每一处细节上做权衡。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>钱从哪来<\/h3>\n<p>政府支出需要税收。美国的联邦税收主要有四块：<\/p>\n<ul><li>\n<strong>个人所得税<\/strong>：按收入分档征，最高档税率显著高于最低档。\n<\/li><li>\n<strong>工薪税<\/strong>：为社会保障和医疗保险筹资，按工资比例征收，有上限。\n<\/li><li>\n<strong>企业所得税<\/strong>：对利润征税。\n<\/li><li>\n<strong>消费税<\/strong>：对汽油、烟酒等特定商品征税。\n<\/ul>\n<p>州与地方政府的收入主要来自<strong>销售税<\/strong>（对零售额征）和<strong>房产税<\/strong>（对房产价值征）。<\/p>\n<p>不同国家的税种结构差别很大，但评价税制的标准是通用的：效率与平等。<\/p>\n<h3>效率：三个来源的损失<\/h3>\n<p><strong>一、无谓损失。<\/strong> 第 8 章已经算过：税收改变价格，改变行为，挤掉一部分交易。税基越宽、税率越低，同样的收入造成的无谓损失越小。<\/p>\n<p><strong>二、管理负担。<\/strong> 报税、记账、请会计、应对稽查，这些成本不产生任何产出。税制越复杂，这部分越大。一个直观例子：如果每个人只需填一页表，社会省下的时间可以干别的。<\/p>\n<p><strong>三、边际税率与平均税率的差别。<\/strong><\/p>\n<ul><li>\n<strong>平均税率<\/strong> = 总税额 ÷ 总收入。\n<\/li><li>\n<strong>边际税率<\/strong> = 增加一单位收入所多缴的税。\n<\/ul>\n<p>决定&quot;要不要多干一小时&quot;的是<strong>边际税率<\/strong>，不是平均税率。假设某人收入 10 万元，缴税 2 万元，平均税率 20%。如果再多挣 1 元要缴 0.4 元税，边际税率是 40%——他多干活的动力按 40% 打折，而不是按 20%。<\/p>\n<p>这一点经常被政策讨论忽略：说&quot;富人平均只缴 20% 的税&quot;和说&quot;富人每多挣一元要缴 40%&quot;，两句话都真，指向的激励效果完全不同。<\/p>\n<h3>平等：两种原则<\/h3>\n<p><strong>受益原则<\/strong>（benefit principle）：谁受益谁付钱。汽油税修路、公园门票维护公园，都属于这一类。问题在于很多公共支出无法对应到具体受益人（国防、基础教育）。<\/p>\n<p><strong>支付能力原则<\/strong>（ability-to-pay principle）：能力强者多付。它再分成两层：<\/p>\n<ul><li>\n<strong>纵向公平<\/strong>：收入高的人多缴。\n<\/li><li>\n<strong>横向公平<\/strong>：收入相同的人缴一样多。\n<\/ul>\n<p>横向公平听起来简单，实际很难做到。两个人收入都是 10 万元，一个有孩子要养、一个没有，他们的&quot;支付能力&quot;不同吗？如果按家庭调整扣除项，横向公平就变成&quot;相同生活水平的人缴一样多&quot;，定义立刻变复杂。<\/p>\n<h3>三种税制结构<\/h3>\n<ul><li>\n<strong>比例税<\/strong>：所有人按同一税率缴，税额随收入同比例增加。\n<\/li><li>\n<strong>累进税<\/strong>：收入越高，税率越高。个人所得税通常是累进的。\n<\/li><li>\n<strong>累退税<\/strong>：收入越高，实际负担的税率越低。销售税常被认为是累退的——低收入者把收入的大部分用于消费，缴的销售税占收入比重更高。\n<\/ul>\n<p>判断一种税是累进还是累退，不能看名义税率，要看<strong>税额占收入的比重<\/strong>怎么随收入变化。这是本章最容易出错的地方。<\/p>\n<h3>归宿：谁真正付钱<\/h3>\n<p>第 6 章的结论在这里再次出现：法律规定的纳税人不是真正的承担者。企业所得税名义上由企业缴，但企业可以把税通过提高价格转给消费者、通过压低工资转给员工、或通过降低回报转给股东。<strong>转嫁多少取决于各方的弹性<\/strong>。<\/p>\n<p>所以评价一项税的公平性，不能只看法律条文，要看归宿。这也是&quot;对富人征税&quot;常常落空的原因（第 6 章的奢侈品税案例）。<\/p>\n<h3>一个具体争论：单一税与累进税<\/h3>\n<p>支持单一税（所有人同一税率）的人强调效率：税制简单、边际税率低、对工作与投资的抑制小。支持累进税的人强调平等：高收入者从社会获得更多（产权保护、基础设施、教育体系），理应多付。<\/p>\n<p>这场争论没有纯经济学答案，因为它最终落在&quot;社会应该有多平等&quot;这个价值判断上。经济学能做的是把两种选择的代价算清楚：累进程度越高，边际税率越高，效率损失越大；反之平等程度下降。第 20 章会接着讨论收入再分配的政治哲学。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;平均税率高就是税负重&quot;——实际上决定行为的是边际税率。一个人平均税率 25%、边际税率 50%，他多干活的动力按 50% 打折。\n<\/li><li>\n别以为&quot;销售税是比例税&quot;——实际上它对低收入者更重，因为消费占收入比重更高，属于累退。\n<\/li><li>\n别以为&quot;企业缴的税就是企业承担&quot;——实际上会转嫁给消费者、员工或股东，具体比例看弹性。\n<\/li><li>\n别以为&quot;税制越复杂越公平&quot;——实际上复杂性本身有成本，而且常被高收入者利用漏洞规避，反而不公平。\n<\/ul>\n<ol><li>\n（单选）某人年收入 10 万元，缴税 2 万元；再多挣 1 元要缴 0.4 元税。他的平均税率与边际税率分别是？\n<p>A. 20% 与 20%  B. 20% 与 40%  C. 40% 与 20%  D. 40% 与 40% <strong>答案<\/strong>：B；<strong>解析<\/strong>：平均税率 = 2 万 ÷ 10 万 = 20%；边际税率由新增收入决定，为 40%。决定是否多工作的是边际税率。<\/p>\n<\/ol>\n<ol><li>\n（单选）关于销售税的累进或累退性质，下列说法正确的是？\n<p>A. 销售税是比例税，因为税率统一  B. 销售税通常是累退的，因为低收入者消费占收入比重更高  C. 销售税通常是累进的  D. 无法判断，取决于商品种类 <strong>答案<\/strong>：B；<strong>解析<\/strong>：名义税率统一不代表负担比例统一。低收入者把更大比例的收入用于消费，缴税占收入比重更高，因此是累退的。<\/p>\n<\/ol>\n<ol><li>\n（单选）「谁从公共服务中受益更多，谁就该多缴税」属于哪种原则？\n<p>A. 支付能力原则  B. 受益原则  C. 纵向公平原则  D. 比例税原则 <strong>答案<\/strong>：B；<strong>解析<\/strong>：受益原则按受益大小分摊成本，如汽油税修路。支付能力原则按收入高低分摊，两者在国防、基础教育这类支出上会给出不同答案。<\/p>\n<\/ol>\n<ol><li>\n（多选）税收造成的效率损失来自哪些方面？\n<p>A. 改变相对价格导致交易减少的无谓损失  B. 报税与合规的管理负担  C. 高边际税率对工作与投资激励的抑制  D. 政府把税收用于转移支付 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项都是效率损失。转移支付改变的是分配，不直接构成效率损失（其行政成本才算）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n效率三个来源：无谓损失、管理负担、边际税率对激励的扭曲。\n<\/li><li>\n平等两种原则：受益原则（谁受益谁付）、支付能力原则（能力强者多付）。\n<\/li><li>\n判断累进还是累退看税额占收入的比重，不看名义税率；归宿由弹性决定。\n<\/ul>", "ch13": "<h1>第 13 章：生产成本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分经济利润与会计利润，并算出一个含隐性成本的经济利润。\n<\/li><li>\n给定产量与总成本数据，算出 FC、VC、ATC、AVC、MC，并判断在哪个产量上 ATC 最低。\n<\/li><li>\n解释为什么 MC 曲线一定穿过 ATC 的最低点，以及短期与长期成本曲线的差别从哪来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>成本是&quot;为了生产而放弃的一切&quot;，包括老板自己投进去的时间和钱；边际成本先降后升，平均成本被它推着走，在两者相等处达到最低。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>利润的两种算法<\/h3>\n<p><strong>总收益<\/strong> TR = 价格 × 数量。<strong>总成本<\/strong> TC = 生产所付出的一切。<strong>利润<\/strong> = TR − TC。<\/p>\n<p>难点在&quot;一切&quot;包括什么。<strong>显性成本<\/strong>是掏出去的钱：原料、工资、房租。<strong>隐性成本<\/strong>是没掏钱但确实放弃的东西：老板自己投进去的资金本可以拿去理财、自己的时间本可以去别的公司上班。<\/p>\n<ul><li>\n<strong>会计利润<\/strong> = 总收益 − 显性成本\n<\/li><li>\n<strong>经济利润<\/strong> = 总收益 − 显性成本 − 隐性成本\n<\/ul>\n<p>算一个例子。小王开奶茶店，一年收入 60 万元，原料人工房租等显性成本 40 万元，会计利润 20 万元。但他投进去的 30 万元本可以买理财拿 3% 收益（0.9 万元），他自己本可以去公司上班拿 15 万元。经济利润 = 60 − 40 − 0.9 − 15 = 4.1 万元。<\/p>\n<p>只有 4.1 万元，而不是 20 万元。经济利润才是&quot;这个选择到底值不值&quot;的答案。<strong>经济利润为零并不等于白干<\/strong>——它意味着老板的资源获得了和其他用途一样的回报，这在新古典经济学里叫&quot;正常利润&quot;。<\/p>\n<h3>生产函数与边际产量递减<\/h3>\n<p><strong>生产函数<\/strong>描述投入与产出的关系。以一家奶茶店为例，固定投入是店面与设备，可变投入是店员。<\/p>\n<p>随着店员人数增加：<\/p>\n<ul><li>\n第 1 个人：从 0 到 40 杯/小时\n<\/li><li>\n第 2 个人：从 40 到 90 杯（+50）\n<\/li><li>\n第 3 个人：从 90 到 130 杯（+40）\n<\/li><li>\n第 4 个人：从 130 到 160 杯（+30）\n<\/ul>\n<p>每多一个人的增量（<strong>边际产量<\/strong>）先升后降。下降的原因是<strong>边际产量递减<\/strong>：设备、店面是固定的，人多了就互相挡着、排队等机器。<\/p>\n<p>这个规律是成本曲线形状的根源：边际产量下降，意味着每多产一杯需要的人手越来越多，<strong>边际成本上升<\/strong>。<\/p>\n<h3>成本的各种衡量<\/h3>\n<p><strong>固定成本<\/strong> FC：不随产量变化的成本，房租、设备折旧。 <strong>可变成本<\/strong> VC：随产量变化的成本，原料、计时工资。 <strong>总成本<\/strong> TC = FC + VC。<\/p>\n<p><strong>平均总成本<\/strong> ATC = TC ÷ Q。<strong>平均固定成本<\/strong> AFC = FC ÷ Q，随产量增加持续下降。<strong>平均可变成本<\/strong> AVC = VC ÷ Q。<\/p>\n<p><strong>边际成本<\/strong> MC = 增加一单位产量所增加的总成本 = ΔTC ÷ ΔQ。<\/p>\n<p>一张具体的表（FC = 30 元）：<\/p>\n<table><thead><tr><th>Q<\/th><th>VC<\/th><th>TC<\/th><th>ATC<\/th><th>MC<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>30<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>1<\/td><td>10<\/td><td>40<\/td><td>40.0<\/td><td>10<\/td><\/tr><tr><td>2<\/td><td>18<\/td><td>48<\/td><td>24.0<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>24<\/td><td>54<\/td><td>18.0<\/td><td>6<\/td><\/tr><tr><td>4<\/td><td>32<\/td><td>62<\/td><td>15.5<\/td><td>8<\/td><\/tr><tr><td>5<\/td><td>45<\/td><td>75<\/td><td>15.0<\/td><td>13<\/td><\/tr><tr><td>6<\/td><td>60<\/td><td>90<\/td><td>15.0<\/td><td>15<\/td><\/tr><\/tbody><\/table>\n<p>读表要点：<\/p>\n<ul><li>\nQ = 3 时 MC 最低（6 元），说明此时边际产量最高。\n<\/li><li>\nQ = 5 到 6 之间 ATC 不再下降，最低点约在 15 元。\n<\/li><li>\n在 ATC 最低处，MC 等于 ATC（都是 15 元）。\n<\/ul>\n<h3>为什么 MC 一定穿过 ATC 最低点<\/h3>\n<p>用一句话推：如果新增一单位的成本低于当前平均，平均值会被拉低；如果高于当前平均，平均值会被拉高。所以平均值的下降与上升，只能发生在&quot;新增成本 = 当前平均&quot;那一点。这是纯粹的算术，和第 5 章&quot;边际与平均&quot;是同一套逻辑。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">单位成本<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 13 章示例：典型成本曲线<\/text><polyline points=\"108.3,313.6 146.7,303.3 185.0,289.8 223.3,273.9 261.7,255.8 300.0,235.8 338.3,214.1 376.7,190.7 415.0,165.9 453.3,139.6\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"396.0\" y=\"161.9\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">MC 边际成本<\/text><polyline points=\"116.0,166.9 146.7,219.1 185.0,243.0 223.3,253.2 261.7,257.9 300.0,259.7 338.3,260.1 376.7,259.4 415.0,258.1 453.3,256.3\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"196.7\" y=\"238.9\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">ATC 平均总成本<\/text><polyline points=\"116.0,234.6 146.7,262.1 185.0,273.2 223.3,276.7 261.7,277.0 300.0,275.7 338.3,273.6 376.7,270.9 415.0,267.9 453.3,264.6\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"242.7\" y=\"266.8\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">AVC 平均可变成本<\/text><text x=\"81.5\" y=\"-32.0\" font-size=\"11.5\" fill=\"#6b7280\">MC 穿过 ATC 与 AVC 的最低点；ATC 在最低点附近达规模最优<\/text><\/svg>\n<p>看图说明：这是示意图，形状按典型成本曲线画，具体数值以正文表格为准。注意三件事：MC 先降后升呈 U 形；ATC 与 AVC 都是 U 形；MC 从下方穿过 ATC 与 AVC 的最低点。<\/p>\n<h3>短期与长期<\/h3>\n<p><strong>短期<\/strong>指至少有一种投入无法改变（比如店面）。<strong>长期<\/strong>指所有投入都能改变。<\/p>\n<p>长期平均总成本曲线（LRATC）是无数条短期 ATC 曲线的包络线。它更平缓，因为企业可以选择最合适的规模。<\/p>\n<p>三种规模效应：<\/p>\n<ul><li>\n<strong>规模经济<\/strong>：规模扩大，LRATC 下降。原因：分工更细、设备更专用、采购更便宜。\n<\/li><li>\n<strong>规模不经济<\/strong>：规模过大，LRATC 上升。原因：管理层级变多、协调成本上升。\n<\/li><li>\n<strong>规模报酬不变<\/strong>：LRATC 基本水平。\n<\/ul>\n<p>第 15 章讲自然垄断时会用到：如果规模经济一直持续到覆盖整个市场，那一家企业供货比多家更便宜，这就构成了自然垄断的经济基础。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;会计利润为正就是赚钱&quot;——实际上要扣掉隐性成本才算真实回报。很多小店&quot;看着赚钱&quot;，其实是老板在给自己打白工。\n<\/li><li>\n别以为&quot;固定成本会随产量摊薄，所以产量越大越赚&quot;——实际上边际成本会上升，超过一定产量后多生产的每一单位都在亏。\n<\/li><li>\n别以为&quot;ATC 最低点就是最赚钱的产量&quot;——实际上利润最大化看的是价格与 MC 的比较，不是 ATC（第 14 章会讲清）。\n<\/li><li>\n别以为&quot;沉没成本应该算进决策&quot;——实际上已经花掉收不回来的钱不影响&quot;要不要继续&quot;这个判断，只影响事后记账。\n<\/ul>\n<ol><li>\n（单选）某店主年收入 60 万元，显性成本 45 万元，他投入的 20 万元资金本可获 5% 收益，自己本可年薪 10 万元。他的经济利润是多少？\n<p>A. 15 万元  B. 4 万元  C. 5 万元  D. 0 万元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：经济利润 = 60 − 45 − 1 − 10 = 4 万元。会计利润 15 万元，差额来自隐性成本 11 万元。<\/p>\n<\/ol>\n<ol><li>\n（单选）固定成本 30 元，产量为 5 时总成本 75 元。平均总成本是多少？\n<p>A. 6 元  B. 15 元  C. 9 元  D. 45 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：ATC = TC ÷ Q = 75 ÷ 5 = 15 元。此时可变成本为 45 元，平均可变成本 9 元，平均固定成本 6 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）为什么边际成本曲线一定穿过平均总成本曲线的最低点？\n<p>A. 因为两者都由固定成本决定  B. 因为新增一单位的成本低于平均会拉低平均，高于平均会拉高平均  C. 因为边际成本总是递减的  D. 因为平均成本总是等于边际成本 <strong>答案<\/strong>：B；<strong>解析<\/strong>：这是纯粹的算术关系：平均值的变化方向由新增值与当前平均值的比较决定，两者相等处就是最低点。<\/p>\n<\/ol>\n<ol><li>\n（填空）产量增加时每多雇一名工人带来的产出增量越来越少，这个规律叫什么？（八个字以内）\n<p><strong>答案<\/strong>：边际产量递减；<strong>解析<\/strong>：固定投入不变、可变投入增加时，新增投入带来的产出增量最终会下降，这直接导致边际成本上升。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n经济利润 = 总收益 − 显性成本 − 隐性成本；零经济利润意味着资源获得正常回报。\n<\/li><li>\nMC 是 U 形，穿过 ATC 与 AVC 的最低点，因为边际拉动平均。\n<\/li><li>\n短期至少一种投入固定，长期全部可变；规模经济让 LRATC 下降，规模不经济让它上升。\n<\/ul>", "ch14": "<h1>第 14 章：竞争市场上的企业<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明为什么在完全竞争市场里 MR = P，并据此写出利润最大化的条件。\n<\/li><li>\n用 P 与 AVC、ATC 的比较，判断企业该继续生产还是暂时停业、该进入还是退出。\n<\/li><li>\n解释长期均衡为什么是「价格 = 最低平均总成本、经济利润为零」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>竞争企业的产量停在「多生产一单位的成本 = 这一单位卖出的价格」那一点；低于这个价格它就少卖，高于这个价格它就多卖，而进出自由会把长期利润压到零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>竞争市场的三个特征<\/h3>\n<p>完全竞争市场满足：卖者众多、产品完全相同、企业能自由进入退出。前两条导致一个关键结果——<strong>单个企业无法影响价格<\/strong>。它只能按市场价卖，多要一分钱就一件也卖不出去。<\/p>\n<p>这样的企业叫<strong>价格接受者<\/strong>（price taker）。它的需求曲线是水平的：市场价 15 元，它面对的需求就是&quot;15 元，想要多少有多少&quot;。<\/p>\n<h3>收益的三个概念<\/h3>\n<ul><li>\n<strong>总收益<\/strong> TR = P × Q\n<\/li><li>\n<strong>平均收益<\/strong> AR = TR ÷ Q = P（因为价格不变）\n<\/li><li>\n<strong>边际收益<\/strong> MR = 多卖一单位增加的收益 = P（同样因为价格不变）\n<\/ul>\n<p>所以在完全竞争里 <strong>P = AR = MR<\/strong>，三条线重合为一条水平线。这一点在垄断那章会彻底改变，那是本章与第 15 章最本质的区别。<\/p>\n<h3>利润最大化的条件<\/h3>\n<p>利润 = TR − TC。多生产一单位，收益增加 MR，成本增加 MC。<\/p>\n<ul><li>\n若 MR &gt; MC：这一单位赚，应该多做。\n<\/li><li>\n若 MR &lt; MC：这一单位亏，应该少做。\n<\/li><li>\n只有 <strong>MR = MC<\/strong> 时利润最大。\n<\/ul>\n<p>在竞争市场里就是 <strong>P = MC<\/strong>。<\/p>\n<p>用第 13 章的成本表验证（FC = 30 元）：<\/p>\n<table><thead><tr><th>P<\/th><th>按 P=MC 选的产量<\/th><th>TR<\/th><th>TC<\/th><th>利润<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>大于 6 杯（MC 继续上升，在 6 杯之后达到 20）<\/td><td>更多<\/td><td>更多<\/td><td>正<\/td><\/tr><tr><td>15<\/td><td>6 杯（MC = 15）<\/td><td>90<\/td><td>90<\/td><td>0<\/td><\/tr><tr><td>13<\/td><td>5 杯（MC 从 8 升到 13）<\/td><td>65<\/td><td>75<\/td><td>−10<\/td><\/tr><tr><td>8<\/td><td>0 杯（低于平均可变成本最低点）<\/td><td>0<\/td><td>30<\/td><td>−30<\/td><\/tr><\/tbody><\/table>\n<p>价格 13 元时虽然亏 10 元，但比停业亏 30 元（固定成本照付）要好，所以继续生产。价格跌到 8 元、低于平均可变成本 9 元时，多生产一杯连原料人工都收不回，还不如停业——<strong>停业点<\/strong>是 P &lt; AVC 最低点。<\/p>\n<h3>沉没成本与停业决策<\/h3>\n<p><strong>沉没成本<\/strong>（sunk cost）是已经花掉、收不回来的成本。它不影响&quot;现在该不该继续&quot;的判断，因为无论继续还是停止，这笔钱都已经没了。<\/p>\n<p>书上举的例子是&quot;覆水难收&quot;：买下的专用设备、装修费、广告费，都属于沉没成本。决策时该问的是&quot;继续经营的额外收益是否大于额外成本&quot;，而不是&quot;我已经投了这么多，不能就这么放弃&quot;。<\/p>\n<p>后半句是典型的<strong>沉没成本谬误<\/strong>：因为已经投入而继续投入，结果亏更多。<\/p>\n<h3>长期：进入与退出<\/h3>\n<p>短期里企业数量固定，只能决定生产多少。长期里企业可以进入或退出：<\/p>\n<ul><li>\n若 P &gt; ATC，现有企业赚钱，新企业进入，供给增加，价格下降。\n<\/li><li>\n若 P &lt; ATC，企业亏损，一部分退出，供给减少，价格上升。\n<\/li><li>\n均衡时 <strong>P = ATC 最低点<\/strong>，经济利润为零。\n<\/ul>\n<p><strong>零利润不是企业倒闭<\/strong>。它意味着企业获得的回报与其他用途一样多，也就是&quot;正常利润&quot;。这正是第 13 章说的经济利润为零的含义。<\/p>\n<h3>长期供给曲线<\/h3>\n<p>短期供给曲线是各企业 MC 曲线的水平加总（只取 AVC 以上的部分）。长期供给曲线更复杂：<\/p>\n<ul><li>\n若进入退出不影响成本，长期供给曲线是<strong>水平<\/strong>的（在 P = 最低 ATC 处）。\n<\/li><li>\n若新企业进入推高了投入品价格（比如好地段铺位有限），长期供给曲线<strong>向上倾斜<\/strong>。\n<\/ul>\n<p>这个差别在分析长期需求变化时很关键：需求增加，短期价格涨得多，长期价格回到接近原水平（水平情形）或略高（向上倾斜情形）。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格与成本<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 14 章示例：P=MR 水平线与 MC 相交<\/text><polygon points=\"70.0,174.7 300.0,174.7 300.0,120.9 70.0,120.9\" fill=\"#ea580c\" fill-opacity=\"0.22\" stroke=\"none\"/><text x=\"185.0\" y=\"147.8\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">经济利润为正<\/text><polyline points=\"108.3,292.5 146.7,279.9 185.0,262.7 223.3,241.7 261.7,217.2 300.0,189.7 338.3,159.2 376.7,125.9 415.0,90.1 453.3,51.8\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"86.1\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">MC<\/text><polyline points=\"116.0,102.1 146.7,168.5 185.0,199.8 223.3,213.9 261.7,221.2 300.0,225.0 338.3,226.8 376.7,227.4 415.0,227.1 453.3,226.3\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"196.7\" y=\"197.5\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">ATC<\/text><polyline points=\"70.0,174.7 530.0,174.7\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"434.3\" y=\"164.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">P=MR=16<\/text><line x1=\"300.0\" y1=\"174.7\" x2=\"300.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"307.0\" y=\"167.7\" font-size=\"11.5\" fill=\"#111827\">Q*=6 时 MR=MC<\/text><\/svg>\n<p>看图说明：水平绿线是 P = MR，红线的 MC 与它相交处就是最优产量。ATC 在交点下方时企业赚钱（橙色区域）。若价格线掉到 AVC 以下，交点消失，企业停业。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;企业应该定在 ATC 最低点生产&quot;——实际上利润最大化看 P 与 MC 的关系；ATC 最低点只在长期均衡时才与价格重合。\n<\/li><li>\n别以为&quot;亏损就应该马上停业&quot;——实际上只要价格高于平均可变成本，继续生产的亏损小于停业的亏损。\n<\/li><li>\n别以为&quot;零利润意味着行业没有吸引力&quot;——实际上零利润是&quot;正常回报&quot;，行业仍然在运转，只是没有超额利润吸引新进入者。\n<\/li><li>\n别以为&quot;沉没成本应该算进决策&quot;——实际上它已经无法收回，只影响账面，不影响&quot;继续还是停止&quot;。\n<\/ul>\n<ol><li>\n（单选）完全竞争企业的利润最大化条件是？\n<p>A. P = ATC  B. P = MC  C. P = AVC  D. MR = ATC <strong>答案<\/strong>：B；<strong>解析<\/strong>：竞争企业 MR = P，所以 MR = MC 就是 P = MC。ATC 最低点只在长期均衡时与价格重合。<\/p>\n<\/ol>\n<ol><li>\n（单选）某企业价格 13 元，产量 5 件，总成本 75 元，平均可变成本 9 元，固定成本 30 元。它应该？\n<p>A. 立即停业，因为亏损  B. 继续生产，因为停业会亏得更多  C. 提高价格  D. 扩大产量到 ATC 最低点 <strong>答案<\/strong>：B；<strong>解析<\/strong>：继续生产亏 10 元；停业则固定成本照付，亏 30 元。价格高于平均可变成本时应继续经营，尽管账面上在亏。<\/p>\n<\/ol>\n<ol><li>\n（单选）长期中竞争行业的均衡状态是？\n<p>A. 价格高于最低 ATC，企业获得超额利润  B. 价格等于最低 ATC，经济利润为零  C. 价格等于 AVC 最低点  D. 企业数量固定不变 <strong>答案<\/strong>：B；<strong>解析<\/strong>：正利润吸引进入、亏损促使退出，直到价格等于最低平均总成本，经济利润为零，进出停止。<\/p>\n<\/ol>\n<ol><li>\n（填空）已经花掉、无法收回的成本叫什么成本？\n<p><strong>答案<\/strong>：沉没成本；<strong>解析<\/strong>：沉没成本不影响「继续还是停止」的判断，因为两种选择下它都已发生。因已投入而继续投入是沉没成本谬误。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n竞争企业 P = AR = MR，利润最大化条件 P = MC。\n<\/li><li>\n停业判据是 P &lt; AVC 最低点；退出判据是 P &lt; ATC。\n<\/li><li>\n长期均衡 P = 最低 ATC，经济利润为零，进入退出停止。\n<\/ul>", "ch15": "<h1>第 15 章：垄断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 13、14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出垄断的三种来源，并判断一个行业属于哪一种。\n<\/li><li>\n解释为什么垄断者的 MR 低于价格，并据此算出它的产量与定价。\n<\/li><li>\n画出垄断的无谓损失，说明垄断利润本身是不是社会成本。\n<\/li><li>\n判断价格歧视在什么条件下可行、对福利有什么影响。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>垄断者不能&quot;想卖多少就卖多少&quot;——它要卖更多就必须降价，所以多卖一单位的真实收益低于价格。它于是把产量压到 MR = MC，再按需求曲线抬价，结果比竞争市场少卖、多收，社会损失一块。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>垄断从哪来<\/h3>\n<p><strong>垄断<\/strong>（monopoly）是一家企业独占某个市场。三种来源：<\/p>\n<ol><li>\n<strong>资源垄断<\/strong>：掌握了关键资源。某地唯一的矿泉水水源、某公司独家拥有的矿藏。\n<\/li><li>\n<strong>政府创造<\/strong>：专利、特许经营、牌照。专利是为了鼓励创新（给药企 20 年独占期），特许经营常见于水电、邮政。\n<\/li><li>\n<strong>自然垄断<\/strong>（natural monopoly）：一家供货比多家更便宜。原因是规模经济一直持续到覆盖整个市场——电网、自来水、地铁都属于这类，铺设两套管道是巨大浪费。\n<\/ol>\n<p>判断方法：问&quot;这个行业的进入壁垒是什么&quot;。壁垒是资源、法律，还是成本结构？<\/p>\n<h3>垄断者的收益：为什么 MR 低于价格<\/h3>\n<p>竞争企业的价格不随销量变化，MR = P。垄断者不同：它的需求曲线就是市场需求曲线，向右下方倾斜——多卖必须降价。<\/p>\n<p>关键在于：降价不只作用于&quot;多卖的那一单位&quot;，而是作用于<strong>所有单位<\/strong>。<\/p>\n<p>设需求 P = 30 − 0.5Q。<\/p>\n<ul><li>\nQ = 10 时，P = 25，TR = 250。\n<\/li><li>\nQ = 11 时，P = 24.5，TR = 269.5。\n<\/ul>\n<p>多卖一单位的 MR = 269.5 − 250 = 19.5 元，而价格是 24.5 元。<strong>MR 比价格低 5 元<\/strong>，因为第 11 单位是在&quot;全部 11 单位都降价 0.5 元&quot;的基础上卖出的。<\/p>\n<p>数学上，MR 曲线的斜率是需求曲线的两倍：P = 30 − 0.5Q 对应 MR = 30 − Q。<\/p>\n<h3>利润最大化与定价<\/h3>\n<p>垄断者也按 <strong>MR = MC<\/strong> 定产量，但定价方式不同：它先把产量定在 MR = MC 处，再<strong>沿需求曲线<\/strong>读出这个产量对应的价格。<\/p>\n<p>继续上面的数字：MC = 10 + Q。<\/p>\n<ul><li>\nMR = MC：30 − Q = 10 + Q → Q = 10\n<\/li><li>\n沿需求曲线：P = 30 − 0.5 × 10 = 25\n<\/ul>\n<p>垄断者在 25 元卖 10 单位。若按竞争方式（P = MC）：30 − 0.5Q = 10 + Q → Q ≈ 13.3，P ≈ 16.7。<\/p>\n<p>对比：<strong>垄断产量 10、价格 25；竞争产量 13.3、价格 16.7<\/strong>。垄断者少卖 3.3 单位，价格高出 8.3 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 15 章示例：垄断者按 MR=MC 定产量，再按需求曲线定价<\/text><polygon points=\"185.0,112.1 185.0,157.6 222.9,187.7\" fill=\"#ea580c\" fill-opacity=\"0.45\" stroke=\"none\"/><polyline points=\"70.0,66.5 185.0,112.1 300.0,157.6 415.0,203.2 530.0,248.8\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"85.5\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.
