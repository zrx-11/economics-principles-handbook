/text><polygon points=\"185.0,112.1 185.0,157.6 222.9,187.7\" fill=\"#ea580c\" fill-opacity=\"0.45\" stroke=\"none\"/><polyline points=\"70.0,66.5 185.0,112.1 300.0,157.6 415.0,203.2 530.0,248.8\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"85.5\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,66.5 242.5,203.2 415.0,340.0\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"292.5\" y=\"244.8\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">边际收益 MR<\/text><polyline points=\"70.0,248.8 185.0,157.6 300.0,66.5\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"308.6\" y=\"62.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">边际成本 MC<\/text><line x1=\"185.0\" y1=\"157.6\" x2=\"185.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"185.0\" y1=\"112.1\" x2=\"70.0\" y2=\"112.1\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><circle cx=\"185.0\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"194.2\" y=\"99.3\" font-size=\"11.5\" fill=\"#111827\">垄断价 25 元<\/text><text x=\"196.5\" y=\"170.4\" font-size=\"11.5\" fill=\"#111827\">MR=MC 处产量 10<\/text><text x=\"237.9\" y=\"199.6\" font-size=\"11.5\" fill=\"#111827\">无谓损失<\/text><text x=\"81.5\" y=\"39.1\" font-size=\"11.5\" fill=\"#6b7280\">竞争结果：产量 13.3、价格 16.7；垄断把产量压低 3.3 单位<\/text><\/svg>\n<p>看图说明：D 与 MR 的垂直距离随产量扩大而增大，因为降价影响全部单位。MR 与 MC 的交点决定产量 10，向上投到 D 得到价格 25。橙色三角形是垄断造成的无谓损失。<\/p>\n<h3>福利代价<\/h3>\n<p>无谓损失来自那 3.3 单位没被生产的交易——它们的成本低于买者的支付意愿，本应发生。面积约 ½ × 3.3 × 5 ≈ 8.3 元（按图形近似）。<\/p>\n<p><strong>垄断利润是不是社会成本？<\/strong> 分两层看：<\/p>\n<ul><li>\n利润本身是从消费者转到企业手里的钱，属于<strong>转移<\/strong>，不是净损失。\n<\/li><li>\n但为了维持垄断地位，企业会花资源游说、打专利诉讼、建壁垒。这部分叫<strong>寻租<\/strong>，是真实的资源消耗。\n<\/li><li>\n此外，垄断者缺乏降成本的动力（X 非效率），这部分损失难以量化但确实存在。\n<\/ul>\n<h3>价格歧视<\/h3>\n<p><strong>价格歧视<\/strong>（price discrimination）是对不同买者收不同价格，而成本相同。<\/p>\n<p>三种类型：<\/p>\n<ul><li>\n<strong>一级<\/strong>：对每个人都收他愿意付的最高价（完全按支付意愿定价）。\n<\/li><li>\n<strong>二级<\/strong>：按购买量分段定价（第二杯半价、批量折扣）。\n<\/li><li>\n<strong>三级<\/strong>：按人群分组定价（学生票、老年优惠）。\n<\/ul>\n<p><strong>可行条件<\/strong>：能区分买者群体，且无法转售套利。飞机票能做价格歧视（学生票、提前购票折扣），因为票不能转让；一瓶矿泉水很难，因为可以转手。<\/p>\n<p><strong>福利效果<\/strong>：<\/p>\n<ul><li>\n若价格歧视让更多人以自己能接受的价格买到（扩大产量），总福利可能上升。\n<\/li><li>\n若只是把同样的销量按不同价格卖出（产量不变），主要是分配变化，福利不变。\n<\/li><li>\n完全的价格歧视（一级）能消除无谓损失，但把全部剩余转给卖者——效率改善、分配恶化。\n<\/ul>\n<h3>政策选项<\/h3>\n<ol><li>\n<strong>反托拉斯法<\/strong>：禁止垄断行为、拆分企业、阻止合并。难点是&quot;多大算垄断&quot;、&quot;降价竞争算不算掠夺&quot;。\n<\/li><li>\n<strong>管制<\/strong>：对自然垄断规定价格（通常按成本加成定价）。难点是管制机构需要知道企业成本，而企业有虚报成本的动机。\n<\/li><li>\n<strong>公有制<\/strong>：政府直接经营。难点是效率与激励问题。\n<\/li><li>\n<strong>不作为<\/strong>：接受垄断，靠竞争者的潜在进入压力约束。适用于壁垒不高、技术变化快的行业。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断者会把价格定到最高&quot;——实际上它要考虑销量，定价过高销量掉得快，利润反而减少。最优点在 MR = MC，不是价格最高点。\n<\/li><li>\n别以为&quot;垄断利润就是社会损失&quot;——实际上利润是转移，真正的净损失是没发生的那部分交易，加上寻租成本。\n<\/li><li>\n别以为&quot;垄断一定不好&quot;——实际上专利带来的短期垄断是创新的必要激励；自然垄断由一家供货确实更省资源。判断要看成本与收益的对比。\n<\/li><li>\n别以为&quot;价格歧视必然伤害消费者&quot;——实际上它常让原本买不起的人也买到了，问题在于剩余怎么分。\n<\/ul>\n<ol><li>\n（单选）自然垄断形成的根本原因是？\n<p>A. 政府发放了独家牌照  B. 规模经济一直持续到覆盖整个市场，一家供货成本最低  C. 企业掌握了全部原材料  D. 产品拥有专利 <strong>答案<\/strong>：B；<strong>解析<\/strong>：自来水、电网这类行业固定成本极高、边际成本低，产量越大平均成本越低，一家供货比分多家更省资源，这就是自然垄断。<\/p>\n<\/ol>\n<ol><li>\n（单选）需求为 P = 30 − 0.5Q，则边际收益 MR 等于？\n<p>A. 30 − Q  B. 30 − 0.5Q  C. 15 − Q  D. 30 − 2Q <strong>答案<\/strong>：A；<strong>解析<\/strong>：线性需求下 MR 的斜率是需求曲线的两倍：TR = 30Q − 0.5Q²，求导得 MR = 30 − Q。<\/p>\n<\/ol>\n<ol><li>\n（单选）需求 P = 30 − 0.5Q，MC = 10 + Q。垄断者的产量与价格分别是？\n<p>A. Q=10，P=25  B. Q=13.3，P=16.7  C. Q=10，P=20  D. Q=6.7，P=26.7 <strong>答案<\/strong>：A；<strong>解析<\/strong>：MR = MC：30 − Q = 10 + Q，得 Q = 10；沿需求曲线得 P = 30 − 5 = 25。竞争结果才是 13.3 与 16.7。<\/p>\n<\/ol>\n<ol><li>\n（多选）价格歧视可行的条件包括？\n<p>A. 能按支付意愿或人群特征区分买者  B. 商品或服务无法转售套利  C. 企业拥有市场势力  D. 政府强制统一定价 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：要能区分买者、防止套利、并且有定价能力。政府统一定价恰恰会消除价格歧视的空间。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n垄断三来源：资源、政府创造、自然垄断（规模经济）。\n<\/li><li>\n垄断者 MR 低于价格，MR 曲线斜率是需求曲线的两倍；按 MR = MC 定产量，再沿需求曲线定价。\n<\/li><li>\n无谓损失来自被压低的产量；垄断利润本身是转移，寻租才是额外成本。\n<\/ul>", "kind": "chapter", "title": "第 15 章：垄断"}, "ch16": {"html": "<h1>第 16 章：垄断竞争<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13、14、15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出垄断竞争与完全竞争、垄断的相同点和不同点。\n<\/li><li>\n画出垄断竞争企业的短期与长期均衡，解释长期均衡为什么是&quot;相切、零利润、产量低于效率规模&quot;。\n<\/li><li>\n分别站在「广告提供信息」和「广告操纵偏好」两种立场评价广告的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>产品有差别，每家企业都有一点点定价权，所以短期能像小垄断者一样赚钱；但进入自由，新品牌会把你的顾客分走，长期利润被压到零——只是价格仍高于边际成本，产量仍小于最有效率的规模。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个特征<\/h3>\n<p><strong>垄断竞争<\/strong>（monopolistic competition）的市场有三个特征：<\/p>\n<ol><li>\n<strong>许多卖者<\/strong>：数量多到每家的行为不影响整体。\n<\/li><li>\n<strong>产品有差别<\/strong>：口味、位置、包装、服务、品牌形象不同。差别是真实的，也可以是感知上的。\n<\/li><li>\n<strong>自由进入退出<\/strong>：新品牌随时可以开张。\n<\/ol>\n<p>奶茶街是最贴切的例子：几十家店，各有配方和装修，谁都能再开一家。<\/p>\n<p>与完全竞争的关键差别是第 2 条。产品有差别，意味着企业涨价不会立刻丢掉全部顾客，于是它的需求曲线<strong>向下倾斜<\/strong>——它有一点点市场势力，但不像垄断那样能完全决定价格。<\/p>\n<h3>短期：像小垄断者<\/h3>\n<p>短期里企业数量固定，每家按 <strong>MR = MC<\/strong> 定产量，再沿自己的需求曲线定价。若价格高于 ATC，就有利润。<\/p>\n<p>图形与第 15 章的垄断一样：向下倾斜的需求、更陡的 MR、U 形 ATC。区别在于需求曲线更平——因为替代品多，涨价丢客快。<\/p>\n<h3>长期：相切与零利润<\/h3>\n<p>有利润就有新品牌进入。新进入者的产品与原企业相似，会分走一部分顾客，使原企业的需求曲线<strong>左移<\/strong>。<\/p>\n<p>这个过程持续到什么时候停止？到需求曲线刚好与 ATC 曲线<strong>相切<\/strong>为止。此时价格等于平均总成本，经济利润为零。若再进入，需求曲线继续左移，价格低于 ATC，企业亏损，开始退出。<\/p>\n<p>长期均衡的三个特征：<\/p>\n<ol><li>\n<strong>相切<\/strong>：P = ATC，利润为零。\n<\/li><li>\n<strong>切点不在 ATC 最低点<\/strong>：因为需求曲线向下倾斜，切点必然在最低点的左侧。\n<\/li><li>\n<strong>产量低于效率规模<\/strong>：这就是<strong>超额能力<\/strong>（excess capacity）——每家店的规模都比&quot;成本最低&quot;的规模小一点。\n<\/ol>\n<h3>与完全竞争的比较<\/h3>\n<table><thead><tr><th>项目<\/th><th>完全竞争<\/th><th>垄断竞争<\/th><\/tr><\/thead><tbody><tr><td>长期价格<\/td><td>等于最低 ATC<\/td><td>高于最低 ATC 一点<\/td><\/tr><tr><td>长期产量<\/td><td>等于效率规模<\/td><td>低于效率规模<\/td><\/tr><tr><td>价格与 MC<\/td><td>相等<\/td><td>价格高于 MC（加价）<\/td><\/tr><tr><td>产品<\/td><td>同质<\/td><td>有差别<\/td><\/tr><\/tbody><\/table>\n<p>所以垄断竞争在效率上确实差一些：每个顾客多付了一点钱，每家店少卖了一点量。<\/p>\n<p>但这个比较忽略了一件东西：<strong>产品多样性<\/strong>。完全竞争的市场里所有产品一样，垄断竞争里你可以选到更合口味的。多样性的价值没有市场价格，很难量化，但它确实存在。判断垄断竞争好不好，要把它和&quot;所有人都喝同一种奶茶&quot;的世界比。<\/p>\n<h3>广告的两种解读<\/h3>\n<p><strong>批评的观点<\/strong>：广告制造不存在差别，操纵消费者偏好，抬高进入壁垒（新品牌要花巨资才能被记住），浪费资源。<\/p>\n<p><strong>支持的观点<\/strong>：广告提供信息（新品、价格、位置），降低搜寻成本；品牌广告是<strong>质量信号<\/strong>——愿意花大钱做广告，说明企业相信自己产品质量能留住顾客，否则广告费白花。<\/p>\n<p>两种观点都有道理，取决于行业。搜索成本高的行业（汽车、保险），广告的信息价值大；同质化行业（矿泉水），广告更多是品牌塑造。<\/p>\n<p><strong>品牌<\/strong>同理。品牌溢价常被批评为&quot;收智商税&quot;，但它也传递了一个可信信号：品牌方有声誉要维护，出问题的代价比无名厂商大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断竞争就是垄断&quot;——实际上它没有进入壁垒，长期利润为零，与垄断的持续超额利润完全不同。\n<\/li><li>\n别以为&quot;长期均衡的切点在 ATC 最低点&quot;——实际上因为需求曲线向下倾斜，切点只能在最低点左侧，这就是超额能力的来源。\n<\/li><li>\n别以为&quot;垄断竞争的低效率必须纠正&quot;——实际上它换来产品多样性，纠正的代价可能是选择变少。\n<\/li><li>\n别以为&quot;广告一定是浪费&quot;——实际上它可能降低搜寻成本、传递质量信号，判断要看行业特征。\n<\/ul>\n<ol><li>\n（单选）垄断竞争企业长期均衡的核心特征是？\n<p>A. 需求曲线与 ATC 曲线在最低点相切  B. 需求曲线与 ATC 曲线相切，且切点在最低点左侧  C. 价格等于边际成本  D. 企业长期获得正的经济利润 <strong>答案<\/strong>：B；<strong>解析<\/strong>：进入使需求曲线左移到与 ATC 相切，利润为零。因需求曲线向下倾斜，切点必然在 ATC 最低点左侧，产量低于效率规模，形成超额能力。<\/p>\n<\/ol>\n<ol><li>\n（单选）垄断竞争与完全竞争最重要的差别是？\n<p>A. 企业数量更多  B. 产品存在差别，企业因此有少量定价权  C. 没有进入壁垒  D. 长期利润更高 <strong>答案<\/strong>：B；<strong>解析<\/strong>：产品差别让每个企业拥有自己的小市场，需求曲线向下倾斜，价格可以略高于边际成本；这也带来多样性和超额能力。<\/p>\n<\/ol>\n<ol><li>\n（多选）支持广告的论点包括？\n<p>A. 降低消费者的搜寻成本  B. 传递产品质量信号  C. 一定降低产品价格  D. 可能抬高进入壁垒 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：广告提供信息、传递质量信号是支持的理由；抬高进入壁垒是批评的理由，且广告不必然降低价格。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n垄断竞争三特征：许多卖者、产品有差别、自由进出。\n<\/li><li>\n长期均衡：需求曲线与 ATC 相切，零利润，产量低于效率规模（超额能力）。\n<\/li><li>\n与完全竞争的差别：价格高于 MC、产量低于效率规模，但换来产品多样性。\n<\/ul>", "kind": "chapter", "title": "第 16 章：垄断竞争"}, "ch17": {"html": "<h1>第 17 章：寡头<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 15、16 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用双头例子说明寡头为什么介于竞争与垄断之间。\n<\/li><li>\n画出囚徒困境式的支付矩阵，判断纳什均衡与合作结果分别是什么。\n<\/li><li>\n解释为什么卡特尔难以维持，以及反托拉斯法处理的是什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>寡头的每一家都要看对手怎么动：合作能一起赚更多，但每一家都有偷偷多卖（或多降价）的动机，于是合作常常维持不住——这决定了寡头的结果落在竞争与垄断之间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>少数几家<\/h3>\n<p><strong>寡头<\/strong>（oligopoly）是少数几家大企业主导的市场：智能手机、民航、加油站、操作系统。特征是<strong>相互依赖<\/strong>——每家的决策都会影响其他家的销量，所以每家都必须预测对手的反应。<\/p>\n<p>这与前面几种市场结构不同。完全竞争里对手太多不用管；垄断里没有对手；垄断竞争里对手太多且产品有差别，不太需要盯着某一家的价格。寡头必须盯着。<\/p>\n<h3>双头的三种可能结果<\/h3>\n<p>假设市场只有两家矿泉水厂，成本相同。市场总需求给定。<\/p>\n<ul><li>\n<strong>合作（卡特尔）<\/strong>：两家坐下来商定总产量按垄断方式分配，各卖一半。总产量低、价格高，总利润达到垄断水平。<strong>卡特尔<\/strong>（cartel）就是这种正式或非正式的价格与产量同盟，OPEC 是最著名的例子。\n<\/li><li>\n<strong>竞争<\/strong>：各自按利润最大化独立决策，不断增产压价，直到价格接近成本，接近完全竞争的结果。\n<\/li><li>\n<strong>实际<\/strong>：介于两者之间——比垄断产量高、比竞争产量低。\n<\/ul>\n<p>为什么落在中间？因为每一家都知道，自己多卖一点会拉低价格、伤到对方，但多卖的那部分收益归自己。于是有&quot;偷偷增产&quot;的动机，合作难以完全维持。<\/p>\n<h3>囚徒困境<\/h3>\n<p><strong>囚徒困境<\/strong>（prisoner&#x27;s dilemma）是理解寡头合作的工具。两家企业，两种选择：维持高价、降价抢客。<\/p>\n<p>支付矩阵（单位：万元利润）：<\/p>\n<table><thead><tr><th>A ＼ B<\/th><th>维持高价<\/th><th>降价<\/th><\/tr><\/thead><tbody><tr><td><strong>维持高价<\/strong><\/td><td>A 100，B 100<\/td><td>A 20，B 140<\/td><\/tr><tr><td><strong>降价<\/strong><\/td><td>A 140，B 20<\/td><td>A 40，B 40<\/td><\/tr><\/tbody><\/table>\n<p>分析：<\/p>\n<ul><li>\n若 B 维持高价，A 选降价得 140 &gt; 100，降价更好。\n<\/li><li>\n若 B 降价，A 选降价得 40 &gt; 20，还是降价更好。\n<\/ul>\n<p>所以不论 B 怎么选，A 都该降价。B 也这么想。结果<strong>双方都降价<\/strong>，各得 40，总利润 80，远低于共同维持高价的 200。<\/p>\n<p>这个结果叫<strong>纳什均衡<\/strong>（Nash equilibrium）：在给定对手策略的情况下，没有任何一方能通过单方面改变策略得到更好结果。注意它并不是&quot;最优结果&quot;——双方合作能得 200，但合作不稳定，因为任何一方都有背叛的动机。<\/p>\n<h3>卡特尔为什么难维持<\/h3>\n<ol><li>\n<strong>背叛的诱惑<\/strong>：偷偷多生产一点，短期多赚，代价由全体分担。\n<\/li><li>\n<strong>成员多则难监督<\/strong>：OPEC 有十几个成员，谁超产很难查。\n<\/li><li>\n<strong>外部竞争者<\/strong>：非成员不受约束，高价会吸引他们进场。\n<\/li><li>\n<strong>需求下降时更脆弱<\/strong>：市场萎缩时每家都想抢份额，价格战一触即发。\n<\/ol>\n<h3>反托拉斯法管什么<\/h3>\n<ul><li>\n<strong>明示合谋<\/strong>：开会商量价格、划分市场，属于本身违法。\n<\/li><li>\n<strong>默契合谋<\/strong>：不用明说，通过价格信号&quot;心照不宣&quot;，取证困难。\n<\/li><li>\n<strong>合并审查<\/strong>：防止合并后市场集中度过高。\n<\/li><li>\n<strong>掠夺性定价<\/strong>：大企业低价挤垮对手再提价。争议在于&quot;低价&quot;本身是竞争，很难和&quot;掠夺&quot;区分。\n<\/li><li>\n<strong>捆绑销售<\/strong>：把热门产品和冷门产品绑在一起卖，可能排挤对手。\n<\/ul>\n<p>这些规则的共同难点是同一个：<strong>有些行为看起来像竞争（降价、扩产），实际可能是排挤对手的手段<\/strong>。判断要靠意图证据与市场结构分析，不能只看价格高低。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;寡头会自动形成高价&quot;——实际上每家都有背叛动机，价格战随时可能发生。\n<\/li><li>\n别以为&quot;纳什均衡就是最优结果&quot;——实际上它是&quot;谁都不能单方面改善&quot;的稳定状态，可能对所有人都不如合作结果。\n<\/li><li>\n别以为&quot;卡特尔一定能赚钱&quot;——实际上成员越多、监督越难、外部竞争越强，卡特尔越容易瓦解。\n<\/li><li>\n别以为&quot;低价一定是好事&quot;——实际上若低价是为了挤垮对手再提价，长期看消费者受损；判断要看是否可持续、是否有排挤意图。\n<\/ul>\n<ol><li>\n（单选）在囚徒困境式的寡头博弈中，双方都维持高价的合作结果为什么难以实现？\n<p>A. 因为合作违法  B. 因为任何一方单方面降价都能立即获益，背叛动机始终存在  C. 因为消费者会抵制高价  D. 因为政府强制低价 <strong>答案<\/strong>：B；<strong>解析<\/strong>：给定对手维持高价，自己降价可把利润从 100 提到 140；对手也这么想，于是双方降价，落入纳什均衡。<\/p>\n<\/ol>\n<ol><li>\n（单选）纳什均衡的含义是？\n<p>A. 所有人的总收益最大  B. 没有任何一方能在对手不变时单方面改变策略而获益  C. 价格等于成本  D. 企业数量最多 <strong>答案<\/strong>：B；<strong>解析<\/strong>：纳什均衡是稳定状态的定义，不保证总收益最大。囚徒困境里均衡结果明显差于合作结果。<\/p>\n<\/ol>\n<ol><li>\n（多选）卡特尔难以长期维持的原因包括？\n<p>A. 成员有偷偷超产的动机  B. 成员多则监督成本高  C. 非成员的外部竞争  D. 市场需求上升 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：背叛动机、监督困难、外部竞争都是瓦解因素。需求上升期卡特尔反而更容易维持，因为大家都有得赚。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n寡头特征是相互依赖，结果介于竞争与垄断之间。\n<\/li><li>\n囚徒困境的结构：单方面背叛总是更划算，于是双方都选择背叛，纳什均衡低于合作结果。\n<\/li><li>\n卡特尔难维持的原因：背叛诱惑、监督困难、外部竞争、需求下降。\n<\/ul>", "kind": "chapter", "title": "第 17 章：寡头"}, "ch18": {"html": "<h1>第 18 章：生产要素市场<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13、14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明劳动需求为什么是「派生需求」，并算出边际产量值。\n<\/li><li>\n用边际产量值等于工资的原则，判断一家企业该雇几个人。\n<\/li><li>\n解释移民、技术变化、产品价格变化分别如何影响工资。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>企业雇人不是因为他可怜，而是因为他能带来收入：雇一个人的收益等于他多生产的产品卖出的钱，这个数叫边际产量值；工资最终由它和劳动者的供给共同决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>劳动需求是派生需求<\/h3>\n<p>消费者买奶茶，才让奶茶店需要店员。<strong>派生需求<\/strong>（derived demand）指对生产要素的需求来自对最终产品的需求。没有顾客，就不需要店员。<\/p>\n<p>一家奶茶店的雇人决策可以算得很具体。设每杯奶茶卖 3 元，店里已有设备固定，增加店员带来的产量增量如下：<\/p>\n<table><thead><tr><th>店员人数<\/th><th>每小时产量<\/th><th>边际产量<\/th><th>边际产量值<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>40 杯<\/td><td>40<\/td><td>120 元<\/td><\/tr><tr><td>2<\/td><td>90 杯<\/td><td>50<\/td><td>150 元<\/td><\/tr><tr><td>3<\/td><td>130 杯<\/td><td>40<\/td><td>120 元<\/td><\/tr><tr><td>4<\/td><td>160 杯<\/td><td>30<\/td><td>90 元<\/td><\/tr><\/tbody><\/table>\n<p><strong>边际产量值<\/strong>（value of the marginal product）= 边际产量 × 产品价格。它衡量&quot;多雇一个人能多赚多少钱&quot;。<\/p>\n<p>企业雇人的原则：只要 VMPL ≥ 工资，就继续雇；VMPL &lt; 工资，就停止。若市场工资是 120 元/小时，雇到第 3 个人；若工资涨到 150 元，只雇 2 个。<\/p>\n<p>这条原则与第 14 章的&quot;P = MC&quot;是同一件事的另一个视角：企业按边际成本等于价格决定产量，等价于按边际产量值等于工资决定用工。<\/p>\n<h3>劳动需求曲线的移动<\/h3>\n<p>三个原因：<\/p>\n<ol><li>\n<strong>产品价格上升<\/strong>：奶茶从 3 元涨到 4 元，VMPL 整体上移，需求右移。\n<\/li><li>\n<strong>其他要素价格变化<\/strong>：设备变便宜，每人能操作的机器更多，劳动需求右移。\n<\/li><li>\n<strong>技术改进<\/strong>：新技术提高每人的产出，需求右移。\n<\/ol>\n<h3>劳动供给<\/h3>\n<p>供给方是劳动者。核心权衡是<strong>工作与闲暇<\/strong>：多工作一小时，多拿一小时工资，少一小时休息。工资上升会吸引更多人工作，但高到一定程度后，有些人反而减少工作时间（因为一小时工资够买很多东西了，宁可多休息）。这个&quot;向后弯&quot;的可能是存在的，但大多数情况下供给曲线仍向上倾斜。<\/p>\n<p>供给曲线移动的原因：人口变化、移民、对其他职业的机会、偏好变化（比如女性劳动参与率上升）。<\/p>\n<h3>均衡工资<\/h3>\n<p>劳动供给与需求相交，得到均衡工资与均衡就业量。这个价格会随着供需变化而波动：<\/p>\n<ul><li>\n某职业需求大增（比如 2010 年代的算法工程师）→ 工资快速上升。\n<\/li><li>\n供给大增（比如高校扩招后某专业毕业生暴增）→ 工资下降。\n<\/li><li>\n进入门槛降低 → 供给增加 → 工资下降。\n<\/ul>\n<h3>土地和资本<\/h3>\n<p><strong>土地<\/strong>的供给通常被认为接近固定（尤其在城市），所以地价主要由需求决定。<strong>资本<\/strong>（机器、厂房、设备）的供给可以增加，价格（利率、租金）由供需共同决定。<\/p>\n<p>三类要素的报酬形式不同：劳动得到工资，土地得到地租，资本得到利息。但定价逻辑相同——<strong>要素的价格等于它创造的边际价值<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;工资由老板的心情决定&quot;——实际上长期看由劳动生产率和供需决定，老板给的低于市场价就招不到人。\n<\/li><li>\n别以为&quot;提高最低工资一定让工人受益&quot;——实际上它同时提高劳动成本，可能减少雇佣（第 19、28 章详述）。\n<\/li><li>\n别以为&quot;资本和劳动是对立的&quot;——实际上它们常常互补：设备更好，同一批工人产出更多，工资也能更高。\n<\/li><li>\n别以为&quot;边际产量值高的职业工资一定高&quot;——实际上还要看供给。一个职业创造价值很高但从业者众多，工资未必高。\n<\/ul>\n<ol><li>\n（单选）某企业最后雇的一名工人每小时多产出 30 件产品，产品单价 5 元。在完全竞争劳动市场上，这名工人的工资上限约为？\n<p>A. 30 元  B. 150 元  C. 5 元  D. 无法判断 <strong>答案<\/strong>：B；<strong>解析<\/strong>：边际产量值 = 30 × 5 = 150 元。企业愿意支付的工资不超过这一数额，否则雇这个人就亏损。<\/p>\n<\/ol>\n<ol><li>\n（单选）劳动需求被称为「派生需求」，原因是？\n<p>A. 它来自对最终产品的需求  B. 它由法律规定的工资标准派生  C. 它由工会与雇主谈判派生  D. 它随人口自然增长派生 <strong>答案<\/strong>：A；<strong>解析<\/strong>：企业雇人是为了生产顾客要买的东西，最终产品没有需求，劳动需求也随之消失。<\/p>\n<\/ol>\n<ol><li>\n（单选）产品价格上升，同时其他条件不变，劳动市场会发生什么？\n<p>A. 劳动需求曲线左移，工资下降  B. 劳动需求曲线右移，工资上升  C. 劳动供给曲线左移，工资上升  D. 劳动供给曲线右移，工资下降 <strong>答案<\/strong>：B；<strong>解析<\/strong>：产品涨价使每个工人的边际产量值上升，企业愿付更高工资，劳动需求右移，均衡工资上升。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n劳动需求是派生需求；企业雇到 VMPL = 工资为止。\n<\/li><li>\nVMPL = 边际产量 × 产品价格，产品涨价或技术改进会让劳动需求右移。\n<\/li><li>\n要素价格由它创造的边际价值与要素供给共同决定。\n<\/ul>", "kind": "chapter", "title": "第 18 章：生产要素市场"}, "ch19": {"html": "<h1>第 19 章：收入与歧视<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 18 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出造成工资差距的四类非歧视因素，并各举一例。\n<\/li><li>\n解释超级明星现象成立的两个条件。\n<\/li><li>\n分清「雇主歧视」「顾客歧视」「政府歧视」三种情形，并说明市场力量在哪种情形下能削弱歧视。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>工资差距大部分不是&quot;同工不同酬&quot;，而是&quot;不同工&quot;：工作条件、能力、机遇、行业规模都在拉开差距；歧视确实存在，但它能否持续，取决于歧视者是否要为此付钱。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一句话先说清楚<\/h3>\n<p>&quot;同样上班，为什么他挣得比我多&quot;——这个问题要拆成两层：<strong>是不是同一份工作<\/strong>，<strong>是不是同一个人<\/strong>。大多数工资差距来自第一层的差异，剩下的才可能来自歧视。<\/p>\n<h3>四类非歧视因素<\/h3>\n<p><strong>一、补偿性工资差别。<\/strong> 危险、辛苦、偏远、不体面、时间不自由的工作，需要额外报酬才有人干。高空作业比办公室文员挣得多，不是能力差异，是风险补偿。<\/p>\n<p><strong>二、能力差异。<\/strong> 天生的才能、体力、智力、性格，都会影响产出。这部分很难改变，也是收入差距的天然来源之一。<\/p>\n<p><strong>三、努力差异。<\/strong> 同样能力的人，投入的小时数、专注程度不同。<\/p>\n<p><strong>四、机遇差异。<\/strong> 入行时机、遇到的老板、行业景气度。2005 年进互联网和 2015 年进互联网，起薪差别很大。<\/p>\n<p>此外还有<strong>人力资本<\/strong>：教育年限、技能证书、在职培训。这一项是可投资的，也是政策最能起作用的地方（教育补贴、职业培训）。<\/p>\n<h3>超级明星现象<\/h3>\n<p>为什么顶级的歌手、运动员收入是普通从业者的几十倍，而顶级理发师和普通理发师差别没那么大？<\/p>\n<p>两个条件同时成立才会出现：<\/p>\n<ol><li>\n<strong>产出可以低成本复制<\/strong>。一首歌录一次可以卖给所有人；一次理发只能服务一个人。\n<\/li><li>\n<strong>消费者在意质量差异<\/strong>。听众能分辨唱功，愿意为最好的多付钱。\n<\/ol>\n<p>所以歌手的市场是&quot;赢者通吃&quot;，理发师的市场是&quot;按人头分配&quot;。这条规律解释了为什么体育、影视、演艺、部分软件行业的收入分布极端陡峭。<\/p>\n<h3>高于均衡水平的工资<\/h3>\n<p>有三种力量会把工资抬到市场均衡之上：<\/p>\n<ol><li>\n<strong>最低工资法<\/strong>：法律规定的下限。它保护了有工作的人，但可能减少雇佣量，尤其是低技能青年。\n<\/li><li>\n<strong>工会<\/strong>：集体谈判提高工资与福利。代价可能是会员人数减少、非会员就业机会受挤压。\n<\/li><li>\n<strong>效率工资<\/strong>：企业主动给高于市场的工资。理由有四条——吃得更好体力更足、流动率低、能招到更好的人、员工更不愿偷懒（因为丢了这份工作损失大）。\n<\/ol>\n<h3>歧视：三种情形<\/h3>\n<p><strong>歧视<\/strong>（discrimination）指对生产能力相同的人因身份特征（性别、种族、年龄、外貌）给予不同待遇。<\/p>\n<p><strong>一、雇主歧视。<\/strong> 雇主宁愿少赚钱也不用某类人。理论上市场会淘汰这种企业——因为它的成本比不歧视的对手高。但如果消费者也歧视（顾客不愿让某类人服务），或者歧视者本身是垄断者（有超额利润可以消耗），歧视就能持续。<\/p>\n<p><strong>二、顾客歧视。<\/strong> 顾客的选择逼着企业按顾客偏好配置人员。这种情况下，市场力量不会消除歧视，反而会强化它。要改变只能靠改变消费者偏好或法规。<\/p>\n<p><strong>三、政府歧视。<\/strong> 法律曾经明文规定某些岗位只招某类人（历史上的种族隔离、性别限制）。这类歧视靠政治运动和法律废除，市场无能为力。<\/p>\n<p><strong>衡量歧视的困难<\/strong>：直接把两组人的平均工资相减，得到的数字里混着能力、经验、行业、工时、地区的差异。要分离出纯粹的歧视，需要控制这些变量，而控制得越细，剩下的&quot;无法解释的差距&quot;越小——但它仍可能包含未观测的因素。这是劳动经济学里最难的测量问题之一。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;工资差距都是歧视造成的&quot;——实际上大部分可由工作条件、能力、经验、行业解释，剩下部分才可能涉及歧视。\n<\/li><li>\n别以为&quot;市场会自动消除歧视&quot;——实际上只有在顾客不歧视、企业竞争充分时才成立；顾客歧视与垄断会让它持续。\n<\/li><li>\n别以为&quot;效率工资是老板好心&quot;——实际上它是投资：低流动率、高积极性带来的收益超过多付的工资。\n<\/li><li>\n别以为&quot;提高最低工资对低收入者总是有利&quot;——实际上要看就业损失有多大，净效果取决于弹性。\n<\/ul>\n<ol><li>\n（单选）高空作业的工资高于办公室文员，最可能的原因是？\n<p>A. 高空作业者能力更强  B. 补偿性工资差别，工作条件更危险  C. 工会力量更强  D. 政府规定的工资更高 <strong>答案<\/strong>：B；<strong>解析<\/strong>：危险、辛苦、地点偏远的工作需要额外报酬才能吸引人，这部分差额叫补偿性工资差别。<\/p>\n<\/ol>\n<ol><li>\n（单选）「超级明星现象」出现的前提是？\n<p>A. 产品可以低成本复制，且消费者在意质量差异  B. 从业者数量极少  C. 政府限制进入  D. 企业规模很大 <strong>答案<\/strong>：A；<strong>解析<\/strong>：唱歌、体育、影视的产出可以复制给所有人，最好的那几个人能满足全部需求，于是收入高度集中。理发师做不到这一点，因为服务无法复制。<\/p>\n<\/ol>\n<ol><li>\n（多选）哪些因素会造成同等工作之间的工资差距？\n<p>A. 工作危险程度不同  B. 工作地点生活成本不同  C. 工作时间的灵活性不同  D. 货币单位不同 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：补偿性差别涵盖危险、地点、时间、声誉等非货币特征；货币单位不影响实际工资比较。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n工资差距的四类非歧视来源：补偿性差别、能力、努力、机遇，加上人力资本投资。\n<\/li><li>\n超级明星现象需要&quot;可复制&quot;与&quot;质量可辨&quot;两个条件。\n<\/li><li>\n雇主歧视可能被市场淘汰，顾客歧视与政府歧视不会；衡量歧视必须控制其他变量。\n<\/ul>", "kind": "chapter", "title": "第 19 章：收入与歧视"}, "ch20": {"html": "<h1>第 20 章：收入不平等与贫困<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 12、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明基尼系数与贫困率的算法，并指出各自的局限。\n<\/li><li>\n比较功利主义、自由主义、自由至上主义三种再分配立场，说出各自的核心主张与批评。\n<\/li><li>\n评价最低工资、福利、负所得税、实物转移四类反贫困政策的利弊。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>不平等可以测量，但&quot;应该多平等&quot;是价值判断；政策工具各有代价，选择哪一种取决于你更看重哪一类代价——效率损失、工作激励、还是尊严与自主。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>怎么衡量不平等<\/h3>\n<p>把家庭按收入从低到高排队，画一条累计收入占比曲线，就是<strong>洛伦兹曲线<\/strong>。完全平均时它是一条 45° 直线；越弯曲，不平等越严重。<\/p>\n<p><strong>基尼系数<\/strong> = 45° 线与洛伦兹曲线之间的面积 ÷ 45° 线以下的三角形面积。取值 0 到 1，0 表示完全平均，1 表示一人独占全部收入。<\/p>\n<p><strong>贫困率<\/strong> = 收入低于贫困线的家庭占比。贫困线的设定各国不同，通常按&quot;满足基本食物与住房需要的收入&quot;确定。<\/p>\n<h3>测量本身的问题<\/h3>\n<ul><li>\n<strong>实物转移没算进去<\/strong>。政府给的医保、住房补贴、食品券不是现金，统计收入时常常漏掉，会让贫困率显得偏高。\n<\/li><li>\n<strong>只看一年收入，忽略生命周期<\/strong>。年轻人和退休者收入低但财富或预期收入不低，一年的快照会误导。\n<\/li><li>\n<strong>暂时性收入波动<\/strong>。某年失业，收入掉到贫困线以下，但长期看并不贫困。\n<\/li><li>\n<strong>税收与转移支付前后差别大<\/strong>。税前基尼系数与税后基尼系数可以差很多。\n<\/li><li>\n<strong>不反映流动性<\/strong>。一个社会基尼系数高但阶层流动快，与基尼系数同样高但阶层固化的社会，性质完全不同。\n<\/ul>\n<h3>三种政治哲学<\/h3>\n<p><strong>功利主义<\/strong>（utilitarianism，边沁）：目标是最大多数人的最大幸福。因为收入有<strong>边际效用递减<\/strong>——给穷人 1000 元带来的幸福感大于给富人 1000 元——所以再分配能提高总效用。批评：效用无法测量，且这种算法可能允许为了多数人的利益牺牲少数人。<\/p>\n<p><strong>自由主义<\/strong>（liberalism，罗尔斯）：正义的原则应该在&quot;无知之幕&quot;后选择——你不知道自己会出生在哪个家庭。理性的人会选择一个保护最差处境者的制度。所以再分配的目标是<strong>最大化最不利者的福利<\/strong>。批评：它可能要求过高的再分配，损害激励。<\/p>\n<p><strong>自由至上主义<\/strong>（libertarianism，诺齐克）：只要财产的获取过程正当（劳动、自愿交换、继承合法），结果不平等就不需要纠正。政府再分配等于强制拿走某人的合法所得。批评：它忽略了起点不平等（出生时的资源、教育机会）本身是否正当。<\/p>\n<p>三种立场对应三种政策取向：功利主义支持温和再分配，自由主义支持较强的再分配与公共服务，自由至上主义支持低税与自愿慈善。<\/p>\n<h3>四类反贫困政策<\/h3>\n<p><strong>一、最低工资法。<\/strong> 提高低技能工人的工资。代价：可能减少雇佣，尤其是青年与初次就业者。效果取决于劳动市场弹性。<\/p>\n<p><strong>二、福利（现金补助）。<\/strong> 直接给钱。优点：尊重个人选择。缺点：可能削弱工作激励（收入增加后补助减少，实际边际税率很高）。<\/p>\n<p><strong>三、负所得税。<\/strong> 收入低于某线时政府补贴，收入上升时补贴逐步减少。它把&quot;补助&quot;和&quot;工作激励&quot;设计在一个公式里，避免了福利的&quot;断崖&quot;。代价是财政成本与较高的实际边际税率。<\/p>\n<p><strong>四、实物转移<\/strong>（食品券、公租房、医保）。优点：确保钱花在需要的地方。缺点：限制了受益人的选择，行政成本高。<\/p>\n<p><strong>共同的难题是&quot;工作激励&quot;<\/strong>。任何&quot;收入越低补得越多&quot;的设计，本质上都在给工作收入征一笔隐含的税。要既保底又不伤激励，只能在补贴水平与退出速度之间找平衡。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;基尼系数高就一定糟糕&quot;——实际上还要看流动性、绝对生活水平、公共服务。一个高基尼但人人生活改善的社会，与低基尼但停滞的社会不可简单比较。\n<\/li><li>\n别以为&quot;贫困率下降就说明政策有效&quot;——实际上统计口径变化（比如把实物转移计入）也会让数字变化。\n<\/li><li>\n别以为&quot;再分配只是道德问题&quot;——实际上它有效率代价，设计不好会同时损害效率与公平。\n<\/li><li>\n别以为&quot;给钱一定比给物好&quot;——实际上实物转移能确保基本需求被满足，现金可能被挪作他用，两者各有适用场景。\n<\/ul>\n<ol><li>\n（单选）基尼系数为 0 表示？\n<p>A. 一人占有全部收入  B. 收入完全平均  C. 一半人贫困  D. 无法计算 <strong>答案<\/strong>：B；<strong>解析<\/strong>：基尼系数取值 0 到 1，0 表示洛伦兹曲线与 45 度线重合，即完全平均；1 表示一人独占全部收入。<\/p>\n<\/ol>\n<ol><li>\n（单选）功利主义支持再分配的核心理由是？\n<p>A. 富人赚钱不道德  B. 收入的边际效用递减，转移给穷人能提高总效用  C. 每个人都应获得相同收入  D. 政府需要更多税收 <strong>答案<\/strong>：B；<strong>解析<\/strong>：边沁式功利主义认为同样一笔钱给穷人带来的效用增量更大，因此再分配能增加总福利。<\/p>\n<\/ol>\n<ol><li>\n（单选）负所得税相比传统福利的最大优点是？\n<p>A. 财政成本为零  B. 把补贴与工作收入平滑衔接，减少「工作就失去补助」的断崖  C. 不需要任何行政成本  D. 可以完全消除贫困 <strong>答案<\/strong>：B；<strong>解析<\/strong>：负所得税按收入逐步退出补贴，避免福利制度中收入略增就失去全部补助的激励陷阱，代价是较高的隐含边际税率。<\/p>\n<\/ol>\n<ol><li>\n（多选）用年度收入衡量贫困可能失真，原因包括？\n<p>A. 忽略实物转移  B. 忽略生命周期差异  C. 暂时性失业被当成长期贫困  D. 没有考虑税率 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：四项都会造成口径偏差：实物转移未计入收入、年轻人与退休者的生命周期特征、暂时波动、税前税后差异都会影响统计结果。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基尼系数衡量不平等程度，贫困率衡量低于贫困线的人口占比，两者都要看口径。\n<\/li><li>\n三种立场：功利主义看总效用（边际效用递减支持再分配）、自由主义看最差者（罗尔斯）、自由至上主义看过程正当（诺齐克）。\n<\/li><li>\n反贫困政策的核心矛盾是保底与工作激励之间的取舍。\n<\/ul>", "kind": "chapter", "title": "第 20 章：收入不平等与贫困"}, "ch21": {"html": "<h1>第 21 章：消费者选择理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4、5、13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出预算约束方程，画出预算线，并说明价格比与截距各自的含义。\n<\/li><li>\n说出无差异曲线的四个特征，画出完全替代与完全互补两种极端情形。\n<\/li><li>\n用「边际替代率 = 价格比」这一条件求最优消费组合。\n<\/li><li>\n解释收入效应与替代效应如何共同决定需求曲线的形状，以及吉芬物品为什么反常。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>消费者在&quot;买得起&quot;与&quot;最想要&quot;之间找交点：预算线代表能买什么，无差异曲线代表想要什么，最优点在两者相切处——那里愿意换的比例恰好等于市场让你换的比例。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>预算约束<\/h3>\n<p>设奶茶每杯 2 元，电影每张 4 元，预算 40 元。设奶茶 x 杯、电影 y 张：<\/p>\n<ul><li>\n预算方程：2x + 4y = 40\n<\/li><li>\n横截距（全买奶茶）：20 杯\n<\/li><li>\n纵截距（全看电影）：10 张\n<\/li><li>\n斜率：−2 ÷ 4 = −0.5，含义是&quot;少喝 2 杯奶茶可以多看 1 张电影&quot;\n<\/ul>\n<p><strong>预算线<\/strong>就是所有&quot;把钱花光&quot;的组合。线内的点有钱剩，线外的点买不起。<\/p>\n<h3>偏好与无差异曲线<\/h3>\n<p><strong>无差异曲线<\/strong>（indifference curve）是所有给消费者带来相同满足程度的组合。同一条线上的点，他觉得&quot;哪个都行&quot;。<\/p>\n<p>四条性质：<\/p>\n<ol><li>\n<strong>向右下方倾斜<\/strong>：多要一样就得少要另一样，否则满足度会变。\n<\/li><li>\n<strong>离原点越远，满足度越高<\/strong>：多总比少好。\n<\/li><li>\n<strong>两条无差异曲线不相交<\/strong>：相交会推出&quot;同一组合既比另一个好又不如它&quot;的矛盾。\n<\/li><li>\n<strong>凸向原点<\/strong>：曲线上段的斜率绝对值大，下段小。\n<\/ol>\n<p>第 4 条的经济含义是<strong>边际替代率递减<\/strong>：你已经有很多奶茶时，愿意用很多杯去换一张电影票；奶茶快没了的时候，就不肯换了。<\/p>\n<p><strong>边际替代率<\/strong>（MRS）= 为多得到一单位横轴商品，愿意放弃的纵轴商品数量，也就是无差异曲线斜率的绝对值。<\/p>\n<h3>两种极端<\/h3>\n<ul><li>\n<strong>完全替代<\/strong>：两种商品按固定比例互换，无差异曲线是直线。比如&quot;1 元硬币&quot;和&quot;两个 5 角硬币&quot;。\n<\/li><li>\n<strong>完全互补<\/strong>：必须按固定比例一起用，无差异曲线是 L 形。比如&quot;左脚鞋&quot;和&quot;右脚鞋&quot;，多一只没用。\n<\/ul>\n<p>现实中大多数商品介于两者之间，曲线是平滑的凸形。<\/p>\n<h3>最优选择<\/h3>\n<p>最优点是预算线与某条无差异曲线的<strong>切点<\/strong>。条件写出来是：<\/p>\n<p><strong>MRS = Px ÷ Py<\/strong><\/p>\n<p>含义：你愿意换的比例（MRS）恰好等于市场允许你换的比例（价格比）。若不相等，比如 MRS = 1 而价格比 = 0.5，说明你愿意用 1 张电影票换 1 杯奶茶，但市场上 1 张票能换 2 杯——那就多换，直到两者相等。<\/p>\n<p>用数字验证：奶茶 2 元、电影 4 元，最优点在 x = 10、y = 5，此时 MRS = 0.5，正好等于 2 ÷ 4。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">奶茶（杯）<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">电影（张）<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 21 章示例：预算线与无差异曲线相切<\/text><polyline points=\"70.0,81.7 453.3,340.0\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"390.2\" y=\"294.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">预算线<\/text><polyline points=\"165.8,81.7 185.0,124.7 204.2,155.5 223.3,178.5 242.5,196.5 261.7,210.8 280.8,222.6 300.0,232.4 319.2,240.6 338.3,247.7 376.7,259.3\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"334.7\" y=\"253.3\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">U1<\/text><polyline points=\"185.0,38.6 204.2,81.7 223.3,114.0 242.5,139.1 261.7,159.2 280.8,175.6 300.0,189.3 319.2,200.9 338.3,210.8 357.5,219.4 376.7,227.0 415.0,239.5\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"2.2\"/><text x=\"430.5\" y=\"217.2\" font-size=\"12\" fill=\"#9ca3af\" font-weight=\"600\">U2 无法达到<\/text><circle cx=\"261.7\" cy=\"210.8\" r=\"4\" fill=\"#111827\"/><line x1=\"261.7\" y1=\"210.8\" x2=\"261.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"261.7\" y1=\"210.8\" x2=\"70.0\" y2=\"210.8\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"288.5\" y=\"148.8\" font-size=\"11.5\" fill=\"#111827\">最优：10 杯奶茶、5 张电影票<\/text><text x=\"81.5\" y=\"45.5\" font-size=\"11.5\" fill=\"#6b7280\">切点处 边际替代率 = 价格比 0.5<\/text><\/svg>\n<p>看图说明：蓝线是预算线，绿线是能达到的最高无差异曲线 U1，切点就是最优组合。灰色 U2 在预算线之外，看得到买不起。切点以外任何一点，要么超出预算，要么落在更低的 U1 上。<\/p>\n<h3>收入变化与价格变化<\/h3>\n<p><strong>收入增加<\/strong>：预算线平行外移，最优点沿&quot;收入—消费曲线&quot;移动。把不同收入下的最优购买量画出来，就是<strong>恩格尔曲线<\/strong>。<\/p>\n<p><strong>价格变化<\/strong>：奶茶降价，预算线的横截距变大（能买更多杯），最优点移动。把不同价格下的最优购买量连起来，就<strong>推导出需求曲线<\/strong>——这是第 4 章那条向下倾斜的曲线在理论上的来源。<\/p>\n<h3>收入效应与替代效应<\/h3>\n<p>价格变化对消费量的影响可以拆成两部分：<\/p>\n<ul><li>\n<strong>替代效应<\/strong>：奶茶便宜了，相对电影更划算，于是用奶茶替代电影。方向永远与价格变动相反（降价则增加）。\n<\/li><li>\n<strong>收入效应<\/strong>：奶茶降价等于你的购买力上升，你能买更多东西。方向取决于商品类型——正常品增加，劣等品减少。\n<\/ul>\n<p>两者相加就是总效应。大多数商品：替代效应为正（降价增购）+ 收入效应为正 → 总效应明显为正，需求曲线向下倾斜。<\/p>\n<p><strong>吉芬物品<\/strong>（Giffen good）是罕见例外：极端劣等品，收入效应为负且大于替代效应。土豆涨价时，穷人反而买更多土豆（因为买不起肉了）。这时需求曲线向上倾斜。现实中极难找到确凿例子，教材里也只是理论构造。<\/p>\n<h3>三个应用<\/h3>\n<p><strong>一、工资与劳动供给。<\/strong> 把&quot;闲暇&quot;当成一种商品，工资就是它的价格。工资上升，替代效应让人多工作（闲暇变贵），收入效应让人少工作（更有钱了）。哪个占上风决定劳动供给曲线向上还是向后弯。<\/p>\n<p><strong>二、利率与储蓄。<\/strong> 把&quot;现在的消费&quot;和&quot;未来的消费&quot;当成两种商品，利率是它们的交换比例。利率上升，替代效应鼓励多储蓄，收入效应鼓励多消费。<\/p>\n<p><strong>三、吉芬物品的搜寻。<\/strong> 教材专门讨论&quot;能不能找到真的吉芬物品&quot;，结论是很难，因为需要同时满足&quot;极端劣等&quot;和&quot;占支出很大比重&quot;两个条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;无差异曲线可以相交&quot;——实际上相交会破坏偏好的传递性，逻辑上不成立。\n<\/li><li>\n别以为&quot;最优点是预算线中点&quot;——实际上取决于偏好与价格，不在中点很常见。\n<\/li><li>\n别以为&quot;降价一定多买&quot;——实际上吉芬物品是例外，收入效应可以压过替代效应。\n<\/li><li>\n别以为&quot;效用可以精确测量&quot;——实际上现代理论只用&quot;排序&quot;，不比大小，只要消费者能说出&quot;我更喜欢 A&quot;就够了。\n<\/ul>\n<ol><li>\n（单选）奶茶 2 元一杯、电影 4 元一张、预算 40 元。预算线的斜率绝对值为？\n<p>A. 2  B. 0.5  C. 4  D. 20 <strong>答案<\/strong>：B；<strong>解析<\/strong>：预算线为 2x + 4y = 40，改写为 y = 10 − 0.5x，斜率绝对值 0.5，含义是少喝 2 杯奶茶可多看 1 张电影。<\/p>\n<\/ol>\n<ol><li>\n（单选）消费者最优选择的条件是？\n<p>A. 边际替代率等于价格比  B. 两种商品消费量相等  C. 预算线中点的组合  D. 无差异曲线与纵轴相交 <strong>答案<\/strong>：A；<strong>解析<\/strong>：在切点处，消费者愿意交换的比例（MRS）恰好等于市场交换比例（Px/Py），此时无法通过调整组合提高满足度。<\/p>\n<\/ol>\n<ol><li>\n（单选）吉芬物品的特点是？\n<p>A. 价格上升时需求量也上升  B. 价格上升时需求量急剧下降  C. 与替代品完全无关  D. 只存在于完全竞争市场 <strong>答案<\/strong>：A；<strong>解析<\/strong>：吉芬物品是极端劣等品，价格上涨时收入效应为负且强于替代效应，导致需求量反而增加，需求曲线向上倾斜。<\/p>\n<\/ol>\n<ol><li>\n（多选）无差异曲线的性质包括？\n<p>A. 向右下方倾斜  B. 离原点越远满足度越高  C. 两条曲线不相交  D. 凸向原点 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：四项都是标准性质。凸向原点对应边际替代率递减：拥有的商品越多，越愿意用它去换另一种。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n预算线斜率 = −Px/Py，截距由收入与价格决定。\n<\/li><li>\n无差异曲线四性质：向下倾斜、越远越好、不相交、凸向原点（MRS 递减）。\n<\/li><li>\n最优点条件 MRS = Px/Py；价格变化的影响 = 替代效应 + 收入效应，吉芬物品是后者压过前者的例外。\n<\/ul>", "kind": "chapter", "title": "第 21 章：消费者选择理论"}, "ch22": {"html": "<h1>第 22 章：微观经济学前沿<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 10、11、16、21 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清逆向选择与道德风险，并各举一个市场失灵的例子。\n<\/li><li>\n说明中位投票人定理与阿罗不可能定理各自说了什么、没说 什么。\n<\/li><li>\n列出行为经济学的四个常见偏差，并解释它们如何影响经济决策。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>当信息不对称、集体决策规则有缺陷、人的判断有系统性偏差时，&quot;看不见的手&quot;和&quot;投票箱&quot;都会失灵——这三块是微观经济学正在扩展的边界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一、不对称信息<\/h3>\n<p><strong>不对称信息<\/strong>（asymmetric information）指交易一方比另一方知道得更多。<\/p>\n<p><strong>逆向选择<\/strong>（adverse selection）：信息劣势方无法分辨好坏，于是只肯出平均价；高质量卖方觉得不划算退出，市场上剩下低质量产品，平均质量进一步下降，价格继续下降——市场可能萎缩甚至消失。二手车市场就是这个逻辑：买家分不清事故车，只肯出中间价，好车卖家退出。<\/p>\n<p>应对手段：<\/p>\n<ul><li>\n<strong>信号<\/strong>（signaling）：信息优势方主动提供可验证的证据。学历证书、品牌保修、第三方检测报告都属于信号——造假成本高才可信。\n<\/li><li>\n<strong>筛选<\/strong>（screening）：信息劣势方设计机制逼对方暴露信息。保险公司的体检、免赔额条款（愿意接受高免赔额的人通常身体好）。\n<\/ul>\n<p><strong>道德风险<\/strong>（moral hazard）：签约之后，一方因为不再承担全部后果而改变行为。买了全额车险的人开车更不小心；企业拿了贷款后乱花钱。<\/p>\n<p>区分要点：逆向选择发生在<strong>签约前<\/strong>（谁在跟我交易），道德风险发生在<strong>签约后<\/strong>（交易之后他怎么干）。<\/p>\n<p>保险业同时面对两者：投保前不知道谁身体差（逆向选择），投保后不注意保养（道德风险）。应对方式是核保与免赔额、共保比例。<\/p>\n<h3>二、政治经济学<\/h3>\n<p>公共选择理论把选民、政治家、官僚当成理性自利者来分析。<\/p>\n<p><strong>中位投票人定理<\/strong>（median voter theorem）：如果议题是一维的（比如&quot;预算规模从 0 到 100 亿&quot;），且选民偏好是单峰的，那么多数投票的结果会落在<strong>中位选民<\/strong>偏好的位置。因为任何偏离中位的方案，都会被中位一侧的多数否决。<\/p>\n<p>推论：政党的政策会向中间靠拢；少数派的强烈偏好很难被满足。<\/p>\n<p><strong>投票悖论<\/strong>（孔多塞悖论）：三个选项、三个选民，偏好排序可能形成循环——A 胜 B、B 胜 C、C 胜 A。没有稳定多数，结果取决于投票顺序。<\/p>\n<p><strong>阿罗不可能定理<\/strong>：如果同时要求满足若干条合理的公理（无限制偏好、非独裁、传递性等），则不存在一种能对所有偏好组合都给出合理结果的投票规则。它不是说&quot;民主不可能&quot;，而是说&quot;没有完美的加总规则&quot;，任何规则都要在某条性质上让步。<\/p>\n<p><strong>政治家与官僚的自利<\/strong>：竞选需要资金，政策可能偏向捐款者；官僚机构倾向于扩大预算。<strong>寻租<\/strong>（第 15 章）在此再次出现。<\/p>\n<h3>三、行为经济学<\/h3>\n<p>标准理论假设人是理性的效用最大化者。行为经济学发现系统性偏差：<\/p>\n<ul><li>\n<strong>过度自信<\/strong>：人普遍高估自己的判断准确度。创业者高估成功率，投资者高估选股能力。\n<\/li><li>\n<strong>锚定效应<\/strong>：先看到的数字会影响后续判断。标价 999 再打五折，与直接标 500，感知不同。\n<\/li><li>\n<strong>损失厌恶<\/strong>：失去 100 元的痛苦大于得到 100 元的快乐。这解释了对&quot;免费退货&quot;&quot;保价&quot;的偏好，也解释了为什么人们不愿卖亏损的股票。\n<\/li><li>\n<strong>框架效应<\/strong>：同一事实换一种说法，决策就变。&quot;手术成功率 90%&quot;比&quot;死亡率 10%&quot;更容易被接受。\n<\/li><li>\n<strong>现时偏见与前后不一致<\/strong>：今天的诱惑比未来的收益更有吸引力，导致戒烟、减肥、储蓄这类&quot;长期有益&quot;的事常常失败。\n<\/ul>\n<p>这些偏差不是&quot;人傻&quot;，而是系统性、可预测的，因此可以被利用（营销）也可以被纠正（默认选项、自动加入养老金计划）。<\/p>\n<h3>三块边界的关系<\/h3>\n<p>三者都在回答同一个问题的变体：&quot;当标准假设不成立时会怎样&quot;。<\/p>\n<ul><li>\n信息不完美 → 市场机制失灵 → 需要信号、筛选、制度设计。\n<\/li><li>\n决策规则不完美 → 公共选择失灵 → 需要宪法层面的约束与程序正义。\n<\/li><li>\n认知有偏差 → 个体决策偏离最优 → 需要&quot;助推&quot;（nudge）与默认设置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;逆向选择等于道德风险&quot;——实际上前者在签约前、后者在签约后，应对手段也不同。\n<\/li><li>\n别以为&quot;阿罗定理证明民主没有意义&quot;——实际上它只说明不存在完美的加总规则，具体规则在特定情形下仍可合理。\n<\/li><li>\n别以为&quot;行为经济学说明人都是非理性的&quot;——实际上偏差是系统性的、方向可预测的，这才让它有分析价值。\n<\/li><li>\n别以为&quot;信息不对称只能靠政府管&quot;——实际上信号与筛选常能由市场自发产生（品牌、认证、保修）。\n<\/ul>\n<ol><li>\n（单选）买全额医疗保险的人更不注意保养身体，这属于？\n<p>A. 逆向选择  B. 道德风险  C. 信号失灵  D. 锚定效应 <strong>答案<\/strong>：B；<strong>解析<\/strong>：道德风险发生在签约之后：投保后不再承担全部后果，行为随之改变。逆向选择发生在签约前，是好坏客户混在一起的问题。<\/p>\n<\/ol>\n<ol><li>\n（单选）二手车市场上好车卖家退出，主要原因是什么？\n<p>A. 买家只肯按平均质量出价，好车卖不到应有价格  B. 二手车需求下降  C. 政府限制交易  D. 维修成本上升 <strong>答案<\/strong>：A；<strong>解析<\/strong>：买家无法分辨质量只肯出中间价，高质量车卖不上价而退出，市场平均质量下降，形成逆向选择的恶性循环。<\/p>\n<\/ol>\n<ol><li>\n（单选）阿罗不可能定理说明？\n<p>A. 民主制度注定失败  B. 不存在同时满足所有合理公理的投票加总规则  C. 多数投票总是最优  D. 只要选民理性就能得到完美结果 <strong>答案<\/strong>：B；<strong>解析<\/strong>：它指出任何投票规则都必须在某条合理性质上让步，而不是否定民主本身。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列属于行为经济学发现的现象是？\n<p>A. 损失厌恶  B. 锚定效应  C. 框架效应  D. 边际效用递减 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项是行为经济学的典型偏差；边际效用递减是传统效用理论的内容，不属于认知偏差。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆向选择在签约前（选错人），道德风险在签约后（行为变了）；信号与筛选是两种应对。\n<\/li><li>\n中位投票人定理给出多数决策的位置，阿罗定理说明没有完美的投票规则。\n<\/li><li>\n行为经济学的核心是&quot;系统性偏差&quot;，不是&quot;随机犯错&quot;。\n<\/ul>", "kind": "chapter", "title": "第 22 章：微观经济学前沿"}, "c01": {"html": "<h1>机会成本与边际分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、7、13、14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>做一件事的真实代价，是你为此放弃的<strong>次优选择<\/strong>；而&quot;要不要多做一点&quot;这类问题，看的是<strong>下一单位<\/strong>的收益与成本，不是总量。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是整本微观经济学的底层语法。第 2 章把它们列为&quot;像经济学家一样思考&quot;的核心，后面几乎所有决策——企业定产量、消费者买东西、政府定税率——都是同一套算法的变体。<\/p>\n<p>没有机会成本，就算不出真实利润（第 13 章）；没有边际思维，就会在&quot;平均成本低&quot;的地方错误地扩大生产（第 14 章）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[要做一件事] --&gt; B{代价是什么}\n    B --&gt; C[显性支出]\n    B --&gt; D[放弃的次优选择]\n    C --&gt; E[会计成本]\n    D --&gt; F[机会成本]\n    E --&gt; G[会计利润]\n    F --&gt; G2[经济利润]\n    G2 --&gt; H{该不该做}\n    H --&gt; I[边际收益 大于 边际成本 才做]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边分叉出两种&quot;成本&quot;，右边汇合成两种&quot;利润&quot;，最后落到一个判断条件上。整张图就是本章两条原则的关系。<\/p>\n<h2>详解<\/h2>\n<h3>机会成本<\/h3>\n<p>你把 10 万元投进一家小店，账面上没付利息，但如果不投这里，这 10 万元本可以买理财赚 4000 元。这 4000 元就是机会成本，它不体现在账本上，但真实存在。<\/p>\n<p>同理，老板自己的时间也是成本。他本可以去打工挣 15 万元，那么&quot;自己看店&quot;这件事的代价就是 15 万元加 4000 元。<\/p>\n<p>所以<strong>经济利润 = 总收益 − 显性成本 − 隐性成本<\/strong>，而<strong>会计利润只减显性成本<\/strong>。前者回答&quot;值不值&quot;，后者回答&quot;账面赚没赚&quot;。<\/p>\n<p>类比：一张演唱会门票你免费拿到，去看的代价不是 0，而是&quot;把票转卖能得到的钱 + 那三小时能做的事&quot;。这个类比在&quot;票不能转卖、时间无法替代&quot;时失效。<\/p>\n<h3>边际分析<\/h3>\n<p>边际是&quot;再多一单位&quot;。边际收益（MR）、边际成本（MC）、边际产量、边际税率，都是这个意思。<\/p>\n<p>判断规则很简单：<strong>边际收益 &gt; 边际成本，就多做；小于，就少做；相等，就停在这一点。<\/strong><\/p>\n<p>这套规则的威力在于它能处理&quot;总量看起来还赚，但再多做就亏&quot;的情形。一家店已经盈利，但第 7 杯奶茶的成本高于售价，那第 7 杯就不该做——尽管整体仍在赚钱。<\/p>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>企业定产量<\/strong>（第 14 章）：P = MC。\n<\/li><li>\n<strong>消费者买东西<\/strong>（第 21 章）：边际替代率 = 价格比，即&quot;我愿意换的比例&quot;等于&quot;市场让我换的比例&quot;。\n<\/li><li>\n<strong>政策定税率<\/strong>（第 8、12 章）：增税要看边际税率对行为的抑制，不只是平均税负。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;没花钱就没有成本&quot;——实际上放弃的收益就是成本，而且是最容易被忽略的那部分。\n<\/li><li>\n别以为&quot;总量赚钱就该继续扩大&quot;——实际上要看下一单位的边际账。\n<\/li><li>\n别以为&quot;沉没成本也该算进去&quot;——实际上已经收不回来的钱不影响&quot;下一步怎么做&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>十大原理之二、之三<\/td><td>决策要看机会成本，理性人看边际<\/td><\/tr><tr><td>第 2 章<\/td><td>经济学家的思维方式<\/td><td>用机会成本与经济利润重算&quot;赚不赚&quot;<\/td><\/tr><tr><td>第 7 章<\/td><td>市场效率<\/td><td>剩余是边际买者与边际卖者之间的差额<\/td><\/tr><tr><td>第 13 章<\/td><td>生产成本<\/td><td>经济利润扣隐性成本；MC 决定产量<\/td><\/tr><tr><td>第 14 章<\/td><td>竞争企业<\/td><td>停业判据看 P 与 AVC 的边际比较<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（价格由边际买卖双方决定）\n<\/li><li>\n<strong>剩余与效率<\/strong>（剩余的边际解释）\n<\/li><li>\n<strong>市场结构谱系<\/strong>（不同结构的定价都是 MR = MC 的变体）\n<\/ul>", "kind": "concept", "title": "机会成本与边际分析"}, "c02": {"html": "<h1>供给与需求<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4、5、6、9、31 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>价格是买卖双方在同一张图上&quot;谈&quot;出来的：需求说&quot;这个价我要多少&quot;，供给说&quot;这个价我给多少&quot;，两条线相交处就是均衡价格与均衡数量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整个微观经济学的坐标系。弹性、税收、价格管制、国际贸易、甚至宏观的 AD-AS，都是在这张图上加元素。看懂这张图，后面全是图层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[价格上升] --&gt; B[需求量下降 沿需求曲线移动]\n    A --&gt; C[供给量上升 沿供给曲线移动]\n    D[收入上升 偏好变化 人口增加] --&gt; E[整条需求曲线移动]\n    F[成本下降 技术改进 卖者增多] --&gt; G[整条供给曲线移动]\n    E --&gt; H[均衡价格与数量改变]\n    G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图把&quot;沿曲线移动&quot;与&quot;整条曲线移动&quot;分开。前者由价格引起，后者由价格以外的因素引起。混淆这两件事，是入门最常见的错误。<\/p>\n<h2>详解<\/h2>\n<h3>两条曲线<\/h3>\n<p><strong>需求曲线<\/strong>向右下倾斜：价格越低，买得越多。原因有三——更便宜所以更多人买、老买家买更多、替代品被挤走。<\/p>\n<p><strong>供给曲线<\/strong>向右上倾斜：价格越高，卖得越多。因为高价能覆盖更高的边际成本。<\/p>\n<p>需求曲线的移动因素：收入、偏好、相关品价格（替代品与互补品）、买者数量、预期。 供给曲线的移动因素：投入成本、技术、卖者数量、预期、政策（税收与补贴）。<\/p>\n<h3>均衡与调整<\/h3>\n<p>均衡价格下，愿意买的量恰好等于愿意卖的量，没有短缺也没有过剩。<\/p>\n<p>若价格高于均衡：卖不掉，库存积压，卖者降价，价格回落。 若价格低于均衡：抢购，短缺，买者抬价，价格回升。<\/p>\n<p>这个过程不需要谁指挥，价格自己就是信号。哈耶克说的&quot;价格是信息&quot;，指的就是这个。<\/p>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>价格上限<\/strong>（第 6 章）：房租管制 → 短缺、排队、黑市。\n<\/li><li>\n<strong>价格下限<\/strong>（第 6 章）：最低工资 → 过剩的劳动力（失业）。\n<\/li><li>\n<strong>国际贸易<\/strong>（第 9 章）：世界价格低于国内均衡价 → 进口；高于 → 出口。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;涨价就是奸商&quot;——实际上若供给没变、需求增加，涨价是均衡的必然结果。\n<\/li><li>\n别以为&quot;需求增加就是需求量增加&quot;——实际上前者是整条曲线右移，后者是沿曲线移动。\n<\/li><li>\n别以为&quot;价格管制能让穷人买得起&quot;——实际上上限造成短缺，能买到的人反而更少（要靠排队或关系）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>市场力量<\/td><td>均衡的形成与三条移动规律<\/td><\/tr><tr><td>第 5 章<\/td><td>弹性<\/td><td>曲线陡缓决定涨价的幅度与收益<\/td><\/tr><tr><td>第 6 章<\/td><td>政府政策<\/td><td>价格上下限制造短缺与过剩<\/td><\/tr><tr><td>第 9 章<\/td><td>国际贸易<\/td><td>世界价格与国内均衡价的比较决定进出口<\/td><\/tr><tr><td>第 31 章<\/td><td>汇率<\/td><td>外汇市场同样是供求均衡<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>弹性<\/strong>（决定价格变动幅度）\n<\/li><li>\n<strong>剩余与效率<\/strong>（均衡为什么使总剩余最大）\n<\/li><li>\n<strong>税收归宿<\/strong>（税负在买卖双方如何分摊，取决于相对弹性）\n<\/ul>", "kind": "concept", "title": "供给与需求"}, "c03": {"html": "<h1>弹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、6、8、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>弹性衡量&quot;一个变量变动 1%，另一个变量会变动百分之几&quot;；价格弹性大，说明消费者对价格很敏感，一涨价就跑。<\/p>\n<h2>为什么重要<\/h2>\n<p>弹性决定了价格变动对收益、对税负分摊、对政策效果的影响。同样是加税，对香烟（弹性小）和对奶茶（弹性大）的结果完全不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[需求价格弹性] --&gt; B[大于 1 富有弹性]\n    A --&gt; C[小于 1 缺乏弹性]\n    A --&gt; D[等于 1 单位弹性]\n    B --&gt; E[降价增加收益]\n    C --&gt; F[涨价增加收益]\n    D --&gt; G[收益不变]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图给出最实用的推论——涨价能不能多赚钱，只看弹性。弹性小于 1 时涨价增收；大于 1 时涨价反而减收。<\/p>\n<h2>详解<\/h2>\n<h3>算法<\/h3>\n<p><strong>需求价格弹性<\/strong> = 需求量变化百分比 ÷ 价格变化百分比。<\/p>\n<p>例：价格从 20 涨到 22（+10%），需求量从 20 降到 18（−10%），弹性 = 10% ÷ 10% = 1。<\/p>\n<p>用中点法可以避免&quot;起点不同、结果不同&quot;的问题：分母用平均值。<\/p>\n<h3>影响因素<\/h3>\n<ul><li>\n<strong>替代品多不多<\/strong>：替代品多则弹性大（可乐涨价，改喝雪碧）。\n<\/li><li>\n<strong>是不是必需品<\/strong>：必需品的弹性小（药、盐）。\n<\/li><li>\n<strong>支出占比<\/strong>：占比大则弹性大。\n<\/li><li>\n<strong>调整时间<\/strong>：时间越长弹性越大（油价涨了，短期照开，长期换车或搬家）。\n<\/ul>\n<h3>其他弹性<\/h3>\n<ul><li>\n<strong>供给弹性<\/strong>：价格变动引起供给量变化的敏感度，取决于产能调整的难易。\n<\/li><li>\n<strong>交叉价格弹性<\/strong>：一种商品价格变动引起另一种商品需求变动的幅度。正值是替代品，负值是互补品。\n<\/li><li>\n<strong>收入弹性<\/strong>：收入变动引起需求变动的幅度。大于 1 是奢侈品，小于 1 是必需品，负值是劣等品。\n<\/ul>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>收益判断<\/strong>：弹性小于 1，涨价增收；大于 1，降价增收。\n<\/li><li>\n<strong>税负分摊<\/strong>（第 8 章）：弹性小的一方承担更多税负。香烟税主要由消费者承担，因为烟民难以戒断。\n<\/li><li>\n<strong>政策效果<\/strong>（第 6 章）：最低工资对就业的伤害取决于劳动需求弹性；弹性小则伤害小。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;弹性大就是需求量大&quot;——实际上弹性衡量的是敏感度，与绝对数量无关。\n<\/li><li>\n别以为&quot;必需品永远缺乏弹性&quot;——实际上长期看弹性会变大（人们会找到替代方案）。\n<\/li><li>\n别以为&quot;涨价一定增收&quot;——实际上弹性大于 1 时涨价会减少总收入。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>弹性及其应用<\/td><td>四类弹性的算法与用途<\/td><\/tr><tr><td>第 6 章<\/td><td>价格控制<\/td><td>短缺程度取决于供需弹性<\/td><\/tr><tr><td>第 8 章<\/td><td>赋税的代价<\/td><td>税负分摊与无谓损失都由弹性决定<\/td><\/tr><tr><td>第 12 章<\/td><td>税制设计<\/td><td>对什么征税、税负落在谁身上<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（弹性的几何含义是曲线陡缓）\n<\/li><li>\n<strong>剩余与效率<\/strong>（税收的无谓损失随弹性增大而增大）\n<\/li><li>\n<strong>税收归宿<\/strong>（弹性小者多担税）\n<\/ul>", "kind": "concept", "title": "弹性"}, "c04": {"html": "<h1>消费者剩余、生产者剩余与市场效率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8、9、10、15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>消费者剩余 = 愿意付的钱减去实际付的钱；生产者剩余 = 实际收到的钱减去成本。两者之和叫总剩余，它在均衡价格处达到最大，任何偏离都会损失一块（无谓损失）。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是&quot;市场为什么好&quot;的量化表述。它给&quot;效率&quot;一个可计算的答案，也让&quot;政府干预的代价&quot;变得可计算——税收、价格管制、垄断、关税的损失都能画成三角形。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[需求曲线] --&gt; B[买者支付意愿]\n    B --&gt; C[消费者剩余 = 意愿 − 付价]\n    D[供给曲线] --&gt; E[卖者成本]\n    E --&gt; F[生产者剩余 = 收价 − 成本]\n    C --&gt; G[总剩余]\n    F --&gt; G\n    G --&gt; H{被什么削减}\n    H --&gt; I[税收 无谓损失]\n    H --&gt; J[价格管制 短缺]\n    H --&gt; K[垄断 产量压低]\n    H --&gt; L[关税 进口减少]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面两条链合成总剩余，下面四条分支是四种常见的&quot;削减方式&quot;。它们削减的机制不同，但都表现为&quot;本该发生的交易没有发生&quot;。<\/p>\n<h2>详解<\/h2>\n<h3>消费者剩余<\/h3>\n<p>需求曲线的高度代表边际买者的<strong>支付意愿<\/strong>。价格线以下、需求线以上的面积是消费者剩余。<\/p>\n<p>例：你愿意为一张演唱会票付 800 元，实际花 500 元，剩余 300 元。所有买者的剩余加起来就是市场总剩余的一部分。<\/p>\n<h3>生产者剩余<\/h3>\n<p>供给曲线的高度代表边际卖者的<strong>成本<\/strong>。价格线以下、供给线以上的面积是生产者剩余（它近似等于利润加固定成本）。<\/p>\n<h3>效率的含义<\/h3>\n<p><strong>总剩余最大 = 资源配置效率最高<\/strong>。均衡价格下，所有&quot;支付意愿高于成本&quot;的交易都发生了，没有遗漏。<\/p>\n<p>任何让成交量减少的政策都会削减总剩余：<\/p>\n<ul><li>\n<strong>税收<\/strong>：买卖价之间插入一个楔子，成交量从 Q 降到 Q&#x27;，损失部分就是<strong>无谓损失<\/strong>（DWL）。\n<\/li><li>\n<strong>价格上限<\/strong>低于均衡：短缺，成交量下降，剩余损失。\n<\/li><li>\n<strong>价格下限<\/strong>高于均衡：过剩，成交量同样下降。\n<\/li><li>\n<strong>垄断<\/strong>：产量压到 MR = MC，损失是需求线与 MC 线之间、从垄断产量到竞争产量之间的三角形。\n<\/li><li>\n<strong>关税<\/strong>：进口减少，国内高价生产替代了便宜的进口，损失两块（生产扭曲与消费扭曲）。\n<\/ul>\n<h3>一个重要限定<\/h3>\n<p>效率不等于公平。总剩余最大只说&quot;饼最大&quot;，不说&quot;饼怎么分&quot;。税收会改变分配（买者与卖者各承担一部分），但效率分析只管总量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;价格越低越好&quot;——实际上低于均衡的价格会造成短缺，成交量下降，总剩余减少。\n<\/li><li>\n别以为&quot;税收的损失就是税收本身&quot;——实际上税款的转移不是损失，损失是成交量减少造成的那块三角形。\n<\/li><li>\n别以为&quot;总剩余最大就是最公平&quot;——实际上它只讲效率，分配是另一个问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>消费者、生产者与市场效率<\/td><td>剩余的度量与均衡的效率性<\/td><\/tr><tr><td>第 8 章<\/td><td>赋税的代价<\/td><td>税收楔子与无谓损失，弹性越大损失越大<\/td><\/tr><tr><td>第 9 章<\/td><td>国际贸易<\/td><td>关税的两块损失<\/td><\/tr><tr><td>第 10 章<\/td><td>外部性<\/td><td>负外部性使社会成本高于私人成本，市场产量过多<\/td><\/tr><tr><td>第 15 章<\/td><td>垄断<\/td><td>垄断的无谓损失与价格歧视的福利效果<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（剩余的几何来源）\n<\/li><li>\n<strong>弹性<\/strong>（决定无谓损失的大小）\n<\/li><li>\n<strong>外部性与公共物品<\/strong>（市场失灵时总剩余不是最大）\n<\/ul>", "kind": "concept", "title": "剩余与效率"}, "c05": {"html": "<h1>外部性与公共物品<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 10、11、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>外部性是&quot;你的行为让别人承担了成本或获得了收益，但价格里没体现&quot;；公共物品是&quot;人人都能用、也没人能不让别人用&quot;的东西。两者都会让市场自己算错账。<\/p>\n<h2>为什么重要<\/h2>\n<p>前面几章的&quot;市场有效率&quot;有一个隐含前提：交易的成本与收益都落在交易双方身上。这条前提一破，价格信号就失真——污染没人买单、灯塔没人建、疫苗没人打够。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[外部性] --&gt; B[负外部性 污染 噪音]\n    A --&gt; C[正外部性 教育 疫苗 研发]\n    B --&gt; D[社会成本大于私人成本]\n    D --&gt; E[市场产量过多]\n    C --&gt; F[社会收益大于私人收益]\n    F --&gt; G[市场产量过少]\n    E --&gt; H[工具: 矫正税 排污权 管制]\n    G --&gt; I[工具: 补贴 专利 公共提供]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条分支的结论相反——一个产量过多、一个过少，但病因相同：价格没把第三方的得失算进去。工具也就分两类：对负外部性加成本，对正外部性补收益。<\/p>\n<h2>详解<\/h2>\n<h3>负外部性<\/h3>\n<p>工厂排污，社会成本 = 私人成本 + 污染代价。市场价格只反映私人成本，于是产量多于社会最优。<\/p>\n<p>数字例子：需求 P = 30 − 0.5Q，私人成本 MC = 10 + Q，每单位污染的社会代价 4 元。<\/p>\n<ul><li>\n私人均衡：30 − 0.5Q = 10 + Q → Q ≈ 13.3。\n<\/li><li>\n社会最优：30 − 0.5Q = 14 + Q → Q ≈ 10.7。\n<\/ul>\n<p>社会最优产量低于私人产量，差额就是过度生产。<\/p>\n<h3>正外部性<\/h3>\n<p>教育让整个社会受益（更低犯罪率、更高生产率），但受教育者只按自己的收益付费，于是教育投入少于社会最优。工具是补贴或公共提供。<\/p>\n<h3>公共物品的两个特征<\/h3>\n<ul><li>\n<strong>非排他性<\/strong>：无法阻止别人使用（国防、路灯）。\n<\/li><li>\n<strong>非竞争性<\/strong>：一个人用不影响别人用。\n<\/ul>\n<p>两者兼具就是<strong>公共物品<\/strong>。只有非排他性、但用的人多了会拥挤的，叫<strong>公共资源<\/strong>（渔场、牧场、公路）。<\/p>\n<p><strong>搭便车<\/strong>（free rider）：既然不付钱也能用，就没人愿意付钱。结果是公共物品供给不足。<\/p>\n<p><strong>公地悲剧<\/strong>（tragedy of the commons）：公共资源被过度使用，因为使用成本由全体分担、收益归自己。渔场过度捕捞、牧场过度放牧都是。<\/p>\n<h3>工具与取舍<\/h3>\n<ul><li>\n<strong>矫正税（庇古税）<\/strong>：按外部成本征税，把外部性内部化。优点是给企业减排的灵活性（谁减排便宜谁多减）；缺点是税率难以精确设定。\n<\/li><li>\n<strong>可交易的污染许可证<\/strong>：政府定总量、发许可证、允许交易。总量可控，减排由最便宜的企业完成。\n<\/li><li>\n<strong>管制<\/strong>：直接规定排放标准。简单，但一刀切，成本高。\n<\/li><li>\n<strong>科斯定理<\/strong>：若产权清晰、交易成本低，双方可以自行谈判解决，无需政府。现实中交易成本常很高（受害者众多）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;外部性只能靠政府解决&quot;——实际上产权明确时当事人可以谈判；许可证交易也是市场手段。\n<\/li><li>\n别以为&quot;公共物品应该全部由政府提供&quot;——实际上有些可由私人提供（收费公路），关键是排他性是否可行。\n<\/li><li>\n别以为&quot;污染税只是收钱&quot;——实际上它改变行为，把外部成本变成企业的决策成本。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>外部性<\/td><td>社会成本曲线、矫正税、排污权交易、科斯定理<\/td><\/tr><tr><td>第 11 章<\/td><td>公共物品与公共资源<\/td><td>搭便车、公地悲剧、成本收益分析的困难<\/td><\/tr><tr><td>第 12 章<\/td><td>税制设计<\/td><td>用税收纠正外部性同时为公共支出筹资<\/td><\/tr><tr><td>第 22 章<\/td><td>微观前沿<\/td><td>信息不对称也是市场失灵的一种<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>剩余与效率<\/strong>（外部性使总剩余无法最大）\n<\/li><li>\n<strong>供给与需求<\/strong>（社会成本曲线是私人成本曲线的上移）\n<\/li><li>\n<strong>公共物品<\/strong>（非排他导致无法收费）\n<\/ul>", "kind": "concept", "title": "外部性与公共物品"}, "c06": {"html": "<h1>市场结构谱系：从完全竞争到垄断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 14、15、16、17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>四种市场结构（完全竞争、垄断竞争、寡头、垄断）的差别只有两个变量：<strong>卖者数量<\/strong>与<strong>产品是否有差别<\/strong>；这两个变量决定了需求曲线有多平、企业有多大的定价权。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是微观后半部分的骨架。理解了&quot;需求曲线越平、定价权越小&quot;，四种结构的定价、产量、利润、效率结论几乎可以自动推出来，不必逐个背。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[卖者众多且产品同质] --&gt; B[完全竞争]\n    C[卖者众多但产品有差别] --&gt; D[垄断竞争]\n    E[少数几家 相互依赖] --&gt; F[寡头]\n    G[一家独占 有壁垒] --&gt; H[垄断]\n    B --&gt; B1[价格接受者 长期利润为零]\n    D --&gt; D1[轻微定价权 长期利润为零 有超额能力]\n    F --&gt; F1[策略互动 结果介于竞争与垄断之间]\n    H --&gt; H1[定价权最大 长期正利润 无谓损失]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是判定条件，右边是结论。从左上到右下，定价权依次增强，效率依次下降（寡头例外，因为它没有唯一的均衡结论）。<\/p>\n<h2>详解<\/h2>\n<h3>完全竞争<\/h3>\n<p>卖者众多、产品同质、自由进出 → 需求曲线水平 → P = MR = MC → 长期 P = 最低 ATC，利润为零。<\/p>\n<h3>垄断竞争<\/h3>\n<p>产品有差别 → 需求曲线向下倾斜但很平 → 短期按 MR = MC 能赚钱 → 长期进入使需求左移到与 ATC 相切 → 零利润、产量低于效率规模（超额能力）。<\/p>\n<h3>寡头<\/h3>\n<p>少数几家互相盯着 → 没有单一模型 → 合作（卡特尔）接近垄断，竞争（囚徒困境）接近竞争，实际落在中间。<\/p>\n<h3>垄断<\/h3>\n<p>一家独占、有壁垒 → 需求曲线就是市场需求曲线 → MR 低于价格 → 按 MR = MC 定产量、沿需求曲线定价 → 长期正利润与无谓损失。<\/p>\n<h3>一条共同的底层规则<\/h3>\n<p>四种结构都用 <strong>MR = MC<\/strong> 定产量。差别只在 MR 与价格的关系：<\/p>\n<ul><li>\n完全竞争：MR = P\n<\/li><li>\n垄断竞争与垄断：MR &lt; P\n<\/li><li>\n寡头：MR 取决于对手的反应\n<\/ul>\n<p>记住这一条，四章内容就串成了一条线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断者想定多高价就定多高&quot;——实际上高价会压缩销量，最优点在 MR = MC。\n<\/li><li>\n别以为&quot;垄断竞争等于垄断&quot;——实际上它没有壁垒，长期利润为零。\n<\/li><li>\n别以为&quot;寡头会自动合谋&quot;——实际上每家都有背叛动机，合谋不稳定。\n<\/li><li>\n别以为&quot;竞争越激烈对社会越好&quot;——实际上产品差别带来的多样性有价值，不能只看价格。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章<\/td><td>竞争市场<\/td><td>P = MR = MC，长期零利润<\/td><\/tr><tr><td>第 15 章<\/td><td>垄断<\/td><td>MR 低于价格，产量压低，无谓损失<\/td><\/tr><tr><td>第 16 章<\/td><td>垄断竞争<\/td><td>相切均衡、超额能力、广告与品牌<\/td><\/tr><tr><td>第 17 章<\/td><td>寡头<\/td><td>策略互动、囚徒困境、卡特尔瓦解<\/td><\/tr><tr><td>第 22 章<\/td><td>前沿<\/td><td>信息不对称与市场势力的新问题<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供需均衡<\/strong>（竞争市场的价格由市场给定）\n<\/li><li>\n<strong>剩余与效率<\/strong>（垄断的无谓损失来自产量压低）\n<\/li><li>\n<strong>机会成本与边际分析<\/strong>（MR = MC 是边际规则的应用）\n<\/ul>", "kind": "concept", "title": "市场结构谱系"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：地基：稀缺、机会成本与经济学思维<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：经济学十大原理<\/a>、<a href=\"#/chapter/ch02\">第 2 章：像经济学家一样思考<\/a><br>检查点：能算出含隐性成本的经济利润<\/li><li class='path-step' id='path-02'><strong>步骤 02：贸易与供需<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：相互依存性与贸易的好处<\/a>、<a href=\"#/chapter/ch04\">第 4 章：供给与需求的市场力量<\/a><br>检查点：能算比较优势并画均衡图<\/li><li class='path-step' id='path-03'><strong>步骤 03：弹性与政府政策<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：弹性及其应用<\/a>、<a href=\"#/chapter/ch06\">第 6 章：供给、需求与政府政策<\/a><br>检查点：能判断价格管制后果<\/li><li class='path-step' id='path-04'><strong>步骤 04：剩余、赋税与国际贸易<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：消费者、生产者与市场效率<\/a>、<a href=\"#/chapter/ch08\">第 8 章：应用：赋税的代价<\/a>、<a href=\"#/chapter/ch09\">第 9 章：应用：国际贸易<\/a><br>检查点：能算总剩余、税收收入与无谓损失<\/li><li class='path-step' id='path-05'><strong>步骤 05：市场失灵与公共部门<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：外部性<\/a>、<a href=\"#/chapter/ch11\">第 11 章：公共物品和公共资源<\/a>、<a href=\"#/chapter/ch12\">第 12 章：税制的设计<\/a><br>检查点：能识别外部性与公共物品并选择工具<\/li><li class='path-step' id='path-06'><strong>步骤 06：成本与四种市场结构<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：生产成本<\/a>、<a href=\"#/chapter/ch14\">第 14 章：竞争市场上的企业<\/a>、<a href=\"#/chapter/ch15\">第 15 章：垄断<\/a>、<a href=\"#/chapter/ch16\">第 16 章：垄断竞争<\/a>、<a href=\"#/chapter/ch17\">第 17 章：寡头<\/a><br>检查点：能用 MR = MC 分析定价与效率<\/li><li class='path-step' id='path-07'><strong>步骤 07：劳动市场与收入分配<\/strong><br>阅读：<a href=\"#/chapter/ch18\">第 18 章：生产要素市场<\/a>、<a href=\"#/chapter/ch19\">第 19 章：收入与歧视<\/a>、<a href=\"#/chapter/ch20\">第 20 章：收入不平等与贫困<\/a><br>检查点：能算边际产量值、解释工资差距<\/li><li class='path-step' id='path-08'><strong>步骤 08：消费者选择与前沿议题<\/strong><br>阅读：<a href=\"#/chapter/ch21\">第 21 章：消费者选择理论<\/a>、<a href=\"#/chapter/ch22\">第 22 章：微观经济学前沿<\/a><br>检查点：能用无差异曲线求最优，区分两类信息失灵<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：经济学十大原理<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某人辞去年薪 12 万元的工作去读两年全日制硕士，每年学费与书本费合计 5 万元。他读硕士的机会成本约为多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 10 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 12 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 22 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 34 万元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一家影院平时票价 40 元，工作日上午几乎空场。经营者决定加开一场早场，票价 15 元。这个决定是否理性，取决于什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 15 元是否高于每张票的平均总成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 15 元是否高于加开一场的边际成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 15 元是否高于 40 元的一半<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 早场观众是否会在下午再买一张票<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 下列哪些属于曼昆所说「政府有时可以改善市场结果」的场合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 产权界定不清，偷盗与违约频发<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 某行业由一家企业垄断并自行定价<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 工厂排污让下游居民承担成本<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 消费者偏好进口商品而非国产商品<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 「一国生活水平的长期水平取决于它生产物品与服务的能力」，这个能力在书里叫什么？（两字词）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：像经济学家一样思考<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 经济学家在模型中假设「其他条件不变」，这个做法最恰当的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 为了让数学推导更简单<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 为了把要研究的变量从其他干扰因素中隔离出来<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 因为现实中其他条件确实永远不变<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 为了让结论更容易被大众接受<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一国的生产组合落在生产可能性边界内部，最合理的解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 该国的技术已经落后于边界<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 资源未被充分利用或使用效率低<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 该国在两种产品上都已达到最优产量<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 该国的机会成本为零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 「最低工资应不应该提高到每小时 15 元」属于实证分析还是规范分析？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：相互依存性与贸易的好处<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 甲 1 小时能产 10 件衣服或 5 台电视，乙 1 小时能产 8 件衣服或 2 台电视。谁在电视上有比较优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 甲，因为他单位时间产量更高<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 乙，因为他放弃的衣服更少<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 甲，因为 1 台电视只放弃 2 件衣服<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 两人都没有<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某顶级外科医生做手术的收费是每小时 3000 元，他打扫自己家的效率也比保洁员高一倍。按比较优势，他应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 自己打扫，因为他效率更高<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 请保洁员，因为他打扫的机会成本远高于保洁费<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 自己打扫，因为请人还要花时间沟通<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 两人都不打扫，等家人来收拾<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 牧场主 1 盎司牛肉的机会成本是 2 磅土豆，农民是 6 磅土豆。两人交换牛肉时，1 盎司牛肉的土豆价格必须落在什么区间内才可能成交？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：供给与需求的市场力量<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 奶茶市场的需求为 Qd = 60 − 2P，供给为 Qs = 2P − 20。均衡价格与均衡数量是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> P=15，Q=30<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> P=20，Q=20<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> P=25，Q=10<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> P=10，Q=40<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 咖啡豆价格上涨，在其他条件不变的情况下，奶茶市场会出现什么变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 奶茶需求曲线右移，价格与数量都上升<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 奶茶供给曲线左移，价格上升、数量下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 奶茶需求曲线左移，价格与数量都下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 奶茶供给曲线右移，价格下降、数量上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 某年夏天既流行喝奶茶（需求右移），同时牛奶大幅涨价（供给左移）。可以确定的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格上涨，数量方向不确定<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格与数量都上涨<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 价格方向不确定，数量上涨<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 价格与数量都下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 「某商品价格从 20 元降到 15 元，其需求量从 20 杯增到 30 杯」，这属于需求量变化还是需求变化？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：弹性及其应用<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 价格从 10 元升到 12 元，需求量从 100 件降到 80 件。用中点法计算的需求价格弹性约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 0.55<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 1.00<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 1.22<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 1.80<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某商品需求缺乏弹性。若卖者提高价格，总收益会？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 增加<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 减少<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 农业技术进步使粮食供给大幅增加，但农民总收入下降。最直接的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 粮食需求缺乏弹性，价格下跌幅度大于数量增加幅度<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 农民没有能力采用新技术<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 粮食需求富有弹性，价格下跌带来数量大增<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 政府对粮食征收了更高的税<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 线性需求曲线上的弹性在中点处等于多少？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：供给、需求与政府政策<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 奶茶市场 Qd = 60 − 2P，Qs = 2P − 20。政府规定最高价 15 元，会出现什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 过剩 20 杯<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 短缺 20 杯<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 短缺 30 杯<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 没有影响，市场仍均衡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 对每杯奶茶向卖者征 6 元税，均衡数量从 20 杯降到 14 杯。政府税收收入是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 120 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 84 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 18 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 6 元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 某商品需求 quiz-q'><b>Q1.<\/b> 「拥堵的城市道路」属于哪一类物品？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 私人物品<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 俱乐部物品<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 公共资源<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 公共物品<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 公共物品市场供给不足的根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 生产成本太高<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 无排他性导致搭便车，没人愿意付费<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 政府不允许私人提供<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 消费者需求量太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 「每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担」导致草场被吃光，这种现象叫什么悲剧？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 解决公地悲剧的可行办法包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 把资源产权私有化<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 规定使用上限并管制<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 发放可交易的配额<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 完全免费开放并依靠使用者自觉<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：税制的设计<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某人年收入 10 万元，缴税 2 万元；再多挣 1 元要缴 0.4 元税。他的平均税率与边际税率分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 20% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 20% 与 40%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 40% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 40% 与 40%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 关于销售税的累进或累退性质，下列说法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 销售税是比例税，因为税率统一<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 销售税通常是累退的，因为低收入者消费占收入比重更高<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 销售税通常是累进的<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无法判断，取决于商品种类<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 「谁从公共服务中受益更多，谁就该多缴税」属于哪种原则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 支付能力原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 受益原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 纵向公平原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 比例税原则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 税收造成的效率损失来自哪些方面？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 改变相对价格导致交易减少的无谓损失<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 报税与合规的管理负担<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 高边际税率对工作与投资激励的抑制<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 政府把税收用于转移支付<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：生产成本<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某店主年收入 60 万元，显性成本 45 万元，他投入的 20 万元资金本可获 5% 收益，自己本可年薪 10 万元。他的经济利润是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 15 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 4 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 5 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 0 万元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 固定成本 30 元，产量为 5 时总成本 75 元。平均总成本是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 6 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 15 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 9 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 45 元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么边际成本曲线一定穿过平均总成本曲线的最低点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 因为两者都由固定成本决定<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 因为新增一单位的成本低于平均会拉低平均，高于平均会拉高平均<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 因为边际成本总是递减的<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 因为平均成本总是等于边际成本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 产量增加时每多雇一名工人带来的产出增量越来越少，这个规律叫什么？（八个字以内）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：竞争市场上的企业<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 完全竞争企业的利润最大化条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> P = ATC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> P = MC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> P = AVC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> MR = ATC<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某企业价格 13 元，产量 5 件，总成本 75 元，平均可变成本 9 元，固定成本 30 元。它应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 立即停业，因为亏损<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 继续生产，因为停业会亏得更多<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 提高价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 扩大产量到 ATC 最低点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 长期中竞争行业的均衡状态是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格高于最低 ATC，企业获得超额利润<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格等于最低 ATC，经济利润为零<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 价格等于 AVC 最低点<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 企业数量固定不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 已经花掉、无法收回的成本叫什么成本？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch15__": {"html": "<h1>测验：第 15 章：垄断<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自然垄断形成的根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 政府发放了独家牌照<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 规模经济一直持续到覆盖整个市场，一家供货成本最低<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 企业掌握了全部原材料<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 产品拥有专利<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 需求为 P = 30 − 0.5Q，则边际收益 MR 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 30 − Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 30 − 0.5Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 15 − Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 30 − 2Q<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 需求 P = 30 − 0.5Q，MC = 10 + Q。垄断者的产量与价格分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> Q=10，P=25<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> Q=13.3，P=16.7<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> Q=10，P=20<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> Q=6.7，P=26.7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 价格歧视可行的条件包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 能按支付意愿或人群特征区分买者<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 商品或服务无法转售套利<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 企业拥有市场势力<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 政府强制统一定价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch16__": {"html": "<h1>测验：第 16 章：垄断竞争<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 垄断竞争企业长期均衡的核心特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 需求曲线与 ATC 曲线在最低点相切<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 需求曲线与 ATC 曲线相切，且切点在最低点左侧<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 价格等于边际成本<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 企业长期获得正的经济利润<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 垄断竞争与完全竞争最重要的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 企业数量更多<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 产品存在差别，企业因此有少量定价权<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 没有进入壁垒<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 长期利润更高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 支持广告的论点包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 降低消费者的搜寻成本<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 传递产品质量信号<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 一定降低产品价格<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 可能抬高进入壁垒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch17__": {"html": "<h1>测验：第 17 章：寡头<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在囚徒困境式的寡头博弈中，双方都维持高价的合作结果为什么难以实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 因为合作违法<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 因为任何一方单方面降价都能立即获益，背叛动机始终存在<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 因为消费者会抵制高价<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 因为政府强制低价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 纳什均衡的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 所有人的总收益最大<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 没有任何一方能在对手不变时单方面改变策略而获益<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 价格等于成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 企业数量最多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 卡特尔难以长期维持的原因包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 成员有偷偷超产的动机<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 成员多则监督成本高<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 非成员的外部竞争<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 市场需求上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch18__": {"html": "<h1>测验：第 18 章：生产要素市场<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某企业最后雇的一名工人每小时多产出 30 件产品，产品单价 5 元。在完全竞争劳动市场上，这名工人的工资上限约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 30 元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 150 元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 5 元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 劳动需求被称为「派生需求」，原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 它来自对最终产品的需求<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 它由法律规定的工资标准派生<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 它由工会与雇主谈判派生<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 它随人口自然增长派生<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 产品价格上升，同时其他条件不变，劳动市场会发生什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 劳动需求曲线左移，工资下降<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 劳动需求曲线右移，工资上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 劳动供给曲线左移，工资上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 劳动供给曲线右移，工资下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch19__": {"html": "<h1>测验：第 19 章：收入与歧视<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 高空作业的工资高于办公室文员，最可能的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 高空作业者能力更强<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 补偿性工资差别，工作条件更危险<\/lab
