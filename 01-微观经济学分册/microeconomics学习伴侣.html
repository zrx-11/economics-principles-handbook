el><label class='quiz-opt'><input type='radio' name='q01' value='2'> 工会力量更强<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 政府规定的工资更高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 「超级明星现象」出现的前提是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 产品可以低成本复制，且消费者在意质量差异<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 从业者数量极少<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 政府限制进入<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 企业规模很大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 哪些因素会造成同等工作之间的工资差距？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 工作危险程度不同<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 工作地点生活成本不同<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 工作时间的灵活性不同<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 货币单位不同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch20__": {"html": "<h1>测验：第 20 章：收入不平等与贫困<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 基尼系数为 0 表示？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 一人占有全部收入<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 收入完全平均<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 一半人贫困<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 无法计算<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 功利主义支持再分配的核心理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 富人赚钱不道德<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 收入的边际效用递减，转移给穷人能提高总效用<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 每个人都应获得相同收入<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 政府需要更多税收<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 负所得税相比传统福利的最大优点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 财政成本为零<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 把补贴与工作收入平滑衔接，减少「工作就失去补助」的断崖<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 不需要任何行政成本<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 可以完全消除贫困<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 用年度收入衡量贫困可能失真，原因包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 忽略实物转移<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 忽略生命周期差异<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 暂时性失业被当成长期贫困<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 没有考虑税率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch21__": {"html": "<h1>测验：第 21 章：消费者选择理论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 奶茶 2 元一杯、电影 4 元一张、预算 40 元。预算线的斜率绝对值为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 消费者最优选择的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 边际替代率等于价格比<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 两种商品消费量相等<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 预算线中点的组合<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无差异曲线与纵轴相交<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 吉芬物品的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格上升时需求量也上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格上升时需求量急剧下降<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 与替代品完全无关<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 只存在于完全竞争市场<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 无差异曲线的性质包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 向右下方倾斜<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 离原点越远满足度越高<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 两条曲线不相交<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 凸向原点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch22__": {"html": "<h1>测验：第 22 章：微观经济学前沿<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 买全额医疗保险的人更不注意保养身体，这属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 逆向选择<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 道德风险<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 信号失灵<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 锚定效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二手车市场上好车卖家退出，主要原因是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 买家只肯按平均质量出价，好车卖不到应有价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 二手车需求下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 政府限制交易<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 维修成本上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 阿罗不可能定理说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 民主制度注定失败<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 不存在同时满足所有合理公理的投票加总规则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 多数投票总是最优<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 只要选民理性就能得到完美结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列属于行为经济学发现的现象是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 损失厌恶<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 锚定效应<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 框架效应<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 边际效用递减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='权衡取舍'>权衡取舍 — 多要一样东西就必须少要另一样，两个都想要的目标之间的此消彼长。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='机会成本'>机会成本 — 为了得到某样东西而放弃的东西的价值，包括账面支出和放弃的收益。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='理性人'>理性人 — 在可选范围内系统比较成本与收益、追求净收益最大的人；书里是分析起点，不是对真实人的道德评价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='边际变动'>边际变动 — 在现有基础上再多一单位或少一单位所带来的变化。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='激励'>激励 — 能改变人行为的东西，如价格、奖励、惩罚、规则。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='市场'>市场 — 买卖双方自发交换的场所与规则，靠价格传递稀缺信息。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='产权'>产权 — 对某项资源归谁所有、如何使用、收益归谁的界定。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为给旁观者带来成本或好处，而价格没有把这笔账算进去。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产率'>生产率 — 平均每个工人每小时生产的物品与服务量。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='通货膨胀'>通货膨胀 — 经济中物价总水平的普遍上涨，不是某几样商品涨价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产可能性边界'>生产可能性边界 — 在既定资源与技术下，经济能生产的两种产品的最大组合所连成的曲线。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='循环流量图'>循环流量图 — 把家庭与企业、物品市场与要素市场连成循环，用来展示收入与支出如何流动的模型。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='微观经济学'>微观经济学 — 研究单个决策者（家庭、企业）与单个市场如何配置资源。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='宏观经济学'>宏观经济学 — 研究整体经济现象，如通胀、失业、经济增长。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='实证分析'>实证分析 — 描述世界是什么样、某政策会导致什么结果，可用事实检验对错。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='规范分析'>规范分析 — 判断世界应该是什么样，包含价值判断，不能仅靠事实裁决。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下把总收益做到最大、或把浪费降到最小的状态。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='增长'>增长 — 生产能力本身扩大，表现为生产可能性边界向外移动。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='绝对优势'>绝对优势 — 用相同的资源投入，能生产出更多某种产品的能力。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='比较优势'>比较优势 — 生产某种产品的机会成本低于他人的能力；决定分工的依据。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='机会成本'>机会成本 — 为生产一单位某产品而放弃的另一产品的数量。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上一种产品的通行价格，是国内是否出口或进口的判断基准。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='专业化'>专业化 — 把资源集中用于自己机会成本最低的产品生产。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='市场'>市场 — 买者与卖者交换某种物品或服务的场所与规则。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='竞争市场'>竞争市场 — 买卖者众多、产品基本相同、进出自由，任何单个参与者都无法影响价格的市场。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求量'>需求量 — 在某一具体价格下，买者愿意并且能够购买的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求法则'>需求法则 — 其他条件不变时，价格上升则需求量下降。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给量'>供给量 — 在某一具体价格下，卖者愿意并且能够出售的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给法则'>供给法则 — 其他条件不变时，价格上升则供给量增加。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='均衡'>均衡 — 供给量等于需求量、市场没有过剩也没有短缺的状态。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='过剩'>过剩 — 供给量大于需求量的状态，价格有下降压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='短缺'>短缺 — 需求量大于供给量的状态，价格有上升压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='替代品'>替代品 — 一种商品价格上升会使另一种商品需求增加的商品对，如咖啡与奶茶。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='互补品'>互补品 — 一种商品价格上升会使另一种商品需求减少的商品对，如奶茶与珍珠。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='弹性'>弹性 — 一个变量对另一个变量变化的敏感程度，用百分比之比衡量。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='需求价格弹性'>需求价格弹性 — 需求量变动百分比与价格变动百分比之比。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='中点法'>中点法 — 用区间两端平均值作分母计算百分比变动，避免起点不同导致结果不同。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='富有弹性'>富有弹性 — 弹性绝对值大于 1，需求量对价格反应强烈。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='缺乏弹性'>缺乏弹性 — 弹性绝对值小于 1，需求量对价格反应微弱。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='总收益'>总收益 — 价格乘以销售数量，等于买者的总支出。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='收入弹性'>收入弹性 — 需求量变动百分比与收入变动百分比之比，用于判断正常品与劣等品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='交叉价格弹性'>交叉价格弹性 — 一种商品需求量变动百分比与另一种商品价格变动百分比之比，正值多为替代品，负值多为互补品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='供给价格弹性'>供给价格弹性 — 供给量变动百分比与价格变动百分比之比，主要受时间长短影响。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='价格上限'>价格上限 — 法律规定的最高售价，只有低于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='价格下限'>价格下限 — 法律规定的最低售价，只有高于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='配给机制'>配给机制 — 价格不能出清时用于分配稀缺商品的办法，如排队、抽签、凭票、凭关系。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收归宿'>税收归宿 — 税收负担最终由谁承担，由供需弹性决定，与法律规定的纳税人无关。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收楔子'>税收楔子 — 买者支付的价格与卖者得到的价格之间的差额。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='支付意愿'>支付意愿 — 买者为一件物品最多愿意支付的金额。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='消费者剩余'>消费者剩余 — 支付意愿减去实际支付，衡量买者从交易中获得的好处。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='成本'>成本 — 卖者为生产一单位产品愿意接受的最低价格，等于其机会成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='生产者剩余'>生产者剩余 — 卖者实际得到的价格减去其成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='总剩余'>总剩余 — 消费者剩余与生产者剩余之和，衡量市场创造的总价值。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下使总剩余最大，不浪费任何一方有得有失的交易机会。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='市场失灵'>市场失灵 — 市场自身无法实现总剩余最大，常见于市场势力与外部性。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='无谓损失'>无谓损失 — 税收使交易量减少而凭空消失的那部分总剩余，买卖双方与政府都没得到。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='拉弗曲线'>拉弗曲线 — 税额与税收收入之间的关系曲线，呈倒 U 形。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='税基'>税基 — 被征税的对象范围，如某类商品的全部销售额。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上该商品的通行价格，决定一国出口还是进口。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='关税'>关税 — 对进口商品征收的税，使国内价格高于世界价格。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='进口配额'>进口配额 — 对进口数量的直接限制，效果与关税类似但政府得不到关税收入。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='幼稚产业论'>幼稚产业论 — 主张对新兴产业发展初期给予保护，成熟后再参与国际竞争。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='调整援助'>调整援助 — 对因贸易受损的工人和企业提供的救济、培训与搬迁支持。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为对旁观者福利造成的影响，且未通过市场价格反映。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='负外部性'>负外部性 — 行为给旁观者带来成本，社会成本高于私人成本，市场会过量生产。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='正外部性'>正外部性 — 行为给旁观者带来收益，社会价值高于私人价值，市场会生产不足。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='矫正税'>矫正税 — 按每单位外部成本征收的税，使私人成本等于社会成本，也称庇古税。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='可交易许可证'>可交易许可证 — 政府设定排放总量并发放可买卖的许可，由市场决定谁减排。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='科斯定理'>科斯定理 — 产权清楚且交易成本足够低时，当事人谈判可达到有效率结果，与产权初始归属无关。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='排他性'>排他性 — 能否阻止不付费的人使用某物品。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='竞争性'>竞争性 — 一个人使用某物品是否会减少他人可用的数量。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共物品'>公共物品 — 既无排他性也无竞争性的物品，如国防、路灯。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共资源'>公共资源 — 无排他性但有竞争性的物品，如公海鱼群、拥堵道路。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='俱乐部物品'>俱乐部物品 — 有排他性但无竞争性的物品，如收费公路、有线电视。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='搭便车'>搭便车 — 不承担成本却享用公共物品收益的行为。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公地悲剧'>公地悲剧 — 公共资源因无排他性被过度使用而枯竭的现象。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='平均税率'>平均税率 — 总税额除以总收入，衡量整体负担。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='边际税率'>边际税率 — 新增一单位收入所适用的税率，决定额外工作的激励。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='受益原则'>受益原则 — 按从公共支出中受益的多少来分摊税负。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='支付能力原则'>支付能力原则 — 按纳税能力分摊税负，能力强者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='纵向公平'>纵向公平 — 收入不同的人缴税不同，高收入者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='横向公平'>横向公平 — 处境相同的人应缴相同的税。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累进税'>累进税 — 税额占收入比重随收入上升而上升的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累退税'>累退税 — 税额占收入比重随收入上升而下降的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='总成本'>总成本 — 生产一定数量产品所投入的全部资源的成本，包括显性与隐性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='显性成本'>显性成本 — 实际付出现金的成本，如原料、工资、租金。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='隐性成本'>隐性成本 — 未付出现金但确实放弃的收益，如自有资金的机会成本、业主的时间。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='经济利润'>经济利润 — 总收益减去全部成本（显性加隐性）。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='会计利润'>会计利润 — 总收益减去显性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际产量'>边际产量 — 多投入一单位可变要素所增加的产出。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际成本'>边际成本 — 多生产一单位产品所增加的总成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='平均总成本'>平均总成本 — 总成本除以产量。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='规模经济'>规模经济 — 产量扩大使长期平均总成本下降的现象。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='价格接受者'>价格接受者 — 无法影响市场价格、只能按市场价出售的企业。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='边际收益'>边际收益 — 多售出一单位产品所增加的总收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='利润最大化条件'>利润最大化条件 — 边际收益等于边际成本；竞争企业即价格等于边际成本。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='停业点'>停业点 — 价格低于平均可变成本最低点时，企业暂时停止生产。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='沉没成本'>沉没成本 — 已经发生且无法收回的成本，不影响当前决策。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='正常利润'>正常利润 — 经济利润为零时的回报水平，等于资源在其他用途上能获得的收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='垄断'>垄断 — 一家企业独占市场，且存在其他企业难以进入的壁垒。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='自然垄断'>自然垄断 — 因规模经济使一家企业供货成本最低而形成的垄断，如电网、自来水。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='价格歧视'>价格歧视 — 对成本相同的商品向不同买者收取不同价格。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='寻租'>寻租 — 企业花费资源游说、诉讼以维持垄断地位，这部分支出不创造产出。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='反托拉斯法'>反托拉斯法 — 旨在限制垄断行为、维护竞争的法规。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='垄断竞争'>垄断竞争 — 许多企业销售有差别的产品、可自由进出的市场结构。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='超额能力'>超额能力 — 垄断竞争企业长期产量低于平均总成本最低点对应的规模。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='品牌'>品牌 — 通过名称与形象传递质量与身份的标识，可降低消费者的信息成本。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='寡头'>寡头 — 少数几家企业主导、彼此高度依赖的市场结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='卡特尔'>卡特尔 — 企业之间就产量与价格达成的同盟，如 OPEC。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='囚徒困境'>囚徒困境 — 每个参与者单方面背叛都更有利、结果集体受损的博弈结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='纳什均衡'>纳什均衡 — 在给定他人策略下，没有任何一方能通过单独改变策略获益的状态。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='掠夺性定价'>掠夺性定价 — 以低于成本的价格挤走对手，再提价获取垄断利润的行为。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='派生需求'>派生需求 — 对生产要素的需求由对最终产品的需求派生而来。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='边际产量值'>边际产量值 — 增加一单位要素投入所带来的产出增量乘以产品价格。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='人力资本'>人力资本 — 劳动者通过教育、培训、经验积累形成的生产能力。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='补偿性工资差别'>补偿性工资差别 — 因工作条件差异而对劳动者给予的工资补偿。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='超级明星现象'>超级明星现象 — 少数顶尖从业者占据大部分市场收入，因为其产出可低成本复制。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='效率工资'>效率工资 — 高于市场均衡水平的工资，用于提高积极性、降低流失、吸引更优秀的员工。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='歧视'>歧视 — 对具有相同生产能力的人因身份特征给予不同待遇。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='人力资本'>人力资本 — 教育、培训与经验形成的生产能力，是工资差距的重要解释变量。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='洛伦兹曲线'>洛伦兹曲线 — 按收入从低到高排列家庭后绘制的累计收入占比曲线。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='基尼系数'>基尼系数 — 衡量收入不平等程度的指标，0 为完全平均，1 为完全不均。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='贫困率'>贫困率 — 收入低于贫困线的家庭占总家庭的比例。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='功利主义'>功利主义 — 以最大多数人的最大幸福为目标的分配哲学。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由主义'>自由主义 — 罗尔斯式立场，主张制度应最大化最不利者的福利。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由至上主义'>自由至上主义 — 主张只要获取过程正当，结果不平等无需政府纠正。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='负所得税'>负所得税 — 收入低于一定水平时由政府补贴、随收入上升逐步退出的制度。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='预算约束'>预算约束 — 消费者支出不超过收入的限制，写成 Px·x + Py·y = 收入。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='无差异曲线'>无差异曲线 — 给消费者带来同等满足程度的所有商品组合连成的线。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='边际替代率'>边际替代率 — 为多得到一单位横轴商品而愿意放弃的纵轴商品数量，等于无差异曲线斜率的绝对值。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='吉芬物品'>吉芬物品 — 价格上升时需求反而增加的极端劣等品。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='替代效应'>替代效应 — 价格变化使消费者转向相对便宜的商品所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='收入效应'>收入效应 — 价格变化改变实际购买力所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='不对称信息'>不对称信息 — 交易一方掌握的信息多于另一方。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='逆向选择'>逆向选择 — 签约前因无法分辨质量导致优质方退出、市场平均质量下降。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='道德风险'>道德风险 — 签约后因风险转移而放松注意或改变行为。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='信号'>信号 — 信息优势方主动提供的可验证证据，造假成本高因而可信。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='筛选'>筛选 — 信息劣势方设计机制使对方暴露真实信息。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='中位投票人定理'>中位投票人定理 — 一维议题下多数投票结果趋向中位选民的偏好。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='阿罗不可能定理'>阿罗不可能定理 — 不存在同时满足所有合理公理的投票加总规则。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='损失厌恶'>损失厌恶 — 同等金额的损失带来的负效用大于收益带来的正效用。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库（微观）<\/h1>\n<h2>框架一：边际比较<\/h2>\n<p><strong>何时用<\/strong>：任何&quot;要不要再多做一点&quot;的问题——多生产一杯、多雇一个人、多收一元税。 <strong>怎么用<\/strong>：算下一单位的收益与成本，比较；相等处停。 <strong>例子<\/strong>：企业按 MR = MC 定产量；政府按边际税率判断对劳动的抑制。<\/p>\n<h2>框架二：供需 + 楔子<\/h2>\n<p><strong>何时用<\/strong>：分析任何价格干预、税收、补贴、关税。 <strong>怎么用<\/strong>：先画原始均衡，再在买卖价格之间插入一个楔子（税、补贴、管制价），看成交量如何变化，剩余如何转移。 <strong>记法<\/strong>：楔子越大，成交量越小；损失的那块三角形就是代价。<\/p>\n<h2>框架三：三步判断市场结构<\/h2>\n<ol><li>\n卖者数量多不多？\n<\/li><li>\n产品有没有差别？\n<\/li><li>\n进入有没有壁垒？\n<\/ol>\n<p>答案组合直接对应四种结构，不用背定义。<\/p>\n<h2>框架四：外部性内部化<\/h2>\n<p><strong>何时用<\/strong>：出现第三方成本或收益时。 <strong>怎么做<\/strong>：把外部成本加到私人成本上（社会成本曲线），或把外部收益加到私人收益上；再选工具（税、补贴、许可证、产权）。<\/p>\n<h2>框架五：弹性定胜负<\/h2>\n<p>任何&quot;谁承担、谁受损&quot;的问题，先问两边的弹性。<\/p>\n<ul><li>\n税负：弹性小的一方多承担。\n<\/li><li>\n政策伤害：弹性小的一方受冲击小。\n<\/li><li>\n收益：弹性小于 1 时涨价增收。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n若 P &gt; ATC → 有钱赚，考虑进入或扩产。\n<\/li><li>\n若 AVC &lt; P &lt; ATC → 亏但继续生产，亏损小于停业。\n<\/li><li>\n若 P &lt; AVC → 停业。\n<\/li><li>\n若 P &gt; AVC 且长期 P &lt; ATC → 退出该行业。\n<\/li><li>\n若某事的边际收益 &gt; 边际成本 → 做；反之不做。\n<\/ul>\n<h2>反模式（作者明确反对的做法）<\/h2>\n<ul><li>\n<strong>把沉没成本算进决策<\/strong>：已经花掉的钱不影响&quot;下一步&quot;，因而不该左右判断。\n<\/li><li>\n<strong>用平均代替边际<\/strong>：平均成本低不代表多生产一单位就赚。\n<\/li><li>\n<strong>把价格管制当万能药<\/strong>：上限造成短缺，下限造成过剩，善意不等于有效。\n<\/li><li>\n<strong>把&quot;保护就业&quot;等同于&quot;禁止进口&quot;<\/strong>：贸易政策不改变总就业，只改变结构。\n<\/li><li>\n<strong>用总量掩盖分配<\/strong>：GDP 与总剩余都不回答&quot;谁得了好处&quot;。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表（微观）<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>均衡<\/td><td>Qd = Qs，解得 P<em> 与 Q<\/em><\/td><\/tr><tr><td>需求价格弹性<\/td><td>E = (ΔQ/Q) ÷ (ΔP/P)；&gt;1 富有弹性<\/td><\/tr><tr><td>收益<\/td><td>TR = P × Q；弹性 &lt;1 时涨价增收<\/td><\/tr><tr><td>消费者剩余<\/td><td>支付意愿 − 实际支付（需求线以上、价格线以下面积）<\/td><\/tr><tr><td>生产者剩余<\/td><td>实际收入 − 成本（价格线以下、供给线以上面积）<\/td><\/tr><tr><td>税收收入<\/td><td>税额 × 税后成交量<\/td><\/tr><tr><td>无谓损失<\/td><td>楔子造成的三角形面积，随弹性增大而增大<\/td><\/tr><tr><td>经济利润<\/td><td>总收益 − 显性成本 − 隐性成本<\/td><\/tr><tr><td>利润最大化<\/td><td>MR = MC；竞争企业 P = MC<\/td><\/tr><tr><td>平均成本<\/td><td>ATC = TC/Q；MC 穿过 ATC 最低点<\/td><\/tr><tr><td>垄断 MR<\/td><td>线性需求 P = a − bQ 时 MR = a − 2bQ<\/td><\/tr><tr><td>边际产量值<\/td><td>VMPL = MPL × P；雇到 VMPL = 工资<\/td><\/tr><tr><td>消费者最优<\/td><td>MRS = Px/Py<\/td><\/tr><\/tbody><\/table>\n<h2>常约定量示例（全书统一）<\/h2>\n<ul><li>\n需求 Qd = 60 − 2P，供给 Qs = 2P − 20 → 均衡 20 元、20 杯。\n<\/li><li>\n6 元税 → 买者付 23、卖者得 17、成交量 14、税收 84、无谓损失 18。\n<\/li><li>\n3 元关税（世界价 15 提到 18）→ 进口从 16 降到 8、关税收入 24、无谓损失 18。\n<\/li><li>\n4 元负外部性 → 社会最优 Q = 16、P = 22、无谓损失 8。\n<\/li><li>\n垄断 D: P = 30 − 0.5Q、MC: P = 10 + Q → Q = 10、P = 25；竞争 Q ≈ 13.3、P ≈ 16.7。\n<\/ul>\n<h2>判断流程<\/h2>\n<ol><li>\n这是哪种市场结构？（数量、差别、壁垒）\n<\/li><li>\n有没有外部性、公共物品、信息不对称？（市场失灵检查）\n<\/li><li>\n决策者面对的是边际问题还是总量问题？\n<\/li><li>\n谁弹性小，谁就多承担成本。\n<\/ol>\n<h2>常见数值记忆<\/h2>\n<ul><li>\n弹性 = 1 时总收入最大。\n<\/li><li>\n税收收入先增后减（拉弗曲线形状），峰值在中等税率。\n<\/li><li>\n垄断价格高于竞争、产量低于竞争，差额造成无谓损失。\n<\/li><li>\n垄断竞争长期：P = ATC &gt; MC，产量低于效率规模。\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452402065600514/01-微观经济学分册", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：经济学十大原理", "href": "#/chapter/ch01"}, {"label": "第 2 章：像经济学家一样思考", "href": "#/chapter/ch02"}, {"label": "第 3 章：相互依存性与贸易的好处", "href": "#/chapter/ch03"}, {"label": "第 4 章：供给与需求的市场力量", "href": "#/chapter/ch04"}, {"label": "第 5 章：弹性及其应用", "href": "#/chapter/ch05"}, {"label": "第 6 章：供给、需求与政府政策", "href": "#/chapter/ch06"}, {"label": "第 7 章：消费者、生产者与市场效率", "href": "#/chapter/ch07"}, {"label": "第 8 章：应用：赋税的代价", "href": "#/chapter/ch08"}, {"label": "第 9 章：应用：国际贸易", "href": "#/chapter/ch09"}, {"label": "第 10 章：外部性", "href": "#/chapter/ch10"}, {"label": "第 11 章：公共物品和公共资源", "href": "#/chapter/ch11"}, {"label": "第 12 章：税制的设计", "href": "#/chapter/ch12"}, {"label": "第 13 章：生产成本", "href": "#/chapter/ch13"}, {"label": "第 14 章：竞争市场上的企业", "href": "#/chapter/ch14"}, {"label": "第 15 章：垄断", "href": "#/chapter/ch15"}, {"label": "第 16 章：垄断竞争", "href": "#/chapter/ch16"}, {"label": "第 17 章：寡头", "href": "#/chapter/ch17"}, {"label": "第 18 章：生产要素市场", "href": "#/chapter/ch18"}, {"label": "第 19 章：收入与歧视", "href": "#/chapter/ch19"}, {"label": "第 20 章：收入不平等与贫困", "href": "#/chapter/ch20"}, {"label": "第 21 章：消费者选择理论", "href": "#/chapter/ch21"}, {"label": "第 22 章：微观经济学前沿", "href": "#/chapter/ch22"}]}, {"label": "概念", "children": [{"label": "机会成本与边际分析", "href": "#/concept/c01"}, {"label": "供给与需求", "href": "#/concept/c02"}, {"label": "弹性", "href": "#/concept/c03"}, {"label": "剩余与效率", "href": "#/concept/c04"}, {"label": "外部性与公共物品", "href": "#/concept/c05"}, {"label": "市场结构谱系", "href": "#/concept/c06"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：经济学十大原理", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：像经济学家一样思考", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：相互依存性与贸易的好处", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：供给与需求的市场力量", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：弹性及其应用", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：供给、需求与政府政策", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：消费者、生产者与市场效率", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：应用：赋税的代价", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：应用：国际贸易", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：外部性", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：公共物品和公共资源", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：税制的设计", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：生产成本", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：竞争市场上的企业", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：垄断", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：垄断竞争", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章：寡头", "href": "#/quiz/ch17"}, {"label": "测验：第 18 章：生产要素市场", "href": "#/quiz/ch18"}, {"label": "测验：第 19 章：收入与歧视", "href": "#/quiz/ch19"}, {"label": "测验：第 20 章：收入不平等与贫困", "href": "#/quiz/ch20"}, {"label": "测验：第 21 章：消费者选择理论", "href": "#/quiz/ch21"}, {"label": "测验：第 22 章：微观经济学前沿", "href": "#/quiz/ch22"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：经济学十大原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n不看笔记说出十大原理，并把每条归入「个人怎么决策 / 人与人怎么打交道 / 整体经济怎么跑」三组中的一组。\n<\/li><li>\n用机会成本这个概念，把一个具体选择（比如读不读研）的代价算成一个数。\n<\/li><li>\n判断一个说法是靠「边际」成立的还是靠「平均」成立的，并指出混用两者会错在哪里。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>资源不够分，所以任何选择都有代价；价格和激励把千万人的选择连成一张网；这张网的总体产出取决于生产率，而它的短期波动被货币和总需求牵着走。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>经济学管的是什么<\/h3>\n<p>经济学研究一件很朴素的事：<strong>资源有限，欲望不那么有限，怎么办<\/strong>。曼昆把这套办法压成十条原理，分成三组。你先把三组记住，再记十条——十条是散的，三组是有结构的。<\/p>\n<h3>第一组：个人怎么决策（原理一至四）<\/h3>\n<p><strong>原理一：人们面临权衡取舍。<\/strong> 要得到一样东西，通常得放弃另一样。这不是道德劝告，是算术：一天 24 小时，学习多一小时，睡觉、打球、刷手机就少一小时。<strong>权衡取舍<\/strong>（trade-off）就是&quot;多要 A 就必须少要 B&quot;这种此消彼长的关系。<\/p>\n<p>一个常见的误读是把&quot;权衡取舍&quot;当成&quot;两样都不好&quot;。恰恰相反，取舍经常发生在两个都想要的东西之间，这才是它让人难受的原因。<\/p>\n<p><strong>原理二：某种东西的成本，是为了得到它所放弃的东西。<\/strong> 这句话定义了一个核心概念：<strong>机会成本<\/strong>（opportunity cost）。它不是&quot;花了多少钱&quot;，而是&quot;因为这些钱和时间，你没能做的另一件事值多少&quot;。<\/p>\n<p>算一个具体的账。假设你读四年大学：学费每年 3 万元，书本住宿每年 2 万元，不读大学去工作每年能挣 6 万元。那么读大学的总机会成本是 (3+2+6)×4 = 44 万元。账面支出只有 20 万元，剩下 24 万元是你没挣到的工资。这就是为什么&quot;上大学贵不贵&quot;这个问题不能只看缴费单。<\/p>\n<p>机会成本里还藏着一个容易漏掉的项：<strong>你已经在里面投进去、收不回来的钱<\/strong>，做决策时不应该再算进去。第 14 章会把它命名为<strong>沉没成本<\/strong>，那里再说。<\/p>\n<p><strong>原理三：理性人考虑边际量。<\/strong> <strong>边际<\/strong>（marginal）指&quot;再多一单位&quot;带来的变化。边际量 = 多一单位带来的额外收益或额外成本。理性人比较的是边际收益和边际成本，不是总量，也不是平均量。<\/p>\n<p>飞机例子最清楚。一架 200 座的飞机已经卖出 190 张票，起飞前还剩 10 个空座。多载一位乘客的<strong>边际成本<\/strong>几乎只有一份餐食和一点燃油，比如 30 元；只要有人愿意出超过 30 元的票价，让他上飞机就是赚的——哪怕这个价格远低于 500 元的平均票价。总量思维会算&quot;平均每座成本 500 元，卖 100 元亏了&quot;，从而拒绝这笔实际上赚钱的交易。<\/p>\n<p><strong>原理四：人们会对激励做出反应。<\/strong> <strong>激励<\/strong>（incentive）是让人改变行为的东西：奖励、惩罚、价格、规则都算。汽油从 7 元涨到 9 元一升，通勤 50 公里的人每月油钱从约 700 元涨到 900 元，一部分人就会改坐地铁、换小排量车、或者搬家。价格变了，行为跟着变，这就是激励在起作用。<\/p>\n<p>这条原理的杀伤力在于它管的是<strong>间接后果<\/strong>。政策改变一个激励，人会绕开它、适应它，结果常常不是设计者想要的。第 6 章的价格管制、第 12 章的税制设计，都在反复演示这一点。<\/p>\n<h3>第二组：人与人怎么打交道（原理五至七）<\/h3>\n<p><strong>原理五：贸易可以使每个人的状况都变得更好。<\/strong> 贸易不是零和。两个人（或两个国家）各做自己相对更擅长的事，再交换，双方的总产出都变多。注意&quot;相对更擅长&quot;这四个字——不是绝对水平高才有得赚，第 3 章的<strong>比较优势<\/strong>会把这件事讲透。<\/p>\n<p><strong>原理六：市场通常是组织经济活动的一种好方法。<\/strong> <strong>市场<\/strong>是买卖双方自发交换的场所与规则。它的核心机制是<strong>价格<\/strong>：价格高说明东西稀缺，生产者多生产、消费者少用；价格低反过来。没有人下命令，几亿人的生产和消费靠价格对上号。曼昆在这里引了亚当·斯密的说法：价格的这种作用像一只&quot;看不见的手&quot;。<\/p>\n<p><strong>原理七：政府有时可以改善市场结果。<\/strong> 市场不是万能的，它需要两样东西才能正常工作：<strong>产权<\/strong>（谁的东西归谁，说清楚）和<strong>竞争<\/strong>（没人能操纵价格）。产权不清，没人愿意投资；一家独大，价格就由卖方定，市场调节失灵。此外还有<strong>外部性<\/strong>——你的行为让别人承担了成本或得到了好处，而价格没有把这笔账算进去，比如工厂排污。这些场合政府出手（保护产权、反垄断、征税或补贴）能让结果变好。<\/p>\n<h3>第三组：整体经济怎么跑（原理八至十）<\/h3>\n<p><strong>原理八：一国的生活水平取决于它生产物品与服务的能力。<\/strong> 这个能力叫<strong>生产率<\/strong>（productivity），指平均每个工人每小时能产出多少东西。生活水平的长期差距，几乎全部来自生产率差距，而不是来自谁更会分配。想让人均收入长期涨，只能让每小时产出涨。<\/p>\n<p><strong>原理九：当政府发行了过多货币时，物价上升。<\/strong> 物价普遍上涨叫<strong>通货膨胀<\/strong>。长期看，通胀的根源是货币量增长过快：流通中的钱多了，而货架上的东西没同比例变多，单位物品就要更多钱来换。这是第 30 章的主题。<\/p>\n<p><strong>原理十：社会面临通货膨胀与失业之间的短期权衡取舍。<\/strong> 短期内，政府多印钱、多花钱能把需求拉起来，企业多招人，失业下降，代价是通胀上升；反过来压通胀，短期失业会上升。这条取舍关系是第 35 章<strong>菲利普斯曲线<\/strong>的起点。注意&quot;短期&quot;三个字：长期里这条取舍不成立。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[资源有限] --&gt; B[第一组 个人决策]\n    A --&gt; C[第二组 人际交换]\n    A --&gt; D[第三组 整体运行]\n    B --&gt; B1[原理一 权衡取舍]\n    B --&gt; B2[原理二 机会成本]\n    B --&gt; B3[原理三 边际量]\n    B --&gt; B4[原理四 激励]\n    C --&gt; C1[原理五 贸易双赢]\n    C --&gt; C2[原理六 市场与价格]\n    C --&gt; C3[原理七 政府补位]\n    D --&gt; D1[原理八 生产率决定生活水平]\n    D --&gt; D2[原理九 货币过多则物价上升]\n    D --&gt; D3[原理十 通胀与失业短期取舍]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：十条原理不是并列的清单。上面一个共同起点（资源有限），下面按&quot;看一个人 / 看两个人以上 / 看整个国家&quot;分三层。考试里问&quot;这条属于哪一组&quot;，靠的就是这张图的分层。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：自助餐。<\/strong> 自助餐一次付清、随便吃，看起来&quot;多吃才回本&quot;，但每多拿一盘，你付出的是胃的空间和吃撑的难受——这就是边际成本随份数上升。吃到第七盘时边际收益已经接近零，理性的人会停。这个类比的失效边界：自助餐的边际成本是身体感受，而真实市场里边际成本是钱和资源，有些商品的边际成本几乎为零（比如一份软件的复制），那时定价逻辑完全不同。<\/p>\n<p><strong>实例：一份决策的四栏账。<\/strong> 小林考虑换工作。新工作月薪多 2000 元，但通勤每天多 1 小时、单程车费多 6 元。按每月 22 个工作日算：<\/p>\n<ul><li>\n边际收益：2000 元/月\n<\/li><li>\n边际成本：车费 6×2×22 = 264 元/月；时间 22 小时/月，若他给自己的闲暇定价 30 元/小时，则 660 元/月\n<\/li><li>\n合计边际成本：924 元/月\n<\/li><li>\n净收益：2000 − 924 = 1076 元/月\n<\/ul>\n<p>结论是换。若他给时间定价 80 元/小时（比如他在做副业），时间成本变 1760 元，净收益只剩 2000−264−1760 = −24 元，结论翻转。同一份工作，因为你给时间定的价不同而结论不同——这正是机会成本在起作用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;成本就是花出去的钱&quot;——实际上成本还包括你因此放弃的收益，也就是机会成本。同一笔学费，对一个能拿到年薪 20 万工作的人，比对一个月薪 4000 的人，贵得多。\n<\/li><li>\n别以为&quot;平均成本低就划算&quot;——实际上决策看边际。平均成本包含已经发生、收不回来的支出，它对&quot;要不要再多做一单&quot;这个问题没有指导意义。\n<\/li><li>\n别以为市场机制等于&quot;政府什么都别管&quot;——实际上原理六和原理七是一对：市场在产权清楚、竞争充分时有效，缺这两个条件时政府介入能改善结果。曼昆既不主张无政府，也不主张全能政府，他要的是分清哪种场合用哪种。\n<\/li><li>\n别以为通胀是&quot;东西变贵了&quot;这么简单——实际上要区分&quot;某样东西涨价&quot;（相对价格变化）和&quot;物价普遍上涨&quot;（通胀）。前者靠供求，后者长期靠货币量。\n<\/ul>\n<ol><li>\n（单选）某人辞去年薪 12 万元的工作去读两年全日制硕士，每年学费与书本费合计 5 万元。他读硕士的机会成本约为多少？\n<p>A. 10 万元  B. 12 万元  C. 22 万元  D. 34 万元 <strong>答案<\/strong>：D；<strong>解析<\/strong>：机会成本 = 账面支出 5×2 = 10 万元 + 放弃的工资 12×2 = 24 万元，合计 34 万元。只加学费得到 10 万元是账面成本，漏掉了放弃的收入。<\/p>\n<\/ol>\n<ol><li>\n（单选）一家影院平时票价 40 元，工作日上午几乎空场。经营者决定加开一场早场，票价 15 元。这个决定是否理性，取决于什么？\n<p>A. 15 元是否高于每张票的平均总成本  B. 15 元是否高于加开一场的边际成本  C. 15 元是否高于 40 元的一半  D. 早场观众是否会在下午再买一张票 <strong>答案<\/strong>：B；<strong>解析<\/strong>：上午场地和设备已经闲置，加开一场的边际成本只有少量人工与电费。只要票价高于边际成本，这笔生意就增加利润；平均成本包含已发生的固定支出，不适用于这个判断。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列哪些属于曼昆所说「政府有时可以改善市场结果」的场合？\n<p>A. 产权界定不清，偷盗与违约频发  B. 某行业由一家企业垄断并自行定价  C. 工厂排污让下游居民承担成本  D. 消费者偏好进口商品而非国产商品 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项分别是产权缺失、市场势力、外部性，都是市场自身无法纠正的失灵。消费者偏好进口货只是偏好，价格机制能正常处理，不需要政府介入。<\/p>\n<\/ol>\n<ol><li>\n（填空）「一国生活水平的长期水平取决于它生产物品与服务的能力」，这个能力在书里叫什么？（两字词）\n<p><strong>答案<\/strong>：生产率；<strong>解析<\/strong>：生产率指平均每个工人每小时产出的物品与服务量。长期看，人均收入的差距几乎完全由生产率差距解释。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三组十原理：个人决策（取舍、机会成本、边际、激励）、人际交换（贸易、市场、政府）、整体运行（生产率、货币、短期取舍）。\n<\/li><li>\n机会成本 = 账面支出 + 放弃的收益；沉没成本不进决策。\n<\/li><li>\n决策比较的是边际收益与边际成本，不是平均值。\n<\/ul>", "ch02": "<h1>第 2 章：像经济学家一样思考<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清经济学家做研究的三步循环，并解释为什么模型必须靠假设简化。\n<\/li><li>\n画出生产可能性边界，并说明边界上的点、边界内的点、边界外移各自对应经济里的什么状态。\n<\/li><li>\n分清一个主张是实证的（可验证对错）还是规范的（取决于价值判断）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>经济学用模型干活：模型是刻意简化过的因果结构，判断它好不好不看&quot;像不像现实&quot;，而看它能不能把关键机制说清、能不能给出可被证伪的预测。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>经济学家怎么工作<\/h3>\n<p>经济学被当作一门科学，不是因为它用了数学，而是因为它走同一套循环：<strong>观察 → 提出理论 → 作出预测 → 再观察检验<\/strong>。理论被证实就保留，被推翻就修改。这套循环有个硬要求——预测必须能被现实打脸，也就是<strong>可证伪<\/strong>。一个&quot;无论发生什么都成立&quot;的说法不算科学理论。<\/p>\n<h3>为什么必须做假设<\/h3>\n<p>现实里影响一件事的变量有几十个，全放进去模型就没法用。所以经济学家会假设一部分变量不变，只留少数几个。这不叫逃避，这叫隔离变量——和物理课在真空管里测自由落体是同一招。<\/p>\n<p>关键判据：<strong>假设合不合理，不看它是否符合现实，而看它是否抓住了要解释的问题的要害。<\/strong> 研究国际贸易对物价的影响，可以假设&quot;人们的口味不变&quot;，因为口味在一两年内确实变化很小；研究广告效果时，就不能这么假设。<\/p>\n<h3>两个入门模型<\/h3>\n<p><strong>模型一：循环流量图。<\/strong> 它把经济画成两拨人（家庭、企业）和两个市场（物品与服务市场、生产要素市场）。家庭在生产要素市场出卖劳动和资本，换到收入；再在物品与服务市场花钱买回产品。钱和实物朝相反方向流。这个模型回答的是&quot;经济里的钱和东西怎么循环起来&quot;，不回答&quot;总量是多少&quot;。<\/p>\n<p><strong>模型二：生产可能性边界。<\/strong> 假设一个国家只生产两种东西，比如汽车和电脑。把全部资源都用上，能产出的组合画成一条曲线，就是<strong>生产可能性边界<\/strong>（production possibility frontier）。三个位置各有用处：<\/p>\n<ul><li>\n边界上的点：资源被充分且有效率地使用，多产一辆车就必然少产若干台电脑。\n<\/li><li>\n边界内的点：资源没被充分利用或使用低效，这时可以同时多产两种东西。\n<\/li><li>\n边界向外移：资源变多（比如发现新矿、人口增加）或技术变强，整体生产能力提高。\n<\/ul>\n<p>这里已经埋下两个词：<strong>效率<\/strong>（边界上）与<strong>增长<\/strong>（边界外移）。第 7 章会把效率讲成&quot;总剩余最大&quot;，第 25 章会把增长讲成&quot;边界外移&quot;。<\/p>\n<h3>微观与宏观<\/h3>\n<p><strong>微观经济学<\/strong>研究单个决策者怎么选择——一个家庭、一家企业、一个市场。<strong>宏观经济学<\/strong>研究整体变量——通胀、失业、经济增长。两者不是大小之分那么粗糙：宏观的很多结论要靠微观行为加总起来，所以第 33 章讲总需求时，仍然是在说千万个家庭和企业怎么反应。<\/p>\n<h3>两种身份：科学家与政策顾问<\/h3>\n<p>作为科学家，经济学家做<strong>实证分析<\/strong>（positive analysis）：这件事是什么样、某政策会导致什么结果，对错可由事实检验。作为顾问，经济学家做<strong>规范分析<\/strong>（normative analysis）：这件事应该怎么办，里面必然掺进价值判断——&quot;效率高&quot;和&quot;公平&quot;哪个更重要，不是数据能回答的。<\/p>\n<h3>为什么经济学家总吵架<\/h3>\n<p>三个来源：一是<strong>科学判断不同<\/strong>，对同一组数据的解读不一样，比如最低工资对就业的影响到底多大；二是<strong>价值观不同<\/strong>，同样认可&quot;这项政策让总产出增加 1%，但低收入者受损&quot;，有人叫好有人反对；三是<strong>感觉与现实不符<\/strong>，外行凭直觉形成的印象和统计结果冲突。<\/p>\n<p>另外，好建议不被采纳还有一层原因：政策的效果分布不均，受损的一方往往组织得更紧密、声音更大，而受益的一方分散且收益小。第 34 章讲财政政策、第 36 章讲政策争论时会再遇到这个问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[观察现实] --&gt; B[提出理论]\n    B --&gt; C[作出预测]\n    C --&gt; D[再观察检验]\n    D --&gt;|预测成立| B\n    D --&gt;|预测失败| E[修改理论或假设]\n    E --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一个闭环，不是直线。重点看&quot;预测失败&quot;那条回路——没有这条回路，理论就退化成信仰。<\/p>\n<h3>读图的三个基本功（书上附录的图形工具）<\/h3>\n<ol><li>\n<strong>斜率<\/strong>：纵轴变量变化 ÷ 横轴变量变化。需求曲线斜率为负，价格涨、需求量降。\n<\/li><li>\n<strong>沿曲线移动 vs 曲线移动<\/strong>：价格变化让点沿着需求曲线滑动；收入、偏好、替代品价格变化会让整条曲线平移。这两个说法混用是初学者最常见的错，第 4 章会用大量篇幅纠正。\n<\/li><li>\n<strong>图形不是因果<\/strong>：图上两个变量同向变动，只说明相关。因果要靠模型里的机制来支撑。\n<\/ol>\n<h2>类比与实例<\/h2>\n<p><strong>类比：地图。<\/strong> 模型像地图。一张 1:1 的地图等于把城市复制一遍，没法用；好的地图只画你要用的东西——坐地铁看线路图，开车看道路图。判断地图好坏的标准是&quot;够不够用&quot;，不是&quot;全不全&quot;。类比的失效边界：地图不改变城市本身，而经济模型会改变人的行为（政策一旦公布，人会提前反应），这一层地图没有。<\/p>\n<p><strong>实例：用生产可能性边界算代价。<\/strong> 某国全部资源用于生产，能造 100 辆汽车或 200 台电脑，中间组合按直线变化。那么少造 1 辆汽车，可以多造 2 台电脑——这就是&quot;汽车的机会成本是 2 台电脑&quot;。若技术改进使电脑产能翻倍，边界在电脑轴的截距从 200 变成 400，这就是增长。注意：这里是直线边界（资源完全可互换）；资源不完全可互换时边界会外凸，第 21 章讲消费者选择时会用到这个形状差异。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;模型简化就是不严谨&quot;——实际上简化是模型能用的前提，不严谨指的是简化错了要害，而不是简化本身。\n<\/li><li>\n别以为&quot;经济学家意见不一致说明这门学科不科学&quot;——实际上分歧有一部分正来自可检验的科学判断，这恰恰是科学活动的常态；另一部分来自价值判断，那本来就不是科学能裁决的。\n<\/li><li>\n别以为宏观经济学就是把微观结论放大——实际上加总会产生新现象，比如&quot;每个人都省钱&quot;在个人层面是理性，加总起来会让总需求下降、所有人收入更低。\n<\/ul>\n<ol><li>\n（单选）经济学家在模型中假设「其他条件不变」，这个做法最恰当的理由是？\n<p>A. 为了让数学推导更简单  B. 为了把要研究的变量从其他干扰因素中隔离出来  C. 因为现实中其他条件确实永远不变  D. 为了让结论更容易被大众接受 <strong>答案<\/strong>：B；<strong>解析<\/strong>：假设的作用是隔离变量，和实验里控制其他条件同理。判断假设是否合理，看它是否抓住了要解释的问题的要害，而不是看它是否与现实完全一致。<\/p>\n<\/ol>\n<ol><li>\n（单选）一国的生产组合落在生产可能性边界内部，最合理的解释是？\n<p>A. 该国的技术已经落后于边界  B. 资源未被充分利用或使用效率低  C. 该国在两种产品上都已达到最优产量  D. 该国的机会成本为零 <strong>答案<\/strong>：B；<strong>解析<\/strong>：边界内的点意味着还有资源闲置或使用效率不足，此时可以同时增加两种产品的产量；边界本身代表既定资源和技术下的最大产出组合。<\/p>\n<\/ol>\n<ol><li>\n（填空）「最低工资应不应该提高到每小时 15 元」属于实证分析还是规范分析？\n<p><strong>答案<\/strong>：规范分析；<strong>解析<\/strong>：「应不应该」包含价值判断，无法只靠事实检验。若问「提高到 15 元会使青年失业率上升多少」，那才是实证分析。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n科学循环：观察—理论—预测—检验，关键是可证伪。\n<\/li><li>\n生产可能性边界：边界上代表有效率，边界内代表资源闲置，外移代表增长。\n<\/li><li>\n实证分析问&quot;是什么&quot;，规范分析问&quot;应该怎样&quot;。\n<\/ul>", "ch03": "<h1>第 3 章：相互依存性与贸易的好处<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章（机会成本）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「机会成本」算出两个生产者的比较优势分别在哪一项。\n<\/li><li>\n分清绝对优势与比较优势，并解释为什么只有比较优势才决定该不该分工。\n<\/li><li>\n给出一组具体的交换比例，算出双方各自从贸易中得到的净收益。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>分工的标准不是「谁做得更好」，而是「谁为此放弃得更少」——比较优势决定谁该做什么，贸易让双方用各自放弃更少的东西换到对方放弃更多的东西。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一个现代寓言<\/h3>\n<p>书里用一个农民和一个牧场主开场。<\/p>\n<ul><li>\n牧场主：8 小时能产 24 磅土豆，或者 12 盎司牛肉。\n<\/li><li>\n农民：8 小时能产 48 磅土豆，或者 8 盎司牛肉。\n<\/ul>\n<p>两个人都要吃饭，都要吃土豆和牛肉。问题是：各干各的然后交换，还是各干各的但都自己种土豆、自己养牛？<\/p>\n<p>先算<strong>机会成本<\/strong>（为了得到一单位某物而放弃的另一物的数量）：<\/p>\n<ul><li>\n牧场主每产出 1 盎司牛肉，放弃 24/12 = 2 磅土豆。\n<\/li><li>\n农民每产出 1 盎司牛肉，放弃 48/8 = 6 磅土豆。\n<\/ul>\n<p>也就是说，同样 1 盎司牛肉，牧场主只花 2 磅土豆的代价，农民要花 6 磅。反过来看土豆：牧场主 1 磅土豆的代价是 1/2 盎司牛肉，农民是 1/6 盎司。农民做土豆便宜，牧场主做牛肉便宜。<\/p>\n<h3>绝对优势与比较优势<\/h3>\n<p><strong>绝对优势<\/strong>（absolute advantage）：用同样的投入，谁产出的更多。这里看 8 小时：牧场主土豆 24 磅 &lt; 农民 48 磅，牛肉 12 盎司 &gt; 农民 8 盎司。牧场主在牛肉上有绝对优势，农民在土豆上有绝对优势。<\/p>\n<p><strong>比较优势<\/strong>（comparative advantage）：谁生产某物的机会成本更低。牧场主牛肉的机会成本 2 磅土豆 &lt; 农民 6 磅，所以牧场主在牛肉上有比较优势；农民土豆的机会成本 1/6 盎司牛肉 &lt; 牧场主 1/2 盎司，所以农民在土豆上有比较优势。<\/p>\n<p>这里两者恰好一致，看起来没必要区分。但有大量情形两者会分开，一旦分开，<strong>决定分工的是比较优势，不是绝对优势<\/strong>。书上用运动员的例子把这一点钉住：一位顶级运动员修剪自家草坪比邻居快得多（有绝对优势），但他每小时的出场收入远高于邻居，所以修剪草坪的机会成本极高，他该做的是雇邻居来剪，自己去打球。<\/p>\n<h3>贸易怎么让双方都赚<\/h3>\n<p>接着上面的例子，假设交换比例是 3 盎司牛肉换 9 磅土豆。<\/p>\n<p>牧场主的角度：他拿到 9 磅土豆，为此付出 3 盎司牛肉。而 3 盎司牛肉在他手里只值 3×2 = 6 磅土豆。用 6 磅土豆的代价换到 9 磅土豆，净赚 3 磅土豆。<\/p>\n<p>农民的角度：他拿到 3 盎司牛肉，为此付出 9 磅土豆。而 3 盎司牛肉若自己生产要花 3×6 = 18 磅土豆。用 9 磅土豆换到值 18 磅的东西，净赚相当于 9 磅土豆。<\/p>\n<p>两边都赚，因为各自都在做自己机会成本低的那件事。这就是&quot;贸易不是零和&quot;的算术版本——不是谁占了谁便宜，而是分工本身让总产出变多。<\/p>\n<h3>交换比例落在哪<\/h3>\n<p>谈判的区间由双方的机会成本夹住：1 盎司牛肉的价格必须在 2 磅到 6 磅土豆之间。低于 2 磅，牧场主不干（不如自己种土豆）；高于 6 磅，农民不买（不如自己养牛）。具体落在区间哪一点，取决于谈判能力，但双方都有得赚这一点不依赖谈判能力。<\/p>\n<h3>从两个人到两个国家<\/h3>\n<p>同一个逻辑适用于国家。<strong>世界价格<\/strong>和国内价格的差异决定一国该出口还是进口。这一章只搭框架，第 9 章会把关税、赢家输家、以及&quot;为什么贸易政策常常走向保护主义&quot;讲完。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TB\n    A[同样 8 小时] --&gt; B[牧场主]\n    A --&gt; C[农民]\n    B --&gt; B1[土豆 24 磅 或 牛肉 12 盎司]\n    C --&gt; C1[土豆 48 磅 或 牛肉 8 盎司]\n    B1 --&gt; D[1 盎司牛肉 = 2 磅土豆]\n    C1 --&gt; E[1 盎司牛肉 = 6 磅土豆]\n    D --&gt; F[牧场主在牛肉上有比较优势]\n    E --&gt; G[农民在土豆上有比较优势]\n    F --&gt; H[分工后交换 双方都赚]\n    G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：图里没有出现&quot;谁更强&quot;。判断依据一路沿到最后的都是&quot;机会成本&quot;那一列数字。这就是比较优势的算法本质：只看放弃的量，不看产出的绝对大小。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：两个同事换班。<\/strong> A 换一个夜班要放弃两小时睡眠，B 换一个夜班要放弃四小时睡眠。那么夜班该由 A 多承担，白班该由 B 多承担，两人换班后总睡眠损失最小。类比的失效边界：同事换班可以靠&quot;总损失最小&quot;直接判断，因为两人的偏好是私人的；国家间的比较优势会随资源、技术变化而改变，不是固定属性。<\/p>\n<p><strong>实例：两个小工厂。<\/strong> 甲厂一天能产 200 个零件或 50 个组件；乙厂一天能产 100 个零件或 50 个组件。甲厂在零件上有绝对优势（200 &gt; 100），组件上两者持平。机会成本：甲厂 1 个组件 = 4 个零件，乙厂 1 个组件 = 2 个零件。乙厂在组件上有比较优势。所以甲厂做零件、乙厂做组件，再按&quot;1 个组件换 3 个零件&quot;交换：乙厂用 2 个零件的代价换到 3 个，赚 1 个；甲厂用 3 个零件的代价换到值 4 个零件的组件，也赚 1 个。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;我样样都比你强，就不需要跟你贸易&quot;——实际上决定分工的是比较优势。强者在每项上都有绝对优势时，仍然应该把机会成本最高的那项交出去。\n<\/li><li>\n别以为贸易是&quot;一方赢一方输&quot;——实际上自愿交换的双方都得到净收益，否则交易不会发生。真正的问题是有第三方受损（比如进口竞争行业的工人），这属于分配问题，不是贸易本身不创造价值。\n<\/li><li>\n别以为比较优势是&quot;天生擅长&quot;——实际上它由机会成本决定，而机会成本由资源和技术决定。资源变了，比较优势就会变。\n<\/ul>\n<ol><li>\n（单选）甲 1 小时能产 10 件衣服或 5 台电视，乙 1 小时能产 8 件衣服或 2 台电视。谁在电视上有比较优势？\n<p>A. 甲，因为他单位时间产量更高  B. 乙，因为他放弃的衣服更少  C. 甲，因为 1 台电视只放弃 2 件衣服  D. 两人都没有 <strong>答案<\/strong>：C；<strong>解析<\/strong>：机会成本：甲 1 台电视 = 2 件衣服，乙 1 台电视 = 4 件衣服。甲的机会成本更低，所以甲在电视上有比较优势。顺带可见甲在衣服上也有绝对优势，但乙在衣服上的机会成本是 0.25 台电视，仍低于甲的 0.5 台，所以乙在衣服上有比较优势。<\/p>\n<\/ol>\n<ol><li>\n（单选）某顶级外科医生做手术的收费是每小时 3000 元，他打扫自己家的效率也比保洁员高一倍。按比较优势，他应该？\n<p>A. 自己打扫，因为他效率更高  B. 请保洁员，因为他打扫的机会成本远高于保洁费  C. 自己打扫，因为请人还要花时间沟通  D. 两人都不打扫，等家人来收拾 <strong>答案<\/strong>：B；<strong>解析<\/strong>：效率高只是绝对优势。他打扫一小时放弃的是 3000 元收入，机会成本远高于保洁费，所以应由机会成本更低的人做。绝对优势在这里完全不影响结论。<\/p>\n<\/ol>\n<ol><li>\n（填空）牧场主 1 盎司牛肉的机会成本是 2 磅土豆，农民是 6 磅土豆。两人交换牛肉时，1 盎司牛肉的土豆价格必须落在什么区间内才可能成交？\n<p><strong>答案<\/strong>：2 到 6 磅之间；<strong>解析<\/strong>：低于 2 磅牧场主宁可自己种土豆，高于 6 磅农民宁可自己养牛。区间之内双方都能从交换中获益，具体落在哪一点取决于谈判。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较优势看机会成本，绝对优势看同等投入下的产出量。\n<\/li><li>\n分工按比较优势来，贸易的谈判区间夹在双方的机会成本之间。\n<\/li><li>\n自愿交换双方都赚，赚的是&quot;用自己放弃更少的东西换到对方放弃更多的东西&quot;。\n<\/ul>", "ch04": "<h1>第 4 章：供给与需求的市场力量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清「需求量变化」与「需求变化」，说清各自由什么引起、在图上是滑动还是平移。\n<\/li><li>\n给定需求与供给方程，算出均衡价格与均衡数量。\n<\/li><li>\n遇到任何一条新闻（涨价、限价、新技术、人口变化），用三步法推出它对价格和数量的影响方向。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>价格不是谁定的，它是买者和卖者各自打算的汇总结果：在这个价格上，想买的量恰好等于想卖的量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>市场与竞争<\/h3>\n<p><strong>市场<\/strong>是买者与卖者交换某种物品或服务的场所与规则。它不必有实体场地——二手房平台、招聘网站都是市场。<\/p>\n<p><strong>竞争市场<\/strong>（competitive market）指买者和卖者都很多、每家的量都小到无法影响价格的市场。它通常满足三条：产品基本相同、买卖双方人数众多、进出自由。这样的市场里，单个卖者只能接受市场价，这种价格叫<strong>市场价格<\/strong>。<\/p>\n<p>严格意义上的&quot;完全竞争&quot;是理想型，现实里还有三种偏离：一家独大（垄断，第 15 章）、少数几家（寡头，第 17 章）、很多家但产品各有差别（垄断竞争，第 16 章）。这一章先把最基础的完全竞争讲清楚，后面三种都是拿它当参照系。<\/p>\n<h3>需求<\/h3>\n<p><strong>需求量<\/strong>（quantity demanded）是在某个具体价格下，买者愿意并且能够买到的数量。注意&quot;愿意并且能够&quot;：只有愿望没有支付能力不算需求。<\/p>\n<p><strong>需求法则<\/strong>：其他条件不变时，价格上升，需求量下降。原因很直接——价格贵了，一部分人改用替代品（奶茶贵了喝咖啡），一部分人干脆少买。<\/p>\n<p>把不同价格与对应需求量列成表是<strong>需求表<\/strong>，画成图是<strong>需求曲线<\/strong>。需求曲线通常向右下方倾斜。市场价格是所有买者需求量的水平加总：价格 20 元时甲买 8 杯、乙买 12 杯，市场就是 20 杯。<\/p>\n<p>用一个具体方程演算。设某奶茶市场：<\/p>\n<ul><li>\n需求：Qd = 60 − 2P\n<\/li><li>\n供给：Qs = 2P − 20\n<\/ul>\n<p>先列表感受一下：P = 10 时 Qd = 40，P = 20 时 Qd = 20，P = 30 时 Qd = 0。<\/p>\n<h3>需求曲线的移动（最容易错的地方）<\/h3>\n<p>价格变化让点<strong>沿着<\/strong>曲线滑动，叫<strong>需求量变化<\/strong>。除此之外的因素变化会让整条曲线<strong>平移<\/strong>，叫<strong>需求变化<\/strong>。五个常见因素：<\/p>\n<ol><li>\n<strong>收入<\/strong>。收入增加，正常商品（大多数商品）需求增加、曲线右移；廉价替代品（比如方便面）可能反向，这类叫劣等品。\n<\/li><li>\n<strong>偏好<\/strong>。流行趋势、健康观念变化。\n<\/li><li>\n<strong>替代品与互补品的价格<\/strong>。替代品（奶茶与咖啡）价格上升，本商品需求增加、右移；互补品（奶茶与珍珠）价格上升，本商品需求减少、左移。\n<\/li><li>\n<strong>预期<\/strong>。预期明天涨价，今天多买，右移。\n<\/li><li>\n<strong>买者数量<\/strong>。人口流入，右移。\n<\/ol>\n<h3>供给<\/h3>\n<p><strong>供给量<\/strong>（quantity supplied）是在某个价格下，卖者愿意并且能够卖出的数量。<strong>供给法则<\/strong>：其他条件不变时，价格上升，供给量增加——高价能覆盖更高的成本，也能让边际生产者进场。<\/p>\n<p>让供给曲线整条移动的因素有四个：<strong>投入品价格<\/strong>（牛奶、房租涨，左移）、<strong>技术<\/strong>（新设备提高效率，右移）、<strong>预期<\/strong>（预期涨价先囤货，短期左移）、<strong>卖者数量<\/strong>（新店开张，右移）。<\/p>\n<h3>均衡<\/h3>\n<p><strong>均衡<\/strong>（equilibrium）是供给量恰好等于需求量的状态，对应的价格叫<strong>均衡价格<\/strong>，数量叫<strong>均衡数量<\/strong>。<\/p>\n<p>用上面的方程解：60 − 2P = 2P − 20，得 4P = 80，P<em> = 20，代回 Q<\/em> = 20。<\/p>\n<p>如果市场价高于 20，比如 25：Qd = 10，Qs = 30，多出 20 杯卖不掉，这是<strong>过剩<\/strong>。卖不掉的库存迫使卖者降价，价格回落。如果市场价低于 20，比如 15：Qd = 30，Qs = 10，缺 20 杯，这是<strong>短缺<\/strong>。排队的人愿意加价，价格回升。这两种力量把价格推回均衡。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 4 章示例：奶茶市场<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><line x1=\"223.3\" y1=\"157.6\" x2=\"223.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"223.3\" y1=\"157.6\" x2=\"70.0\" y2=\"157.6\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"235.6\" y=\"146.7\" font-size=\"11.5\" fill=\"#111827\">均衡 E 20 元 20 杯<\/text><text x=\"453.3\" y=\"148.5\" font-size=\"11.5\" fill=\"#111827\">P*=20 元<\/text><text x=\"453.3\" y=\"203.2\" font-size=\"11.5\" fill=\"#111827\">Q*=20 杯<\/text><text x=\"93.0\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">交点即均衡：20 元、20 杯<\/text><\/svg>\n<p>看图说明：两条直线的交点就是均衡。横虚线读到 20 元，竖虚线读到 20 杯。注意蓝线斜率 −1/2（价格每降 1 元，需求量增加 2 杯），红线斜率 +1/2——斜率的大小由方程系数决定，不是随手画的。<\/p>\n<h3>三步分析法<\/h3>\n<p>书上给了一套固定动作，遇到任何冲击都照做：<\/p>\n<ol><li>\n判断这件事影响需求、影响供给，还是两者都影响。\n<\/li><li>\n判断曲线是左移还是右移。\n<\/li><li>\n画出移动前后的两条线，读出均衡价格与数量的变化方向。\n<\/ol>\n<p>例：夏季高温。影响需求（偏好），需求右移。结果：均衡价格上升，均衡数量上升。 例：牛奶涨价。影响供给（投入品价格），供给左移。结果：价格上升，数量下降。 例：同时发生。需求右移 + 供给左移：价格一定上升，数量方向说不准，取决于两者幅度。这一点必须记住——<strong>两条曲线同向变动时，有一个变量是无法确定的<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;需求增加&quot;和&quot;需求量增加&quot;是一回事——实际上前者是整条曲线右移（由价格以外的因素引起），后者是沿曲线滑动（由价格本身引起）。这两个词混用，后面讲弹性、讲税收归宿会全线出错。\n<\/li><li>\n别以为高价一定意味着需求强——实际上价格上升本身会压低需求量。看到&quot;涨价还卖得好&quot;，要找的是曲线右移的原因（收入、偏好、替代品涨价），而不是把价格上涨当成需求增加。\n<\/li><li>\n别以为均衡是&quot;大家都满意的价格&quot;——实际上均衡只保证想买的量等于想卖的量，不保证买者觉得便宜或卖者觉得赚。均衡是机制的结果，不是道德评价。\n<\/li><li>\n别以为供给曲线永远向右上——实际上它反映的是边际成本随产量上升；如果技术进步让成本随规模下降（比如软件），供给曲线可以向下，第 15 章的自然垄断就是这种情况。\n<\/ul>\n<ol><li>\n（单选）奶茶市场的需求为 Qd = 60 − 2P，供给为 Qs = 2P − 20。均衡价格与均衡数量是？\n<p>A. P=15，Q=30  B. P=20，Q=20  C. P=25，Q=10  D. P=10，Q=40 <strong>答案<\/strong>：B；<strong>解析<\/strong>：令 60 − 2P = 2P − 20，得 4P = 80，P = 20；代回任一式得 Q = 20。P=25 时 Qd=10、Qs=30 是过剩，P=15 时是短缺。<\/p>\n<\/ol>\n<ol><li>\n（单选）咖啡豆价格上涨，在其他条件不变的情况下，奶茶市场会出现什么变化？\n<p>A. 奶茶需求曲线右移，价格与数量都上升  B. 奶茶供给曲线左移，价格上升、数量下降  C. 奶茶需求曲线左移，价格与数量都下降  D. 奶茶供给曲线右移，价格下降、数量上升 <strong>答案<\/strong>：A；<strong>解析<\/strong>：咖啡是奶茶的替代品。替代品价格上升，消费者转向奶茶，奶茶需求曲线右移，均衡价格与数量同时上升。注意这不是奶茶成本变化，所以供给不动。<\/p>\n<\/ol>\n<ol><li>\n（单选）某年夏天既流行喝奶茶（需求右移），同时牛奶大幅涨价（供给左移）。可以确定的是？\n<p>A. 价格上涨，数量方向不确定  B. 价格与数量都上涨  C. 价格方向不确定，数量上涨  D. 价格与数量都下降 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求右移推高价格与数量，供给左移推高价格、压低数量。价格方向一致所以确定上涨；数量一增一减，最终取决于两个冲击的幅度，无法确定。<\/p>\n<\/ol>\n<ol><li>\n（填空）「某商品价格从 20 元降到 15 元，其需求量从 20 杯增到 30 杯」，这属于需求量变化还是需求变化？\n<p><strong>答案<\/strong>：需求量变化；<strong>解析<\/strong>：由价格本身引起的变动是沿曲线滑动，叫需求量变化。若收入、偏好、替代品价格等变化，才是整条曲线平移的需求变化。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n需求法则：价格升，需求量降；供给法则：价格升，供给量增。\n<\/li><li>\n沿曲线滑动 = 价格引起；曲线平移 = 收入、偏好、替代品、预期、人数、成本、技术引起。\n<\/li><li>\n解均衡就是令 Qd = Qs；过剩压价、短缺抬价，两个方向都自动回归。\n<\/ul>", "ch05": "<h1>第 5 章：弹性及其应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用中点法算出需求价格弹性，并判断它是富有弹性还是缺乏弹性。\n<\/li><li>\n说明为什么「富有弹性的商品降价能增加总收益」，而「缺乏弹性的商品涨价能增加总收益」。\n<\/li><li>\n用弹性解释三件事：农业技术进步为什么让农民收入下降、OPEC 减产为什么短期有效长期失效、禁毒为什么可能推高相关犯罪。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>弹性衡量「价格动一点，数量动多少」。它决定了冲击的代价落在谁身上：数量反应大，价格就不敢乱动；数量反应小，价格就被推得很远。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么需要弹性<\/h3>\n<p>第 4 章说&quot;价格上升，需求量下降&quot;，但没说降多少。这个&quot;多少&quot;就是<strong>弹性<\/strong>（elasticity）。它是两个百分比之比，不是两个绝对量之比——这一点必须在一开始就固定住，否则后面所有结论都会错位。<\/p>\n<p><strong>需求价格弹性<\/strong> = 需求量变动的百分比 ÷ 价格变动的百分比。<\/p>\n<p>为什么用百分比：这样不同商品、不同单位之间可以比较。苹果涨 1 元和大米涨 1 元，含义完全不同；苹果涨 10% 和大米涨 10%，才可比。<\/p>\n<h3>中点法<\/h3>\n<p>直接算百分比会遇到一个尴尬：从 20 元降到 15 元，按起点算是降 25%；从 15 元涨回 20 元，按起点算是涨 33%。同一个区间，两个方向算出两个弹性。<\/p>\n<p><strong>中点法<\/strong>（midpoint method）用两端平均值作分母，把方向差异消掉：<\/p>\n<ul><li>\n数量变动率 = (Q₂ − Q₁) ÷ [(Q₁ + Q₂)/2]\n<\/li><li>\n价格变动率 = (P₂ − P₁) ÷ [(P₁ + P₂)/2]\n<\/li><li>\n弹性 = 前者 ÷ 后者的绝对值\n<\/ul>\n<p>算一个具体例子。奶茶从 25 元降到 20 元，需求量从 10 杯增到 20 杯：<\/p>\n<ul><li>\n数量变动率 = (20 − 10) ÷ 15 = 10/15 = 66.7%\n<\/li><li>\n价格变动率 = (20 − 25) ÷ 22.5 = −5/22.5 = −22.2%\n<\/li><li>\n弹性 = 66.7 ÷ 22.2 ≈ 3.0\n<\/ul>\n<p>3.0 大于 1，说明在这个区间需求<strong>富有弹性<\/strong>（elastic）：价格降 1%，需求量涨约 3%。<\/p>\n<h3>弹性的五种档位<\/h3>\n<ul><li>\n弹性 &gt; 1：富有弹性，需求曲线比较平。\n<\/li><li>\n弹性 &lt; 1：缺乏弹性，曲线比较陡。\n<\/li><li>\n弹性 = 1：单位弹性，需求量与价格同比例反向变动。\n<\/li><li>\n弹性 = 0：完全无弹性，需求曲线是垂直线，价格怎么变数量都不变（比如救命的胰岛素）。\n<\/li><li>\n弹性 → ∞：完全弹性，需求曲线是水平线，价格高于某一水平就一个也卖不出去。\n<\/ul>\n<h3>什么决定弹性大小<\/h3>\n<p>四个因素，按重要性排：<\/p>\n<ol><li>\n<strong>替代品的可得性<\/strong>。替代品多，涨价就跑，弹性大；替代品少，只能忍，弹性小。这是最主要的决定因素。\n<\/li><li>\n<strong>必需品还是奢侈品<\/strong>。必需品弹性小，奢侈品弹性大。\n<\/li><li>\n<strong>市场定义的宽窄<\/strong>。&quot;水果&quot;的市场定义宽，替代品少，弹性小；&quot;苹果&quot;定义窄，可以换成梨、橙，弹性大。\n<\/li><li>\n<strong>时间长短<\/strong>。时间越长，越能调整习惯、找到替代方案，弹性越大。这一条在第 5 章末尾的 OPEC 案例里是主角。\n<\/ol>\n<h3>弹性与总收益<\/h3>\n<p><strong>总收益<\/strong> TR = P × Q。价格变动时，P 和 Q 朝相反方向走，结果取决于谁变得更多：<\/p>\n<ul><li>\n富有弹性（E &gt; 1）：降价时，Q 增加的比例大于 P 下降的比例，TR 上升。涨价则 TR 下降。\n<\/li><li>\n缺乏弹性（E &lt; 1）：涨价时，Q 减少的比例小于 P 上升的比例，TR 上升。降价则 TR 下降。\n<\/li><li>\n单位弹性：价格变动不改变 TR。\n<\/ul>\n<p>用上面的数字验证：P = 25、Q = 10 时 TR = 250；P = 20、Q = 20 时 TR = 400。降价 5 元，收益多 150 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 5 章示例：总收益 = P × Q<\/text><polygon points=\"70.0,340.0 223.3,340.0 223.3,157.6 70.0,157.6\" fill=\"#ea580c\" fill-opacity=\"0.25\" stroke=\"none\"/><text x=\"146.7\" y=\"248.8\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">TR=400 元<\/text><polygon points=\"70.0,157.6 146.7,157.6 146.7,112.1 70.0,112.1\" fill=\"#16a34a\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"108.3\" y=\"134.9\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">TR=250 元<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"230.3\" y=\"150.6\" font-size=\"11.5\" fill=\"#111827\">P=20, Q=20<\/text><circle cx=\"146.7\" cy=\"112.1\" r=\"4\" fill=\"#111827\"/><text x=\"153.7\" y=\"105.1\" font-size=\"11.5\" fill=\"#111827\">P=25, Q=10<\/text><\/svg>\n<p>看图说明：橙色矩形是降价后 20×20 = 400 元，绿色小矩形是原来的 25×10 = 250 元。降价带来的是&quot;宽度大幅增加、高度小幅减少&quot;，面积净增。这也解释了为什么线性需求曲线的上半段（价格高、弹性大）降价能增收，下半段（弹性小）降价反而减收。<\/p>\n<h3>线性需求曲线上的弹性不是常数<\/h3>\n<p>直线斜率固定，但弹性不是。原因是百分比的分母在变：价格高时基数大，同样的价格变动对应的百分比小，而数量基数小、变动百分比大，所以上半段弹性大；越往下走，弹性越小。<strong>中点处弹性等于 1<\/strong>。这条结论在图形题里经常被考。<\/p>\n<h3>供给弹性<\/h3>\n<p><strong>供给价格弹性<\/strong> = 供给量变动百分比 ÷ 价格变动百分比。它也分富有、缺乏、单位弹性。决定因素主要是<strong>时间<\/strong>：短期内工厂产能固定，供给弹性小；长期可以新建厂房，弹性大。此外还有闲置产能多不多、库存好不好存。<\/p>\n<h3>三个应用<\/h3>\n<p><strong>应用一：农业技术进步。<\/strong> 粮食需求缺乏弹性（人吃饱了就那么多），技术进步让供给右移，价格大幅下跌、数量只小幅增加。结果：消费者受益，农民总收入反而下降。这就是&quot;农业技术进步让农民变穷&quot;的机制——不是产量少了，是价格跌得比数量增得多。它也解释了农业补贴与价格支持政策的由来。<\/p>\n<p><strong>应用二：OPEC 减产。<\/strong> 石油短期需求弹性小（开车、取暖没法立刻改），减产 10% 能让价格涨很多，收入上升。但时间一长，人们换小车、改乘公交、开发替代能源，需求弹性变大，减产的效果被抵消，价格回落。<strong>短期有效、长期失效<\/strong>，这是弹性随时间变大的直接后果。<\/p>\n<p><strong>应用三：禁毒。<\/strong> 加强执法让毒品供给左移，价格上升。由于成瘾者对毒品需求极度缺乏弹性，数量只小幅下降，总支出反而增加（价格涨得多、量降得少）。结果是吸毒者为筹钱可能更多犯罪。结论不是&quot;别禁毒&quot;，而是提醒：只看供给端的政策，在需求缺乏弹性时会产生反效果，所以书里同时讨论教育、治疗等需求端措施。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;弹性大就是曲线陡&quot;——实际上弹性大对应曲线平。斜率和弹性是两回事：斜率是 Δy/Δx，弹性是百分比之比；直线上斜率不变，弹性却在变。\n<\/li><li>\n别以为&quot;涨价一定增加收入&quot;——实际上只在缺乏弹性时成立。对富有弹性的商品，涨价会把顾客赶走，收入下降。\n<\/li><li>\n别以为&quot;农业技术进步对农民是好事&quot;——实际上对全社会是好事（粮食便宜），对农民个体可能意味着收入下降，因为需求缺乏弹性。政策要解决的是分配，不是技术。\n<\/li><li>\n别以为弹性是固定属性——实际上同一商品在不同价格区间、不同时间跨度下弹性不同。\n<\/ul>\n<ol><li>\n（单选）价格从 10 元升到 12 元，需求量从 100 件降到 80 件。用中点法计算的需求价格弹性约为？\n<p>A. 0.55  B. 1.00  C. 1.22  D. 1.80 <strong>答案<\/strong>：C；<strong>解析<\/strong>：数量变动率 = −20 ÷ 90 = −22.2%；价格变动率 = 2 ÷ 11 = 18.2%；弹性 = 22.2 ÷ 18.2 ≈ 1.22，属富有弹性。<\/p>\n<\/ol>\n<ol><li>\n（单选）某商品需求缺乏弹性。若卖者提高价格，总收益会？\n<p>A. 增加  B. 减少  C. 不变  D. 先增后减 <strong>答案<\/strong>：A；<strong>解析<\/strong>：缺乏弹性意味着数量下降的百分比小于价格上升的百分比，P×Q 上升。典型例子是食盐、燃油这类必需品。<\/p>\n<\/ol>\n<ol><li>\n（单选）农业技术进步使粮食供给大幅增加，但农民总收入下降。最直接的原因是？\n<p>A. 粮食需求缺乏弹性，价格下跌幅度大于数量增加幅度  B. 农民没有能力采用新技术  C. 粮食需求富有弹性，价格下跌带来数量大增  D. 政府对粮食征收了更高的税 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求缺乏弹性时，供给右移导致价格大跌而数量只小幅上升，P×Q 下降。消费者得到便宜粮食，农民收入受损，这是分配问题。<\/p>\n<\/ol>\n<ol><li>\n（填空）线性需求曲线上的弹性在中点处等于多少？\n<p><strong>答案<\/strong>：1；<strong>解析<\/strong>：中点处需求量为最大量的一半、价格为最高价的一半，数量与价格的百分比变动幅度相同，弹性为 1。上半段大于 1，下半段小于 1。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n弹性 = 数量变动百分比 ÷ 价格变动百分比，用中点法消除方向差异。\n<\/li><li>\nE &gt; 1 降价增收，E &lt; 1 涨价增收；线性需求曲线上半段弹性大、中点 E = 1。\n<\/li><li>\n时间越长弹性越大，这是 OPEC 短期有效、长期失效的根本原因。\n<\/ul>", "ch06": "<h1>第 6 章：供给、需求与政府政策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一项价格管制有没有约束力，并算出它造成的短缺或过剩数量。\n<\/li><li>\n说明向卖者征税和向买者征税为什么结果完全相同。\n<\/li><li>\n用弹性判断税收负担最终落在买者还是卖者身上，并算出各自承担多少。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>价格管制改变的是价格的数值，改变不了供给与需求本身；税收插进来的是买者付的价和卖者得的价之间的一道楔子，楔子怎么分摊由弹性决定，不由法律条文决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>价格上限<\/h3>\n<p><strong>价格上限<\/strong>（price ceiling）是法律规定的最高价格。关键判据只有一条：<strong>只有低于均衡价格的上限才有约束力<\/strong>。高于均衡的上限等于没规定，市场自己会走到更低的均衡价。<\/p>\n<p>用第 4 章的奶茶市场：Qd = 60 − 2P，Qs = 2P − 20，均衡 20 元、20 杯。政府规定最高 15 元：<\/p>\n<ul><li>\nQd = 60 − 30 = 30 杯\n<\/li><li>\nQs = 30 − 20 = 10 杯\n<\/li><li>\n短缺 20 杯\n<\/ul>\n<p>短缺意味着必须用价格以外的办法分配。排队、抽签、凭关系、按身份证限量——这些叫<strong>配给机制<\/strong>。它们不是免费的：排队浪费时间，凭关系滋生寻租。书里用租金控制作为长期案例：短期房源固定，短缺有限；长期房东不维护、不再新建，房源减少，短缺扩大，房屋质量下降。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 6 章示例：奶茶价格上限 15 元<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><polyline points=\"70.0,203.2 530.0,203.2\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"472.7\" y=\"199.2\" font-size=\"12\" fill=\"#6b7280\" font-weight=\"600\">价格上限<\/text><line x1=\"300.0\" y1=\"203.2\" x2=\"300.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"307.0\" y=\"196.2\" font-size=\"11.5\" fill=\"#111827\">Qd=30<\/text><line x1=\"146.7\" y1=\"203.2\" x2=\"146.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"153.7\" y=\"196.2\" font-size=\"11.5\" fill=\"#111827\">Qs=10<\/text><text x=\"192.7\" y=\"226.9\" font-size=\"11.5\" fill=\"#dc2626\">短缺 20 杯<\/text><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 z\" fill=\"#dc2626\"/><\/marker><\/defs><line x1=\"154.3\" y1=\"218.7\" x2=\"292.3\" y2=\"218.7\" stroke=\"#dc2626\" stroke-width=\"1.8\" marker-end=\"url(#ar)\"/><\/svg>\n<p>看图说明：上限画在 15 元，与两条曲线各交于一点，两点之间的水平距离就是短缺。注意这条线只要往下移，短缺就变长——上限越低，缺得越多。<\/p>\n<h3>价格下限<\/h3>\n<p><strong>价格下限<\/strong>（price floor）是法律规定的最低价格。判据对称：<strong>只有高于均衡的下限才有约束力<\/strong>。<\/p>\n<p>把下限设在 25 元：Qd = 10，Qs = 30，过剩 20 杯。卖不掉的部分怎么办？现实中常见的是政府收购（农产品价格支持）或者限制产量（配额）。最低工资是劳动市场的价格下限，第 28 章会专门讨论它为什么会增加失业，以及为什么影响集中在青年和低技能群体。<\/p>\n<h3>税收：向谁收都一样<\/h3>\n<p>这是本章最反直觉的结论，必须自己算一遍才信。<\/p>\n<p><strong>向卖者征税<\/strong>：每卖一杯交 6 元。卖者实际拿到的是&quot;买者付的价格减 6 元&quot;，所以他要的价格必须更高才愿意卖同样的量。供给曲线向上平移 6 元：新的供给 Qs′ = 2(P − 6) − 20 = 2P − 32。 均衡：60 − 2P = 2P − 32 → 4P = 92 → P = 23 元，Q = 14 杯。<\/p>\n<p>买者付 23 元（比原来多 3 元），卖者拿到 23 − 6 = 17 元（比原来少 3 元）。政府收 6×14 = 84 元。<\/p>\n<p><strong>向买者征税<\/strong>：每买一杯交 6 元。买者实际付出的总代价是&quot;标价 + 6 元&quot;，所以需求曲线向下平移 6 元：Qd′ = 60 − 2(P + 6) = 48 − 2P。 均衡：48 − 2P = 2P − 20 → 4P = 68 → P = 17 元，Q = 14 杯。<\/p>\n<p>标价变成 17 元，买者实际付 17 + 6 = 23 元，卖者拿到 17 元。数量也是 14 杯。<\/p>\n<p>两组数字完全一样：买者付 23、卖者得 17、数量 14、税收 84。<strong>法律上规定谁交税，只影响钱经过谁的手，不影响谁真正承担。<\/strong>真正承担的部分叫<strong>税收归宿<\/strong>（tax incidence）。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">向卖者征 6 元税：价格楔子<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">原供给 S<\/text><polyline points=\"70.0,194.1 177.3,130.3 223.3,102.9\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"235.0\" y=\"93.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">税后供给 S′<\/text><line x1=\"177.3\" y1=\"130.3\" x2=\"70.0\" y2=\"130.3\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"130.3\" x2=\"177.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"188.1\" y=\"115.7\" font-size=\"11.5\" fill=\"#111827\">买者付 23 元<\/text><text x=\"188.1\" y=\"201.4\" font-size=\"11.5\" fill=\"#111827\">卖者得 17 元<\/text><text x=\"188.1\" y=\"217.8\" font-size=\"11.5\" fill=\"#6b7280\">数量 14<\/text><text x=\"77.7\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">楔子 6 元：买者多付、卖者少得<\/text><\/svg>\n<p>看图说明：绿线是税后的供给曲线，它与需求曲线的交点对应买者价格 23 元；同一交易量在原来红线上对应的价格是卖者到手的 17 元。两条线之间的垂直距离就是税额。<\/p>\n<h3>归宿由弹性决定<\/h3>\n<p>规律：<strong>税收落在弹性小的一方身上<\/strong>。谁更难逃，谁承担更多。<\/p>\n<p>理由很直白。买者弹性大（随时可以不买），卖者一涨价他就跑，卖者只能自己吞下大部分税；卖者弹性大（随时可以转产），买者一压价他就不供货，买者只能自己承担。<\/p>\n<p>一个极端例子：需求完全无弹性（垂直线，比如胰岛素）。税全部由买者承担，价格涨满 6 元，数量一点不减。另一个极端：供给完全无弹性（垂直线，比如土地）。税全部由卖者承担，价格不变。<\/p>\n<p>算一个分摊比例的例子。设需求 Qd = 60 − 2P（斜率绝对值 2），供给 Qs = 2P − 20（斜率 2），两者弹性相等，税 6 元各承担 3 元——上面的数字正是这种对称情形。<\/p>\n<h3>两个真实案例<\/h3>\n<p><strong>工薪税。<\/strong> 美国法律规定社会保障税由雇主和雇员各付一半。但经济学家的测算显示，雇员的实际工资会因雇主那部分而下降，所以<strong>雇员最终承担的部分超过法律写的那一半<\/strong>。法律条文改不了归宿。<\/p>\n<p><strong>奢侈品税。<\/strong> 1990 年美国对游艇、私人飞机等征收 10% 的奢侈品税，目标是&quot;让富人出钱&quot;。结果富人可以不买新游艇（弹性大），而造船工人没法转行（劳动供给弹性小）。税收收入远低于预期，政府次年就取消了这项税，失业的造船工人成了实际承担者。这个案例的教训是：<strong>瞄准&quot;富人&quot;的税，最终可能落在为富人服务的人身上<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;规定价格就能改变市场结果&quot;——实际上管住价格只会制造短缺或过剩，交易量由较短的曲线决定，不由政府决定。\n<\/li><li>\n别以为&quot;向企业征税就是企业出钱&quot;——实际上企业会把税转嫁给买者或工人，转嫁多少看各方弹性。\n<\/li><li>\n别以为价格管制&quot;保护穷人&quot;就一定是好政策——实际上租金控制长期会减少房源、降低质量，受损最重的常常是原本要保护的人。政策要区分短期效果和长期效果。\n<\/li><li>\n别以为税收只造成&quot;钱从一方转到另一方&quot;——实际上它还会减少交易量，消失的那部分交易价值谁也不到，第 8 章会把它命名为无谓损失。\n<\/ul>\n<ol><li>\n（单选）奶茶市场 Qd = 60 − 2P，Qs = 2P − 20。政府规定最高价 15 元，会出现什么？\n<p>A. 过剩 20 杯  B. 短缺 20 杯  C. 短缺 30 杯  D. 没有影响，市场仍均衡 <strong>答案<\/strong>：B；<strong>解析<\/strong>：P=15 时 Qd=30、Qs=10，短缺 20 杯。因为 15 元低于均衡价 20 元，上限有约束力。<\/p>\n<\/ol>\n<ol><li>\n（单选）对每杯奶茶向卖者征 6 元税，均衡数量从 20 杯降到 14 杯。政府税收收入是多少？\n<p>A. 120 元  B. 84 元  C. 18 元  D. 6 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：税收收入 = 税额 × 税后交易量 = 6 × 14 = 84 元。注意不是用税前数量算的，交易量已经下降。<\/p>\n<\/ol>\n<ol><li>\n（单选）某商品需求完全无弹性、供给弹性正常。对它征税，税负主要由谁承担？\n<p>A. 买者全部承担  B. 卖者全部承担  C. 双方各半  D. 由政府承担 <strong>答案<\/strong>：A；<strong>解析<\/strong>：需求完全无弹性意味着买者不论价格多高都买同样的量，卖者可以把税全部转嫁给买者，价格涨满税额而数量不变。<\/p>\n<\/ol>\n<ol><li>\n（填空）法律上规定由雇主缴纳的工薪税，最终由谁承担，取决于什么？（一个词）\n<p><strong>答案<\/strong>：弹性；<strong>解析<\/strong>：税收归宿由供需双方的相对弹性决定，法律只决定钱走谁的账。劳动供给弹性小、需求弹性相对大时，雇员的实际工资会下降，等于雇员承担了大部分。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n价格上限只有低于均衡才有约束力（造成短缺）；价格下限只有高于均衡才有约束力（造成过剩）。\n<\/li><li>\n向卖者征税与向买者征税结果相同：买者价格上升、卖者价格下降、交易量减少。\n<\/li><li>\n税收归宿看弹性：弹性小的一方承担更多；弹性相等则各承担一半。\n<\/ul>", "ch07": "<h1>第 7 章：消费者、生产者与市场效率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、5、6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用支付意愿和需求曲线算出消费者剩余，用成本和供给曲线算出生产者剩余。\n<\/li><li>\n解释为什么均衡数量使总剩余最大，并能指出「多生产一单位」和「少生产一单位」各自损失多少。\n<\/li><li>\n说出市场效率结论成立的两个前提，以及它们被破坏时会发生什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>市场均衡之所以被称为&quot;有效率&quot;，是因为它正好停在&quot;最后一单位对买者的价值 = 对卖者的成本&quot;这一点上；越过这一点，不管多还是少，总剩余都会减少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>消费者剩余<\/h3>\n<p><strong>支付意愿<\/strong>（willingness to pay）是一个买者为某物最多愿意付的钱。它因人而异：同样一杯奶茶，甲愿意出 30 元，乙只愿意出 15 元。<\/p>\n<p><strong>消费者剩余<\/strong>（consumer surplus）= 支付意愿 − 实际支付。甲若花 20 元买到，剩余 10 元；乙若花 20 元就不买（因为他的支付意愿只有 15）。<\/p>\n<p>把所有人的支付意愿按从高到低排起来，就得到需求曲线。所以<strong>消费者剩余在图上就是需求曲线以下、价格线以上的那块面积<\/strong>。<\/p>\n<p>算一下第 4 章的奶茶市场：Qd = 60 − 2P，均衡价 20 元、数量 20 杯。需求曲线在 Q = 0 时对应价格 30 元（这是最高支付意愿）。消费者剩余是一个三角形：<\/p>\n<ul><li>\n底 = 20 杯\n<\/li><li>\n高 = 30 − 20 = 10 元\n<\/li><li>\n面积 = ½ × 20 × 10 = 100 元\n<\/ul>\n<p>这 100 元不是&quot;消费者赚了 100 元现金&quot;，而是&quot;他们本来愿意多付 100 元，实际没付&quot;。它是福利，不是货币。<\/p>\n<p>价格下降会增加消费者剩余，来源有两块：一是原来那些买者少付了钱；二是原本嫌贵不买的人现在进场了，他们也获得了剩余。<\/p>\n<h3>生产者剩余<\/h3>\n<p><strong>成本<\/strong>是卖者生产一单位的最低可接受价格。<strong>生产者剩余<\/strong>（producer surplus）= 实际得到 − 成本。<strong>在图上就是价格线以下、供给曲线以上的面积<\/strong>。<\/p>\n<p>同一市场：供给曲线在 Q = 0 时对应 10 元（最低成本）。生产者剩余：<\/p>\n<ul><li>\n底 20 杯，高 20 − 10 = 10 元\n<\/li><li>\n面积 = ½ × 20 × 10 = 100 元\n<\/ul>\n<p>价格上升会增加生产者剩余，也是两块：原有卖者多收钱，成本较高的新卖者进场也赚到。<\/p>\n<h3>总剩余与市场效率<\/h3>\n<p><strong>总剩余 = 消费者剩余 + 生产者剩余<\/strong>。这个市场是 100 + 100 = 200 元。<\/p>\n<p><strong>效率<\/strong>的含义：在给定资源下把总剩余做到最大。判断一个数量是否有有效率，只要看一件事——<strong>这一单位对买者的价值是否高于对卖者的成本<\/strong>。<\/p>\n<ul><li>\n若数量少于 20 杯：想买的人里有人的支付意愿高于成本，却没买到，这部分价值白白丢掉。少一单位就少一份剩余。\n<\/li><li>\n若数量多于 20 杯：多出来的那些杯，成本高于买者的支付意愿，生产它们等于把资源变成更不值钱的东西。多一单位就亏一份。\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 7 章示例：总剩余最大<\/text><polygon points=\"70.0,157.6 223.3,157.6 70.0,66.5\" fill=\"#2563eb\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"121.1\" y=\"127.3\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">消费者剩余<\/text><polygon points=\"70.0,248.8 223.3,157.6 70.0,157.6\" fill=\"#dc2626\" fill-opacity=\"0.30\" stroke=\"none\"/><text x=\"121.1\" y=\"188.0\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">生产者剩余<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"53.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><circle cx=\"223.3\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"230.3\" y=\"150.6\" font-size=\"11.5\" fill=\"#111827\">均衡<\/text><line x1=\"223.3\" y1=\"157.6\" x2=\"70.0\" y2=\"157.6\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><\/svg>\n<p>看图说明：两个三角形拼成一个&quot;福利三角&quot;。均衡点正好是两块的公共顶点，任何向左右偏移都会让总剩余缩小。这就是&quot;均衡最大化总剩余&quot;的图形含义。<\/p>\n<h3>一个反直觉的推论<\/h3>\n<p>均衡最大化的是<strong>总剩余<\/strong>，不是&quot;每个人都满意&quot;。均衡价格可能让某些买者觉得贵、某些卖者觉得亏，但只要交易是自愿的，双方各自都认为划算。分配问题和效率问题是两件事，第 12、20 章处理分配。<\/p>\n<h3>市场失灵<\/h3>\n<p>效率结论有两个隐含前提：市场是完全竞争的，且交易不影响第三方。破坏它们就出现<strong>市场失灵<\/strong>（market failure）：<\/p>\n<ol><li>\n<strong>市场势力<\/strong>：一家企业能操纵价格，它会少卖、抬价，交易量低于 20 杯，总剩余减少（第 15 章）。\n<\/li><li>\n<strong>外部性<\/strong>：交易给旁观者带来成本或好处，价格没算这笔账，交易量偏离最优（第 10 章）。\n<\/ol>\n<p>这两个词是后面十几章的总线索。看到&quot;为什么市场结果不好&quot;，先问：是势力问题，还是外部性问题。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：拍卖。<\/strong> 十个人竞拍同一件东西，出价从高到低排成一条线。成交价定在第十个人的出价时，前九个都&quot;赚了&quot;——他们本愿意多付。这九个的&quot;赚&quot;加起来就是消费者剩余。类比的失效边界：拍卖里出价是显示出来的，真实市场里支付意愿藏在心里，经济学家只能靠需求曲线推断，所以算出来的剩余是估计值。<\/p>\n<p><strong>实例：涨价与剩余的再分配。<\/strong> 同一个奶茶市场，价格从 20 元涨到 25 元：<\/p>\n<ul><li>\n数量降到 10 杯，消费者剩余 = ½ × 10 × (30 − 25) = 25 元，比原来的 100 元少了 75 元。\n<\/li><li>\n生产者剩余 = ½ × 10 × (25 − 10) = 75 元，比原来的 100 元少了 25 元。\n<\/ul>\n<p>两边都少了：总剩余从 200 元降到 100 元，蒸发掉的 100 元正是&quot;交易量从 20 杯缩到 10 杯&quot;那十杯本来能创造的价值。这也说明涨价不必然让卖者更赚——买者跑掉足够多时，卖者的剩余一样缩水。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为消费者剩余是&quot;消费者实际省下的钱&quot;——实际上它是心理上的福利度量，包含&quot;本来愿意多付的部分&quot;，不能当现金花。\n<\/li><li>\n别以为均衡一定公平——实际上均衡只保证效率，不保证分配合理。政府干预常是为了分配，代价可能是效率。\n<\/li><li>\n别以为&quot;多生产总是好事&quot;——实际上超过均衡数量后，每多生产一单位都在毁灭价值，因为成本高于买者的支付意愿。\n<\/li><li>\n别以为效率等于&quot;总钱数最多&quot;——实际上总剩余衡量的是价值，不是货币收入；它把买卖双方的福利加在一起，不区分谁拿得多。\n<\/ul>\n<ol><li>\n（单选）奶茶市场均衡价 20 元、数量 20 杯，最高支付意愿为 30 元。消费者剩余是多少？\n<p>A. 200 元  B. 100 元  C. 50 元  D. 20 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：消费者剩余是需求曲线以下、价格线以上的三角形面积：底 20 杯、高 30−20=10 元，½×20×10=100 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）为什么均衡数量使总剩余最大？\n<p>A. 因为均衡时买卖双方人数相等  B. 因为均衡时最后一单位对买者的价值恰好等于对卖者的成本  C. 因为均衡价格最低  D. 因为均衡时所有人都满意 <strong>答案<\/strong>：B；<strong>解析<\/strong>：数量小于均衡时，有支付意愿高于成本的交易没发生；数量大于均衡时，成本高于支付意愿的交易发生了。只有均衡点上，每一笔成交都创造价值、且没有遗漏，总剩余最大。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列哪些属于市场失灵，会使均衡偏离总剩余最大？\n<p>A. 某行业由一家企业垄断并压低产量抬高价格  B. 工厂排污让下游居民承担成本  C. 消费者偏好发生变化导致需求曲线平移  D. 政府对某商品征收消费税 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：市场势力与外部性是本章定义的两类市场失灵。偏好变化只是需求移动，市场仍会走到新的均衡并最大化剩余；征税会减少剩余，但那属于政策干预的结果，不是市场自身的失灵。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n消费者剩余 = 需求曲线以下、价格线以上的面积；生产者剩余 = 价格线以下、供给曲线以上的面积。\n<\/li><li>\n均衡最大化总剩余，理由是最后一单位的价值等于成本。\n<\/li><li>\n市场失灵的两个来源：市场势力与外部性。\n<\/ul>", "ch08": "<h1>第 8 章：应用：赋税的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「两个三角形」的几何方法算出无谓损失，并说明它为什么不是任何人的收入。\n<\/li><li>\n判断两种税哪一种无谓损失更大，依据是弹性大小与税额大小。\n<\/li><li>\n解释拉弗曲线的形状，以及为什么&quot;降低税率可能增加税收&quot;只在特定区间成立。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>税收拿走了两笔东西：一笔是钱，从买者和卖者转到政府手里；另一笔是交易，被税楔子挤掉的那些交易本来能创造的价值，直接消失，谁也拿不到——这就是无谓损失。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从上一章的图接着算<\/h3>\n<p>第 6 章的奶茶市场：Qd = 60 − 2P，Qs = 2P − 20，均衡 20 元、20 杯。征 6 元税后，数量降到 14 杯。<\/p>\n<p>税后福利怎么变：<\/p>\n<ul><li>\n消费者剩余：从 100 元降到（½ × 14 × (30 − 23)）= 49 元\n<\/li><li>\n生产者剩余：从 100 元降到（½ × 14 × (17 − 10)）= 49 元\n<\/li><li>\n政府税收收入：6 × 14 = 84 元\n<\/ul>\n<p>三块加起来：49 + 49 + 84 = 182 元。<\/p>\n<p>税前总剩余是 200 元。少了 18 元。<\/p>\n<p>这 18 元去了哪？没有去哪。它对应的是第 15 到第 20 杯之间的交易——这些交易对买者的价值高于对卖者的成本，本来应该发生，被税挡住了。买者少得了价值、卖者少赚了钱、政府也没收到这部分税。这种&quot;因为交易没发生而凭空消失的价值&quot;，就是<strong>无谓损失<\/strong>（deadweight loss）。<\/p>\n<p>几何上，它就是供给曲线、需求曲线和两条虚线围成的三角形：<\/p>\n<ul><li>\n底（垂直方向）= 税额 6 元\n<\/li><li>\n高（水平方向）= 减少的数量 6 杯\n<\/li><li>\n面积 = ½ × 6 × 6 = 18 元\n<\/ul>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1
