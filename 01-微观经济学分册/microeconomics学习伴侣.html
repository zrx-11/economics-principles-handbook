15 万元，那么&quot;自己看店&quot;这件事的代价就是 15 万元加 4000 元。<\/p>\n<p>所以<strong>经济利润 = 总收益 − 显性成本 − 隐性成本<\/strong>，而<strong>会计利润只减显性成本<\/strong>。前者回答&quot;值不值&quot;，后者回答&quot;账面赚没赚&quot;。<\/p>\n<p>类比：一张演唱会门票你免费拿到，去看的代价不是 0，而是&quot;把票转卖能得到的钱 + 那三小时能做的事&quot;。这个类比在&quot;票不能转卖、时间无法替代&quot;时失效。<\/p>\n<h3>边际分析<\/h3>\n<p>边际是&quot;再多一单位&quot;。边际收益（MR）、边际成本（MC）、边际产量、边际税率，都是这个意思。<\/p>\n<p>判断规则很简单：<strong>边际收益 &gt; 边际成本，就多做；小于，就少做；相等，就停在这一点。<\/strong><\/p>\n<p>这套规则的威力在于它能处理&quot;总量看起来还赚，但再多做就亏&quot;的情形。一家店已经盈利，但第 7 杯奶茶的成本高于售价，那第 7 杯就不该做——尽管整体仍在赚钱。<\/p>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>企业定产量<\/strong>（第 14 章）：P = MC。\n<\/li><li>\n<strong>消费者买东西<\/strong>（第 21 章）：边际替代率 = 价格比，即&quot;我愿意换的比例&quot;等于&quot;市场让我换的比例&quot;。\n<\/li><li>\n<strong>政策定税率<\/strong>（第 8、12 章）：增税要看边际税率对行为的抑制，不只是平均税负。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;没花钱就没有成本&quot;——实际上放弃的收益就是成本，而且是最容易被忽略的那部分。\n<\/li><li>\n别以为&quot;总量赚钱就该继续扩大&quot;——实际上要看下一单位的边际账。\n<\/li><li>\n别以为&quot;沉没成本也该算进去&quot;——实际上已经收不回来的钱不影响&quot;下一步怎么做&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>十大原理之二、之三<\/td><td>决策要看机会成本，理性人看边际<\/td><\/tr><tr><td>第 2 章<\/td><td>经济学家的思维方式<\/td><td>用机会成本与经济利润重算&quot;赚不赚&quot;<\/td><\/tr><tr><td>第 7 章<\/td><td>市场效率<\/td><td>剩余是边际买者与边际卖者之间的差额<\/td><\/tr><tr><td>第 13 章<\/td><td>生产成本<\/td><td>经济利润扣隐性成本；MC 决定产量<\/td><\/tr><tr><td>第 14 章<\/td><td>竞争企业<\/td><td>停业判据看 P 与 AVC 的边际比较<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（价格由边际买卖双方决定）\n<\/li><li>\n<strong>剩余与效率<\/strong>（剩余的边际解释）\n<\/li><li>\n<strong>市场结构谱系<\/strong>（不同结构的定价都是 MR = MC 的变体）\n<\/ul>", "c02": "<h1>供给与需求<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 4、5、6、9、31 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>价格是买卖双方在同一张图上&quot;谈&quot;出来的：需求说&quot;这个价我要多少&quot;，供给说&quot;这个价我给多少&quot;，两条线相交处就是均衡价格与均衡数量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整个微观经济学的坐标系。弹性、税收、价格管制、国际贸易、甚至宏观的 AD-AS，都是在这张图上加元素。看懂这张图，后面全是图层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[价格上升] --&gt; B[需求量下降 沿需求曲线移动]\n    A --&gt; C[供给量上升 沿供给曲线移动]\n    D[收入上升 偏好变化 人口增加] --&gt; E[整条需求曲线移动]\n    F[成本下降 技术改进 卖者增多] --&gt; G[整条供给曲线移动]\n    E --&gt; H[均衡价格与数量改变]\n    G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图把&quot;沿曲线移动&quot;与&quot;整条曲线移动&quot;分开。前者由价格引起，后者由价格以外的因素引起。混淆这两件事，是入门最常见的错误。<\/p>\n<h2>详解<\/h2>\n<h3>两条曲线<\/h3>\n<p><strong>需求曲线<\/strong>向右下倾斜：价格越低，买得越多。原因有三——更便宜所以更多人买、老买家买更多、替代品被挤走。<\/p>\n<p><strong>供给曲线<\/strong>向右上倾斜：价格越高，卖得越多。因为高价能覆盖更高的边际成本。<\/p>\n<p>需求曲线的移动因素：收入、偏好、相关品价格（替代品与互补品）、买者数量、预期。 供给曲线的移动因素：投入成本、技术、卖者数量、预期、政策（税收与补贴）。<\/p>\n<h3>均衡与调整<\/h3>\n<p>均衡价格下，愿意买的量恰好等于愿意卖的量，没有短缺也没有过剩。<\/p>\n<p>若价格高于均衡：卖不掉，库存积压，卖者降价，价格回落。 若价格低于均衡：抢购，短缺，买者抬价，价格回升。<\/p>\n<p>这个过程不需要谁指挥，价格自己就是信号。哈耶克说的&quot;价格是信息&quot;，指的就是这个。<\/p>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>价格上限<\/strong>（第 6 章）：房租管制 → 短缺、排队、黑市。\n<\/li><li>\n<strong>价格下限<\/strong>（第 6 章）：最低工资 → 过剩的劳动力（失业）。\n<\/li><li>\n<strong>国际贸易<\/strong>（第 9 章）：世界价格低于国内均衡价 → 进口；高于 → 出口。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;涨价就是奸商&quot;——实际上若供给没变、需求增加，涨价是均衡的必然结果。\n<\/li><li>\n别以为&quot;需求增加就是需求量增加&quot;——实际上前者是整条曲线右移，后者是沿曲线移动。\n<\/li><li>\n别以为&quot;价格管制能让穷人买得起&quot;——实际上上限造成短缺，能买到的人反而更少（要靠排队或关系）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>市场力量<\/td><td>均衡的形成与三条移动规律<\/td><\/tr><tr><td>第 5 章<\/td><td>弹性<\/td><td>曲线陡缓决定涨价的幅度与收益<\/td><\/tr><tr><td>第 6 章<\/td><td>政府政策<\/td><td>价格上下限制造短缺与过剩<\/td><\/tr><tr><td>第 9 章<\/td><td>国际贸易<\/td><td>世界价格与国内均衡价的比较决定进出口<\/td><\/tr><tr><td>第 31 章<\/td><td>汇率<\/td><td>外汇市场同样是供求均衡<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>弹性<\/strong>（决定价格变动幅度）\n<\/li><li>\n<strong>剩余与效率<\/strong>（均衡为什么使总剩余最大）\n<\/li><li>\n<strong>税收归宿<\/strong>（税负在买卖双方如何分摊，取决于相对弹性）\n<\/ul>", "c03": "<h1>弹性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、6、8、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>弹性衡量&quot;一个变量变动 1%，另一个变量会变动百分之几&quot;；价格弹性大，说明消费者对价格很敏感，一涨价就跑。<\/p>\n<h2>为什么重要<\/h2>\n<p>弹性决定了价格变动对收益、对税负分摊、对政策效果的影响。同样是加税，对香烟（弹性小）和对奶茶（弹性大）的结果完全不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[需求价格弹性] --&gt; B[大于 1 富有弹性]\n    A --&gt; C[小于 1 缺乏弹性]\n    A --&gt; D[等于 1 单位弹性]\n    B --&gt; E[降价增加收益]\n    C --&gt; F[涨价增加收益]\n    D --&gt; G[收益不变]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图给出最实用的推论——涨价能不能多赚钱，只看弹性。弹性小于 1 时涨价增收；大于 1 时涨价反而减收。<\/p>\n<h2>详解<\/h2>\n<h3>算法<\/h3>\n<p><strong>需求价格弹性<\/strong> = 需求量变化百分比 ÷ 价格变化百分比。<\/p>\n<p>例：价格从 20 涨到 22（+10%），需求量从 20 降到 18（−10%），弹性 = 10% ÷ 10% = 1。<\/p>\n<p>用中点法可以避免&quot;起点不同、结果不同&quot;的问题：分母用平均值。<\/p>\n<h3>影响因素<\/h3>\n<ul><li>\n<strong>替代品多不多<\/strong>：替代品多则弹性大（可乐涨价，改喝雪碧）。\n<\/li><li>\n<strong>是不是必需品<\/strong>：必需品的弹性小（药、盐）。\n<\/li><li>\n<strong>支出占比<\/strong>：占比大则弹性大。\n<\/li><li>\n<strong>调整时间<\/strong>：时间越长弹性越大（油价涨了，短期照开，长期换车或搬家）。\n<\/ul>\n<h3>其他弹性<\/h3>\n<ul><li>\n<strong>供给弹性<\/strong>：价格变动引起供给量变化的敏感度，取决于产能调整的难易。\n<\/li><li>\n<strong>交叉价格弹性<\/strong>：一种商品价格变动引起另一种商品需求变动的幅度。正值是替代品，负值是互补品。\n<\/li><li>\n<strong>收入弹性<\/strong>：收入变动引起需求变动的幅度。大于 1 是奢侈品，小于 1 是必需品，负值是劣等品。\n<\/ul>\n<h3>三个应用<\/h3>\n<ol><li>\n<strong>收益判断<\/strong>：弹性小于 1，涨价增收；大于 1，降价增收。\n<\/li><li>\n<strong>税负分摊<\/strong>（第 8 章）：弹性小的一方承担更多税负。香烟税主要由消费者承担，因为烟民难以戒断。\n<\/li><li>\n<strong>政策效果<\/strong>（第 6 章）：最低工资对就业的伤害取决于劳动需求弹性；弹性小则伤害小。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;弹性大就是需求量大&quot;——实际上弹性衡量的是敏感度，与绝对数量无关。\n<\/li><li>\n别以为&quot;必需品永远缺乏弹性&quot;——实际上长期看弹性会变大（人们会找到替代方案）。\n<\/li><li>\n别以为&quot;涨价一定增收&quot;——实际上弹性大于 1 时涨价会减少总收入。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章<\/td><td>弹性及其应用<\/td><td>四类弹性的算法与用途<\/td><\/tr><tr><td>第 6 章<\/td><td>价格控制<\/td><td>短缺程度取决于供需弹性<\/td><\/tr><tr><td>第 8 章<\/td><td>赋税的代价<\/td><td>税负分摊与无谓损失都由弹性决定<\/td><\/tr><tr><td>第 12 章<\/td><td>税制设计<\/td><td>对什么征税、税负落在谁身上<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（弹性的几何含义是曲线陡缓）\n<\/li><li>\n<strong>剩余与效率<\/strong>（税收的无谓损失随弹性增大而增大）\n<\/li><li>\n<strong>税收归宿<\/strong>（弹性小者多担税）\n<\/ul>", "c04": "<h1>消费者剩余、生产者剩余与市场效率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8、9、10、15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>消费者剩余 = 愿意付的钱减去实际付的钱；生产者剩余 = 实际收到的钱减去成本。两者之和叫总剩余，它在均衡价格处达到最大，任何偏离都会损失一块（无谓损失）。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是&quot;市场为什么好&quot;的量化表述。它给&quot;效率&quot;一个可计算的答案，也让&quot;政府干预的代价&quot;变得可计算——税收、价格管制、垄断、关税的损失都能画成三角形。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[需求曲线] --&gt; B[买者支付意愿]\n    B --&gt; C[消费者剩余 = 意愿 − 付价]\n    D[供给曲线] --&gt; E[卖者成本]\n    E --&gt; F[生产者剩余 = 收价 − 成本]\n    C --&gt; G[总剩余]\n    F --&gt; G\n    G --&gt; H{被什么削减}\n    H --&gt; I[税收 无谓损失]\n    H --&gt; J[价格管制 短缺]\n    H --&gt; K[垄断 产量压低]\n    H --&gt; L[关税 进口减少]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面两条链合成总剩余，下面四条分支是四种常见的&quot;削减方式&quot;。它们削减的机制不同，但都表现为&quot;本该发生的交易没有发生&quot;。<\/p>\n<h2>详解<\/h2>\n<h3>消费者剩余<\/h3>\n<p>需求曲线的高度代表边际买者的<strong>支付意愿<\/strong>。价格线以下、需求线以上的面积是消费者剩余。<\/p>\n<p>例：你愿意为一张演唱会票付 800 元，实际花 500 元，剩余 300 元。所有买者的剩余加起来就是市场总剩余的一部分。<\/p>\n<h3>生产者剩余<\/h3>\n<p>供给曲线的高度代表边际卖者的<strong>成本<\/strong>。价格线以下、供给线以上的面积是生产者剩余（它近似等于利润加固定成本）。<\/p>\n<h3>效率的含义<\/h3>\n<p><strong>总剩余最大 = 资源配置效率最高<\/strong>。均衡价格下，所有&quot;支付意愿高于成本&quot;的交易都发生了，没有遗漏。<\/p>\n<p>任何让成交量减少的政策都会削减总剩余：<\/p>\n<ul><li>\n<strong>税收<\/strong>：买卖价之间插入一个楔子，成交量从 Q 降到 Q&#x27;，损失部分就是<strong>无谓损失<\/strong>（DWL）。\n<\/li><li>\n<strong>价格上限<\/strong>低于均衡：短缺，成交量下降，剩余损失。\n<\/li><li>\n<strong>价格下限<\/strong>高于均衡：过剩，成交量同样下降。\n<\/li><li>\n<strong>垄断<\/strong>：产量压到 MR = MC，损失是需求线与 MC 线之间、从垄断产量到竞争产量之间的三角形。\n<\/li><li>\n<strong>关税<\/strong>：进口减少，国内高价生产替代了便宜的进口，损失两块（生产扭曲与消费扭曲）。\n<\/ul>\n<h3>一个重要限定<\/h3>\n<p>效率不等于公平。总剩余最大只说&quot;饼最大&quot;，不说&quot;饼怎么分&quot;。税收会改变分配（买者与卖者各承担一部分），但效率分析只管总量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;价格越低越好&quot;——实际上低于均衡的价格会造成短缺，成交量下降，总剩余减少。\n<\/li><li>\n别以为&quot;税收的损失就是税收本身&quot;——实际上税款的转移不是损失，损失是成交量减少造成的那块三角形。\n<\/li><li>\n别以为&quot;总剩余最大就是最公平&quot;——实际上它只讲效率，分配是另一个问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>消费者、生产者与市场效率<\/td><td>剩余的度量与均衡的效率性<\/td><\/tr><tr><td>第 8 章<\/td><td>赋税的代价<\/td><td>税收楔子与无谓损失，弹性越大损失越大<\/td><\/tr><tr><td>第 9 章<\/td><td>国际贸易<\/td><td>关税的两块损失<\/td><\/tr><tr><td>第 10 章<\/td><td>外部性<\/td><td>负外部性使社会成本高于私人成本，市场产量过多<\/td><\/tr><tr><td>第 15 章<\/td><td>垄断<\/td><td>垄断的无谓损失与价格歧视的福利效果<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供给与需求<\/strong>（剩余的几何来源）\n<\/li><li>\n<strong>弹性<\/strong>（决定无谓损失的大小）\n<\/li><li>\n<strong>外部性与公共物品<\/strong>（市场失灵时总剩余不是最大）\n<\/ul>", "c05": "<h1>外部性与公共物品<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 10、11、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>外部性是&quot;你的行为让别人承担了成本或获得了收益，但价格里没体现&quot;；公共物品是&quot;人人都能用、也没人能不让别人用&quot;的东西。两者都会让市场自己算错账。<\/p>\n<h2>为什么重要<\/h2>\n<p>前面几章的&quot;市场有效率&quot;有一个隐含前提：交易的成本与收益都落在交易双方身上。这条前提一破，价格信号就失真——污染没人买单、灯塔没人建、疫苗没人打够。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[外部性] --&gt; B[负外部性 污染 噪音]\n    A --&gt; C[正外部性 教育 疫苗 研发]\n    B --&gt; D[社会成本大于私人成本]\n    D --&gt; E[市场产量过多]\n    C --&gt; F[社会收益大于私人收益]\n    F --&gt; G[市场产量过少]\n    E --&gt; H[工具: 矫正税 排污权 管制]\n    G --&gt; I[工具: 补贴 专利 公共提供]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条分支的结论相反——一个产量过多、一个过少，但病因相同：价格没把第三方的得失算进去。工具也就分两类：对负外部性加成本，对正外部性补收益。<\/p>\n<h2>详解<\/h2>\n<h3>负外部性<\/h3>\n<p>工厂排污，社会成本 = 私人成本 + 污染代价。市场价格只反映私人成本，于是产量多于社会最优。<\/p>\n<p>数字例子：需求 P = 30 − 0.5Q，私人成本 MC = 10 + Q，每单位污染的社会代价 4 元。<\/p>\n<ul><li>\n私人均衡：30 − 0.5Q = 10 + Q → Q ≈ 13.3。\n<\/li><li>\n社会最优：30 − 0.5Q = 14 + Q → Q ≈ 10.7。\n<\/ul>\n<p>社会最优产量低于私人产量，差额就是过度生产。<\/p>\n<h3>正外部性<\/h3>\n<p>教育让整个社会受益（更低犯罪率、更高生产率），但受教育者只按自己的收益付费，于是教育投入少于社会最优。工具是补贴或公共提供。<\/p>\n<h3>公共物品的两个特征<\/h3>\n<ul><li>\n<strong>非排他性<\/strong>：无法阻止别人使用（国防、路灯）。\n<\/li><li>\n<strong>非竞争性<\/strong>：一个人用不影响别人用。\n<\/ul>\n<p>两者兼具就是<strong>公共物品<\/strong>。只有非排他性、但用的人多了会拥挤的，叫<strong>公共资源<\/strong>（渔场、牧场、公路）。<\/p>\n<p><strong>搭便车<\/strong>（free rider）：既然不付钱也能用，就没人愿意付钱。结果是公共物品供给不足。<\/p>\n<p><strong>公地悲剧<\/strong>（tragedy of the commons）：公共资源被过度使用，因为使用成本由全体分担、收益归自己。渔场过度捕捞、牧场过度放牧都是。<\/p>\n<h3>工具与取舍<\/h3>\n<ul><li>\n<strong>矫正税（庇古税）<\/strong>：按外部成本征税，把外部性内部化。优点是给企业减排的灵活性（谁减排便宜谁多减）；缺点是税率难以精确设定。\n<\/li><li>\n<strong>可交易的污染许可证<\/strong>：政府定总量、发许可证、允许交易。总量可控，减排由最便宜的企业完成。\n<\/li><li>\n<strong>管制<\/strong>：直接规定排放标准。简单，但一刀切，成本高。\n<\/li><li>\n<strong>科斯定理<\/strong>：若产权清晰、交易成本低，双方可以自行谈判解决，无需政府。现实中交易成本常很高（受害者众多）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;外部性只能靠政府解决&quot;——实际上产权明确时当事人可以谈判；许可证交易也是市场手段。\n<\/li><li>\n别以为&quot;公共物品应该全部由政府提供&quot;——实际上有些可由私人提供（收费公路），关键是排他性是否可行。\n<\/li><li>\n别以为&quot;污染税只是收钱&quot;——实际上它改变行为，把外部成本变成企业的决策成本。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>外部性<\/td><td>社会成本曲线、矫正税、排污权交易、科斯定理<\/td><\/tr><tr><td>第 11 章<\/td><td>公共物品与公共资源<\/td><td>搭便车、公地悲剧、成本收益分析的困难<\/td><\/tr><tr><td>第 12 章<\/td><td>税制设计<\/td><td>用税收纠正外部性同时为公共支出筹资<\/td><\/tr><tr><td>第 22 章<\/td><td>微观前沿<\/td><td>信息不对称也是市场失灵的一种<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>剩余与效率<\/strong>（外部性使总剩余无法最大）\n<\/li><li>\n<strong>供给与需求<\/strong>（社会成本曲线是私人成本曲线的上移）\n<\/li><li>\n<strong>公共物品<\/strong>（非排他导致无法收费）\n<\/ul>", "c06": "<h1>市场结构谱系：从完全竞争到垄断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 14、15、16、17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>四种市场结构（完全竞争、垄断竞争、寡头、垄断）的差别只有两个变量：<strong>卖者数量<\/strong>与<strong>产品是否有差别<\/strong>；这两个变量决定了需求曲线有多平、企业有多大的定价权。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是微观后半部分的骨架。理解了&quot;需求曲线越平、定价权越小&quot;，四种结构的定价、产量、利润、效率结论几乎可以自动推出来，不必逐个背。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[卖者众多且产品同质] --&gt; B[完全竞争]\n    C[卖者众多但产品有差别] --&gt; D[垄断竞争]\n    E[少数几家 相互依赖] --&gt; F[寡头]\n    G[一家独占 有壁垒] --&gt; H[垄断]\n    B --&gt; B1[价格接受者 长期利润为零]\n    D --&gt; D1[轻微定价权 长期利润为零 有超额能力]\n    F --&gt; F1[策略互动 结果介于竞争与垄断之间]\n    H --&gt; H1[定价权最大 长期正利润 无谓损失]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是判定条件，右边是结论。从左上到右下，定价权依次增强，效率依次下降（寡头例外，因为它没有唯一的均衡结论）。<\/p>\n<h2>详解<\/h2>\n<h3>完全竞争<\/h3>\n<p>卖者众多、产品同质、自由进出 → 需求曲线水平 → P = MR = MC → 长期 P = 最低 ATC，利润为零。<\/p>\n<h3>垄断竞争<\/h3>\n<p>产品有差别 → 需求曲线向下倾斜但很平 → 短期按 MR = MC 能赚钱 → 长期进入使需求左移到与 ATC 相切 → 零利润、产量低于效率规模（超额能力）。<\/p>\n<h3>寡头<\/h3>\n<p>少数几家互相盯着 → 没有单一模型 → 合作（卡特尔）接近垄断，竞争（囚徒困境）接近竞争，实际落在中间。<\/p>\n<h3>垄断<\/h3>\n<p>一家独占、有壁垒 → 需求曲线就是市场需求曲线 → MR 低于价格 → 按 MR = MC 定产量、沿需求曲线定价 → 长期正利润与无谓损失。<\/p>\n<h3>一条共同的底层规则<\/h3>\n<p>四种结构都用 <strong>MR = MC<\/strong> 定产量。差别只在 MR 与价格的关系：<\/p>\n<ul><li>\n完全竞争：MR = P\n<\/li><li>\n垄断竞争与垄断：MR &lt; P\n<\/li><li>\n寡头：MR 取决于对手的反应\n<\/ul>\n<p>记住这一条，四章内容就串成了一条线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断者想定多高价就定多高&quot;——实际上高价会压缩销量，最优点在 MR = MC。\n<\/li><li>\n别以为&quot;垄断竞争等于垄断&quot;——实际上它没有壁垒，长期利润为零。\n<\/li><li>\n别以为&quot;寡头会自动合谋&quot;——实际上每家都有背叛动机，合谋不稳定。\n<\/li><li>\n别以为&quot;竞争越激烈对社会越好&quot;——实际上产品差别带来的多样性有价值，不能只看价格。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 14 章<\/td><td>竞争市场<\/td><td>P = MR = MC，长期零利润<\/td><\/tr><tr><td>第 15 章<\/td><td>垄断<\/td><td>MR 低于价格，产量压低，无谓损失<\/td><\/tr><tr><td>第 16 章<\/td><td>垄断竞争<\/td><td>相切均衡、超额能力、广告与品牌<\/td><\/tr><tr><td>第 17 章<\/td><td>寡头<\/td><td>策略互动、囚徒困境、卡特尔瓦解<\/td><\/tr><tr><td>第 22 章<\/td><td>前沿<\/td><td>信息不对称与市场势力的新问题<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n<strong>供需均衡<\/strong>（竞争市场的价格由市场给定）\n<\/li><li>\n<strong>剩余与效率<\/strong>（垄断的无谓损失来自产量压低）\n<\/li><li>\n<strong>机会成本与边际分析<\/strong>（MR = MC 是边际规则的应用）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：地基：稀缺、机会成本与经济学思维<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：经济学十大原理<\/a>、<a href=\"#/chapter/ch02\">第 2 章：像经济学家一样思考<\/a><br>检查点：能算出含隐性成本的经济利润<\/li><li class='path-step' id='path-02'><strong>步骤 02：贸易与供需<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：相互依存性与贸易的好处<\/a>、<a href=\"#/chapter/ch04\">第 4 章：供给与需求的市场力量<\/a><br>检查点：能算比较优势并画均衡图<\/li><li class='path-step' id='path-03'><strong>步骤 03：弹性与政府政策<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：弹性及其应用<\/a>、<a href=\"#/chapter/ch06\">第 6 章：供给、需求与政府政策<\/a><br>检查点：能判断价格管制后果<\/li><li class='path-step' id='path-04'><strong>步骤 04：剩余、赋税与国际贸易<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：消费者、生产者与市场效率<\/a>、<a href=\"#/chapter/ch08\">第 8 章：应用：赋税的代价<\/a>、<a href=\"#/chapter/ch09\">第 9 章：应用：国际贸易<\/a><br>检查点：能算总剩余、税收收入与无谓损失<\/li><li class='path-step' id='path-05'><strong>步骤 05：市场失灵与公共部门<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：外部性<\/a>、<a href=\"#/chapter/ch11\">第 11 章：公共物品和公共资源<\/a>、<a href=\"#/chapter/ch12\">第 12 章：税制的设计<\/a><br>检查点：能识别外部性与公共物品并选择工具<\/li><li class='path-step' id='path-06'><strong>步骤 06：成本与四种市场结构<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：生产成本<\/a>、<a href=\"#/chapter/ch14\">第 14 章：竞争市场上的企业<\/a>、<a href=\"#/chapter/ch15\">第 15 章：垄断<\/a>、<a href=\"#/chapter/ch16\">第 16 章：垄断竞争<\/a>、<a href=\"#/chapter/ch17\">第 17 章：寡头<\/a><br>检查点：能用 MR = MC 分析定价与效率<\/li><li class='path-step' id='path-07'><strong>步骤 07：劳动市场与收入分配<\/strong><br>阅读：<a href=\"#/chapter/ch18\">第 18 章：生产要素市场<\/a>、<a href=\"#/chapter/ch19\">第 19 章：收入与歧视<\/a>、<a href=\"#/chapter/ch20\">第 20 章：收入不平等与贫困<\/a><br>检查点：能算边际产量值、解释工资差距<\/li><li class='path-step' id='path-08'><strong>步骤 08：消费者选择与前沿议题<\/strong><br>阅读：<a href=\"#/chapter/ch21\">第 21 章：消费者选择理论<\/a>、<a href=\"#/chapter/ch22\">第 22 章：微观经济学前沿<\/a><br>检查点：能用无差异曲线求最优，区分两类信息失灵<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：经济学十大原理<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某人辞去年薪 12 万元的工作去读两年全日制硕士，每年学费与书本费合计 5 万元。他读硕士的机会成本约为多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 10 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 12 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 22 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 34 万元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一家影院平时票价 40 元，工作日上午几乎空场。经营者决定加开一场早场，票价 15 元。这个决定是否理性，取决于什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 15 元是否高于每张票的平均总成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 15 元是否高于加开一场的边际成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 15 元是否高于 40 元的一半<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 早场观众是否会在下午再买一张票<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 下列哪些属于曼昆所说「政府有时可以改善市场结果」的场合？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 产权界定不清，偷盗与违约频发<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 某行业由一家企业垄断并自行定价<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 工厂排污让下游居民承担成本<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 消费者偏好进口商品而非国产商品<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 「一国生活水平的长期水平取决于它生产物品与服务的能力」，这个能力在书里叫什么？（两字词）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：像经济学家一样思考<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 经济学家在模型中假设「其他条件不变」，这个做法最恰当的理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 为了让数学推导更简单<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 为了把要研究的变量从其他干扰因素中隔离出来<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 因为现实中其他条件确实永远不变<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 为了让结论更容易被大众接受<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 一国的生产组合落在生产可能性边界内部，最合理的解释是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 该国的技术已经落后于边界<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 资源未被充分利用或使用效率低<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 该国在两种产品上都已达到最优产量<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 该国的机会成本为零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 「最低工资应不应该提高到每小时 15 元」属于实证分析还是规范分析？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：相互依存性与贸易的好处<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 甲 1 小时能产 10 件衣服或 5 台电视，乙 1 小时能产 8 件衣服或 2 台电视。谁在电视上有比较优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 甲，因为他单位时间产量更高<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 乙，因为他放弃的衣服更少<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 甲，因为 1 台电视只放弃 2 件衣服<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 两人都没有<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某顶级外科医生做手术的收费是每小时 3000 元，他打扫自己家的效率也比保洁员高一倍。按比较优势，他应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 自己打扫，因为他效率更高<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 请保洁员，因为他打扫的机会成本远高于保洁费<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 自己打扫，因为请人还要花时间沟通<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 两人都不打扫，等家人来收拾<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 牧场主 1 盎司牛肉的机会成本是 2 磅土豆，农民是 6 磅土豆。两人交换牛肉时，1 盎司牛肉的土豆价格必须落在什么区间内才可能成交？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：供给与需求的市场力量<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 奶茶市场的需求为 Qd = 60 − 2P，供给为 Qs = 2P − 20。均衡价格与均衡数量是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> P=15，Q=30<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> P=20，Q=20<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> P=25，Q=10<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> P=10，Q=40<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 咖啡豆价格上涨，在其他条件不变的情况下，奶茶市场会出现什么变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 奶茶需求曲线右移，价格与数量都上升<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 奶茶供给曲线左移，价格上升、数量下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 奶茶需求曲线左移，价格与数量都下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 奶茶供给曲线右移，价格下降、数量上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 某年夏天既流行喝奶茶（需求右移），同时牛奶大幅涨价（供给左移）。可以确定的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格上涨，数量方向不确定<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格与数量都上涨<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 价格方向不确定，数量上涨<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 价格与数量都下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 「某商品价格从 20 元降到 15 元，其需求量从 20 杯增到 30 杯」，这属于需求量变化还是需求变化？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：弹性及其应用<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 价格从 10 元升到 12 元，需求量从 100 件降到 80 件。用中点法计算的需求价格弹性约为？<\/p><div class='quiz-opts'><label class='q 府不允许私人提供<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 消费者需求量太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 「每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担」导致草场被吃光，这种现象叫什么悲剧？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 解决公地悲剧的可行办法包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 把资源产权私有化<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 规定使用上限并管制<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 发放可交易的配额<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 完全免费开放并依靠使用者自觉<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：税制的设计<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某人年收入 10 万元，缴税 2 万元；再多挣 1 元要缴 0.4 元税。他的平均税率与边际税率分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 20% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 20% 与 40%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 40% 与 20%<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 40% 与 40%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 关于销售税的累进或累退性质，下列说法正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 销售税是比例税，因为税率统一<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 销售税通常是累退的，因为低收入者消费占收入比重更高<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 销售税通常是累进的<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无法判断，取决于商品种类<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 「谁从公共服务中受益更多，谁就该多缴税」属于哪种原则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 支付能力原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 受益原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 纵向公平原则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 比例税原则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 税收造成的效率损失来自哪些方面？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 改变相对价格导致交易减少的无谓损失<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 报税与合规的管理负担<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 高边际税率对工作与投资激励的抑制<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 政府把税收用于转移支付<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：生产成本<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 某店主年收入 60 万元，显性成本 45 万元，他投入的 20 万元资金本可获 5% 收益，自己本可年薪 10 万元。他的经济利润是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 15 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 4 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 5 万元<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 0 万元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 固定成本 30 元，产量为 5 时总成本 75 元。平均总成本是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 6 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 15 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 9 元<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 45 元<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么边际成本曲线一定穿过平均总成本曲线的最低点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 因为两者都由固定成本决定<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 因为新增一单位的成本低于平均会拉低平均，高于平均会拉高平均<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 因为边际成本总是递减的<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 因为平均成本总是等于边际成本<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 产量增加时每多雇一名工人带来的产出增量越来越少，这个规律叫什么？（八个字以内）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：竞争市场上的企业<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 完全竞争企业的利润最大化条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> P = ATC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> P = MC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> P = AVC<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> MR = ATC<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 某企业价格 13 元，产量 5 件，总成本 75 元，平均可变成本 9 元，固定成本 30 元。它应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 立即停业，因为亏损<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 继续生产，因为停业会亏得更多<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 提高价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 扩大产量到 ATC 最低点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 长期中竞争行业的均衡状态是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格高于最低 ATC，企业获得超额利润<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格等于最低 ATC，经济利润为零<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 价格等于 AVC 最低点<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 企业数量固定不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> 已经花掉、无法收回的成本叫什么成本？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：垄断<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自然垄断形成的根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 政府发放了独家牌照<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 规模经济一直持续到覆盖整个市场，一家供货成本最低<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 企业掌握了全部原材料<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 产品拥有专利<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 需求为 P = 30 − 0.5Q，则边际收益 MR 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 30 − Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 30 − 0.5Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 15 − Q<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 30 − 2Q<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 需求 P = 30 − 0.5Q，MC = 10 + Q。垄断者的产量与价格分别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> Q=10，P=25<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> Q=13.3，P=16.7<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> Q=10，P=20<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> Q=6.7，P=26.7<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 价格歧视可行的条件包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 能按支付意愿或人群特征区分买者<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 商品或服务无法转售套利<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 企业拥有市场势力<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 政府强制统一定价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：垄断竞争<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 垄断竞争企业长期均衡的核心特征是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 需求曲线与 ATC 曲线在最低点相切<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 需求曲线与 ATC 曲线相切，且切点在最低点左侧<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 价格等于边际成本<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 企业长期获得正的经济利润<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 垄断竞争与完全竞争最重要的差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 企业数量更多<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 产品存在差别，企业因此有少量定价权<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 没有进入壁垒<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 长期利润更高<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 支持广告的论点包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q03' value='0'> 降低消费者的搜寻成本<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='1'> 传递产品质量信号<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='2'> 一定降低产品价格<\/label><label class='quiz-opt'><input type='checkbox' name='q03' value='3'> 可能抬高进入壁垒<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch17__": "<h1>测验：第 17 章：寡头<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在囚徒困境式的寡头博弈中，双方都维持高价的合作结果为什么难以实现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 因为合作违法<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 因为任何一方单方面降价都能立即获益，背叛动机始终存在<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 因为消费者会抵制高价<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 因为政府强制低价<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 纳什均衡的含义是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 所有人的总收益最大<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 没有任何一方能在对手不变时单方面改变策略而获益<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 价格等于成本<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 企业数量最多<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='multi'><p class='quiz-q'><b>Q3.<\/b> 卡特尔难以长期维持的原因包括？<\/p><div class='quiz-opts'><label -feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 吉芬物品的特点是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 价格上升时需求量也上升<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 价格上升时需求量急剧下降<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 与替代品完全无关<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 只存在于完全竞争市场<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 无差异曲线的性质包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 向右下方倾斜<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 离原点越远满足度越高<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 两条曲线不相交<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 凸向原点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch22__": "<h1>测验：第 22 章：微观经济学前沿<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 买全额医疗保险的人更不注意保养身体，这属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 逆向选择<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 道德风险<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 信号失灵<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 锚定效应<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二手车市场上好车卖家退出，主要原因是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 买家只肯按平均质量出价，好车卖不到应有价格<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 二手车需求下降<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 政府限制交易<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 维修成本上升<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 阿罗不可能定理说明？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 民主制度注定失败<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 不存在同时满足所有合理公理的投票加总规则<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 多数投票总是最优<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 只要选民理性就能得到完美结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi'><p class='quiz-q'><b>Q4.<\/b> 下列属于行为经济学发现的现象是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> 损失厌恶<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> 锚定效应<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> 框架效应<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> 边际效用递减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='权衡取舍'>权衡取舍 — 多要一样东西就必须少要另一样，两个都想要的目标之间的此消彼长。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='机会成本'>机会成本 — 为了得到某样东西而放弃的东西的价值，包括账面支出和放弃的收益。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='理性人'>理性人 — 在可选范围内系统比较成本与收益、追求净收益最大的人；书里是分析起点，不是对真实人的道德评价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='边际变动'>边际变动 — 在现有基础上再多一单位或少一单位所带来的变化。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='激励'>激励 — 能改变人行为的东西，如价格、奖励、惩罚、规则。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='市场'>市场 — 买卖双方自发交换的场所与规则，靠价格传递稀缺信息。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='产权'>产权 — 对某项资源归谁所有、如何使用、收益归谁的界定。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为给旁观者带来成本或好处，而价格没有把这笔账算进去。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产率'>生产率 — 平均每个工人每小时生产的物品与服务量。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='通货膨胀'>通货膨胀 — 经济中物价总水平的普遍上涨，不是某几样商品涨价。 <span class=glossary-ref>（第 1 章：经济学十大原理）<\/span><\/li><li data-term='生产可能性边界'>生产可能性边界 — 在既定资源与技术下，经济能生产的两种产品的最大组合所连成的曲线。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='循环流量图'>循环流量图 — 把家庭与企业、物品市场与要素市场连成循环，用来展示收入与支出如何流动的模型。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='微观经济学'>微观经济学 — 研究单个决策者（家庭、企业）与单个市场如何配置资源。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='宏观经济学'>宏观经济学 — 研究整体经济现象，如通胀、失业、经济增长。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='实证分析'>实证分析 — 描述世界是什么样、某政策会导致什么结果，可用事实检验对错。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='规范分析'>规范分析 — 判断世界应该是什么样，包含价值判断，不能仅靠事实裁决。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下把总收益做到最大、或把浪费降到最小的状态。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='增长'>增长 — 生产能力本身扩大，表现为生产可能性边界向外移动。 <span class=glossary-ref>（第 2 章：像经济学家一样思考）<\/span><\/li><li data-term='绝对优势'>绝对优势 — 用相同的资源投入，能生产出更多某种产品的能力。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='比较优势'>比较优势 — 生产某种产品的机会成本低于他人的能力；决定分工的依据。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='机会成本'>机会成本 — 为生产一单位某产品而放弃的另一产品的数量。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上一种产品的通行价格，是国内是否出口或进口的判断基准。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='专业化'>专业化 — 把资源集中用于自己机会成本最低的产品生产。 <span class=glossary-ref>（第 3 章：相互依存性与贸易的好处）<\/span><\/li><li data-term='市场'>市场 — 买者与卖者交换某种物品或服务的场所与规则。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='竞争市场'>竞争市场 — 买卖者众多、产品基本相同、进出自由，任何单个参与者都无法影响价格的市场。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求量'>需求量 — 在某一具体价格下，买者愿意并且能够购买的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='需求法则'>需求法则 — 其他条件不变时，价格上升则需求量下降。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给量'>供给量 — 在某一具体价格下，卖者愿意并且能够出售的数量。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='供给法则'>供给法则 — 其他条件不变时，价格上升则供给量增加。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='均衡'>均衡 — 供给量等于需求量、市场没有过剩也没有短缺的状态。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='过剩'>过剩 — 供给量大于需求量的状态，价格有下降压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='短缺'>短缺 — 需求量大于供给量的状态，价格有上升压力。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='替代品'>替代品 — 一种商品价格上升会使另一种商品需求增加的商品对，如咖啡与奶茶。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='互补品'>互补品 — 一种商品价格上升会使另一种商品需求减少的商品对，如奶茶与珍珠。 <span class=glossary-ref>（第 4 章：供给与需求的市场力量）<\/span><\/li><li data-term='弹性'>弹性 — 一个变量对另一个变量变化的敏感程度，用百分比之比衡量。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='需求价格弹性'>需求价格弹性 — 需求量变动百分比与价格变动百分比之比。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='中点法'>中点法 — 用区间两端平均值作分母计算百分比变动，避免起点不同导致结果不同。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='富有弹性'>富有弹性 — 弹性绝对值大于 1，需求量对价格反应强烈。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='缺乏弹性'>缺乏弹性 — 弹性绝对值小于 1，需求量对价格反应微弱。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='总收益'>总收益 — 价格乘以销售数量，等于买者的总支出。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='收入弹性'>收入弹性 — 需求量变动百分比与收入变动百分比之比，用于判断正常品与劣等品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='交叉价格弹性'>交叉价格弹性 — 一种商品需求量变动百分比与另一种商品价格变动百分比之比，正值多为替代品，负值多为互补品。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='供给价格弹性'>供给价格弹性 — 供给量变动百分比与价格变动百分比之比，主要受时间长短影响。 <span class=glossary-ref>（第 5 章：弹性及其应用）<\/span><\/li><li data-term='价格上限'>价格上限 — 法律规定的最高售价，只有低于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='价格下限'>价格下限 — 法律规定的最低售价，只有高于均衡价时才有约束力。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='配给机制'>配给机制 — 价格不能出清时用于分配稀缺商品的办法，如排队、抽签、凭票、凭关系。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收归宿'>税收归宿 — 税收负担最终由谁承担，由供需弹性决定，与法律规定的纳税人无关。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='税收楔子'>税收楔子 — 买者支付的价格与卖者得到的价格之间的差额。 <span class=glossary-ref>（第 6 章：供给、需求与政府政策）<\/span><\/li><li data-term='支付意愿'>支付意愿 — 买者为一件物品最多愿意支付的金额。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='消费者剩余'>消费者剩余 — 支付意愿减去实际支付，衡量买者从交易中获得的好处。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='成本'>成本 — 卖者为生产一单位产品愿意接受的最低价格，等于其机会成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='生产者剩余'>生产者剩余 — 卖者实际得到的价格减去其成本。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='总剩余'>总剩余 — 消费者剩余与生产者剩余之和，衡量市场创造的总价值。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='效率'>效率 — 在既定资源下使总剩余最大，不浪费任何一方有得有失的交易机会。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='市场失灵'>市场失灵 — 市场自身无法实现总剩余最大，常见于市场势力与外部性。 <span class=glossary-ref>（第 7 章：消费者、生产者与市场效率）<\/span><\/li><li data-term='无谓损失'>无谓损失 — 税收使交易量减少而凭空消失的那部分总剩余，买卖双方与政府都没得到。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='拉弗曲线'>拉弗曲线 — 税额与税收收入之间的关系曲线，呈倒 U 形。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='税基'>税基 — 被征税的对象范围，如某类商品的全部销售额。 <span class=glossary-ref>（第 8 章：应用：赋税的代价）<\/span><\/li><li data-term='世界价格'>世界价格 — 世界市场上该商品的通行价格，决定一国出口还是进口。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='关税'>关税 — 对进口商品征收的税，使国内价格高于世界价格。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='进口配额'>进口配额 — 对进口数量的直接限制，效果与关税类似但政府得不到关税收入。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='幼稚产业论'>幼稚产业论 — 主张对新兴产业发展初期给予保护，成熟后再参与国际竞争。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='调整援助'>调整援助 — 对因贸易受损的工人和企业提供的救济、培训与搬迁支持。 <span class=glossary-ref>（第 9 章：应用：国际贸易）<\/span><\/li><li data-term='外部性'>外部性 — 一个人的行为对旁观者福利造成的影响，且未通过市场价格反映。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='负外部性'>负外部性 — 行为给旁观者带来成本，社会成本高于私人成本，市场会过量生产。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='正外部性'>正外部性 — 行为给旁观者带来收益，社会价值高于私人价值，市场会生产不足。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='矫正税'>矫正税 — 按每单位外部成本征收的税，使私人成本等于社会成本，也称庇古税。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='可交易许可证'>可交易许可证 — 政府设定排放总量并发放可买卖的许可，由市场决定谁减排。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='科斯定理'>科斯定理 — 产权清楚且交易成本足够低时，当事人谈判可达到有效率结果，与产权初始归属无关。 <span class=glossary-ref>（第 10 章：外部性）<\/span><\/li><li data-term='排他性'>排他性 — 能否阻止不付费的人使用某物品。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='竞争性'>竞争性 — 一个人使用某物品是否会减少他人可用的数量。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共物品'>公共物品 — 既无排他性也无竞争性的物品，如国防、路灯。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公共资源'>公共资源 — 无排他性但有竞争性的物品，如公海鱼群、拥堵道路。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='俱乐部物品'>俱乐部物品 — 有排他性但无竞争性的物品，如收费公路、有线电视。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='搭便车'>搭便车 — 不承担成本却享用公共物品收益的行为。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='公地悲剧'>公地悲剧 — 公共资源因无排他性被过度使用而枯竭的现象。 <span class=glossary-ref>（第 11 章：公共物品和公共资源）<\/span><\/li><li data-term='平均税率'>平均税率 — 总税额除以总收入，衡量整体负担。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='边际税率'>边际税率 — 新增一单位收入所适用的税率，决定额外工作的激励。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='受益原则'>受益原则 — 按从公共支出中受益的多少来分摊税负。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='支付能力原则'>支付能力原则 — 按纳税能力分摊税负，能力强者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='纵向公平'>纵向公平 — 收入不同的人缴税不同，高收入者多缴。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='横向公平'>横向公平 — 处境相同的人应缴相同的税。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累进税'>累进税 — 税额占收入比重随收入上升而上升的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='累退税'>累退税 — 税额占收入比重随收入上升而下降的税制。 <span class=glossary-ref>（第 12 章：税制的设计）<\/span><\/li><li data-term='总成本'>总成本 — 生产一定数量产品所投入的全部资源的成本，包括显性与隐性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='显性成本'>显性成本 — 实际付出现金的成本，如原料、工资、租金。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='隐性成本'>隐性成本 — 未付出现金但确实放弃的收益，如自有资金的机会成本、业主的时间。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='经济利润'>经济利润 — 总收益减去全部成本（显性加隐性）。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='会计利润'>会计利润 — 总收益减去显性成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际产量'>边际产量 — 多投入一单位可变要素所增加的产出。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='边际成本'>边际成本 — 多生产一单位产品所增加的总成本。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='平均总成本'>平均总成本 — 总成本除以产量。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='规模经济'>规模经济 — 产量扩大使长期平均总成本下降的现象。 <span class=glossary-ref>（第 13 章：生产成本）<\/span><\/li><li data-term='价格接受者'>价格接受者 — 无法影响市场价格、只能按市场价出售的企业。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='边际收益'>边际收益 — 多售出一单位产品所增加的总收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='利润最大化条件'>利润最大化条件 — 边际收益等于边际成本；竞争企业即价格等于边际成本。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='停业点'>停业点 — 价格低于平均可变成本最低点时，企业暂时停止生产。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='沉没成本'>沉没成本 — 已经发生且无法收回的成本，不影响当前决策。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='正常利润'>正常利润 — 经济利润为零时的回报水平，等于资源在其他用途上能获得的收益。 <span class=glossary-ref>（第 14 章：竞争市场上的企业）<\/span><\/li><li data-term='垄断'>垄断 — 一家企业独占市场，且存在其他企业难以进入的壁垒。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='自然垄断'>自然垄断 — 因规模经济使一家企业供货成本最低而形成的垄断，如电网、自来水。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='价格歧视'>价格歧视 — 对成本相同的商品向不同买者收取不同价格。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='寻租'>寻租 — 企业花费资源游说、诉讼以维持垄断地位，这部分支出不创造产出。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='反托拉斯法'>反托拉斯法 — 旨在限制垄断行为、维护竞争的法规。 <span class=glossary-ref>（第 15 章：垄断）<\/span><\/li><li data-term='垄断竞争'>垄断竞争 — 许多企业销售有差别的产品、可自由进出的市场结构。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='超额能力'>超额能力 — 垄断竞争企业长期产量低于平均总成本最低点对应的规模。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='品牌'>品牌 — 通过名称与形象传递质量与身份的标识，可降低消费者的信息成本。 <span class=glossary-ref>（第 16 章：垄断竞争）<\/span><\/li><li data-term='寡头'>寡头 — 少数几家企业主导、彼此高度依赖的市场结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='卡特尔'>卡特尔 — 企业之间就产量与价格达成的同盟，如 OPEC。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='囚徒困境'>囚徒困境 — 每个参与者单方面背叛都更有利、结果集体受损的博弈结构。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='纳什均衡'>纳什均衡 — 在给定他人策略下，没有任何一方能通过单独改变策略获益的状态。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='掠夺性定价'>掠夺性定价 — 以低于成本的价格挤走对手，再提价获取垄断利润的行为。 <span class=glossary-ref>（第 17 章：寡头）<\/span><\/li><li data-term='派生需求'>派生需求 — 对生产要素的需求由对最终产品的需求派生而来。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='边际产量值'>边际产量值 — 增加一单位要素投入所带来的产出增量乘以产品价格。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='人力资本'>人力资本 — 劳动者通过教育、培训、经验积累形成的生产能力。 <span class=glossary-ref>（第 18 章：生产要素市场）<\/span><\/li><li data-term='补偿性工资差别'>补偿性工资差别 — 因工作条件差异而对劳动者给予的工资补偿。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='超级明星现象'>超级明星现象 — 少数顶尖从业者占据大部分市场收入，因为其产出可低成本复制。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='效率工资'>效率工资 — 高于市场均衡水平的工资，用于提高积极性、降低流失、吸引更优秀的员工。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='歧视'>歧视 — 对具有相同生产能力的人因身份特征给予不同待遇。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='人力资本'>人力资本 — 教育、培训与经验形成的生产能力，是工资差距的重要解释变量。 <span class=glossary-ref>（第 19 章：收入与歧视）<\/span><\/li><li data-term='洛伦兹曲线'>洛伦兹曲线 — 按收入从低到高排列家庭后绘制的累计收入占比曲线。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='基尼系数'>基尼系数 — 衡量收入不平等程度的指标，0 为完全平均，1 为完全不均。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='贫困率'>贫困率 — 收入低于贫困线的家庭占总家庭的比例。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='功利主义'>功利主义 — 以最大多数人的最大幸福为目标的分配哲学。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由主义'>自由主义 — 罗尔斯式立场，主张制度应最大化最不利者的福利。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='自由至上主义'>自由至上主义 — 主张只要获取过程正当，结果不平等无需政府纠正。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='负所得税'>负所得税 — 收入低于一定水平时由政府补贴、随收入上升逐步退出的制度。 <span class=glossary-ref>（第 20 章：收入不平等与贫困）<\/span><\/li><li data-term='预算约束'>预算约束 — 消费者支出不超过收入的限制，写成 Px·x + Py·y = 收入。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='无差异曲线'>无差异曲线 — 给消费者带来同等满足程度的所有商品组合连成的线。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='边际替代率'>边际替代率 — 为多得到一单位横轴商品而愿意放弃的纵轴商品数量，等于无差异曲线斜率的绝对值。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='吉芬物品'>吉芬物品 — 价格上升时需求反而增加的极端劣等品。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='替代效应'>替代效应 — 价格变化使消费者转向相对便宜的商品所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='收入效应'>收入效应 — 价格变化改变实际购买力所引起的需求变化。 <span class=glossary-ref>（第 21 章：消费者选择理论）<\/span><\/li><li data-term='不对称信息'>不对称信息 — 交易一方掌握的信息多于另一方。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='逆向选择'>逆向选择 — 签约前因无法分辨质量导致优质方退出、市场平均质量下降。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='道德风险'>道德风险 — 签约后因风险转移而放松注意或改变行为。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='信号'>信号 — 信息优势方主动提供的可验证证据，造假成本高因而可信。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='筛选'>筛选 — 信息劣势方设计机制使对方暴露真实信息。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='中位投票人定理'>中位投票人定理 — 一维议题下多数投票结果趋向中位选民的偏好。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='阿罗不可能定理'>阿罗不可能定理 — 不存在同时满足所有合理公理的投票加总规则。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><li data-term='损失厌恶'>损失厌恶 — 同等金额的损失带来的负效用大于收益带来的正效用。 <span class=glossary-ref>（第 22 章：微观经济学前沿）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库（微观）<\/h1>\n<h2>框架一：边际比较<\/h2>\n<p><strong>何时用<\/strong>：任何&quot;要不要再多做一点&quot;的问题——多生产一杯、多雇一个人、多收一元税。 <strong>怎么用<\/strong>：算下一单位的收益与成本，比较；相等处停。 <strong>例子<\/strong>：企业按 MR = MC 定产量；政府按边际税率判断对劳动的抑制。<\/p>\n<h2>框架二：供需 + 楔子<\/h2>\n<p><strong>何时用<\/strong>：分析任何价格干预、税收、补贴、关税。 <strong>怎么用<\/strong>：先画原始均衡，再在买卖价格之间插入一个楔子（税、补贴、管制价），看成交量如何变化，剩余如何转移。 <strong>记法<\/strong>：楔子越大，成交量越小；损失的那块三角形就是代价。<\/p>\n<h2>框架三：三步判断市场结构<\/h2>\n<ol><li>\n卖者数量多不多？\n<\/li><li>\n产品有没有差别？\n<\/li><li>\n进入有没有壁垒？\n<\/ol>\n<p>答案组合直接对应四种结构，不用背定义。<\/p>\n<h2>框架四：外部性内部化<\/h2>\n<p><strong>何时用<\/strong>：出现第三方成本或收益时。 <strong>怎么做<\/strong>：把外部成本加到私人成本上（社会成本曲线），或把外部收益加到私人收益上；再选工具（税、补贴、许可证、产权）。<\/p>\n<h2>框架五：弹性定胜负<\/h2>\n<p>任何&quot;谁承担、谁受损&quot;的问题，先问两边的弹性。<\/p>\n<ul><li>\n税负：弹性小的一方多承担。\n<\/li><li>\n政策伤害：弹性小的一方受冲击小。\n<\/li><li>\n收益：弹性小于 1 时涨价增收。\n<\/ul>\n<h2>决策规则<\/h2>\n<ul><li>\n若 P &gt; ATC → 有钱赚，考虑进入或扩产。\n<\/li><li>\n若 AVC &lt; P &lt; ATC → 亏但继续生产，亏损小于停业。\n<\/li><li>\n若 P &lt; AVC → 停业。\n<\/li><li>\n若 P &gt; AVC 且长期 P &lt; ATC → 退出该行业。\n<\/li><li>\n若某事的边际收益 &gt; 边际成本 → 做；反之不做。\n<\/ul>\n<h2>反模式（作者明确反对的做法）<\/h2>\n<ul><li>\n<strong>把沉没成本算进决策<\/strong>：已经花掉的钱不影响&quot;下一步&quot;，因而不该左右判断。\n<\/li><li>\n<strong>用平均代替边际<\/strong>：平均成本低不代表多生产一单位就赚。\n<\/li><li>\n<strong>把价格管制当万能药<\/strong>：上限造成短缺，下限造成过剩，善意不等于有效。\n<\/li><li>\n<strong>把&quot;保护就业&quot;等同于&quot;禁止进口&quot;<\/strong>：贸易政策不改变总就业，只改变结构。\n<\/li><li>\n<strong>用总量掩盖分配<\/strong>：GDP 与总剩余都不回答&quot;谁得了好处&quot;。\n<\/ul>", "__cheatsheet__": "<h1>速查表（微观）<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>均衡<\/td><td>Qd = Qs，解得 P<em> 与 Q<\/em><\/td><\/tr><tr><td>需求价格弹性<\/td><td>E = (ΔQ/Q) ÷ (ΔP/P)；&gt;1 富有弹性<\/td><\/tr><tr><td>收益<\/td><td>TR = P × Q；弹性 &lt;1 时涨价增收<\/td><\/tr><tr><td>消费者剩余<\/td><td>支付意愿 − 实际支付（需求线以上、价格线以下面积）<\/td><\/tr><tr><td>生产者剩余<\/td><td>实际收入 − 成本（价格线以下、供给线以上面积）<\/td><\/tr><tr><td>税收收入<\/td><td>税额 × 税后成交量<\/td><\/tr><tr><td>无谓损失<\/td><td>楔子造成的三角形面积，随弹性增大而增大<\/td><\/tr><tr><td>经济利润<\/td><td>总收益 − 显性成本 − 隐性成本<\/td><\/tr><tr><td>利润最大化<\/td><td>MR = MC；竞争企业 P = MC<\/td><\/tr><tr><td>平均成本<\/td><td>ATC = TC/Q；MC 穿过 ATC 最低点<\/td><\/tr><tr><td>垄断 MR<\/td><td>线性需求 P = a − bQ 时 MR = a − 2bQ<\/td><\/tr><tr><td>边际产量值<\/td><td>VMPL = MPL × P；雇到 VMPL = 工资<\/td><\/tr><tr><td>消费者最优<\/td><td>MRS = Px/Py<\/td><\/tr><\/tbody><\/table>\n<h2>常约定量示例（全书统一）<\/h2>\n<ul><li>\n需求 Qd = 60 − 2P，供给 Qs = 2P − 20 → 均衡 20 元、20 杯。\n<\/li><li>\n6 元税 → 买者付 23、卖者得 17、成交量 14、税收 84、无谓损失 18。\n<\/li><li>\n3 元关税（世界价 15 提到 18）→ 进口从 16 降到 8、关税收入 24、无谓损失 18。\n<\/li><li>\n4 元负外部性 → 社会最优 Q = 16、P = 22、无谓损失 8。\n<\/li><li>\n垄断 D: P = 30 − 0.5Q、MC: P = 10 + Q → Q = 10、P = 25；竞争 Q ≈ 13.3、P ≈ 16.7。\n<\/ul>\n<h2>判断流程<\/h2>\n<ol><li>\n这是哪种市场结构？（数量、差别、壁垒）\n<\/li><li>\n有没有外部性、公共物品、信息不对称？（市场失灵检查）\n<\/li><li>\n决策者面对的是边际问题还是总量问题？\n<\/li><li>\n谁弹性小，谁就多承担成本。\n<\/ol>\n<h2>常见数值记忆<\/h2>\n<ul><li>\n弹性 = 1 时总收入最大。\n<\/li><li>\n税收收入先增后减（拉弗曲线形状），峰值在中等税率。\n<\/li><li>\n垄断价格高于竞争、产量低于竞争，差额造成无谓损失。\n<\/li><li>\n垄断竞争长期：P = ATC &gt; MC，产量低于效率规模。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
</body>
</html>
