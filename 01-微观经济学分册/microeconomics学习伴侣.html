=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 8 章示例：6 元税的无谓损失<\/text><polygon points=\"177.3,130.3 177.3,185.0 223.3,157.6\" fill=\"#ea580c\" fill-opacity=\"0.50\" stroke=\"none\"/><polygon points=\"70.0,185.0 177.3,185.0 177.3,130.3 70.0,130.3\" fill=\"#6b7280\" fill-opacity=\"0.22\" stroke=\"none\"/><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"89.3\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">供给 S<\/text><polyline points=\"70.0,194.1 177.3,130.3 223.3,102.9\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"235.0\" y=\"93.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">税后供给 S′<\/text><line x1=\"177.3\" y1=\"130.3\" x2=\"70.0\" y2=\"130.3\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"177.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"218.3\" y1=\"152.6\" x2=\"228.3\" y2=\"162.6\" stroke=\"#111827\" stroke-width=\"2\"/><line x1=\"218.3\" y1=\"162.6\" x2=\"228.3\" y2=\"152.6\" stroke=\"#111827\" stroke-width=\"2\"/><text x=\"77.7\" y=\"115.7\" font-size=\"11.5\" fill=\"#111827\">税收收入 84<\/text><text x=\"234.1\" y=\"135.8\" font-size=\"11.5\" fill=\"#111827\">无谓损失 18<\/text><text x=\"151.3\" y=\"119.4\" font-size=\"11.5\" fill=\"#111827\">买者付 23<\/text><text x=\"151.3\" y=\"181.4\" font-size=\"11.5\" fill=\"#111827\">卖者得 17<\/text><text x=\"77.7\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">交易量 20 → 14 杯<\/text><\/svg>\n<p>看图说明：灰色矩形是税收收入（84 元），橙色三角形是无谓损失（18 元）。矩形是从私人部门转移到政府，三角形是净损失。判断一项税收政策好坏，要同时看这两个形状的相对大小。<\/p>\n<h3>为什么无谓损失不是&quot;损失给政府&quot;<\/h3>\n<p>常见误解是&quot;税都被政府拿走了，所以只是转移&quot;。不对。政府拿走的是矩形那部分，确实是转移。三角形那部分是<strong>交易根本没发生<\/strong>，谁也没得到。它的本质是资源没被使用，而不是财富被没收。<\/p>\n<h3>决定无谓损失大小的两个因素<\/h3>\n<ol><li>\n<strong>弹性<\/strong>。弹性越大，同样的税会挤出越多的交易，三角形越大。极端情形：需求或供给完全无弹性（垂直线），数量不变，无谓损失为零——但此时税负全部由弹性小的一方承担。\n<\/li><li>\n<strong>税额<\/strong>。税额越大，三角形的底和高同时变大，所以无谓损失按税额的<strong>平方<\/strong>增长。税翻倍，无谓损失约变成四倍。\n<\/ol>\n<p>第 2 条是政策设计里最有用的结论：<strong>小额税几乎不伤效率，大额税会急剧伤害效率<\/strong>。所以同样是收 100 亿元税，宽税基、低税率的组合比窄税基、高税率的组合效率损失小得多。<\/p>\n<h3>税收收入与拉弗曲线<\/h3>\n<p>政府税收 = 税额 × 税后交易量。税额上升时，前一个因子增大、后一个因子减小，两者方向相反。<\/p>\n<ul><li>\n税额从零开始增加：数量减少得还不多，收入上升。\n<\/li><li>\n税额继续增加：数量掉得越来越快，收入增长放缓。\n<\/li><li>\n税额高到一定程度：税率再提，数量暴跌，收入反而下降。\n<\/li><li>\n税额等于或超过买者的最高支付意愿：没人买，收入为零。\n<\/ul>\n<p>把&quot;税额&quot;和&quot;税收收入&quot;画成一条曲线，就是一个倒 U 形，叫<strong>拉弗曲线<\/strong>（Laffer curve）。它说明存在一个使收入最大的税率点。<\/p>\n<p>第 8 章只建立这个几何关系，不主张&quot;减税一定增收&quot;。要判断当前税率在峰的左边还是右边，需要知道具体的弹性数值，而这在现实中很难测准。第 12 章讨论税制设计时会再谈这个问题的政策含义。<\/p>\n<h3>一个必须区分的对比<\/h3>\n<table><thead><tr><th>项目<\/th><th>随税额增加如何变化<\/th><\/tr><\/thead><tbody><tr><td>税收收入<\/td><td>先增后减，倒 U 形<\/td><\/tr><tr><td>无谓损失<\/td><td>持续增，按平方增长<\/td><\/tr><tr><td>交易量<\/td><td>持续减<\/td><\/tr><tr><td>买者价格<\/td><td>持续升<\/td><\/tr><tr><td>卖者价格<\/td><td>持续降<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的骨架。考试里问&quot;税额翻倍，收入和无谓损失各变成多少&quot;，答案通常不是&quot;都翻倍&quot;——收入可能只增加一点甚至下降，无谓损失约翻四倍。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比：门票涨价。<\/strong> 景区门票从 50 元涨到 100 元，收入未必增加。涨价带来的每位游客多付 50 元，可能被&quot;少来了一半游客&quot;抵消。涨到极高时，景区空无一人，收入归零。这条曲线和拉弗曲线同构。类比的失效边界：景区可以限制人数从而维持高价，税收没有这种配额手段；而且游客可以选择别的景区（替代品），税收的替代品是&quot;不交易&quot;，两者弹性机制不完全一样。<\/p>\n<p><strong>实例：两种税的比较。<\/strong> A 商品需求弹性 0.2（如食盐），B 商品需求弹性 2.0（如进口香水）。两者都征 10% 的税，税基相同。A 的交易量几乎不变，无谓损失小；B 的交易量大幅下降，无谓损失大。所以从效率角度，宽税基、低税率的消费税优于对少数高弹性商品征重税。第 12 章讲&quot;税制设计&quot;时会把这个结论展开。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;税只是把钱从私人手里转到政府手里&quot;——实际上被挤掉的交易价值是净损失，谁也没拿到。\n<\/li><li>\n别以为&quot;无谓损失与税额成正比&quot;——实际上它大致与税额的平方成正比。\n<\/li><li>\n别以为&quot;提高税率一定能增加税收&quot;——实际上超过某个点后收入会下降，具体在哪一点取决于弹性。\n<\/li><li>\n别以为&quot;无谓损失为零就是好税&quot;——实际上零无谓损失意味着数量完全不变，此时税负全压在弹性小的一方身上，公平问题可能更严重。\n<\/ul>\n<ol><li>\n（单选）某市场均衡数量 20 件，征 6 元税后数量降到 14 件。无谓损失约为？\n<p>A. 84 元  B. 36 元  C. 18 元  D. 6 元 <strong>答案<\/strong>：C；<strong>解析<\/strong>：无谓损失三角形面积 = ½ × 税额 6 × 减少数量 6 = 18 元。84 元是税收收入，别把两者混淆。<\/p>\n<\/ol>\n<ol><li>\n（单选）若税额从 6 元提高到 12 元（弹性保持不变），无谓损失大致会变成原来的？\n<p>A. 1 倍，即不变  B. 2 倍  C. 4 倍  D. 8 倍 <strong>答案<\/strong>：C；<strong>解析<\/strong>：无谓损失与税额的平方成正比。税额翻倍，三角形底与高同时约翻倍，面积约变四倍。<\/p>\n<\/ol>\n<ol><li>\n（单选）某种商品的供给完全无弹性。对它征税的无谓损失是？\n<p>A. 最大  B. 为零，因为交易量不变  C. 等于税收收入  D. 无法判断 <strong>答案<\/strong>：B；<strong>解析<\/strong>：供给曲线垂直时，征税不会减少交易量，三角形底或高为零，无谓损失为零；但税负全部由卖者承担。<\/p>\n<\/ol>\n<ol><li>\n（填空）描述「税额上升时税收收入先增后减」的那条倒 U 形曲线叫什么？\n<p><strong>答案<\/strong>：拉弗曲线；<strong>解析<\/strong>：拉弗曲线刻画税额与税收收入的关系。税额过高时交易量暴跌，收入反而下降，因此存在使收入最大的税率点。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n无谓损失 = ½ × 税额 × 减少的交易量，对应&quot;没发生的那批交易&quot;的价值。\n<\/li><li>\n弹性越大、税额越大，无谓损失越大；税额翻倍约等于无谓损失翻四倍。\n<\/li><li>\n税收收入呈倒 U 形的拉弗曲线；无谓损失则单调上升。\n<\/ul>", "ch09": "<h1>第 9 章：应用：国际贸易<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 3、6、7、8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用世界价格与国内均衡价格的比较，判断一国该出口还是进口某种商品。\n<\/li><li>\n分别算出出口国与进口国的赢家、输家和净福利变化。\n<\/li><li>\n算出关税造成的无谓损失，并评价「国家安全」「幼稚产业」等贸易保护论据。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>贸易把国内价格拉到世界价格：出口让国内价格上升、进口让国内价格下降。两种情况都让总福利增加，但都有一方受损——所以贸易政策真正的难点是分配，不是效率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>谁出口，谁进口<\/h3>\n<p>判断标准只有一条比较：<strong>世界价格 vs 国内均衡价格<\/strong>。<\/p>\n<ul><li>\n世界价格高于国内价格：本国生产便宜，卖到国外更赚，于是出口。\n<\/li><li>\n世界价格低于国内价格：国外生产便宜，买进来更省，于是进口。\n<\/ul>\n<p>背后的道理还是比较优势（第 3 章）：一国在自己机会成本低的产品上出口，在机会成本高的产品上进口。<\/p>\n<h3>出口国的赢家与输家<\/h3>\n<p>设奶茶的国内均衡是 20 元、20 杯。世界价格 25 元（高于国内价），于是开始出口。国内价格被拉到 25 元（否则没人愿意在国内卖），国内产量增加到 30 杯，出口 10 杯。<\/p>\n<ul><li>\n<strong>生产者受益<\/strong>：价格从 20 涨到 25，产量也增加，生产者剩余从 100 元升到 ½×30×(25−10) = 225 元。\n<\/li><li>\n<strong>消费者受损<\/strong>：国内买者要付 25 元，消费者剩余从 100 元降到 ½×10×(30−25) = 25 元。\n<\/li><li>\n<strong>净福利<\/strong>：225 + 25 = 250 元，比封闭时的 200 元多 50 元。\n<\/ul>\n<p>那 50 元是贸易创造的价值，来自&quot;本国把资源用在更擅长的产品上&quot;。<\/p>\n<h3>进口国的赢家与输家<\/h3>\n<p>设世界价格 15 元（低于国内 20 元），开始进口。国内价格降到 15 元，国内产量降到 10 杯，进口 20 杯。<\/p>\n<ul><li>\n<strong>消费者受益<\/strong>：消费者剩余从 100 元升到 ½×30×(30−15) = 225 元。\n<\/li><li>\n<strong>生产者受损<\/strong>：生产者剩余从 100 元降到 ½×10×(15−10) = 25 元。\n<\/li><li>\n<strong>净福利<\/strong>：225 + 25 = 250 元，同样多 50 元。\n<\/ul>\n<p>注意两个方向的结构完全对称：受益方都是&quot;价格变动方向上占优的一方&quot;，受损方都是&quot;被价格变动挤压的一方&quot;。<strong>出口国的消费者受损，进口国的生产者受损<\/strong>。<\/p>\n<h3>关税的账<\/h3>\n<p>对进口商品征 3 元关税，国内价格从 15 元升到 18 元。用同一组方程（Qd = 60 − 2P，Qs = 2P − 20）：<\/p>\n<ul><li>\n国内需求：Qd = 60 − 36 = 24 杯\n<\/li><li>\n国内供给：Qs = 36 − 20 = 16 杯\n<\/li><li>\n进口：8 杯（原来 20 杯）\n<\/ul>\n<p>福利变化：<\/p>\n<ul><li>\n消费者剩余：½ × 24 × (30 − 18) = 144 元（原来 225 元），损失 81 元\n<\/li><li>\n生产者剩余：½ × 16 × (18 − 10) = 64 元（原来 25 元），增加 39 元\n<\/li><li>\n政府关税收入：3 × 8 = 24 元\n<\/ul>\n<p>总福利：144 + 64 + 24 = 232 元，比自由贸易的 250 元少 18 元。<\/p>\n<p>这 18 元分两块，都是无谓损失：<\/p>\n<ol><li>\n<strong>生产效率损失<\/strong>：国内高成本的生产者多生产了 6 杯（从 10 到 16），这 6 杯的成本高于世界价格，资源被用在了效率更低的地方。\n<\/li><li>\n<strong>消费效率损失<\/strong>：消费者少买了 6 杯（从 30 到 24），这些杯对他们的价值高于世界价格，却没买到。\n<\/ol>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 9 章示例：进口国加征 3 元关税<\/text><polyline points=\"376.7,248.8 300.0,203.2 223.3,157.6 146.7,112.1 70.0,66.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"81.7\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">国内需求 D<\/text><polyline points=\"70.0,248.8 146.7,203.2 223.3,157.6 300.0,112.1 376.7,66.5\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"57.0\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">国内供给 S<\/text><polyline points=\"70.0,203.2 530.0,203.2\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"411.3\" y=\"206.5\" font-size=\"12\" fill=\"#6b7280\" font-weight=\"600\">世界价格 15<\/text><polyline points=\"70.0,175.9 530.0,175.9\" fill=\"none\" stroke=\"#ea580c\" stroke-width=\"2.2\" stroke-dasharray=\"6,4\"/><text x=\"411.3\" y=\"166.4\" font-size=\"12\" fill=\"#ea580c\" font-weight=\"600\">关税后 18<\/text><line x1=\"146.7\" y1=\"203.2\" x2=\"146.7\" y2=\"340.0\" stroke=\"#6b7280\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"300.0\" y1=\"203.2\" x2=\"300.0\" y2=\"340.0\" stroke=\"#6b7280\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"175.9\" x2=\"192.7\" y2=\"340.0\" stroke=\"#ea580c\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"254.0\" y1=\"175.9\" x2=\"254.0\" y2=\"340.0\" stroke=\"#ea580c\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"154.3\" y=\"216.0\" font-size=\"11.5\" fill=\"#111827\">进口 20 杯<\/text><text x=\"200.3\" y=\"163.1\" font-size=\"11.5\" fill=\"#111827\">进口 8 杯<\/text><text x=\"189.6\" y=\"42.8\" font-size=\"11.5\" fill=\"#6b7280\">自由贸易时消费者多买 20 杯，关税后只剩 8 杯<\/text><\/svg>\n<p>看图说明：灰线与橙线之间是关税楔子。两条竖虚线分别标出&quot;国内生产量&quot;和&quot;国内需求量&quot;，两者的水平距离就是进口量。关税越高，两条线越近，进口越少，两块三角形越大。<\/p>\n<h3>四个常见的保护论据<\/h3>\n<ol><li>\n<strong>就业论<\/strong>。进口会冲击进口竞争行业，工人失业。反驳：关税保住了这些岗位，但消费者多付的钱会减少其他行业的就业，净就业未必增加；而且被保护的岗位往往工资更低、效率更差。\n<\/li><li>\n<strong>国家安全论<\/strong>。关键物资（粮食、芯片、能源）不能依赖外国。这一条在特定行业确实成立，问题是它的适用范围容易被无限扩大，任何行业都能说自己是&quot;战略行业&quot;。\n<\/li><li>\n<strong>幼稚产业论<\/strong>。新产业起步阶段需要保护，等成熟后再放开。反驳：保护一旦建立就很难撤销，被保护的企业缺乏改进动力；而且很难判断哪个产业&quot;值得&quot;保护。\n<\/li><li>\n<strong>不公平竞争论<\/strong>。对方有补贴、有倾销，所以要加关税。反驳：对方补贴等于送你便宜货，加关税是让自己买贵；真正该做的是用反补贴、反倾销的规则程序，而不是普遍加税。\n<\/ol>\n<h3>为什么贸易政策常走向保护<\/h3>\n<p>因为<strong>输家集中、赢家分散<\/strong>。进口竞争行业的工人和企业在同一个地区、同一个工会，组织起来游说成本低；受益的消费者有上亿人，每人多得几十元，没人愿意为此上街。政治机制对集中利益的反应远强于对分散利益的反应——这是第 36 章讲政策争论时会再遇到的同一个机制。<\/p>\n<p>经济学界的主流看法是：自由贸易提高总福利，但必须配套<strong>调整援助<\/strong>（失业救济、再培训、搬迁补贴），否则受损者承担了全部成本，政治上就不可持续。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;进口会减少本国就业总量&quot;——实际上进口减少的是某些行业的岗位，同时增加出口行业和其他行业的岗位，总量取决于宏观环境。\n<\/li><li>\n别以为&quot;贸易顺差就是好事&quot;——实际上顺差意味着一国在向外输出资本，长期看是储蓄大于投资的结果，第 31 章会仔细讲。\n<\/li><li>\n别以为&quot;关税由外国出口商支付&quot;——实际上关税由进口国的消费者和国内生产者分担，出口商只在下游价格被压时承担一部分。\n<\/li><li>\n别以为&quot;贸易让所有人受益&quot;——实际上总量增加不等于每个人都增加，受损者需要单独补偿。\n<\/ul>\n<ol><li>\n（单选）某商品国内均衡价 20 元，世界价格 15 元。该国最可能？\n<p>A. 出口该商品，国内价格升到 20 元以上  B. 进口该商品，国内价格降到 15 元  C. 既不进口也不出口  D. 出口该商品，但国内价格不变 <strong>答案<\/strong>：B；<strong>解析<\/strong>：世界价格低于国内均衡价，进口更便宜，国内价格被压到世界价格 15 元，国内产量下降、消费量上升。<\/p>\n<\/ol>\n<ol><li>\n（多选）一国从封闭转向进口自由贸易，下列哪些判断正确？\n<p>A. 消费者剩余增加  B. 国内生产者剩余减少  C. 总福利增加  D. 国内产量增加 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：进口使国内价格下降：消费者受益、生产者受损、总福利增加。国内产量因价格下降而减少，不是增加。<\/p>\n<\/ol>\n<ol><li>\n（单选）进口国对每件商品征 3 元关税，进口量从 20 件降到 8 件。关税造成的无谓损失约为？\n<p>A. 24 元  B. 18 元  C. 12 元  D. 3 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：两块三角形的总面积 = ½ × 3 × 6 + ½ × 3 × 6 = 18 元，对应国内多生产 6 件与消费少买 6 件的效率损失。24 元是关税收入。<\/p>\n<\/ol>\n<ol><li>\n（填空）「新产业需要保护，成熟后再放开」这一贸易保护论据通常被称作什么论？（四字）\n<p><strong>答案<\/strong>：幼稚产业论；<strong>解析<\/strong>：幼稚产业论主张新兴产业在起步阶段需要保护。反驳点是保护难以撤销、企业缺乏改进动力，且难以判断哪些产业值得保护。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n世界价格高于国内价则出口，低于则进口。\n<\/li><li>\n出口国：生产者受益、消费者受损；进口国：消费者受益、生产者受损；两者净福利都增加。\n<\/li><li>\n关税造成两类无谓损失：生产效率损失与消费效率损失。\n<\/ul>", "ch10": "<h1>第 10 章：外部性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个案例是正外部性还是负外部性，并说出社会成本（或社会价值）与私人成本（或私人价值）的差额。\n<\/li><li>\n用图形算出负外部性下市场产量与社会最优产量的差、以及无谓损失。\n<\/li><li>\n比较矫正税与可交易许可证在控制污染上的差别。\n<\/li><li>\n说出科斯定理成立的条件，并解释为什么现实中它常常失效。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部性是价格漏算的一笔账：当事人做决定时没把对别人的影响算进去，于是市场产量偏离了社会最优——负外部性时生产太多，正外部性时生产太少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>外部性是什么<\/h3>\n<p><strong>外部性<\/strong>（externality）是一个人的行为对旁观者福利的影响，而这种影响没有通过价格反映出来。工厂排污，下游居民受损，但水的价格里没有这笔成本；有人打了疫苗，周围人也更安全，但接种者没得到这份好处的报酬。<\/p>\n<p>判断方法很简单：问&quot;这件事的成本或收益，有没有落在做决定的人身上&quot;。没落在，就是外部性。<\/p>\n<h3>负外部性：市场生产太多<\/h3>\n<p>以奶茶店为例。每卖一杯，店里承担原料、人工、房租；但深夜的噪音让楼上住户睡不着，这笔成本由住户承担。假设每杯带来 4 元的噪音成本。<\/p>\n<ul><li>\n<strong>私人成本<\/strong>：店里付的成本，对应原来的供给曲线 S。\n<\/li><li>\n<strong>社会成本<\/strong>：私人成本 + 4 元外部成本，对应 S′，整体向上平移 4 元。\n<\/ul>\n<p>原均衡 20 元、20 杯。社会的角度看，第 20 杯的真实成本是 20 + 4 = 24 元，而买者只愿意付 20 元——这一杯社会是亏的。社会最优在 S′ 与需求的交点：60 − 2P = 2P − 28，得 P = 22、Q = 16。<\/p>\n<p>结论：市场产量 20 杯，社会最优 16 杯，<strong>过量生产 4 杯<\/strong>。这 4 杯的无谓损失 = ½ × 4 × 4 = 8 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 10 章示例：4 元外部成本下的社会最优<\/text><polygon points=\"192.7,169.5 192.7,200.5 223.3,185.0\" fill=\"#ea580c\" fill-opacity=\"0.40\" stroke=\"none\"/><polyline points=\"376.7,262.5 300.0,223.8 223.3,185.0 146.7,146.2 70.0,107.5\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"81.7\" y=\"119.0\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,262.5 146.7,223.8 223.3,185.0 300.0,146.2\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"258.0\" y=\"131.4\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">私人成本 S<\/text><polyline points=\"70.0,231.5 131.3,200.5 192.7,169.5 254.0,138.5 300.0,115.2\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"265.7\" y=\"95.8\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">社会成本 S′<\/text><line x1=\"223.3\" y1=\"185.0\" x2=\"223.3\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"169.5\" x2=\"192.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"223.3\" y1=\"185.0\" x2=\"70.0\" y2=\"185.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"192.7\" y1=\"169.5\" x2=\"70.0\" y2=\"169.5\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"231.0\" y=\"175.7\" font-size=\"11.5\" fill=\"#111827\">市场均衡 20 杯<\/text><text x=\"135.9\" y=\"158.7\" font-size=\"11.5\" fill=\"#111827\">社会最优 16 杯<\/text><text x=\"188.1\" y=\"43.9\" font-size=\"11.5\" fill=\"#6b7280\">过量生产 4 杯；每杯 4 元外部成本，无谓损失 8 元<\/text><\/svg>\n<p>看图说明：绿线（社会成本）在红线（私人成本）上方，距离等于外部成本。市场均衡落在蓝线与红线的交点，社会最优落在蓝线与绿线的交点——市场总是偏向&quot;多生产&quot;那一侧。这是负外部性的通用图形。<\/p>\n<h3>正外部性：市场生产太少<\/h3>\n<p>反过来，如果一件事带给旁观者好处而当事人没得到报酬，市场就会做得不够。典型例子：教育（受教育者更有生产能力，社会也减少犯罪、提高公共决策质量）、疫苗、基础研究、修缮历史建筑。<\/p>\n<p>图形上，社会价值曲线在私人需求曲线上方，两条线的交点差出一个&quot;产量缺口&quot;。解决方向是补贴，让私人收益接近社会收益。<\/p>\n<h3>政策工具一：管制<\/h3>\n<p><strong>命令与控制<\/strong>（command-and-control）：直接规定排放上限、要求安装某类设备、禁止某种工艺。优点是效果确定，缺点是不问成本——不管减排一吨要花 100 元还是 10000 元，都按同一标准执行，总成本会很高。<\/p>\n<h3>政策工具二：矫正税<\/h3>\n<p><strong>矫正税<\/strong>（corrective tax，书中译作「排污税」，也称庇古税）：按每单位外部成本征税，把外部成本&quot;内化&quot;进价格。每杯 4 元噪音税，供给曲线正好上移到社会成本线，市场自动走到 16 杯。<\/p>\n<p>它的两个好处：<\/p>\n<ol><li>\n达到最优产量，且是<strong>最低成本<\/strong>的方式——愿意花小钱减排的人先减，减排成本高的人交税。\n<\/li><li>\n政府得到收入，可以用来补偿受损者或降低其他税。\n<\/ol>\n<h3>政策工具三：可交易许可证<\/h3>\n<p>政府先定总量（比如全城每月只允许 100 吨排放），再把许可证发给企业，允许企业之间买卖。<\/p>\n<ul><li>\n想多排的企业买许可证，减排便宜的企业卖许可证——<strong>总量控制 + 市场配置<\/strong>。\n<\/li><li>\n与矫正税的关键差别：<strong>税定价格、量不定；许可证定量、价不定<\/strong>。如果环境临界点很硬（比如总量必须低于某个值），许可证更合适；如果更在意企业成本可预期，税更合适。\n<\/ul>\n<h3>私人解决方法与科斯定理<\/h3>\n<p><strong>科斯定理<\/strong>（Coase theorem）：如果产权界定清楚、交易成本足够低，那么不管产权最初给谁，当事人之间的谈判都能达到有效率的结果。<\/p>\n<p>一个经典例子：牧场主的牛踩坏了农夫的庄稼。如果牧场主有权让牛自由吃草，农夫可以付钱请他减少牛的数量；如果农夫有权要求庄稼不受损，牧场主可以付钱购买&quot;损害权&quot;。两种产权安排下，最终牛的数量都停在同一个有效率水平——产权只决定谁付钱给谁。<\/p>\n<p><strong>为什么现实中常常失效<\/strong>：<\/p>\n<ol><li>\n<strong>交易成本高<\/strong>。涉及成千上万人时，谈判、组织、监督的成本超过收益。\n<\/li><li>\n<strong>产权难以界定<\/strong>。空气、海洋、气候的产权归谁？没法谈。\n<\/li><li>\n<strong>信息不对称与策略行为<\/strong>。各方为了压低价格会隐藏真实成本，谈判可能破裂。\n<\/li><li>\n<strong>搭便车<\/strong>。受益者众多时，没人愿意出头付费。\n<\/ol>\n<p>所以科斯定理的价值不在于&quot;政府不用管&quot;，而在于<strong>指出政府该管什么<\/strong>：产权界定、降低交易成本、以及在交易成本过高时直接介入。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;外部性只指污染&quot;——实际上正外部性同样普遍，教育、疫苗、研发都是。\n<\/li><li>\n别以为&quot;矫正税就是为了收钱&quot;——实际上它的目的是让价格反映真实成本，税收收入只是副产品。\n<\/li><li>\n别以为&quot;科斯定理说市场能自己解决一切&quot;——实际上它有三个严格前提，缺一个就得靠政府或其他制度安排。\n<\/li><li>\n别以为&quot;管制比税更严格所以更好&quot;——实际上管制不问成本，可能用极高的代价换来很小的减排，总福利反而下降。\n<\/ul>\n<ol><li>\n（单选）某工厂每生产一件产品产生 4 元污染成本由居民承担。市场均衡产量 20 件，社会最优 16 件。无谓损失约为？\n<p>A. 16 元  B. 8 元  C. 4 元  D. 0 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：过量生产的 4 件，每件平均的外部成本约 4 元的一部分，三角形面积 = ½×4×4 = 8 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）下列哪一项是正外部性的典型例子？\n<p>A. 工厂排放污水  B. 深夜装修扰民  C. 接种疫苗降低周围人感染风险  D. 高峰期地铁拥挤 <strong>答案<\/strong>：C；<strong>解析<\/strong>：接种者承担成本，周围人得到好处且未付费，属于正外部性。其余三项都是负外部性或拥挤成本。<\/p>\n<\/ol>\n<ol><li>\n（单选）矫正税与可交易许可证最核心的差别是？\n<p>A. 矫正税能减少污染，许可证不能  B. 矫正税定价格但总量不定，许可证定总量但价格不定  C. 许可证只适用于国有企业  D. 矫正税只对消费者征收 <strong>答案<\/strong>：B；<strong>解析<\/strong>：税按每单位征，企业自主决定减排多少，总量不确定；许可证先定总量，价格由市场竞价形成。两者都能以最低成本实现减排。<\/p>\n<\/ol>\n<ol><li>\n（多选）科斯定理成立需要哪些条件？\n<p>A. 产权界定清楚  B. 交易成本足够低  C. 当事人数量很少且能谈判  D. 政府先征收矫正税 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：产权清楚、交易成本低、当事人能有效谈判是三个前提。政府征税是科斯定理失效时的替代手段，不是它的前提。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负外部性：社会成本高于私人成本，市场过量生产；正外部性：社会价值高于私人价值，市场生产不足。\n<\/li><li>\n矫正税把外部成本内化；许可证定量不定价，税定价不定量。\n<\/li><li>\n科斯定理的前提：产权清楚、交易成本低、当事人能谈成。\n<\/ul>\n<h2>概念扩展<\/h2>\n<p>这一章的&quot;外部性&quot;是全书出现频率最高的概念之一。第 11 章的公共物品与公共资源、第 12 章的税制、第 33 章之后的环境政策讨论，都在它的延长线上。下一章换个角度：有些物品因为&quot;无法排他&quot;，根本无法靠市场收费。<\/p>", "ch11": "<h1>第 11 章：公共物品和公共资源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 7、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「排他性」和「竞争性」两个维度，把物品分成四类，并各举一例。\n<\/li><li>\n解释公共物品为什么会导致搭便车、市场供给不足。\n<\/li><li>\n说明公地悲剧的机制，以及产权、管制、配额三种解法各自的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有些东西没法收费（无排他性），有些东西一人用就少一份（有竞争性）。这两条属性的组合，决定了市场能不能供给、以及会不会被用光。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>两个维度，四类物品<\/h3>\n<p><strong>排他性<\/strong>（excludability）：能不能阻止别人使用。能，比如一杯奶茶，不付钱就不给。 <strong>竞争性<\/strong>（rivalry）：一个人用了，是否减少别人可用的量。是，一杯奶茶被喝掉，别人就喝不到。<\/p>\n<p>两个维度交叉出四类：<\/p>\n<table><thead><tr><th><\/th><th>有竞争性<\/th><th>无竞争性<\/th><\/tr><\/thead><tbody><tr><td><strong>有排他性<\/strong><\/td><td>私人物品（奶茶、衣服、汽车）<\/td><td>俱乐部物品（收费站公路、有线电视、会员制球场）<\/td><\/tr><tr><td><strong>无排他性<\/strong><\/td><td>公共资源（公海鱼群、拥堵道路、公共牧场）<\/td><td>公共物品（国防、路灯、基础研究、天气预报）<\/td><\/tr><\/tbody><\/table>\n<p>这张表是本章的骨架。判断一个东西属于哪类，就问两个问题：能不能拦住不付钱的人？多用一份会不会让别人少一份？<\/p>\n<h3>公共物品：搭便车<\/h3>\n<p><strong>公共物品<\/strong>（public good）既无排他性也无竞争性。国防是典型：不管你有没有交税，都受保护；一个人享受到的保护不会减少别人的保护。<\/p>\n<p>这类物品市场供不好，原因是<strong>搭便车<\/strong>（free rider）：既然不付钱也能用，每个人都会等别人付。结果是谁都不付，总量供给不足甚至为零。<\/p>\n<p>这不是道德问题，是激励结构问题。同一个人，买奶茶会付钱（不付喝不到），修路灯就不愿意付（不付也能照亮）。换成谁都会这么选。<\/p>\n<p><strong>成本—收益分析<\/strong>是政府决定要不要提供公共物品的方法：估算总收益是否大于总成本。难点在于<strong>收益难以量化<\/strong>——一条生命值多少钱、一片风景值多少钱，没有市场价格可参照。书里提到，这类估算常常偏低，因为人们不习惯给非交易的东西定价。<\/p>\n<h3>公共资源：公地悲剧<\/h3>\n<p><strong>公共资源<\/strong>（common resource）无排他性但有竞争性。谁都能用，但用多了就没了。<\/p>\n<p><strong>公地悲剧<\/strong>（tragedy of the commons）的机制：牧场是公共的，每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担。对每个个体来说，多养总是划算的——于是所有人一起把草场吃光。个体理性导致集体灾难。<\/p>\n<p>三个解法：<\/p>\n<ol><li>\n<strong>产权私有化<\/strong>。把草场分给个人，退化成本落到自己头上，行为立刻改变。这是科斯思路的延伸。\n<\/li><li>\n<strong>管制<\/strong>。规定放牧数量上限、禁渔期、捕捞配额。\n<\/li><li>\n<strong>配额可交易<\/strong>。给每人一个配额，允许买卖，让配额流向效率最高的使用者。\n<\/ol>\n<p>现实案例：公海渔业（多个国家的渔船抢捕，鱼类资源崩溃）、城市道路（谁都免费上路，结果堵死，拥堵收费是解法）、国家公园（免费或低价，游客过多导致环境退化）。<\/p>\n<h3>为什么这几个概念值得反复用<\/h3>\n<p>第 10 章讲外部性，说&quot;价格漏算了一笔账&quot;；这一章说&quot;有些东西根本收不了费&quot;。两者合起来，就是市场失灵的完整图景：<\/p>\n<ul><li>\n能收费但有外部性 → 矫正税、许可证。\n<\/li><li>\n收不了费 → 政府供给、产权界定、配额管理。\n<\/ul>\n<p>看到任何一个&quot;市场没解决好的问题&quot;，先判断它属于哪一格，再判断该用哪种工具。这是本书教的思维习惯。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;公共物品等于政府提供的物品&quot;——实际上判断标准是属性，不是提供者。政府也可以提供私人物品（比如公立医院的服务），私人也可以提供公共物品（比如开源软件）。\n<\/li><li>\n别以为&quot;搭便车的人道德差&quot;——实际上这是激励结构决定的，同一个人在不同物品上表现完全不同。要改行为，得改结构。\n<\/li><li>\n别以为&quot;公共资源免费所以是福利&quot;——实际上免费导致过度使用，最终所有人都受损。免费往往是最贵的。\n<\/li><li>\n别以为&quot;公地悲剧只能靠政府&quot;——实际上产权私有化和社区自治（如渔业社区的自我配额）都有效，关键是让成本落到使用者头上。\n<\/ul>\n<ol><li>\n（单选）「拥堵的城市道路」属于哪一类物品？\n<p>A. 私人物品  B. 俱乐部物品  C. 公共资源  D. 公共物品 <strong>答案<\/strong>：C；<strong>解析<\/strong>：任何人都能上路（无排他性），但一个人上路会挤占他人的道路空间（有竞争性），符合公共资源。<\/p>\n<\/ol>\n<ol><li>\n（单选）公共物品市场供给不足的根本原因是？\n<p>A. 生产成本太高  B. 无排他性导致搭便车，没人愿意付费  C. 政府不允许私人提供  D. 消费者需求量太小 <strong>答案<\/strong>：B；<strong>解析<\/strong>：公共物品不付钱也能用，每个人都指望别人付费，于是自愿支付不足，市场供给低于社会需要的水平。<\/p>\n<\/ol>\n<ol><li>\n（填空）「每位牧民多养一头牛的收益归自己，草场退化的成本由所有人分担」导致草场被吃光，这种现象叫什么悲剧？\n<p><strong>答案<\/strong>：公地悲剧；<strong>解析<\/strong>：公地悲剧指公共资源因无排他性而被过度使用：个体理性地多取用，集体承担退化成本，最终资源枯竭。<\/p>\n<\/ol>\n<ol><li>\n（多选）解决公地悲剧的可行办法包括？\n<p>A. 把资源产权私有化  B. 规定使用上限并管制  C. 发放可交易的配额  D. 完全免费开放并依靠使用者自觉 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：产权私有化让成本内化，管制限制总量，可交易配额让配额流向效率最高者。完全免费开放正是悲剧的成因。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类物品由排他性与竞争性交叉决定：私人物品、俱乐部物品、公共资源、公共物品。\n<\/li><li>\n公共物品的问题是无排他性导致搭便车、供给不足。\n<\/li><li>\n公共资源的问题是有竞争性导致过度使用、公地悲剧；解法是产权、管制、可交易配额。\n<\/ul>", "ch12": "<h1>第 12 章：税制的设计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 6、8、9、11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出政府主要税种及其税基，并区分比例税、累进税、累退税。\n<\/li><li>\n用边际税率与平均税率的差别，解释「为什么高边际税率会抑制工作」。\n<\/li><li>\n用受益原则与支付能力原则评价一项税改，并指出两种原则在具体问题上会给出相反结论。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>税制设计在效率与平等之间做取舍：效率要求税不扭曲行为、管理成本低，平等要求按能力负担；两个目标都要，就必然在每一处细节上做权衡。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>钱从哪来<\/h3>\n<p>政府支出需要税收。美国的联邦税收主要有四块：<\/p>\n<ul><li>\n<strong>个人所得税<\/strong>：按收入分档征，最高档税率显著高于最低档。\n<\/li><li>\n<strong>工薪税<\/strong>：为社会保障和医疗保险筹资，按工资比例征收，有上限。\n<\/li><li>\n<strong>企业所得税<\/strong>：对利润征税。\n<\/li><li>\n<strong>消费税<\/strong>：对汽油、烟酒等特定商品征税。\n<\/ul>\n<p>州与地方政府的收入主要来自<strong>销售税<\/strong>（对零售额征）和<strong>房产税<\/strong>（对房产价值征）。<\/p>\n<p>不同国家的税种结构差别很大，但评价税制的标准是通用的：效率与平等。<\/p>\n<h3>效率：三个来源的损失<\/h3>\n<p><strong>一、无谓损失。<\/strong> 第 8 章已经算过：税收改变价格，改变行为，挤掉一部分交易。税基越宽、税率越低，同样的收入造成的无谓损失越小。<\/p>\n<p><strong>二、管理负担。<\/strong> 报税、记账、请会计、应对稽查，这些成本不产生任何产出。税制越复杂，这部分越大。一个直观例子：如果每个人只需填一页表，社会省下的时间可以干别的。<\/p>\n<p><strong>三、边际税率与平均税率的差别。<\/strong><\/p>\n<ul><li>\n<strong>平均税率<\/strong> = 总税额 ÷ 总收入。\n<\/li><li>\n<strong>边际税率<\/strong> = 增加一单位收入所多缴的税。\n<\/ul>\n<p>决定&quot;要不要多干一小时&quot;的是<strong>边际税率<\/strong>，不是平均税率。假设某人收入 10 万元，缴税 2 万元，平均税率 20%。如果再多挣 1 元要缴 0.4 元税，边际税率是 40%——他多干活的动力按 40% 打折，而不是按 20%。<\/p>\n<p>这一点经常被政策讨论忽略：说&quot;富人平均只缴 20% 的税&quot;和说&quot;富人每多挣一元要缴 40%&quot;，两句话都真，指向的激励效果完全不同。<\/p>\n<h3>平等：两种原则<\/h3>\n<p><strong>受益原则<\/strong>（benefit principle）：谁受益谁付钱。汽油税修路、公园门票维护公园，都属于这一类。问题在于很多公共支出无法对应到具体受益人（国防、基础教育）。<\/p>\n<p><strong>支付能力原则<\/strong>（ability-to-pay principle）：能力强者多付。它再分成两层：<\/p>\n<ul><li>\n<strong>纵向公平<\/strong>：收入高的人多缴。\n<\/li><li>\n<strong>横向公平<\/strong>：收入相同的人缴一样多。\n<\/ul>\n<p>横向公平听起来简单，实际很难做到。两个人收入都是 10 万元，一个有孩子要养、一个没有，他们的&quot;支付能力&quot;不同吗？如果按家庭调整扣除项，横向公平就变成&quot;相同生活水平的人缴一样多&quot;，定义立刻变复杂。<\/p>\n<h3>三种税制结构<\/h3>\n<ul><li>\n<strong>比例税<\/strong>：所有人按同一税率缴，税额随收入同比例增加。\n<\/li><li>\n<strong>累进税<\/strong>：收入越高，税率越高。个人所得税通常是累进的。\n<\/li><li>\n<strong>累退税<\/strong>：收入越高，实际负担的税率越低。销售税常被认为是累退的——低收入者把收入的大部分用于消费，缴的销售税占收入比重更高。\n<\/ul>\n<p>判断一种税是累进还是累退，不能看名义税率，要看<strong>税额占收入的比重<\/strong>怎么随收入变化。这是本章最容易出错的地方。<\/p>\n<h3>归宿：谁真正付钱<\/h3>\n<p>第 6 章的结论在这里再次出现：法律规定的纳税人不是真正的承担者。企业所得税名义上由企业缴，但企业可以把税通过提高价格转给消费者、通过压低工资转给员工、或通过降低回报转给股东。<strong>转嫁多少取决于各方的弹性<\/strong>。<\/p>\n<p>所以评价一项税的公平性，不能只看法律条文，要看归宿。这也是&quot;对富人征税&quot;常常落空的原因（第 6 章的奢侈品税案例）。<\/p>\n<h3>一个具体争论：单一税与累进税<\/h3>\n<p>支持单一税（所有人同一税率）的人强调效率：税制简单、边际税率低、对工作与投资的抑制小。支持累进税的人强调平等：高收入者从社会获得更多（产权保护、基础设施、教育体系），理应多付。<\/p>\n<p>这场争论没有纯经济学答案，因为它最终落在&quot;社会应该有多平等&quot;这个价值判断上。经济学能做的是把两种选择的代价算清楚：累进程度越高，边际税率越高，效率损失越大；反之平等程度下降。第 20 章会接着讨论收入再分配的政治哲学。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;平均税率高就是税负重&quot;——实际上决定行为的是边际税率。一个人平均税率 25%、边际税率 50%，他多干活的动力按 50% 打折。\n<\/li><li>\n别以为&quot;销售税是比例税&quot;——实际上它对低收入者更重，因为消费占收入比重更高，属于累退。\n<\/li><li>\n别以为&quot;企业缴的税就是企业承担&quot;——实际上会转嫁给消费者、员工或股东，具体比例看弹性。\n<\/li><li>\n别以为&quot;税制越复杂越公平&quot;——实际上复杂性本身有成本，而且常被高收入者利用漏洞规避，反而不公平。\n<\/ul>\n<ol><li>\n（单选）某人年收入 10 万元，缴税 2 万元；再多挣 1 元要缴 0.4 元税。他的平均税率与边际税率分别是？\n<p>A. 20% 与 20%  B. 20% 与 40%  C. 40% 与 20%  D. 40% 与 40% <strong>答案<\/strong>：B；<strong>解析<\/strong>：平均税率 = 2 万 ÷ 10 万 = 20%；边际税率由新增收入决定，为 40%。决定是否多工作的是边际税率。<\/p>\n<\/ol>\n<ol><li>\n（单选）关于销售税的累进或累退性质，下列说法正确的是？\n<p>A. 销售税是比例税，因为税率统一  B. 销售税通常是累退的，因为低收入者消费占收入比重更高  C. 销售税通常是累进的  D. 无法判断，取决于商品种类 <strong>答案<\/strong>：B；<strong>解析<\/strong>：名义税率统一不代表负担比例统一。低收入者把更大比例的收入用于消费，缴税占收入比重更高，因此是累退的。<\/p>\n<\/ol>\n<ol><li>\n（单选）「谁从公共服务中受益更多，谁就该多缴税」属于哪种原则？\n<p>A. 支付能力原则  B. 受益原则  C. 纵向公平原则  D. 比例税原则 <strong>答案<\/strong>：B；<strong>解析<\/strong>：受益原则按受益大小分摊成本，如汽油税修路。支付能力原则按收入高低分摊，两者在国防、基础教育这类支出上会给出不同答案。<\/p>\n<\/ol>\n<ol><li>\n（多选）税收造成的效率损失来自哪些方面？\n<p>A. 改变相对价格导致交易减少的无谓损失  B. 报税与合规的管理负担  C. 高边际税率对工作与投资激励的抑制  D. 政府把税收用于转移支付 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项都是效率损失。转移支付改变的是分配，不直接构成效率损失（其行政成本才算）。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n效率三个来源：无谓损失、管理负担、边际税率对激励的扭曲。\n<\/li><li>\n平等两种原则：受益原则（谁受益谁付）、支付能力原则（能力强者多付）。\n<\/li><li>\n判断累进还是累退看税额占收入的比重，不看名义税率；归宿由弹性决定。\n<\/ul>", "ch13": "<h1>第 13 章：生产成本<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分经济利润与会计利润，并算出一个含隐性成本的经济利润。\n<\/li><li>\n给定产量与总成本数据，算出 FC、VC、ATC、AVC、MC，并判断在哪个产量上 ATC 最低。\n<\/li><li>\n解释为什么 MC 曲线一定穿过 ATC 的最低点，以及短期与长期成本曲线的差别从哪来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>成本是&quot;为了生产而放弃的一切&quot;，包括老板自己投进去的时间和钱；边际成本先降后升，平均成本被它推着走，在两者相等处达到最低。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>利润的两种算法<\/h3>\n<p><strong>总收益<\/strong> TR = 价格 × 数量。<strong>总成本<\/strong> TC = 生产所付出的一切。<strong>利润<\/strong> = TR − TC。<\/p>\n<p>难点在&quot;一切&quot;包括什么。<strong>显性成本<\/strong>是掏出去的钱：原料、工资、房租。<strong>隐性成本<\/strong>是没掏钱但确实放弃的东西：老板自己投进去的资金本可以拿去理财、自己的时间本可以去别的公司上班。<\/p>\n<ul><li>\n<strong>会计利润<\/strong> = 总收益 − 显性成本\n<\/li><li>\n<strong>经济利润<\/strong> = 总收益 − 显性成本 − 隐性成本\n<\/ul>\n<p>算一个例子。小王开奶茶店，一年收入 60 万元，原料人工房租等显性成本 40 万元，会计利润 20 万元。但他投进去的 30 万元本可以买理财拿 3% 收益（0.9 万元），他自己本可以去公司上班拿 15 万元。经济利润 = 60 − 40 − 0.9 − 15 = 4.1 万元。<\/p>\n<p>只有 4.1 万元，而不是 20 万元。经济利润才是&quot;这个选择到底值不值&quot;的答案。<strong>经济利润为零并不等于白干<\/strong>——它意味着老板的资源获得了和其他用途一样的回报，这在新古典经济学里叫&quot;正常利润&quot;。<\/p>\n<h3>生产函数与边际产量递减<\/h3>\n<p><strong>生产函数<\/strong>描述投入与产出的关系。以一家奶茶店为例，固定投入是店面与设备，可变投入是店员。<\/p>\n<p>随着店员人数增加：<\/p>\n<ul><li>\n第 1 个人：从 0 到 40 杯/小时\n<\/li><li>\n第 2 个人：从 40 到 90 杯（+50）\n<\/li><li>\n第 3 个人：从 90 到 130 杯（+40）\n<\/li><li>\n第 4 个人：从 130 到 160 杯（+30）\n<\/ul>\n<p>每多一个人的增量（<strong>边际产量<\/strong>）先升后降。下降的原因是<strong>边际产量递减<\/strong>：设备、店面是固定的，人多了就互相挡着、排队等机器。<\/p>\n<p>这个规律是成本曲线形状的根源：边际产量下降，意味着每多产一杯需要的人手越来越多，<strong>边际成本上升<\/strong>。<\/p>\n<h3>成本的各种衡量<\/h3>\n<p><strong>固定成本<\/strong> FC：不随产量变化的成本，房租、设备折旧。 <strong>可变成本<\/strong> VC：随产量变化的成本，原料、计时工资。 <strong>总成本<\/strong> TC = FC + VC。<\/p>\n<p><strong>平均总成本<\/strong> ATC = TC ÷ Q。<strong>平均固定成本<\/strong> AFC = FC ÷ Q，随产量增加持续下降。<strong>平均可变成本<\/strong> AVC = VC ÷ Q。<\/p>\n<p><strong>边际成本<\/strong> MC = 增加一单位产量所增加的总成本 = ΔTC ÷ ΔQ。<\/p>\n<p>一张具体的表（FC = 30 元）：<\/p>\n<table><thead><tr><th>Q<\/th><th>VC<\/th><th>TC<\/th><th>ATC<\/th><th>MC<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>30<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>1<\/td><td>10<\/td><td>40<\/td><td>40.0<\/td><td>10<\/td><\/tr><tr><td>2<\/td><td>18<\/td><td>48<\/td><td>24.0<\/td><td>8<\/td><\/tr><tr><td>3<\/td><td>24<\/td><td>54<\/td><td>18.0<\/td><td>6<\/td><\/tr><tr><td>4<\/td><td>32<\/td><td>62<\/td><td>15.5<\/td><td>8<\/td><\/tr><tr><td>5<\/td><td>45<\/td><td>75<\/td><td>15.0<\/td><td>13<\/td><\/tr><tr><td>6<\/td><td>60<\/td><td>90<\/td><td>15.0<\/td><td>15<\/td><\/tr><\/tbody><\/table>\n<p>读表要点：<\/p>\n<ul><li>\nQ = 3 时 MC 最低（6 元），说明此时边际产量最高。\n<\/li><li>\nQ = 5 到 6 之间 ATC 不再下降，最低点约在 15 元。\n<\/li><li>\n在 ATC 最低处，MC 等于 ATC（都是 15 元）。\n<\/ul>\n<h3>为什么 MC 一定穿过 ATC 最低点<\/h3>\n<p>用一句话推：如果新增一单位的成本低于当前平均，平均值会被拉低；如果高于当前平均，平均值会被拉高。所以平均值的下降与上升，只能发生在&quot;新增成本 = 当前平均&quot;那一点。这是纯粹的算术，和第 5 章&quot;边际与平均&quot;是同一套逻辑。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">单位成本<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 13 章示例：典型成本曲线<\/text><polyline points=\"108.3,313.6 146.7,303.3 185.0,289.8 223.3,273.9 261.7,255.8 300.0,235.8 338.3,214.1 376.7,190.7 415.0,165.9 453.3,139.6\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"396.0\" y=\"161.9\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">MC 边际成本<\/text><polyline points=\"116.0,166.9 146.7,219.1 185.0,243.0 223.3,253.2 261.7,257.9 300.0,259.7 338.3,260.1 376.7,259.4 415.0,258.1 453.3,256.3\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"196.7\" y=\"238.9\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">ATC 平均总成本<\/text><polyline points=\"116.0,234.6 146.7,262.1 185.0,273.2 223.3,276.7 261.7,277.0 300.0,275.7 338.3,273.6 376.7,270.9 415.0,267.9 453.3,264.6\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"242.7\" y=\"266.8\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">AVC 平均可变成本<\/text><text x=\"81.5\" y=\"-32.0\" font-size=\"11.5\" fill=\"#6b7280\">MC 穿过 ATC 与 AVC 的最低点；ATC 在最低点附近达规模最优<\/text><\/svg>\n<p>看图说明：这是示意图，形状按典型成本曲线画，具体数值以正文表格为准。注意三件事：MC 先降后升呈 U 形；ATC 与 AVC 都是 U 形；MC 从下方穿过 ATC 与 AVC 的最低点。<\/p>\n<h3>短期与长期<\/h3>\n<p><strong>短期<\/strong>指至少有一种投入无法改变（比如店面）。<strong>长期<\/strong>指所有投入都能改变。<\/p>\n<p>长期平均总成本曲线（LRATC）是无数条短期 ATC 曲线的包络线。它更平缓，因为企业可以选择最合适的规模。<\/p>\n<p>三种规模效应：<\/p>\n<ul><li>\n<strong>规模经济<\/strong>：规模扩大，LRATC 下降。原因：分工更细、设备更专用、采购更便宜。\n<\/li><li>\n<strong>规模不经济<\/strong>：规模过大，LRATC 上升。原因：管理层级变多、协调成本上升。\n<\/li><li>\n<strong>规模报酬不变<\/strong>：LRATC 基本水平。\n<\/ul>\n<p>第 15 章讲自然垄断时会用到：如果规模经济一直持续到覆盖整个市场，那一家企业供货比多家更便宜，这就构成了自然垄断的经济基础。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;会计利润为正就是赚钱&quot;——实际上要扣掉隐性成本才算真实回报。很多小店&quot;看着赚钱&quot;，其实是老板在给自己打白工。\n<\/li><li>\n别以为&quot;固定成本会随产量摊薄，所以产量越大越赚&quot;——实际上边际成本会上升，超过一定产量后多生产的每一单位都在亏。\n<\/li><li>\n别以为&quot;ATC 最低点就是最赚钱的产量&quot;——实际上利润最大化看的是价格与 MC 的比较，不是 ATC（第 14 章会讲清）。\n<\/li><li>\n别以为&quot;沉没成本应该算进决策&quot;——实际上已经花掉收不回来的钱不影响&quot;要不要继续&quot;这个判断，只影响事后记账。\n<\/ul>\n<ol><li>\n（单选）某店主年收入 60 万元，显性成本 45 万元，他投入的 20 万元资金本可获 5% 收益，自己本可年薪 10 万元。他的经济利润是多少？\n<p>A. 15 万元  B. 4 万元  C. 5 万元  D. 0 万元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：经济利润 = 60 − 45 − 1 − 10 = 4 万元。会计利润 15 万元，差额来自隐性成本 11 万元。<\/p>\n<\/ol>\n<ol><li>\n（单选）固定成本 30 元，产量为 5 时总成本 75 元。平均总成本是多少？\n<p>A. 6 元  B. 15 元  C. 9 元  D. 45 元 <strong>答案<\/strong>：B；<strong>解析<\/strong>：ATC = TC ÷ Q = 75 ÷ 5 = 15 元。此时可变成本为 45 元，平均可变成本 9 元，平均固定成本 6 元。<\/p>\n<\/ol>\n<ol><li>\n（单选）为什么边际成本曲线一定穿过平均总成本曲线的最低点？\n<p>A. 因为两者都由固定成本决定  B. 因为新增一单位的成本低于平均会拉低平均，高于平均会拉高平均  C. 因为边际成本总是递减的  D. 因为平均成本总是等于边际成本 <strong>答案<\/strong>：B；<strong>解析<\/strong>：这是纯粹的算术关系：平均值的变化方向由新增值与当前平均值的比较决定，两者相等处就是最低点。<\/p>\n<\/ol>\n<ol><li>\n（填空）产量增加时每多雇一名工人带来的产出增量越来越少，这个规律叫什么？（八个字以内）\n<p><strong>答案<\/strong>：边际产量递减；<strong>解析<\/strong>：固定投入不变、可变投入增加时，新增投入带来的产出增量最终会下降，这直接导致边际成本上升。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n经济利润 = 总收益 − 显性成本 − 隐性成本；零经济利润意味着资源获得正常回报。\n<\/li><li>\nMC 是 U 形，穿过 ATC 与 AVC 的最低点，因为边际拉动平均。\n<\/li><li>\n短期至少一种投入固定，长期全部可变；规模经济让 LRATC 下降，规模不经济让它上升。\n<\/ul>", "ch14": "<h1>第 14 章：竞争市场上的企业<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明为什么在完全竞争市场里 MR = P，并据此写出利润最大化的条件。\n<\/li><li>\n用 P 与 AVC、ATC 的比较，判断企业该继续生产还是暂时停业、该进入还是退出。\n<\/li><li>\n解释长期均衡为什么是「价格 = 最低平均总成本、经济利润为零」。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>竞争企业的产量停在「多生产一单位的成本 = 这一单位卖出的价格」那一点；低于这个价格它就少卖，高于这个价格它就多卖，而进出自由会把长期利润压到零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>竞争市场的三个特征<\/h3>\n<p>完全竞争市场满足：卖者众多、产品完全相同、企业能自由进入退出。前两条导致一个关键结果——<strong>单个企业无法影响价格<\/strong>。它只能按市场价卖，多要一分钱就一件也卖不出去。<\/p>\n<p>这样的企业叫<strong>价格接受者<\/strong>（price taker）。它的需求曲线是水平的：市场价 15 元，它面对的需求就是&quot;15 元，想要多少有多少&quot;。<\/p>\n<h3>收益的三个概念<\/h3>\n<ul><li>\n<strong>总收益<\/strong> TR = P × Q\n<\/li><li>\n<strong>平均收益<\/strong> AR = TR ÷ Q = P（因为价格不变）\n<\/li><li>\n<strong>边际收益<\/strong> MR = 多卖一单位增加的收益 = P（同样因为价格不变）\n<\/ul>\n<p>所以在完全竞争里 <strong>P = AR = MR<\/strong>，三条线重合为一条水平线。这一点在垄断那章会彻底改变，那是本章与第 15 章最本质的区别。<\/p>\n<h3>利润最大化的条件<\/h3>\n<p>利润 = TR − TC。多生产一单位，收益增加 MR，成本增加 MC。<\/p>\n<ul><li>\n若 MR &gt; MC：这一单位赚，应该多做。\n<\/li><li>\n若 MR &lt; MC：这一单位亏，应该少做。\n<\/li><li>\n只有 <strong>MR = MC<\/strong> 时利润最大。\n<\/ul>\n<p>在竞争市场里就是 <strong>P = MC<\/strong>。<\/p>\n<p>用第 13 章的成本表验证（FC = 30 元）：<\/p>\n<table><thead><tr><th>P<\/th><th>按 P=MC 选的产量<\/th><th>TR<\/th><th>TC<\/th><th>利润<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>大于 6 杯（MC 继续上升，在 6 杯之后达到 20）<\/td><td>更多<\/td><td>更多<\/td><td>正<\/td><\/tr><tr><td>15<\/td><td>6 杯（MC = 15）<\/td><td>90<\/td><td>90<\/td><td>0<\/td><\/tr><tr><td>13<\/td><td>5 杯（MC 从 8 升到 13）<\/td><td>65<\/td><td>75<\/td><td>−10<\/td><\/tr><tr><td>8<\/td><td>0 杯（低于平均可变成本最低点）<\/td><td>0<\/td><td>30<\/td><td>−30<\/td><\/tr><\/tbody><\/table>\n<p>价格 13 元时虽然亏 10 元，但比停业亏 30 元（固定成本照付）要好，所以继续生产。价格跌到 8 元、低于平均可变成本 9 元时，多生产一杯连原料人工都收不回，还不如停业——<strong>停业点<\/strong>是 P &lt; AVC 最低点。<\/p>\n<h3>沉没成本与停业决策<\/h3>\n<p><strong>沉没成本<\/strong>（sunk cost）是已经花掉、收不回来的成本。它不影响&quot;现在该不该继续&quot;的判断，因为无论继续还是停止，这笔钱都已经没了。<\/p>\n<p>书上举的例子是&quot;覆水难收&quot;：买下的专用设备、装修费、广告费，都属于沉没成本。决策时该问的是&quot;继续经营的额外收益是否大于额外成本&quot;，而不是&quot;我已经投了这么多，不能就这么放弃&quot;。<\/p>\n<p>后半句是典型的<strong>沉没成本谬误<\/strong>：因为已经投入而继续投入，结果亏更多。<\/p>\n<h3>长期：进入与退出<\/h3>\n<p>短期里企业数量固定，只能决定生产多少。长期里企业可以进入或退出：<\/p>\n<ul><li>\n若 P &gt; ATC，现有企业赚钱，新企业进入，供给增加，价格下降。\n<\/li><li>\n若 P &lt; ATC，企业亏损，一部分退出，供给减少，价格上升。\n<\/li><li>\n均衡时 <strong>P = ATC 最低点<\/strong>，经济利润为零。\n<\/ul>\n<p><strong>零利润不是企业倒闭<\/strong>。它意味着企业获得的回报与其他用途一样多，也就是&quot;正常利润&quot;。这正是第 13 章说的经济利润为零的含义。<\/p>\n<h3>长期供给曲线<\/h3>\n<p>短期供给曲线是各企业 MC 曲线的水平加总（只取 AVC 以上的部分）。长期供给曲线更复杂：<\/p>\n<ul><li>\n若进入退出不影响成本，长期供给曲线是<strong>水平<\/strong>的（在 P = 最低 ATC 处）。\n<\/li><li>\n若新企业进入推高了投入品价格（比如好地段铺位有限），长期供给曲线<strong>向上倾斜<\/strong>。\n<\/ul>\n<p>这个差别在分析长期需求变化时很关键：需求增加，短期价格涨得多，长期价格回到接近原水平（水平情形）或略高（向上倾斜情形）。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">产量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格与成本<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 14 章示例：P=MR 水平线与 MC 相交<\/text><polygon points=\"70.0,174.7 300.0,174.7 300.0,120.9 70.0,120.9\" fill=\"#ea580c\" fill-opacity=\"0.22\" stroke=\"none\"/><text x=\"185.0\" y=\"147.8\" font-size=\"11.5\" fill=\"#111827\" text-anchor=\"middle\">经济利润为正<\/text><polyline points=\"108.3,292.5 146.7,279.9 185.0,262.7 223.3,241.7 261.7,217.2 300.0,189.7 338.3,159.2 376.7,125.9 415.0,90.1 453.3,51.8\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"365.3\" y=\"86.1\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">MC<\/text><polyline points=\"116.0,102.1 146.7,168.5 185.0,199.8 223.3,213.9 261.7,221.2 300.0,225.0 338.3,226.8 376.7,227.4 415.0,227.1 453.3,226.3\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"196.7\" y=\"197.5\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">ATC<\/text><polyline points=\"70.0,174.7 530.0,174.7\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"434.3\" y=\"164.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">P=MR=16<\/text><line x1=\"300.0\" y1=\"174.7\" x2=\"300.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"307.0\" y=\"167.7\" font-size=\"11.5\" fill=\"#111827\">Q*=6 时 MR=MC<\/text><\/svg>\n<p>看图说明：水平绿线是 P = MR，红线的 MC 与它相交处就是最优产量。ATC 在交点下方时企业赚钱（橙色区域）。若价格线掉到 AVC 以下，交点消失，企业停业。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;企业应该定在 ATC 最低点生产&quot;——实际上利润最大化看 P 与 MC 的关系；ATC 最低点只在长期均衡时才与价格重合。\n<\/li><li>\n别以为&quot;亏损就应该马上停业&quot;——实际上只要价格高于平均可变成本，继续生产的亏损小于停业的亏损。\n<\/li><li>\n别以为&quot;零利润意味着行业没有吸引力&quot;——实际上零利润是&quot;正常回报&quot;，行业仍然在运转，只是没有超额利润吸引新进入者。\n<\/li><li>\n别以为&quot;沉没成本应该算进决策&quot;——实际上它已经无法收回，只影响账面，不影响&quot;继续还是停止&quot;。\n<\/ul>\n<ol><li>\n（单选）完全竞争企业的利润最大化条件是？\n<p>A. P = ATC  B. P = MC  C. P = AVC  D. MR = ATC <strong>答案<\/strong>：B；<strong>解析<\/strong>：竞争企业 MR = P，所以 MR = MC 就是 P = MC。ATC 最低点只在长期均衡时与价格重合。<\/p>\n<\/ol>\n<ol><li>\n（单选）某企业价格 13 元，产量 5 件，总成本 75 元，平均可变成本 9 元，固定成本 30 元。它应该？\n<p>A. 立即停业，因为亏损  B. 继续生产，因为停业会亏得更多  C. 提高价格  D. 扩大产量到 ATC 最低点 <strong>答案<\/strong>：B；<strong>解析<\/strong>：继续生产亏 10 元；停业则固定成本照付，亏 30 元。价格高于平均可变成本时应继续经营，尽管账面上在亏。<\/p>\n<\/ol>\n<ol><li>\n（单选）长期中竞争行业的均衡状态是？\n<p>A. 价格高于最低 ATC，企业获得超额利润  B. 价格等于最低 ATC，经济利润为零  C. 价格等于 AVC 最低点  D. 企业数量固定不变 <strong>答案<\/strong>：B；<strong>解析<\/strong>：正利润吸引进入、亏损促使退出，直到价格等于最低平均总成本，经济利润为零，进出停止。<\/p>\n<\/ol>\n<ol><li>\n（填空）已经花掉、无法收回的成本叫什么成本？\n<p><strong>答案<\/strong>：沉没成本；<strong>解析<\/strong>：沉没成本不影响「继续还是停止」的判断，因为两种选择下它都已发生。因已投入而继续投入是沉没成本谬误。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n竞争企业 P = AR = MR，利润最大化条件 P = MC。\n<\/li><li>\n停业判据是 P &lt; AVC 最低点；退出判据是 P &lt; ATC。\n<\/li><li>\n长期均衡 P = 最低 ATC，经济利润为零，进入退出停止。\n<\/ul>", "ch15": "<h1>第 15 章：垄断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 13、14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出垄断的三种来源，并判断一个行业属于哪一种。\n<\/li><li>\n解释为什么垄断者的 MR 低于价格，并据此算出它的产量与定价。\n<\/li><li>\n画出垄断的无谓损失，说明垄断利润本身是不是社会成本。\n<\/li><li>\n判断价格歧视在什么条件下可行、对福利有什么影响。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>垄断者不能&quot;想卖多少就卖多少&quot;——它要卖更多就必须降价，所以多卖一单位的真实收益低于价格。它于是把产量压到 MR = MC，再按需求曲线抬价，结果比竞争市场少卖、多收，社会损失一块。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>垄断从哪来<\/h3>\n<p><strong>垄断<\/strong>（monopoly）是一家企业独占某个市场。三种来源：<\/p>\n<ol><li>\n<strong>资源垄断<\/strong>：掌握了关键资源。某地唯一的矿泉水水源、某公司独家拥有的矿藏。\n<\/li><li>\n<strong>政府创造<\/strong>：专利、特许经营、牌照。专利是为了鼓励创新（给药企 20 年独占期），特许经营常见于水电、邮政。\n<\/li><li>\n<strong>自然垄断<\/strong>（natural monopoly）：一家供货比多家更便宜。原因是规模经济一直持续到覆盖整个市场——电网、自来水、地铁都属于这类，铺设两套管道是巨大浪费。\n<\/ol>\n<p>判断方法：问&quot;这个行业的进入壁垒是什么&quot;。壁垒是资源、法律，还是成本结构？<\/p>\n<h3>垄断者的收益：为什么 MR 低于价格<\/h3>\n<p>竞争企业的价格不随销量变化，MR = P。垄断者不同：它的需求曲线就是市场需求曲线，向右下方倾斜——多卖必须降价。<\/p>\n<p>关键在于：降价不只作用于&quot;多卖的那一单位&quot;，而是作用于<strong>所有单位<\/strong>。<\/p>\n<p>设需求 P = 30 − 0.5Q。<\/p>\n<ul><li>\nQ = 10 时，P = 25，TR = 250。\n<\/li><li>\nQ = 11 时，P = 24.5，TR = 269.5。\n<\/ul>\n<p>多卖一单位的 MR = 269.5 − 250 = 19.5 元，而价格是 24.5 元。<strong>MR 比价格低 5 元<\/strong>，因为第 11 单位是在&quot;全部 11 单位都降价 0.5 元&quot;的基础上卖出的。<\/p>\n<p>数学上，MR 曲线的斜率是需求曲线的两倍：P = 30 − 0.5Q 对应 MR = 30 − Q。<\/p>\n<h3>利润最大化与定价<\/h3>\n<p>垄断者也按 <strong>MR = MC<\/strong> 定产量，但定价方式不同：它先把产量定在 MR = MC 处，再<strong>沿需求曲线<\/strong>读出这个产量对应的价格。<\/p>\n<p>继续上面的数字：MC = 10 + Q。<\/p>\n<ul><li>\nMR = MC：30 − Q = 10 + Q → Q = 10\n<\/li><li>\n沿需求曲线：P = 30 − 0.5 × 10 = 25\n<\/ul>\n<p>垄断者在 25 元卖 10 单位。若按竞争方式（P = MC）：30 − 0.5Q = 10 + Q → Q ≈ 13.3，P ≈ 16.7。<\/p>\n<p>对比：<strong>垄断产量 10、价格 25；竞争产量 13.3、价格 16.7<\/strong>。垄断者少卖 3.3 单位，价格高出 8.3 元。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">数量 Q<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">价格 P<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 15 章示例：垄断者按 MR=MC 定产量，再按需求曲线定价<\/text><polygon points=\"185.0,112.1 185.0,157.6 222.9,187.7\" fill=\"#ea580c\" fill-opacity=\"0.45\" stroke=\"none\"/><polyline points=\"70.0,66.5 185.0,112.1 300.0,157.6 415.0,203.2 530.0,248.8\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"85.5\" y=\"80.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">需求 D<\/text><polyline points=\"70.0,66.5 242.5,203.2 415.0,340.0\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2.2\"/><text x=\"292.5\" y=\"244.8\" font-size=\"12\" fill=\"#dc2626\" font-weight=\"600\">边际收益 MR<\/text><polyline points=\"70.0,248.8 185.0,157.6 300.0,66.5\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"308.6\" y=\"62.5\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">边际成本 MC<\/text><line x1=\"185.0\" y1=\"157.6\" x2=\"185.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"185.0\" y1=\"112.1\" x2=\"70.0\" y2=\"112.1\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><circle cx=\"185.0\" cy=\"157.6\" r=\"4\" fill=\"#111827\"/><text x=\"194.2\" y=\"99.3\" font-size=\"11.5\" fill=\"#111827\">垄断价 25 元<\/text><text x=\"196.5\" y=\"170.4\" font-size=\"11.5\" fill=\"#111827\">MR=MC 处产量 10<\/text><text x=\"237.9\" y=\"199.6\" font-size=\"11.5\" fill=\"#111827\">无谓损失<\/text><text x=\"81.5\" y=\"39.1\" font-size=\"11.5\" fill=\"#6b7280\">竞争结果：产量 13.3、价格 16.7；垄断把产量压低 3.3 单位<\/text><\/svg>\n<p>看图说明：D 与 MR 的垂直距离随产量扩大而增大，因为降价影响全部单位。MR 与 MC 的交点决定产量 10，向上投到 D 得到价格 25。橙色三角形是垄断造成的无谓损失。<\/p>\n<h3>福利代价<\/h3>\n<p>无谓损失来自那 3.3 单位没被生产的交易——它们的成本低于买者的支付意愿，本应发生。面积约 ½ × 3.3 × 5 ≈ 8.3 元（按图形近似）。<\/p>\n<p><strong>垄断利润是不是社会成本？<\/strong> 分两层看：<\/p>\n<ul><li>\n利润本身是从消费者转到企业手里的钱，属于<strong>转移<\/strong>，不是净损失。\n<\/li><li>\n但为了维持垄断地位，企业会花资源游说、打专利诉讼、建壁垒。这部分叫<strong>寻租<\/strong>，是真实的资源消耗。\n<\/li><li>\n此外，垄断者缺乏降成本的动力（X 非效率），这部分损失难以量化但确实存在。\n<\/ul>\n<h3>价格歧视<\/h3>\n<p><strong>价格歧视<\/strong>（price discrimination）是对不同买者收不同价格，而成本相同。<\/p>\n<p>三种类型：<\/p>\n<ul><li>\n<strong>一级<\/strong>：对每个人都收他愿意付的最高价（完全按支付意愿定价）。\n<\/li><li>\n<strong>二级<\/strong>：按购买量分段定价（第二杯半价、批量折扣）。\n<\/li><li>\n<strong>三级<\/strong>：按人群分组定价（学生票、老年优惠）。\n<\/ul>\n<p><strong>可行条件<\/strong>：能区分买者群体，且无法转售套利。飞机票能做价格歧视（学生票、提前购票折扣），因为票不能转让；一瓶矿泉水很难，因为可以转手。<\/p>\n<p><strong>福利效果<\/strong>：<\/p>\n<ul><li>\n若价格歧视让更多人以自己能接受的价格买到（扩大产量），总福利可能上升。\n<\/li><li>\n若只是把同样的销量按不同价格卖出（产量不变），主要是分配变化，福利不变。\n<\/li><li>\n完全的价格歧视（一级）能消除无谓损失，但把全部剩余转给卖者——效率改善、分配恶化。\n<\/ul>\n<h3>政策选项<\/h3>\n<ol><li>\n<strong>反托拉斯法<\/strong>：禁止垄断行为、拆分企业、阻止合并。难点是&quot;多大算垄断&quot;、&quot;降价竞争算不算掠夺&quot;。\n<\/li><li>\n<strong>管制<\/strong>：对自然垄断规定价格（通常按成本加成定价）。难点是管制机构需要知道企业成本，而企业有虚报成本的动机。\n<\/li><li>\n<strong>公有制<\/strong>：政府直接经营。难点是效率与激励问题。\n<\/li><li>\n<strong>不作为<\/strong>：接受垄断，靠竞争者的潜在进入压力约束。适用于壁垒不高、技术变化快的行业。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断者会把价格定到最高&quot;——实际上它要考虑销量，定价过高销量掉得快，利润反而减少。最优点在 MR = MC，不是价格最高点。\n<\/li><li>\n别以为&quot;垄断利润就是社会损失&quot;——实际上利润是转移，真正的净损失是没发生的那部分交易，加上寻租成本。\n<\/li><li>\n别以为&quot;垄断一定不好&quot;——实际上专利带来的短期垄断是创新的必要激励；自然垄断由一家供货确实更省资源。判断要看成本与收益的对比。\n<\/li><li>\n别以为&quot;价格歧视必然伤害消费者&quot;——实际上它常让原本买不起的人也买到了，问题在于剩余怎么分。\n<\/ul>\n<ol><li>\n（单选）自然垄断形成的根本原因是？\n<p>A. 政府发放了独家牌照  B. 规模经济一直持续到覆盖整个市场，一家供货成本最低  C. 企业掌握了全部原材料  D. 产品拥有专利 <strong>答案<\/strong>：B；<strong>解析<\/strong>：自来水、电网这类行业固定成本极高、边际成本低，产量越大平均成本越低，一家供货比分多家更省资源，这就是自然垄断。<\/p>\n<\/ol>\n<ol><li>\n（单选）需求为 P = 30 − 0.5Q，则边际收益 MR 等于？\n<p>A. 30 − Q  B. 30 − 0.5Q  C. 15 − Q  D. 30 − 2Q <strong>答案<\/strong>：A；<strong>解析<\/strong>：线性需求下 MR 的斜率是需求曲线的两倍：TR = 30Q − 0.5Q²，求导得 MR = 30 − Q。<\/p>\n<\/ol>\n<ol><li>\n（单选）需求 P = 30 − 0.5Q，MC = 10 + Q。垄断者的产量与价格分别是？\n<p>A. Q=10，P=25  B. Q=13.3，P=16.7  C. Q=10，P=20  D. Q=6.7，P=26.7 <strong>答案<\/strong>：A；<strong>解析<\/strong>：MR = MC：30 − Q = 10 + Q，得 Q = 10；沿需求曲线得 P = 30 − 5 = 25。竞争结果才是 13.3 与 16.7。<\/p>\n<\/ol>\n<ol><li>\n（多选）价格歧视可行的条件包括？\n<p>A. 能按支付意愿或人群特征区分买者  B. 商品或服务无法转售套利  C. 企业拥有市场势力  D. 政府强制统一定价 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：要能区分买者、防止套利、并且有定价能力。政府统一定价恰恰会消除价格歧视的空间。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n垄断三来源：资源、政府创造、自然垄断（规模经济）。\n<\/li><li>\n垄断者 MR 低于价格，MR 曲线斜率是需求曲线的两倍；按 MR = MC 定产量，再沿需求曲线定价。\n<\/li><li>\n无谓损失来自被压低的产量；垄断利润本身是转移，寻租才是额外成本。\n<\/ul>", "ch16": "<h1>第 16 章：垄断竞争<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13、14、15 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出垄断竞争与完全竞争、垄断的相同点和不同点。\n<\/li><li>\n画出垄断竞争企业的短期与长期均衡，解释长期均衡为什么是&quot;相切、零利润、产量低于效率规模&quot;。\n<\/li><li>\n分别站在「广告提供信息」和「广告操纵偏好」两种立场评价广告的作用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>产品有差别，每家企业都有一点点定价权，所以短期能像小垄断者一样赚钱；但进入自由，新品牌会把你的顾客分走，长期利润被压到零——只是价格仍高于边际成本，产量仍小于最有效率的规模。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>三个特征<\/h3>\n<p><strong>垄断竞争<\/strong>（monopolistic competition）的市场有三个特征：<\/p>\n<ol><li>\n<strong>许多卖者<\/strong>：数量多到每家的行为不影响整体。\n<\/li><li>\n<strong>产品有差别<\/strong>：口味、位置、包装、服务、品牌形象不同。差别是真实的，也可以是感知上的。\n<\/li><li>\n<strong>自由进入退出<\/strong>：新品牌随时可以开张。\n<\/ol>\n<p>奶茶街是最贴切的例子：几十家店，各有配方和装修，谁都能再开一家。<\/p>\n<p>与完全竞争的关键差别是第 2 条。产品有差别，意味着企业涨价不会立刻丢掉全部顾客，于是它的需求曲线<strong>向下倾斜<\/strong>——它有一点点市场势力，但不像垄断那样能完全决定价格。<\/p>\n<h3>短期：像小垄断者<\/h3>\n<p>短期里企业数量固定，每家按 <strong>MR = MC<\/strong> 定产量，再沿自己的需求曲线定价。若价格高于 ATC，就有利润。<\/p>\n<p>图形与第 15 章的垄断一样：向下倾斜的需求、更陡的 MR、U 形 ATC。区别在于需求曲线更平——因为替代品多，涨价丢客快。<\/p>\n<h3>长期：相切与零利润<\/h3>\n<p>有利润就有新品牌进入。新进入者的产品与原企业相似，会分走一部分顾客，使原企业的需求曲线<strong>左移<\/strong>。<\/p>\n<p>这个过程持续到什么时候停止？到需求曲线刚好与 ATC 曲线<strong>相切<\/strong>为止。此时价格等于平均总成本，经济利润为零。若再进入，需求曲线继续左移，价格低于 ATC，企业亏损，开始退出。<\/p>\n<p>长期均衡的三个特征：<\/p>\n<ol><li>\n<strong>相切<\/strong>：P = ATC，利润为零。\n<\/li><li>\n<strong>切点不在 ATC 最低点<\/strong>：因为需求曲线向下倾斜，切点必然在最低点的左侧。\n<\/li><li>\n<strong>产量低于效率规模<\/strong>：这就是<strong>超额能力<\/strong>（excess capacity）——每家店的规模都比&quot;成本最低&quot;的规模小一点。\n<\/ol>\n<h3>与完全竞争的比较<\/h3>\n<table><thead><tr><th>项目<\/th><th>完全竞争<\/th><th>垄断竞争<\/th><\/tr><\/thead><tbody><tr><td>长期价格<\/td><td>等于最低 ATC<\/td><td>高于最低 ATC 一点<\/td><\/tr><tr><td>长期产量<\/td><td>等于效率规模<\/td><td>低于效率规模<\/td><\/tr><tr><td>价格与 MC<\/td><td>相等<\/td><td>价格高于 MC（加价）<\/td><\/tr><tr><td>产品<\/td><td>同质<\/td><td>有差别<\/td><\/tr><\/tbody><\/table>\n<p>所以垄断竞争在效率上确实差一些：每个顾客多付了一点钱，每家店少卖了一点量。<\/p>\n<p>但这个比较忽略了一件东西：<strong>产品多样性<\/strong>。完全竞争的市场里所有产品一样，垄断竞争里你可以选到更合口味的。多样性的价值没有市场价格，很难量化，但它确实存在。判断垄断竞争好不好，要把它和&quot;所有人都喝同一种奶茶&quot;的世界比。<\/p>\n<h3>广告的两种解读<\/h3>\n<p><strong>批评的观点<\/strong>：广告制造不存在差别，操纵消费者偏好，抬高进入壁垒（新品牌要花巨资才能被记住），浪费资源。<\/p>\n<p><strong>支持的观点<\/strong>：广告提供信息（新品、价格、位置），降低搜寻成本；品牌广告是<strong>质量信号<\/strong>——愿意花大钱做广告，说明企业相信自己产品质量能留住顾客，否则广告费白花。<\/p>\n<p>两种观点都有道理，取决于行业。搜索成本高的行业（汽车、保险），广告的信息价值大；同质化行业（矿泉水），广告更多是品牌塑造。<\/p>\n<p><strong>品牌<\/strong>同理。品牌溢价常被批评为&quot;收智商税&quot;，但它也传递了一个可信信号：品牌方有声誉要维护，出问题的代价比无名厂商大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;垄断竞争就是垄断&quot;——实际上它没有进入壁垒，长期利润为零，与垄断的持续超额利润完全不同。\n<\/li><li>\n别以为&quot;长期均衡的切点在 ATC 最低点&quot;——实际上因为需求曲线向下倾斜，切点只能在最低点左侧，这就是超额能力的来源。\n<\/li><li>\n别以为&quot;垄断竞争的低效率必须纠正&quot;——实际上它换来产品多样性，纠正的代价可能是选择变少。\n<\/li><li>\n别以为&quot;广告一定是浪费&quot;——实际上它可能降低搜寻成本、传递质量信号，判断要看行业特征。\n<\/ul>\n<ol><li>\n（单选）垄断竞争企业长期均衡的核心特征是？\n<p>A. 需求曲线与 ATC 曲线在最低点相切  B. 需求曲线与 ATC 曲线相切，且切点在最低点左侧  C. 价格等于边际成本  D. 企业长期获得正的经济利润 <strong>答案<\/strong>：B；<strong>解析<\/strong>：进入使需求曲线左移到与 ATC 相切，利润为零。因需求曲线向下倾斜，切点必然在 ATC 最低点左侧，产量低于效率规模，形成超额能力。<\/p>\n<\/ol>\n<ol><li>\n（单选）垄断竞争与完全竞争最重要的差别是？\n<p>A. 企业数量更多  B. 产品存在差别，企业因此有少量定价权  C. 没有进入壁垒  D. 长期利润更高 <strong>答案<\/strong>：B；<strong>解析<\/strong>：产品差别让每个企业拥有自己的小市场，需求曲线向下倾斜，价格可以略高于边际成本；这也带来多样性和超额能力。<\/p>\n<\/ol>\n<ol><li>\n（多选）支持广告的论点包括？\n<p>A. 降低消费者的搜寻成本  B. 传递产品质量信号  C. 一定降低产品价格  D. 可能抬高进入壁垒 <strong>答案<\/strong>：A、B；<strong>解析<\/strong>：广告提供信息、传递质量信号是支持的理由；抬高进入壁垒是批评的理由，且广告不必然降低价格。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n垄断竞争三特征：许多卖者、产品有差别、自由进出。\n<\/li><li>\n长期均衡：需求曲线与 ATC 相切，零利润，产量低于效率规模（超额能力）。\n<\/li><li>\n与完全竞争的差别：价格高于 MC、产量低于效率规模，但换来产品多样性。\n<\/ul>", "ch17": "<h1>第 17 章：寡头<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 15、16 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用双头例子说明寡头为什么介于竞争与垄断之间。\n<\/li><li>\n画出囚徒困境式的支付矩阵，判断纳什均衡与合作结果分别是什么。\n<\/li><li>\n解释为什么卡特尔难以维持，以及反托拉斯法处理的是什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>寡头的每一家都要看对手怎么动：合作能一起赚更多，但每一家都有偷偷多卖（或多降价）的动机，于是合作常常维持不住——这决定了寡头的结果落在竞争与垄断之间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>少数几家<\/h3>\n<p><strong>寡头<\/strong>（oligopoly）是少数几家大企业主导的市场：智能手机、民航、加油站、操作系统。特征是<strong>相互依赖<\/strong>——每家的决策都会影响其他家的销量，所以每家都必须预测对手的反应。<\/p>\n<p>这与前面几种市场结构不同。完全竞争里对手太多不用管；垄断里没有对手；垄断竞争里对手太多且产品有差别，不太需要盯着某一家的价格。寡头必须盯着。<\/p>\n<h3>双头的三种可能结果<\/h3>\n<p>假设市场只有两家矿泉水厂，成本相同。市场总需求给定。<\/p>\n<ul><li>\n<strong>合作（卡特尔）<\/strong>：两家坐下来商定总产量按垄断方式分配，各卖一半。总产量低、价格高，总利润达到垄断水平。<strong>卡特尔<\/strong>（cartel）就是这种正式或非正式的价格与产量同盟，OPEC 是最著名的例子。\n<\/li><li>\n<strong>竞争<\/strong>：各自按利润最大化独立决策，不断增产压价，直到价格接近成本，接近完全竞争的结果。\n<\/li><li>\n<strong>实际<\/strong>：介于两者之间——比垄断产量高、比竞争产量低。\n<\/ul>\n<p>为什么落在中间？因为每一家都知道，自己多卖一点会拉低价格、伤到对方，但多卖的那部分收益归自己。于是有&quot;偷偷增产&quot;的动机，合作难以完全维持。<\/p>\n<h3>囚徒困境<\/h3>\n<p><strong>囚徒困境<\/strong>（prisoner&#x27;s dilemma）是理解寡头合作的工具。两家企业，两种选择：维持高价、降价抢客。<\/p>\n<p>支付矩阵（单位：万元利润）：<\/p>\n<table><thead><tr><th>A ＼ B<\/th><th>维持高价<\/th><th>降价<\/th><\/tr><\/thead><tbody><tr><td><strong>维持高价<\/strong><\/td><td>A 100，B 100<\/td><td>A 20，B 140<\/td><\/tr><tr><td><strong>降价<\/strong><\/td><td>A 140，B 20<\/td><td>A 40，B 40<\/td><\/tr><\/tbody><\/table>\n<p>分析：<\/p>\n<ul><li>\n若 B 维持高价，A 选降价得 140 &gt; 100，降价更好。\n<\/li><li>\n若 B 降价，A 选降价得 40 &gt; 20，还是降价更好。\n<\/ul>\n<p>所以不论 B 怎么选，A 都该降价。B 也这么想。结果<strong>双方都降价<\/strong>，各得 40，总利润 80，远低于共同维持高价的 200。<\/p>\n<p>这个结果叫<strong>纳什均衡<\/strong>（Nash equilibrium）：在给定对手策略的情况下，没有任何一方能通过单方面改变策略得到更好结果。注意它并不是&quot;最优结果&quot;——双方合作能得 200，但合作不稳定，因为任何一方都有背叛的动机。<\/p>\n<h3>卡特尔为什么难维持<\/h3>\n<ol><li>\n<strong>背叛的诱惑<\/strong>：偷偷多生产一点，短期多赚，代价由全体分担。\n<\/li><li>\n<strong>成员多则难监督<\/strong>：OPEC 有十几个成员，谁超产很难查。\n<\/li><li>\n<strong>外部竞争者<\/strong>：非成员不受约束，高价会吸引他们进场。\n<\/li><li>\n<strong>需求下降时更脆弱<\/strong>：市场萎缩时每家都想抢份额，价格战一触即发。\n<\/ol>\n<h3>反托拉斯法管什么<\/h3>\n<ul><li>\n<strong>明示合谋<\/strong>：开会商量价格、划分市场，属于本身违法。\n<\/li><li>\n<strong>默契合谋<\/strong>：不用明说，通过价格信号&quot;心照不宣&quot;，取证困难。\n<\/li><li>\n<strong>合并审查<\/strong>：防止合并后市场集中度过高。\n<\/li><li>\n<strong>掠夺性定价<\/strong>：大企业低价挤垮对手再提价。争议在于&quot;低价&quot;本身是竞争，很难和&quot;掠夺&quot;区分。\n<\/li><li>\n<strong>捆绑销售<\/strong>：把热门产品和冷门产品绑在一起卖，可能排挤对手。\n<\/ul>\n<p>这些规则的共同难点是同一个：<strong>有些行为看起来像竞争（降价、扩产），实际可能是排挤对手的手段<\/strong>。判断要靠意图证据与市场结构分析，不能只看价格高低。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;寡头会自动形成高价&quot;——实际上每家都有背叛动机，价格战随时可能发生。\n<\/li><li>\n别以为&quot;纳什均衡就是最优结果&quot;——实际上它是&quot;谁都不能单方面改善&quot;的稳定状态，可能对所有人都不如合作结果。\n<\/li><li>\n别以为&quot;卡特尔一定能赚钱&quot;——实际上成员越多、监督越难、外部竞争越强，卡特尔越容易瓦解。\n<\/li><li>\n别以为&quot;低价一定是好事&quot;——实际上若低价是为了挤垮对手再提价，长期看消费者受损；判断要看是否可持续、是否有排挤意图。\n<\/ul>\n<ol><li>\n（单选）在囚徒困境式的寡头博弈中，双方都维持高价的合作结果为什么难以实现？\n<p>A. 因为合作违法  B. 因为任何一方单方面降价都能立即获益，背叛动机始终存在  C. 因为消费者会抵制高价  D. 因为政府强制低价 <strong>答案<\/strong>：B；<strong>解析<\/strong>：给定对手维持高价，自己降价可把利润从 100 提到 140；对手也这么想，于是双方降价，落入纳什均衡。<\/p>\n<\/ol>\n<ol><li>\n（单选）纳什均衡的含义是？\n<p>A. 所有人的总收益最大  B. 没有任何一方能在对手不变时单方面改变策略而获益  C. 价格等于成本  D. 企业数量最多 <strong>答案<\/strong>：B；<strong>解析<\/strong>：纳什均衡是稳定状态的定义，不保证总收益最大。囚徒困境里均衡结果明显差于合作结果。<\/p>\n<\/ol>\n<ol><li>\n（多选）卡特尔难以长期维持的原因包括？\n<p>A. 成员有偷偷超产的动机  B. 成员多则监督成本高  C. 非成员的外部竞争  D. 市场需求上升 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：背叛动机、监督困难、外部竞争都是瓦解因素。需求上升期卡特尔反而更容易维持，因为大家都有得赚。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n寡头特征是相互依赖，结果介于竞争与垄断之间。\n<\/li><li>\n囚徒困境的结构：单方面背叛总是更划算，于是双方都选择背叛，纳什均衡低于合作结果。\n<\/li><li>\n卡特尔难维持的原因：背叛诱惑、监督困难、外部竞争、需求下降。\n<\/ul>", "ch18": "<h1>第 18 章：生产要素市场<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 13、14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明劳动需求为什么是「派生需求」，并算出边际产量值。\n<\/li><li>\n用边际产量值等于工资的原则，判断一家企业该雇几个人。\n<\/li><li>\n解释移民、技术变化、产品价格变化分别如何影响工资。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>企业雇人不是因为他可怜，而是因为他能带来收入：雇一个人的收益等于他多生产的产品卖出的钱，这个数叫边际产量值；工资最终由它和劳动者的供给共同决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>劳动需求是派生需求<\/h3>\n<p>消费者买奶茶，才让奶茶店需要店员。<strong>派生需求<\/strong>（derived demand）指对生产要素的需求来自对最终产品的需求。没有顾客，就不需要店员。<\/p>\n<p>一家奶茶店的雇人决策可以算得很具体。设每杯奶茶卖 3 元，店里已有设备固定，增加店员带来的产量增量如下：<\/p>\n<table><thead><tr><th>店员人数<\/th><th>每小时产量<\/th><th>边际产量<\/th><th>边际产量值<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>40 杯<\/td><td>40<\/td><td>120 元<\/td><\/tr><tr><td>2<\/td><td>90 杯<\/td><td>50<\/td><td>150 元<\/td><\/tr><tr><td>3<\/td><td>130 杯<\/td><td>40<\/td><td>120 元<\/td><\/tr><tr><td>4<\/td><td>160 杯<\/td><td>30<\/td><td>90 元<\/td><\/tr><\/tbody><\/table>\n<p><strong>边际产量值<\/strong>（value of the marginal product）= 边际产量 × 产品价格。它衡量&quot;多雇一个人能多赚多少钱&quot;。<\/p>\n<p>企业雇人的原则：只要 VMPL ≥ 工资，就继续雇；VMPL &lt; 工资，就停止。若市场工资是 120 元/小时，雇到第 3 个人；若工资涨到 150 元，只雇 2 个。<\/p>\n<p>这条原则与第 14 章的&quot;P = MC&quot;是同一件事的另一个视角：企业按边际成本等于价格决定产量，等价于按边际产量值等于工资决定用工。<\/p>\n<h3>劳动需求曲线的移动<\/h3>\n<p>三个原因：<\/p>\n<ol><li>\n<strong>产品价格上升<\/strong>：奶茶从 3 元涨到 4 元，VMPL 整体上移，需求右移。\n<\/li><li>\n<strong>其他要素价格变化<\/strong>：设备变便宜，每人能操作的机器更多，劳动需求右移。\n<\/li><li>\n<strong>技术改进<\/strong>：新技术提高每人的产出，需求右移。\n<\/ol>\n<h3>劳动供给<\/h3>\n<p>供给方是劳动者。核心权衡是<strong>工作与闲暇<\/strong>：多工作一小时，多拿一小时工资，少一小时休息。工资上升会吸引更多人工作，但高到一定程度后，有些人反而减少工作时间（因为一小时工资够买很多东西了，宁可多休息）。这个&quot;向后弯&quot;的可能是存在的，但大多数情况下供给曲线仍向上倾斜。<\/p>\n<p>供给曲线移动的原因：人口变化、移民、对其他职业的机会、偏好变化（比如女性劳动参与率上升）。<\/p>\n<h3>均衡工资<\/h3>\n<p>劳动供给与需求相交，得到均衡工资与均衡就业量。这个价格会随着供需变化而波动：<\/p>\n<ul><li>\n某职业需求大增（比如 2010 年代的算法工程师）→ 工资快速上升。\n<\/li><li>\n供给大增（比如高校扩招后某专业毕业生暴增）→ 工资下降。\n<\/li><li>\n进入门槛降低 → 供给增加 → 工资下降。\n<\/ul>\n<h3>土地和资本<\/h3>\n<p><strong>土地<\/strong>的供给通常被认为接近固定（尤其在城市），所以地价主要由需求决定。<strong>资本<\/strong>（机器、厂房、设备）的供给可以增加，价格（利率、租金）由供需共同决定。<\/p>\n<p>三类要素的报酬形式不同：劳动得到工资，土地得到地租，资本得到利息。但定价逻辑相同——<strong>要素的价格等于它创造的边际价值<\/strong>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;工资由老板的心情决定&quot;——实际上长期看由劳动生产率和供需决定，老板给的低于市场价就招不到人。\n<\/li><li>\n别以为&quot;提高最低工资一定让工人受益&quot;——实际上它同时提高劳动成本，可能减少雇佣（第 19、28 章详述）。\n<\/li><li>\n别以为&quot;资本和劳动是对立的&quot;——实际上它们常常互补：设备更好，同一批工人产出更多，工资也能更高。\n<\/li><li>\n别以为&quot;边际产量值高的职业工资一定高&quot;——实际上还要看供给。一个职业创造价值很高但从业者众多，工资未必高。\n<\/ul>\n<ol><li>\n（单选）某企业最后雇的一名工人每小时多产出 30 件产品，产品单价 5 元。在完全竞争劳动市场上，这名工人的工资上限约为？\n<p>A. 30 元  B. 150 元  C. 5 元  D. 无法判断 <strong>答案<\/strong>：B；<strong>解析<\/strong>：边际产量值 = 30 × 5 = 150 元。企业愿意支付的工资不超过这一数额，否则雇这个人就亏损。<\/p>\n<\/ol>\n<ol><li>\n（单选）劳动需求被称为「派生需求」，原因是？\n<p>A. 它来自对最终产品的需求  B. 它由法律规定的工资标准派生  C. 它由工会与雇主谈判派生  D. 它随人口自然增长派生 <strong>答案<\/strong>：A；<strong>解析<\/strong>：企业雇人是为了生产顾客要买的东西，最终产品没有需求，劳动需求也随之消失。<\/p>\n<\/ol>\n<ol><li>\n（单选）产品价格上升，同时其他条件不变，劳动市场会发生什么？\n<p>A. 劳动需求曲线左移，工资下降  B. 劳动需求曲线右移，工资上升  C. 劳动供给曲线左移，工资上升  D. 劳动供给曲线右移，工资下降 <strong>答案<\/strong>：B；<strong>解析<\/strong>：产品涨价使每个工人的边际产量值上升，企业愿付更高工资，劳动需求右移，均衡工资上升。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n劳动需求是派生需求；企业雇到 VMPL = 工资为止。\n<\/li><li>\nVMPL = 边际产量 × 产品价格，产品涨价或技术改进会让劳动需求右移。\n<\/li><li>\n要素价格由它创造的边际价值与要素供给共同决定。\n<\/ul>", "ch19": "<h1>第 19 章：收入与歧视<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 18 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出造成工资差距的四类非歧视因素，并各举一例。\n<\/li><li>\n解释超级明星现象成立的两个条件。\n<\/li><li>\n分清「雇主歧视」「顾客歧视」「政府歧视」三种情形，并说明市场力量在哪种情形下能削弱歧视。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>工资差距大部分不是&quot;同工不同酬&quot;，而是&quot;不同工&quot;：工作条件、能力、机遇、行业规模都在拉开差距；歧视确实存在，但它能否持续，取决于歧视者是否要为此付钱。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一句话先说清楚<\/h3>\n<p>&quot;同样上班，为什么他挣得比我多&quot;——这个问题要拆成两层：<strong>是不是同一份工作<\/strong>，<strong>是不是同一个人<\/strong>。大多数工资差距来自第一层的差异，剩下的才可能来自歧视。<\/p>\n<h3>四类非歧视因素<\/h3>\n<p><strong>一、补偿性工资差别。<\/strong> 危险、辛苦、偏远、不体面、时间不自由的工作，需要额外报酬才有人干。高空作业比办公室文员挣得多，不是能力差异，是风险补偿。<\/p>\n<p><strong>二、能力差异。<\/strong> 天生的才能、体力、智力、性格，都会影响产出。这部分很难改变，也是收入差距的天然来源之一。<\/p>\n<p><strong>三、努力差异。<\/strong> 同样能力的人，投入的小时数、专注程度不同。<\/p>\n<p><strong>四、机遇差异。<\/strong> 入行时机、遇到的老板、行业景气度。2005 年进互联网和 2015 年进互联网，起薪差别很大。<\/p>\n<p>此外还有<strong>人力资本<\/strong>：教育年限、技能证书、在职培训。这一项是可投资的，也是政策最能起作用的地方（教育补贴、职业培训）。<\/p>\n<h3>超级明星现象<\/h3>\n<p>为什么顶级的歌手、运动员收入是普通从业者的几十倍，而顶级理发师和普通理发师差别没那么大？<\/p>\n<p>两个条件同时成立才会出现：<\/p>\n<ol><li>\n<strong>产出可以低成本复制<\/strong>。一首歌录一次可以卖给所有人；一次理发只能服务一个人。\n<\/li><li>\n<strong>消费者在意质量差异<\/strong>。听众能分辨唱功，愿意为最好的多付钱。\n<\/ol>\n<p>所以歌手的市场是&quot;赢者通吃&quot;，理发师的市场是&quot;按人头分配&quot;。这条规律解释了为什么体育、影视、演艺、部分软件行业的收入分布极端陡峭。<\/p>\n<h3>高于均衡水平的工资<\/h3>\n<p>有三种力量会把工资抬到市场均衡之上：<\/p>\n<ol><li>\n<strong>最低工资法<\/strong>：法律规定的下限。它保护了有工作的人，但可能减少雇佣量，尤其是低技能青年。\n<\/li><li>\n<strong>工会<\/strong>：集体谈判提高工资与福利。代价可能是会员人数减少、非会员就业机会受挤压。\n<\/li><li>\n<strong>效率工资<\/strong>：企业主动给高于市场的工资。理由有四条——吃得更好体力更足、流动率低、能招到更好的人、员工更不愿偷懒（因为丢了这份工作损失大）。\n<\/ol>\n<h3>歧视：三种情形<\/h3>\n<p><strong>歧视<\/strong>（discrimination）指对生产能力相同的人因身份特征（性别、种族、年龄、外貌）给予不同待遇。<\/p>\n<p><strong>一、雇主歧视。<\/strong> 雇主宁愿少赚钱也不用某类人。理论上市场会淘汰这种企业——因为它的成本比不歧视的对手高。但如果消费者也歧视（顾客不愿让某类人服务），或者歧视者本身是垄断者（有超额利润可以消耗），歧视就能持续。<\/p>\n<p><strong>二、顾客歧视。<\/strong> 顾客的选择逼着企业按顾客偏好配置人员。这种情况下，市场力量不会消除歧视，反而会强化它。要改变只能靠改变消费者偏好或法规。<\/p>\n<p><strong>三、政府歧视。<\/strong> 法律曾经明文规定某些岗位只招某类人（历史上的种族隔离、性别限制）。这类歧视靠政治运动和法律废除，市场无能为力。<\/p>\n<p><strong>衡量歧视的困难<\/strong>：直接把两组人的平均工资相减，得到的数字里混着能力、经验、行业、工时、地区的差异。要分离出纯粹的歧视，需要控制这些变量，而控制得越细，剩下的&quot;无法解释的差距&quot;越小——但它仍可能包含未观测的因素。这是劳动经济学里最难的测量问题之一。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;工资差距都是歧视造成的&quot;——实际上大部分可由工作条件、能力、经验、行业解释，剩下部分才可能涉及歧视。\n<\/li><li>\n别以为&quot;市场会自动消除歧视&quot;——实际上只有在顾客不歧视、企业竞争充分时才成立；顾客歧视与垄断会让它持续。\n<\/li><li>\n别以为&quot;效率工资是老板好心&quot;——实际上它是投资：低流动率、高积极性带来的收益超过多付的工资。\n<\/li><li>\n别以为&quot;提高最低工资对低收入者总是有利&quot;——实际上要看就业损失有多大，净效果取决于弹性。\n<\/ul>\n<ol><li>\n（单选）高空作业的工资高于办公室文员，最可能的原因是？\n<p>A. 高空作业者能力更强  B. 补偿性工资差别，工作条件更危险  C. 工会力量更强  D. 政府规定的工资更高 <strong>答案<\/strong>：B；<strong>解析<\/strong>：危险、辛苦、地点偏远的工作需要额外报酬才能吸引人，这部分差额叫补偿性工资差别。<\/p>\n<\/ol>\n<ol><li>\n（单选）「超级明星现象」出现的前提是？\n<p>A. 产品可以低成本复制，且消费者在意质量差异  B. 从业者数量极少  C. 政府限制进入  D. 企业规模很大 <strong>答案<\/strong>：A；<strong>解析<\/strong>：唱歌、体育、影视的产出可以复制给所有人，最好的那几个人能满足全部需求，于是收入高度集中。理发师做不到这一点，因为服务无法复制。<\/p>\n<\/ol>\n<ol><li>\n（多选）哪些因素会造成同等工作之间的工资差距？\n<p>A. 工作危险程度不同  B. 工作地点生活成本不同  C. 工作时间的灵活性不同  D. 货币单位不同 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：补偿性差别涵盖危险、地点、时间、声誉等非货币特征；货币单位不影响实际工资比较。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n工资差距的四类非歧视来源：补偿性差别、能力、努力、机遇，加上人力资本投资。\n<\/li><li>\n超级明星现象需要&quot;可复制&quot;与&quot;质量可辨&quot;两个条件。\n<\/li><li>\n雇主歧视可能被市场淘汰，顾客歧视与政府歧视不会；衡量歧视必须控制其他变量。\n<\/ul>", "ch20": "<h1>第 20 章：收入不平等与贫困<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 12、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明基尼系数与贫困率的算法，并指出各自的局限。\n<\/li><li>\n比较功利主义、自由主义、自由至上主义三种再分配立场，说出各自的核心主张与批评。\n<\/li><li>\n评价最低工资、福利、负所得税、实物转移四类反贫困政策的利弊。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>不平等可以测量，但&quot;应该多平等&quot;是价值判断；政策工具各有代价，选择哪一种取决于你更看重哪一类代价——效率损失、工作激励、还是尊严与自主。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>怎么衡量不平等<\/h3>\n<p>把家庭按收入从低到高排队，画一条累计收入占比曲线，就是<strong>洛伦兹曲线<\/strong>。完全平均时它是一条 45° 直线；越弯曲，不平等越严重。<\/p>\n<p><strong>基尼系数<\/strong> = 45° 线与洛伦兹曲线之间的面积 ÷ 45° 线以下的三角形面积。取值 0 到 1，0 表示完全平均，1 表示一人独占全部收入。<\/p>\n<p><strong>贫困率<\/strong> = 收入低于贫困线的家庭占比。贫困线的设定各国不同，通常按&quot;满足基本食物与住房需要的收入&quot;确定。<\/p>\n<h3>测量本身的问题<\/h3>\n<ul><li>\n<strong>实物转移没算进去<\/strong>。政府给的医保、住房补贴、食品券不是现金，统计收入时常常漏掉，会让贫困率显得偏高。\n<\/li><li>\n<strong>只看一年收入，忽略生命周期<\/strong>。年轻人和退休者收入低但财富或预期收入不低，一年的快照会误导。\n<\/li><li>\n<strong>暂时性收入波动<\/strong>。某年失业，收入掉到贫困线以下，但长期看并不贫困。\n<\/li><li>\n<strong>税收与转移支付前后差别大<\/strong>。税前基尼系数与税后基尼系数可以差很多。\n<\/li><li>\n<strong>不反映流动性<\/strong>。一个社会基尼系数高但阶层流动快，与基尼系数同样高但阶层固化的社会，性质完全不同。\n<\/ul>\n<h3>三种政治哲学<\/h3>\n<p><strong>功利主义<\/strong>（utilitarianism，边沁）：目标是最大多数人的最大幸福。因为收入有<strong>边际效用递减<\/strong>——给穷人 1000 元带来的幸福感大于给富人 1000 元——所以再分配能提高总效用。批评：效用无法测量，且这种算法可能允许为了多数人的利益牺牲少数人。<\/p>\n<p><strong>自由主义<\/strong>（liberalism，罗尔斯）：正义的原则应该在&quot;无知之幕&quot;后选择——你不知道自己会出生在哪个家庭。理性的人会选择一个保护最差处境者的制度。所以再分配的目标是<strong>最大化最不利者的福利<\/strong>。批评：它可能要求过高的再分配，损害激励。<\/p>\n<p><strong>自由至上主义<\/strong>（libertarianism，诺齐克）：只要财产的获取过程正当（劳动、自愿交换、继承合法），结果不平等就不需要纠正。政府再分配等于强制拿走某人的合法所得。批评：它忽略了起点不平等（出生时的资源、教育机会）本身是否正当。<\/p>\n<p>三种立场对应三种政策取向：功利主义支持温和再分配，自由主义支持较强的再分配与公共服务，自由至上主义支持低税与自愿慈善。<\/p>\n<h3>四类反贫困政策<\/h3>\n<p><strong>一、最低工资法。<\/strong> 提高低技能工人的工资。代价：可能减少雇佣，尤其是青年与初次就业者。效果取决于劳动市场弹性。<\/p>\n<p><strong>二、福利（现金补助）。<\/strong> 直接给钱。优点：尊重个人选择。缺点：可能削弱工作激励（收入增加后补助减少，实际边际税率很高）。<\/p>\n<p><strong>三、负所得税。<\/strong> 收入低于某线时政府补贴，收入上升时补贴逐步减少。它把&quot;补助&quot;和&quot;工作激励&quot;设计在一个公式里，避免了福利的&quot;断崖&quot;。代价是财政成本与较高的实际边际税率。<\/p>\n<p><strong>四、实物转移<\/strong>（食品券、公租房、医保）。优点：确保钱花在需要的地方。缺点：限制了受益人的选择，行政成本高。<\/p>\n<p><strong>共同的难题是&quot;工作激励&quot;<\/strong>。任何&quot;收入越低补得越多&quot;的设计，本质上都在给工作收入征一笔隐含的税。要既保底又不伤激励，只能在补贴水平与退出速度之间找平衡。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;基尼系数高就一定糟糕&quot;——实际上还要看流动性、绝对生活水平、公共服务。一个高基尼但人人生活改善的社会，与低基尼但停滞的社会不可简单比较。\n<\/li><li>\n别以为&quot;贫困率下降就说明政策有效&quot;——实际上统计口径变化（比如把实物转移计入）也会让数字变化。\n<\/li><li>\n别以为&quot;再分配只是道德问题&quot;——实际上它有效率代价，设计不好会同时损害效率与公平。\n<\/li><li>\n别以为&quot;给钱一定比给物好&quot;——实际上实物转移能确保基本需求被满足，现金可能被挪作他用，两者各有适用场景。\n<\/ul>\n<ol><li>\n（单选）基尼系数为 0 表示？\n<p>A. 一人占有全部收入  B. 收入完全平均  C. 一半人贫困  D. 无法计算 <strong>答案<\/strong>：B；<strong>解析<\/strong>：基尼系数取值 0 到 1，0 表示洛伦兹曲线与 45 度线重合，即完全平均；1 表示一人独占全部收入。<\/p>\n<\/ol>\n<ol><li>\n（单选）功利主义支持再分配的核心理由是？\n<p>A. 富人赚钱不道德  B. 收入的边际效用递减，转移给穷人能提高总效用  C. 每个人都应获得相同收入  D. 政府需要更多税收 <strong>答案<\/strong>：B；<strong>解析<\/strong>：边沁式功利主义认为同样一笔钱给穷人带来的效用增量更大，因此再分配能增加总福利。<\/p>\n<\/ol>\n<ol><li>\n（单选）负所得税相比传统福利的最大优点是？\n<p>A. 财政成本为零  B. 把补贴与工作收入平滑衔接，减少「工作就失去补助」的断崖  C. 不需要任何行政成本  D. 可以完全消除贫困 <strong>答案<\/strong>：B；<strong>解析<\/strong>：负所得税按收入逐步退出补贴，避免福利制度中收入略增就失去全部补助的激励陷阱，代价是较高的隐含边际税率。<\/p>\n<\/ol>\n<ol><li>\n（多选）用年度收入衡量贫困可能失真，原因包括？\n<p>A. 忽略实物转移  B. 忽略生命周期差异  C. 暂时性失业被当成长期贫困  D. 没有考虑税率 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：四项都会造成口径偏差：实物转移未计入收入、年轻人与退休者的生命周期特征、暂时波动、税前税后差异都会影响统计结果。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n基尼系数衡量不平等程度，贫困率衡量低于贫困线的人口占比，两者都要看口径。\n<\/li><li>\n三种立场：功利主义看总效用（边际效用递减支持再分配）、自由主义看最差者（罗尔斯）、自由至上主义看过程正当（诺齐克）。\n<\/li><li>\n反贫困政策的核心矛盾是保底与工作激励之间的取舍。\n<\/ul>", "ch21": "<h1>第 21 章：消费者选择理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 4、5、13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出预算约束方程，画出预算线，并说明价格比与截距各自的含义。\n<\/li><li>\n说出无差异曲线的四个特征，画出完全替代与完全互补两种极端情形。\n<\/li><li>\n用「边际替代率 = 价格比」这一条件求最优消费组合。\n<\/li><li>\n解释收入效应与替代效应如何共同决定需求曲线的形状，以及吉芬物品为什么反常。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>消费者在&quot;买得起&quot;与&quot;最想要&quot;之间找交点：预算线代表能买什么，无差异曲线代表想要什么，最优点在两者相切处——那里愿意换的比例恰好等于市场让你换的比例。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>预算约束<\/h3>\n<p>设奶茶每杯 2 元，电影每张 4 元，预算 40 元。设奶茶 x 杯、电影 y 张：<\/p>\n<ul><li>\n预算方程：2x + 4y = 40\n<\/li><li>\n横截距（全买奶茶）：20 杯\n<\/li><li>\n纵截距（全看电影）：10 张\n<\/li><li>\n斜率：−2 ÷ 4 = −0.5，含义是&quot;少喝 2 杯奶茶可以多看 1 张电影&quot;\n<\/ul>\n<p><strong>预算线<\/strong>就是所有&quot;把钱花光&quot;的组合。线内的点有钱剩，线外的点买不起。<\/p>\n<h3>偏好与无差异曲线<\/h3>\n<p><strong>无差异曲线<\/strong>（indifference curve）是所有给消费者带来相同满足程度的组合。同一条线上的点，他觉得&quot;哪个都行&quot;。<\/p>\n<p>四条性质：<\/p>\n<ol><li>\n<strong>向右下方倾斜<\/strong>：多要一样就得少要另一样，否则满足度会变。\n<\/li><li>\n<strong>离原点越远，满足度越高<\/strong>：多总比少好。\n<\/li><li>\n<strong>两条无差异曲线不相交<\/strong>：相交会推出&quot;同一组合既比另一个好又不如它&quot;的矛盾。\n<\/li><li>\n<strong>凸向原点<\/strong>：曲线上段的斜率绝对值大，下段小。\n<\/ol>\n<p>第 4 条的经济含义是<strong>边际替代率递减<\/strong>：你已经有很多奶茶时，愿意用很多杯去换一张电影票；奶茶快没了的时候，就不肯换了。<\/p>\n<p><strong>边际替代率<\/strong>（MRS）= 为多得到一单位横轴商品，愿意放弃的纵轴商品数量，也就是无差异曲线斜率的绝对值。<\/p>\n<h3>两种极端<\/h3>\n<ul><li>\n<strong>完全替代<\/strong>：两种商品按固定比例互换，无差异曲线是直线。比如&quot;1 元硬币&quot;和&quot;两个 5 角硬币&quot;。\n<\/li><li>\n<strong>完全互补<\/strong>：必须按固定比例一起用，无差异曲线是 L 形。比如&quot;左脚鞋&quot;和&quot;右脚鞋&quot;，多一只没用。\n<\/ul>\n<p>现实中大多数商品介于两者之间，曲线是平滑的凸形。<\/p>\n<h3>最优选择<\/h3>\n<p>最优点是预算线与某条无差异曲线的<strong>切点<\/strong>。条件写出来是：<\/p>\n<p><strong>MRS = Px ÷ Py<\/strong><\/p>\n<p>含义：你愿意换的比例（MRS）恰好等于市场允许你换的比例（价格比）。若不相等，比如 MRS = 1 而价格比 = 0.5，说明你愿意用 1 张电影票换 1 杯奶茶，但市场上 1 张票能换 2 杯——那就多换，直到两者相等。<\/p>\n<p>用数字验证：奶茶 2 元、电影 4 元，最优点在 x = 10、y = 5，此时 MRS = 0.5，正好等于 2 ÷ 4。<\/p>\n<svg viewBox=\"0 0 560 400\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:12px auto;font-family:inherit\" role=\"img\"><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"185.0\" y1=\"340.0\" x2=\"185.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"262.5\" x2=\"530.0\" y2=\"262.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"300.0\" y1=\"340.0\" x2=\"300.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"185.0\" x2=\"530.0\" y2=\"185.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"415.0\" y1=\"340.0\" x2=\"415.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"107.5\" x2=\"530.0\" y2=\"107.5\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"530.0\" y1=\"340.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"30.0\" x2=\"530.0\" y2=\"30.0\" stroke=\"#e5e7eb\" stroke-width=\"1\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"530.0\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><line x1=\"70.0\" y1=\"340.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#111827\" stroke-width=\"1.6\"/><text x=\"300.0\" y=\"382.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\">奶茶（杯）<\/text><text x=\"16\" y=\"185.0\" font-size=\"12\" fill=\"#374151\" text-anchor=\"middle\" transform=\"rotate(-90 16 185.0)\">电影（张）<\/text><text x=\"300.0\" y=\"18\" font-size=\"13\" fill=\"#111827\" text-anchor=\"middle\" font-weight=\"600\">第 21 章示例：预算线与无差异曲线相切<\/text><polyline points=\"70.0,81.7 453.3,340.0\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2.2\"/><text x=\"390.2\" y=\"294.7\" font-size=\"12\" fill=\"#2563eb\" font-weight=\"600\">预算线<\/text><polyline points=\"165.8,81.7 185.0,124.7 204.2,155.5 223.3,178.5 242.5,196.5 261.7,210.8 280.8,222.6 300.0,232.4 319.2,240.6 338.3,247.7 376.7,259.3\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2.2\"/><text x=\"334.7\" y=\"253.3\" font-size=\"12\" fill=\"#16a34a\" font-weight=\"600\">U1<\/text><polyline points=\"185.0,38.6 204.2,81.7 223.3,114.0 242.5,139.1 261.7,159.2 280.8,175.6 300.0,189.3 319.2,200.9 338.3,210.8 357.5,219.4 376.7,227.0 415.0,239.5\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"2.2\"/><text x=\"430.5\" y=\"217.2\" font-size=\"12\" fill=\"#9ca3af\" font-weight=\"600\">U2 无法达到<\/text><circle cx=\"261.7\" cy=\"210.8\" r=\"4\" fill=\"#111827\"/><line x1=\"261.7\" y1=\"210.8\" x2=\"261.7\" y2=\"340.0\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><line x1=\"261.7\" y1=\"210.8\" x2=\"70.0\" y2=\"210.8\" stroke=\"#111827\" stroke-width=\"1.2\" stroke-dasharray=\"5,4\"/><text x=\"288.5\" y=\"148.8\" font-size=\"11.5\" fill=\"#111827\">最优：10 杯奶茶、5 张电影票<\/text><text x=\"81.5\" y=\"45.5\" font-size=\"11.5\" fill=\"#6b7280\">切点处 边际替代率 = 价格比 0.5<\/text><\/svg>\n<p>看图说明：蓝线是预算线，绿线是能达到的最高无差异曲线 U1，切点就是最优组合。灰色 U2 在预算线之外，看得到买不起。切点以外任何一点，要么超出预算，要么落在更低的 U1 上。<\/p>\n<h3>收入变化与价格变化<\/h3>\n<p><strong>收入增加<\/strong>：预算线平行外移，最优点沿&quot;收入—消费曲线&quot;移动。把不同收入下的最优购买量画出来，就是<strong>恩格尔曲线<\/strong>。<\/p>\n<p><strong>价格变化<\/strong>：奶茶降价，预算线的横截距变大（能买更多杯），最优点移动。把不同价格下的最优购买量连起来，就<strong>推导出需求曲线<\/strong>——这是第 4 章那条向下倾斜的曲线在理论上的来源。<\/p>\n<h3>收入效应与替代效应<\/h3>\n<p>价格变化对消费量的影响可以拆成两部分：<\/p>\n<ul><li>\n<strong>替代效应<\/strong>：奶茶便宜了，相对电影更划算，于是用奶茶替代电影。方向永远与价格变动相反（降价则增加）。\n<\/li><li>\n<strong>收入效应<\/strong>：奶茶降价等于你的购买力上升，你能买更多东西。方向取决于商品类型——正常品增加，劣等品减少。\n<\/ul>\n<p>两者相加就是总效应。大多数商品：替代效应为正（降价增购）+ 收入效应为正 → 总效应明显为正，需求曲线向下倾斜。<\/p>\n<p><strong>吉芬物品<\/strong>（Giffen good）是罕见例外：极端劣等品，收入效应为负且大于替代效应。土豆涨价时，穷人反而买更多土豆（因为买不起肉了）。这时需求曲线向上倾斜。现实中极难找到确凿例子，教材里也只是理论构造。<\/p>\n<h3>三个应用<\/h3>\n<p><strong>一、工资与劳动供给。<\/strong> 把&quot;闲暇&quot;当成一种商品，工资就是它的价格。工资上升，替代效应让人多工作（闲暇变贵），收入效应让人少工作（更有钱了）。哪个占上风决定劳动供给曲线向上还是向后弯。<\/p>\n<p><strong>二、利率与储蓄。<\/strong> 把&quot;现在的消费&quot;和&quot;未来的消费&quot;当成两种商品，利率是它们的交换比例。利率上升，替代效应鼓励多储蓄，收入效应鼓励多消费。<\/p>\n<p><strong>三、吉芬物品的搜寻。<\/strong> 教材专门讨论&quot;能不能找到真的吉芬物品&quot;，结论是很难，因为需要同时满足&quot;极端劣等&quot;和&quot;占支出很大比重&quot;两个条件。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;无差异曲线可以相交&quot;——实际上相交会破坏偏好的传递性，逻辑上不成立。\n<\/li><li>\n别以为&quot;最优点是预算线中点&quot;——实际上取决于偏好与价格，不在中点很常见。\n<\/li><li>\n别以为&quot;降价一定多买&quot;——实际上吉芬物品是例外，收入效应可以压过替代效应。\n<\/li><li>\n别以为&quot;效用可以精确测量&quot;——实际上现代理论只用&quot;排序&quot;，不比大小，只要消费者能说出&quot;我更喜欢 A&quot;就够了。\n<\/ul>\n<ol><li>\n（单选）奶茶 2 元一杯、电影 4 元一张、预算 40 元。预算线的斜率绝对值为？\n<p>A. 2  B. 0.5  C. 4  D. 20 <strong>答案<\/strong>：B；<strong>解析<\/strong>：预算线为 2x + 4y = 40，改写为 y = 10 − 0.5x，斜率绝对值 0.5，含义是少喝 2 杯奶茶可多看 1 张电影。<\/p>\n<\/ol>\n<ol><li>\n（单选）消费者最优选择的条件是？\n<p>A. 边际替代率等于价格比  B. 两种商品消费量相等  C. 预算线中点的组合  D. 无差异曲线与纵轴相交 <strong>答案<\/strong>：A；<strong>解析<\/strong>：在切点处，消费者愿意交换的比例（MRS）恰好等于市场交换比例（Px/Py），此时无法通过调整组合提高满足度。<\/p>\n<\/ol>\n<ol><li>\n（单选）吉芬物品的特点是？\n<p>A. 价格上升时需求量也上升  B. 价格上升时需求量急剧下降  C. 与替代品完全无关  D. 只存在于完全竞争市场 <strong>答案<\/strong>：A；<strong>解析<\/strong>：吉芬物品是极端劣等品，价格上涨时收入效应为负且强于替代效应，导致需求量反而增加，需求曲线向上倾斜。<\/p>\n<\/ol>\n<ol><li>\n（多选）无差异曲线的性质包括？\n<p>A. 向右下方倾斜  B. 离原点越远满足度越高  C. 两条曲线不相交  D. 凸向原点 <strong>答案<\/strong>：A、B、C、D；<strong>解析<\/strong>：四项都是标准性质。凸向原点对应边际替代率递减：拥有的商品越多，越愿意用它去换另一种。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n预算线斜率 = −Px/Py，截距由收入与价格决定。\n<\/li><li>\n无差异曲线四性质：向下倾斜、越远越好、不相交、凸向原点（MRS 递减）。\n<\/li><li>\n最优点条件 MRS = Px/Py；价格变化的影响 = 替代效应 + 收入效应，吉芬物品是后者压过前者的例外。\n<\/ul>", "ch22": "<h1>第 22 章：微观经济学前沿<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 10、11、16、21 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n分清逆向选择与道德风险，并各举一个市场失灵的例子。\n<\/li><li>\n说明中位投票人定理与阿罗不可能定理各自说了什么、没说 什么。\n<\/li><li>\n列出行为经济学的四个常见偏差，并解释它们如何影响经济决策。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>当信息不对称、集体决策规则有缺陷、人的判断有系统性偏差时，&quot;看不见的手&quot;和&quot;投票箱&quot;都会失灵——这三块是微观经济学正在扩展的边界。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一、不对称信息<\/h3>\n<p><strong>不对称信息<\/strong>（asymmetric information）指交易一方比另一方知道得更多。<\/p>\n<p><strong>逆向选择<\/strong>（adverse selection）：信息劣势方无法分辨好坏，于是只肯出平均价；高质量卖方觉得不划算退出，市场上剩下低质量产品，平均质量进一步下降，价格继续下降——市场可能萎缩甚至消失。二手车市场就是这个逻辑：买家分不清事故车，只肯出中间价，好车卖家退出。<\/p>\n<p>应对手段：<\/p>\n<ul><li>\n<strong>信号<\/strong>（signaling）：信息优势方主动提供可验证的证据。学历证书、品牌保修、第三方检测报告都属于信号——造假成本高才可信。\n<\/li><li>\n<strong>筛选<\/strong>（screening）：信息劣势方设计机制逼对方暴露信息。保险公司的体检、免赔额条款（愿意接受高免赔额的人通常身体好）。\n<\/ul>\n<p><strong>道德风险<\/strong>（moral hazard）：签约之后，一方因为不再承担全部后果而改变行为。买了全额车险的人开车更不小心；企业拿了贷款后乱花钱。<\/p>\n<p>区分要点：逆向选择发生在<strong>签约前<\/strong>（谁在跟我交易），道德风险发生在<strong>签约后<\/strong>（交易之后他怎么干）。<\/p>\n<p>保险业同时面对两者：投保前不知道谁身体差（逆向选择），投保后不注意保养（道德风险）。应对方式是核保与免赔额、共保比例。<\/p>\n<h3>二、政治经济学<\/h3>\n<p>公共选择理论把选民、政治家、官僚当成理性自利者来分析。<\/p>\n<p><strong>中位投票人定理<\/strong>（median voter theorem）：如果议题是一维的（比如&quot;预算规模从 0 到 100 亿&quot;），且选民偏好是单峰的，那么多数投票的结果会落在<strong>中位选民<\/strong>偏好的位置。因为任何偏离中位的方案，都会被中位一侧的多数否决。<\/p>\n<p>推论：政党的政策会向中间靠拢；少数派的强烈偏好很难被满足。<\/p>\n<p><strong>投票悖论<\/strong>（孔多塞悖论）：三个选项、三个选民，偏好排序可能形成循环——A 胜 B、B 胜 C、C 胜 A。没有稳定多数，结果取决于投票顺序。<\/p>\n<p><strong>阿罗不可能定理<\/strong>：如果同时要求满足若干条合理的公理（无限制偏好、非独裁、传递性等），则不存在一种能对所有偏好组合都给出合理结果的投票规则。它不是说&quot;民主不可能&quot;，而是说&quot;没有完美的加总规则&quot;，任何规则都要在某条性质上让步。<\/p>\n<p><strong>政治家与官僚的自利<\/strong>：竞选需要资金，政策可能偏向捐款者；官僚机构倾向于扩大预算。<strong>寻租<\/strong>（第 15 章）在此再次出现。<\/p>\n<h3>三、行为经济学<\/h3>\n<p>标准理论假设人是理性的效用最大化者。行为经济学发现系统性偏差：<\/p>\n<ul><li>\n<strong>过度自信<\/strong>：人普遍高估自己的判断准确度。创业者高估成功率，投资者高估选股能力。\n<\/li><li>\n<strong>锚定效应<\/strong>：先看到的数字会影响后续判断。标价 999 再打五折，与直接标 500，感知不同。\n<\/li><li>\n<strong>损失厌恶<\/strong>：失去 100 元的痛苦大于得到 100 元的快乐。这解释了对&quot;免费退货&quot;&quot;保价&quot;的偏好，也解释了为什么人们不愿卖亏损的股票。\n<\/li><li>\n<strong>框架效应<\/strong>：同一事实换一种说法，决策就变。&quot;手术成功率 90%&quot;比&quot;死亡率 10%&quot;更容易被接受。\n<\/li><li>\n<strong>现时偏见与前后不一致<\/strong>：今天的诱惑比未来的收益更有吸引力，导致戒烟、减肥、储蓄这类&quot;长期有益&quot;的事常常失败。\n<\/ul>\n<p>这些偏差不是&quot;人傻&quot;，而是系统性、可预测的，因此可以被利用（营销）也可以被纠正（默认选项、自动加入养老金计划）。<\/p>\n<h3>三块边界的关系<\/h3>\n<p>三者都在回答同一个问题的变体：&quot;当标准假设不成立时会怎样&quot;。<\/p>\n<ul><li>\n信息不完美 → 市场机制失灵 → 需要信号、筛选、制度设计。\n<\/li><li>\n决策规则不完美 → 公共选择失灵 → 需要宪法层面的约束与程序正义。\n<\/li><li>\n认知有偏差 → 个体决策偏离最优 → 需要&quot;助推&quot;（nudge）与默认设置。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;逆向选择等于道德风险&quot;——实际上前者在签约前、后者在签约后，应对手段也不同。\n<\/li><li>\n别以为&quot;阿罗定理证明民主没有意义&quot;——实际上它只说明不存在完美的加总规则，具体规则在特定情形下仍可合理。\n<\/li><li>\n别以为&quot;行为经济学说明人都是非理性的&quot;——实际上偏差是系统性的、方向可预测的，这才让它有分析价值。\n<\/li><li>\n别以为&quot;信息不对称只能靠政府管&quot;——实际上信号与筛选常能由市场自发产生（品牌、认证、保修）。\n<\/ul>\n<ol><li>\n（单选）买全额医疗保险的人更不注意保养身体，这属于？\n<p>A. 逆向选择  B. 道德风险  C. 信号失灵  D. 锚定效应 <strong>答案<\/strong>：B；<strong>解析<\/strong>：道德风险发生在签约之后：投保后不再承担全部后果，行为随之改变。逆向选择发生在签约前，是好坏客户混在一起的问题。<\/p>\n<\/ol>\n<ol><li>\n（单选）二手车市场上好车卖家退出，主要原因是什么？\n<p>A. 买家只肯按平均质量出价，好车卖不到应有价格  B. 二手车需求下降  C. 政府限制交易  D. 维修成本上升 <strong>答案<\/strong>：A；<strong>解析<\/strong>：买家无法分辨质量只肯出中间价，高质量车卖不上价而退出，市场平均质量下降，形成逆向选择的恶性循环。<\/p>\n<\/ol>\n<ol><li>\n（单选）阿罗不可能定理说明？\n<p>A. 民主制度注定失败  B. 不存在同时满足所有合理公理的投票加总规则  C. 多数投票总是最优  D. 只要选民理性就能得到完美结果 <strong>答案<\/strong>：B；<strong>解析<\/strong>：它指出任何投票规则都必须在某条合理性质上让步，而不是否定民主本身。<\/p>\n<\/ol>\n<ol><li>\n（多选）下列属于行为经济学发现的现象是？\n<p>A. 损失厌恶  B. 锚定效应  C. 框架效应  D. 边际效用递减 <strong>答案<\/strong>：A、B、C；<strong>解析<\/strong>：前三项是行为经济学的典型偏差；边际效用递减是传统效用理论的内容，不属于认知偏差。<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆向选择在签约前（选错人），道德风险在签约后（行为变了）；信号与筛选是两种应对。\n<\/li><li>\n中位投票人定理给出多数决策的位置，阿罗定理说明没有完美的投票规则。\n<\/li><li>\n行为经济学的核心是&quot;系统性偏差&quot;，不是&quot;随机犯错&quot;。\n<\/ul>", "c01": "<h1>机会成本与边际分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2、7、13、14 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>做一件事的真实代价，是你为此放弃的<strong>次优选择<\/strong>；而&quot;要不要多做一点&quot;这类问题，看的是<strong>下一单位<\/strong>的收益与成本，不是总量。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两条是整本微观经济学的底层语法。第 2 章把它们列为&quot;像经济学家一样思考&quot;的核心，后面几乎所有决策——企业定产量、消费者买东西、政府定税率——都是同一套算法的变体。<\/p>\n<p>没有机会成本，就算不出真实利润（第 13 章）；没有边际思维，就会在&quot;平均成本低&quot;的地方错误地扩大生产（第 14 章）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[要做一件事] --&gt; B{代价是什么}\n    B --&gt; C[显性支出]\n    B --&gt; D[放弃的次优选择]\n    C --&gt; E[会计成本]\n    D --&gt; F[机会成本]\n    E --&gt; G[会计利润]\n    F --&gt; G2[经济利润]\n    G2 --&gt; H{该不该做}\n    H --&gt; I[边际收益 大于 边际成本 才做]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边分叉出两种&quot;成本&quot;，右边汇合成两种&quot;利润&quot;，最后落到一个判断条件上。整张图就是本章两条原则的关系。<\/p>\n<h2>详解<\/h2>\n<h3>机会成本<\/h3>\n<p>你把 10 万元投进一家小店，账面上没付利息，但如果不投这里，这 10 万元本可以买理财赚 4000 元。这 4000 元就是机会成本，它不体现在账本上，但真实存在。<\/p>\n<p>同理，老板自己的时间也是成本。他本可以去打工挣
